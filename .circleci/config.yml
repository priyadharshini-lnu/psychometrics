version: 2.1 # Use 2.1 to enable using orbs and other features.

parameters:
  rspec_containers:
    type: integer
    default: 4
  rspec_parallel_processors:
    type: integer
    default: 7

executors:
  tte-executor-full:
    docker:
      - &docker_image
        image: talententerprise/tte:ruby-3.4.2-node-18.16.1-lua-5.4
        auth:
          username: $DOCKERHUB_USERNAME
          password: $DOCKERHUB_PASSWORD  # context / project UI env-var reference
      - image: cimg/postgres:14.8
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_test
      - image: cimg/redis:6.2.6
    environment: &environment
      RAILS_ENV: test
      NODE_ENV: test
      REDIS_HOST: localhost
      REDIS_URL: 'redis://localhost:6379/1'
      NODE_OPTIONS: '--max_old_space_size=8192'
      BUNDLER_VERSION: 2.3.17
      PARALLEL_TEST_PROCESSORS: '<< pipeline.parameters.rspec_parallel_processors >>'
      WEB_CONCURRENCY: '1'
      RAILS_MAX_THREADS: '5'
      PARALLEL_TEST_FIRST_IS_1: '1'
      COVERALLS_PARALLEL: 'true'
      THREAD_LOADER_WORKERS: '3'
      TZ: Asia/Dubai

  tte-executor:
    docker:
      - *docker_image
    environment:
      <<: *environment
  tte-executor-deploy:
    docker:
      - *docker_image
    environment:
      RAILS_ENV: production
      NODE_ENV: production
      NODE_OPTIONS: '--max_old_space_size=8192'
      BUNDLER_VERSION: 2.2.31
      DATABASE_URL: "postgres://postgres:postgres@localhost:5432/ci"
      AWS_ACCESS_KEY_ID: 'dummy'
      AWS_REGION: 'dummy'
      AWS_S3_BUCKET: 'dummy'
      AWS_SECRET_ACCESS_KEY: 'dummy'
      S3_COMPATIBLE_STORAGE_ACCESS_KEY_ID: 'dummy'
      S3_COMPATIBLE_STORAGE_SECRET_ACCESS_KEY: 'dummy'
      S3_COMPATIBLE_STORAGE_REGION: 'dummy'
      S3_COMPATIBLE_STORAGE_PUBLIC_BUCKET: 'dummy'
      S3_COMPATIBLE_STORAGE_PRIVATE_BUCKET: 'dummy'
      S3_COMPATIBLE_STORAGE_PROVIDER: 'aws'
      REDIS_HOST: localhost
      REDIS_URL: 'redis://localhost:6379/1'
      DISABLE_COVERAGE: '1'
      THREAD_LOADER_WORKERS: '3'
      HUSKY: '0'

  tte-docker-build:
    machine:
      image: ubuntu-2204:2023.10.1
      docker_layer_caching: true
    environment:
      AWS_DEFAULT_REGION: eu-west-1
      AWS_REGION: eu-west-1

commands:
  bundle_restore:
    parameters:
      audit:
        default: false
        type: boolean
    steps:
      - restore_cache:
          keys:
            - gem-cache-{{ .Environment.CACHE_VERSION }}-{{ arch }}-{{ checksum ".ruby-version" }}-{{ checksum "Gemfile.lock" }}
            - gem-cache-{{ .Environment.CACHE_VERSION }}-{{ arch }}-{{ checksum ".ruby-version" }}
      - run:
          name: Disable Gem Docs
          command: "echo 'gem: --no-document' > ~/.gemrc"
      - run:
          name: Bundle Install
          command: |
            bundle config set --local frozen 'true'
            bundle config set --local path '~/.bundle'
            bundle config set --local without 'development'
            MAKE="make --jobs 2" bundle install -j 2 --retry 3
      - when:
          condition: << parameters.audit >>
          steps:
            - run:
                name: Bundle audit
                command: if [ "$RAILS_ENV" != "production" ]; then DISABLE_COVERAGE=1 bundle exec rake bundle:audit:update; else return 0; fi
  yarn_restore:
    parameters:
      node-env:
        type: string
        default: test
    steps:
      - restore_cache:
          keys:
            - yarn-cache2-{{ .Environment.CACHE_VERSION }}-<< parameters.node-env >>-{{ arch }}-{{ checksum ".node-version" }}-{{ checksum "yarn.lock" }}
      - run:
          name: Yarn
          command: yarn install --pure-lockfile
      - save_cache:
          key: yarn-cache2-{{ .Environment.CACHE_VERSION }}-<< parameters.node-env >>-{{ arch }}-{{ checksum ".node-version" }}-{{ checksum "yarn.lock" }}
          paths:
            - ~/.cache/yarn

  setup_db:
    parameters:
      processes:
        type: integer
        default: 1
    steps:
      - run:
          name: Copy config
          command: |
            cp config/database.yml.sample config/database.yml
            cp config/application.yml.sample  config/application.yml
      - run:
          name: Setup DB
          command: 'PARALLEL_TEST_PROCESSORS=<<parameters.processes>> DISABLE_COVERAGE=1 bundle exec rake parallel:create parallel:load_schema'
  assets_files:
    parameters:
      node-env:
        type: string
        default: test
    steps:
      - run:
          name: Create webpack-files.txt
          command: |
            find ./app/frontend ./.circleci -type f -exec md5sum {} + > webpack-files.txt
            md5sum *.cjs *.ts *.json yarn.lock .eslintrc .node-version >> webpack-files.txt
            find ./app ./spec ./config ./db ./lib ./.circleci  -type f -exec md5sum {} + > rspec-files.txt
            md5sum .ruby-version Gemfile Gemfile.lock >> rspec-files.txt
            sort rspec-files.txt -o rspec-files.txt
      - restore_cache:
          keys:
            - vite-bundles-{{ .Environment.CACHE_VERSION }}-<< parameters.node-env >>-{{ arch }}-{{ checksum "webpack-files.txt" }}
      - restore_cache:
          keys:
            - vite-compile-cache-{{ .Environment.CACHE_VERSION }}-<< parameters.node-env >>-{{ arch }}-{{ .Branch }}-{{ checksum "webpack-files.txt" }}
      - restore_cache:
          keys:
            - rspec-cacheflag-{{ .Environment.CACHE_VERSION }}-{{ arch }}-{{ checksum "rspec-files.txt" }}

  abort_on_assets_files:
    steps:
      - run:
          name: Check if compiled files exist
          command: |
            if [[ ! -d public/vite-test ]]; then
              echo "Compiled files do not exist"
            else
              circleci-agent step halt
            fi
  abort_on_rspec_cache_flag:
    steps:
      - run:
          name: Check if rspec cache flag exists
          command: |
            FILE=~/cachedflags/job.rspec.flag
            if test -f "$FILE"; then
              echo "Rspec cache flag exists"
              circleci-agent step halt
            else
              echo "Rspec cache flag does not exist"
            fi
  restore_assets_compile_cache:
    parameters:
      node-env:
        type: string
        default: test
    steps:
      - restore_cache:
          keys:
            - vite-compile-cache-{{ .Environment.CACHE_VERSION }}-<< parameters.node-env >>-{{ arch }}-{{ .Branch }}-{{ checksum "webpack-files.txt" }}
            - vite-compile-cache-{{ .Environment.CACHE_VERSION }}-<< parameters.node-env >>-{{ arch }}-{{ .Branch }}
            - vite-compile-cache-{{ .Environment.CACHE_VERSION }}-<< parameters.node-env >>-{{ arch }}
  save_assets_cache:
    parameters:
      node-env:
        type: string
        default: test

    steps:
      - save_cache:
          key: vite-bundles-{{ .Environment.CACHE_VERSION }}-<< parameters.node-env >>-{{ arch }}-{{ checksum "webpack-files.txt" }}
          paths:
            - public/vite-test
            - public/vite
            - public/assets
            - node_modules/.vite
      - save_cache:
          key: vite-compile-cache-{{ .Environment.CACHE_VERSION }}-<< parameters.node-env >>-{{ arch }}-{{ .Branch }}-{{ checksum "webpack-files.txt" }}
          paths:
            - tmp/cache/vite
            - tmp/cache/assets/sprockets
  heroku_docker_login:
    steps:
      - run:
          name: Login to heroku
          command: |
            echo $HEROKU_API_KEY | docker login --username=_ --password-stdin registry.heroku.com
  heroku_cli_install:
    steps:
      - node/install:
          node-version: '16.20'
      - run:
          name: Install heroku cli
          command: |
            npm install -g heroku@9.5.1

jobs:
  bundle:
    executor: tte-executor
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Which bundler?
          command: bundle -v
      - bundle_restore:
          audit: true

      - save_cache:
          key: gem-cache-{{ .Environment.CACHE_VERSION }}-{{ arch }}-{{ checksum ".ruby-version" }}-{{ checksum "Gemfile.lock" }}
          paths:
            - ~/.bundle

  brakeman:
    executor: tte-executor
    resource_class: medium
    steps:
      - checkout
      - bundle_restore
      - run:
          name: Brakeman
          command: bundle exec brakeman

  yarn:
    executor: tte-executor
    resource_class: medium
    parameters:
      node-env:
        type: string
        default: test

    steps:
      - checkout
      - yarn_restore

  eslint:
    executor: tte-executor
    resource_class: medium
    steps:
      - checkout
      - assets_files
      - abort_on_assets_files
      - yarn_restore
      - run:
          name: ESLint
          command: yarn run lint

  typescript:
    executor: tte-executor
    steps:
      - checkout
      - assets_files
      - abort_on_assets_files
      - yarn_restore
      - run:
          name: TypeScript
          command: yarn types

  rubocop:
    executor: tte-executor
    resource_class: medium
    environment:
      DATABASE_URL: "postgres://user:pass@localhost/dbname" # dummy db link for rubocop
    steps:
      - checkout
      - restore_cache:
          keys:
            - rubocop-cache-{{ .Environment.CACHE_VERSION }}-{{ arch }}-{{ checksum ".rubocop.yml" }}-{{ .Branch }}
            - rubocop-cache-{{ .Environment.CACHE_VERSION }}-{{ arch }}-{{ checksum ".rubocop.yml" }}
      - bundle_restore
      - run:
          name: Rubocop
          command: |
            (find tmp/rubocop_cache -type f -mtime +15 -delete) || echo "No old cache files to prune"
            bundle exec rubocop --parallel
      - save_cache:
          key: rubocop-cache-{{ .Environment.CACHE_VERSION }}-{{ arch }}-{{ checksum ".rubocop.yml" }}-{{ .Branch }}
          paths:
            - tmp/rubocop_cache

  bundle_assets:
    executor: tte-executor
    resource_class: xlarge
    steps:
      - checkout
      - assets_files
      - abort_on_assets_files
      - bundle_restore
      - yarn_restore
      - restore_assets_compile_cache
      - run:
          name: Precompile Assets
          command: |
            cp config/database.yml.sample config/database.yml
            cp config/application.yml.sample  config/application.yml
            bundle exec rake i18n:js:export
            (find tmp/cache/vite tmp/cache/assets/sprockets -type f -mtime +30 -delete) || echo "No old cache files to prune"
            bundle exec rails assets:precompile
      - save_assets_cache

  vitest:
    executor: tte-executor
    resource_class: xlarge
    parallelism: 2
    steps:
      - checkout
      - assets_files
      - restore_cache:
          keys:
            - vitest-cacheflag-{{ .Environment.CACHE_VERSION }}-{{ arch }}-{{ checksum "webpack-files.txt" }}
      - yarn_restore
      - run:
          name: Check if compiled files exist
          command: |
            FILE=~/cachedflags/job.vitest.flag
            if test -f "$FILE"; then
              yarn run coveralls < coverage/lcov.info
              circleci-agent step halt
            else
              echo "Compiled files do not exist"
            fi
      - bundle_restore
      - restore_cache:
          keys:
            - vitest-cache-{{ .Environment.CACHE_VERSION }}-{{ arch }}-{{ .Branch }}-{{ checksum "webpack-files.txt" }}
            - vitest-cache-{{ .Environment.CACHE_VERSION }}-{{ arch }}-{{ .Branch }}
            - vitest-cache-{{ .Environment.CACHE_VERSION }}-{{ arch }}
      - run:
          name: Vitest
          command: |
            cp config/database.yml.sample config/database.yml
            bundle exec rake i18n:js:export
            (find tmp/cache/vitest -type f -mtime +15 -delete) || echo "No old cache files to prune"
            yarn test --coverage --maxWorkers 7 --minWorkers 5 --shard $((CIRCLE_NODE_INDEX + 1))/$CIRCLE_NODE_TOTAL --max-concurrency=8 && yarn run coveralls < coverage/lcov.info
      - run:
          name: Vitest flag
          command: mkdir -p ~/cachedflags/ && touch ~/cachedflags/job.vitest.flag
      - save_cache:
          key: vitest-cacheflag-{{ .Environment.CACHE_VERSION }}-{{ arch }}-{{ checksum "webpack-files.txt" }}
          paths:
            - ~/cachedflags/job.vitest.flag
            - coverage/lcov.info
      - save_cache:
          key: vitest-cache-{{ .Environment.CACHE_VERSION }}-{{ arch }}-{{ .Branch }}-{{ checksum "webpack-files.txt" }}
          paths:
            - tmp/cache/vitest

  rspec:
    executor: tte-executor-full
    resource_class: xlarge
    parallelism: << pipeline.parameters.rspec_containers >>
    steps:
      - checkout
      - bundle_restore
      - yarn_restore
      - assets_files
      - abort_on_rspec_cache_flag
      - setup_db:
          processes: << pipeline.parameters.rspec_parallel_processors >>
      - run:
          name: RSpec
          command: |
            echo "RSPEC_FAILED=0" >> $BASH_ENV
            source "$BASH_ENV"
            groups=$((CIRCLE_NODE_TOTAL * << pipeline.parameters.rspec_parallel_processors >>))
            seq_start=$((CIRCLE_NODE_INDEX * << pipeline.parameters.rspec_parallel_processors >> + 1))
            seq_end=$((seq_start + << pipeline.parameters.rspec_parallel_processors >> - 1))
            current_groups=$(seq -s, $seq_start $seq_end | sed 's/,$//')
            echo "Running tests in groups: $current_groups"
            bundle exec spring start
            EAGER_LOAD=1 CI_RUN=true bundle exec spring parallel_test spec -t rspec -n $groups --only-group $current_groups  --runtime-log support/parallel_runtime_rspec.log --group-by runtime || echo " RSPEC_FAILED=1" >> $BASH_ENV
            source "$BASH_ENV"
            if [ "$RSPEC_FAILED" -eq 1 ]; then
              echo "Re-running failed tests"
              EAGER_LOAD=1 CI_RUN=true DISABLE_COVERAGE=1 PARALLEL_TEST_PROCESSORS=1 bundle exec spring parallel_test spec -t rspec --runtime-log support/parallel_runtime_rspec.log --test-options '--only-failures'
            fi
      - run:
          name: Save RSpec cacheflag
          command: mkdir -p ~/cachedflags/ && touch ~/cachedflags/job.rspec.flag
      - save_cache:
          key: rspec-cacheflag-{{ .Environment.CACHE_VERSION }}-{{ arch }}-{{ checksum "rspec-files.txt" }}
          paths:
            - ~/cachedflags/job.rspec.flag

  coveralls:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Coveralls Final
          command: curl -k https://coveralls.io/webhook?repo_token=$COVERALLS_REPO_TOKEN -d "payload[build_num]=$CIRCLE_WORKFLOW_ID&payload[status]=done"

  build_docker_image:
    executor: tte-docker-build
    parameters:
      app-name:
        type: string
    steps:
      - checkout
      - when:
          condition:
            or:
              - equal: [ master, << pipeline.git.branch >> ]
          steps:
            - azure-cli/install
            - azure-cli/login-with-user-or-service-principal
            - run:
                name: Login to ACR
                command: az acr login --name lhcontregistry --username $AZURE_SP --password $AZURE_SP_PASSWORD
      - docker/build:
          step-name: Build Docker image - latest
          image: psychometrics
          tag: 'latest-$CIRCLE_BRANCH,$CIRCLE_BRANCH-${CIRCLE_SHA1:0:7}'
          use-buildkit: true
          extra_build_args: '--build-arg BUILDKIT_INLINE_CACHE=1 --build-arg SENTRY_AUTH_TOKEN=$SENTRY_AUTH_TOKEN --build-arg SENTRY_ORG=$SENTRY_ORG --build-arg SENTRY_PROJECT=$SENTRY_PROJECT --build-arg SENTRY_DEBUG=$SENTRY_DEBUG'
          registry: lhcontregistry.azurecr.io
      - aws-cli/setup:
          profile_name: default
      - run: |
          docker create --name temp_container lhcontregistry.azurecr.io/psychometrics:latest-$CIRCLE_BRANCH
          mkdir -p sync
          docker cp temp_container:/app/public/assets sync/assets
          docker cp temp_container:/app/public/vite sync/vite
          docker rm temp_container
          aws s3 cp --recursive sync/assets s3://psychometrics-static-assets/assets
          aws s3 cp --recursive sync/vite s3://psychometrics-static-assets/vite
      - when:
          condition:
            or:
              - equal: [ master, << pipeline.git.branch >> ]
          steps:
            - docker/push:
                step-name: Push Docker image - latest
                image: psychometrics
                tag: 'latest-$CIRCLE_BRANCH,$CIRCLE_BRANCH-${CIRCLE_SHA1:0:7}'
                registry: lhcontregistry.azurecr.io
      - run:
          name: Tag Docker image for heroku
          command: |
            docker tag lhcontregistry.azurecr.io/psychometrics:latest-$CIRCLE_BRANCH registry.heroku.com/<< parameters.app-name >>/web
            docker tag lhcontregistry.azurecr.io/psychometrics:latest-$CIRCLE_BRANCH registry.heroku.com/<< parameters.app-name >>/worker
            docker tag lhcontregistry.azurecr.io/psychometrics:latest-$CIRCLE_BRANCH registry.heroku.com/<< parameters.app-name >>/release
      - heroku_docker_login
      - run:
          name: Push Docker image to heroku
          command: |
            docker push registry.heroku.com/<< parameters.app-name >>/web
            docker push registry.heroku.com/<< parameters.app-name >>/worker
            docker push registry.heroku.com/<< parameters.app-name >>/release
      - when:
          condition:
            or:
              - equal: [ master, << pipeline.git.branch >> ]
          steps:
          - run:
              name: Tag and push docker image for testing
              command: |
                docker tag lhcontregistry.azurecr.io/psychometrics:latest-$CIRCLE_BRANCH registry.heroku.com/tte-lighthouse-testing/web
                docker tag lhcontregistry.azurecr.io/psychometrics:latest-$CIRCLE_BRANCH registry.heroku.com/tte-lighthouse-testing/worker
                docker tag lhcontregistry.azurecr.io/psychometrics:latest-$CIRCLE_BRANCH registry.heroku.com/tte-lighthouse-testing/release
                docker push registry.heroku.com/tte-lighthouse-testing/web
                docker push registry.heroku.com/tte-lighthouse-testing/worker
                docker push registry.heroku.com/tte-lighthouse-testing/release

  heroku_release:
    executor: heroku/default
    parameters:
      app-name:
        type: string
    steps:
      - heroku_cli_install
      - heroku_docker_login
      - run:
          name: Release to heroku
          command: |
            heroku container:release web worker release -a << parameters.app-name >>
      - when:
          condition:
            or:
              - equal: [ master, << pipeline.git.branch >> ]
          steps:
          - run:
              name: Release heroku testing
              command: |
                heroku container:release web worker release -a tte-lighthouse-testing
  heroku_release_production:
    executor: tte-docker-build
    parameters:
      source-app-name:
        type: string
      target-app-name:
        type: string
    steps:
      - heroku_cli_install
      - heroku_docker_login
      - run:
          name: Release to heroku
          command: |
            docker pull registry.heroku.com/<< parameters.source-app-name >>/web
            docker pull registry.heroku.com/<< parameters.source-app-name >>/worker
            docker pull registry.heroku.com/<< parameters.source-app-name >>/release
            docker tag registry.heroku.com/<< parameters.source-app-name >>/web registry.heroku.com/<< parameters.target-app-name >>/web
            docker tag registry.heroku.com/<< parameters.source-app-name >>/worker registry.heroku.com/<< parameters.target-app-name >>/worker
            docker tag registry.heroku.com/<< parameters.source-app-name >>/release registry.heroku.com/<< parameters.target-app-name >>/release
            docker push registry.heroku.com/<< parameters.target-app-name >>/web
            docker push registry.heroku.com/<< parameters.target-app-name >>/worker
            docker push registry.heroku.com/<< parameters.target-app-name >>/release
            heroku container:release web worker release -a << parameters.target-app-name >>
  oci_oke_deploy:
    docker:
      - image: cimg/base:stable
    parameters:
      release-name:
        type: string
      values-file:
        type: string
      values-env-file:
        type: string
      chart-folder:
        type: string
      namespace:
        type: string
        default: default
    steps:
      - checkout
      - kubernetes/install_kubectl
      - kubernetes/install_kubeconfig
      - helm/install_helm_client
      - run:
          name: Run helm install
          working_directory: << parameters.chart-folder >>
          command: |
            helm upgrade --install << parameters.release-name >> . \
            -n << parameters.namespace >> \
            --values << parameters.values-file >> --values << parameters.values-env-file >> \
            --set image.tag=$CIRCLE_BRANCH-${CIRCLE_SHA1:0:7}
  azure_aks_deploy:
    docker:
      - image: cimg/base:stable
    parameters:
      release-name:
        type: string
      values-file:
        type: string
      values-env-file:
        type: string
      chart-folder:
        type: string
      namespace:
        type: string
        default: default
    steps:
      - checkout
      - kubernetes/install_kubectl
      - helm/install_helm_client
      - azure-cli/install
      - azure-cli/login-with-user-or-service-principal
      - run:
          name: Get aks credentials
          command: |
            az aks get-credentials --name lhProdAKSCluster --resource-group lhProdResGroup
      - run:
          name: Run helm install
          working_directory: << parameters.chart-folder >>
          command: |
            helm upgrade --install << parameters.release-name >> . \
            -n << parameters.namespace >> \
            --values << parameters.values-file >> --values << parameters.values-env-file >> \
            --set image.tag=$CIRCLE_BRANCH-${CIRCLE_SHA1:0:7}

  other_checks:
    executor: tte-executor-full
    resource_class: medium
    steps:
      - checkout
      - bundle_restore
      - setup_db:
          processes: 1
      - run:
          name: Check for unused translation keys
          command: |
            bundle exec i18n-tasks unused
      - run:
          name: Zeitwerk check
          command: |
            bundle exec rake zeitwerk:check

orbs:
  aws-cli: circleci/aws-cli@4.1.2
  heroku: circleci/heroku@2.0.0
  azure-cli: circleci/azure-cli@1.2.2
  docker: circleci/docker@2.4.0
  jira: circleci/jira@1.3.1
  node: circleci/node@7.0.0
  kubernetes: circleci/kubernetes@2.0.0
  helm: circleci/helm@3.1.0

# We use workflows to orchestrate the jobs that we declared above.
workflows:
  build_and_test:
    jobs:
      - bundle
      - yarn
      - eslint:
          requires:
            - yarn
      - typescript:
          requires:
            - yarn
      - brakeman:
          requires:
            - bundle
      - rubocop:
          requires:
            - bundle
      - bundle_assets:
          requires:
            - yarn
            - bundle
      - vitest:
          requires:
            - bundle_assets
            - rubocop
            - brakeman
            - eslint
            - typescript
      - other_checks:
          requires:
            - bundle_assets
      - rspec:
          requires:
            - bundle_assets
            - rubocop
            - brakeman
            - eslint
            - typescript
      - coveralls:
          requires:
            - vitest
            - rspec
      - build_docker_image:
          name: build_image_develop
          app-name: tte-lighthouse-develop
          filters:
            branches:
              only:
                - develop
                - 1171475-ruby-upgrade
      - heroku_release:
          name: heroku_release_develop
          app-name: tte-lighthouse-develop
          requires:
            - build_image_develop
            - vitest
            - rspec
          filters:
            branches:
              only:
                - develop
      - build_docker_image:
          name: build_image_review
          app-name: tte-lighthouse-review
          filters:
            branches:
              only:
                - review
      - heroku_release:
          name: heroku_release_review
          app-name: tte-lighthouse-review
          requires:
            - build_image_review
            - vitest
            - rspec
          filters:
            branches:
              only:
                - review
      - build_docker_image:
          name: build_image_staging
          app-name: tte-lighthouse-staging
          filters:
            branches:
              only:
                - master
      - heroku_release:
          name: heroku_release_staging
          app-name: tte-lighthouse-staging
          requires:
            - build_image_staging
            - vitest
            - rspec
          filters:
            branches:
              only:
                - master
      - hold:
