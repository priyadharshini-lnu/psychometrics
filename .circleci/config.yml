version: 2.1 # Use 2.1 to enable using orbs and other features.

executors:
  tte-executor-full:
    docker:
      - &docker_image
        image: talententerprise/tte:ruby-3.1.2-node-18.16.1-lua-5.1
        auth:
          username: $DOCKERHUB_USERNAME
          password: $DOCKERHUB_PASSWORD  # context / project UI env-var reference
      - image: cimg/postgres:14.8
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_test
      - image: cimg/redis:6.2.6
    environment: &environment
      RAILS_ENV: test
      NODE_ENV: test
      REDIS_HOST: localhost
      REDIS_URL: 'redis://localhost:6379/1'
      NODE_OPTIONS: '--max_old_space_size=7168'
      BUNDLER_VERSION: 2.3.17
      PARALLEL_TEST_PROCESSORS: '7'
      WEB_CONCURRENCY: '1'
      RAILS_MAX_THREADS: '5'
      PARALLEL_TEST_FIRST_IS_1: '1'
      COVERALLS_PARALLEL: 'true'
      THREAD_LOADER_WORKERS: '3'
      TZ: Asia/Dubai

  tte-executor:
    docker:
      - *docker_image
    environment:
      <<: *environment
  tte-executor-deploy:
    docker:
      - *docker_image
    environment:
      RAILS_ENV: production
      NODE_ENV: production
      NODE_OPTIONS: '--max_old_space_size=8192'
      BUNDLER_VERSION: 2.2.31
      DATABASE_URL: "postgres://postgres:postgres@localhost:5432/ci"
      AWS_ACCESS_KEY_ID: 'dummy'
      AWS_REGION: 'dummy'
      AWS_S3_BUCKET: 'dummy'
      AWS_SECRET_ACCESS_KEY: 'dummy'
      S3_COMPATIBLE_STORAGE_ACCESS_KEY_ID: 'dummy'
      S3_COMPATIBLE_STORAGE_SECRET_ACCESS_KEY: 'dummy'
      S3_COMPATIBLE_STORAGE_REGION: 'dummy'
      S3_COMPATIBLE_STORAGE_PUBLIC_BUCKET: 'dummy'
      S3_COMPATIBLE_STORAGE_PRIVATE_BUCKET: 'dummy'
      S3_COMPATIBLE_STORAGE_PROVIDER: 'aws'
      REDIS_HOST: localhost
      REDIS_URL: 'redis://localhost:6379/1'
      DISABLE_COVERAGE: '1'
      THREAD_LOADER_WORKERS: '3'
      HUSKY: '0'

  tte-docker-build:
    machine:
      image: ubuntu-2204:2023.10.1
      docker_layer_caching: true
    environment:
      AWS_DEFAULT_REGION: eu-west-1
      AWS_REGION: eu-west-1

commands:
  bundle_restore:
    parameters:
      audit:
        default: false
        type: boolean
    steps:
      - restore_cache:
          keys:
            - gem-cache-{{ .Environment.CACHE_VERSION }}-{{ arch }}-{{ checksum ".ruby-version" }}-{{ checksum "Gemfile.lock" }}
            - gem-cache-{{ .Environment.CACHE_VERSION }}-{{ arch }}-{{ checksum ".ruby-version" }}
      - run:
          name: Disable Gem Docs
          command: "echo 'gem: --no-document' > ~/.gemrc"
      - run:
          name: Bundle Install
          command: |
            bundle config set --local frozen 'true'
            bundle config set --local path '~/.bundle'
            bundle config set --local without 'development'
            MAKE="make --jobs 2" bundle install -j 2 --retry 3
      - when:
          condition: << parameters.audit >>
          steps:
            - run:
                name: Bundle audit
                command: if [ "$RAILS_ENV" != "production" ]; then DISABLE_COVERAGE=1 bundle exec rake bundle:audit:update; else return 0; fi
  yarn_restore:
    parameters:
      node-env:
        type: string
        default: test
    steps:
      - restore_cache:
          keys:
            - yarn-cache-{{ .Environment.CACHE_VERSION }}-<< parameters.node-env >>-{{ arch }}-{{ checksum ".node-version" }}-{{ checksum "yarn.lock" }}
      - run:
          name: Yarn
          command: yarn install --pure-lockfile
      - save_cache:
          key: yarn-cache-{{ .Environment.CACHE_VERSION }}-<< parameters.node-env >>-{{ arch }}-{{ checksum ".node-version" }}-{{ checksum "yarn.lock" }}
          paths:
            - node_modules

  setup_db:
    parameters:
      processes:
        type: integer
        default: 1
    steps:
      - run:
          name: Copy config
          command: |
            cp config/database.yml.sample config/database.yml
            cp config/application.yml.sample  config/application.yml
      - run:
          name: Setup DB
          command: 'PARALLEL_TEST_PROCESSORS=<<parameters.processes>> DISABLE_COVERAGE=1 bundle exec rake parallel:create parallel:load_schema'
  assets_files:
    parameters:
      node-env:
        type: string
        default: test
    steps:
      - run:
          name: Create webpack-files.txt
          command: |
            find ./app/frontend ./.circleci -type f -exec md5sum {} + > webpack-files.txt
            md5sum *.cjs *.ts *.json yarn.lock .eslintrc .node-version >> webpack-files.txt
      - restore_cache:
          keys:
            - vite-bundles-{{ .Environment.CACHE_VERSION }}-<< parameters.node-env >>-{{ arch }}-{{ checksum "webpack-files.txt" }}
      - restore_cache:
          keys:
            - vite-compile-cache-{{ .Environment.CACHE_VERSION }}-<< parameters.node-env >>-{{ arch }}-{{ .Branch }}-{{ checksum "webpack-files.txt" }}

  abort_on_assets_files:
    steps:
      - run:
          name: Check if compiled files exist
          command: |
            if [[ ! -d public/vite-test ]]; then
              echo "Compiled files do not exist"
            else
              circleci-agent step halt
            fi
  restore_assets_compile_cache:
    parameters:
      node-env:
        type: string
        default: test
    steps:
      - restore_cache:
          keys:
            - vite-compile-cache-{{ .Environment.CACHE_VERSION }}-<< parameters.node-env >>-{{ arch }}-{{ .Branch }}-{{ checksum "webpack-files.txt" }}
            - vite-compile-cache-{{ .Environment.CACHE_VERSION }}-<< parameters.node-env >>-{{ arch }}-{{ .Branch }}
            - vite-compile-cache-{{ .Environment.CACHE_VERSION }}-<< parameters.node-env >>-{{ arch }}
  save_assets_cache:
    parameters:
      node-env:
        type: string
        default: test

    steps:
      - save_cache:
          key: vite-bundles-{{ .Environment.CACHE_VERSION }}-<< parameters.node-env >>-{{ arch }}-{{ checksum "webpack-files.txt" }}
          paths:
            - public/vite-test
            - public/vite
            - public/assets
      - save_cache:
          key: vite-compile-cache-{{ .Environment.CACHE_VERSION }}-<< parameters.node-env >>-{{ arch }}-{{ .Branch }}-{{ checksum "webpack-files.txt" }}
          paths:
            - tmp/cache/vite
            - tmp/cache/assets/sprockets
  heroku_docker_login:
    steps:
      - run:
          name: Login to heroku
          command: |
            echo $HEROKU_API_KEY | docker login --username=_ --password-stdin registry.heroku.com


jobs:
  bundle:
    executor: tte-executor
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Which bundler?
          command: bundle -v
      - bundle_restore:
          audit: true

      - save_cache:
          key: gem-cache-{{ .Environment.CACHE_VERSION }}-{{ arch }}-{{ checksum ".ruby-version" }}-{{ checksum "Gemfile.lock" }}
          paths:
            - ~/.bundle

  brakeman:
    executor: tte-executor
    resource_class: medium
    steps:
      - checkout
      - bundle_restore
      - run:
          name: Brakeman
          command: bundle exec brakeman

  yarn:
    executor: tte-executor
    resource_class: medium
    parameters:
      node-env:
        type: string
        default: test

    steps:
      - checkout
      - yarn_restore

  eslint:
    executor: tte-executor
    resource_class: medium
    steps:
      - checkout
      - assets_files
      - abort_on_assets_files
      - yarn_restore
      - run:
          name: ESLint
          command: yarn run lint

  typescript:
    executor: tte-executor
    steps:
      - checkout
      - assets_files
      - abort_on_assets_files
      - yarn_restore
      - run:
          name: TypeScript
          command: yarn types

  rubocop:
    executor: tte-executor
    resource_class: medium
    steps:
      - checkout
      - restore_cache:
          keys:
            - rubocop-cache-{{ .Environment.CACHE_VERSION }}-{{ arch }}-{{ checksum ".rubocop.yml" }}-{{ .Branch }}
            - rubocop-cache-{{ .Environment.CACHE_VERSION }}-{{ arch }}-{{ checksum ".rubocop.yml" }}
      - bundle_restore
      - run:
          name: Rubocop
          command: |
            (find tmp/rubocop_cache -type f -mtime +30 -delete) || echo "No old cache files to prune"
            bundle exec rubocop --parallel
      - save_cache:
          key: rubocop-cache-{{ .Environment.CACHE_VERSION }}-{{ arch }}-{{ checksum ".rubocop.yml" }}-{{ .Branch }}
          paths:
            - tmp/rubocop_cache

  bundle_assets:
    executor: tte-executor
    resource_class: xlarge
    steps:
      - checkout
      - assets_files
      - abort_on_assets_files
      - bundle_restore
      - yarn_restore
      - restore_assets_compile_cache
      - run:
          name: Precompile Assets
          command: |
            cp config/database.yml.sample config/database.yml
            cp config/application.yml.sample  config/application.yml
            (find tmp/cache/vite tmp/cache/assets/sprockets -type f -mtime +30 -delete) || echo "No old cache files to prune"
            bundle exec rails assets:precompile
      - save_assets_cache

  jest:
    executor: tte-executor
    resource_class: large
    steps:
      - checkout
      - assets_files
      - restore_cache:
          keys:
            - jest-cacheflag-{{ .Environment.CACHE_VERSION }}-{{ arch }}-{{ checksum "webpack-files.txt" }}
      - yarn_restore
      - run:
          name: Check if compiled files exist
          command: |
            FILE=~/cachedflags/job.jest.flag
            if test -f "$FILE"; then
              yarn run coveralls < coverage/lcov.info
              circleci-agent step halt
            else
              echo "Compiled files do not exist"
            fi
      - bundle_restore
      - restore_cache:
          keys:
            - jest-cache-{{ .Environment.CACHE_VERSION }}-{{ arch }}-{{ .Branch }}-{{ checksum "webpack-files.txt" }}
            - jest-cache-{{ .Environment.CACHE_VERSION }}-{{ arch }}-{{ .Branch }}
            - jest-cache-{{ .Environment.CACHE_VERSION }}-{{ arch }}
      - run:
          name: Jest
          command: |
            cp config/database.yml.sample config/database.yml
            bundle exec rake i18n:js:export
            (find tmp/cache/jest -type f -mtime +30 -delete) || echo "No old cache files to prune"
            yarn test --coverage --detectOpenHandles -w 2 && yarn run coveralls < coverage/lcov.info
      - run:
          name: Jest flag
          command: mkdir -p ~/cachedflags/ && touch ~/cachedflags/job.jest.flag
      - save_cache:
          key: jest-cacheflag-{{ .Environment.CACHE_VERSION }}-{{ arch }}-{{ checksum "webpack-files.txt" }}
          paths:
            - ~/cachedflags/job.jest.flag
            - coverage/lcov.info
      - save_cache:
          key: jest-cache-{{ .Environment.CACHE_VERSION }}-{{ arch }}-{{ .Branch }}-{{ checksum "webpack-files.txt" }}
          paths:
            - tmp/cache/jest

  rspec:
    executor: tte-executor-full
    resource_class: xlarge
    steps:
      - checkout
      - bundle_restore
      - yarn_restore
      - assets_files
      - setup_db:
          processes: 7
      - run:
          name: Zeitwerk check
          command: bundle exec rake zeitwerk:check
      - run:
          name: RSpec
          command: |
            EAGER_LOAD=1 bundle exec parallel_test spec -t rspec --runtime-log support/parallel_runtime_rspec.log
      - store_artifacts:
          path: /home/circleci/project/tmp/capybara
  coveralls:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Coveralls Final
          command: curl -k https://coveralls.io/webhook?repo_token=$COVERALLS_REPO_TOKEN -d "payload[build_num]=$CIRCLE_WORKFLOW_ID&payload[status]=done"

  heroku_deploy:
    executor: tte-executor-deploy
    resource_class: xlarge
    parameters:
      app-name:
        type: string
      asset-host:
        type: string
        default: ""
    steps:
      - checkout
      - bundle_restore
      - yarn_restore:
          node-env: production
      - assets_files:
          node-env: production
      - restore_assets_compile_cache:
          node-env: production
      - run:
          name: Export I18n
          command: bundle exec rake i18n:js:export
      - run:
          name: Assets precompile
          no_output_timeout: 15m
          command: |
            if [ -n "<< parameters.asset-host >>" ]; then
              ASSET_HOST=<< parameters.asset-host >> bundle exec rails assets:precompile
            else
              bundle exec rails assets:precompile
            fi
      - save_assets_cache:
          node-env: production
      - run:
          name: Commit assets
          command: |
            cp config/database.yml.sample config/database.yml
            git config --global user.email "shuja@shabandri.com"
            git config --global user.name "Shuja Shabandri"
            git config http.postBuffer 524288000
            git add -f public/vite
            git add -f public/assets
            git add -f config/database.yml
            git commit -m "ci compiled assets" --no-verify
      - heroku/install
      - heroku/deploy-via-git:
          force: true
          app-name: << parameters.app-name >>
      - run:
          name: Check if deployment is successful
          command: |
            result=$(heroku releases -n 1 -a << parameters.app-name >>)
            echo $result
            if [[ $result == *"failed"* ]]; then
                echo "Deployment failed"
                exit 1
            fi

  build_docker_image:
    executor: tte-docker-build
    parameters:
      app-name:
        type: string
    steps:
      - checkout
      - when:
          condition:
            equal: [ master, << pipeline.git.branch >> ]
          steps:
            - azure-cli/install
            - azure-cli/login-with-user-or-service-principal
            - azure-acr/acr-login:
                registry-name: lhcontregistry
                configure-docker-credentials-store: true
      - docker/build:
          step-name: Build Docker image - latest
          image: psychometrics
          tag: 'latest-$CIRCLE_BRANCH,$CIRCLE_BRANCH-$CIRCLE_BUILD_NUM'
          use-buildkit: true
          extra_build_args: '--build-arg BUILDKIT_INLINE_CACHE=1'
          registry: lhcontregistry.azurecr.io
      - aws-cli/setup:
          profile_name: default
      - run: |
          docker create --name temp_container lhcontregistry.azurecr.io/psychometrics:latest-$CIRCLE_BRANCH
          mkdir -p sync
          docker cp temp_container:/app/public/assets sync/assets
          docker cp temp_container:/app/public/vite sync/vite
          docker rm temp_container
          aws s3 cp --recursive sync/assets s3://psychometrics-static-assets/assets
          aws s3 cp --recursive sync/vite s3://psychometrics-static-assets/vite
      - when:
          condition:
            equal: [ master, << pipeline.git.branch >> ]
          steps:
            - docker/push:
                step-name: Push Docker image - latest
                image: psychometrics
                tag: 'latest-$CIRCLE_BRANCH,$CIRCLE_BRANCH-$CIRCLE_BUILD_NUM'
                registry: lhcontregistry.azurecr.io
      - run:
          name: Tag Docker image for heroku
          command: |
            docker tag lhcontregistry.azurecr.io/psychometrics:latest-$CIRCLE_BRANCH registry.heroku.com/<< parameters.app-name >>/web
            docker tag lhcontregistry.azurecr.io/psychometrics:latest-$CIRCLE_BRANCH registry.heroku.com/<< parameters.app-name >>/worker
            docker tag lhcontregistry.azurecr.io/psychometrics:latest-$CIRCLE_BRANCH registry.heroku.com/<< parameters.app-name >>/release
      - heroku_docker_login
      - run:
          name: Push Docker image to heroku
          command: |
            docker push registry.heroku.com/<< parameters.app-name >>/web
            docker push registry.heroku.com/<< parameters.app-name >>/worker
            docker push registry.heroku.com/<< parameters.app-name >>/release
  heroku_release:
    executor: heroku/default
    parameters:
      app-name:
        type: string
    steps:
      - heroku/install
      - heroku_docker_login
      - run:
          name: Release to heroku
          command: |
            heroku container:release web worker release -a << parameters.app-name >>
  heroku_release_production:
    executor: tte-docker-build
    parameters:
      source-app-name:
        type: string
      target-app-name:
        type: string
    steps:
      - heroku/install
      - heroku_docker_login
      - run:
          name: Release to heroku
          command: |
            docker pull registry.heroku.com/<< parameters.source-app-name >>/web
            docker pull registry.heroku.com/<< parameters.source-app-name >>/worker
            docker pull registry.heroku.com/<< parameters.source-app-name >>/release
            docker tag registry.heroku.com/<< parameters.source-app-name >>/web registry.heroku.com/<< parameters.target-app-name >>/web
            docker tag registry.heroku.com/<< parameters.source-app-name >>/worker registry.heroku.com/<< parameters.target-app-name >>/worker
            docker tag registry.heroku.com/<< parameters.source-app-name >>/release registry.heroku.com/<< parameters.target-app-name >>/release
            docker push registry.heroku.com/<< parameters.target-app-name >>/web
            docker push registry.heroku.com/<< parameters.target-app-name >>/worker
            docker push registry.heroku.com/<< parameters.target-app-name >>/release
            heroku container:release web worker release -a << parameters.target-app-name >>


orbs:
  aws-cli: circleci/aws-cli@4.1.2
  heroku: circleci/heroku@2.0.0
  azure-acr: circleci/azure-acr@0.2.1
  azure-cli: circleci/azure-cli@1.2.2
  docker: circleci/docker@2.4.0
  jira: circleci/jira@1.3.1

# We use workflows to orchestrate the jobs that we declared above.
workflows:
  build_and_test:
    jobs:
      - bundle
      - yarn
      - eslint:
          requires:
            - yarn
      - typescript:
          requires:
            - yarn
      - brakeman:
          requires:
            - bundle
      - rubocop:
          requires:
            - bundle
      - bundle_assets:
          requires:
            - rubocop
            - brakeman
            - eslint
            - typescript
      - jest:
          requires:
            - bundle_assets
      - rspec:
          requires:
            - bundle_assets
      - coveralls:
          requires:
            - jest
            - rspec
      - build_docker_image:
          name: build_image_develop
          app-name: tte-lighthouse-develop
          filters:
            branches:
              only:
                - develop
      - heroku_release:
          name: heroku_release_develop
          app-name: tte-lighthouse-develop
          requires:
            - build_image_develop
            - jest
            - rspec
          filters:
            branches:
              only:
                - develop
      - build_docker_image:
          name: build_image_review
          app-name: tte-lighthouse
          filters:
            branches:
              only:
                - review
      - heroku_release:
          name: heroku_release_review
          app-name: tte-lighthouse
          requires:
            - build_image_review
            - jest
            - rspec
          filters:
            branches:
              only:
                - review
      - build_docker_image:
          name: build_image_staging
          app-name: tte-lighthouse-staging
          filters:
            branches:
              only:
                - master
      - heroku_release:
          name: heroku_release_staging
          app-name: tte-lighthouse-staging
          requires:
            - build_image_staging
            - jest
            - rspec
          filters:
            branches:
              only:
                - master
      - hold:
          name: approve_production
          type: approval
          requires:
            - heroku_release_staging
      - heroku_release_production:
          name: heroku_release_production
          source-app-name: tte-lighthouse-staging
          target-app-name: tte-lighthouse-prod
          requires:
            - approve_production
