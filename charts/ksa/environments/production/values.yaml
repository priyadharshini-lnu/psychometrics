# Default values for lighthouse
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
# Overrides the image tag whose default is the chart appVersion.
image:
  repository: lhcontregistry.azurecr.io/psychometrics
  tag: 'replaceme'
  pullPolicy: IfNotPresent

web:
  replica: 12
worker:
  replica: 2

domain: tte-lighthouse-sa.com

services:
  name: lhksa-prod
  internlPort: 3030
  targetPort: 3030
  type: NodePort
  annotations: {}

imagePullSecrets:
  - name: pullsecret
nameOverride: "prod"
fullnameOverride: ""

rollme:
  enabled: true

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

oracle:
  region: me-jeddah-1
  vaultOcid: ocid1.vault.oc1.me-jeddah-1.fvuacdtkaabmy.abvgkljrn7omcwsytz3n7kdnbojkbglr3ptkxayzz73jmt2rqhq4rovm3lqq
  compartmentOcid: ocid1.compartment.oc1..aaaaaaaacgkfxlxkyumyg5ru6b4myedezkuylycu2n2pwewvsidxqfltluiq
  masterEncryptionKeyOcid: ocid1.key.oc1.me-jeddah-1.fvuacdtkaabmy.abvgkljr4rovrcvxenf5yn4e57nxj4tdxczlwjdk5ws55ytbf2d4jjjaq2ia

podAnnotations: {}

podSecurityContext: {}

service:
  type: ClusterIP
  port: 80

objectStorageProxy:
  enabled: false
  vHost: "axkwa67qeaun.compat.objectstorage.me-jeddah-1.oraclecloud.com"
  ingress:
    tls:
      - secretName: wildcard-cert-tls-prod
        hosts:
          - "object-storage.tte-lighthouse-sa.com"
    hosts:
      - host: "object-storage.tte-lighthouse-sa.com"
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lhksa-prod-obj-st-rp
                port:
                  number: 443


cert-manager:
  installCRDs: true
issuer:
  enabled: false
certificate:
  name: wildcard-cert-tls-prod
  issuerName: letsencrypt-prod-wildcard
  secretName: wildcard-cert-tls-prod


httpIngress:
  enabled: true
  annotations:
    oci-native-ingress.oraclecloud.com/http-listener-port: "80"
    oci-native-ingress.oraclecloud.com/healthcheck-protocol: "HTTP"
    oci-native-ingress.oraclecloud.com/healthcheck-port: "0"
    oci-native-ingress.oraclecloud.com/healthcheck-path: "/up"
    oci-native-ingress.oraclecloud.com/healthcheck-return-code: "200"
    oci-native-ingress.oraclecloud.com/healthcheck-force-plaintext: "true"

ingress:
  enabled: true
  host: "tte-lighthouse-sa.com"
  className: "oci-ic-lhksa"
  annotations:
    oci-native-ingress.oraclecloud.com/https-listener-port: "443"
    oci-native-ingress.oraclecloud.com/backend-tls-enabled: "false"
    oci-native-ingress.oraclecloud.com/healthcheck-protocol: "HTTP"
    oci-native-ingress.oraclecloud.com/healthcheck-port: "0"
    oci-native-ingress.oraclecloud.com/healthcheck-path: "/up"
    oci-native-ingress.oraclecloud.com/healthcheck-return-code: "200"
    oci-native-ingress.oraclecloud.com/healthcheck-force-plaintext: "true"
    oci-native-ingress.oraclecloud.com/protocol: "HTTP2"
  tls:
    - secretName: lhksa-wildcard-tls
      hosts:
        - "tte-lighthouse-sa.com"
        - "*.tte-lighthouse-sa.com"
  hosts:
    - host: "*.tte-lighthouse-sa.com"
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: lhksa-prod
              port:
                number: 3030
    - host: "tte-lighthouse-sa.com"
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: lhksa-prod
              port:
                number: 3030

resources:
  web:
    limits:
      # cpu: 100m
      memory: 6.6G
    requests:
      # cpu: 100m
      memory: 6G
  worker:
    limits:
      # cpu: 100m
      memory: 3G
    requests:
      # cpu: 100m
      memory: 2G

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Provide affinity for hooks if needed
hooks:
  affinity: {}
  migrate:
    env: []
    resources:
      limits:
        memory: 3000Mi
      requests:
        memory: 2000Mi
    # Defaults to performing the DB migration job after the install/upgrade.
    # Can be overridden to "pre-install,pre-upgrade" with caution to perform migrations that are sometimes required for the deployment to become healthy
    hookAnnotation: "post-install,post-upgrade"

# ENVIRONMENT VARIABLES
env: {}
