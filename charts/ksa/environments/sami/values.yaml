# Default values for lighthouse
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
# Overrides the image tag whose default is the chart appVersion.
image:
  repository: lhcontregistry.azurecr.io/psychometrics
  tag: 'replaceme'
  pullPolicy: IfNotPresent

web:
  replica: 2
worker:
  replica: 1

domain: sami-talent.com

services:
  name: sami-prod
  internlPort: 3030
  targetPort: 3030
  type: NodePort
  annotations: {}

imagePullSecrets:
  - name: pullsecret
nameOverride: "prod"
fullnameOverride: ""

rollme:
  enabled: true

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

oracle:
  region: me-jeddah-1
  vaultOcid: ocid1.vault.oc1.me-jeddah-1.fvuacghaaagpk.abvgkljrqukfvayneqj4r4fnxzwl5b2zexj7o65ecaufp4rjep7uf3jrox5a
  compartmentOcid: ocid1.compartment.oc1..aaaaaaaacgkfxlxkyumyg5ru6b4myedezkuylycu2n2pwewvsidxqfltluiq
  masterEncryptionKeyOcid: ocid1.key.oc1.me-jeddah-1.fvuacghaaagpk.abvgkljrs7fcpdfvpknxy2hnmujfh745fgc5to4cbun2yglxii5kfbu5tepa

podAnnotations: {}

podSecurityContext: {}

service:
  type: ClusterIP
  port: 80

objectStorageProxy:
  enabled: false
  vHost: "axkwa67qeaun.compat.objectstorage.me-jeddah-1.oraclecloud.com"
  ingress:
    tls:
      - secretName: wildcard-cert-tls-prod
        hosts:
          - "object-storage.sami-talent.com"
    hosts:
      - host: "object-storage.sami-talent.com"
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sami-prod-obj-st-rp
                port:
                  number: 443


cert-manager:
  installCRDs: true
issuer:
  enabled: true
  email: "shuja.shabandri@mercer.com"
  prod:
    name: issuer-prod-sami-wildcard
    privateKeySecretName: secret-key-prod-sami-wildcard
  staging:
    name: issuer-staging-sami-wildcard
    privateKeySecretName: secret-key-staging-sami-wildcard
  route53:
    hostedZoneID: "Z03172401FVU9AXKWVM3B"
    accessKeyId: "AKIAY4N25ED6PXSHHKNU"
certificate:
  name: wildcard-cert-tls-prod
  issuerName: issuer-prod-sami-wildcard
  secretName: wildcard-cert-tls-prod


httpIngress:
  enabled: true
  annotations:
    oci-native-ingress.oraclecloud.com/http-listener-port: "80"
    oci-native-ingress.oraclecloud.com/healthcheck-protocol: "HTTP"
    oci-native-ingress.oraclecloud.com/healthcheck-port: "0"
    oci-native-ingress.oraclecloud.com/healthcheck-path: "/up"
    oci-native-ingress.oraclecloud.com/healthcheck-return-code: "200"
    oci-native-ingress.oraclecloud.com/healthcheck-force-plaintext: "true"

ingress:
  enabled: true
  host: "sami-talent.com"
  className: "oci-ic-sami"
  annotations:
    oci-native-ingress.oraclecloud.com/https-listener-port: "443"
    oci-native-ingress.oraclecloud.com/backend-tls-enabled: "false"
    oci-native-ingress.oraclecloud.com/healthcheck-protocol: "HTTP"
    oci-native-ingress.oraclecloud.com/healthcheck-port: "0"
    oci-native-ingress.oraclecloud.com/healthcheck-path: "/up"
    oci-native-ingress.oraclecloud.com/healthcheck-return-code: "200"
    oci-native-ingress.oraclecloud.com/healthcheck-force-plaintext: "true"
    oci-native-ingress.oraclecloud.com/protocol: "HTTP2"
  tls:
    - secretName: sami-wildcard-tls
      hosts:
        - "sami-talent.com"
        - "*.sami-talent.com"
  hosts:
    - host: "*.sami-talent.com"
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: sami-prod
              port:
                number: 3030
    - host: "sami-talent.com"
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: sami-prod
              port:
                number: 3030

resources:
  web:
    limits:
      # cpu: 100m
      memory: 6.6G
    requests:
      # cpu: 100m
      memory: 6G
  worker:
    limits:
      # cpu: 100m
      memory: 3G
    requests:
      # cpu: 100m
      memory: 2G


autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Provide affinity for hooks if needed
hooks:
  affinity: {}
  migrate:
    env: []
    resources:
      limits:
        memory: 3000Mi
      requests:
        memory: 2000Mi
    # Defaults to performing the DB migration job after the install/upgrade.
    # Can be overridden to "pre-install,pre-upgrade" with caution to perform migrations that are sometimes required for the deployment to become healthy
    hookAnnotation: "post-install,post-upgrade"

# ENVIRONMENT VARIABLES
env: {}

