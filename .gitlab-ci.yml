image: registry.gitlab.com/tte-lighthouse/psychometrics

services:
  - postgres:latest
  - redis:latest

stages:
  - test
  - deploy

cache:
  key: psychometrics-cache-key
  paths:
  - vendor/
  - node_modules/

before_script:
  # install ssh-agent
  - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
  # run ssh-agent
  - eval $(ssh-agent -s)
  # add ssh key stored in SSH_PRIVATE_KEY variable to the agent store
  - ssh-add <(echo "$SSH_PRIVATE_KEY")
  # disable host key checking (NOTE: makes you susceptible to man-in-the-middle attacks)
  # WARNING: use only in docker container, if you use it with shell you will overwrite your user's ssh config
  - mkdir -p ~/.ssh
  - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  - ssh-keyscan 'github.com' >> ~/.ssh/known_hosts
  - ssh-keyscan 'gitlab.com' >> ~/.ssh/known_hosts
  - export RAILS_ENV=test
  - export REDIS_HOST=redis
  - bundle install -j $(nproc) --path vendor  --without development # Install dependencies into ./vendor/ruby
  - sudo apt update && sudo apt install postgresql-client
  - sudo curl --output /usr/local/bin/phantomjs https://s3.amazonaws.com/circle-downloads/phantomjs-2.1.1
  - sudo chmod 0655 /usr/local/bin/phantomjs
  - npm install
  - export REDIS_URL=redis://redis:6379/1

test:
  stage: test
  script:
  - bundle config github.https true
  - cp config/database.ci.yml config/database.yml
  # - cp config/secrets.ci.yml config/secrets.yml
  - cp config/application.sample.yml  config/application.yml
  - bundle exec rake db:create
  - bundle exec rake db:structure:load
  - bundle exec rspec
  - pkill Xvfb
  artifacts:
    paths:
    - coverage

deploy:
  before_script: 
    - echo "Deploying to heroku"
  stage: deploy
  - apt-get update -qy
  - apt-get install -y ruby-dev
  - gem install dpl
  - dpl --provider=heroku --app=tte-lighthouse-staging --api-key=$HEROKU_STAGING_API_KEY
  environment:
    name: Heroku Staging
    url: https://staging.tte-lighthouse.com
  when: manual
  only:
  - master  