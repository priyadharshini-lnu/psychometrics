      </p>
      <h2>เรารวบรวมข้อมูลส่วนบุคคลอย่างไร</h2>
      <h3>
        <strong>
          ข้อมูลที่จัดทำโดยคุณ ตัวแทนของคุณ หรือบุคคลที่สาม
        </strong>
      </h3>
      <p>เราสามารถเก็บข้อมูลส่วนบุคคลจากแหล่งข้อมูลต่อไปนี้:</p>
      <ul>
        <li>
          โดยตรงจากคุณ เช่น เมื่อคุณเยี่ยมชมเว็บไซต์ สร้างบัญชี ทำแบบสำรวจ หรือให้ข้อมูลกับเราในทางอื่น
        </li>
        <li>
          ตัวแทนของคุณ รวมถึงนายจ้าง สมาคม หรือกลุ่ม หรือผู้สนับสนุนโปรแกรม/แผนสวัสดิการ
        </li>
      </ul>
      <p>
        ในระหว่างการประเมิน ข้อมูลส่วนบุคคลอาจถูกรวบรวมผ่านเว็บแคม ไมโครโฟน หรืออุปกรณ์ฮาร์ดแวร์อื่น ๆ จากระบบของคุณ โดยที่ระบบของคุณและโปรแกรม MTE จะขอความยินยอมจากคุณก่อนที่จะรวบรวมข้อมูลส่วนบุคคลจากฮาร์ดแวร์ของคุณ
      </p>
      <p>
        หากคุณให้ข้อมูลส่วนบุคคลเกี่ยวกับบุคคลอื่น (เช่น สมาชิกในครอบครัว ผู้รับผลประโยชน์ หรือผู้ที่พึ่งพา) คุณให้การรับรองว่าคุณมีอำนาจในการให้ข้อมูลนี้แทนบุคคลเหล่านั้นและคุณได้แชร์ประกาศความเป็นส่วนตัวนี้ให้แก่บุคคลเหล่านั้นซึ่งเป็นเจ้าของข้อมูลส่วนบุคคลในเวลาที่เหมาะสมแล้ว เราจะไม่เก็บข้อมูลส่วนบุคคลจากเด็ก
      </p>
      <h3><strong>การเก็บข้อมูลโดยวิธีอัตโนมัติ</strong>&nbsp;</h3>
      <p>
        เราใช้คุกกี้และเทคโนโลยีการติดตามที่เกี่ยวข้อง (“คุกกี้”) บนเว็บไซต์ที่เป็นของบริษัทของเรา หากมีการให้บริการตามเขตอำนาจศาลของคุณ ผู้ใช้เว็บไซต์สามารถเลือกไม่ใช้คุกกี้บางประเภทได้โดยใช้ลิงก์จัดการคุกกี้ที่ด้านล่างของเว็บไซต์ เพื่อเรียนรู้เพิ่มเติมเกี่ยวกับวิธีที่เราใช้คุกกี้ โปรดดูที่ประกาศคุกกี้ของเรา
        <a href="https://www.mercer.com/en-sa/footer/mercer-cookie-notice/"
          >(Cookie Notice)</a
        >.
      </p>
      <h3><strong>การเก็บข้อมูลโดยบุคคลที่สาม</strong>&nbsp;</h3>
      <p>
        หากคุณดำเนินการทำธุรกรรมผ่านเรา บุคคลที่สาม (เช่น ผู้ให้บริการหรือบริษัทประกันภัย) อาจมีการเก็บรวบรวมและประมวลผลข้อมูลบัตรเครดิตหรือข้อมูลส่วนบุคคลอื่นเกี่ยวกับคุณ โดยผ่านคุกกี้ ในการทำธุรกรรมดังกล่าว ในกรณีเหล่านี้ และสำหรับการจัดการอื่นใดที่เรารับข้อมูลจากนายจ้าง สมาคม หรือบุคคลที่สามอื่น เราขอแนะนำให้คุณอ่านนโยบายความเป็นส่วนตัวของบุคคลที่สามเพื่อเรียนรู้เพิ่มเติมเกี่ยวกับวิธีที่ข้อมูลของคุณจะถูกใช้และเปิดเผยโดยพวกเขา
      </p>
      <h2>เราจะใช้ข้อมูลส่วนบุคคลที่เรารวบรวมอย่างไร</h2>
      <p>เราสามารถใช้ข้อมูลส่วนบุคคลที่เรารวบรวม:</p>
