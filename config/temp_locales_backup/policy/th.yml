  privacy_notice: |-
    <div>
      <h1><strong>ประกาศความเป็นส่วนตัวของ Mercer Talent Enterprise</strong>&nbsp;</h1>
      <p>วันที่มีผลบังคับใช้: 15 September 2024</p>
      <p>
        ประกาศความเป็นส่วนตัวฉบับนี้มีวัตถุประสงค์เพื่ออธิบายว่า Mercer Talent Enterprise (“
        <strong>MTE</strong>
        ”) มีการ เก็บรักษา รวบรวม ใช้ แบ่งปัน โอน และดำเนินการประมวลผลข้อมูลที่เกี่ยวข้องกับบุคคลที่ระบุหรือสามารถระบุได้ (ข้อมูลส่วนบุคคล) อย่างไร รวมถึงสิทธิที่คุณอาจมีเกี่ยวกับข้อมูลส่วนบุคคลของคุณ ซึ่งเราเชื่อว่าเป็นสิ่งสำคัญที่คุณควรเข้าใจว่าเราดำเนินการข้อมูลส่วนบุคคลอย่างไร และขอให้คุณใช้เวลาสักครู่เพื่อทำความคุ้นเคยกับแนวทางปฏิบัติด้านความเป็นส่วนตัวของเราตามที่ระบุไว้ด้านล่างนี้
      </p>
      <p>
        โปรดทราบว่า MTE เป็นผู้ให้บริการโซลูชันในการประเมินทางพฤติกรรม และในบางกรณี เราทำงานในนามและตามคำแนะนำของลูกค้า สถาบันการเงิน คู่ค้า และพันธมิตรอื่น ๆ ที่ทำหน้าที่เป็นผู้ควบคุมข้อมูล รวมถึงการประมวลผลธุรกรรมการชำระเงิน ทั้งนี้ขอให้คุณโปรดดูนโยบายความเป็นส่วนตัวของพันธมิตรเหล่านั้นเพื่อทราบข้อมูลเพิ่มเติมเกี่ยวกับการประมวลผลข้อมูลส่วนบุคคลของคุณในบริบทเหล่านั้น
      </p>
      <h2>ความสัมพันธ์ของเรากับคุณคืออะไร</h2>
      <p>
        คุณอาจถูกขอให้ทำการประเมินบนแพลตฟอร์มของ MTE โดยบุคคลที่สาม โดยบุคคลที่สามนี้คือผู้ใช้บริการของ MTE และอาจเป็นนายจ้างของคุณ  หรือบุคคลที่เกี่ยวข้องอื่น ๆ MTE รวบรวมและประมวลผลข้อมูลส่วนบุคคลของคุณในนามของลูกค้าของเรา เราปฏิบัติตามคำแนะนำที่ลูกค้าของเรามอบให้เกี่ยวกับข้อมูลส่วนบุคคลที่ต้องมีการรวบรวมและวิธีการประมวลผลข้อมูลส่วนบุคคลดังกล่าว ดังนั้น MTE จึงทำหน้าที่เป็นผู้ประมวลผลสำหรับลูกค้าของเรา ซึ่งกำหนดวิธีการประมวลผลข้อมูลส่วนบุคคลของคุณ
      </p>
      <p>
        หากคุณมีคำถามเกี่ยวกับการประมวลผลข้อมูลส่วนบุคคลของคุณ เราขอแนะนำให้คุณไปที่ประกาศความเป็นส่วนตัวของลูกค้าของเรา
      </p>
      <h2>เรารวบรวมข้อมูลส่วนบุคคลอะไรบ้าง</h2>
