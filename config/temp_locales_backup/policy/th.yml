            </td>
          </tr>
          <tr>
            <td width="301">
              <p>
                นายจ้างของคุณ สมาคม กลุ่ม หรือผู้สนับสนุนโปรแกรมสวัสดิการ เมื่อมีความเหมาะสม (เช่น ลูกค้าของ MTE)
              </p>
            </td>
            <td width="301"><p>เพื่อให้บริการแก่ลูกค้าของเรา</p></td>
          </tr>
          <tr>
            <td width="301">
              <p>
                บริษัทในเครือ MTE หรือหน่วยงานอื่น ๆ ภายในกลุ่มบริษัท Marsh McLennan (MMC)
              </p>
            </td>
            <td width="301">
              <p>
