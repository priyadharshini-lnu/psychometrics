      <h2>การเก็บรักษาข้อมูลของคุณ</h2>
      <p>
        ผลิตภัณฑ์ บริการ และข้อผูกพันด้านกฎระเบียบของเรามีความซับซ้อน ดังนั้นระยะเวลาการเก็บรักษาข้อมูลส่วนบุคคลของเราจึงแตกต่างกัน เราพิจารณาข้อผูกพันต่อไปนี้เมื่อกำหนดระยะเวลาการเก็บรักษาข้อมูลส่วนบุคคลและเอกสารที่เราดูแลรักษา:
      </p>
      <ul>
        <li>
          ความจำเป็นในการเก็บรักษาข้อมูลเพื่อให้บรรลุวัตถุประสงค์ทางธุรกิจหรือข้อผูกพันตามสัญญาที่ได้เก็บรวบรวมไว้
        </li>
        <li>
          หน้าที่ของเราในการดำเนินการตามคำสั่งของลูกค้าเกี่ยวกับข้อมูลส่วนบุคคลที่เราประมวลผลในนามของพวกเขา;
        </li>
        <li>
          หน้าที่ของเราในการปฏิบัติตามข้อกำหนดด้านการบันทึกข้อมูลทางกฎหมายและระเบียบข้อบังคับที่จำเป็น;
        </li>
        <li>
          ขั้นตอนการสำรองข้อมูลและการกู้คืนจากภัยพิบัติของเรา; และ
        </li>
        <li>
          ผลกระทบทางกฎหมายอื่น ๆ เช่นระยะเวลาที่ใช้บังคับตามกฎหมายที่เกี่ยวข้อง
        </li>
      </ul>
      <p>
        ตามปัจจัยข้างต้น เราอาจเก็บรักษาข้อมูลส่วนบุคคลเกินระยะเวลาที่เรามีการให้บริการแก่คุณ เมื่อเราไม่จำเป็นต้องเก็บรักษาข้อมูลส่วนบุคคลอีกต่อไป นโยบายของบริษัทของเรากำหนดให้เราต้องทำการลบข้อมูลที่สามารถระบุตัวตนได้หรือรวมข้อมูล (ในกรณีนี้เราสามารถเก็บรักษาและใช้ข้อมูลที่ไม่สามารถระบุตัวตนได้หรือข้อมูลที่รวมกันเพื่อวัตถุประสงค์ในการวิเคราะห์) หรือทำลายข้อมูลอย่างปลอดภัย
      </p>
