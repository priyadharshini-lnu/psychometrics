      <p>
        เรายังอาจใช้ข้อมูลส่วนบุคคลที่เรารวบรวมและได้รับจากคุณเพื่อวัตถุประสงค์ตามที่อธิบายไว้กับคุณในขณะที่มีการเก็บ รวบรวมข้อมูลนั้น
      </p>
      <h3><strong>ลิงก์ภายนอก</strong>&nbsp;</h3>
      <p>
        เว็บไซต์ของเราอาจมีลิงก์ไปยังเว็บไซต์ที่ดำเนินการโดยองค์กรอื่นที่ไม่ใช่ MTE หากคุณเข้าถึงเว็บไซต์ขององค์กรอื่นโดยใช้ลิงก์บนเว็บไซต์ของเรา องค์กรอื่นอาจเก็บข้อมูลจากคุณ โดยที่ MTE จะไม่มีความรับผิดชอบต่อเนื้อหาหรือแนวทางปฏิบัติด้านความเป็นส่วนตัวของเว็บไซต์ที่เชื่อมโยงหรือการใช้ข้อมูลส่วนบุคคลของคุณ หากคุณออกจากเว็บไซต์ MTE ผ่านลิงก์ดังกล่าว (คุณสามารถตรวจสอบได้ว่าคุณอยู่ที่ไหนโดยการตรวจสอบ URL ในแถบที่อยู่บนเบราว์เซอร์ของคุณ) คุณควรอ้างอิงนโยบายความเป็นส่วนตัว ข้อกำหนดการใช้งาน และประกาศอื่น ๆ ของเว็บไซต์นั้นเพื่อกำหนดว่าองค์กรอื่นจะจัดการข้อมูลส่วนบุคคลใด ๆ ที่พวกเขาเก็บจากคุณอย่างไร
      </p>
      <h2>เราจะเปิดเผยข้อมูลส่วนบุคคลให้กับใคร</h2>
      <p>
        เราสามารถเปิดเผยข้อมูลส่วนบุคคลให้กับกลุ่มบุคคลที่สามต่อไปนี้:
      </p>
