            <td width="301">
              <p>
                ตามความจำเป็นเพื่อป้องกันการฉ้อโกง สื่อสารกับหน่วยงานกำกับดูแลหรือหน่วยงานที่มีอำนาจ ปกป้องและป้องกันสิทธิทางกฎหมาย ความปลอดภัย และความมั่นคงของ MTE บริษัทในเครือและพันธมิตรทางธุรกิจของเรา รวมถึงผู้ใช้เว็บไซต์ใด ๆ บังคับใช้ข้อกำหนดการใช้งานของเว็บไซต์ ตอบสนองต่อข้อเรียกร้องเกี่ยวกับกิจกรรมที่สงสัยหรือผิดกฎหมาย ตอบสนองต่อการตรวจสอบหรือสอบสวนข้อร้องเรียนหรือภัยคุกคามด้านความปลอดภัย หรือปฏิบัติตามกฎหมาย ระเบียบ ข้อกำหนดทางกฎหมาย หรือคำขอของรัฐบาลที่เกี่ยวข้อง.
              </p>
            </td>
          </tr>
        </tbody>
      </table>
      <p>
        เรายังอาจเปิดเผยข้อมูลที่ไม่มีการระบุชื่อซึ่งไม่สามารถระบุตัวตนของคุณได้เพื่อวัตถุประสงค์ทางธุรกิจที่ถูกต้องตามกฎหมายและมีความชอบธรรมทางการค้า ในกรณีที่เรามีข้อมูลที่ไม่มีการระบุชื่อ เราจะรักษาและใช้ข้อมูลนั้นโดยไม่ นอกเหนือจากที่กฎหมายอนุญาต
      </p>
      <h2>ขั้นตอนที่เราทำเพื่อปกป้องข้อมูลส่วนบุคคล</h2>
      <p>
        บริษัทของเรามุ่งมั่นที่จะปฏิบัติตามกฎหมายด้านความปลอดภัยไซเบอร์และการปกป้องข้อมูลที่เกี่ยวข้องทั้งหมด โดยมีเป้าหมายเหล่านี้เป็นหลักการสำคัญ MMC จึงมีเจ้าหน้าที่รักษาความปลอดภัยข้อมูลระดับสูง (Chief Information Security Officer) และเจ้าหน้าที่รักษาความเป็นส่วนตัวระดับโลก (Global Chief Privacy Officer) โดย CISO มีหน้าที่รับผิดชอบในการจัดการทีมความปลอดภัยข้อมูลระดับโลกและโปรแกรมความปลอดภัยไซเบอร์ที่ครอบคลุม ในฐานะที่เป็นส่วนหนึ่งของโปรแกรมความปลอดภัยไซเบอร์ของเรา เราได้ดำเนินการจัดตั้งมาตรการป้องกันทางกายภาพ ทางการบริหาร และทางเทคนิคที่เหมาะสมในเชิงพาณิชย์เพื่อปกป้องข้อมูลส่วนบุคคลจากการเข้าถึง การใช้ การเปลี่ยนแปลง และการลบที่ไม่ได้รับอนุญาต
      </p>
      <p>
        GCPO เป็นผู้นำและดูแลศูนย์ความเป็นเลิศด้านข้อมูลส่วนบุคคลและเครือข่ายเจ้าหน้าที่คุ้มครองข้อมูลที่รับผิดชอบในการดำเนินการตามโปรแกรมความเป็นส่วนตัวระดับโลกที่ครอบคลุมของเรา เครือข่ายเจ้าหน้าที่คุ้มครองข้อมูลเชื่อมโยงเจ้าหน้าที่คุ้มครองข้อมูลของเราทั่วโลกและพยายามที่จะดำเนินการตามหลักการความเป็นส่วนตัวของเราอย่างสม่ำเสมอและทั่วถึงในทุกที่ที่เราประมวลผลข้อมูล คุณสามารถขอชื่อและข้อมูลติดต่อของเจ้าหน้าที่คุ้มครองข้อมูลในเขตอำนาจของคุณได้โดยการติดต่อเราที่ <a href="mailto:privacy@mmc.com">privacy@mmc.com</a>.
      </p>
      <h2>สิทธิในการปกป้องข้อมูลของคุณ</h2>
      <p>
        ในหลายกรณี เราจัดการข้อมูลส่วนบุคคลเพื่อให้บริการแก่ลูกค้าทางธุรกิจ และคุณควรติดต่อพวกเขาเพื่อใช้สิทธิใด ๆ ที่คุณอาจมีภายใต้กฎหมายความเป็นส่วนตัวที่บังคับใช้ อย่างไรก็ตาม เมื่อเราเป็นผู้ควบคุมหรือธุรกิจที่รับผิดชอบหลักในการตัดสินใจว่าข้อมูลของคุณจะถูกประมวลผลอย่างไร คุณอาจมีสิทธิบางประการหรือทั้งหมดที่ระบุไว้ด้านล่าง ขึ้นอยู่กับเขตอำนาจศาลและเหตุผลของเราในการประมวลผลข้อมูลของคุณ โปรดทราบว่าเราอาจต้องใช้ข้อมูลส่วนบุคคลของคุณเพื่อตรวจสอบตัวตนของคุณก่อนที่จะตอบสนองต่อสิทธิใด ๆ ด้านล่างนี้
      </p>
      <ul>
        <li>
          <strong>•	สิทธิในการเข้าถึง (สิทธิในการรับทราบ)<br /></strong>
          คุณสามารถขอให้เราจัดเตรียมรายละเอียดเพิ่มเติมเกี่ยวกับวิธีที่เรานำข้อมูลส่วนบุคคลของคุณไปใช้ แหล่งที่มา ประเภทหรือข้อมูลเฉพาะของข้อมูลส่วนบุคคลที่เรารวบรวม ประเภทของบุคคลที่สามที่เราได้เปิดเผยข้อมูล และขอสำเนาของข้อมูลส่วนบุคคลที่เรามีเกี่ยวกับคุณได้
        </li>
      </ul>
      <ul>
        <li>
          <strong>•	สิทธิในการแก้ไข<br /></strong>
          คุณสามารถขอให้เราอัปเดตข้อมูลที่ไม่ถูกต้องในข้อมูลส่วนบุคคลที่เรามี หากเราปล่อยข้อมูลส่วนบุคคลของคุณให้กับผู้อื่น เราจะแจ้งให้พวกเขาทราบเกี่ยวกับการแก้ไขเมื่อเป็นไปได้
        </li>
      </ul>
      <ul>
        <li>
          <strong>•	สิทธิในการลบ<br /></strong>
          คุณสามารถขอให้เราลบข้อมูลส่วนบุคคลของคุณได้เมื่อเราไม่มีเหตุผลทางกฎหมายในการประมวลผลอีกต่อไป อย่างไรก็ตามการใช้สิทธินี้ คุณรับทราบและตกลงว่าเราอาจไม่สามารถให้บริการบางอย่างให้แก่คุณได้อีกต่อไป เนื่องจากการลบข้อมูลส่วนบุคคลตามที่คุณได้ใช้สิทธินี้
        </li>
      </ul>
      <ul>
        <li>
          <strong>•	สิทธิในการคัดค้านหรือจำกัดการประมวลผล<br /></strong>
          คุณอาจมีสิทธิ์ในการจำกัดการประมวลผลข้อมูลส่วนบุคคลของคุณในบางกรณี เช่น เมื่อคุณโต้แย้งความถูกต้องของข้อมูลนั้น
        </li>
      </ul>
      <ul>
        <li>
          <strong>•	สิทธิในการพกพาข้อมูล<br /></strong>
          คุณอาจมีสิทธิ์ในการขอให้เราถ่ายโอนข้อมูลส่วนบุคคลที่เราได้รับจากคุณไปยังบุคคลที่สามที่คุณเลือกในรูปแบบที่มีโครงสร้าง ใช้งานเป็นการทั่วไป และสามารถอ่านข้อมูลได้โดยอุปกรณ์ ซึ่งเป็นไปได้ทางเทคนิค
        </li>
      </ul>
      <ul>
        <li>
          <strong>•	สิทธิในการถอนความยินยอม<br /></strong>
          หากเราพึ่งพาความยินยอมของคุณเป็นฐานทางกฎหมายในการประมวลผลข้อมูลส่วนบุคคลของคุณ คุณมีสิทธิ์ที่จะถอนความยินยอมดังกล่าว
        </li>
      </ul>
      <ul>
        <li>
          <strong>•	สิทธิในการยื่นเรื่องร้องเรียน<br /></strong>
          คุณอาจมีสิทธิ์ในการยื่นเรื่องร้องเรียนต่อหน่วยงานกำกับดูแลหรือหน่วยงานที่เกี่ยวข้องในเขตอำนาจศาลของคุณ หากคุณมีข้อกังวลเกี่ยวกับด้านใดด้านหนึ่งของแนวปฏิบัติด้านความเป็นส่วนตัวของเรา
        </li>
      </ul>
      <p>
        หากคุณต้องการใช้สิทธิ์ใดๆ ข้างต้นหรือต้องการขอให้ทบทวนการตัดสินใจหรือการปฏิเสธ โปรดติดต่อเราโดยใช้ข้อมูลติดต่อที่เกี่ยวข้อง:
      </p>
      <ul>
        <li>
          สำหรับบุคคลในสหราชอาณาจักร, สวิตเซอร์แลนด์ และเขตเศรษฐกิจยุโรป โปรดกรอกแบบฟอร์มนี้
          <a
            href="https://mmc-dev-privacy.my.onetrust.com/webform/4da460d1-7bcf-4ff1-ac37-c4b804769467/draft/ea953d72-fded-42ee-b1dd-c0a5a83b7891"
            >(complete this form)</a
          >
        </li>
        <li>
          สำหรับบุคคลในประเทศอื่น โปรดกรอกแบบฟอร์มนี้
          <a
            href="https://privacyportal.onetrust.com/webform/ee9df2bb-0ef3-4485-bc63-4db420e77359/225910f5-5666-468a-b1e7-39c70e24f4cc"
            >(complete this form)</a
          >
        </li>
        <li>
          หรืออีกทางหนึ่ง คุณสามารถส่งอีเมลถึงเราได้ที่ <a href="mailto:privacy@mmc.com">privacy@mmc.com</a>
        </li>
      </ul>
      <p>
        ขึ้นอยู่กับประเทศของคุณ คุณอาจมีสิทธิ์บางประการหรือทั้งหมดต่อไปนี้:
      </p>
      <ul>
        <li>
          <strong>
            สิทธิในการเลือกเข้าร่วมหรือไม่เข้าร่วมการขายหรือการแบ่งปันสำหรับการโฆษณาที่มุ่งเป้าไปยังผู้บริโภคโดยใช้ข้อมูลส่วนบุคคลที่ได้จากกิจกรรมของผู้บริโภคบนเว็บไซต์ แอป หรือบริการต่างๆ ที่ไม่ได้มีความเกี่ยวข้องสัมพันธ์กัน (Cross-context advertising)<br />
          </strong>
          หากคุณเข้าชมเว็บไซต์ใดเว็บไซต์หนึ่งของเรา เราอาจเปิดเผยข้อมูลเกี่ยวกับกิจกรรมทางอินเทอร์เน็ตหรือกิจกรรมเครือข่ายอิเล็กทรอนิกส์อื่น ๆ ของคุณ ข้อมูลระบุตัวตนทางชีวภาพ ข้อมูลตำแหน่งทางภูมิศาสตร์ และข้อมูลวิชาชีพ (ตามขอบเขตที่สามารถสืบค้นได้จากกิจกรรมของคุณในเว็บไซต์ของเรา) ให้กับผู้ให้บริการวิเคราะห์เว็บไซต์และโฆษณาสำหรับวัตถุประสงค์ในการโฆษณาที่มุ่งเป้าหมายหรือพฤติกรรมข้ามบริบทโดยใช้คุกกี้โฆษณา ภายใต้กฎหมายบางฉบับ คุณอาจมีสิทธิ์ในการเลือกเข้าหรือออกจากการเปิดเผยประเภทนี้ เพื่อทำการเลือกของคุณหรือเพื่อดูชื่อของบุคคลที่สามเฉพาะที่เราขายหรือแบ่งปันข้อมูลของคุณ โปรดคลิกที่ลิงก์ “จัดการคุกกี้” ที่ด้านล่างของหน้าเว็บของเรา หากคุณต้องการเลือกไม่เข้าร่วมการขายหรือการแบ่งปันข้อมูลของคุณ ให้แน่ใจว่าการตั้งค่าสำหรับตัวติดตาม “โฆษณา” และ “การวิเคราะห์” ถูกตั้งค่าเป็น “ไม่” หรือหากมีให้เปิดใช้งานตัวเลือก “ไม่ขายหรือแบ่งปันข้อมูลส่วนบุคคลของฉัน”
          <p>
            คุณยังสามารถตั้งค่าหรือใช้ส่วนขยายของเบราว์เซอร์เพื่อสื่อสารความชอบในการขายและการแบ่งปันของคุณโดยอัตโนมัติไปยังเว็บไซต์ที่คุณเยี่ยมชม เว็บไซต์ของเราจะประมวลผล “สัญญาณปฏิเสธการขายหรือการแบ่งปันข้อมูล ” (Opt-Out Preference Signal) ดังกล่าวอย่างราบรื่นโดยการรับรู้ Global Privacy Control (GPC) หากคุณต้องการใช้ GPC คุณสามารถดาวน์โหลดและเปิดใช้งานผ่านเบราว์เซอร์ที่เข้าร่วม หรือส่วนขยายของเบราว์เซอร์ ข้อมูลเพิ่มเติมเกี่ยวกับการดาวน์โหลด GPC สามารถดูได้ที่นี่ <a href="https://globalprivacycontrol.org/">here</a>.
          </p>
        </li>
      </ul>
      <ul>
        <li>
          <strong>
            สิทธิในความสัมพันธ์กับการตัดสินใจอัตโนมัติและการสร้างโปรไฟล์
          <br /></strong>
          ในกรณีที่เรามีการประมวลผลข้อมูลส่วนบุคคลของคุณโดยอัตโนมัติ เราจะแจ้งให้คุณทราบล่วงหน้าเกี่ยวกับประกาศใด ๆ รวมถึงสิทธิของคุณที่กฎหมายกำหนด
        </li>
      </ul>
      <ul>
        <li>
          <strong>การตลาดทางตรงและความประสงค์มิให้ติดตาม (Not to track signal)<br /></strong>
          คุณอาจมีสิทธิ์ในการขอและรับการแจ้งเตือนปีละหนึ่งครั้งเกี่ยวกับข้อมูลส่วนบุคคลที่เราเปิดเผยให้กับธุรกิจอื่นเพื่อวัตถุประสงค์ในการตลาดโดยตรงของพวกเขา ซึ่งได้รับอนุญาตตามกฎหมาย หากมีการใช้สิทธิ์ดังกล่าว การแจ้งเตือนจะรวมถึงรายการหมวดหมู่ของข้อมูลส่วนบุคคลที่ถูกเปิดเผย (ถ้ามี) และชื่อและที่อยู่ของบุคคลที่สามทั้งหมดที่ข้อมูลส่วนบุคคลถูกเปิดเผย (ถ้ามี) การแจ้งเตือนจะครอบคลุมปีปฏิทินก่อนหน้า คุณสามารถติดต่อเราได้ตามที่ระบุด้านล่างหากคุณต้องการทราบว่าสิทธิ์นี้ใช้กับคุณหรือไม่ และการอนุญาต ให้ใช้สิทธิ์นั้น
        </li>
      </ul>
      <p>
        โปรดทราบว่าสิทธิ์บางประการเหล่านี้อาจถูกจำกัดเมื่อเรามีความสนใจที่ชอบด้วยกฎหมายหรือมีฐานหน้าที่ผูกพันตามกฎหมาย กฎระเบียบ หรือสัญญาในการดำเนินการต่อเกี่ยวกับข้อมูลส่วนบุคคล หรือเมื่อข้อมูลส่วนบุคคลอาจได้รับการยกเว้นจากการเปิดเผยหรือการลบตามกฎหมายที่บังคับใช้ สิทธิ์บางประการเหล่านี้สามารถใช้ได้เฉพาะในบางสถานการณ์หรืออาจถูกจำกัดโดยกฎหมายคุ้มครองข้อมูลในเขตอำนาจศาลของคุณ.
      </p>
      <h2>การโอนข้ามพรมแดน</h2>
      <p>
        ในฐานะที่เราเป็นบริษัทระดับโลกที่ดำเนินงานในมากกว่า 80 ประเทศ มีสถานการณ์ที่เราจะต้องโอนข้อมูลส่วนบุคคลออกจากประเทศ จังหวัด หรือดินแดนที่ข้อมูลนั้นถูกเก็บรวบรวมเพื่อวัตถุประสงค์ที่ระบุไว้ในประกาศความเป็นส่วนตัวนี้ โดยเฉพาะอย่างยิ่ง เราอาจโอนข้อมูลเพื่อเสนอ จัดการ และบริหารบริการที่จัดให้กับคุณ และเพื่อเพิ่มประสิทธิภาพในการดำเนินธุรกิจของเรา เราจะพยายามอย่างเต็มที่เพื่อให้แน่ใจว่าการโอนข้อมูลเหล่านี้เป็นไปตามกฎหมายการคุ้มครองข้อมูลที่เกี่ยวข้องทั้งหมด และสิทธิและเสรีภาพของบุคคลภายใต้กฎหมายดังกล่าวได้รับการคุ้มครองอย่างเหมาะสม
      </p>
      <p>
        ในกรณีที่มีความจำเป็นต้องมีการโอนข้อมูลดังกล่าว เราจะดำเนินการเพื่อให้แน่ใจว่ามีการป้องกันที่เหมาะสมเพื่อปกป้องข้อมูลส่วนบุคคล เช่น การประเมินผลกระทบ การตัดสินใจความเหมาะสมโดยหน่วยงานกำกับดูแลที่เหมาะสม การใช้กฎระเบียบภายในที่ได้รับการอนุมัติหรือข้อกำหนดสัญญามาตรฐาน หรือความยินยอมของคุณ
      </p>
      <p>
        สำหรับข้อมูลเกี่ยวกับวิธีการที่กฎระเบียบการควบคุมองค์กรที่มีผลผูกพันของ MMC ในสหภาพยุโรป (EU BCRs)
