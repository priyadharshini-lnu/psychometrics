                ฐานข้อมูลป้องกันการฉ้อโกง หน่วยงานกำกับดูแลหรือหน่วยงานที่มีอำนาจตามกฎหมาย หน่วยงานบังคับใช้กฎหมาย และบุคคลที่สามอื่น ๆ
              </p>
