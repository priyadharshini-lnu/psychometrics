  api_key: <%= ENV.fetch('EMBEDDING_API_KEY', nil) %>
  api_endpoint: <%= ENV.fetch('EMBEDDING_API_ENDPOINT', nil) %>

ai_transcription_provider:
  provider: <%= ENV.fetch('TRANSCRIPTION_PROVIDER', 'oci') %>
  model: <%= ENV.fetch('TRANSCRIPTION_MODEL', 'WHISPER_LARGE_V3T') %>
  real_time_provider: <%= ENV.fetch('AI_REAL_TIME_TRANSCRIPTION_PROVIDER', 'aws') %>

# Default SMTP throttling limits used when a project has no SMTP setting
smtp_default:
  concurrency_limit: <%= ENV.fetch('SMTP_CONCURRENCY_LIMIT', 10).to_i %>
  rate_limit: <%= ENV.fetch('SMTP_RATE_LIMIT', 100).to_i %>
  rate_limit_period: <%= ENV.fetch('SMTP_RATE_LIMIT_PERIOD', 1).to_i %>

# Tenant scoping safety controls
tenant_scoping:
  disabled: <%= ENV.fetch('TENANT_SCOPING_DISABLED', 'false') == 'true' %>
  bypass_subdomains: <%= ENV.fetch('TENANT_BYPASS_SUBDOMAINS', '').split(',').map(&:strip) %>
