    context:
      openai_api_base: <%= ENV.fetch('MMC_OPENAI_BASE_ENDPOINT_GPT_5_CHAT', nil) %>
      openai_api_key: <%= ENV.fetch('MMC_OPENAI_API_KEY', nil) %>
      openai_use_system_role: true
  - model_id: mmc-tech-gpt-5
    model: gpt-5
    provider: mmc
    name: GPT-5 (MMC, 272k)
    description: "GPT-5 model on MMC with 272k chat window context. Reasoning is available"
    context:
      openai_api_base: <%= ENV.fetch('MMC_OPENAI_BASE_ENDPOINT_GPT_5', nil) %>
      openai_api_key: <%= ENV.fetch('MMC_OPENAI_API_KEY', nil) %>
      openai_use_system_role: true
  - model_id: mmc-tech-gpt-5-nano
    model: gpt-5-nano
    provider: mmc
    name: GPT-5 Nano (MMC, 272k)
