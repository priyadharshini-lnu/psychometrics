checking_wizard:
  speed_of_me_api_token: <%= ENV.fetch('SPEED_OF_ME_API_TOKEN', '') %>
  network:
    upload: <%= ENV.fetch('MIN_NETWORK_UPLOAD', 4).to_i %>
    download: <%= ENV.fetch('MIN_NETWORK_DOWNLOAD', 8).to_i %>
  audio:
    # https://docs.aws.amazon.com/transcribe/latest/dg/what-is-transcribe.html
    supported_locales:
      - en
      - fr
      - es
      - ar
saml:
  assertion_consumer_service_binding: <%= ENV.fetch('SAML_ASSERTION_CONSUMER_SERVICE_BINDING', 'urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST') %>
  name_identifier_format: <%= ENV.fetch('SAML_NAME_IDENTIFIER_FORMAT', 'urn:oasis:names:tc:SAML:1.1:nameid-format:emailAddress') %>
  idp_entity_id: <%= ENV.fetch('SAML_IDP_ENTITY_ID', nil) %>
  idp_sso_service_url: <%= ENV.fetch('SAML_IDP_SSO_SERVICE_URL', nil) %>
ai_providers:
  - model_id: <%= ENV.fetch('AZURE_OPENAI_MODEL_ID', 'gpt-4o') %>
    model: <%= ENV.fetch('AZURE_OPENAI_MODEL', 'gpt-4o') %>
    name: GPT-4o
    provider: Azure
    description: "GPT-4o by openai on Azure"
    context:
      openai_api_key: <%= ENV.fetch('AZURE_OPENAI_API_KEY', nil) %>
      openai_api_base: <%= ENV.fetch('AZURE_OPENAI_API_BASE_ENDPOINT', nil) %>
  - model_id: cohere.command-a
    model: 'cohere.command-a'
    name: 'Cohere Command A'
    description: "Cohere Command A by Cohere from OCI"
    custom_provider: oci
    modalities:
      input: ["text"]
      output: ["text"]
    context:
      oci_model_id: <%= ENV.fetch('OCI_COHERE_COMMAND_A_MODEL_ID', nil) %>
      oci_generative_ai_api_base: <%= ENV.fetch('OCI_GENERATIVE_AI_API_BASE', nil) %>
  - model_id: mmc-tech-gpt-5-mini
    model: gpt-5-mini
    provider: mmc
    name: GPT-5 Mini (MMC, 272k)
    description: "Lightweight GPT-5 Mini model on MMC with 272k context. Reasoning capabilities"
    context:
      openai_api_base: <%= ENV.fetch('MMC_OPENAI_BASE_ENDPOINT_GPT_5_MINI', nil) %>
      openai_api_key: <%= ENV.fetch('MMC_OPENAI_API_KEY', nil) %>
      openai_use_system_role: true
  - model_id: mmc-tech-gpt-5-chat
