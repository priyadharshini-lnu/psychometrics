domain: <%= ENV["APP_DOMAIN"] || 'tte-lighthouse.com' %> # psychometrics.co.uk
subdomain: <%= ENV["APP_SUB_DOMAIN"] %> # subdomain
port: 
protocol: <%= ENV["APP_PROTOCOL"] || 'http' %>
assigns:
  mindmill_prefix: <%= ENV["MINDMILL_PREFIX"] || 'TTESTAG' %> # set 'TTEPROD' in production environment variables
hogan:
  - name: HPI
    assessment_id: HPI
    form_id: 3
    reports:
      - report_id: EcHPIDML
        report_name: HPI Data Report
        norm_id: Global
        language_id: en
  - name: HDS
    assessment_id: HDS
    form_id: 5
    reports:
      - report_id: EcHDSDML
        report_name: HDS Data Report
        norm_id: Global
        language_id: en
  - name: MVPI
    assessment_id: MVPI
    form_id: 1
    reports:
      - report_id: EcMVPIDML
        report_name: MVPI Data Report
        norm_id: Global
        language_id: en
  - name: HBRI
    assessment_id: HBRIV1
    form_id: 1
    reports:
      - report_id: EcHBRIV1D
        report_name: HBRI Data Report
        norm_id: Global
        language_id: en
      - report_id: EcHBRIV1IML
        report_name: HBRI Interpret Report
        norm_id: Global
        language_id: en
