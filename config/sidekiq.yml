  - ["external_results", 6]
  - ["mailers", 6]
  - ["webhooks", 5]
  - ["communication", 4]
  - ["mailers_low_priority", 3]
  - ["reports", 3]
  - ["cron_tasks", 3]
  - ["default", 2]
  - ["low_priority", 1]
