de:
  cookies_notice: |-
    <h2>Cookie-Hinweis</h2>

    <p>Datum des Inkrafttretens: 14. Dezember 2023</p>

    <p>
    Wir verwenden Cookies und verwandte Tracking-Technologien, einschließlich Web-Beacons,
    Zählpixel und Protokolldateien (zusammenfassend als „Cookies“ bezeichnet) auf dieser Website,
    um Sie von anderen Benutzern zu unterscheiden, die Funktionalität der Website und unserer
    Dienste zu bewerten und zu verbessern und Ihnen ein gutes Erlebnis zu bieten.
    </p>

    <p><strong>WAS IST EIN COOKIE?</strong></p>

    <p>
    Cookies sind Informationen, die zwischen Ihrem Webbrowser und einer Website ausgetauscht
    werden. Einige Cookies sind notwendig, damit die Website funktioniert. Einige tragen zur
    Verbesserung und Bewertung der Leistung bei. Außerdem verwenden wir Cookies, um Ihnen
    relevante Inhalte, Produkte und Dienstleistungen anbieten zu können. Ein Cookie kann keine
    Daten von der Festplatte Ihres Computers auslesen.
    </p>

    <p>Es gibt verschiedene Arten von Cookies mit unterschiedlichen Funktionen:</p>

    <p>
    (i) <strong>Sitzungs-Cookies</strong> werden nur während Ihrer Web-Sitzung auf Ihrem Computer
    gespeichert. Sie werden automatisch gelöscht, sobald der Browser geschlossen wird. In der
    Regel speichern sie eine anonyme Sitzungs-ID, die es Ihnen ermöglicht, auf einer Website
    zu surfen, ohne sich auf jeder Seite anmelden zu müssen.
    </p>

    <p>
    (ii) <strong>Dauerhafte Cookies</strong> werden als Datei auf Ihrem Computer gespeichert
    und verbleiben dort, wenn Sie Ihren Webbrowser schließen. Solch ein Cookie kann von der
    Website, die ihn erstellt hat, gelesen werden, wenn Sie diese Website erneut besuchen.
    </p>

    <p>
    (iii) <strong>Erstanbieter-Cookies</strong> werden von unserem Unternehmen erstellt. Sie
    werden zwischen unseren Servern und der Festplatte Ihres Computers gespeichert und
    übermittelt.
    </p>

    <p>
    (iv) <strong>Drittanbieter-Cookies</strong> werden von einem unserer Geschäftspartner
    (Drittanbieter) erstellt. Sie werden zwischen den Servern des Drittanbieters und der
    Festplatte Ihres Computers gespeichert und übermittelt.
    </p>

    <p><strong>WIE UND WARUM WIR COOKIES VERWENDEN</strong></p>

    <p>Je nach Website können wir Cookies für die folgenden Zwecke verwenden:</p>

    <p><strong>Wo es unbedingt notwendig ist</strong></p>

    <p>
    Diese Cookies sind notwendig, damit Sie sich auf der Website bewegen und ihre Funktionen
    nutzen können, zum Beispiel den Zugriff auf sichere Bereiche der Website.
    </p>

    <p><strong>Funktionalität</strong></p>

    <p>
    Diese Cookies ermöglichen es unserer Website, sich an die von Ihnen gewählten Einstellungen
    zu erinnern (zum Beispiel an Ihren Benutzernamen, Ihre Sprache oder die Region, in der Sie
    sich befinden) und bieten erweiterte Funktionen.
    </p>

    <p><strong>Analytisch</strong></p>

    <p>
    Diese Cookies sammeln Informationen darüber, wie Besucher eine Website nutzen, zum Beispiel
    welche Seiten Besucher am häufigsten besuchen und ob sie Fehlermeldungen von Webseiten
    erhalten.
    </p>

    <p><strong>Werbung</strong></p>

    <p>
    Diese Cookies dienen dem Zweck, Ihnen für Sie relevante Werbung anzuzeigen und die
    Werbeleistung zu verwalten.
    </p>

    <p><strong>IP-Adressen</strong></p>

    <p>
    Wenn Sie unsere Website besuchen, können wir Ihre Internetprotokoll-Adressen („IP“)
    erfassen, um nicht-personenbezogene Daten zu verfolgen und zu sammeln.
    </p>

    <p><strong>WIE SIE COOKIES VERWALTEN</strong></p>

    <p>
    Bitte klicken Sie auf den Link „Cookies verwalten“ am Ende der Seite, um bestimmte Cookies
    über unseren Cookie-Einverständnis-Manager zuzulassen oder abzulehnen.
    </p>

    <p>
    Sie können bestimmte Cookies auch über die Browsereinstellungen deaktivieren. Besuchen Sie
    den Abschnitt „Hilfe“ Ihres Browsers, um zu erfahren, wie Sie Ihre Cookie-Einstellungen
    verwalten.
    </p>

    <p><strong>DER COOKIE-HINWEIS GILT NICHT FÜR WEBSITES VON DRITTEN</strong></p>

    <p>
    Wenn wir auf andere Websites verlinken, beachten Sie bitte, dass diese ihre eigenen
    Datenschutz- und Cookie-Richtlinien haben.
    </p>

    <p><strong>ÄNDERUNGEN AM COOKIE-HINWEIS</strong></p>

    <p>
    Wir aktualisieren diese Richtlinie möglicherweise von Zeit zu Zeit und empfehlen Ihnen,
    die Richtlinie regelmäßig zu überprüfen.
    </p>

    <p><strong>BESCHREIBUNG DER VERWENDETEN COOKIES</strong></p>

    <p>
    Bitte klicken Sie auf den Link „Cookies verwalten“ in der Fußzeile der Website, um Details
    zu den einzelnen auf der Website verwendeten Cookies zu erhalten.
    </p>

    <p><strong>KONTAKT</strong></p>

    <p>
    Wenn Sie Fragen zu diesem Cookie-Hinweis haben, wenden Sie sich bitte an uns, wie in
    unseren Datenschutzhinweisen angegeben.
    </p>
