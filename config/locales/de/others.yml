      guidelines:
        cards:
          c1:
            content: Fügen Sie Kompetenzen, Kenntnisse und Fähigkeiten ein, die entwickelt werden müssen. Stellen Sie sicher, dass sie spezifisch, messbar, erreichbar, realistisch und innerhalb der genannten Zeiträume angemessen zu erreichen sind.
            title: Entwicklungsziele
          c2:
            content: Dies basiert auf der zu entwickelnden Kompetenz, die auf der Bewertungserfahrung basiert.
            title: Kompetenz
          c3:
            content: Dieser Abschnitt enthält Ihre Entwicklungsmaßnahmen basierend auf dem unten aufgeführten 70-20-10-Lernmodell. Es wird empfohlen, eine Kombination aus allen drei Elementen zu wählen, um einen vielfältigen Lern- und Entwicklungsansatz zu gewährleisten.
            title: Aktivität
          c4:
            content: Stellen Sie sicher, dass Ihre Zeitpläne realistisch sind, basierend darauf, wann das Ziel erreicht werden kann. Ändern Sie diese bei Bedarf entsprechend.
            title: Zeitrahmen
          c5:
            content: Nutzen Sie den Fortschrittsbereich, um die Entwicklung auf den identifizierten Bahnen zu unterstützen.
            title: Fortschritt
        chart:
          collaboration: "<strong>20%</strong>Kollaboratives <br /> Lernen"
          job: "<strong>70%</strong>Lernen <br />am Arbeitsplatz"
          learn: "<strong>10%</strong>Formelles Lernen"
        content:
          list:
            r1: Bitte beachten Sie, dass diese Liste nur als Anhaltspunkt dient und dass je nach Ihren individuellen Zielen, den Empfehlungen Ihres Vorgesetzten sowie den geschäftlichen Prioritäten des Unternehmens weitere Entwicklungswege für Sie in Betracht gezogen werden können.
            r2: Die Nutzer werden dazu angehalten, alle Inhalte kritisch zu prüfen, und können alle Maßnahmen oder Empfehlungen, mit denen sie nicht einverstanden sind, ändern, verfeinern, ersetzen oder ergänzen.
            r3: 'Die in diesem Bericht enthaltenen Entwicklungsdaten stammen aus einer oder beiden der folgenden Quellen:'
            r3a: Eine maßgeschneiderte Entwicklungsbibliothek, die speziell für Ihr Unternehmen erstellt wurde
            r3b: KI-generierte Entwicklungsvorschläge
            r4: Dieser IDP-Bericht wurde unter Einsatz von KI-Technologie erstellt und kann Ungenauigkeiten enthalten. Die darin enthaltenen Erkenntnisse und Empfehlungen sollten mit Bedacht interpretiert und ausschließlich als Hilfsmittel für Ihre persönliche und berufliche Weiterentwicklung genutzt werden. Der Bericht ist für einen Zeitraum von 12 bis 18 Monaten gültig.
          main: Der erstellte IDP enthält eine detaillierte Liste von Entwicklungsmaßnahmen, die Sie unter Berücksichtigung bewährter Lernmethoden, d. h. der 70-20-10-Richtlinie, durchführen können. Diese Richtlinie sieht einen progressiven Lernprozess vor, der Unterricht im Klassenzimmer, Coaching und Lernen am Arbeitsplatz kombiniert. Auf der Grundlage der Ergebnisse des Assessment-Center-Prozesses, Ihrer Chat-Antworten und gegebenenfalls externer Berichte wurden mögliche Entwicklungswege empfohlen, die für Ihre Entwicklung in Betracht gezogen werden können.
        learn_cards:
          collaboration:
            list:
            - Bieten Sie an, andere zu coachen oder zu mentorieren
            - Bitten Sie darum, von einem Experten auf Ihrem Gebiet mentoriert zu werden
            - Engagieren Sie einen Coach zur Unterstützung Ihrer Entwicklung
            - Richten Sie eine kollaborative Arbeitsgruppe ein, um laufende Herausforderungen im Unternehmen zu diskutieren
            - Holen Sie sich formelles und informelles Feedback von anderen
            - Spielen Sie eine aktive Rolle in Branchenverbänden und Netzwerken
            - Bauen Sie Ihre eigenen externen Netzwerke auf
            title: Kollaboratives Lernen (20%) <br/> Entwicklung durch andere
          job:
            list:
            - Übernehmen Sie Führungspositionen in Stakeholder- oder Managementausschüssen
            - Melden Sie sich freiwillig, um Veränderungsmanagementprojekte für die Organisation zu leiten
            - Ziehen Sie in Betracht, herausfordernde Aufgaben zu übernehmen
            - Arbeiten Sie funktionsübergreifend zusammen
            - Erwägen Sie, Projekte außerhalb Ihrer Organisation zu leiten
            - Arbeiten Sie eng mit externen Branchenexperten an gemeinsamen Projekten
            title: Lernen am Arbeitsplatz (70%) <br/> Entwicklung durch Erfahrung
          learn:
            list:
            - An strukturierten Schulungsprogrammen teilnehmen
            - Komplette Online-E-Learning-Kurse
            - Bücher, Artikel, Publikationen lesen
            - Erwerben Sie berufliche Qualifikationen, Zertifizierungen und Akkreditierungen.
            - Kurse, Workshops und Seminare besuchen
            title: Formelles Lernen (10%) <br/> Entwicklung durch strukturiertes Lernen
        title: Leitfaden für Ihren IDP
