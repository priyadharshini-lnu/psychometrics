        <h2>AUFBEWAHRUNG IHRER INFORMATIONEN </h2>
        <p>
          Unsere Produkte, Dienstleistungen und gesetzlichen Verpflichtungen sind komplex, und daher variieren unsere Aufbewahrungsfristen für persönliche Daten.  Bei der Festlegung von Aufbewahrungsfristen für personenbezogene Daten und die von uns geführten Aufzeichnungen berücksichtigen wir die folgenden Verpflichtungen:
        </p>
        <ul>
          <li>
            die Notwendigkeit, Informationen aufzubewahren, um die Geschäftszwecke oder vertraglichen Verpflichtungen, für die sie gesammelt wurden, zu erfüllen;

          </li>
          <li>
            unsere Pflichten zur Ausführung der Anweisungen unserer Kunden in Bezug auf personenbezogene Daten, die wir in ihrem Namen verarbeiten;
          </li>
          <li>
            unsere Pflichten zur Einhaltung der gesetzlichen und behördlichen Aufbewahrungspflichten;
          </li>
          <li>
            unsere Backup- und Disaster-Recovery-Verfahren; und
          </li>
          <li>
            andere rechtliche Auswirkungen wie die geltenden Verjährungsfristen.
          </li>
        </ul>
        <p>
          Aufgrund der oben genannten Faktoren können wir personenbezogene Daten über den Zeitraum hinaus aufbewahren, in dem wir Ihnen Dienstleistungen anbieten. Wenn wir personenbezogene Daten nicht länger aufbewahren müssen, verlangen unsere Unternehmensrichtlinien, dass wir die Daten entweder de-identifizieren oder zusammenfassen (in diesem Fall können wir die de-identifizierten oder zusammengefassten Daten zu Analysezwecken weiter aufbewahren und verwenden) oder sie sicher vernichten.
        </p>
