      <h2>AUFBEWAHRUNG IHRER DATEN</h2>
      <p>
        Da unsere Produkte und Dienstleistungen komplex sind und verschiedenen gesetzlichen Verpflichtungen unterliegen, variieren unsere Aufbewahrungsfristen für personenbezogene Daten.  Bei der Festlegung von Aufbewahrungsfristen für personenbezogene Daten und die Aufzeichnungen, die wir führen, berücksichtigen wir die folgenden Verpflichtungen:
      </p>
      <ul>
        <li>
          die Notwendigkeit, Daten aufzubewahren, um Geschäftszwecke oder vertragliche Verpflichtungen zu erfüllen, für die sie erhoben wurden;
        </li>
        <li>
          unsere Pflichten, die Anweisungen unserer Kunden in Bezug auf personenbezogen Daten, die wir in ihrem Namen verarbeiten, auszuführen;
        </li>
        <li>
          unsere Pflichten zur Einhaltung gesetzlicher und behördlicher Aufbewahrungspflichten;
        </li>
        <li>unsere Backup- und Disaster-Recovery-Verfahren sowie</li>
        <li>
          andere rechtliche Auswirkungen, wie etwa die geltenden Verjährungsfristen.
        </li>
      </ul>
      <p>
        Aufgrund der oben genannten Faktoren können wir Ihre personenbezogenen Daten über den Zeitraum hinaus aufbewahren, in dem wir Ihnen Dienstleistungen anbieten. Wenn wir personenbezogene Daten nicht mehr aufbewahren müssen, verlangen unsere Unternehmensrichtlinien, dass wir die Daten entweder anonymisieren oder aggregieren – in diesem Fall können wir die anonymisierten oder aggregierten Daten zu Analysezwecken aufbewahren und verwenden – oder sie sicher vernichten.
      </p>
