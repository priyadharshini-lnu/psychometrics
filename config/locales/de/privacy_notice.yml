      <h2>SCHRITTE, DIE WIR ZUM SCHUTZ PERSONENBEZOGENER DATEN ERGREIFEN </h2>
      <p>
        Unser Unternehmen hat sich dazu verpflichtet, alle geltenden Gesetze zur Cybersicherheit und zum Datenschutz einzuhalten. Zu diesem Zweck hat MMC einen engagierten Chief Information Security Officer (CISO) sowie einen Global Chief Privacy Officer (GCPO) ernannt. Der CISO leitet ein globales Informationssicherheitsteam und ein umfassendes Cybersicherheitsprogramm.  Im Rahmen dieses Programms haben wir wirtschaftlich angemessene physische, administrative und technische Schutzmaßnahmen eingeführt, um personenbezogene Daten vor unbefugtem Zugriff, Verwendung, Änderung und Löschung zu schützen.
      </p>
      <p>
        Der GCPO leitet und überwacht ein Privacy Center of Excellence sowie ein Netzwerk von Datenschutzbeauftragten, die für die Umsetzung unseres umfassenden, globalen Datenschutzprogramms verantwortlich sind. Das Netzwerk der Datenschutzbeauftragten verbindet unsere lokalen Datenschutzbeauftragten und zielt darauf ab, unser Datenschutzprogramm konsequent und gründlich an allen Standorten, an denen wir Daten verarbeiten, umzusetzen. Wenn Sie den Namen und die Kontaktdaten des Datenschutzbeauftragten in Ihrer Gerichtsbarkeit erfahren möchten, schicken Sie uns bitte eine E-Mail an privacy@mmc.com.
      </p>
      <h2>IHRE DATENSCHUTZRECHTE</h2>
      <p>
        In vielen Fällen verarbeiten wir personenbezogene Daten, um Dienstleistungen für unsere Firmenkunden zu erbringen. Wenn Sie Ihre Rechte gemäß den geltenden Datenschutzgesetzen ausüben möchten, sollten Sie sich direkt an diese wenden. Wenn wir jedoch der Verantwortliche sind, d. h. das Unternehmen, das in erster Linie für die Entscheidung über die Verarbeitung Ihrer Daten zuständig ist, haben Sie je nach Gerichtsbarkeit und Grund für die Verarbeitung Ihrer Daten einige oder alle der unten aufgeführten Rechte.  Bitte beachten Sie, dass wir Ihre Identität anhand Ihrer personenbezogenen Daten überprüfen müssen, bevor wir eines dieser Rechte wahrnehmen können.
      </p>
      <ul>
        <li>
          <strong>Zugriffsrecht (Recht auf Auskunft)<br /></strong>Sie können uns auffordern, Ihnen weitere Einzelheiten darüber mitzuteilen, wie wir Ihre personenbezogenen Daten verwenden, welche Quellen wir genutzt haben, welche Kategorien oder bestimmten Teile der personenbezogenen Daten wir erhoben haben, an welche Kategorien von Dritten wir die Daten weitergegeben haben und Sie können eine Kopie der über Sie gespeicherten personenbezogenen Daten anfordern.
        </li>
      </ul>
      <ul>
        <li>
          <strong>Recht auf Berichtigung<br /></strong>Sie können uns auffordern, Ungenauigkeiten in den von uns gespeicherten personenbezogenen Daten zu korrigieren. Wenn wir Ihre personenbezogenen Daten an Dritte weitergeben, werden wir diese nach Möglichkeit über die Korrektur informieren.
        </li>
      </ul>
      <ul>
        <li>
          <strong>Recht auf Löschung<br /></strong>Sie können uns auffordern, Ihre personenbezogenen Daten zu löschen, sofern wir keine rechtmäßigen Gründe mehr für deren Verarbeitung haben.
        </li>
      </ul>
      <ul>
        <li>
          <strong>Recht auf Widerspruch oder Einschränkung der Verarbeitung<br /></strong>Unter bestimmten Umständen haben Sie das Recht, die Verarbeitung Ihrer personenbezogenen Daten einzuschränken, beispielsweise, wenn Sie die Richtigkeit der Daten bestreiten.
        </li>
      </ul>
      <ul>
        <li>
          <strong>Recht auf Datenübertragbarkeit<br /></strong>Soweit dies technisch möglich ist, haben Sie das Recht, von uns zu verlangen, dass wir eine Kopie der von Ihnen erhaltenen personenbezogenen Daten in einem strukturierten, gängigen und maschinenlesbaren Format an einen Dritten Ihrer Wahl übermitteln.
        </li>
      </ul>
      <ul>
        <li>
          <strong>Recht auf Widerruf der Einwilligung<br /></strong>Wenn wir uns bei der Verarbeitung Ihrer personenbezogenen Daten auf Ihre Einwilligung als Rechtsgrundlage verlassen, haben Sie das Recht, diese zu widerrufen.
        </li>
      </ul>
      <ul>
        <li>
          <strong>Beschwerderecht<br /></strong>Sie Bedenken hinsichtlich eines Aspekts unserer Datenschutzpraktiken haben, haben Sie das Recht, eine Beschwerde bei der zuständigen Aufsichts- oder Regulierungsbehörde Ihrer Gerichtsbarkeit einzureichen.
        </li>
      </ul>
      <p>
        Wenn Sie eines der oben genannten Rechte ausüben oder eine Entscheidung bzw. Ablehnung überprüfen lassen möchten, kontaktieren Sie uns bitte über die entsprechenden Kontaktinformationen:
