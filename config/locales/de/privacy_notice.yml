        <h2>SCHRITTE, DIE WIR ZUM SCHUTZ PERSÖNLICHER DATEN UNTERNEHMEN</h2>
        <p>
          Unser Unternehmen ist bestrebt, alle geltenden Gesetze zur Cybersicherheit und zum Datenschutz einzuhalten. Mit diesen Zielen vor Augen hat MMC einen eigenen Chief Information Security Officer (CISO) und einen Global Chief Privacy Officer (GCPO). Der CISO ist für die Leitung eines globalen Informationssicherheitsteams und eines umfassenden Cybersicherheitsprogramms verantwortlich.  Im Rahmen unseres Cybersicherheitsprogramms haben wir wirtschaftlich angemessene physische, administrative und technische Sicherheitsvorkehrungen getroffen, um persönliche Daten vor unbefugtem Zugriff, unbefugter Nutzung, Veränderung und Löschung zu schützen.
        </p>
        <p>
          Der GCPO leitet und beaufsichtigt ein Privacy Center of Excellence und ein Data Protection Officer Network, das für die Umsetzung unseres umfassenden globalen Datenschutzprogramms verantwortlich ist. Das Netzwerk der Datenschutzbeauftragten verbindet unsere Datenschutzbeauftragten auf der ganzen Welt und soll dazu beitragen, dass unser Datenschutzprogramm überall dort, wo wir Daten verarbeiten, konsequent und gründlich umgesetzt wird. Sie können den Namen und die Kontaktinformationen des Datenschutzbeauftragten in Ihrem Land erhalten, indem Sie uns unter privacy@mmc.com kontaktieren.
        </p>
        <h2>IHRE DATENSCHUTZRECHTE</h2>
        <p>
          In vielen Fällen verarbeiten wir personenbezogene Daten, um unsere Dienstleistungen für Firmenkunden zu erbringen, und Sie sollten sich an diese wenden, um Ihre Rechte gemäß den geltenden Datenschutzgesetzen wahrzunehmen. In den Fällen, in denen wir jedoch als für die Verarbeitung Verantwortlicher oder als Unternehmen handeln, das in erster Linie für die Entscheidung über die Verarbeitung Ihrer Daten verantwortlich ist,können Sie  je nach Rechtsprechung und Grund für die Verarbeitung Ihrer Dateneinige oder alle der unten aufgeführtenRechte haben .   Bitte beachten Sie, dass wir Ihre persönlichen Daten möglicherweise verwenden müssen, um Ihre Identität zu überprüfen, bevor wir eines der unten genannten Rechte wahrnehmen.
        </p>
        <ul>
          <li>
            <strong>Recht auf Zugang (Recht auf Wissen) <br /></strong>
            Sie können uns bitten, Ihnen weitere Einzelheiten darüber mitzuteilen, wie wir Ihre persönlichen Daten verwenden, die Quellen, die Kategorien oder bestimmte Teile der persönlichen Daten, die wir gesammelt haben, die Kategorien von Dritten, an die wir die Informationen weitergegeben haben, und eine Kopie der persönlichen Daten anzufordern, die wir über Sie gespeichert haben.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Recht auf Korrektur <br /></strong>
            Sie können uns auffordern, etwaige Ungenauigkeiten in den von uns gespeicherten persönlichen Daten zu aktualisieren. Wenn wir Ihre persönlichen Daten an andere weitergeben, werden wir sie nach Möglichkeit über die Korrektur informieren.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Recht auf Löschung   <br /></strong>
            Sie können uns auffordern, Ihre persönlichen Daten zu löschen, wenn wir keine rechtmäßigen Gründe mehr haben, sie zu verarbeiten.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Recht auf Widerspruch oder Einschränkung der Verarbeitung  <br /></strong>
            Sie haben das Recht, die Verarbeitung Ihrer personenbezogenen Daten unter bestimmten Umständen einzuschränken, z. B. wenn Sie deren Richtigkeit bestreiten.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Recht auf Datenübertragbarkeit  <br /></strong>
            Sie haben das Recht, soweit dies technisch möglich ist, von uns zu verlangen, dass wir eine Kopie der personenbezogenen Daten, die wir von Ihnen erhalten haben, in einem strukturierten, allgemein gebräuchlichen und maschinenlesbaren Format an einen Dritten Ihrer Wahl übermitteln.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Recht auf Widerruf der Zustimmung  <br /></strong>
            Wenn wir uns auf Ihre Einwilligung als Rechtsgrundlage für die Verarbeitung Ihrer personenbezogenen Daten stützen, haben Sie das Recht, diese Einwilligung zu widerrufen.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Recht auf Einreichung einer Beschwerde<br /></strong>
            Sie haben das Recht, eine Beschwerde bei der zuständigen Aufsichts- oder Regulierungsbehörde in Ihrem Land einzureichen, wenn Sie Bedenken bezüglich eines Aspekts unserer Datenschutzpraktiken haben.
          </li>
        </ul>
        <p>
          Wenn Sie eines der oben genannten Rechte ausüben oder eine Überprüfung einer Entscheidung oder Verweigerung beantragen möchten, wenden Sie sich bitte an uns unter den entsprechenden Kontaktdaten:
        </p>
        <ul>
          <li>
            Wenn Sie aus dem Vereinigten Königreich, der Schweiz oder dem Europäischen Wirtschaftsraum kommen, füllen Sie bitte
            <a
              href="https://mmc-dev-privacy.my.onetrust.com/webform/4da460d1-7bcf-4ff1-ac37-c4b804769467/draft/ea953d72-fded-42ee-b1dd-c0a5a83b7891"
              >dieses Formular aus</a
            >
          </li>
          <li>
            Für Personen in anderen Ländern füllen Sie bitte
            <a
              href="https://privacyportal.onetrust.com/webform/ee9df2bb-0ef3-4485-bc63-4db420e77359/225910f5-5666-468a-b1e7-39c70e24f4cc"
              >dieses Formular aus</a
            >
          </li>
          <li>
            Alternativ können Sie uns auch eine E-Mail an <a href="mailto:privacy@mmc.com">privacy@mmc.com</a> schicken.
          </li>
        </ul>
        <p>
          Je nach Land haben Sie möglicherweise auch einige oder alle der folgenden Rechte:
        </p>
        <ul>
          <li>
            <strong>Recht auf Zustimmung oder Ablehnung des Verkaufs oder der gemeinsamen Nutzung für kontextübergreifende Werbung
              <br /></strong>
              Wenn Sie eine unserer Websites besuchen, können wir Ihre Internet- oder andere elektronische Netzwerkaktivitätsdaten, biografische Identifikatoren, geografische Daten und berufliche Informationen (soweit sie aus Ihren Aktivitäten auf unserer Website abgeleitet werden können) an Website-Analyse- und Werbeanbieter für kontextübergreifende verhaltensbezogene oder gezielte Werbezwecke unter Verwendung von Werbe-Cookies weitergeben.  Nach einigen Gesetzen haben Sie das Recht, sich für oder gegen diese Art der Weitergabe zu entscheiden.  Um Ihre Auswahl zu treffen oder die Namen bestimmter Dritter einzusehen, an die wir Ihre Daten verkauft oder weitergegeben haben, klicken Sie bitte auf den Link "Cookies verwalten" am unteren Rand unserer Webseite. Wenn Sie dem Verkauf oder der Weitergabe Ihrer Daten widersprechen möchten, stellen Sie sicher, dass die Kippschalter für die Tracker "Werbung" und "Analyse" auf "Nein" gesetzt sind, oder aktivieren Sie, sofern verfügbar, den Kippschalter "Meine persönlichen Daten nicht verkaufen oder weitergeben".
            <p>
              Sie können auch eine Browsereinstellung oder -erweiterung implementieren, um den von Ihnen besuchten Websites automatisch Ihre Verkaufs- und Freigabepräferenzen mitzuteilen.  Unsere Websites verarbeiten solche "Opt-out-Präferenzsignale" reibungslos, indem sie die Global Privacy Control (GPC) erkennen. Wenn Sie GPC verwenden möchten, können Sie es über einen teilnehmenden Browser oder eine Browsererweiterung herunterladen und aktivieren. Weitere Informationen zum Herunterladen von GPC finden Sie hier.
            </p>
          </li>
        </ul>
        <ul>
          <li>
            <strong>Rechte im Zusammenhang mit der automatisierten Entscheidungsfindung und dem Profiling
              <br /></strong
            >In dem Maße, in dem wir Ihre persönlichen Daten automatisiert verarbeiten, werden wir Ihnen im Voraus alle gesetzlich vorgeschriebenen Mitteilungen, auch über Ihre Rechte, zukommen lassen.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Direktmarketing und "Do Not Track"-Signale<br /></strong>
            Sie haben das Recht, einmal im Jahr eine Mitteilung über die persönlichen Daten anzufordern und zu erhalten, die wir an andere Unternehmen für deren eigene Direktmarketingzwecke weitergegeben haben, sofern dies gesetzlich zulässig ist.  Falls zutreffend, enthält eine solche Mitteilung eine Liste der Kategorien personenbezogener Daten, die weitergegeben wurden (falls zutreffend), sowie die Namen und Adressen aller Dritten, an die die personenbezogenen Daten weitergegeben wurden (falls zutreffend).  Die Mitteilung bezieht sich auf das vorangegangene Kalenderjahr.  Wenn Sie wissen möchten, ob dieses Recht auf Sie zutrifft, und wenn ja, wie Sie dieses Recht ausüben können, wenden Sie sich bitte wie folgt an uns.
          </li>
        </ul>
        <p>
          Bitte beachten Sie, dass einige dieser Rechte eingeschränkt sein können, wenn wir ein übergeordnetes legitimes Interesse oder eine gesetzliche, behördliche oder vertragliche Verpflichtunghaben , die personenbezogenen Daten weiterhin zu verarbeiten, oder wenn die personenbezogenen Daten nach geltendem Recht von der Offenlegung oder Löschung ausgenommen sind.  Einige dieser Rechte können nur unter bestimmten Umständen ausgeübt werden oder sind durch die Datenschutzgesetze in Ihrem Land eingeschränkt.
        </p>
        <h2>GRENZÜBERSCHREITENDE ÜBERWEISUNGEN</h2>
        <p>
          Als globales Unternehmen, das in mehr als 80 Ländern tätig ist, müssen wir unter bestimmten Umständen personenbezogene Daten aus dem Land, der Provinz oder dem Gebiet, in dem sie erfasst wurden, für die in dieser Datenschutzerklärung genannten Zwecke übermitteln. Insbesondere können wir Daten übermitteln, um die Ihnen zur Verfügung gestellten Dienste anzubieten, zu verwalten und zu managen und um die Effizienz unserer Geschäftsabläufe zu verbessern. Wir werden uns nach Kräften bemühen, sicherzustellen, dass bei diesen Übermittlungen alle einschlägigen Datenschutzgesetze eingehalten und die Rechte und Freiheiten des Einzelnen im Rahmen dieser Gesetze angemessen gewahrt werden.
        </p>
        <p>
          Sollte eine solche Übermittlung erforderlich sein, werden wir Maßnahmen ergreifen, um sicherzustellen, dass geeignete Schutzmaßnahmen zum Schutz personenbezogener Daten vorhanden sind, z. B. eine Folgenabschätzung, eine Angemessenheitsentscheidung der zuständigen Aufsichtsbehörde, die Verwendung genehmigter verbindlicher Unternehmensregeln oder Standardvertragsklauseln oder Ihre Zustimmung.
        </p>
