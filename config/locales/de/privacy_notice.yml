      <p>
        Je nach Land haben Sie möglicherweise auch einige oder alle der folgenden Rechte:
      </p>
      <ul>
        <li>
          <strong
            >Recht auf Einwilligung oder Widerspruch gegen den Verkauf oder die Weitergabe für kontextübergreifende Werbung
            <br /></strong
          >Wenn Sie eine unserer Websites besuchen, können wir Ihre Internet- und andere elektronische Netzwerkaktivitätsinformationen, biografische Identifikatoren, Geolokalisierungsdaten sowie berufliche Informationen, die sich aus Ihrer Aktivität auf unserer Website ableiten lassen, an Website-Analyse- und Werbeanbieter weitergeben. Diese nutzen die Informationen für kontextübergreifende, verhaltensbezogene oder gezielte Werbezwecke unter Verwendung von Werbe-Cookies.  Unter Umständen haben Sie gemäß einigen Gesetzen das Recht, diese Arten von Offenlegungen zuzulassen oder abzulehnen.  Um Ihre Auswahl zu treffen oder die Namen von Dritten anzuzeigen, an die wir Ihre Daten verkauft oder weitergegeben haben, klicken Sie bitte unten auf unserer Website auf den Link „Cookies verwalten“. Wenn Sie den Verkauf oder die Weitergabe Ihrer Daten ablehnen möchten, stellen Sie sicher, dass die Schalter für die Tracker „Werbung“ und „Analyse“ auf „Nein“ gesetzt sind. Alternativ können Sie, falls verfügbar, den Schalter „Meine personenbezogenen Daten nicht verkaufen oder weitergeben“ aktivieren.
          <p>
            Alternativ können Sie auch eine Browsereinstellung oder -erweiterung implementieren. Damit werden Ihre Verkaufs- und Freigabeeinstellungen automatisch an die von Ihnen besuchten Websites übermittelt.  Unsere Websites verarbeiten solche „Opt-out-Präferenzsignale“ reibungslos, indem sie die Global Privacy Control (GPC) erkennen. Wenn Sie GPC verwenden möchten, können Sie es über einen teilnehmenden Browser oder eine Browsererweiterung herunterladen und aktivieren. Weitere Informationen zum Herunterladen von GPC finden Sie <a href="https://globalprivacycontrol.org/">hier</a>.
          </p>
        </li>
      </ul>
      <ul>
        <li>
          <strong
            >Rechte in Bezug auf automatisierte Entscheidungsfindung und Profilerstellung
            <br /></strong
          >Wenn wir Ihre personenbezogenen Daten automatisiert verarbeiten, werden wir Sie im Voraus über alle gesetzlich vorgeschriebenen Mitteilungen informieren, einschließlich Ihrer Rechte.
        </li>
      </ul>
      <ul>
        <li>
          <strong>Direktmarketing und Do-Not-Track-Signale<br /></strong>Sie haben das Recht, einmal im Jahr eine Mitteilung über die personenbezogenen Daten anzufordern, die wir an andere Unternehmen für deren eigene Direktmarketingzwecke weitergegeben haben, sofern dies gesetzlich zulässig ist.  Eine solche Mitteilung enthält gegebenenfalls eine Liste der Kategorien der offengelegten personenbezogenen Daten (sofern zutreffend) sowie die Namen und Anschriften aller Dritten, an die diese Daten weitergegeben wurden (sofern zutreffend).  Die Mitteilung bezieht sich auf das vorangegangene Kalenderjahr.  Wenn Sie erfahren möchten, ob dieses Recht auf Sie zutrifft und Sie es gegebenenfalls ausüben möchten, können Sie uns wie unten angegeben kontaktieren.
        </li>
      </ul>
      <p>
        Bitte beachten Sie, dass einige dieser Rechte unter Umständen eingeschränkt sein können, wenn wir ein übergeordnetes berechtigtes Interesse oder eine gesetzliche, behördliche oder vertragliche Verpflichtung zur Weiterverarbeitung der personenbezogenen Daten haben. Das Gleiche gilt, wenn die personenbezogenen Daten nach geltendem Recht von der Offenlegung oder Löschung ausgenommen sind.  Einige dieser Rechte können nur unter bestimmten Umständen ausgeübt werden und sind möglicherweise durch die Datenschutzgesetze in Ihrer Gerichtsbarkeit eingeschränkt.
      </p>
      <h2>GRENZÜBERSCHREITENDE ÜBERTRAGUNGEN</h2>
      <p>
        Da wir als globales Unternehmen in über 80 Ländern tätig sind, kann es erforderlich sein, dass wir personenbezogene Daten zu den in dieser Datenschutzerklärung genannten Zwecken außerhalb des Landes, der Provinz oder des Territoriums übermitteln, in dem sie erhoben wurden. Insbesondere können wir Daten übertragen, um unsere Dienstleistungen zu erbringen, zu verwalten und zu managen sowie um die Effizienz unserer Geschäftsabläufe zu verbessern. Wir unternehmen alle Anstrengungen, um sicherzustellen, dass bei diesen Übertragungen alle relevanten Datenschutzgesetze eingehalten werden und die Rechte und Freiheiten von Einzelpersonen gemäß diesen Gesetzen angemessen geschützt sind.
      </p>
      <p>
        Sollte eine solche Übertragung erforderlich sein, werden wir geeignete Maßnahmen ergreifen, um den Schutz personenbezogener Daten sicherzustellen. Dazu zählen beispielsweise eine Folgenabschätzung, eine Angemessenheitsentscheidung der zuständigen Aufsichtsbehörde, die Verwendung genehmigter, verbindlicher Unternehmensregeln oder Standardvertragsklauseln sowie Ihre Zustimmung.
      </p>
