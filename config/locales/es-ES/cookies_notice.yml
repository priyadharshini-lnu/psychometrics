  cookies_notice: |-
    <h2>Aviso sobre cookies</h2>

    <p>Fecha de entrada en vigor: 14 de diciembre 2023</p>

    <p>
    En este sitio web utilizamos cookies y tecnologías de seguimiento relacionadas, incluyendo balizas web, píxeles de seguimiento y archivos de registro (denominados colectivamente “cookies”) para distinguirle de otros usuarios, evaluar y mejorar la funcionalidad del sitio web y de nuestros servicios, y ofrecerle una buena experiencia.
    </p>

    <p><strong>QUÉ ES UNA COOKIE</strong></p>

    <p>
    Las cookies son fragmentos de información compartidos entre su navegador web y un sitio web. Algunas cookies son necesarias para que el sitio web funcione. Otras nos ayudan a evaluar y mejorar su rendimiento. También utilizamos cookies como ayuda para ofrecerle contenidos, productos y servicios relevantes. Una cookie no puede leer datos del disco duro de su ordenador.
    </p>

    <p>Hay distintos tipos de cookies con diferentes funciones:</p>

    <p>
    (i) <strong>Cookies de sesión:</strong> estas cookies solo se almacenan en su ordenador durante su sesión web. Se eliminan automáticamente cuando se cierra el navegador. Suelen almacenar un identificador de sesión anónimo que le permite navegar por un sitio web sin tener que iniciar sesión en cada página. No recopilan ninguna información de su ordenador.
    </p>

    <p>
    (ii) <strong>Cookies persistentes:</strong> estas cookies se almacenan como un archivo en su ordenador y permanecen allí cuando usted cierra su navegador. Pueden ser leídas por el sitio web que las creó cuando usted vuelve a visitar el sitio web.
    </p>

    <p>
    (iii) <strong>Cookies propias:</strong> estas cookies son creadas por nuestra empresa. Se almacenan y envían entre nuestros servidores y el disco duro de su ordenador. Estas cookies pueden ser de sesión o persistentes.
    </p>

    <p>
    (iv) <strong>Cookies de terceros:</strong> estas cookies son creadas por uno de nuestros socios externos. Se almacenan y envían entre el servidor del tercero y el disco duro de su ordenador. Estas cookies suelen ser cookies persistentes.
    </p>

    <p><strong>CÓMO Y POR QUÉ UTILIZAMOS LAS COOKIES</strong></p>

    <p>Dependiendo del sitio web, podemos utilizar cookies para los siguientes fines:</p>

    <p><strong>Cuando sea estrictamente necesario</strong></p>

    <p>
    Estas cookies son esenciales para permitirle moverse por el sitio web y utilizar sus funciones, como acceder a áreas seguras del sitio web. Sin estas cookies no se pueden prestar los servicios que usted ha solicitado, como la obtención de un presupuesto o el inicio de sesión en su cuenta. Estas cookies no recogen información sobre usted que pueda ser utilizada con fines de marketing o para recordar dónde ha estado en Internet.
    </p>

    <p><strong>Funcionalidad</strong></p>

    <p>
    Estas cookies permiten que nuestro sitio web recuerde las elecciones que usted hace (como su nombre de usuario, el idioma o la región en la que se encuentra) y que le proporcione funciones mejoradas. Por ejemplo, un sitio web puede ser capaz de recordar sus datos de inicio de sesión, para que no tenga que iniciar sesión repetidamente en su cuenta cuando utilice un dispositivo concreto para acceder a nuestro sitio web. Estas cookies también pueden utilizarse para recordar los cambios que ha realizado en el tamaño del texto, la fuente y otras partes de las páginas web que puede personalizar. También pueden utilizarse para proporcionarle servicios que haya solicitado, como ver un vídeo o comentar un artículo. La información que recogen estas cookies suele estar desidentificada.
    </p>

    <p><strong>Analíticas</strong></p>

    <p>
    Estas cookies recopilan información sobre cómo utilizan los visitantes un sitio web, por ejemplo, qué páginas visitan con más frecuencia y si reciben mensajes de error de las páginas web. También nos permiten registrar y contar el número de visitantes del sitio web, lo que nos permite ver cómo utilizan el sitio web los visitantes para mejorar su funcionamiento.
    </p>

    <p><strong>Publicidad</strong></p>

    <p>
    Estas cookies se utilizan con el fin de mostrar anuncios que sean relevantes para usted y para gestionar el rendimiento de los anuncios. Las cookies de publicidad son generalmente cookies de terceros y pueden estar presentes incluso si no hay publicidad en el sitio web.
    </p>

    <p><strong>Direcciones IP</strong></p>

    <p>
    Cuando usted visita nuestro sitio web, podemos recopilar sus direcciones de Protocolo de Internet (“IP”) para hacer un seguimiento y agregar información no personal. Por ejemplo, podemos utilizar las direcciones IP para monitorizar las regiones desde las que los usuarios navegan por el sitio web.
    </p>

    <p><strong>CÓMO GESTIONAR LAS COOKIES</strong></p>

    <p>
    Haga clic en el enlace “Gestionar cookies” situado en la parte inferior de la página para aceptar o rechazar determinadas cookies mediante nuestro Gestor de consentimiento de cookies. Tenga en cuenta que no es posible rechazar las cookies estrictamente necesarias, por lo que los sitios web que solo utilizan este tipo de cookies podrían no ofrecer este enlace.
    </p>

    <p>
    También puede deshabilitar ciertas cookies a través de la configuración del navegador. Visite la sección «Ayuda» de su navegador para saber cómo gestionar su configuración de cookies.
    </p>

    <p><strong>EL AVISO DE COOKIES NO SE APLICA A SITIOS WEB DE TERCEROS</strong></p>

    <p>
    Cuando incluyamos enlaces a otros sitios web, tenga en cuenta que estos sitios web tendrán sus propias políticas de privacidad y de cookies que regirán el uso de cualquier información que usted envíe. Le recomendamos que lea sus políticas, ya que no somos responsables de sus prácticas de privacidad.
    </p>

    <p><strong>CAMBIOS EN EL AVISO DE COOKIES</strong></p>

    <p>
    Es posible que actualicemos esta política ocasionalmente y le recomendamos que la revise de vez en cuando para mantenerse informado sobre el uso que hacemos de las cookies. Publicamos la fecha de entrada en vigor de la política en la parte superior de la página.
    </p>

    <p><strong>DESCRIPCIÓN DE LAS COOKIES UTILIZADAS</strong></p>

    <p>
    Haga clic en el enlace “Gestionar cookies” en el pie de página del sitio web para encontrar información sobre las cookies individuales utilizadas en el sitio web. En algunos casos, es posible que el enlace no esté disponible, por ejemplo, cuando solo utilizamos cookies estrictamente necesarias.
    </p>

    <p><strong>CONTACTO</strong></p>

    <p>
    Si tiene alguna pregunta sobre este Aviso de cookies, póngase en contacto con nosotros tal y como se indica en nuestro Aviso de privacidad, accesible a través del enlace a continuación.
    </p>
