            Si se encuentra en el Reino Unido, Suiza o el Espacio Económico Europeo,
            <a
              href="https://mmc-dev-privacy.my.onetrust.com/webform/4da460d1-7bcf-4ff1-ac37-c4b804769467/draft/ea953d72-fded-42ee-b1dd-c0a5a83b7891"
              >cumpliméntese el presente formulario.</a
            >
          </li>
          <li>
            Para personas de otros países,
            <a
              href="https://privacyportal.onetrust.com/webform/ee9df2bb-0ef3-4485-bc63-4db420e77359/225910f5-5666-468a-b1e7-39c70e24f4cc"
              >rellene este formulario  </a
            >
          </li>
          <li>
            También puede enviarnos un correo electrónico a
            <a href="mailto:privacy@mmc.com">privacy@mmc.com</a>
          </li>
        </ul>
        <p>
          Dependiendo de su país, también puede tener algunos o todos los derechos siguientes:
        </p>
        <ul>
          <li>
            <strong>Derecho a optar por la venta o la compartición para publicidad en varios contextos
              <br /></strong>
              Si visita uno de nuestros sitios web, podemos revelar su información de actividad en Internet u otras redes electrónicas, identificadores biográficos, datos de geolocalización e información profesional (en la medida en que pueda derivarse de su actividad en nuestro sitio web) a proveedores de análisis y publicidad de sitios web con fines de publicidad dirigida o conductual entre contextos utilizando cookies publicitarias.  En virtud de algunas leyes, usted puede tener derecho a optar por recibir o no este tipo de comunicaciones.  Para realizar su(s) selección(es) o ver los nombres de terceros específicos con los que hemos vendido o compartido su información, haga clic en el enlace "Gestionar cookies" situado en la parte inferior de nuestra página web. Si no desea que se venda o comparta su información, asegúrese de que los botones de seguimiento de "Publicidad" y "Análisis" estén en "No" o, si está disponible, active el botón No vender ni compartir mi información personal.
            <p>
              También puede implementar una configuración o extensión del navegador para comunicar automáticamente sus preferencias de venta y uso compartido a los sitios web que visita.  Nuestros sitios web procesan dichas "señales de preferencia de exclusión voluntaria" de manera fluida mediante el reconocimiento del Control Global de Privacidad (GPC) de. Si desea utilizar la GPC, puede descargarla y activarla a través de un navegador participante o una extensión del navegador. Encontrará más información sobre la descarga de GPC en aquí.
            </p>
          </li>
        </ul>
        <ul>
          <li>
            <strong>Derechos en relación con la toma de decisiones automatizada y la elaboración de perfiles
              <br /></strong
            >En la medida en que nos dediquemos al tratamiento automatizado de sus Datos Personales, le proporcionaremos con antelación los avisos, incluidos los relativos a sus derechos, que exija la ley.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Marketingdirecto y señales Do Not Track  <br /></strong>
            Usted puede tener derecho a solicitar y obtener un aviso una vez al año sobre la Información Personal que revelamos a otras empresas para sus propios fines de marketing directo, cuando lo permita la ley.  En su caso, dicha notificación incluirá una lista de las categorías de Datos Personales que fueron divulgados (si los hubiere) y los nombres y direcciones de todos los terceros a los que se divulgaron los Datos Personales (si los hubiere).  La notificación abarcará el año civil anterior.  Puede ponerse en contacto con nosotros como se indica a continuación si desea saber si se le aplica este derecho y, en caso afirmativo, ejercerlo.
          </li>
        </ul>
        <p>
          Tenga en cuenta que algunos de estos derechos pueden estar limitados cuando tengamos un  interéslegítimopreponderante  o la obligación legal, reglamentaria o contractual de seguir tratando los Datos Personales, o cuando los Datos Personales puedan estar exentos de divulgación o supresión en virtud de la legislación aplicable.  Algunos de estos derechos sólo pueden ejercerse en determinadas circunstancias o pueden estar limitados por la legislación sobre protección de datos de su jurisdicción.
        </p>
        <h2>TRANSFERENCIAS TRANSFRONTERIZAS   </h2>
        <p>
          Como empresa global que opera en más de 80 países, existen circunstancias en las que tendremos que transferir Datos Personales fuera del país, provincia o territorio en el que fueron recogidos para los fines descritos en este Aviso de Privacidad. En concreto, podemos transferir datos para ofrecer, administrar y gestionar los Servicios que le proporcionamos, y para mejorar la eficiencia de nuestras operaciones comerciales. Haremos todo lo posible para garantizar que estas transferencias se ajusten a toda la legislación pertinente en materia de protección de datos, y que los derechos y libertades de las personas en virtud de dichas leyes estén debidamente protegidos.
        </p>
        <p>
          Cuando surja la necesidad de dicha transferencia, tomaremos medidas para garantizar que existen las salvaguardias adecuadas para proteger la Información Personal, como una evaluación de impacto, una decisión de adecuación por parte de la autoridad supervisora competente, el uso de normas corporativas vinculantes aprobadas o cláusulas contractuales estándar, o su consentimiento.
        </p>
