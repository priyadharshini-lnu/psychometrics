        <h2>CONSERVACIÓN DE SUS DATOS</h2>
        <p>
          Nuestros productos, servicios y obligaciones normativas son complejos, por lo que nuestros periodos de conservación de la Información Personal varían.  Tenemos en cuenta las siguientes obligaciones a la hora de establecer los periodos de conservación de la Información Personal y los registros que mantenemos:
        </p>
        <ul>
          <li>
            la necesidad de conservar la información necesaria para cumplir los objetivos empresariales o las obligaciones contractuales para los que se recopiló;
          </li>
          <li>
            nuestras obligaciones de ejecutar las instrucciones de nuestros clientes con respecto a la Información Personal que procesamos en su nombre;
          </li>
          <li>
            nuestras obligaciones para cumplir con los requisitos legales y reglamentarios obligatorios de mantenimiento de registros;
          </li>
          <li>
            nuestros procedimientos de copia de seguridad y recuperación en caso de catástrofe; y
          </li>
          <li>
            otros impactos jurídicos, como la ley aplicable de los plazos de prescripción.
          </li>
        </ul>
        <p>
          En función de los factores anteriores, podemos conservar los Datos Personales más allá del periodo durante el cual le prestemos servicios. Cuando ya no necesitemos conservar los Datos Personales, las políticas de nuestra empresa exigen que desidentifiquemos o agreguemos la información (en cuyo caso podremos seguir conservando y utilizando la información desidentificada o agregada con fines analíticos) o que la destruyamos de forma segura.
        </p>
