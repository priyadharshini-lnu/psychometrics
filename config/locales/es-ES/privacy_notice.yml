        <h2>CÓMO RECOPILAMOS LA INFORMACIÓN PERSONAL</h2>
        <h3>
          <strong
            >Información facilitada por usted, sus representantes o terceros</strong
          >
        </h3>
        <p>Podemos recopilarInformación Personal de las siguientes fuentes:</p>
        <ul>
          <li>
            Directamente de usted, por ejemplo, cuando visita un sitio web, crea una cuenta, rellena una encuesta o nos facilita información de cualquier otro modo.
          </li>
          <li>
            Sus representantes, incluida su empresa, asociación o grupo o patrocinador del programa/plan de prestaciones.
          </li>
        </ul>
        <p>
          Durante la evaluación, es posible que se recopile información personal a través de su cámara web, micrófono u otros elementos de hardware de su sistema. Su sistema y el programa MTE le pedirán su consentimiento antes de recopilar información personal de su hardware.
        </p>
        <p>
          Si nos facilita Datos Personales sobre otras personas (por ejemplo, familiares, beneficiarios o personas a su cargo), declara que tiene autoridad para facilitarlos y que ha compartido esteAviso de Privacidad cuando proceda. No recopilamos conscientemente información personal directamente de menores.
        </p>
        <h3><strong>Recogida por medios automatizados</strong>&nbsp;</h3>
        <p>
         Utilizamos cookies y tecnologías de seguimiento relacionadas ("Cookies") en nuestros sitios web propiedad de la empresa. Si está disponible según su jurisdicción, los usuarios del sitio web pueden optar por que no utilicemos determinadas cookies de utilizando el enlace Gestionar cookies situado en la parte inferior del sitio web. Para obtener más información sobre cómo utilizamos las cookies, consulte nuestro
          <a href="https://www.mercer.com/en-sa/footer/mercer-cookie-notice/"
            >Aviso sobre cookies</a
          >.&nbsp;
        </p>
        <h3><strong>Recaudación por terceros  </strong>&nbsp;</h3>
        <p>
          Si usted realiza una transacción a través de nosotros, un tercero (por ejemplo, un proveedor de servicios o una aseguradora) puede recopilar y procesar información sobre su tarjeta de crédito u otra información personal, incluso a través de cookies, en relación con dicha transacción. En esos casos, y para cualquier otro acuerdo en el que recibamos información de su empleador, asociación u otro tercero, le recomendamos que lea la política de privacidad del tercero para saber más sobre cómo utilizarán y divulgarán su información.
        </p>
