        <h2>MEDIDAS QUE TOMAMOS PARA PROTEGER LA INFORMACIÓN PERSONAL</h2>
        <p>
          Nuestra empresa se esfuerza por cumplir todas las leyes aplicables en materia de ciberseguridad y protección de datos. Con estos objetivos en mente, MMC cuenta con un Chief Information Security Officer (CISO) y un Global Chief Privacy Officer (GCPO). El CISO es responsable de gestionar un equipo global de seguridad de la información y un programa integral de ciberseguridad.  Como parte de nuestro programa de seguridad cibernética, hemos implementado salvaguardas físicas, administrativas y técnicas comercialmente razonables para proteger la Información Personal del acceso, uso, alteración y eliminación no autorizados.
        </p>
        <p>
          El GCPO dirige y supervisa un Centro de Excelencia de Privacidad y una Red de Responsables de Protección de Datos encargados de aplicar nuestro completo programa global de privacidad. La Red de Responsables de Protección de Datos conecta a nuestros responsables de protección de datos en todo el mundo y trata de aplicar nuestro programa de privacidad de forma coherente y exhaustiva allí donde procesamos datos. Puede obtener el nombre y la información de contacto del responsable de protección de datos de su jurisdicción poniéndose en contacto con nosotros en <a href="mailto:privacy@mmc.com">privacy@mmc.com</a>.
        </p>
        <h2>SUS DERECHOS EN MATERIA DE PROTECCIÓN DE DATOS  </h2>
        <p>
          En muchos casos, tratamos Datos Personales para prestar nuestros servicios a clientes corporativos, y usted debe ponerse en contacto con ellos para ejercer cualquier derecho que pueda tener en virtud de las leyes de privacidad aplicables. Sin embargo, cuando actuamos como responsable del tratamiento o empresa que es la principal responsable de decidir cómo se procesa su información,usted puede tener algunos o todos los derechos enumerados a continuación, dependiendo de la jurisdicción y de nuestro motivo para procesar su información.  Tenga en cuenta que es posible que necesitemos utilizar sus Datos Personales para verificar su identidad antes de responder a cualquiera de los derechos indicados a continuación.
        </p>
        <ul>
          <li>
            <strong>Derecho de acceso (derecho a saber) <br /></strong>
            Puede pedirnos que le proporcionemos más detalles sobre cómo utilizamos su información personal, las fuentes, las categorías o elementos específicos de información personal que hemos recopilado, las categorías de terceros a los que hemos revelado la información y solicitar una copia de la información personal que tenemos sobre usted.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Derecho de rectificación  <br /></strong>
            Puede pedirnos que actualicemos cualquier inexactitud en la Información Personal que tenemos. Si revelamos sus Datos Personales a terceros, les informaremos de la corrección siempre que sea posible.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Derecho de supresión   <br /></strong>
            Puede pedirnos que borremos sus Datos Personales cuando ya no tengamos motivos legales para procesarlos.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Derecho a oponerse al tratamiento o a limitarlo  <br /></strong>
            Usted puede tener derecho a restringir el tratamiento de sus Datos Personales en determinadas circunstancias, como cuando impugna su exactitud.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Derecho a la portabilidad de los datos  <br /></strong>
            Usted puede tener derecho, cuando sea técnicamente factible, a solicitar que transfiramos a un tercero de su elección una copia de la Información Personal que hemos obtenido de usted, en un formato estructurado, de uso común y lectura mecánica.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Derecho a retirar el consentimiento <br /></strong>
            Si nos basamos en su consentimiento como base jurídica para el tratamiento de sus Datos Personales, tiene derecho a retirar dicho consentimiento.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Derecho a presentar una reclamación<br /></strong>
            Puede tener derecho a presentar una reclamación ante la autoridad supervisora o reguladora pertinente de su jurisdicción si tiene alguna duda sobre cualquier aspecto de nuestras prácticas de privacidad.
          </li>
        </ul>
        <p>
          Si desea ejercer alguno de los derechos anteriores o solicitar la revisión de una decisión o denegación, póngase en contacto con nosotros utilizando la información de contacto correspondiente:
        </p>
        <ul>
