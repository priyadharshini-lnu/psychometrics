        <h1><strong>MERCER TALENT ENTERPRISE AVISO DE PRIVACIDAD</strong></h1>
        <p>Fecha de entrada en vigor: 15 septembre 2024</p>
        <p>
          El presente Aviso de Privacidad describe cómo Mercer Talent Enterprise ("<strong>MTE</strong>"), recopila, utiliza, comparte, retiene, transfiere y procesa de otro modo la información relativa a personas identificadas o identificables (Información Personal), y los derechos que usted puede tener con respecto a su Información Personal. Creemos que es importante que entienda cómo procesamos la información personal y le animamos a que dedique un momento a familiarizarse con nuestras prácticas de privacidad que se describen a continuación.
        </p>
        <p>
          Tenga en cuenta que MTE es un proveedor de soluciones de evaluación de ciencias del comportamiento y que, en algunos casos, actuamos en nombre y bajo las instrucciones de clientes, instituciones financieras, comerciantes y otros socios que actúan como controladores de datos, incluso para procesar transacciones de pago. Consulte las políticas de privacidad de dichos socios para obtener más información sobre el tratamiento de sus datos personales en estos contextos.
        </p>
        <h2>CUÁL ES NUESTRA RELACIÓN CON USTED</h2>
        <p>
          Un tercero le pide que complete una evaluación en la plataforma de MTE. Este tercero es cliente de MTE y puede ser su empleador, empleador potencial u otra parte relacionada. MTE recoge y procesa su Información Personal en nombre de nuestros clientes. Seguimos las instrucciones proporcionadas por nuestros clientes sobre qué Información Personal recopilar y cómo procesar dicha Información Personal. Por lo tanto, MTE actúa como Procesador para nuestros clientes que determinan el procesamiento de su Información Personal.
        </p>
        <p>
          En la medida en que tenga preguntas sobre el tratamiento de sus Datos Personales, le animamos a que visite el aviso de privacidad de nuestro cliente.
        </p>
