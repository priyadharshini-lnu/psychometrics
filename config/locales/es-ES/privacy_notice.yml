        <h3><strong>Enlaces externos</strong>&nbsp;</h3>
        <p>
          Nuestros sitios web pueden incluir enlaces a sitios web gestionados por organizaciones distintas de MTE.  Si accede al sitio web de otra organización utilizando un hipervínculo de nuestro sitio web, la otra organización podrá recabar información sobre usted.  MTE no es responsable del contenido ni de las prácticas de privacidad de los sitios web enlazados ni del uso que hagan de su Información personal.  Si abandona un sitio web de MTE a través de un enlace de este tipo (puede saber dónde se encuentra comprobando la URL en la barra de ubicación de su navegador), debe consultar las políticas de privacidad, condiciones de uso y otros avisos de ese sitio web para determinar cómo tratará la otra organización cualquier Información personal que recopile de usted.
        </p>
