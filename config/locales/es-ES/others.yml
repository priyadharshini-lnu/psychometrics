    instruction_modal:
      campaign_start_final_instructions: |
        <p>
          Ten en cuenta que no hay forma de detener o pausar el temporizador. El temporizador de la campaña seguirá funcionando incluso si cierras el navegador, por lo que en ningún momento deberías pensar en dejar las tareas a medias para hacer otra cosa. Asegúrate de minimizar las distracciones durante las tareas. Encuentra un entorno tranquilo, apaga las notificaciones en tus dispositivos y evita realizar múltiples tareas. Mantén tu concentración y permanece enfocado. Una vez que el temporizador de la campaña se agote, no podrás continuar. Si has leído las instrucciones anteriores, haz clic en iniciar para continuar con las tareas asignadas.
        </p>
      campaign_start_instruction: |
        <h4>Por favor, lee las siguientes instrucciones cuidadosamente.</h4>
        <p>
          Las tareas que estás a punto de comenzar están cronometradas. Una vez que hagas clic en "Iniciar", el temporizador de la campaña comenzará automáticamente. Tienes %{minutes} minutos para completar todas las actividades. Por favor, intenta completar las tareas dentro del tiempo designado y administra el tiempo de manera efectiva para evitar apresurarte en el proceso de evaluación. Asegúrate de completar las tareas de una sola vez, por lo que si necesitas tomar un descanso, ahora es el momento.
        </p>
      common_proctoring_instructions: |
        <h4>Supervisión</h4>
        <p>
          Al hacer clic en el botón Iniciar, serás redirigido a nuestro sistema de supervisión. Este monitoreará tu cámara, micrófono y pantalla durante tu sesión. Estas sesiones son supervisadas automáticamente por nuestro sofisticado sistema de IA, proporcionando una experiencia de usuario ininterrumpida y fluida. Sin embargo, las sesiones también pueden ser revisadas por supervisores humanos. Cualquier signo de mala conducta o irregularidades será señalado. Esto se hace para garantizar que no se realicen intentos de trampa. Si se encuentran sospechas, tus tareas serán canceladas.
        </p>
      lockdown_browser_instruction: |
        <h4>Navegador de supervisión</h4>
        <p>
          Se te pedirá que descargues e instales un navegador especial para completar las tareas supervisadas. Por favor, sigue las instrucciones en la siguiente pantalla. Puedes desinstalarlo después de completar todas las actividades requeridas.
        </p>
