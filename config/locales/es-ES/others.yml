    instruction_modal:
      campaign_start_final_instructions: |
        <p>
          Recuerde que el temporizador no puede pararse ni pausarse. El temporizador de la campaña seguirá avanzando aunque cierre el navegador, así que no debe dejar las tareas a medias para hacer otra cosa. Procure que no haya nada que le distraiga durante las tareas. Busque un lugar tranquilo, desactive las notificaciones de sus dispositivos y evite realizar varias tareas a la vez. Mantenga la concentración y no se disperse. Cuando el temporizador de la campaña llegue a cero, no podrá continuar. Si ya ha leído las instrucciones anteriores, haga clic en «Iniciar» para continuar con las tareas asignadas.
        </p>
      campaign_start_instruction: |
        <h4>Lea con atención las siguientes instrucciones.</h4>
        <p>
        La(s) tarea(s) que está a punto de comenzar tiene(n) un límite de tiempo. Cuando haga clic en «Iniciar», se activará automáticamente el temporizador de la campaña. Tendrá %{minutes} minutos para completar todas las actividades. Intente completar las tareas en el plazo de tiempo establecido y administre bien el tiempo para evitar las prisas en el proceso de evaluación. Procure completar las tareas de una vez. Si necesita tomarse un descanso, hágalo ahora.
        </p>
      common_proctoring_instructions: |
        <h4>Evaluación remota</h4>
        <p>
          En cuanto haga clic en el botón «Iniciar», se le redirigirá a nuestro sistema de evaluación remota. Controlará la cámara, el micrófono y la pantalla durante su sesión. Estas sesiones las evalúa automáticamente y de forma remota nuestro sofisticado sistema de IA, por lo que disfrutará de una experiencia de usuario fluida y sin interrupciones. En cualquier caso, cabe la posibilidad de que las sesiones las evalúen humanos de forma remota. Se registrará cualquier señal de conducta indebida o irregularidades. Hacemos esto para impedir que se intente hacer trampas. Si hay algo sospechoso, su(s) tarea(s) quedará(n) cancelada(s).
        </p>
      lockdown_browser_instruction: |
        <h4>Navegador para la evaluación remota</h4>
        <p>
          Se le pedirá que descargue e instale un navegador especial para completar las tareas evaluadas de forma remota. Siga las instrucciones de la pantalla siguiente. Podrá desinstalarlo cuando complete las actividades asignadas.
        </p>
