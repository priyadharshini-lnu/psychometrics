            r1: Tenga en cuenta que esta lista es meramente indicativa y que se pueden considerar otras vías de desarrollo en función de sus aspiraciones personales, las recomendaciones de su superior y las prioridades empresariales de la organización.
            r2: Se anima a los usuarios a revisar críticamente todo el contenido y son libres de modificar, perfeccionar, sustituir o añadir cualquier acción o recomendación con la que no estén de acuerdo.
            r3: 'Los datos sobre desarrollo incluidos en este informe pueden proceder de una o ambas de las siguientes fuentes:'
            r3a: Una biblioteca de desarrollo personalizada creada para su organización.
            r3b: Sugerencias de desarrollo generadas por IA
            r4: Este informe IDP se ha elaborado con la ayuda de tecnología de inteligencia artificial y puede contener imprecisiones. Las conclusiones y recomendaciones que se ofrecen deben interpretarse con cautela y utilizarse únicamente como herramienta para su desarrollo personal y profesional. El informe tiene una validez de entre 12 y 18 meses.
          main: El IDP creado incluye una lista detallada de acciones de desarrollo que puede llevar a cabo, teniendo en cuenta las mejores prácticas de aprendizaje, es decir, la directriz 70-20-10, que proporciona un recorrido progresivo que combina el aprendizaje en el aula, el coaching y el aprendizaje en el puesto de trabajo. Basándose en los resultados del proceso del centro de evaluación, sus respuestas en el chat y los informes externos, según corresponda, se han recomendado posibles vías de desarrollo que pueden tenerse en cuenta para su desarrollo.
        learn_cards:
          collaboration:
            list:
            - Ofrezca entrenar o ser mentor de otros
            - Solicite ser mentorizado por un experto en su campo
            - Consiga un coach para apoyar su desarrollo
            - Establezca un grupo de trabajo colaborativo para discutir los desafíos actuales en el negocio
            - Obtenga retroalimentación formal e informalmente de otros
            - Desempeñe un papel activo en asociaciones y redes de la industria
            - Construya sus propias redes externas
            title: Aprendizaje Colaborativo (20%) <br/> Desarrollándose a través de otros
          job:
            list:
            - Asuma posiciones de liderazgo en comités de partes interesadas o de gestión
            - Ofrezca liderar proyectos de gestión de cambio para la organización
            - Considere asumir tareas desafiantes
            - Trabaje de forma colaborativa con otras funciones
            - Considere liderar proyectos fuera de su organización
            - Trabaje estrechamente con expertos externos de la industria en proyectos conjuntos
            title: Aprendizaje en el Trabajo (70%) <br/> Desarrollándose a través de la experiencia
          learn:
            list:
            - Asistir a programas de formación estructurados.
            - Cursos completos de aprendizaje electrónico en línea
            - Leer libros, artículos, publicaciones.
            - Obtener cualificaciones profesionales, certificaciones y acreditaciones.
            - Asistir a cursos, talleres y seminarios.
            title: Aprendizaje Formal (10%) <br/> Desarrollándose a través del aprendizaje estructurado
