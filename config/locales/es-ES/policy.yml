      Versión 4.0

      Actualizada el: 29 de mayo de 2025

      Con el fin de garantizar su participación significativa en esta actividad, algunos de sus datos personales serán recogidos y procesados.
      La actividad está siendo administrada por Mercer Talent Enterprise en nombre y por instrucción de nuestro cliente, quien determina la finalidad del tratamiento de su información personal, y cómo podemos utilizarla. Tenga en cuenta que su información puede ser transferida a través de las fronteras nacionales como parte de los servicios prestados a nuestros clientes. En tal caso, nosotros actuamos como importadores de datos y nuestro cliente actúa como exportador de datos. Cualquier transferencia internacional de información personal se llevará a cabo de conformidad con la legislación aplicable en materia de protección de datos.

      Para obtener más información sobre cómo procesamos su información personal, haga clic aquí para leer nuestro aviso de privacidad global: [GLOBAL_PRIVACY_LINK]

      Para más información sobre cómo nuestro cliente procesa su información personal, por favor lea su aviso de privacidad: [CLIENT_PRIVACY_LINK]
