    video: Video
    video_and_audio: Video a audio
    video_and_audio_recording: Záznam videa a zvuku
    video_check_description: Toto je kontrola systému před testem. Nahrajete 30sekundové video pro otestování zvuku a obrazu. Mluvte prosím nepřetržitě a nezastavujte se, dokud se nahrávání automaticky neukončí.
    video_check_fix_fifth: Pokud máte externí kameru, zkuste ji odpojit a znovu připojit
    video_check_fix_first: Až vás prohlížeč požádá o oprávnění k použití kamery, klikněte na „Povolit“
    video_check_fix_fourth: Zkontrolujte, zda je kamera připojená a zapnutá
    video_check_fix_second: Přejděte do nastavení prohlížeče a povolte této stránce přístup k fotoaparátu
    video_check_fix_sixth: Restartujte prohlížeč a zkuste to znovu
    video_check_fix_third: Ukončete ostatní aplikace, které využívají kameru (Zoom, Teams atd.)
    video_overlay_label: Vyberte mikrofon a kameru, klikněte na tlačítko Nahrát a poté, co stisknete tlačítko Nahrát, přečtěte následující zprávu
    video_overlay_message: Vyberte mikrofon a kameru, klikněte na tlačítko Nahrát a poté nahlas přečtěte a 3krát zopakujte větu, která se zobrazí v dolní části obrazovky.
    video_recorder_label: Videorekordér
    video_upload_failed_camera_access: Nelze získat přístup k vaší kameře nebo mikrofonu. Zkontrolujte prosím oprávnění zařízení a zkuste to znovu.
    video_upload_failed_chunk_upload: Část nahrávky se nepodařilo nahrát. Zkontrolujte prosím připojení k internetu a zkuste to znovu.
    video_upload_failed_finalize: Záznam byl pořízen, ale nepodařilo se jej uložit. Zkuste to prosím znovu.
    video_upload_failed_no_recording: Nenašel se žádný záznam k nahrání. Nahrajte jej prosím znovu.
    view_details: Zobrazit podrobnosti
    webgl_api_fix_description_first: Ujistěte se, že váš prohlížeč podporuje WebGL a že je tato funkce v nastavení zapnutá
    webgl_api_fix_description_second: Aktualizujte ovladače grafické karty na nejnovější verzi
    webgl_api_fix_title: Váš prohlížeč nepodporuje nebo nemá povolenou technologii WebGL
    webgl_api_support: Podpora rozhraní WebGL API
    webgl_not_supported_detail: Používáte prohlížeč %{browser_name} ve verzi %{browser_version}, který nepodporuje WebGL. Pro zajištění kompatibility prosím aktualizujte prohlížeč na nejnovější verzi.
