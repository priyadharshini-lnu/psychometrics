    timed_activity_instruction: Toto je časově omezená aktivita. Po zahájení dohledu nad zkouškou budete mít <strong>%{time} minut</strong> na její dokončení.
    troubleshooting_guide: Průvodce řešením problémů
    troubleshooting_guide_audio_fifth: 'Ve Windows: Zkontrolujte nastavení ochrany osobních údajů > Přístup k mikrofonu'
    troubleshooting_guide_audio_first: Klikněte na ikonu zámku/informací v adresním řádku prohlížeče
    troubleshooting_guide_audio_fourth: Pokud se stránka nezobrazí, možná bude nutné obnovit oprávnění v nastavení prohlížeče
    troubleshooting_guide_audio_second: Najděte nastavení „Mikrofon“ a nastavte je na „Povolit“
    troubleshooting_guide_audio_seventh: Pokud máte povolená oprávnění a při nahrávání došlo k problému, spusťte kontrolu znovu a zkuste audio nahrát znovu
    troubleshooting_guide_audio_sixth: 'Na počítači Mac: Přejděte do nabídky Předvolby systému > Zabezpečení'
    troubleshooting_guide_audio_third: Po změně oprávnění stránku aktualizujte
    troubleshooting_guide_browser_fifth: Zkontrolujte, zda je ve vašem prohlížeči povoleno LocalStorage
    troubleshooting_guide_browser_first: 'Použijte některý z podporovaných prohlížečů: Chrome, Firefox, Edge nebo Safari (nejnovější verze)'
    troubleshooting_guide_browser_fourth: V nastavení prohlížeče povolte JavaScript a soubory cookie
    troubleshooting_guide_browser_second: Vymažte mezipaměť a soubory cookie ve svém prohlížeči
    troubleshooting_guide_browser_sixth: 'Zkuste použít okno v anonymním/soukromém režimu (Poznámka: Funkce LocalStorage nemusí být v anonymním/soukromém režimu podporována vůbec nebo jen omezeně)'
    troubleshooting_guide_browser_third: Deaktivujte rozšíření prohlížeče, která by mohla narušovat přístup k médiím
    troubleshooting_guide_network_fifth: Pokud problém přetrvává, obraťte se na svého poskytovatele internetových služeb a požádejte o pomoc
    troubleshooting_guide_network_first: Ukončete ostatní aplikace, které mohou využívat šířku pásma (streamování videa, stahování souborů atd.)
    troubleshooting_guide_network_fourth: Zkuste použít jiné síťové připojení, pokud je k dispozici
    troubleshooting_guide_network_second: Přejděte blíže k routeru Wi-Fi nebo se připojte pomocí ethernetového kabelu
    troubleshooting_guide_network_third: Restartujte router/modem a zkuste to znovu
    troubleshooting_guide_video_fifth: 'Ve Windows: Zkontrolujte nastavení ochrany osobních údajů > přístup k fotoaparátu/mikrofonu'
    troubleshooting_guide_video_first: Klikněte na ikonu zámku/informací v adresním řádku prohlížeče
    troubleshooting_guide_video_second: Najděte nastavení „Fotoaparát“ a „Mikrofon“ a nastavte je na „Povolit“
    troubleshooting_guide_video_seventh: Pokud máte povolená oprávnění a při nahrávání došlo k problému, spusťte kontrolu znovu a zkuste video nahrát znovu
    troubleshooting_guide_video_sixth: 'Na počítači Mac: Přejděte do nabídky Systémové předvolby > Zabezpečení a soukromí > Kamera/Mikrofon'
    troubleshooting_guide_video_third: Po změně oprávnění stránku aktualizujte
