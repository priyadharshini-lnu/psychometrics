      guidelines:
        cards:
          c1:
            content: Zahrňte dovednosti, znalosti a schopnosti, které je třeba rozvíjet. Ujistěte se, že jsou konkrétní, měřitelné, dosažitelné, realistické a přiměřeně splnitelné v uvedených časových rámcích.
            title: Rozvojové cíle
          c2:
            content: Toto je založeno na kompetenci, která má být rozvíjena na základě zkušenosti s hodnocením.
            title: Kompetence
          c3:
            content: Tato část obsahuje vaše rozvojové akce založené na učebním modelu 70-20-10 uvedeném níže. Doporučuje se, abyste vybrali kombinaci všech tří prvků, abyste zajistili různorodý přístup k učení a rozvoji.
            title: Aktivita
          c4:
            content: Ujistěte se, že vaše časové rámce jsou realistické, a to na základě toho, kdy může být cíl splněn. V případě potřeby je vhodným způsobem upravte.
            title: Časový rámec
          c5:
            content: Použijte sekci postupu k podpoře progrese na identifikovaných trasách.
            title: Pokrok
        chart:
          collaboration: "<strong>20%</strong>Kolaborativní <br /> učení"
          job: "<strong>70%</strong>Učení <br />při práci"
          learn: "<strong>10%</strong>Formální učení"
        content:
          list:
            r1: Upozorňujeme, že tento seznam je pouze orientační a na základě individuálních ambicí, doporučení vašeho nadřízeného a obchodních priorit organizace mohou být pro vás zváženy další možnosti rozvoje.
            r2: Uživatelé jsou vybízeni k kritickému posouzení veškerého obsahu a mohou libovolně upravovat, vylepšovat, nahrazovat nebo přidávat jakékoli akce nebo doporučení, s nimiž nesouhlasí.
            r3: 'Údaje o vývoji uvedené v této zprávě mohou pocházet z jednoho nebo obou následujících zdrojů:'
            r3a: Přizpůsobená vývojová knihovna vytvořená pro vaši organizaci
            r3b: Návrhy vývoje generované umělou inteligencí
            r4: Tato zpráva IDP byla vygenerována s využitím technologie umělé inteligence a může obsahovat nepřesnosti. Uvedené poznatky a doporučení je třeba vykládat s rozvahou a používat je výhradně jako nástroj pro váš osobní a profesní rozvoj. Platnost zprávy je 12–18 měsíců.
          main: Vytvořený IDP obsahuje podrobný seznam rozvojových aktivit, které můžete podniknout, s ohledem na osvědčené postupy v oblasti vzdělávání, tj. pravidlo 70-20-10, které představuje postupný proces kombinující výuku v učebně, koučování a učení se v praxi. Na základě výsledků procesu hodnotícího centra, vašich odpovědí v chatu a externích zpráv, pokud jsou k dispozici, byly doporučeny možné cesty rozvoje, které můžete zvážit pro svůj rozvoj.
        learn_cards:
          collaboration:
            list:
            - Nabídněte koučování nebo mentorování ostatním
            - Požádejte o mentorování odborníkem ve svém oboru
            - Zajistěte si kouče na podporu vašeho rozvoje
            - Vytvořte kolaborativní pracovní skupinu k diskusi o probíhajících problémech v podnikání
            - Získávejte zpětnou vazbu formálně i neformálně od ostatních
            - Hrajte aktivní roli v průmyslových sdruženích a sítích
            - Budujte vlastní externí sítě
            title: Kolaborativní učení (20%) <br/> Rozvoj prostřednictvím ostatních
          job:
            list:
            - Převezměte vedoucí pozice ve výborech zainteresovaných stran nebo managementu
            - Nabídněte se k vedení projektů změnového řízení pro organizaci
            - Zvažte převzetí náročnějších úkolů
            - Pracujte napříč funkcemi v rámci spolupráce
            - Zvažte vedení projektů mimo vaši organizaci
            - Úzce spolupracujte s externími odborníky z oboru na společných projektech
            title: Učení při práci (70%) <br/> Rozvoj prostřednictvím zkušeností
          learn:
            list:
            - Účastnit se strukturovaných vzdělávacích programů
            - Kompletní online e-learningové kurzy
            - Čtěte knihy, články, publikace
            - Získejte odborné kvalifikace, certifikáty a akreditace
            - Účastnit se kurzů, workshopů, seminářů
            title: Formální učení (10%) <br/> Rozvoj prostřednictvím strukturovaného učení
