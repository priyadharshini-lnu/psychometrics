    errors:
      invalid_status: Neplatný stav kampaně
    goto_dashboard: Přejít na řídicí panel
    inactive_campaign_message: V současné době nemáte přiřazeny žádné aktivity.
    insights_reports: Poznatky a zprávy
    instruction_modal:
      campaign_start_final_instructions: |-
        <p>
          Upozorňujeme, že neexistuje žádný způsob, jak zastavit nebo pozastavit časovač. Časovač kampaně poběží i po zavření prohlížeče, takže byste rozhodně neměli nechat úkoly rozdělané a začít pracovat na něčem jiném. Nezapomeňte během úkolů minimalizovat rozptýlení. Najděte si tiché prostředí, vypněte oznámení na všech zařízeních a vyhněte se multitaskingu. Udržujte koncentraci a soustřeďte se. Po vypršení času kampaně už nemůžete pokračovat. Pokud jste si přečetli výše uvedené pokyny, klikněte na tlačítko Start a pokračujte v přiřazených úkolech.
        </p>
      campaign_start_instruction: |-
        <h4>Pozorně si přečtěte následující pokyny.
        </h4><p>
          Úkoly, které se chystáte zahájit, jsou časově omezené. Jakmile kliknete na „Spustit“, automaticky se spustí časovač kampaně. Na dokončení všech aktivit máte %{minutes} minut/y. Snažte se dokončit úkoly v určeném časovém rámci a efektivně hospodařit s časem, abyste proces hodnocení neuspěchali. Úkoly je třeba dokončit najednou, takže pokud si potřebujete udělat přestávku, teď je ten správný čas.
        </p>
      common_proctoring_instructions: |-
        <h4>Dohled</h4>
        <p>
          Po kliknutí na tlačítko Spustit budete přesměrováni na náš monitorovací systém. Během vaší relace bude sledovat vaši kameru, mikrofon a obrazovku. Tyto relace jsou automaticky kontrolovány naším sofistikovaným systémem umělé inteligence, který zajišťuje nepřerušovanou a plynulýou uživatelskou zkušenost. Relace však mohou monitorovat i lidé k tomu určení. Jakékoli známky nesprávného chování nebo nesrovnalostí budou nahlášeny. Chceme tím zajistit, aby nedocházelo k pokusům o podvádění. V případě zjištění podezření budou vaše úkoly zrušeny.
        </p>
      lockdown_browser_instruction: |-
        <h4>Monitorovací prohlížeč</h4>
        <p>
          K vyplnění testovaných úloh si musíte stáhnout a nainstalovat speciální prohlížeč. Postupujte podle pokynů na další obrazovce. Po dokončení všech požadovaných aktivit jej můžete odinstalovat.
        </p>
