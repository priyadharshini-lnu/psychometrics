        <h2>KROKY, KTERÉ PODNÍMÁME K OCHRANĚ OSOBNÍCH ÚDAJŮ</h2>
        <p>
          Naše společnost se snaží dodržovat všechny platné zákony o kybernetické bezpečnosti a ochraně údajů. S těmito cíli na paměti má MMC vyhrazeného ředitele pro informační bezpečnost (CISO) a globálního ředitele pro ochranu soukromí (GCPO). CISO je odpovědný za řízení globálního týmu pro informační bezpečnost a komplexního programu kybernetické bezpečnosti. Jako součást našeho programu kybernetické bezpečnosti jsme zavedli komerčně rozumná fyzická, administrativní a technická opatření na ochranu osobních údajů před neoprávněným přístupem, použitím, změnou a smazáním.
        </p>
        <p>
          GCPO vede a dohlíží na Centrum excelence v oblasti ochrany soukromí a síť pověřenců pro ochranu osobních údajů, která je odpovědná za implementaci našeho komplexního globálního programu ochrany soukromí. Síť pověřenců pro ochranu osobních údajů spojuje naše pověřence pro ochranu osobních údajů po celém světě a usiluje o konzistentní a důkladnou implementaci našeho programu ochrany soukromí všude tam, kde zpracováváme data. Můžete získat jméno a kontaktní informace pověřence pro ochranu osobních údajů ve vaší jurisdikci tím, že nás kontaktujete na adrese <a href="mailto:privacy@mmc.com">privacy@mmc.com</a>.
        </p>
        <h2>VAŠE PRÁVA NA OCHRANU DAT</h2>
        <p>
          V mnoha případech zpracováváme osobní údaje, abychom poskytli naše služby firemním klientům, a měli byste je kontaktovat, abyste uplatnili jakákoliv práva, která můžete mít podle platných zákonů o ochraně soukromí. Pokud však jednáme jako správce nebo podnik, který je primárně odpovědný za rozhodování o tom, jak jsou vaše informace zpracovávány, můžete mít některá nebo všechna práva uvedená níže, v závislosti na jurisdikci a našem důvodu pro zpracování vašich informací. Vezměte prosím na vědomí, že můžeme potřebovat použít vaše osobní údaje k ověření vaší identity před tím, než odpovíme na jakákoliv z níže uvedených práv.
        </p>
        <ul>
          <li>
            <strong>Právo na přístup (Právo vědět) <br /></strong>
            Můžete nás požádat o poskytnutí dalších podrobností o tom, jak využíváme vaše osobní údaje, o zdrojích, kategoriích nebo konkrétních kusech osobních údajů, které jsme shromáždili, o kategoriích třetích stran, kterým jsme tyto informace zpřístupnili, a požádat o kopii osobních údajů, které o vás máme.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Právo na opravu <br /></strong>
            Můžete nás požádat o aktualizaci jakýchkoli nepřesností v osobních údajích, které máme. Pokud vaše osobní údaje sdělíme jiným, informujeme je o opravě, pokud to bude možné.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Právo na smazání <br /></strong>
            Můžete nás požádat o vymazání vašich osobních údajů, pokud již nemáme zákonné důvody k jejich zpracování.
