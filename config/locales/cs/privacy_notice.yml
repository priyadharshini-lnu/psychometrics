          <strong>MTE</strong>
          “) shromažďuje, používá, sdílí, uchovává, převádí a jinak zpracovává informace týkající se identifikovaných nebo identifikovatelných jednotlivců (Osobní údaje) a práva, která můžete mít ohledně svých Osobních údajů. Věříme, že je důležité, abyste rozuměli tomu, jak zpracováváme Osobní údaje, a vyzýváme vás, abyste si našli chvíli na seznámení se s našimi praktikami ochrany soukromí uvedenými níže.
        </p>
        <p>
