        <h2>UCHOVÁNÍ VAŠICH INFORMACÍ</h2>
        <p>
          Naše produkty, služby a regulační povinnosti jsou složité, a proto se naše doby uchovávání osobních údajů liší. Při stanovování dob uchovávání osobních údajů a záznamů, které vedeme, zohledňujeme následující povinnosti:
        </p>
        <ul>
          <li>
            potřeba uchovávat informace k dosažení obchodních cílů nebo smluvních závazků, pro které byly shromážděny;
          </li>
          <li>
            naší povinností je provádět pokyny našich klientů ohledně osobních údajů, které zpracováváme jejich jménem;
          </li>
          <li>
            naší povinností je dodržovat povinné právní a regulační požadavky na uchovávání záznamů;
          </li>
          <li>
            naše postupy pro zálohování a obnovu po havárii; a
          </li>
          <li>
            další právní dopady, jako jsou příslušné lhůty pro promlčení.
          </li>
        </ul>
        <p>
