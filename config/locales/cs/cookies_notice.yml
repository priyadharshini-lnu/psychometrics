    <h2>Oznámení o souborech cookie</h2>

    <p><strong>Datum účinnosti:</strong> 14. prosince 2023</p>

    <p>
    Na těchto webových stránkách používáme soubory cookie a související sledovací technologie, včetně webových majáků,
    sledovacích pixelů a souborů protokolu (souhrnně označovaných jako „soubory cookie“), abychom vás odlišili od
    ostatních uživatelů, vyhodnotili a zlepšili funkčnost webových stránek a našich služeb a poskytli vám dobrou
    zákaznickou zkušenost.
    </p>

    <p><strong>CO JE SOUBOR COOKIE</strong></p>

    <p>
    Soubory cookie jsou informace sdílené mezi vaším webovým prohlížečem a webovou stránkou.
    Některé soubory cookie jsou nezbytné pro fungování webových stránek. Některé nám pomáhají
    hodnotit a zlepšovat jejich výkon. Soubory cookie také používáme k tomu, abychom vám mohli
    poskytovat relevantní obsah, produkty a služby. Soubor cookie nemůže načíst data z pevného
    disku vašeho počítače.
    </p>

    <p>Existují různé druhy souborů cookie s různými funkcemi:</p>

    <p>
    (i) <strong>Soubory cookie relace:</strong> tyto soubory cookie jsou ukládány do vašeho
    počítače pouze během vaší webové relace. Jsou automaticky vymazány při zavření prohlížeče.
    Obvykle ukládají anonymní ID relace, což vám umožňuje procházet webové stránky, aniž byste
    se museli přihlašovat na každou stránku. Neshromažďují žádné informace z vašeho počítače.
    </p>

    <p>
    (ii) <strong>Trvalé soubory cookie:</strong> tyto soubory cookie jsou uloženy jako soubory
    ve vašem počítači a zůstávají tam i po zavření webového prohlížeče. Může si je přečíst
    webová stránka, která je vytvořila, když webovou stránku znovu navštívíte.
    </p>

    <p>
    (iii) <strong>Soubory cookie první strany:</strong> tyto soubory cookie vytváří naše společnost.
    Jsou uloženy a odesílány mezi našimi servery a pevným diskem vašeho počítače. Tyto soubory cookie
    mohou být buď soubory cookie relace, nebo trvalé soubory cookie.
    </p>

    <p>
    (iv) <strong>Soubory cookie třetích stran:</strong> tyto soubory cookie vytváří jeden z našich
    partnerů z řad třetích stran. Jsou uloženy a odesílány mezi serverem třetí strany a pevným
    diskem vašeho počítače. Tyto soubory cookie jsou obvykle trvalé soubory cookie.
    </p>

    <p><strong>JAK A PROČ POUŽÍVÁME SOUBORY COOKIE</strong></p>

    <p>V závislosti na webových stránkách můžeme soubory cookie používat k následujícím účelům:</p>

    <p><strong>Kde je to nezbytně nutné</strong></p>

    <p>
    Tyto soubory cookie jsou nezbytné k tomu, abyste se mohli pohybovat po webových stránkách
    a používat jejich funkce, například přístup do zabezpečených oblastí webových stránek.
    Bez těchto souborů cookie nelze poskytovat služby, o které jste požádali, jako je získání
    nabídky nebo přihlášení k vašemu účtu.
    </p>

    <p><strong>Funkčnost</strong></p>

    <p>
    Tyto soubory cookie umožňují našim webovým stránkám zapamatovat si vaše volby
    (například vaše uživatelské jméno, jazyk nebo region) a poskytovat vylepšené funkce.
    Webové stránky si například mohou zapamatovat vaše přihlašovací údaje, takže se
    nemusíte opakovaně přihlašovat ke svému účtu.
    </p>

    <p>
    Tyto soubory cookie lze také použít k zapamatování změn velikosti textu, písma
    a dalších částí webových stránek, které si můžete přizpůsobit. Mohou být také
    použity k poskytování služeb, které jste si vyžádali, například sledování videa
    nebo komentování článku. Informace, které tyto soubory cookie shromažďují,
    jsou obvykle anonymizované.
    </p>

    <p><strong>Analytika</strong></p>

    <p>
    Tyto soubory cookie shromažďují informace o tom, jak návštěvníci používají
    webové stránky, například které stránky navštěvují nejčastěji nebo zda
    se zobrazují chybové zprávy. Pomáhají nám také zaznamenávat a počítat
    počet návštěvníků, což nám umožňuje zlepšovat fungování webových stránek.
    </p>

    <p><strong>Reklama</strong></p>

    <p>
    Tyto soubory cookie se používají za účelem zobrazování reklam,
    které jsou pro vás relevantní, a pro správu výkonu reklamy.
    Reklamní soubory cookie jsou obecně soubory cookie třetích stran.
    </p>

    <p><strong>IP adresy</strong></p>

    <p>
    Když navštívíte naše webové stránky, můžeme shromažďovat vaše
