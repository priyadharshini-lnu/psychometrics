        <h2>MEDIDAS QUE TOMAMOS PARA PROTEGER OS DADOS PESSOAIS  </h2>
        <p>
          A nossa empresa se esforça por cumprir todas as leis aplicáveis em matéria de cibersegurança e proteção de dados. Com estes objectivos em mente, a MMC tem um Chief Information Security Officer (CISO) dedicado e um Global Chief Privacy Officer (GCPO). O CISO é responsável pela gestão de uma equipa global de segurança da informação e por um programa abrangente de cibersegurança.  Como parte do nosso programa de segurança cibernética, implementamos salvaguardas físicas, administrativas e técnicas comercialmente razoáveis para proteger os Dados Pessoais contra acesso, utilização, alteração e eliminação não autorizados.
        </p>
        <p>
          O GCPO lidera e supervisiona um Centro de Excelência de Privacidade e uma Rede de Responsáveis pela Proteção de Dados responsáveis pela implementação do nosso programa global de privacidade. A Rede de Responsáveis pela Proteção de Dados liga os nossos Responsáveis pela Proteção de Dados em todo o mundo e procura implementar o nosso programa de privacidade de forma consistente e completa onde quer que processemos dados. Você pode obter o nome e as informações de contato do responsável pela proteção de dados na sua jurisdição nos contatando através do endereço <a href="mailto:privacy@mmc.com">privacy@mmc.com</a>.
        </p>
        <h2>OS SEUS DIREITOS DE PROTEÇÃO DE DADOS </h2>
        <p>
          Em muitos casos, tratamos os Dados Pessoais para prestar os nossos serviços a clientes empresariais, pelo que o titular deve contatá-los para exercer quaisquer direitos que possa ter ao abrigo das leis de privacidade aplicáveis. No entanto, nos casos em que atuamos como responsável pelo tratamento ou empresa que é a principal responsável pela decisão sobre a forma como as suas informações são processadas, o titular pode ter alguns ou todos os direitos abaixo indicados, dependendo da jurisdição e do motivo pelo qual processamos as suas informações.   Tenha em atenção que poderemos ter de utilizar os seus dados pessoais para verificar a sua identidade antes de responder a qualquer um dos direitos abaixo indicados.
        </p>
        <ul>
          <li>
            <strong>Direito de acesso (direito de saber) <br /></strong>
            Você pode nos solicitar que lhe seja fornecido mais pormenores sobre a forma como utilizamos os seus Dados Pessoais, as fontes, as categorias ou partes específicas dos Dados Pessoais que recolhemos, as categorias de terceiros a quem divulgamos as informações e solicitar uma cópia dos Dados Pessoais que temos sobre você.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Direito de correção  <br /></strong>
            O titular pode nos pedir para atualizar quaisquer imprecisões nos Dados Pessoais que possuímos. Se divulgarmos os seus dados pessoais a terceiros, os informaremos da correção, sempre que possível.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Direito de apagar <br /></strong>
            O titular pode nos pedir para apagar os seus Dados Pessoais quando já não tivermos motivos legais para os processar.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Direito de se opor ao tratamento ou de o restringir <br /></strong>
            O titular pode ter o direito de restringir o processamento dos seus dados pessoais em determinadas circunstâncias, por exemplo, se contestar a sua exatidão.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Direito à portabilidade dos dados <br /></strong>
            O titular pode ter o direito, sempre que seja tecnicamente viável, de pedir que transfiramos para um terceiro da sua escolha uma cópia dos Dados Pessoais que obtivemos do titular, em um formato estruturado, comumente utilizado e em formato “machine-readable”.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Direito de retirar o consentimento <br /></strong>
            Se nos basearmos no consentimento do titular como base legal para o tratamento de seus dados pessoais, o titular tem o direito de retirar esse consentimento.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Direito de apresentar uma  reclamação<br /></strong>
            O titular pode ter o direito de apresentar uma reclamação junto da autoridade de supervisão ou reguladora relevante na sua jurisdição se tiver uma preocupação sobre qualquer aspecto das nossas práticas de privacidade.
          </li>
        </ul>
        <p>
          Se pretender exercer qualquer um dos direitos acima referidos ou solicitar a revisão de uma decisão ou recusa, contate-nos utilizando as informações de contato aplicáveis:
        </p>
        <ul>
          <li>
            Se estiver no Reino Unido, na Suíça ou no Espaço Económico Europeu,
            <a
              href="https://mmc-dev-privacy.my.onetrust.com/webform/4da460d1-7bcf-4ff1-ac37-c4b804769467/draft/ea953d72-fded-42ee-b1dd-c0a5a83b7891"
              >preencha este formulário .</a
            >
          </li>
          <li>
            Para indivíduos de outros países,
            <a
              href="https://privacyportal.onetrust.com/webform/ee9df2bb-0ef3-4485-bc63-4db420e77359/225910f5-5666-468a-b1e7-39c70e24f4cc"
              >preencher este formulário .</a
            >
          </li>
          <li>
            Em alternativa, pode enviar um e-mail para <a href="mailto:privacy@mmc.com">privacy@mmc.com</a>
          </li>
        </ul>
        <p>
          Dependendo do seu país, pode também ter alguns ou todos os seguintes direitos:
        </p>
        <ul>
          <li>
            <strong>
              Direito de "opt-in" ou “opt-out” em relação à venda ou compartilhamento para publicidade em diferentes contextos <br />
            </strong>
            Se visitar um dos nossos sítios Web, poderemos divulgar as suas informações de atividade na Internet ou outras redes electronicas, identificadores biográficos, dados de geolocalização e informações profissionais (na medida em que possam ser obtidos a partir da sua atividade no nosso sítio Web) a fornecedores de análise e publicidade de sítios Web para fins de publicidade comportamental ou orientada entre contextos, utilizando cookies de publicidade.  Ao abrigo de algumas leis, o titular pode ter o direito de optar por participar ou não neste tipo de divulgações.  Para fazer a(s) sua(s) seleção(ões) ou para ver os nomes de terceiros específicos com quem vendemos ou partilhámos as suas informações, clique na opção "Gerir cookies" na parte inferior da nossa página Web. Se pretender recusar a venda ou a partilha das suas informações, certifique-se de que as opções para os rastreadores "Publicidade" e "Análise" estão definidas como "Não" ou, quando disponível, ative a opção Não vender nem partilhar os meus dados pessoais.
            <p>
              O titular pode também implementar uma definição ou extensão do browser para comunicar automaticamente as suas preferências de venda e partilha aos sítios Web que visita.  Os nossos sítios Web processam esses "sinais de preferência de opt-out" de uma forma simples, reconhecendo o Global Privacy Control (GPC). Se quiser utilizar o GPC, pode baixá-lo e ativá-lo através de um browser participante ou de uma extensão do browser. Estão disponíveis mais informações sobre o download do GPC <a href="https://globalprivacycontrol.org/">aqui</a>.&nbsp;
            </p>
          </li>
        </ul>
        <ul>
          <li>
            <strong>
              Direitos em relação à tomada de decisões automatizada e à definição de perfis
            <br /></strong>
            Na medida em que nos envolvemos no processamento automatizado dos seus Dados Pessoais, forneceremos antecipadamente quaisquer avisos, incluindo sobre os seus direitos, que sejam exigidos por lei.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Marketingdireto e sinais de não rastreio <br /></strong>
            O titular pode ter o direito de solicitar e obter um aviso uma vez por ano sobre os Dados Pessoais que divulgamos a outras empresas para os seus próprios fins de marketing direto, quando permitido por lei.  Se aplicável, esse aviso incluirá uma lista das categorias de Dados Pessoais que foram divulgadas (se existirem) e os nomes e endereços de todos os terceiros a quem os Dados Pessoais foram divulgadas (se existirem).  O aviso abrangerá o ano civil anterior.  Você pode contatar-nos conforme indicado abaixo se pretender saber se este direito é aplicável si e, em caso afirmativo, exercer esse direito.
          </li>
        </ul>
        <p>
          Tenha em atenção que alguns destes direitos podem ser limitados quando tivermos um  interesse legítimo preponderante ou uma  obrigação legal, regulamentar ou contratual de continuar a processar os Dados Pessoais, ou quando os Dados Pessoais estiverem excepcionados de divulgação ou eliminação ao abrigo da legislação aplicável.  Alguns destes direitos só podem ser exercidos em determinadas circunstâncias ou podem ser limitados pela legislação de proteção de dados na sua jurisdição.
        </p>
        <h2>TRANSFERÊNCIAS INTERNACIONAIS </h2>
        <p>
          Como uma empresa global que opera em mais de 80 países, há circunstâncias em que teremos de transferir Dados Pessoais para fora do país, província ou território em que foram coletadas para os fins descritos neste Aviso de Privacidade. Especificamente, podemos transferir dados para oferecer, administrar e gerir os Serviços fornecidos ao titular e para melhorar a eficiência das nossas operações comerciais. Envidaremos todos os esforços para garantir que estas transferências cumpram toda a legislação relevante em matéria de proteção de dados e que os direitos e liberdades dos indivíduos ao abrigo dessa legislação estejam devidamente salvaguardados.
        </p>
        <p>
          Quando surgir a necessidade de tal transferência, tomaremos medidas para garantir que existam salvaguardas adequadas para proteger os Dados Pessoais, tais como uma avaliação de impacto, uma decisão de adequação pela autoridade reguladora apropriada, a utilização de regras empresariais vinculativas aprovadas ou cláusulas contratuais padrão, ou o seu consentimento.
        </p>
        <p>
          Para obter informações sobre como funcionam as Regras Corporativas Vinculativas da UE (União Europeia) da MMC (BCRs da UE), clique
          <a
