            >aqui</a
          >.&nbsp; Para obter uma lista das entidades que concordaram em ficar vinculadas pelas BCR da UE, clique
          <a href="https://www.marshmclennan.com/privacy-statement/bcr-entities.html"
            >aqui</a
          >.&nbsp;
        </p>
        <p>
          Para obter informações sobre como funcionam as Regras Corporativas Vinculativas da MMC no Reino Unido (BCRs do Reino Unido), clique
          <a
            href="https://www.marshmclennan.com/content/dam/mmc-web/Archive/Images/Files/02March2022-UKBCR-Controller-and-Processor-Principles.pdf"
            >aqui</a
          >.&nbsp; Para obter uma lista das entidades que concordaram em ficar vinculadas pelas BCR do Reino Unido, clique
          <a
            href="https://www.marshmclennan.com/privacy-statement/bcr-entities-uk.html"
            >aqui</a
          >.&nbsp;&nbsp;&nbsp;
        </p>
        <h2>CONSERVAÇÃO DOS SEUS DADOS</h2>
        <p>
          Os nossos produtos, serviços e obrigações regulamentares são complexas, pelo que os nossos períodos de retenção de Dados Pessoais variam.  Levamos em consideração as seguintes obrigações ao definir os períodos de retenção dos Dados Pessoais e dos registos que mantemos:
        </p>
        <ul>
          <li>
            a necessidade de conservar os dados para cumprir os objetivos comerciais ou as obrigações contratuais para as quais foram coletados;
          </li>
          <li>
            os nossos deveres de cumprir as instruções dos nossos clientes relativamente aos Dados Pessoais que tratamos em seu nome;
          </li>
          <li>
            os nossos deveres de cumprimento dos requisitos legais e regulamentares obrigatórios de manutenção de registros;
          </li>
          <li>
            os nossos procedimentos de backup e recuperação de desastres; e
          </li>
          <li>
            outros impactos jurídicos, tais como os prazos de prescrição aplicáveis.
          </li>
        </ul>
        <p>
          Com base nos fatores acima referidos, podemos reter Dados Pessoais para além do período durante o qual lhe prestamos serviços. Quando já não precisarmos  reter os Dados Pessoais, as políticas da nossa empresa exigem que os desidentifiquemos ou agreguemos (caso em que poderemos reter e utilizar os dados desidentificados ou agregados para fins analíticos) ou que os destruamos de forma segura.
        </p>
