        <h1><strong>AVISO DE PRIVACIDADE DA MERCER TALENT ENTERPRISE  </strong>&nbsp;</h1>
        <p>Data efectiva: 15 September 2024</p>
        <p>
          Este Aviso de Privacidade descreve a forma como a Mercer Talent Enterprise ("
          <strong>MTE</strong>
          ") recolhe, utiliza, partilha, retém, transfere e processa informação relativa a indivíduos identificados ou identificáveis (Dados Pessoais), e os direitos que o titular pode ter relativamente aos seus Dados Pessoais. Acreditamos que é importante que o titular  compreenda a forma como processamos os Dados Pessoais e o encorajamos a dedicar um momento para se familiarizar com as nossas práticas de privacidade descritas abaixo.
        </p>
        <p>
          Tenha em atenção que a MTE é um fornecedor de soluções de avaliação de ciências comportamentais e, em alguns casos, atuamos em nome e sob as instruções de clientes, instituições financeiras, comerciantes e outros parceiros que atuam como controladores de dados, incluindo para o processamento de transações de pagamento. Consulte as políticas de privacidade desses parceiros para obter mais informações sobre o processamento das suas informações pessoais nesses contextos.
        </p>
        <h2>QUAL É A NOSSA RELAÇÃO COM VOCÊ</h2>
        <p>
          Você será solicitado por um terceiro a completar uma avaliação na plataforma MTE. Este terceiro está cliente a respeito da MTE e pode ser o seu empregador, potencial empregador ou outra parte relacionada. A MTE recolhe e processa seus Dados Pessoais em nome dos nossos clientes. Seguimos as instruções fornecidas pelos nossos clientes relativamente aos Dados Pessoais coletados e à forma de os processar. Por conseguinte, a MTE atua como um Processador para os nossos clientes que determinam o processamento dos seus Dados Pessoais.
        </p>
        <p>
          Se tiver dúvidas sobre o processamento dos seus Dados Pessoais, recomendamos que consulte o aviso de privacidade do nosso cliente.
        </p>
