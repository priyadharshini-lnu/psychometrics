    instruction_modal:
      campaign_start_final_instructions: |
        <p>
          Tenha em atenção de que não há forma de parar ou pausar o cronómetro. O cronómetro da campanha continuará a funcionar mesmo quando fechar o navegador, pelo que, em nenhum momento, deve pensar em deixar as tarefas a meio para fazer outra coisa. Certifique-se de que minimiza as distrações durante as tarefas. Encontre um ambiente silencioso, desative as notificações nos seus dispositivos e evite multitarefas. Mantenha a sua concentração e atenção. Quando o cronómetro da campanha chegar ao fim, não poderá continuar. Se leu as instruções acima, clique em iniciar para continuar as tarefas atribuídas.
        </p>
      campaign_start_instruction: |
        <h4>Leia as instruções a seguir adequadamente.</h4>
        <p>
          A(s) tarefa(s) que está prestes a iniciar são cronometradas. Depois de clicar em "Iniciar", o cronómetro da campanha começará automaticamente. Tem %{minutes} minutos para concluir todas as atividades. Procure concluir as tarefas dentro do prazo designado e administre o tempo de forma eficaz para evitar pressa no processo de avaliação. Certifique-se de que conclui as tarefas de uma só vez. Por isso, se precisar de fazer uma pausa, agora é a hora.
        </p>
      common_proctoring_instructions: |
        <h4>Supervisão</h4>
        <p>
          Ao clicar no botão Iniciar, será redirecionado para o nosso sistema de supervisão. O sistema monitorizará a sua câmara, microfone e ecrã durante a sessão. Estas sessões são supervisionadas automaticamente pelo nosso sofisticado sistema de IA, proporcionando uma experiência de utilizador ininterrupta e tranquila. No entanto, as sessões também podem ser analisadas por supervisores humanos. Quaisquer indícios de má conduta ou irregularidades serão sinalizados. Isto está a ser feito para garantir que não ocorre qualquer tentativa de batota. Se forem detetadas suspeitas, as suas tarefas serão canceladas.
        </p>
      lockdown_browser_instruction: |
        <h4>Navegador de supervisão</h4>
        <p>
          Para concluir as tarefas supervisionadas, ser-lhe-á solicitado que descarregue e instale um navegador especial. Siga as instruções no ecrã a seguir. Pode desinstalar depois de concluir todas as atividades necessárias.
        </p>
