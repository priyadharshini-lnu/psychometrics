      guidelines:
        cards:
          c1:
            content: Inclui competências, conhecimentos e capacidades que precisam de ser desenvolvidos. Certifique-se de que são específicos, mensuráveis, alcançáveis, realistas e razoavelmente capazes de serem cumpridos nos prazos mencionados.
            title: Objetivos de Desenvolvimento
          c2:
            content: Isto baseia-se na competência a ser desenvolvida com base na experiência de avaliação.
            title: Competência
          c3:
            content: Esta secção inclui as suas ações de desenvolvimento baseadas no modelo de aprendizagem 70-20-10 listado abaixo. Aconselha-se a selecionar uma combinação de cada um dos três elementos para garantir uma abordagem variada de aprendizagem e desenvolvimento.
            title: Atividade
          c4:
            content: Certifique-se de que os seus prazos são realistas com base em quando o objetivo pode ser concluído. Altere quando e se for apropriado.
            title: Cronograma
          c5:
            content: Utilize a secção de progresso para apoiar a progressão nas vias identificadas.
            title: Progresso
        chart:
          collaboration: "<strong>20%</strong>Aprendizagem <br /> Colaborativa"
          job: "<strong>70%</strong>Aprendizagem <br />no Trabalho"
          learn: "<strong>10%</strong>Aprendizagem Formal"
        content:
          list:
            r1: Note que esta lista é apenas indicativa, e percursos de desenvolvimento adicionais podem ser considerados para si com base em aspirações individuais, recomendações do seu gestor, bem como prioridades organizacionais de negócios.
            r2: Note que o lançamento de alguns destes percursos de desenvolvimento dependerá da estratégia de educação e aprendizagem de toda a organização.
            r3: Por favor, considere os percursos recomendados como cruzados abaixo, ao desenvolver o seu Plano de Desenvolvimento Individual.
          main: Esta secção inclui uma lista cumulativa de todos os percursos de desenvolvimento, tendo em mente a melhor prática de aprendizagem, ou seja, a diretriz 70-20-10, que fornece uma jornada progressiva combinando aprendizagem em sala de aula, coaching e aprendizagem no trabalho. Com base nos resultados da experiência de desenvolvimento de liderança e prioridades de negócios, percursos de desenvolvimento possíveis foram recomendados, que podem ser considerados para o seu desenvolvimento.
        learn_cards:
          collaboration:
            list:
            - Ofereça-se para orientar ou mentorizar outros
            - Solicite ser orientado por um especialista na sua área
            - Obtenha um coach para apoiar o seu desenvolvimento
            - Configure um grupo de trabalho colaborativo para discutir desafios contínuos no negócio
            - Obtenha feedback formal e informalmente de outros
            - Desempenhe um papel ativo em associações e redes da indústria
            - Construa as suas próprias redes externas
            title: Aprendizagem Colaborativa (20%) <br/> Desenvolvimento através de outros
          job:
            list:
            - Assuma posições de liderança em comitês de partes interessadas ou de gestão
            - Voluntarie-se para liderar projetos de gestão de mudança para a organização
            - Considere assumir tarefas desafiadoras
            - Trabalhe de forma colaborativa com outras funções
            - Considere liderar projetos fora da sua organização
            - Trabalhe em estreita colaboração com especialistas da indústria externa em projetos conjuntos
            title: Aprendizagem no Trabalho (70%) <br/> Desenvolvimento através da experiência
          learn:
            list:
            - Assuma posições de liderança em comitês de partes interessadas ou de gestão
            - Voluntarie-se para liderar projetos de gestão de mudança para a organização
            - Considere assumir tarefas desafiadoras
            - Trabalhe de forma colaborativa com outras funções
            - Considere liderar projetos fora da sua organização
            - Trabalhe em estreita colaboração com especialistas da indústria externa em projetos conjuntos
            title: Aprendizagem Formal (10%) <br/> Desenvolvimento através da aprendizagem estruturada
