    v4: |-
      Versão 4.0

      Atualizado em: 29 de maio de 2025

      Para garantir a sua participação significativa nesta atividade, algumas das suas informações pessoais serão recolhidas e processadas.
      A atividade está a ser administrada pela Mercer Talent Enterprise em nome e por instruções do nosso cliente, que determina a finalidade do processamento das suas informações pessoais e a forma como as podemos utilizar. Tenha em atenção que a sua informação pode ser transferida para além das fronteiras nacionais como parte dos serviços prestados aos nossos clientes. Nesse caso, actuamos como importador de dados e o nosso cliente actua como exportador de dados. Qualquer transferência internacional de informações pessoais será efectuada de acordo com as leis de proteção de dados aplicáveis.

      Para mais informações sobre a forma como processamos as suas informações pessoais, clique aqui para ler o nosso aviso de privacidade global: [GLOBAL_PRIVACY_LINK]

      Para obter informações sobre a forma como o nosso cliente processa as suas informações pessoais, leia a respectiva declaração de privacidade: [LINK_PRIVACIDADE_CLIENTE]
