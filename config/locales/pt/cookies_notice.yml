  cookies_notice: |-
    <h2>Aviso de cookies</h2>

    <p>Data de vigência: 14 de dezembro de 2023</p>

    <p>Usamos cookies e tecnologias de rastreamento relacionadas, incluindo web beacons, pixels de rastreamento e arquivos de log (coletivamente chamados de “cookies”), neste site para distingui-lo de outros usuários, avaliar e melhorar a funcionalidade do site e dos nossos serviços e proporcionar uma boa experiência.</p>

    <p><strong>O QUE SÃO COOKIES</strong></p>

    <p>Cookies são informações compartilhadas entre seu navegador de internet e um site. Alguns cookies são necessários para que o site funcione. Outros nos ajudam a avaliar e melhorar o desempenho do site. Também utilizamos cookies para ajudar a fornecer conteúdo, produtos e serviços relevantes para você. Um cookie não pode ler dados do disco rígido do seu computador.</p>

    <p>Existem diversos tipos de cookies com diferentes funções:</p>

    <p>(i) <strong>Cookies de sessão:</strong> esses cookies são armazenados apenas no seu computador durante a sua sessão de internet. Eles são automaticamente excluídos quando o navegador é fechado. Esses cookies geralmente armazenam uma ID (identificação) de sessão anônima, permitindo que você navegue em um site sem precisar efetuar o login a cada nova página acessada. Eles não coletam nenhuma informação do seu computador.</p>

    <p>(ii) <strong>Cookies persistentes:</strong> esses cookies são armazenados como um arquivo no seu computador, e nele permanecem mesmo depois de você fechar seu navegador de internet. Esses cookies podem ser lidos pelo site que os criou quando você for acessá-lo novamente.</p>

    <p>(iii) <strong>Cookies primários:</strong> esses cookies são criados pela nossa empresa. Eles são armazenados e enviados entre nossos servidores e o disco rígido do seu computador. Eles podem ser cookies de sessão ou persistentes.</p>

    <p>(iv) <strong>Cookies de terceiros:</strong> esses cookies são criados por um de nossos parceiros terceirizados. Esses cookies são armazenados e enviados entre o servidor de terceiros e o disco rígido do seu computador. Eles geralmente são cookies persistentes.</p>

    <p><strong>COMO E POR QUE UTILIZAMOS COOKIES</strong></p>

    <p>Dependendo do site, podemos usar cookies para os seguintes fins:</p>

    <p><strong>Quando for estritamente necessário</strong></p>

    <p>Esses cookies são essenciais para que você possa navegar e utilizar os recursos do nosso site, como acessar as áreas de segurança. Sem eles, suas solicitações de serviços, como obter um orçamento ou efetuar o login na sua conta, não podem ser realizadas. Esses cookies não coletam informações pessoais que possam ser utilizadas em ações de marketing ou para lembrar onde você esteve na internet.</p>

    <p><strong>Funcionalidade</strong></p>

    <p>Esses cookies permitem que nosso site se lembre das escolhas que você faz (como seu nome de usuário, idioma ou a região na qual você se encontra) e fornecem recursos avançados. Por exemplo, ele é capaz de lembrar das suas informações de login, para que você não tenha que entrar repetidamente na sua conta ao usar um determinado dispositivo para acessar nosso site. Esses cookies também podem ser utilizados para guardar as alterações feitas no tipo e tamanho da fonte e outras partes de páginas da internet que você personalize. Eles também podem ser utilizados para fornecer serviços por você solicitados, como assistir a um vídeo ou comentar um artigo. As informações que esses cookies coletam geralmente não são identificadas. Eles não coletam informações pessoais que possam ser utilizadas em publicidade ou para lembrar onde você esteve na internet.</p>

    <p><strong>Analíticos</strong></p>

    <p>Esses cookies coletam informações sobre como os visitantes utilizam um site; por exemplo, quais páginas eles acessam com mais frequência e se recebem mensagens de erro de páginas da internet. Eles também nos permitem registrar, verificar o tipo de utilização e contabilizar o número de visitantes do site, para que possamos melhorar o funcionamento do nosso site.</p>

    <p><strong>Publicidade</strong></p>

    <p>Esses cookies são utilizados com o propósito de exibir e gerenciar o desempenho de anúncios relevantes para você. Eles geralmente são cookies de terceiros e podem estar presentes mesmo que não haja publicidade ativa no site.</p>

    <p><strong>Endereços IP</strong></p>

    <p>Quando você visita nosso site, coletamos seus endereços de protocolo de internet (“IP”) para rastrear e agregar informações não pessoais. Por exemplo, podemos usar endereços IP para monitorar as regiões a partir das quais os usuários navegam no site.</p>

    <p><strong>COMO GERENCIAR COOKIES</strong></p>

    <p>Na parte inferior da página, clique no link “Gerenciar cookies” para ativar ou desativar determinados cookies por meio do nosso Gerenciador de consentimento de cookies. Observe que não é possível optar por não aceitar cookies estritamente necessários, portanto, sites que usam apenas esses cookies podem não fornecer este link.</p>

    <p>Você também pode desativar determinados cookies nas configurações do navegador. Consulte a seção “Ajuda” do seu navegador para saber como gerenciar as configurações de cookies.</p>

    <p><strong>O AVISO DE COOKIES NÃO ABRANGE SITES DE TERCEIROS</strong></p>

    <p>Quando incluímos links para outros sites, tenha em mente que eles terão seus próprios cookies e políticas de privacidade para uso das informações que você apresentar. Recomendamos que você leia as políticas deles, pois não somos responsáveis pelas práticas de privacidade de terceiros.</p>

    <p><strong>ALTERAÇÕES NO AVISO DE COOKIES</strong></p>

    <p>Esta política pode ser ocasionalmente atualizada e, por isso, encorajamos você a revisá-la de tempos em tempos para se manter ciente quanto à forma como utilizamos cookies. Publicamos a data de vigência da política no topo da página.</p>

    <p><strong>DESCRIÇÃO DOS COOKIES USADOS</strong></p>

    <p>Clique no link “Gerenciar cookies” no rodapé do site para encontrar detalhes sobre os cookies individuais usados no site. Em alguns casos, este link pode não estar disponível; por exemplo, quando usamos apenas Cookies estritamente necessários.</p>

    <p><strong>ENTRE EM CONTATO CONOSCO</strong></p>

    <p>Se você tiver alguma dúvida sobre este Aviso de Cookies, entre em contato conosco conforme indicado em nosso Aviso de Privacidade, vinculado abaixo.</p>
