  cookies_notice: "<div class=\"container\">\n\n<h1>Cookie Notice</h1>\n<p class=\"effective-date\"><strong>Effective Date:</strong> December 14th 2023</p>\n\n<p>\nWe use cookies and related tracking technologies, including web beacons, tracking pixels and log files \n(collectively referred to as “cookies”) on this website to distinguish you from other users, assess and \nimprove functionality of the website and our services, and provide you with a good experience.\n</p>\n\n<h2>What is a Cookie</h2>\n\n<p>\nCookies are pieces of information shared between your web browser and a website. Some cookies are necessary \nfor making the website work. Some help us assess and improve its performance. We also use cookies to help \nprovide relevant content, products, and services to you. A cookie cannot read data from your computer's \nhard drive.\n</p>\n\n<p>There are different kinds of cookies with different functions:</p>\n\n<ul>\n<li><strong>Session cookies:</strong> These cookies are only stored on your computer during your web session. \nThey are automatically deleted when the browser is closed. They usually store an anonymous session ID allowing \nyou to browse a website without having to log in to each page. They do not collect any information from your computer.</li>\n\n<li><strong>Persistent cookies:</strong> These cookies are stored as a file on your computer and remain there \nwhen you close your web browser. They can be read by the website that created them when you visit the website again.</li>\n\n<li><strong>First-party cookies:</strong> These cookies are created by our company. They are stored and sent \nbetween our servers and your computer’s hard drive. These cookies may be either Session or Persistent cookies.</li>\n\n<li><strong>Third-party cookies:</strong> These cookies are created by one of our third-party partners. They are \nstored and sent between the third-party’s server and your computer’s hard drive. These cookies are usually Persistent cookies.</li>\n</ul>\n\n<h2>How and Why We Use Cookies</h2>\n\n<p>Depending on the website, we may use cookies for the following purposes:</p>\n\n<h3>Strictly Necessary</h3>\n<p>\nThese cookies are essential in order to enable you to move around the website and use its features, such as \naccessing secure areas of the website. Without these cookies, services you have asked for, such as obtaining \na quote or logging into your account, cannot be provided. These cookies do not gather information about you \nthat could be used for marketing or remembering where you have been on the internet.\n</p>\n\n<h3>Functionality</h3>\n<p>\nThese cookies allow our website to remember choices you make (such as your username, language, or the region \nyou are in) and provide enhanced features. For instance, a website may be able to remember your login details, \nso that you do not have to repeatedly sign-in when using a particular device to access our website.\n</p>\n\n<p>\nThese cookies can also remember changes you have made to text size, font, and other customizable parts of web \npages. They may also provide services you have requested such as viewing a video or commenting on an article. \nThe information these cookies collect is usually de-identified.\n</p>\n\n<h3>Analytics</h3>\n<p>\nThese cookies collect information about how visitors use a website, such as which pages visitors go to most \noften and if they get error messages from web pages. They also allow us to record and count the number of \nvisitors to the website, helping us improve the way our website works.\n</p>\n\n<h3>Advertising</h3>\n<p>\nThese cookies are used to display advertisements that are relevant to you and to manage the performance of \nadvertisements. Advertising cookies are generally third-party cookies and may be present even if there is \nno advertising in use on the website.\n</p>\n\n<h2>IP Addresses</h2>\n\n<p>\nWhen you visit our website, we may collect your Internet Protocol (“IP”) addresses to track and aggregate \nnon-Personal Information. For example, we may use IP addresses to monitor the regions from which users \nnavigate the website.\n</p>\n\n<h2>How to Manage Cookies</h2>\n\n<p>\nPlease click the <strong>“Manage Cookies”</strong> link at the bottom of the page to opt in or out of certain \ncookies using our Cookie Consent Manager. Note that it is not possible to opt out of Strictly Necessary \nCookies, so websites that only use such cookies may not provide this link.\n</p>\n\n<p>\nYou can also disable certain cookies via browser settings. Visit the <strong>Help</strong> section of your \nbrowser for instructions on how to manage your cookie settings.\n</p>\n\n<h2>Cookie Notice Does Not Cover Third-Party Websites</h2>\n\n<p>\nWhen we include links to other websites, please note they will have their own privacy and cookie policies. \nWe recommend reviewing their policies as we are not responsible for their privacy practices.\n</p>\n\n<h2>Changes to the Cookie Notice</h2>\n\n<p>\nWe may update this policy occasionally and encourage you to review it periodically to stay informed about \nhow we use cookies. The effective date of the policy is posted at the top of this page.\n</p>\n\n<h2>Description of Cookies Used</h2>\n\n<p>\nPlease click the <strong>“Manage Cookies”</strong> link in the footer of the website to find details about the \nindividual cookies used on the website. In some cases, this link may not be available, for example where \nonly Strictly Necessary Cookies are used.\n</p>\n\n<h2>Contact Us</h2>\n\n<p class=\"footer-note\">\nIf you have any questions about this Cookie Notice, please contact us as indicated in our Privacy Notice.\n</p>\n\n</div>"
