            - Assume leadership positions in stakeholder or management committees
            - Volunteer to lead change management projects for the organization
            - Consider taking on stretching assignments
            - Work cross-collaboratively with other functions
            - Consider leading projects outside your organization
            - Work closely with external industry experts on joint-projects
            title: Learning On the Job (70%) <br/> Developing through experience
          learn:
            list:
            - Assume leadership positions in stakeholder or management committees
            - Volunteer to lead change management projects for the organization
            - Consider taking on stretching assignments
            - Work cross-collaboratively with other functions
            - Consider leading projects outside your organization
            - Work closely with external industry experts on joint-projects
