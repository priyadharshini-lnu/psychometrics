            - Offer to coach or mentor others
            - Request to be mentored by an expert in your field
            - Attain a coach to support your development
            - Set-up a collaborative working group to discuss on going challenges in the business
            - Get feedback formally and informally from others
            - Play an active role in industry associations and networks
            - Build your own external networks
