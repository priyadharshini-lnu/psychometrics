        <h2>PRZELEWY TRANSGRANICZNE</h2>
        <p>
          Jako globalna firma działająca w ponad 80 krajach, istnieją okoliczności, w których będziemy musieli przekazać dane osobowe poza kraj, prowincję lub terytorium, w którym zostały zebrane, w celach określonych w niniejszym Powiadomieniu o Prywatności. W szczególności możemy przekazywać dane, aby oferować, zarządzać i administrować usługami świadczonymi dla Ciebie oraz zwiększać efektywność naszych operacji biznesowych. Dołożymy wszelkich starań, aby zapewnić, że te transfery będą zgodne ze wszystkimi odpowiednimi przepisami o ochronie danych, a prawa i wolności osób objętych tymi przepisami będą odpowiednio chronione.
