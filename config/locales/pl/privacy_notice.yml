        <h2>ZATRZYMANIE TWOICH INFORMACJI </h2>
        <p>
          Nasze produkty, usługi i obowiązki regulacyjne są złożone, dlatego nasze okresy przechowywania Danych Osobowych różnią się. Przy ustalaniu okresów przechowywania Danych Osobowych oraz dokumentów, które przechowujemy, bierzemy pod uwagę następujące zobowiązania:
        </p>
        <ul>
          <li>
            konieczność przechowywania informacji w celu realizacji celów biznesowych lub zobowiązań umownych, dla których zostały zebrane;
          </li>
          <li>
            nasze obowiązki polegają na realizacji instrukcji naszych klientów w odniesieniu do Danych Osobowych, które przetwarzamy w ich imieniu;
          </li>
          <li>
            nasze obowiązki w zakresie przestrzegania obowiązkowych wymogów prawnych i regulacyjnych dotyczących prowadzenia dokumentacji;
          </li>
          <li>
            nasze procedury tworzenia kopii zapasowych i odzyskiwania po awarii; oraz
          </li>
          <li>
            inne skutki prawne, takie jak obowiązujące terminy przedawnienia.
          </li>
        </ul>
        <p>
