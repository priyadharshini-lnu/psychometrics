        <h2>KROKI, KTÓRE PODEJMUJEMY, ABY CHRONIĆ INFORMACJE OSOBISTE</h2>
        <p>
          Nasza firma dąży do przestrzegania wszystkich obowiązujących przepisów dotyczących cyberbezpieczeństwa i ochrony danych. Mając na uwadze te cele, MMC ma dedykowanego Dyrektora ds. Bezpieczeństwa Informacji (CISO) oraz Globalnego Dyrektora ds. Prywatności (GCPO). CISO jest odpowiedzialny za zarządzanie Globalnym Zespołem ds. Bezpieczeństwa Informacji oraz kompleksowym programem cyberbezpieczeństwa. W ramach naszego programu cyberbezpieczeństwa wdrożyliśmy komercyjnie uzasadnione zabezpieczenia fizyczne, administracyjne i techniczne, aby chronić Informacje Osobowe przed nieautoryzowanym dostępem, użyciem, zmianą i usunięciem.
        </p>
        <p>
          GCPO prowadzi i nadzoruje Centrum Doskonałości w zakresie prywatności oraz Sieć Inspektorów Ochrony Danych, odpowiedzialnych za wdrażanie naszego kompleksowego globalnego programu ochrony prywatności. Sieć Inspektorów Ochrony Danych łączy naszych Inspektorów Ochrony Danych na całym świecie i dąży do konsekwentnego i dokładnego wdrażania naszego programu ochrony prywatności wszędzie tam, gdzie przetwarzamy dane. Możesz uzyskać imię i dane kontaktowe Inspektora Ochrony Danych w swojej jurysdykcji, kontaktując się z nami pod adresem <a href="mailto:privacy@mmc.com">privacy@mmc.com</a>.
        </p>
        <h2>TWOJE PRAWA OCHRONY DANYCH</h2>
        <p>
          W wielu przypadkach przetwarzamy dane osobowe, aby świadczyć nasze usługi klientom korporacyjnym, i powinieneś skontaktować się z nimi, aby skorzystać z wszelkich praw, które możesz mieć na mocy obowiązujących przepisów o ochronie prywatności. Jednakże, gdy działamy jako administrator lub firma, która jest głównie odpowiedzialna za podejmowanie decyzji dotyczących przetwarzania Twoich informacji, możesz mieć niektóre lub wszystkie prawa wymienione poniżej, w zależności od jurysdykcji i naszego powodu przetwarzania Twoich informacji. Proszę pamiętać, że możemy potrzebować użyć Twoich danych osobowych, aby zweryfikować Twoją tożsamość przed odpowiedzią na którekolwiek z poniższych praw.
        </p>
        <ul>
          <li>
            <strong>Prawo dostępu (Prawo do informacji)<br /></strong>
            Możesz poprosić nas o podanie dalszych szczegółów dotyczących tego, w jaki sposób wykorzystujemy Twoje dane osobowe, źródeł, kategorii lub konkretnych elementów danych osobowych, które zebraliśmy, kategorii stron trzecich, którym ujawniliśmy te informacje, oraz o zażądanie kopii danych osobowych, które posiadamy na Twój temat.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Prawo do poprawy <br /></strong>
            Możesz poprosić nas o zaktualizowanie wszelkich nieścisłości w danych osobowych, które posiadamy. Jeśli ujawnimy Twoje dane osobowe innym, poinformujemy ich o poprawce, jeśli to możliwe.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Prawo do usunięcia <br /></strong>
            Możesz poprosić nas o usunięcie Twoich danych osobowych, gdy nie mamy już prawnych podstaw do ich przetwarzania.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Prawo do sprzeciwu lub ograniczenia przetwarzania <br /></strong>
            Możesz mieć prawo do ograniczenia przetwarzania swoich danych osobowych w określonych okolicznościach, na przykład gdy kwestionujesz ich dokładność.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Prawo do przenoszenia danych <br /></strong>
            Możesz mieć prawo, tam gdzie jest to technicznie wykonalne, aby poprosić nas o przekazanie osobie trzeciej, którą wybierzesz, kopii Danych Osobowych, które od Ciebie uzyskaliśmy, w formacie strukturalnym, powszechnie używanym i czytelnym maszynowo.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Prawo do wycofania zgody <br /></strong>
            Jeśli opieramy się na Twojej zgodzie jako naszej podstawie prawnej do przetwarzania Twoich danych osobowych, masz prawo do wycofania tej zgody.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Prawo do złożenia skargi<br /></strong>
            Możesz mieć prawo do złożenia skargi do odpowiedniego organu nadzorczego lub regulacyjnego w swojej jurysdykcji, jeśli masz obawy dotyczące jakiegokolwiek aspektu naszych praktyk dotyczących prywatności.
          </li>
        </ul>
        <p>
