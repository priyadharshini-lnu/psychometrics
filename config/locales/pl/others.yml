      guidelines:
        cards:
          c1:
            content: Uwzględnij umiejętności, wiedzę i zdolności, które wymagają rozwoju. Upewnij się, że są one konkretne, mierzalne, osiągalne, realistyczne i możliwe do zrealizowania w wymienionych terminach.
            title: Cele rozwojowe
          c2:
            content: Jest to oparte na kompetencji, która ma zostać rozwinięta na podstawie doświadczenia z oceny.
            title: Kompetencja
          c3:
            content: Ta sekcja zawiera Twoje działania rozwojowe oparte na modelu uczenia się 70-20-10 wymienionym poniżej. Zaleca się wybór kombinacji każdego z trzech elementów, aby zapewnić zróżnicowane podejście do nauki i rozwoju.
            title: Aktywność
          c4:
            content: Upewnij się, że Twoje terminy są realistyczne w oparciu o to, kiedy cel może zostać zrealizowany. W razie potrzeby wprowadź odpowiednie poprawki.
            title: Harmonogram
          c5:
            content: Użyj sekcji postępu, aby wesprzeć rozwój na zidentyfikowanych ścieżkach.
            title: Postęp
        chart:
          collaboration: "<strong>20%</strong>Nauka <br /> współpracy"
          job: "<strong>70%</strong>Nauka <br />w pracy"
          learn: "<strong>10%</strong>Formalna nauka"
        content:
          list:
            r1: Należy pamiętać, że lista ta ma charakter wyłącznie orientacyjny i w zależności od indywidualnych aspiracji, rekomendacji przełożonego oraz priorytetów biznesowych organizacji mogą zostać rozważone dodatkowe ścieżki rozwoju.
            r2: Zachęcamy użytkowników do krytycznego przeglądu wszystkich treści i swobodnego modyfikowania, udoskonalania, zastępowania lub dodawania wszelkich działań lub zaleceń, z którymi się nie zgadzają.
            r3: 'Informacje dotyczące rozwoju zawarte w niniejszym raporcie mogą pochodzić z jednego lub obu poniższych źródeł:'
            r3a: Biblioteka programistyczna dostosowana do potrzeb Twojej organizacji
            r3b: Sugestie dotyczące rozwoju generowane przez sztuczną inteligencję
            r4: Niniejszy raport IDP został sporządzony przy pomocy technologii sztucznej inteligencji i może zawierać nieścisłości. Przedstawione w nim spostrzeżenia i zalecenia należy traktować z rezerwą i wykorzystywać wyłącznie jako narzędzie służące rozwojowi osobistemu i zawodowemu. Raport zachowuje ważność przez okres 12–18 miesięcy.
          main: Stworzony plan rozwoju zawodowego zawiera szczegółową listę działań rozwojowych, które możesz podjąć, mając na uwadze najlepsze praktyki w zakresie uczenia się, tj. wytyczne 70-20-10, które zapewniają stopniową ścieżkę rozwoju łączącą naukę w sali lekcyjnej, coaching i naukę w miejscu pracy. Na podstawie wyników procesu oceny, odpowiedzi udzielonych podczas rozmowy oraz raportów zewnętrznych, w stosownych przypadkach, zostały zalecone możliwe ścieżki rozwoju, które można rozważyć w celu Twojego rozwoju.
        learn_cards:
