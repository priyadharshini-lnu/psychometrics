    instruction_modal:
      campaign_start_final_instructions: |
        <p>  Należy pamiętać, że nie ma możliwości zatrzymania lub wstrzymania timera. Licznik czasu kampanii będzie odliczany nawet po zamknięciu przeglądarki, więc w żadnym momencie nie myśl o pozostawieniu zadań pomiędzy nimi i zajęciu się czymś innym. Pamiętaj, aby zminimalizować czynniki rozpraszające podczas wykonywania zadań. Znajdź ciche otoczenie, wyłącz powiadomienia na swoich urządzeniach i unikaj wielozadaniowości. Utrzymuj koncentrację i bądź skupiony. Gdy skończy się czas kampanii, nie będziesz mógł kontynuować. Jeśli zapoznałeś się z powyższą instrukcją, kliknij przycisk start, aby kontynuować przydzielone zadania.
        </p>
      campaign_start_instruction: |
        <h4>Przeczytaj dokładnie poniższe instrukcje.</h4>
        <p>  Zadania, które zaraz rozpoczniesz, mają określony czas. Po kliknięciu „Start” licznik kampanii rozpocznie się automatycznie. Masz %{minutes} minut na wykonanie wszystkich czynności. Staraj się realizować zadania w wyznaczonym terminie i efektywnie zarządzać czasem, aby uniknąć pośpiechu w procesie oceny. Pamiętaj, aby wykonać zadania za jednym razem, więc jeśli chcesz zrobić sobie przerwę, teraz jest na to czas.
        </p>
      common_proctoring_instructions: |
        <h4>Opieka</h4>
        <p>  Po kliknięciu przycisku Start zostaniesz przekierowany do naszego systemu nadzorującego. Będzie monitorować kamerę, mikrofon i ekran podczas sesji. Sesje te są automatycznie nadzorowane przez nasz wyrafinowany system sztucznej inteligencji, zapewniający nieprzerwaną i płynną obsługę użytkownika. Jednakże sesje mogą być również przeglądane przez osoby nadzorujące. Wszelkie oznaki niewłaściwego postępowania lub nieprawidłowości będą sygnalizowane. Ma to na celu zapewnienie, że nie będą podejmowane żadne próby oszustwa. Jeśli zostaną znalezione podejrzenia, Twoje zadania zostaną anulowane.
        </p>
      lockdown_browser_instruction: |
        <h4>Przeglądarka kontrolująca</h4>
        <p>  Aby wykonać nadzorowane zadania, będziesz musiał pobrać i zainstalować specjalną przeglądarkę. Postępuj zgodnie z instrukcjami na następnym ekranie. Możesz to odinstalować po wykonaniu wszystkich wymaganych czynności.
        </p>
