            - Zgłoś się na ochotnika do prowadzenia projektów zarządzania zmianą dla organizacji
            - Rozważ podejmowanie wymagających zadań
            - Współpracuj z innymi działami
            - Rozważ prowadzenie projektów poza swoją organizacją
            - Ściśle współpracuj z zewnętrznymi ekspertami branżowymi przy wspólnych projektach
