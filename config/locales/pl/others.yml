      guidelines:
        cards:
          c1:
            content: Uwzględnij umiejętności, wiedzę i zdolności, które wymagają rozwoju. Upewnij się, że są one konkretne, mierzalne, osiągalne, realistyczne i możliwe do zrealizowania w wymienionych terminach.
            title: Cele rozwojowe
          c2:
            content: Jest to oparte na kompetencji, która ma zostać rozwinięta na podstawie doświadczenia z oceny.
            title: Kompetencja
          c3:
            content: Ta sekcja zawiera Twoje działania rozwojowe oparte na modelu uczenia się 70-20-10 wymienionym poniżej. Zaleca się wybór kombinacji każdego z trzech elementów, aby zapewnić zróżnicowane podejście do nauki i rozwoju.
            title: Aktywność
          c4:
            content: Upewnij się, że Twoje terminy są realistyczne w oparciu o to, kiedy cel może zostać zrealizowany. W razie potrzeby wprowadź odpowiednie poprawki.
            title: Harmonogram
          c5:
            content: Użyj sekcji postępu, aby wesprzeć rozwój na zidentyfikowanych ścieżkach.
            title: Postęp
        chart:
          collaboration: "<strong>20%</strong>Nauka <br /> współpracy"
          job: "<strong>70%</strong>Nauka <br />w pracy"
          learn: "<strong>10%</strong>Formalna nauka"
        content:
          list:
            r1: Pamiętaj, że ta lista jest jedynie orientacyjna, a dodatkowe ścieżki rozwoju mogą być rozważane na podstawie indywidualnych aspiracji, zaleceń Twojego menedżera, a także priorytetów biznesowych organizacji.
            r2: Pamiętaj, że uruchomienie niektórych z tych ścieżek rozwoju będzie zależeć od ogólnoorganizacyjnej strategii edukacji i uczenia się.
            r3: Rozważ zalecane ścieżki zaznaczone poniżej podczas opracowywania swojego Indywidualnego Planu Rozwoju.
          main: Ta sekcja zawiera zbiorczą listę wszystkich ścieżek rozwoju, mając na uwadze najlepsze praktyki uczenia się, tj. wytyczne 70-20-10, które zapewniają progresywną podróż łączącą naukę w klasie, coaching i naukę w pracy. Na podstawie wyników doświadczenia w rozwoju przywództwa i priorytetów biznesowych, zalecane zostały możliwe ścieżki rozwoju, które można rozważyć w swoim rozwoju.
        learn_cards:
          collaboration:
            list:
            - Zaoferuj coaching lub mentoring innym
            - Poproś o mentoring eksperta w swojej dziedzinie
            - Zdobądź coacha, który wesprze Twój rozwój
            - Utwórz grupę współpracy do omawiania bieżących wyzwań w biznesie
            - Uzyskaj formalną i nieformalną informację zwrotną od innych
            - Aktywnie uczestnictwo w stowarzyszeniach i sieciach branżowych
            - Buduj własne sieci zewnętrzne
            title: Nauka współpracy (20%) <br/> Rozwój poprzez innych
          job:
            list:
            - Przyjmij stanowiska kierownicze w komitetach interesariuszy lub zarządzających
            - Zgłoś się na ochotnika do prowadzenia projektów zarządzania zmianą dla organizacji
            - Rozważ podejmowanie wymagających zadań
            - Współpracuj z innymi działami
            - Rozważ prowadzenie projektów poza swoją organizacją
            - Ściśle współpracuj z zewnętrznymi ekspertami branżowymi przy wspólnych projektach
            title: Nauka w pracy (70%) <br/> Rozwój poprzez doświadczenie
          learn:
            list:
            - Przyjmij stanowiska kierownicze w komitetach interesariuszy lub zarządzających
            - Zgłoś się na ochotnika do prowadzenia projektów zarządzania zmianą dla organizacji
            - Rozważ podejmowanie wymagających zadań
            - Współpracuj z innymi działami
