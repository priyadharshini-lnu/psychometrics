    <h2>Zasady wykorzystywania plików cookie</h2>

    <p>Dzień wejścia w życie: 14 grudnia 2023 r</p>

    <p>Wykorzystujemy pliki cookie i powiązane technologie śledzenia, w tym sygnały nawigacyjne, piksele śledzące i pliki dziennika (zwane dalej łącznie „plikami cookie”) w tej witrynie, aby odróżnić poszczególnych użytkowników, ocenić i poprawić funkcjonalność witryny i naszych usług oraz zapewnić dobre wrażenia.</p>

    <h3>CO TO JEST PLIK COOKIE</h3>
    <p>Pliki cookie to fragmenty danych udostępniane między przeglądarką internetową użytkownika a witryną internetową. Niektóre pliki cookie są niezbędne do funkcjonowania witryny internetowej. Niektóre pomagają nam ocenić i udoskonalić jej działanie. Wykorzystujemy również pliki cookie, aby udostępniać użytkownikowi odpowiednie treści, produkty i usługi. Pliki cookie nie są w stanie odczytywać danych z dysku twardego komputera użytkownika.</p>

    <h3>Istnieją różne rodzaje plików cookie o różnych funkcjach:</h3>

    <p>(i) <strong>Sesyjne pliki cookie:</strong> są przechowywane na komputerze użytkownika wyłącznie podczas trwania jego sesji sieci Web. Są one automatycznie usuwane po zamknięciu przeglądarki. Zazwyczaj przechowują anonimowy identyfikator sesji, pozwalający na przeglądanie witryny internetowej bez logowania się na każdej stronie. Nie gromadzą żadnych informacji z komputera użytkownika.</p>

    <p>(ii) <strong>Trwałe pliki cookie:</strong> są przechowywane na komputerze użytkownika w postaci plików i pozostają na nim po zamknięciu przeglądarki. Mogą być odczytane przez witrynę internetową, która go stworzyła, przy następnych odwiedzinach.</p>

    <p>(iii) <strong>Własne pliki cookie:</strong> te pliki cookie są tworzone przez naszą firmę. Są przechowywane i przesyłane między naszymi serwerami a dyskiem twardym komputera użytkownika. Mogą być sesyjne albo trwałe.</p>

    <p>(iv) <strong>Pliki cookie stron trzecich:</strong> te pliki cookie są tworzone przez jednego z naszych partnerów zewnętrznych. Są przechowywane i przesyłane między serwerem podmiotu zewnętrznego a dyskiem twardym komputera użytkownika. Zazwyczaj są trwałe.</p>

    <h3>W JAKI SPOSÓB I DLACZEGO WYKORZYSTUJEMY PLIKI COOKIE</h3>
    <p>W zależności od witryny możemy używać następujących plików cookie ze względu na towarzyszące im cele:</p>

    <p><strong>Ściśle niezbędne:</strong> umożliwiają użytkownikowi poruszanie się po witrynie i korzystanie z funkcji, takich jak dostęp do bezpiecznych obszarów. Bez tych plików cookie niektóre usługi, np. logowanie czy uzyskanie wyceny, nie mogą być świadczone. Nie służą do celów marketingowych ani zapamiętywania przeglądanych stron.</p>

    <p><strong>Funkcjonalne:</strong> zapamiętują wybory użytkownika (np. język, region, dane logowania) i umożliwiają korzystanie z udoskonalonych funkcji witryny. Mogą również zapamiętywać ustawienia czcionek, rozmiar tekstu czy wyświetlanie materiałów wideo lub komentarzy. Dane są anonimowe i nie służą do reklam.</p>

    <p><strong>Analityczne:</strong> gromadzą informacje o tym, jak odwiedzający korzystają z witryny, np. najczęściej odwiedzane strony czy występujące błędy. Pomagają udoskonalać witrynę.</p>

    <p><strong>Reklamowe:</strong> umożliwiają wyświetlanie odpowiednich reklam i zarządzanie ich funkcjonowaniem. Są to głównie pliki cookie podmiotów zewnętrznych.</p>

    <p><strong>Adresy IP:</strong> mogą być zbierane w celu monitorowania regionów użytkowników i łączenia danych nieosobowych.</p>

    <h3>W JAKI SPOSÓB ZARZĄDZAĆ PLIKAMI COOKIE</h3>
    <p>Kliknij „Zarządzaj plikami cookie” na dole strony, aby włączyć lub wyłączyć określone pliki cookie za pomocą naszego narzędzia Cookie Consent Manager. Nie można wyłączyć ściśle niezbędnych plików cookie.</p>

    <p>Możesz także zarządzać plikami cookie w ustawieniach swojej przeglądarki – sprawdź sekcję „Pomoc” przeglądarki.</p>

    <h3>WITRYNY ZEWNĘTRZNE</h3>
    <p>Polityka cookie nie dotyczy witryn zewnętrznych, do których prowadzą nasze linki. Zalecamy zapoznanie się z ich politykami prywatności i cookie.</p>

    <h3>ZMIANY W POLITYCE COOKIE</h3>
    <p>Polityka cookie może być okresowo aktualizowana. Data wejścia w życie znajduje się na górze strony.</p>

    <h3>OPIS WYKORZYSTYWANYCH PLIKÓW COOKIE</h3>
    <p>Kliknij „Zarządzaj plikami cookie” w stopce witryny, aby zobaczyć szczegółowe informacje o poszczególnych plikach cookie. W niektórych przypadkach link może nie być dostępny.</p>

    <h3>SKONTAKTUJ SIĘ Z NAMI</h3>
    <p>W przypadku pytań dotyczących polityki cookie prosimy o kontakt w sposób wskazany w naszej Polityce prywatności.</p>
