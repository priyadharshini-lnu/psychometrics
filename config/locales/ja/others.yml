    instruction_modal:
      campaign_start_final_instructions: |
        <p>
        タイマーを停止または一時停止する方法はありませんのでご注意ください。ブラウザを閉じてもキャンペーンタイマーは進み続けるため、他の作業のためにタスクを離れることがないようにしてください。タスク中の邪魔は最小限に抑えるようにしてください。静かな環境を見つけて、お使いのデバイスの通知をオフにして、マルチタスクを避けてください。集中力を維持して専念しましょう。キャンペーンタイマーが時間切れになると、続行できなくなります。上記の手順をお読みになった上で、[開始]をクリックして割り当てられたタスクを続けてください。
        </p>
      campaign_start_instruction: |
        <h4>以下の手順をよくお読みください。</h4>
        <p>
        あなたが始めようとしているタスクには、時間制限があります。「開始」をクリックすると、キャンペーンタイマーが自動的に開始します。すべてのアクティビティを完了するための制限時間は%{minutes}分です。指定時間内にタスクの完了を目指し、評価プロセスを急いで終わらせることのないよう、時間を効果的に管理してください。タスクはすべて一度に完了することをお勧めします。休憩が必要な場合は、今がその時です。</p>
      common_proctoring_instructions: |
        <h4>監督</h4>
        <p>
        [開始]ボタンをクリックすると、監督システムにリダイレクトされます。セッション中にカメラ、マイク、画面を監視します。高度なAIシステムによってセッションを自動的に監督し、中断のないスムーズなユーザーエクスペリエンスを提供します。ただし、セッションは人間の監督によって検査される場合もあります。不正行為や異常な行動の徴候にはフラグが立てられます。これは、反則行為を防止するために行われます。疑わしい行為があった場合、タスクはキャンセルされます。
        </p>
      lockdown_browser_instruction: |
        <h4>ブラウザの監督</h4>
        <p>
        監督タスクを完了するには、特殊なブラウザをダウンロードしてインストールする必要があります。次の画面の指示に従ってください。すべての必須アクティビティを完了した後に、アンインストールできます。
