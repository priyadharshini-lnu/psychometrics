            content: このセクションには、以下に記載されている70-20-10学習モデルに基づいた開発アクションが含まれています。多様な学習と開発アプローチを確保するために、三つの要素の組み合わせを選択することをお勧めします。
            title: 活動
          c4:
            content: 目標がいつ完了できるかに基づいて、現実的なタイムラインを設定してください。必要に応じて適宜修正してください。
            title: タイムライン
          c5:
            content: 進捗セクションを使用して、特定されたトラックの進行をサポートしてください。
            title: 進捗
        chart:
          collaboration: "<strong>20%</strong>協調的な<br />学習"
          job: "<strong>70%</strong>業務上の<br />学習"
          learn: "<strong>10%</strong>公式な学習"
        content:
          list:
            r1: このリストはあくまで参考例であり、個人の志向、上司からの推薦、および組織の業務上の優先事項に基づき、追加的なキャリアパスが検討される可能性があることにご留意ください。
            r2: ユーザーはすべてのコンテンツを批判的に検討することが推奨され、同意できない行動や推奨事項については自由に修正、改善、置換、追加を行うことができます。
            r3: 本報告書に含まれる開発インプットは、以下のいずれか一方または両方の情報源から得られたものである可能性があります：
            r3a: 貴組織向けにカスタマイズされた開発ライブラリ
            r3b: AIが生成した開発提案
            r4: このIDPレポートはAI技術を用いて作成されたものであり、不正確な情報が含まれている可能性があります。記載されている洞察や提言については、ご自身の判断で解釈し、あくまで個人的および職業的な成長のためのツールとしてご利用ください。本レポートの有効期間は12～18ヶ月です。
          main: 作成されたIDPには、ベストプラクティス学習（70-20-10ガイドライン）を踏まえた詳細な開発行動リストが含まれています。これは、教室学習、コーチング、OJTを組み合わせた段階的な成長プロセスを提供します。アセスメントセンターの結果、チャット対応内容、および該当する場合は外部レポートに基づき、開発の道筋として検討可能な複数の開発パスが提案されています。
        learn_cards:
          collaboration:
            list:
            - 他者へのコーチングやメンタリングを提供する
            - 専門分野の専門家からメンタリングを受ける
            - 開発をサポートするコーチを獲得する
            - ビジネスの継続的な課題について議論するための協力的なワーキンググループを設立する
            - 他者から正式および非公式にフィードバックを得る
            - 業界団体やネットワークで積極的な役割を果たす
            - 自分の外部ネットワークを構築する
            title: 協調学習（20%）<br/>他者を通じた開発
          job:
            list:
            - ステークホルダーや管理委員会でリーダーシップの地位を引き受ける
            - 組織の変更管理プロジェクトをリードするボランティアをする
            - 挑戦的な任務を引き受けることを検討する
            - 他の機能と横断的に協力する
            - 組織外のプロジェクトをリードすることを検討する
            - 共同プロジェクトで外部の業界専門家と密接に協力する
            title: 業務上の学習（70%）<br/>経験を通じた開発
          learn:
            list:
            - 体系的な研修プログラムに参加する
            - オンラインeラーニングコースを修了する
            - 本、記事、出版物を読む
            - 専門的な資格、認定、および認可を取得する
            - 講座、ワークショップ、セミナーに参加する
            title: 公式学習（10%）<br/>体系的な学習を通じた開発
