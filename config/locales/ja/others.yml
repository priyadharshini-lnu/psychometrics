        content:
          list:
            r1: このリストは参考用であり、個人の希望、マネージャーからの推奨事項、組織のビジネス優先事項に基づいて、追加の開発経路が検討される場合があることにご注意ください。
            r2: これらの開発経路の一部の開始は、組織全体の教育・学習戦略に依存する場合があることにご注意ください。
            r3: 個人開発計画を作成する際には、以下に示された推奨経路を検討してください。
          main: このセクションには、ベストプラクティスの学習、つまり70-20-10のガイドラインを念頭に置いた、すべての開発経路の累積リストが含まれています。これは、教室での学習、コーチング、業務上の学習を組み合わせた進歩的な旅を提供します。リーダーシップ開発経験とビジネスの優先事項の結果に基づいて、あなたの開発のために検討できる可能な開発経路が推奨されています。
        learn_cards:
          collaboration:
            list:
            - 他者へのコーチングやメンタリングを提供する
            - 専門分野の専門家からメンタリングを受ける
            - 開発をサポートするコーチを獲得する
            - ビジネスの継続的な課題について議論するための協力的なワーキンググループを設立する
            - 他者から正式および非公式にフィードバックを得る
            - 業界団体やネットワークで積極的な役割を果たす
            - 自分の外部ネットワークを構築する
            title: 協調学習（20%）<br/>他者を通じた開発
          job:
            list:
            - ステークホルダーや管理委員会でリーダーシップの地位を引き受ける
            - 組織の変更管理プロジェクトをリードするボランティアをする
            - 挑戦的な任務を引き受けることを検討する
            - 他の機能と横断的に協力する
            - 組織外のプロジェクトをリードすることを検討する
            - 共同プロジェクトで外部の業界専門家と密接に協力する
            title: 業務上の学習（70%）<br/>経験を通じた開発
          learn:
            list:
            - ステークホルダーや管理委員会でリーダーシップの地位を引き受ける
            - 組織の変更管理プロジェクトをリードするボランティアをする
