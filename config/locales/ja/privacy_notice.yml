---
ja:
  privacy_notice:
    marsh: "<div>\n  <h1><strong>マーサー・タレント・エンタープライズ 個人情報保護方針  </strong>&nbsp;</h1>\n  <p>発効日: 15 September 2024</p>\n  <p>\n    本プライバシー通知では、マーサータレントエンタープライズ（以下、「\n    <strong>MTE</strong>\n    」）が、 特定または識別可能な個人に関する情報（以下、「個人情報」）をどのように収集、使用、共有、保持、移転、その他の方法で処理するか 、および個人情報に関するお客様の権利について説明します。 当社は、当社が個人情報をどのように取り扱うかをお客様にご理解いただくことが重要であると考えており、以下に記載する当社の個人情報保護方針をお客様にご理解いただくようお願いいたします。\n  </p>\n  <p>\n    MTEは行動科学アセスメントソリューションのプロバイダーであり、場合によっては、支払取引の処理を含め、データ管理者として機能するクライアント、金融機関、加盟店、およびその他のパートナーの代理として、またその指示の下で行動することにご注意ください。 これらの文脈におけるお客様の個人情報の処理に関する詳細については、これらのパートナーのプライバシーポリシーを参照してください。\n  </p>\n  <h2>あなたと私たちの関係</h2>\n  <p>\n    あなたは、第三者からMTEのプラットフォーム上で評価を完了するよう求められています。 この第三者はMTEの顧客であり、お客様の雇用主、潜在的雇用主、またはその他の関係者である可能性があります。 MTEは、お客様に代わってお客様の個人情報を収集および処理します。 当社は、どのような個人情報を収集し、その個人情報をどのように処理するかについて、お客様から提供された指示に従います。 したがって、MTEは、お客様の個人情報の処理を決定するお客様の処理者として機能します。\n  </p>\n  <p>\n    お客様の個人情報の取り扱いについてご質問がある場合は、当社のクライアントのプライバシーに関する通知をご覧ください。\n  </p>\n  <h2>当社が収集する個人情報  </h2>\n  <p>\n    クライアントの指示により、クライアントに代わって特定の情報を収集します。 アカウントを作成するために必要なお客様のお名前とEメールアドレス以外に、MTEが独自に収集する情報を決定することはありません。 当社は、お客様のニーズと方向性に基づき、当社の意図する事業目的を達成するために適切な場合、以下の種類の個人情報を収集することがあります：\n  </p>\n  <table width=\"600\">\n    <tbody>\n      <tr>\n        <td width=\"146\">\n          <p>\n            <strong\n              >カテゴリー\n            </strong>\n          </p>\n        </td>\n        <td width=\"454\">\n          <p>\n            <strong\n              >例\n            </strong>\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"146\"><p>伝記的識別子</p></td>\n        <td width=\"454\">\n          <p>氏名、生年月日、年齢、出生地、性別。</p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"146\"><p>連絡先</p></td>\n        <td width=\"454\">\n          <p>自宅住所、電話番号、個人メールアドレス。</p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"146\"><p>識別情報</p></td>\n        <td width=\"454\">\n          <p>\n            納税者番号、社会保障番号またはその他の政府発行の身分証明書番号、運転免許証番号、パスポート情報、銀行口座詳細、所得税申告書、所得税番号。\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"146\">\n          <p>職業または雇用に関する情報</p>\n        </td>\n        <td width=\"454\">\n          <p>\n            雇用主またはグループ、当社との関係、役職、業務上の連絡先、従業員ID、雇用等級、従業員の業績、給与および報酬の取り決め、職歴、および/または保険契約者、被保険者、保険金受取人または保険金請求者との関係。\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"146\"><p>敏感な人口統計学的属性</p></td>\n        <td width=\"454\">\n          <p>\n            人種、市民権、身体的または精神的な健康状態や障害、性別（性別、性自認、妊娠または出産、関連する病状を含む）、性的指向、組合員、退役軍人、軍属の地位。\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"146\"><p>生体情報および身体情報</p></td>\n        <td width=\"454\">\n          <p>\n            試験監督オプションの一部としての顔スキャンと顔モニタリング。\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"146\"><p>お客様の物理的環境に関するデータ</p></td>\n        <td width=\"454\">\n          <p>\n            試験監督オプションの一環として、ビデオまたは写真で撮影されたあなたの特定の地域。 あなたの物理的環境に関して収集される具体的なデータは、試験監督用カメラから見えるものによって異なります。\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"146\"><p>インターネットまたは同様のネットワーク活動 </p></td>\n        <td width=\"454\">\n          <p>\n            閲覧および検索履歴、ウェブサイト、アプリケーション、または広告との相互作用、クッキーまたはウェブビーコンからのデータ、ログイン認証情報、ドメイン名、およびお客様が電子メールを読み、電子メールに返信する場合を含む、当社電子メールとの相互作用、ISP（インターネットサービスプロバイダ）、ブラウザの詳細、その他のウェブサイト活動、オンライン識別子（IPアドレスまたはデバイスIDを含む）。\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"146\"><p>その他任意で提供された情報 </p></td>\n        <td width=\"454\">\n          <p>\n            パートナーおよび扶養家族（未成年の扶養家族を含む）に関する情報、緊急連絡先の詳細、開示に関する声明、制限条項、ジオロケーション、マーケティングおよびコミュニケーションに関する嗜好、お客様が参加した当社主催のイベントに関する情報、およびお客様が個人を特定することを選択した場合のフィードバックまたはアンケート回答。\n          </p>\n        </td>\n      </tr>\n    </tbody>\n  </table>\n  <p>\n    これらは一例であることにご留意いただきたい。 MTEは、データ最小化の概念を遵守し、お客様へのサービス提供に厳密に必要な個人情報のみを収集するよう努めます。 ただし、お客様から要求された情報や、お客様が自発的に提供された情報を管理することはできません。\n  </p>\n  <h2>個人情報の収集方法</h2>\n  <h3>\n    <strong>\n      お客様、お客様の代理人または第三者から提供された情報\n    </strong>\n  </h3>\n  <p>当社は、以下の情報源から個人情報を収集することがあります：</p>\n  <ul>\n    <li>\n      例えば、お客様がウェブサイトを訪問したとき、アカウントを作成したとき、アンケートに回答したとき、またはその他の方法で当社に情報を提供したときなどです。\n    </li>\n    <li>\n      あなたの雇用主、協会、団体または福利厚生プログラム／プランのスポンサーを含む、あなたの代理人。\n    </li>\n  </ul>\n  <p>\n    アセスメント中、ウェブカメラ、マイク、その他のハードウェア要素を介して個人情報が収集される場合があります。 システムおよびMTEプログラムは、ハードウェアから個人情報を収集する前に、お客様の同意を求めます。\n  </p>\n  <p>\n    あなたが他の人（例えば、家族、受益者、または扶養家族）に関する個人情報を当社に提供する場合、あなたはこの情報を提供する権限があり、適切な場合にはこのプライバシー通知を共有していることを表明するものとします。 当社は、未成年者から故意に個人情報を直接収集することはありません。\n  </p>\n  <h3><strong>自動化された手段による収集 </strong>&nbsp;</h3>\n  <p>\n    当社は、 当社所有のウェブサイトにおいて、 クッキーおよび関連するトラッキング 技術（以下「クッキー」といいます ）を使用しています 。 お客様の司法管轄権に基づき利用可能な場合、ウェブサイトユーザーは、ウェブサイトの下部にある「クッキーの管理」リンクを使用して、特定のクッキーの使用をオプトアウトすることができます。 クッキーの使用方法について詳しくは、\n    <a href=\"https://www.mercer.com/en-sa/footer/mercer-cookie-notice/\"\n      >クッキーに関するお知らせ</a\n    >  をご覧 ください。\n  </p>\n  <h3><strong>第三者による回収  </strong>&nbsp;</h3>\n  <p>\n    お客様が当社を通じて取引を行う場合、第三者（サービスプロバイダーや保険会社など）は、当該取引に関連して、Cookieを通じた場合を含め、お客様に関するクレジットカードまたはその他の個人情報を収集し、処理することがあります。 このような場合、および当社がお客様の雇用主、団体、またはその他の第三者から情報を受け取るその他の取り決めについては、お客様の情報が第三者によってどのように使用され、開示されるかについて詳しく知るために、当該第三者のプライバシーポリシーをお読みになることをお勧めします。\n  </p>\n  <h2>収集した個人情報の使用方法  </h2>\n  <p>当社は、収集した個人情報を利用することがあります：  </p>\n  <table width=\"600\">\n    <tbody>\n      <tr>\n        <td width=\"107\">\n          <p>\n            <strong>カテゴリー\n            </strong>\n          </p>\n        </td>\n        <td width=\"317\">\n          <p><strong>用途</strong></p>\n        </td>\n        <td width=\"176\">\n          <p><strong>法的根拠</strong></p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"107\">\n          <p><strong>事業遂行のため</strong></p>\n        </td>\n        <td width=\"317\">\n          <p>\n            当社は、お客様の身元確認、お問い合わせへの対応、お客様との連絡、取引の処理、オンラインアカウントの開設、契約上の義務の履行など、当社の事業遂行に必要な範囲で個人情報を使用します。\n          </p>\n        </td>\n        <td width=\"176\">\n          <p>\n            契約の履行および該当する場合、正当な利益（当社が義務を履行し、サービスを提供できるようにするため。\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"107\">\n          <p>\n            <strong>適用される法律で許可されている場合、マーケティング資料を提供するため</strong>\n          </p>\n        </td>\n        <td width=\"317\">\n          <p>\n            当社は、お客様が関心をお持ちと思われる製品、サービス、見識に関する情報をお送りするために、お客様の連絡先情報を使用することがあります。 これらの連絡は、お客様のマーケティング上のご希望、およびデータ保護や電子通信に関する法律を含む適用される世界的な法律に従って、電子メール、テキスト、郵便、または電話で送信される場合があります。 その結果、当社がお客様に連絡する根拠は、お客様がどのような方であるか、お客様と当社との関係、およびお客様の所在地によって異なります。\n          </p>\n          <p>\n            当社がお客様とマーケティングコミュニケーションを共有する根拠が何であるかにかかわらず、当社は現地の法律を遵守し、お客様がいつでも購読を停止できるオプションを提供します。 また、 <a href=\"mailto:privacy@mmc.com\">privacy@mmc.com</a>までご連絡いただければ、マーケティング設定を変更することもできます 。\n          </p>\n          <p>\n            お客様がマーケティングコミュニケーションの受信をオプトアウトされた場合でも、当社がお客様に提供するサービスに関連するコミュニケーションをお送りする場合があることにご留意ください。\n          </p>\n        </td>\n        <td width=\"176\">\n          <p>\n            法的義務、同意（お客様は拒否または撤回することができます）、および該当する場合、正当な利益（当社の製品およびサービスに関連する最新情報をお客様に提供するため）。\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"107\">\n          <p>\n            <strong>研究、データ分析、開発目的</strong>\n          </p>\n        </td>\n        <td width=\"317\">\n          <p>\n            当社は、他の顧客からの情報とともに個人情報を分析し、洞察、報告書、その他の分析結果を作成して、当社の提供するサービスをよりよく理解し、その質を向上させ、当社のアドバイス、製品、およびサービスを販売し、当社のマーケティング活動、ウェブサイト、およびサービス全体の効果を評価することがあります。\n          </p>\n          <p>\n            当社は、特定のお客様または個人に関連付けられないように、個人情報を非特定化する場合があることにご留意ください。\n          </p>\n        </td>\n        <td width=\"176\">\n          <p>\n            該当する場合、正当な利益（当社のサービスを向上させるため）。\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"107\">\n          <p>\n            <strong>特定の活動を監視し、ネットワークのセキュリティとパフォーマンスを維持し、サイバー攻撃から保護するため</strong>\n          </p>\n        </td>\n        <td width=\"317\">\n          <p>\n            当社は、サービスの質、手続きの遵守、および不正行為撲滅を確保するため、照会および取引を監視しています。 また、ネットワークセキュリティの維持、ウェブサイトのパフォーマンスの監視、サイバー攻撃からのシステム保護のために、必要に応じて個人情報を使用します。\n          </p>\n        </td>\n        <td width=\"176\">\n          <p>\n            法的義務、および該当する場合は正当な利益（当社サービスの品質と合法性を確保するため）。\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"107\">\n          <p>\n            <strong>当社のウェブサイトを維持し、ウェブサイトのコンテンツが適切であることを確認するため</strong>\n          </p>\n        </td>\n        <td width=\"317\">\n          <p>\n            当社は、当社のウェブサイトを維持し、当社のウェブサイトからのコンテンツがお客様およびお客様のデバイスにとって最も効果的な方法で表示されるようにするために、必要に応じて個人情報を使用します。\n          </p>\n        </td>\n        <td width=\"176\">\n          <p>\n            契約の履行、および該当する場合は正当な利益（ウェブサイト上のコンテンツやサービスをお客様に提供するため）。\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"107\">\n          <p><strong>事業の再編または変更のため</strong></p>\n        </td>\n        <td width=\"317\">\n          <p>\n            必要な場合(i) 当社の事業またはその一部を第三者に売却するための交渉の対象となる場合、(ii) 第三者に売却される場合、(iii) 組織再編が行われる場合。\n          </p>\n        </td>\n        <td width=\"176\">\n          <p>\n            法的義務または正当な利益（当社が事業を変更するため）。\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"107\">\n          <p>\n            <strong>法的または規制上の義務に関連する場合</strong>\n          </p>\n        </td>\n        <td width=\"317\">\n          <p>\n            当社は、規制上の開示要件を遵守するため、または必要に応じて規制当局との対話の一環として個人情報を使用します。\n          </p>\n        </td>\n        <td width=\"176\">\n          <p>\n            法的義務、および必要に応じて正当な利益（法執行機関や規制当局に協力するため）。\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"107\">\n          <p>\n            <strong>不正行為、マネーロンダリング防止、制裁審査用</strong>\n          </p>\n        </td>\n        <td width=\"317\">\n          <p>\n            特定のサービスを提供するために顧客との関係を構築または維持する場合、当社は詐欺、反マネーロンダリングまたは制裁チェックを実施する目的で個人情報を使用します。\n          </p>\n        </td>\n        <td width=\"176\">\n          <p>\n            法的義務、および必要に応じて正当な利益（法執行機関や規制当局に協力するため）。\n          </p>\n        </td>\n      </tr>\n    </tbody>\n  </table>\n  <p>\n    当社はまた、収集の時点でお客様に別途説明したとおり、当社が収集し受領した個人情報を使用することがあります。\n  </p>\n  <h3><strong>外部リンク  </strong>&nbsp;</h3>\n  <p>\n    当社のウェブサイトには、MTE以外の組織が運営するウェブサイトへのリンクが含まれている場合があります。  当社のウェブサイト上のハイパーリンクを使用して他の組織のウェブサイトにアクセスした場合、他の組織はお客様から情報を収集することがあります。  MTEは、リンク先のウェブサイトのコンテンツやプライバシー慣行、またはそれらによるお客様の個人情報の使用について責任を負いません。  このようなリンクを経由してMTEウェブサイトを離れる場合（ブラウザのロケーションバーでURLを確認すると、現在地がわかります）、そのウェブサイトのプライバシーポリシー、利用規約、およびその他の通知を参照して、他の組織がお客様から収集した個人情報をどのように扱うかを確認する必要があります。\n  </p>\n  <h2>個人情報の開示先</h2>\n  <p>\n    当社は、以下の第三者に個人情報を開示することがあります：\n  </p>\n  <table width=\"601\">\n    <tbody>\n      <tr>\n        <td width=\"301\">\n          <p><strong>第三者のカテゴリー</strong></p>\n        </td>\n        <td width=\"301\">\n          <p><strong>情報開示の目的</strong></p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"301\">\n          <p>\n            お客様の雇用主、団体、グループ、または福利厚生プログラムのスポンサー（該当する場合）（MTEのクライアントなど\n          </p>\n        </td>\n        <td width=\"301\"><p>お客様へのサービス提供のため </p></td>\n      </tr>\n      <tr>\n        <td width=\"301\">\n          <p>\n            MTE の関連会社またはマーシュ・マクレナンのグループ会社（MMC）内のその他の事業体\n          </p>\n        </td>\n        <td width=\"301\">\n          <p>\n            お客様にサービスを提供したり、追加の製品やサービスに関してお客様に連絡したりすることができるようにします。\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"301\">\n          <p>代理店または第三者サービス・プロバイダー </p>\n        </td>\n        <td width=\"301\">\n          <p>\n            当社または当社に代わって機能またはサービスを実行すること。 このような第三者は、MTEのために、またはMTEに代わってサービスを提供する以外の目的で個人情報を使用することを契約で制限されています。\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"301\">\n          <p>\n            当社の関連会社およびサービスに関連して当社または当社のクライアントが従事する第三者を含むマーケティングパートナー。\n          </p>\n        </td>\n        <td width=\"301\">\n          <p>\n            当社の製品、サービスまたは見識に関する情報をお客様に提供するために法律で認められている場合。\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"301\"><p>潜在的パートナーまたは後継事業体</p></td>\n        <td width=\"301\">\n          <p>\n            合併、買収、倒産、資産売却、または第三者が当社の資産の全部または一部を支配するその他の取引。\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"301\"><p>ウェブサイト分析と広告会社</p></td>\n        <td width=\"301\">\n          <p>\n            お客様の関心に基づいて広告やコンテンツをパーソナライズし、広告やコンテンツのパフォーマンスを測定し、広告やコンテンツを閲覧するオーディエンスに関する洞察を得ることができます。\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"301\">\n          <p>\n            不正防止データベース、監督または規制当局、法執行機関、その他の第三者機関\n          </p>\n        </td>\n        <td width=\"301\">\n          <p>\n            不正行為の防止、監督当局または規制当局との連絡、MTE、関連会社、ビジネスパートナー、およびあらゆるウェブサイトのユーザーの法的権利、安全性、セキュリティの保護および防御、ウェブサイトの利用規約の施行、違法行為の疑いまたは実際のクレームへの対応、監査への対応、苦情またはセキュリティ上の脅威の調査、または適用される法律、規制、法的手続き、政府の要請の遵守のために必要な場合。\n          </p>\n        </td>\n      </tr>\n    </tbody>\n  </table>\n  <p>\n    また、当社は、商業上正当かつ合法的な業務目的のために、お客様を特定する合理的な可能性のない非特定情報を開示することがあります。  当社が非識別化された情報を保有している場合、当社は、法律で認められている場合を除き、データの再識別化を試みることなく、その情報を維持し、使用します。\n  </p>\n  <h2>個人情報保護のための措置  </h2>\n  <p>\n    当社 は、適用されるすべてのサイバーセキュリティおよびデータ保護法の遵守に努めています。 こうした目標を念頭に、三菱自動車は専任の最高情報セキュリティ責任者（CISO） 、グローバル最高プライバシー責任者（GCPO）を置いている。 CISOは 、グローバル情報セキュリティチームと包括的なサイバーセキュリティプログラムの管理責任を負う。  当社のサイバーセキュリティプログラムの一環として、当社は、個人情報を不正なアクセス、使用、変更、および削除から保護するために、商業上合理的な物理的、管理上、および技術的な安全対策を実施しています。\n  </p>\n  <p>\n    GCPOは、当社の包括的なグローバル・プライバシー・プログラムの実施に責任を負うプライバシー・センター・オブ・エクセレンスとデータ保護オフィサー・ネットワークを指揮・監督します。 データ保護オフィサー・ネットワークは、世界中のデータ保護オフィサーを結びつけ、当社がデータを処理するあらゆる場所で、当社のプライバシー・プログラムを一貫して徹底的に実施することを目指しています。 お客様の法域におけるデータ保護責任者の氏名および連絡先は、 <a href=\"mailto:privacy@mmc.com\">privacy@mmc.com</a>までお問い合わせください。\n  </p>\n  <h2>データ保護の権利  </h2>\n  <p>\n    多くの場合、当社は法人顧客にサービスを提供するために個人情報を取り扱いますので、適用される個人情報保護法に基づきお客様が有する権利を行使する場合は、法人顧客にご連絡ください。 ただし、当社がお客様の情報の処理方法を決定する主な責任を負う管理者または事業者として行動する場合、お客様は 、法域および当社がお客様の情報を処理する理由に応じて、以下に列挙する権利の一部または全部を有する可能性があります 。   なお、以下の権利に対応する前に、ご本人であることを確認させていただくために、個人情報を利用させていただく場合があります。\n  </p>\n  <ul>\n    <li>\n      <strong>アクセス権（知る権利）  <br /></strong>\n      お客様は、当社がお客様の個人情報をどのように利用するか、当社が収集した個人情報の情報源、カテゴリー、または特定の個人情報、当社が情報を開示した第三者のカテゴリー、および当社が保有するお客様に関する個人情報のコピーを要求する方法について、さらなる詳細を提供するよう当社に求めることができます。\n    </li>\n  </ul>\n  <ul>\n    <li>\n      <strong>訂正権   <br /></strong>\n      お客様は、当社が保有する個人情報の不正確な情報を更新するよう当社に求めることができます。 お客様の個人情報を他者に開示する場合は、可能な限り、訂正について他者に通知します。\n    </li>\n  </ul>\n  <ul>\n    <li>\n      <strong>削除権 <br /></strong>\n      お客様は、当社がお客様の個人情報を処理する合法的な理由がなくなった場合、当社にお客様の個人情報を消去するよう求めることができます。\n    </li>\n  </ul>\n  <ul>\n    <li>\n      <strong>処理に反対する権利、または処理を制限する権利  <br /></strong>\n      お客様は、個人情報の正確性に異議を唱える場合など、特定の状況において個人情報の処理を制限する権利を有する場合があります。\n    </li>\n  </ul>\n  <ul>\n    <li>\n      <strong>データ・ポータビリティの権利  <br /></strong>\n      お客様は、技術的に可能な場合、当社がお客様から取得した個人情報のコピーを、構造化され、一般的に使用され、機械で読み取り可能な形式で、お客様が選択した第三者に転送するよう求める権利を有する場合があります。\n    </li>\n  </ul>\n  <ul>\n    <li>\n      <strong>同意を撤回する権利  <br /></strong>\n      当社がお客様の個人情報を処理する法的根拠としてお客様の同意に依拠する場合、お客様はその同意を撤回する権利を有します。\n    </li>\n  </ul>\n  <ul>\n    <li>\n      <strong>苦情を申し立てる権利<br /></strong>\n      お客様は、当社のプライバシー慣行のいかなる側面についても懸念がある場合、お客様の法域の関連監督または規制当局に苦情を申し立てる権利を有する場合があります。\n    </li>\n  </ul>\n  <p>\n    上記の権利の行使を希望される場合、または決定もしくは拒否の見直しを要求される場合は、該当する連絡先情報を使用して当社までご連絡ください：\n  </p>\n  <ul>\n    <li>\n      英国、スイスおよび欧州経済地域にお住まいの方は、\n      <a\n        href=\"https://mmc-dev-privacy.my.onetrust.com/webform/4da460d1-7bcf-4ff1-ac37-c4b804769467/draft/ea953d72-fded-42ee-b1dd-c0a5a83b7891\"\n        > このフォームにご記入 ください。</a\n      >\n    </li>\n    <li>\n      その他の国の方は、\n      <a\n        href=\"https://privacyportal.onetrust.com/webform/ee9df2bb-0ef3-4485-bc63-4db420e77359/225910f5-5666-468a-b1e7-39c70e24f4cc\"\n        > このフォームにご記入ください。</a\n      >\n    </li>\n    <li>\n      -\tまたは、 <a href=\"mailto:privacy@mmc.com\">privacy@mmc.com</a> までメールでお問い合わせください。\n    </li>\n  </ul>\n  <p>\n    お住まいの国によっては、以下の権利の一部またはすべてを有する場合もあります：\n  </p>\n  <ul>\n    <li>\n      <strong>\n        クロス・コンテキスト広告のための販売または共有をオプトインまたはオプトアウトする権利   <br />\n      </strong>\n      お客様が当社のウェブサイトのいずれかを訪問された場合、当社は、お客様のインターネットまたはその他の電子ネットワーク活動情報、経歴識別子、地理的位置データ、および職業上の情報（当社のウェブサイト上でのお客様の活動から得られる範囲）を、広告クッキーを利用したクロスコンテクスト行動またはターゲット広告の目的で、ウェブサイト分析および広告プロバイダーに開示することがあります。  法律によっては、このような種類の開示をオプトインまたはオプトアウトする権利があります。  クッキーを選択したり、当社がお客様の情報を販売または共有した特定の第三者の名前を表示するには、当社ウェブページの下部にある「クッキーの管理」リンクをクリックしてください。 お客様の情報の販売または共有を拒否したい場合は、、「広告」および「アナリティクス」トラッカーのトグルが「いいえ」に設定されているか、または利用可能な場合は、「個人情報を販売または共有しない」トグルを有効にしてください。\n      <p>\n        また、ブラウザの設定や拡張機能を使用して、お客様の販売および共有に関する設定を、お客様が訪問するウェブサイトに自動的に伝えることもできます。  当社のウェブサイトは、グローバル・プライバシー・コントロール（GPC）を認識することにより、このような「オプトアウト・プリファレンス・シグナル」を摩擦のない方法で処理します。 GPCを使用したい場合は、参加ブラウザまたはブラウザ拡張機能を使ってダウンロードし、有効にすることができます。 GPCのダウンロードに関する詳細は、 <a href=\"https://globalprivacycontrol.org/\">こちらを参照されたい。</a>.\n      </p>\n    </li>\n  </ul>\n  <ul>\n    <li>\n      <strong>\n        自動意思決定およびプロファイリングに関する権利\n      <br /></strong>\n      当社がお客様の個人情報の自動処理に関与する範囲において、当社は、お客様の権利に関する通知を含め、法律で義務付けられている通知を事前にお客様に提供します。\n    </li>\n  </ul>\n  <ul>\n    <li>\n      <strong>ダイレクト・ マーケティングとDo Not Trackシグナル  <br /></strong>\n      お客様は、法律で認められている場合、当社がダイレクトマーケティングを目的として他の企業に開示した個人情報について、年に1回、通知を求め、入手する権利を有する場合があります。  該当する場合、このような通知には、開示された個人情報のカテゴリーのリスト（該当する場合）、および個人情報が開示されたすべての第三者の名前と住所（該当する場合）が含まれます。  この通知は、前暦年を対象とする。  この権利がお客様に適用されるかどうかを確認し、適用される場合はその権利を行使することを希望される場合は、以下のとおり当社にご連絡ください。\n    </li>\n  </ul>\n  <p>\n    これらの権利の一部は、当社が  個人情報の処理を継続する正当な 利益または法律上、規制上もしくは契約上の義務がある場合  、または個人情報が適用法に基づいて開示もしくは消去の対象から除外される可能性がある場合に制限される場合があることにご注意ください。   これらの権利の中には、特定の状況においてのみ行使できるものや、お客様の法域におけるデータ保護法によって制限されるものがあります。\n  </p>\n  <h2>クロスボーダー・トランスファー  </h2>\n  <p>\n    80カ国以上で事業を展開するグローバル企業として、本プライバシー通知に概説されている目的のために、個人情報を収集した国、州、または地域から移転しなければならない状況があります。 具体的には、当社は、お客様に提供するサービスを提供、管理、運営し、当社の事業運営の効率を高めるために、データを転送することがあります。 当社は、これらの移転が関連するすべてのデータ保護法を遵守し、かかる法律に基づく個人の権利および自由が適切に保護されるよう、あらゆる努力を払います。\n  </p>\n  <p>\n    このような移転の必要性が生じた場合、当社は、影響評価、適切な監督当局による妥当性判断、承認された拘束力のある社内規則または標準契約条項の使用、またはお客様の同意など、個人情報を保護するための適切な保護措置が講じられていることを確認するための措置を講じます。\n  </p>\n  <p>\n    三菱自動車のEU（欧州連合）拘束力のある会社規則（EU BCRs）の運用については、以下をクリックしてください。\n    <a\n      href=\"https://www.marshmclennan.com/content/dam/mmc-web/Archive/Images/Files/02March2022-EUBCR-Controller-and-Processor-Principles.pdf\"\n      > をクリックしてください。</a\n    >&nbsp;  EUのBCRに拘束されることに同意した事業体のリストについては、以下をクリックしてください。\n    <a href=\"https://www.marshmclennan.com/privacy-statement/bcr-entities.html\"\n      > こちら.</a\n    >\n  </p>\n  <p>\n    三菱自動車の英国拘束力ある会社規則（UK BCRs）の運用については、以下をクリックしてください。\n    <a\n      href=\"https://www.marshmclennan.com/content/dam/mmc-web/Archive/Images/Files/02March2022-UKBCR-Controller-and-Processor-Principles.pdf\"\n      >をクリックしてください。</a\n    >&nbsp;  英国BCRに拘束されることに同意した事業体のリストは、以下をクリックしてください。\n    <a\n      href=\"https://www.marshmclennan.com/privacy-statement/bcr-entities-uk.html\"\n      >こちら.</a\n    >\n  </p>\n  <h2>お客様の情報の保持  </h2>\n  <p>\n    当社の製品、サービス、および規制上の義務は複雑であるため、個人情報の保存期間はさまざまです。  当社は、個人情報および当社が保持する記録の保存期間を設定する際、以下の義務を考慮します：\n  </p>\n  <ul>\n    <li>\n      情報を収集した事業目的または契約上の義務を達成するために情報を保持する必要がある場合；\n\n    </li>\n    <li>\n      当社がお客様のために処理する個人情報に関して、お客様の指示を実行する当社の義務；\n    </li>\n    <li>\n      法的および規制上の義務的な記録保持要件を遵守するための義務；\n    </li>\n    <li>\n      バックアップおよび災害復旧手順\n    </li>\n    <li>\n      適用される時効期間など、その他の法的影響。\n    </li>\n  </ul>\n  <p>\n    上記の要因に基づき、当社は、お客様にサービスを提供する期間を超えて個人情報を保持する場合があります。 当社が個人情報を保持する必要がなくなった場合、当社の方針により、情報の非識別化または集計を行うか（この場合、非識別化または集計された情報をさらに保持し、分析目的で使用することがあります）、または安全に破棄する必要があります。\n  </p>\n  <h2>質問または懸念事項  </h2>\n  <p>\n    本プライバシー通知または MTEの プライバシー慣行に関する ご質問やご要望は、 <a href=\"mailto:privacy@mmc.com\">privacy@mmc.com</a>まで電子メールでお送りください。    郵送またはお電話でのご連絡をご希望の場合は、 最寄りのデータ保護担当者までご連絡ください。 お近くのデータ保護責任者の連絡先は、 <a href=\"mailto:privacy@mmc.com\">privacy@mmc.com</a>までお問い合わせください 。\n  </p>\n</div>"
