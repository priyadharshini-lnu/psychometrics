---
ja:
  cookies_notice: |-
    <h2>
      クッキーについて
    </h2>

    <p>発効日： 2023 年 12 月 14 日</p>
    <p>当社は本ウェブサイトでクッキーに加えウェブビーコン、トラッキングピクセル、ログファイルなどの関連するトラッキング技術（「クッキー」と総称）を使用して、お客様を他のユーザーと区別し、本ウェブサイトの機能と当社のサービスを評価・改善し、お客様に卓越したエクスペリエンスを提供します。</p>

    <p><strong>クッキーとは</strong></p>
    <p>クッキーとは、お客様のウェブブラウザとウェブサイトが共有する情報を指します。クッキーの中にはウェブサイトが機能するために必要なものもあれば、ウェブサイトのパフォーマンスを評価・改善するために役立つものもあります。お客様に合ったコンテンツ、製品およびサービスを提供するためにもクッキーを使用します。クッキーはお客様のコンピューターのハードドライブからデータを読み取ることはできません。</p>

    <p><strong>さまざまな機能を有する各種クッキーがあります。</strong></p>
    <p>(i) <strong>セッションクッキー：</strong>ウェブセッション中にのみコンピューターに保存されます。このクッキーはブラウザを閉じると自動的に削除されます。通常、このクッキーによって匿名のセッションIDが保存されるため、ページごとにログインすることなくウェブサイトを参照できます。コンピューターから情報を収集することはありません。</p>
    <p>(ii) <strong>パーシステントクッキー：</strong>コンピューターにファイルとして保存され、ウェブブラウザを閉じてもコンピューターに残ります。このクッキーを作成したウェブサイトに再びアクセスすると、ウェブサイトによってクッキーが読み取られます。</p>
    <p>(iii) <strong>ファーストパーティークッキー：</strong>当社が作成したクッキーを指します。当社のサーバーとお客様のコンピューターのハードドライブに保存され、送受信されます。使用されるクッキーは、セッションクッキーとパーシステントクッキーのいずれかです。</p>
    <p>(iv) <strong>サードパーティークッキー：</strong>当社のサードパーティーのパートナーが作成したクッキーを指します。サードパーティーのサーバーとお客様のコンピューターのハードドライブに保存され、送受信されます。通常、パーシステントクッキーが使用されます。</p>

    <p><strong>当社によるクッキーの使用方法と使用目的</strong></p>
    <p>ウェブサイトごとに当社は以下の目的でクッキーを使用する場合があります。</p>

    <p><strong>不可欠なクッキー</strong></p>
    <p>このクッキーは、お客様が本ウェブサイトのさまざまなページにアクセスしその機能を使用するために必須のクッキーです。このクッキーがなければ、お客様が要求したサービスを提供できません。このクッキーはお客様に関する情報を収集しません。</p>

    <p><strong>機能性クッキー</strong></p>
    <p>このクッキーを使用すると、当社のウェブサイトはお客様が設定した項目（ユーザー名、言語、所在地域など）を記憶し、機能を拡張します。また、サービス提供のためにも使用されます。このクッキーが収集する情報には、通常個人を特定する情報は含まれません。</p>

    <p><strong>アナリティクスクッキー</strong></p>
    <p>このクッキーは、ユーザーのウェブサイトの使用に関する情報を収集し、ウェブサイトの機能改善に役立てます。</p>

    <p><strong>広告クッキー</strong></p>
    <p>このクッキーを使用して、お客様に合った広告を表示し、広告のパフォーマンスを管理します。広告クッキーは通常サードパーティークッキーです。</p>

    <p><strong>IPアドレス</strong></p>
    <p>お客様が当社のウェブサイトにアクセスすると、IPアドレスを収集して個人情報以外の情報を管理・集計する場合があります。</p>

    <p><strong>クッキーの管理方法</strong></p>
    <p>本ページ下の「Manage Cookies（クッキー管理）」リンクをクリックし、Cookie Consent Managerで承認または拒否してください。ブラウザ設定でも特定のクッキーを無効にできます。</p>

    <p><strong>サードパーティーウェブサイトに対する非適用</strong></p>
    <p>外部ウェブサイトリンク先には独自のプライバシーポリシーとクッキーポリシーがあります。当社は外部ウェブサイトの管理に責任を負いません。</p>

    <p><strong>「クッキーについて」の内容の変更</strong></p>
    <p>本ポリシーは随時変更されることがあります。最新情報の確認を推奨します。発効日はページ上部に記載されています。</p>

    <p><strong>使用するクッキーの説明</strong></p>
    <p>フッターの「Manage Cookies（クッキー管理）」リンクで各クッキーの詳細を確認できます。ただし、「不可欠なクッキー」のみが使用される環境では表示されない場合があります。</p>

    <p><strong>お問い合わせ</strong></p>
    <p>「クッキーについて」に関する質問は「Privacy Notice（プライバシー通知）」のリンク先にご連絡ください。</p>
