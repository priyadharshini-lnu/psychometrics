        content:
          list:
            r1: Această listă este doar orientativă, iar alte căi de dezvoltare pot fi luate în considerare în funcție de aspirațiile individuale, recomandările managerului sau prioritățile de afaceri ale organizației.
            r2: Lansarea unora dintre aceste căi de dezvoltare va depinde de strategia organizațională de educație și învățare.
            r3: Ia în considerare căile recomandate de mai jos când îți dezvolți Planul Individual de Dezvoltare.
          main: Această secțiune include o listă cumulativă a tuturor căilor de dezvoltare, având în vedere bunele practici de învățare, adică ghidul 70-20-10, care oferă o călătorie progresivă ce combină învățarea în clasă, coaching-ul și învățarea la locul de muncă. Pe baza rezultatelor experienței de dezvoltare a leadershipului și a priorităților de afaceri, au fost recomandate posibile căi de dezvoltare care pot fi luate în considerare pentru dezvoltarea ta.
        learn_cards:
          collaboration:
            list:
            - Oferă-te să fii mentor sau coach pentru alții
            - Solicită să fii mentorat de un expert din domeniul tău
            - Găsește un coach care să te sprijine în dezvoltare
            - Creează un grup de lucru colaborativ pentru a discuta provocările curente din afacere
            - Primește feedback formal și informal de la alții
            - Joacă un rol activ în asociații și rețele de industrie
            - Construiește-ți propriile rețele externe
            title: Învățare colaborativă (20%) <br/> Dezvoltare prin alții
          job:
            list:
            - Preia poziții de conducere în comitete de management sau stakeholderi
            - Fii voluntar pentru a conduce proiecte de management al schimbării în organizație
            - Ia în considerare asumarea unor sarcini provocatoare
            - Lucrează în colaborare cu alte funcții
            - Condu proiecte în afara organizației tale
            - Lucrează îndeaproape cu experți externi din industrie la proiecte comune
            title: Învățare la locul de muncă (70%) <br/> Dezvoltare prin experiență
          learn:
