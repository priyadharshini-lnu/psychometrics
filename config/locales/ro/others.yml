            content: Acest lucru se bazează pe competența care urmează să fie dezvoltată pe baza experienței de evaluare.
            title: Competență
          c3:
            content: Această secțiune include acțiunile de dezvoltare bazate pe modelul de învățare 70-20-10 enumerat mai jos. Este recomandat să selectați o combinație a fiecăruia dintre cele trei elemente pentru a asigura o abordare variată de învățare și dezvoltare.
            title: Activitate
          c4:
            content: Asigurați-vă că termenele sunt realiste în funcție de momentul în care obiectivul poate fi finalizat. Modificați acest lucru după caz.
            title: Cronologie
          c5:
            content: Utilizați secțiunea de progres pentru a sprijini progresul pe pistele identificate.
            title: Progres
        chart:
          collaboration: "<strong>20%</strong>Colaborativ <br /> Învățare"
          job: "<strong>70%</strong>Învățare <br />la locul de muncă"
          learn: "<strong>10%</strong>Învățare formală"
        content:
          list:
            r1: Vă rugăm să rețineți că această listă este doar orientativă și că pot fi luate în considerare și alte căi de dezvoltare pentru dvs., în funcție de aspirațiile individuale, recomandările managerului dvs. și prioritățile organizaționale ale companiei.
            r2: Utilizatorii sunt încurajați să analizeze critic întregul conținut și sunt liberi să modifice, să perfecționeze, să înlocuiască sau să adauge orice acțiuni sau recomandări cu care nu sunt de acord.
            r3: 'Datele privind dezvoltarea incluse în acest raport pot proveni din una sau ambele surse următoare:'
            r3a: O bibliotecă de dezvoltare personalizată creată pentru organizația dumneavoastră
            r3b: Sugestii de dezvoltare generate de IA
            r4: Acest raport IDP a fost generat cu ajutorul tehnologiei de inteligență artificială și poate conține inexactități. Informațiile și recomandările furnizate trebuie interpretate cu prudență și utilizate exclusiv ca instrument pentru dezvoltarea dumneavoastră personală și profesională. Raportul este valabil pentru o perioadă de 12-18 luni.
          main: IDP-ul creat include o listă detaliată de acțiuni de dezvoltare pe care le puteți întreprinde, ținând cont de cele mai bune practici de învățare, adică ghidul 70-20-10, care oferă un parcurs progresiv combinând învățarea în sala de clasă, coachingul și învățarea la locul de muncă. Pe baza rezultatelor procesului de evaluare, a răspunsurilor dvs. din chat și a rapoartelor externe, după caz, au fost recomandate posibile căi de dezvoltare, care pot fi luate în considerare pentru dezvoltarea dvs.
        learn_cards:
          collaboration:
            list:
            - Oferă-te să fii mentor sau coach pentru alții
            - Solicită să fii mentorat de un expert din domeniul tău
            - Găsește un coach care să te sprijine în dezvoltare
            - Creează un grup de lucru colaborativ pentru a discuta provocările curente din afacere
            - Primește feedback formal și informal de la alții
            - Joacă un rol activ în asociații și rețele de industrie
            - Construiește-ți propriile rețele externe
            title: Învățare colaborativă (20%) <br/> Dezvoltarea prin alții
          job:
            list:
            - Preia poziții de conducere în comitete de management sau stakeholderi
            - Fii voluntar pentru a conduce proiecte de management al schimbării în organizație
            - Ia în considerare asumarea unor sarcini provocatoare
            - Lucrează în colaborare cu alte funcții
            - Condu proiecte în afara organizației tale
            - Lucrează îndeaproape cu experți externi din industrie la proiecte comune
            title: Învățarea la locul de muncă (70%) <br/> Dezvoltarea prin experiență
          learn:
            list:
            - Participați la programe de formare structurate
            - Cursuri complete de e-learning online
            - Citiți cărți, articole, publicații
            - Obțineți calificări profesionale, certificări și acreditări
            - Participă la cursuri, ateliere, seminarii
            title: Învățare formală (10%) <br/> Dezvoltarea prin învățare structurată
        title: Ghid pentru permisul de conducere internațional (IDP)
