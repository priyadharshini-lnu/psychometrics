        <h2>PĂSTRAREA INFORMAȚIILOR DUMNEAVOASTRĂ </h2>
        <p>
          Produsele, serviciile și obligațiile noastre de reglementare sunt complexe și, prin urmare, perioadele noastre de păstrare a Informațiilor Personale variază. Luăm în considerare următoarele obligații atunci când stabilim perioade de păstrare a Informațiilor Personale și a înregistrărilor pe care le păstrăm:
        </p>
        <ul>
          <li>
            necesitatea de a păstra informațiile pentru îndeplinirea scopurilor comerciale sau a obligațiilor contractuale pentru care au fost colectate;
          </li>
          <li>
            obligațiile noastre de a pune în aplicare instrucțiunile clienților noștri cu privire la Informațiile Personale pe care le prelucrăm în numele lor;
          </li>
          <li>
            obligațiile noastre de a respecta cerințele legale și de reglementare obligatorii privind păstrarea evidențelor;
          </li>
          <li>
            procedurile noastre de backup și recuperare în caz de dezastru; și
          </li>
          <li>
            alte impacturi juridice, cum ar fi termenele de prescripție aplicabile.
          </li>
        </ul>
        <p>
          Pe baza factorilor de mai sus, este posibil să păstrăm Informațiile Personale dincolo de perioada pentru care vă furnizăm servicii. Atunci când nu mai este nevoie să păstrăm Informațiile Personale, politicile companiei noastre impun fie să anonimizăm, fie să agregăm informațiile (caz în care putem păstra și utiliza în continuare informațiile anonimizate sau agregate în scopuri analitice), fie să le distrugem în siguranță.
        </p>
