        <h2>MĂSURILE PE CARE LE LUĂM PENTRU A PROTEJA INFORMAȚIILE PERSONALE </h2>
        <p>
          Compania noastră se străduiește să respecte toate legile aplicabile privind securitatea cibernetică și protecția datelor. Având în vedere aceste obiective, MMC are un responsabil dedicat cu securitatea informațiilor (CISO). și un Responsabil Global cu Protecția Datelor (GCPO). Responsabilul cu Protecția Datelor este responsabil pentru gestionarea unei echipe globale de securitate a informațiilor și a unui program cuprinzător de securitate cibernetică. Ca parte a programului nostru de securitate cibernetică, am implementat măsuri de siguranță fizice, administrative și tehnice rezonabile din punct de vedere comercial pentru a proteja informațiile personale împotriva accesului, utilizării, modificării și ștergerii neautorizate.
        </p>
        <p>
          GCPO conduce și supraveghează un Centru de Excelență pentru Confidențialitate și o Rețea de Responsabili cu Protecția Datelor, responsabilă de implementarea programului nostru global cuprinzător de confidențialitate. Rețeaua de Responsabili cu Protecția Datelor conectează responsabilii noștri cu protecția datelor din întreaga lume și urmărește să implementeze programul nostru de confidențialitate în mod consecvent și temeinic oriunde prelucrăm date. Puteți obține numele și informațiile de contact ale responsabilului cu protecția datelor din jurisdicția dumneavoastră contactându-ne la <a href="mailto:privacy@mmc.com">privacy@mmc.com</a>.
        </p>
        <h2>DREPTURILE DUMNEAVOASTRĂ DE PROTECȚIA DATELOR </h2>
        <p>
          În multe cazuri, prelucrăm Informații Personale pentru a furniza serviciile noastre clienților corporativi și trebuie să îi contactați pentru a vă exercita orice drepturi pe care le aveți în temeiul legilor aplicabile privind confidențialitatea. Cu toate acestea, în cazul în care acționăm în calitate de operator sau companie responsabilă în principal pentru decizia privind modul în care sunt prelucrate informațiile dumneavoastră, este posibil să aveți unele sau toate drepturile enumerate mai jos, în funcție de jurisdicție și de motivul pentru care prelucrăm informațiile dumneavoastră. Vă rugăm să rețineți că este posibil să fie nevoie să folosim Informațiile dumneavoastră personale pentru a vă verifica identitatea înainte de a vă exercita oricare dintre drepturile de mai jos.
        </p>
        <ul>
          <li>
            <strong>Dreptul de acces (Dreptul de a ști) <br /></strong>
            Ne puteți solicita să vă oferim detalii suplimentare despre modul în care utilizăm Informațiile dumneavoastră Personale, sursele, categoriile sau anumite Informații Personale pe care le-am colectat, categoriile de terți cărora le-am divulgat informațiile și să solicitați o copie a Informațiilor Personale pe care le deținem despre dumneavoastră.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Dreptul de a corecta  <br /></strong>
            Ne puteți solicita să actualizăm orice inexactități din Informațiile Personale pe care le deținem. Dacă dezvăluim Informațiile dumneavoastră Personale altor persoane, le vom informa despre corecție, acolo unde este posibil.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Dreptul de ștergere  <br /></strong>
            Ne puteți solicita să ștergem Informațiile dumneavoastră cu caracter personal în cazul în care nu mai avem motive legale pentru a le prelucra.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Dreptul de a obiecta la prelucrare sau de a restricționa prelucrarea  <br /></strong>
            Este posibil să aveți dreptul de a restricționa prelucrarea Informațiilor dumneavoastră cu caracter personal în anumite circumstanțe, cum ar fi în cazul în care contestați exactitatea acestora.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Dreptul la portabilitatea datelor <br /></strong>
            Aveți dreptul, acolo unde este fezabil din punct de vedere tehnic, să ne solicitați să transferăm unei terțe părți la alegerea dumneavoastră o copie a Informațiilor Personale pe care le-am obținut de la dumneavoastră, într-un format structurat, utilizat în mod obișnuit și care poate fi citit automat.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Dreptul de a retrage consimțământul <br /></strong>
            Dacă ne bazăm pe consimțământul dumneavoastră ca temei juridic pentru prelucrarea Informațiilor dumneavoastră cu caracter personal, aveți dreptul de a retrage acest consimțământ.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Dreptul de a depune o plângere<br /></strong>
            Aveți dreptul să depuneți o plângere la autoritatea de supraveghere sau de reglementare relevantă din jurisdicția dumneavoastră dacă aveți o îngrijorare cu privire la orice aspect al practicilor noastre de confidențialitate.
          </li>
        </ul>
        <p>
          Dacă doriți să exercitați oricare dintre drepturile de mai sus sau să solicitați revizuirea unei decizii sau a unui refuz, vă rugăm să ne contactați folosind informațiile de contact aplicabile:
        </p>
        <ul>
          <li>
            Dacă vă aflați în Regatul Unit, Elveția sau Spațiul Economic European, vă rugăm să
            <a
              href="https://mmc-dev-privacy.my.onetrust.com/webform/4da460d1-7bcf-4ff1-ac37-c4b804769467/draft/ea953d72-fded-42ee-b1dd-c0a5a83b7891"
              >completați acest formular.</a
            >
          </li>
          <li>
            Pentru persoanele din alte țări, vă rugăm să
            <a
              href="https://privacyportal.onetrust.com/webform/ee9df2bb-0ef3-4485-bc63-4db420e77359/225910f5-5666-468a-b1e7-39c70e24f4cc"
              >completați acest formular.</a
            >
          </li>
          <li>
            Alternativ, ne puteți trimite un e-mail la adresa <a href="mailto:privacy@mmc.com">privacy@mmc.com</a>
          </li>
        </ul>
        <p>
          În funcție de țara dumneavoastră, este posibil să aveți și unele sau toate drepturile următoare:
        </p>
        <ul>
          <li>
            <strong>
              Dreptul de a opta pentru vânzarea sau partajarea publicității în context multiplu <br />
            </strong>
            Dacă vizitați unul dintre site-urile noastre web, este posibil să divulgăm informații despre activitatea dvs. pe internet sau în alte rețele electronice, identificatori biografici, date de geolocalizare și informații profesionale (în măsura în care acestea pot fi derivate din activitatea dvs. pe site-ul nostru web) furnizorilor de analiză și publicitate pentru site-uri web în scopuri de publicitate comportamentală sau direcționată în mai multe contexte, utilizând cookie-uri publicitare. Conform anumitor legi, este posibil să aveți dreptul de a renunța la aceste tipuri de divulgări. Pentru a face selecția (selecțiile) sau pentru a vizualiza numele anumitor terțe părți cu care am vândut sau partajat informațiile dvs., vă rugăm să faceți clic pe linkul „Gestionați cookie-urile” din partea de jos a paginii noastre web. Dacă doriți să renunțați la vânzarea sau partajarea informațiilor dvs., asigurați-vă că comutatoarele pentru trackerele „Publicitate” și „Analiză” sunt setate la „Nu” sau, acolo unde este disponibil, activați comutatorul „Nu vindeți sau partajați informațiile mele personale”.
            <p>
              De asemenea, puteți implementa o setare sau o extensie de browser pentru a comunica automat preferințele dvs. de vânzare și partajare site-urilor web pe care le vizitați. Site-urile noastre web procesează astfel de „semnale de preferințe de dezabonare” într-un mod fluid, prin recunoașterea Controlului Global de Confidențialitate (GPC). Dacă doriți să utilizați GPC, îl puteți descărca și activa prin intermediul unui browser sau al unei extensii de browser participante. Sunt disponibile mai multe informații despre descărcarea GPC <a href="https://globalprivacycontrol.org/">Aici</a>.&nbsp;
            </p>
          </li>
        </ul>
        <ul>
          <li>
            <strong>
              Drepturi în legătură cu luarea deciziilor automatizate și crearea de profiluri
            <br /></strong>
            În măsura în care prelucrăm automat Informațiile dumneavoastră cu caracter personal, vă vom furniza în prealabil orice notificări, inclusiv cu privire la drepturile dumneavoastră, care sunt impuse de lege.
          </li>
        </ul>
        <ul>
          <li>
            <strong>direct și de evitare a urmăririi <br /></strong>
            Aveți dreptul să solicitați și să obțineți o notificare o dată pe an cu privire la Informațiile Personale pe care le-am divulgat altor companii în scopuri de marketing direct, acolo unde este permis de lege. Dacă este cazul, o astfel de notificare va include o listă a categoriilor de Informații Personale care au fost divulgate (dacă există) și numele și adresele tuturor terților cărora le-au fost divulgate Informațiile Personale (dacă există). Notificarea va acoperi anul calendaristic precedent. Ne puteți contacta conform celor prevăzute mai jos dacă doriți să aflați dacă acest drept vi se aplică și, dacă da, să îl exercitați.
          </li>
        </ul>
        <p>
          Vă rugăm să rețineți că unele dintre aceste drepturi pot fi limitate în cazul în care avem un interes legitim preponderent sau o obligație legală, de reglementare sau contractuală de a continua să prelucrăm Informațiile Personale sau în cazul în care Informațiile Personale pot fi exceptate de la divulgare sau ștergere în temeiul legislației aplicabile. Unele dintre aceste drepturi pot fi exercitate numai în anumite circumstanțe sau pot fi limitate de legislația privind protecția datelor din jurisdicția dumneavoastră.
        </p>
        <h2>TRANSFERURI TRANSFRONTALIERE </h2>
        <p>
          În calitate de companie globală care operează în peste 80 de țări, există circumstanțe în care va trebui să transferăm Informații personale în afara țării, provinciei sau teritoriului în care acestea au fost colectate în scopurile descrise în această Notificare privind confidențialitatea. Mai exact, este posibil să transferăm date pentru a oferi, administra și gestiona Serviciile furnizate către dvs. și pentru a spori eficiența operațiunilor noastre comerciale. Vom depune toate eforturile pentru a ne asigura că aceste transferuri respectă toate legislațiile relevante privind protecția datelor și că drepturile și libertățile persoanelor în temeiul acestor legi sunt protejate în mod corespunzător.
        </p>
        <p>
          În cazul în care apare necesitatea unui astfel de transfer, vom lua măsuri pentru a ne asigura că există garanții adecvate pentru a proteja Informațiile cu caracter personal, cum ar fi o evaluare a impactului, o decizie privind caracterul adecvat luată de autoritatea de supraveghere competentă, utilizarea unor reguli corporative obligatorii aprobate sau a unor clauze contractuale standard sau consimțământul dumneavoastră.
