    <h2>Notificare privind modulele cookie</h2>

    <p>Data intrării în vigoare: 14 decembrie 2023</p>

    <p>Utilizăm module cookie și alte tehnologii de urmărire, inclusiv balize web, pixeli de urmărire și fișiere jurnal (denumite colectiv „modulele cookie”) pe acest site web pentru a vă diferenția de alți utilizatori, pentru a evalua și îmbunătăți funcționalitatea site-ului web și serviciilor noastre, precum și pentru a vă oferi o experiență bună.&nbsp;&nbsp;</p>

    <p><strong>CE ESTE UN MODUL COOKIE</strong></p>

    <p>Modulele cookie sunt informații transmise între browserul dvs. web și un site web. Unele module cookie sunt necesare pentru ca site-ul web să funcționeze.&nbsp; Altele ne ajută să-i evaluăm și să-i îmbunătățim performanța.&nbsp; De asemenea, folosim module cookie pentru a vă oferi conținut, produse și servicii relevante.&nbsp; Un modul cookie nu poate citi datele de pe hard diskul computerului dvs.&nbsp;</p>

    <p><strong>Există diferite tipuri de module cookie, cu diferite funcții:</strong></p>

    <p><strong>(i) Module cookie de sesiune: </strong>aceste module cookie sunt stocate pe computerul dvs. numai pe durata sesiunii web. Sunt șterse automat când browserul este închis. De obicei, acestea stochează un ID de sesiune anonim care vă permite să navigați pe un site web fără a fi nevoie să vă autentificați la fiecare pagină. Aceste module nu colectează nicio informație de pe computerul dumneavoastră.&nbsp;</p>

    <p><strong>(ii) Module cookie persistente: </strong>aceste module cookie sunt stocate pe computerul dvs. sub formă de fișier și rămân acolo și după ce închideți browserul web. Acestea pot fi citite de site-ul web care le-a creat atunci când vizitați din nou acel site.&nbsp;</p>

    <p><strong>(iii) Module cookie principale: </strong>aceste module cookie sunt create de compania noastră. Acestea sunt stocate și transferate între serverele noastre și hard diskul computerului dvs.&nbsp; Aceste module cookie pot fi module cookie de sesiune sau persistente.&nbsp;</p>

    <p><strong>(iv) Module cookie terțe: </strong>acest module cookie terțe sunt create de unul dintre partenerii noștri terți. Aceste module sunt stocate și transferate între serverul entității terțe și hard diskul computerului dvs. Aceste module cookie sunt de obicei module cookie persistente.&nbsp;</p>

    <p><strong>CUM ȘI DE CE FOLOSIM MODULE COOKIE</strong></p>

    <p>În funcție de site-ul web, putem folosi module cookie în următoarele scopuri:&nbsp;</p>

    <p><strong>Acolo unde este strict necesar</strong></p>

    <p>Aceste module cookie sunt esențiale pentru a vă permite să vă deplasați pe site-ul web și să utilizați caracteristicile acestuia, cum ar fi accesarea zonelor securizate ale site-ului web. Fără aceste module cookie, serviciile pe care le-ați solicitat, cum ar fi obținerea unei cotații sau conectarea la contul dvs., nu pot fi furnizate. Aceste module cookie nu colectează informații care ar putea fi utilizate pentru marketing sau pentru a putea reține site-urile pe care le-ați vizitat.&nbsp;</p>

    <p><strong>Funcționalitate</strong></p>

    <p>Aceste module cookie permit site-ului nostru web să rețină alegerile pe care le faceți (cum ar fi numele dvs. de utilizator, limba sau regiunea în care vă aflați) și să vă ofere funcționalități îmbunătățite. De exemplu, un site web poate să-și amintească detaliile de conectare, astfel încât să nu mai fie necesar să vă autentificați în mod repetat la contul dvs. atunci când utilizați un anumit dispozitiv pentru a accesa site-ul nostru web. Aceste module cookie pot fi utilizate și pentru a reține modificările pe care le-ați făcut în privința dimensiunii textului, fontului și altor aspecte personalizabile ale paginilor web. Acestea pot fi, de asemenea, utilizate pentru a furniza servicii pe care le-ați solicitat, cum ar fi vizionarea unui videoclip sau comentarea unui articol. Informațiile pe care aceste module cookie le colectează sunt, de obicei, anonimizate. Ele nu colectează nicio informație despre dvs. care ar putea fi utilizată pentru publicitate sau pentru reținerea site-urilor pe care le-ați vizitat.&nbsp;</p>

    <p><strong>Analize</strong></p>

    <p>Aceste module cookie colectează informații despre modul în care vizitatorii folosesc un site web, de ex. ce pagini accesează vizitatorii cel mai des și dacă primesc mesaje de eroare de pe paginile web. De asemenea, aceste module cookie ne ajută să înregistrăm și să contorizăm numărul de vizitatori ai site-ului web, ceea ce ne permite să vedem modul în care vizitatorii folosesc site-ul web și să îmbunătățim modul în care funcționează site-ul nostru web.</p>

    <p><strong>Publicitate&nbsp;&nbsp;</strong></p>

    <p>Aceste module cookie sunt utilizate în scopul afișării unor reclame relevante pentru dvs., precum și pentru gestionarea performanței reclamelor. Modulele cookie publicitare sunt, în general, module cookie terțe și pot fi prezente chiar dacă pe site-ul web nu există publicitate.&nbsp;&nbsp;</p>

    <p><strong>Adrese IP</strong></p>

    <p>Când vizitați site-ul nostru web, putem colecta adresele dvs. de Internet Protocol („IP”) pentru a urmări și agrega informații non-personale. De exemplu, putem utiliza adresele IP pentru a monitoriza regiunile din care utilizatorii navighează pe site-ul web.&nbsp;</p>

    <p><strong>CUM SE GESTIONEAZĂ MODULELE COOKIE</strong></p>

    <p>Faceți clic pe linkul „Gestionare module cookie” din partea de jos a paginii pentru a opta sau nu pentru anumite module cookie folosind Managerul nostru de permisiuni pentru module cookie.&nbsp; Rețineți faptul că nu puteți refuza Modulele cookie strict necesare; prin urmare, site-urile web care folosesc numai astfel de module cookie nu pot pune la dispoziție acest link.&nbsp;</p>

    <p>De asemenea, puteți dezactiva anumite module cookie din setările browserului. Vizitați secțiunea „Asistență” din browserul dvs. pentru a afla cum să gestionați setările privind modulele cookie.</p>

    <p><strong>NOTIFICAREA PRIVIND MODULELE COOKIE NU ACOPERĂ SITE-URILE WEB TERȚE&nbsp;</strong></p>

    <p>Când includem link-uri către alte site-uri web, vă rugăm să rețineți că acestea au propriile politici privind confidențialitatea și modulele cookie care vor reglementa utilizarea tuturor informațiilor pe care le trimiteți.&nbsp; Vă recomandăm să citiți politicile acestor site-uri, deoarece nu suntem responsabili pentru practicile de confidențialitate ale acestora.&nbsp;</p>

    <p><strong>MODIFICĂRI ALE NOTIFICĂRII PRIVIND MODULELE COOKIE&nbsp;</strong></p>

    <p>Putem actualiza ocazional această politică și vă încurajăm să o consultați din când în când pentru a fi informați cu privire la modul în care utilizăm modulele cookie.&nbsp; Data de intrare în vigoare a politicii este menționată în partea de sus a paginii.</p>

    <p><strong>DESCRIEREA MODULELOR COOKIE UTILIZATE</strong></p>

    <p>Faceți clic pe linkul „Gestionare module cookie” din subsolul site-ului web pentru a găsi informații legate de module cookie utilizate pe site-ul web.&nbsp; &nbsp;În unele cazuri, este posibil ca acest link să nu fie disponibil; de exemplu, în cazul în care folosim numai Module cookie strict necesare.&nbsp;&nbsp;</p>

    <p><strong>CONTACTAȚI-NE</strong></p>

    <p>Dacă aveți întrebări în legătură cu această Notificare privind modulele cookie, vă rugăm să ne contactați prin mijloacele indicate în Notificarea noastră privind confidențialitatea, accesibilă la link-ul de mai jos.</p>

