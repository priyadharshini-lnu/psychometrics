    <h2>ประกาศเกี่ยวกับคุกกี้</h2>

    <p>วันที่มีผลบังคับใช้: 14 ธันวาคม 2023</p>

    <p>เว็บไซต์นี้ใช้คุกกี้และเทคโนโลยีการติดตามที่เกี่ยวข้อง รวมถึงเว็บบีคอน พิกเซลติดตาม และไฟล์บันทึก (เรียกรวมกันว่า “คุกกี้”) เพื่อแยกความแตกต่างของคุณจากผู้ใช้รายอื่น ประเมินและปรับปรุงการทำงานของเว็บไซต์และบริการของเรา และมอบประสบการณ์ที่ดีแก่ผู้ใช้</p>

    <p><strong>คุกกี้คืออะไร</strong></p>

    <p>คุกกี้เป็นข้อมูลที่แลกเปลี่ยนระหว่างเบราว์เซอร์ของคุณกับเว็บไซต์ คุกกี้บางตัวจำเป็นต่อการทำงานของเว็บไซต์ คุกกี้บางตัวช่วยให้เราประเมินและปรับปรุงประสิทธิภาพของเว็บไซต์ และเรายังใช้คุกกี้เพื่อให้เนื้อหา ผลิตภัณฑ์ และบริการที่เกี่ยวข้อง คุกกี้ไม่สามารถอ่านข้อมูลจากฮาร์ดไดรฟ์ของคุณได้</p>

    <p><strong>มีประเภทของคุกกี้หลายชนิดที่ทำหน้าที่แตกต่างกัน:</strong></p>

    <p><strong>(i) คุกกี้เซสชัน:</strong> คุกกี้เหล่านี้จะถูกจัดเก็บบนคอมพิวเตอร์ของคุณเฉพาะช่วงระยะเวลาที่คุณใช้งานเว็บไซต์เท่านั้น จะถูกลบอัตโนมัติเมื่อปิดเบราว์เซอร์ โดยปกติจะเก็บ ID เซสชันแบบไม่ระบุชื่อเพื่อให้คุณสามารถเรียกดูเว็บไซต์ได้โดยไม่ต้องล็อกอินในแต่ละหน้า ไม่เก็บข้อมูลใด ๆ จากคอมพิวเตอร์ของคุณ</p>

    <p><strong>(ii) คุกกี้ถาวร:</strong> คุกกี้เหล่านี้จะถูกจัดเก็บเป็นไฟล์บนคอมพิวเตอร์ของคุณและยังคงอยู่เมื่อคุณปิดเบราว์เซอร์ เว็บไซต์สามารถอ่านคุกกี้เหล่านี้เมื่อคุณกลับมาเยี่ยมชมเว็บไซต์อีกครั้ง</p>

    <p><strong>(iii) คุกกี้จากเว็บไซต์ต้นทาง:</strong> คุกกี้เหล่านี้สร้างโดยบริษัทของเรา ถูกจัดเก็บและส่งระหว่างเซิร์ฟเวอร์ของเรากับฮาร์ดไดรฟ์ของคุณ คุกกี้เหล่านี้อาจเป็นคุกกี้เซสชันหรือคุกกี้ถาวร</p>

    <p><strong>(iv) คุกกี้จากบุคคลที่สาม:</strong> คุกกี้เหล่านี้สร้างโดยพันธมิตรบุคคลที่สามของเรา ถูกจัดเก็บและส่งระหว่างเซิร์ฟเวอร์ของบุคคลที่สามกับฮาร์ดไดรฟ์ของคุณ โดยทั่วไปจะเป็นคุกกี้ถาวร</p>

    <p><strong>วิธีและเหตุผลในการใช้คุกกี้</strong></p>

    <p>ขึ้นอยู่กับเว็บไซต์ คุกกี้อาจถูกใช้เพื่อวัตถุประสงค์ดังต่อไปนี้:</p>

    <p><strong>จำเป็นต่อการใช้งานเว็บไซต์</strong></p>

    <p>คุกกี้เหล่านี้จำเป็นเพื่อให้คุณสามารถเรียกดูและใช้ฟังก์ชันต่าง ๆ ของเว็บไซต์ เช่น การเข้าถึงพื้นที่ที่ปลอดภัยโดยไม่ใช้คุกกี้เหล่านี้จะไม่สามารถให้บริการที่คุณร้องขอ เช่น การขอใบเสนอราคา หรือการเข้าสู่ระบบบัญชี คุกกี้เหล่านี้จะไม่เก็บข้อมูลส่วนตัวของคุณเพื่อใช้ในเชิงการตลาดหรือจำตำแหน่งที่คุณเยี่ยมชมบนอินเทอร์เน็ต</p>

    <p><strong>ฟังก์ชันการทำงาน</strong></p>

    <p>คุกกี้เหล่านี้ช่วยให้เว็บไซต์จำการตั้งค่าของคุณ (เช่น ชื่อผู้ใช้ ภาษา หรือภูมิภาคที่คุณอยู่) และให้บริการฟังก์ชันขั้นสูง เช่น การจำข้อมูลการเข้าสู่ระบบเพื่อไม่ต้องล็อกอินซ้ำเมื่อใช้เครื่องเดิม คุกกี้ยังสามารถจำการปรับขนาดข้อความ ฟอนต์ และส่วนอื่น ๆ ของเว็บไซต์ที่ปรับแต่งได้ ใช้สำหรับให้บริการตามที่คุณร้องขอ เช่น การชมวิดีโอหรือแสดงความคิดเห็น ข้อมูลที่เก็บจะถูกทำให้ไม่ระบุตัวตน และจะไม่ใช้เพื่อการโฆษณาหรือติดตามพฤติกรรมออนไลน์ของคุณ</p>

    <p><strong>การวิเคราะห์</strong></p>

    <p>คุกกี้เหล่านี้เก็บข้อมูลเกี่ยวกับการใช้เว็บไซต์ เช่น หน้าที่ผู้ใช้เข้าชมบ่อยที่สุด และตรวจสอบข้อผิดพลาด ช่วยให้เรานับจำนวนผู้เข้าชมและปรับปรุงการทำงานของเว็บไซต์</p>

    <p><strong>โฆษณา</strong></p>

    <p>คุกกี้เหล่านี้ใช้เพื่อแสดงโฆษณาที่เกี่ยวข้องกับคุณและวัดประสิทธิภาพของโฆษณา คุกกี้โฆษณามักเป็นของบุคคลที่สาม และอาจปรากฏแม้ว่าเว็บไซต์ไม่มีโฆษณา</p>

    <p><strong>ที่อยู่ IP</strong></p>

    <p>เมื่อคุณเยี่ยมชมเว็บไซต์ เราอาจเก็บที่อยู่ IP ของคุณเพื่อรับข้อมูลไม่ระบุตัวตน เช่น เพื่อตรวจสอบพื้นที่ที่ผู้ใช้เข้าชมเว็บไซต์</p>

    <p><strong>วิธีจัดการคุกกี้</strong></p>

    <p>คลิกที่ลิงก์ “จัดการคุกกี้” ที่ด้านล่างของหน้าเพื่อลงชื่อเข้าใช้หรือออกจากระบบผ่านตัวจัดการความยินยอมสำหรับคุกกี้ หมายเหตุ: ไม่สามารถปิดคุกกี้ที่จำเป็นได้ เว็บไซต์ที่ใช้เฉพาะคุกกี้เหล่านี้อาจไม่มีลิงก์นี้</p>

    <p>บางคุกกี้สามารถปิดได้ผ่านการตั้งค่าเบราว์เซอร์ ดูคู่มือช่วยเหลือของเบราว์เซอร์ของคุณสำหรับข้อมูลเพิ่มเติม</p>

    <p><strong>ประกาศเกี่ยวกับคุกกี้นี้ไม่ครอบคลุมเว็บไซต์บุคคลที่สาม</strong></p>

    <p>เมื่อมีลิงก์ไปยังเว็บไซต์อื่น โปรดทราบว่าเว็บไซต์เหล่านั้นมีนโยบายความเป็นส่วนตัวและคุกกี้ของตนเอง แนะนำให้คุณอ่านนโยบายเหล่านั้น เราไม่รับผิดชอบต่อแนวทางของพวกเขา</p>

    <p><strong>การเปลี่ยนแปลงประกาศคุกกี้</strong></p>

    <p>นโยบายเหล่านี้อาจมีการปรับปรุงเป็นครั้งคราว แนะนำให้ตรวจสอบอย่างสม่ำเสมอ วันที่มีผลบังคับใช้ระบุไว้ด้านบน</p>

    <p><strong>รายละเอียดคุกกี้ที่ใช้</strong></p>

    <p>คลิกที่ลิงก์ “จัดการคุกกี้” ในส่วนท้ายของเว็บไซต์เพื่อดูรายละเอียดคุกกี้แต่ละตัว ลิงก์นี้อาจไม่ปรากฏเสมอไป หากเว็บไซต์ใช้เฉพาะคุกกี้ที่จำเป็น</p>

    <p><strong>ติดต่อเรา</strong></p>

    <p>หากคุณมีคำถามเกี่ยวกับประกาศคุกกี้นี้ โปรดติดต่อเราตามที่ระบุในประกาศความเป็นส่วนตัวของเรา</p>
