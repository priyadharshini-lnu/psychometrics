th:
  privacy_notice:
    current: "<div>\n  <h1><strong>ประกาศความเป็นส่วนตัวของ Mercer Talent Enterprise</strong>&nbsp;</h1>\n  <p>วันที่มีผลบังคับใช้: 15 September 2024</p>\n  <p>\n    ประกาศความเป็นส่วนตัวฉบับนี้มีวัตถุประสงค์เพื่ออธิบายว่า Mercer Talent Enterprise (“\n    <strong>MTE</strong>\n    ”) มีการ เก็บรักษา รวบรวม ใช้ แบ่งปัน โอน และดำเนินการประมวลผลข้อมูลที่เกี่ยวข้องกับบุคคลที่ระบุหรือสามารถระบุได้ (ข้อมูลส่วนบุคคล) อย่างไร รวมถึงสิทธิที่คุณอาจมีเกี่ยวกับข้อมูลส่วนบุคคลของคุณ ซึ่งเราเชื่อว่าเป็นสิ่งสำคัญที่คุณควรเข้าใจว่าเราดำเนินการข้อมูลส่วนบุคคลอย่างไร และขอให้คุณใช้เวลาสักครู่เพื่อทำความคุ้นเคยกับแนวทางปฏิบัติด้านความเป็นส่วนตัวของเราตามที่ระบุไว้ด้านล่างนี้\n  </p>\n  <p>\n    โปรดทราบว่า MTE เป็นผู้ให้บริการโซลูชันในการประเมินทางพฤติกรรม และในบางกรณี เราทำงานในนามและตามคำแนะนำของลูกค้า สถาบันการเงิน คู่ค้า และพันธมิตรอื่น ๆ ที่ทำหน้าที่เป็นผู้ควบคุมข้อมูล รวมถึงการประมวลผลธุรกรรมการชำระเงิน ทั้งนี้ขอให้คุณโปรดดูนโยบายความเป็นส่วนตัวของพันธมิตรเหล่านั้นเพื่อทราบข้อมูลเพิ่มเติมเกี่ยวกับการประมวลผลข้อมูลส่วนบุคคลของคุณในบริบทเหล่านั้น\n  </p>\n  <h2>ความสัมพันธ์ของเรากับคุณคืออะไร</h2>\n  <p>\n    คุณอาจถูกขอให้ทำการประเมินบนแพลตฟอร์มของ MTE โดยบุคคลที่สาม โดยบุคคลที่สามนี้คือผู้ใช้บริการของ MTE และอาจเป็นนายจ้างของคุณ  หรือบุคคลที่เกี่ยวข้องอื่น ๆ MTE รวบรวมและประมวลผลข้อมูลส่วนบุคคลของคุณในนามของลูกค้าของเรา เราปฏิบัติตามคำแนะนำที่ลูกค้าของเรามอบให้เกี่ยวกับข้อมูลส่วนบุคคลที่ต้องมีการรวบรวมและวิธีการประมวลผลข้อมูลส่วนบุคคลดังกล่าว ดังนั้น MTE จึงทำหน้าที่เป็นผู้ประมวลผลสำหรับลูกค้าของเรา ซึ่งกำหนดวิธีการประมวลผลข้อมูลส่วนบุคคลของคุณ\n  </p>\n  <p>\n    หากคุณมีคำถามเกี่ยวกับการประมวลผลข้อมูลส่วนบุคคลของคุณ เราขอแนะนำให้คุณไปที่ประกาศความเป็นส่วนตัวของลูกค้าของเรา\n  </p>\n  <h2>เรารวบรวมข้อมูลส่วนบุคคลอะไรบ้าง</h2>\n  <p>\n    ลูกค้าของเรากำหนดให้เรารวบรวมข้อมูลบางอย่างในนามของพวกเขา นอกเหนือจากชื่อและที่อยู่อีเมลของคุณ ซึ่งเป็นสิ่งที่จำเป็นในการสร้างบัญชีการใช้งาน  โดยMTE จะไม่กำหนดข้อมูลที่ถูกรวบรวมโดยอิสระ ตามความต้องการและคำแนะนำของลูกค้าของเรา เราอาจรวบรวมหมวดหมู่ของข้อมูลส่วนบุคคลต่อไปนี้เมื่อเหมาะสมเพื่อให้บรรลุวัตถุประสงค์ทางธุรกิจที่เราตั้งใจไว้:\n  </p>\n  <table width=\"600\">\n    <tbody>\n      <tr>\n        <td width=\"146\">\n          <p>\n            <strong\n              >หมวดหมู่\n            </strong>\n          </p>\n        </td>\n        <td width=\"454\">\n          <p>\n            <strong\n              >ตัวอย่าง\n            </strong>\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"146\"><p>ข้อมูลชีวประวัติ</p></td>\n        <td width=\"454\">\n          <p>ชื่อ, วันเกิด, อายุ, สถานที่เกิด, เพศ.</p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"146\"><p>ข้อมูลการติดต่อ</p></td>\n        <td width=\"454\">\n          <p>ที่อยู่บ้าน, หมายเลขโทรศัพท์, ที่อยู่อีเมลส่วนตัว.</p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"146\"><p>ข้อมูลการระบุ</p></td>\n        <td width=\"454\">\n          <p>\n            หมายเลขประจำตัวผู้เสียภาษี, หมายเลขประกันสังคม หรือหมายเลขประจำตัวที่ออกโดยรัฐบาลอื่น, หมายเลขใบขับขี่, ข้อมูลหนังสือเดินทาง, รายละเอียดบัญชีธนาคาร, การยื่นภาษีเงินได้, หมายเลขภาษีเงินได้.\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"146\">\n          <p>ข้อมูลที่เกี่ยวข้องกับวิชาชีพหรือการจ้างงาน</p>\n        </td>\n        <td width=\"454\">\n          <p>\n            นายจ้างหรือกลุ่ม, ความสัมพันธ์กับบริษัทของเรา, ตำแหน่งงาน, รายละเอียดการติดต่อทางธุรกิจ, รหัสพนักงาน, ระดับการจ้างงาน, ผลการปฏิบัติงานของพนักงาน, เงินเดือนและการชดเชย และประวัติการจ้างงาน, และ/หรือความสัมพันธ์ของคุณกับผู้ถือกรมธรรม์, ผู้เอาประกัน, ผู้รับประโยชน์ หรือผู้เรียกร้อง.\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"146\"><p>คุณลักษณะประชากรที่ละเอียดอ่อน</p></td>\n        <td width=\"454\">\n          <p>\n            เชื้อชาติ สัญชาติ สุขภาพร่างกายหรือจิตใจหรือความพิการ เพศ (รวมถึงเพศสภาพ อัตลักษณ์ทางเพศ การตั้งครรภ์หรือการคลอดบุตรและสภาวะทางการแพทย์ที่เกี่ยวข้อง) รสนิยมทางเพศ สมาชิกสหภาพแรงงาน สถานะทหารหรือทหารผ่านศึก\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"146\"><p>ข้อมูลชีวภาพและข้อมูลทางกายภาพ</p></td>\n        <td width=\"454\">\n          <p>\n            การสแกนใบหน้าและการตรวจสอบใบหน้าเป็นส่วนหนึ่งของตัวเลือกการดูแลสอบ\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"146\"><p>ข้อมูลเกี่ยวกับสภาพแวดล้อมทางกายภาพของคุณ</p></td>\n        <td width=\"454\">\n          <p>\n            วิดีโอหรือพื้นที่เฉพาะที่คุณตั้งอยู่ที่ถ่ายทำผ่านวิดีโอหรือภาพถ่ายเป็นส่วนหนึ่งของตัวเลือกการดูแลสอบ ข้อมูลเฉพาะที่เก็บรวบรวมเกี่ยวกับสภาพแวดล้อมทางกายภาพของคุณจะแตกต่างกันไปตามสิ่งที่มองเห็นได้จากกล้องดูแลสอบ\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"146\"><p>กิจกรรมทางอินเทอร์เน็ตหรือเครือข่ายที่คล้ายกัน</p></td>\n        <td width=\"454\">\n          <p>\n            ประวัติการเรียกดูและค้นหา, การโต้ตอบกับเว็บไซต์, แอปพลิเคชัน หรือโฆษณา, ข้อมูลจากคุกกี้หรือเว็บบีคอน, ข้อมูลการเข้าสู่ระบบ, ชื่อโดเมน, และการโต้ตอบกับอีเมลของเรา รวมถึงเมื่อคุณอ่านและตอบกลับอีเมล, ISP (ผู้ให้บริการอินเทอร์เน็ต), รายละเอียดเบราว์เซอร์, กิจกรรมเว็บไซต์อื่น ๆ, รหัสประจำตัวออนไลน์ (รวมถึงที่อยู่ IP หรือ ID อุปกรณ์).\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"146\"><p>ข้อมูลอื่น ๆ ที่ให้โดยสมัครใจ</p></td>\n        <td width=\"454\">\n          <p>\n            ข้อมูลเกี่ยวกับคู่ค้าและผู้ที่พึ่งพา (รวมถึงผู้ที่พึ่งพาเป็นผู้เยาว์); รายละเอียดการติดต่อในกรณีฉุกเฉิน, ข้อความเปิดเผย, ข้อกำหนดที่จำกัด, การระบุพิกัดทางภูมิศาสตร์, ความชอบในการตลาดและการสื่อสาร, ข้อมูลที่เกี่ยวข้องกับกิจกรรมที่บริษัทสนับสนุนที่คุณได้เข้าร่วม, และข้อเสนอแนะแต่ละข้อหรือคำตอบจากแบบสำรวจที่คุณเลือกที่จะระบุชื่อของคุณ.\n          </p>\n        </td>\n      </tr>\n    </tbody>\n  </table>\n  <p>\n    โปรดทราบว่านี่เป็นเพียงตัวอย่างข้อมูลที่อาจถูกรวบรวม ทั้งนี้ MTE มุ่งมั่นที่จะปฏิบัติตามแนวคิดในการลดการขอข้อมูลและพยายามเก็บรวบรวมเฉพาะข้อมูลส่วนบุคคลที่จำเป็นอย่างยิ่งต่อการให้บริการแก่คุณเท่านั้น อย่างไรก็ตาม เราไม่สามารถควบคุมข้อมูลที่ลูกค้าของเราขอหรือข้อมูลที่คุณยินดีที่จะให้โดยสมัครใจได้\n  </p>\n  <h2>เรารวบรวมข้อมูลส่วนบุคคลอย่างไร</h2>\n  <h3>\n    <strong>\n      ข้อมูลที่จัดทำโดยคุณ ตัวแทนของคุณ หรือบุคคลที่สาม\n    </strong>\n  </h3>\n  <p>เราสามารถเก็บข้อมูลส่วนบุคคลจากแหล่งข้อมูลต่อไปนี้:</p>\n  <ul>\n    <li>\n      โดยตรงจากคุณ เช่น เมื่อคุณเยี่ยมชมเว็บไซต์ สร้างบัญชี ทำแบบสำรวจ หรือให้ข้อมูลกับเราในทางอื่น\n    </li>\n    <li>\n      ตัวแทนของคุณ รวมถึงนายจ้าง สมาคม หรือกลุ่ม หรือผู้สนับสนุนโปรแกรม/แผนสวัสดิการ\n    </li>\n  </ul>\n  <p>\n    ในระหว่างการประเมิน ข้อมูลส่วนบุคคลอาจถูกรวบรวมผ่านเว็บแคม ไมโครโฟน หรืออุปกรณ์ฮาร์ดแวร์อื่น ๆ จากระบบของคุณ โดยที่ระบบของคุณและโปรแกรม MTE จะขอความยินยอมจากคุณก่อนที่จะรวบรวมข้อมูลส่วนบุคคลจากฮาร์ดแวร์ของคุณ\n  </p>\n  <p>\n    หากคุณให้ข้อมูลส่วนบุคคลเกี่ยวกับบุคคลอื่น (เช่น สมาชิกในครอบครัว ผู้รับผลประโยชน์ หรือผู้ที่พึ่งพา) คุณให้การรับรองว่าคุณมีอำนาจในการให้ข้อมูลนี้แทนบุคคลเหล่านั้นและคุณได้แชร์ประกาศความเป็นส่วนตัวนี้ให้แก่บุคคลเหล่านั้นซึ่งเป็นเจ้าของข้อมูลส่วนบุคคลในเวลาที่เหมาะสมแล้ว เราจะไม่เก็บข้อมูลส่วนบุคคลจากเด็ก\n  </p>\n  <h3><strong>การเก็บข้อมูลโดยวิธีอัตโนมัติ</strong>&nbsp;</h3>\n  <p>\n    เราใช้คุกกี้และเทคโนโลยีการติดตามที่เกี่ยวข้อง (“คุกกี้”) บนเว็บไซต์ที่เป็นของบริษัทของเรา หากมีการให้บริการตามเขตอำนาจศาลของคุณ ผู้ใช้เว็บไซต์สามารถเลือกไม่ใช้คุกกี้บางประเภทได้โดยใช้ลิงก์จัดการคุกกี้ที่ด้านล่างของเว็บไซต์ เพื่อเรียนรู้เพิ่มเติมเกี่ยวกับวิธีที่เราใช้คุกกี้ โปรดดูที่ประกาศคุกกี้ของเรา\n    <a href=\"https://www.mercer.com/en-sa/footer/mercer-cookie-notice/\"\n      >(Cookie Notice)</a\n    >.\n  </p>\n  <h3><strong>การเก็บข้อมูลโดยบุคคลที่สาม</strong>&nbsp;</h3>\n  <p>\n    หากคุณดำเนินการทำธุรกรรมผ่านเรา บุคคลที่สาม (เช่น ผู้ให้บริการหรือบริษัทประกันภัย) อาจมีการเก็บรวบรวมและประมวลผลข้อมูลบัตรเครดิตหรือข้อมูลส่วนบุคคลอื่นเกี่ยวกับคุณ โดยผ่านคุกกี้ ในการทำธุรกรรมดังกล่าว ในกรณีเหล่านี้ และสำหรับการจัดการอื่นใดที่เรารับข้อมูลจากนายจ้าง สมาคม หรือบุคคลที่สามอื่น เราขอแนะนำให้คุณอ่านนโยบายความเป็นส่วนตัวของบุคคลที่สามเพื่อเรียนรู้เพิ่มเติมเกี่ยวกับวิธีที่ข้อมูลของคุณจะถูกใช้และเปิดเผยโดยพวกเขา\n  </p>\n  <h2>เราจะใช้ข้อมูลส่วนบุคคลที่เรารวบรวมอย่างไร</h2>\n  <p>เราสามารถใช้ข้อมูลส่วนบุคคลที่เรารวบรวม:</p>\n  <table width=\"600\">\n    <tbody>\n      <tr>\n        <td width=\"107\">\n          <p>\n            <strong>หมวดหมู่\n            </strong>\n          </p>\n        </td>\n        <td width=\"317\">\n          <p><strong>ใช้</strong></p>\n        </td>\n        <td width=\"176\">\n          <p><strong>ฐานทางกฎหมาย</strong></p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"107\">\n          <p><strong>เพื่อดำเนินธุรกิจของเรา</strong></p>\n        </td>\n        <td width=\"317\">\n          <p>\n            เราใช้ข้อมูลส่วนบุคคลตามที่จำเป็นเพื่อดำเนินธุรกิจของเรา รวมถึงการตรวจสอบตัวตนของคุณ ตอบคำถามของคุณ สื่อสารกับคุณ ประมวลผลธุรกรรม สร้างบัญชีออนไลน์ หรือปฏิบัติตามข้อผูกพันตามสัญญาของเรา\n          </p>\n        </td>\n        <td width=\"176\">\n          <p>\n            การปฏิบัติตามสัญญาและ เมื่อเหมาะสม เพื่อฐานประโยชน์อันชอบธรรม (เพื่อให้เราสามารถปฏิบัติตามข้อผูกพันและการให้บริการของเรา)\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"107\">\n          <p>\n            <strong>เพื่อจัดเตรียมสื่อการตลาดให้กับคุณตามที่กฎหมายที่เกี่ยวข้องอนุญาต</strong\n            >\n          </p>\n        </td>\n        <td width=\"317\">\n          <p>\n            เราอาจใช้ข้อมูลติดต่อของคุณเพื่อส่งข้อมูลเกี่ยวกับผลิตภัณฑ์ บริการ และข้อมูลเชิงลึกที่เราเชื่อว่าอาจน่าสนใจสำหรับคุณ การสื่อสารเหล่านี้อาจถูกส่งทางอีเมล ข้อความ ไปรษณีย์ หรือโทรศัพท์ตามความชอบด้านการตลาดของคุณและกฎหมายทั่วโลกที่เกี่ยวข้อง รวมถึงกฎหมายที่เกี่ยวข้องกับการปกป้องข้อมูลและการสื่อสารทางอิเล็กทรอนิกส์ ดังนั้น ฐานที่เราติดต่อคุณจะขึ้นอยู่กับว่าคุณเป็นใคร ความสัมพันธ์ของเรากับคุณ และสถานที่ที่คุณอยู่\n          </p>\n          <p>\n            ไม่ว่าคุณจะได้รับการสื่อสารการตลาดของเราบนพื้นฐานใด เราจะปฏิบัติตามกฎหมายท้องถิ่นและให้ตัวเลือกในการยกเลิกการสมัครสมาชิกได้ตลอดเวลา ในกรณีนี้เราจะหยุดส่งการสื่อสารการตลาดให้กับคุณ คุณยังสามารถดำเนินการเปลี่ยนแปลงความชอบด้านการตลาดของคุณได้โดยการติดต่อเราที่ <a href=\"mailto:privacy@mmc.com\">privacy@mmc.com</a>.\n          </p>\n          <p>\n            โปรดทราบว่า แม้ว่าคุณจะเลือกไม่รับการสื่อสารทางการตลาด เราอาจยังคงส่งการสื่อสารถึงคุณเกี่ยวกับข้อมูลการให้บริการที่เรามอบให้กับคุณ\n          </p>\n        </td>\n        <td width=\"176\">\n          <p>\n            ฐานหน้าที่ผูกพันตามกฎหมาย ฐานความยินยอม (ซึ่งคุณสามารถปฏิเสธหรือถอนความยินยิมออกได้) และในกรณีที่เกี่ยวข้อง ฐานประโยชน์อันชอบธรรม (เพื่อให้คุณได้รับข้อมูลข่าวสารเกี่ยวกับผลิตภัณฑ์และบริการของเรา)\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"107\">\n          <p>\n            <strong>เพื่อการวิจัย การวิเคราะห์ข้อมูล และการพัฒนา</strong>\n          </p>\n        </td>\n        <td width=\"317\">\n          <p>\n            เราอาจวิเคราะห์ข้อมูลส่วนบุคคลร่วมกับข้อมูลจากลูกค้ารายอื่นเพื่อสร้างข้อมูลเชิงลึก รายงาน และการวิเคราะห์อื่น ๆ เพื่อทำความเข้าใจและปรับปรุงคุณภาพของข้อเสนอของเรา; ทำการตลาดคำแนะนำ ผลิตภัณฑ์ และบริการของเรา; และประเมินประสิทธิภาพของกิจกรรมการตลาด เว็บไซต์ และบริการโดยรวมของเรา\n          </p>\n          <p>\n            โปรดทราบว่าเราอาจทำการขจัดการระบุตัวตน (de-identification)ข้อมูลส่วนบุคคลเพื่อไม่ให้สามารถเชื่อมโยงกับลูกค้าหรือบุคคลใดเป็นการเฉพาะ\n          </p>\n        </td>\n        <td width=\"176\">\n          <p>\n            เมื่อเหมาะสม, ฐานประโยชน์อันชอบธรรม (เพื่อให้เราสามารถปรับปรุงบริการของเรา).\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"107\">\n          <p>\n            <strong>เพื่อติดตามกิจกรรมบางอย่างและรักษาความปลอดภัยและประสิทธิภาพของเครือข่าย รวมถึงป้องกันการโจมตีทางไซเบอร์</strong>\n          </p>\n        </td>\n        <td width=\"317\">\n          <p>\n            เราติดตามคำถามและธุรกรรมเพื่อให้แน่ใจว่าคุณภาพการบริการเป็นไปตามมาตรฐาน ปฏิบัติตามขั้นตอน และต่อสู้กับการฉ้อโกง เรายังใช้ข้อมูลส่วนบุคคลตามความจำเป็นเพื่อรักษาความปลอดภัยของเครือข่าย ติดตามประสิทธิภาพของเว็บไซต์ และปกป้องระบบของเราจากการโจมตีทางไซเบอร์\n          </p>\n        </td>\n        <td width=\"176\">\n          <p>\n            ฐานหน้าที่ผูกพันตามกฎหมาย และเมื่อเหมาะสม ฐานประโยชน์อันชอบธรรม (เพื่อให้แน่ใจในคุณภาพและความถูกต้องตามกฎหมายของบริการของเรา)\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"107\">\n          <p>\n            <strong>เพื่อดูแลเว็บไซต์ของเราและรับรองว่าข้อมูลในเว็บไซต์มีความเกี่ยวข้อง</strong>\n          </p>\n        </td>\n        <td width=\"317\">\n          <p>\n            เราใช้ข้อมูลส่วนบุคคลตามที่จำเป็นเพื่อดูแลเว็บไซต์ของเราและเพื่อให้แน่ใจว่าข้อมูลจากเว็บไซต์ของเราถูกนำเสนอในลักษณะที่มีประสิทธิภาพที่สุดสำหรับคุณและอุปกรณ์ของคุณ\n          </p>\n        </td>\n        <td width=\"176\">\n          <p>\n            การปฏิบัติตามสัญญาและ, เมื่อเหมาะสม, ฐานประโยชน์อันชอบธรรม (เพื่อให้เราสามารถให้เนื้อหาและบริการแก่คุณบนเว็บไซต์ได้)\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"107\">\n          <p><strong>เพื่อจัดระเบียบหรือทำการเปลี่ยนแปลงธุรกิจของเรา</strong></p>\n        </td>\n        <td width=\"317\">\n          <p>\n            ตามความจำเป็นหากเรา: (i) อยู่ภายใต้การเจรจาขายธุรกิจของเราหรือส่วนใดส่วนหนึ่งให้กับบุคคลที่สาม; (ii) ถูกขายให้กับบุคคลที่สาม; หรือ (iii) ผ่านการปรับโครงสร้างองค์กร.\n          </p>\n        </td>\n        <td width=\"176\">\n          <p>\n            ฐานหน้าที่ผูกพันตามกฎหมายหรือฐานประโยชน์อันชอบธรรม (เพื่อให้เราสามารถเปลี่ยนแปลงธุรกิจของเราได้)\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"107\">\n          <p>\n            <strong>เกี่ยวกับฐานหน้าที่ผูกพันตามกฎหมายหรือข้อบังคับ</strong>\n          </p>\n        </td>\n        <td width=\"317\">\n          <p>\n            เราจะใช้ข้อมูลส่วนบุคคลเพื่อปฏิบัติตามข้อกำหนดการเปิดเผยข้อมูลตามกฎระเบียบของเรา หรือเป็นส่วนหนึ่งของการสนทนากับหน่วยงานกำกับดูแลของเรา ตามที่เหมาะสม\n          </p>\n        </td>\n        <td width=\"176\">\n          <p>\n            ฐานหน้าที่ผูกพันตามกฎหมาย และเมื่อเหมาะสม ฐานประโยชน์อันชอบธรรม(เพื่อความร่วมมือกับหน่วยงานบังคับใช้กฎหมายและหน่วยงานกำกับดูแล)\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"107\">\n          <p>\n            <strong>สำหรับการตรวจสอบการฉ้อโกง การป้องกันการฟอกเงิน และการคว่ำบาตร</strong>\n          </p>\n        </td>\n        <td width=\"317\">\n          <p>\n            เมื่อสร้างหรือรักษาความสัมพันธ์กับลูกค้าเพื่อการให้บริการบางอย่าง เราใช้ข้อมูลส่วนบุคคลเพื่อวัตถุประสงค์ในการดำเนินการตรวจสอบการฉ้อโกง การป้องกันการฟอกเงิน หรือการตรวจสอบมาตรการคว่ำบาตร\n          </p>\n        </td>\n        <td width=\"176\">\n          <p>\n            ฐานหน้าที่ผูกพันตามกฎหมายและ, เมื่อเหมาะสม, ฐานประโยชน์อันชอบธรรม (เพื่อร่วมมือกับหน่วยงานบังคับใช้กฎหมายและหน่วยงานกำกับดูแล).\n          </p>\n        </td>\n      </tr>\n    </tbody>\n  </table>\n  <p>\n    เรายังอาจใช้ข้อมูลส่วนบุคคลที่เรารวบรวมและได้รับจากคุณเพื่อวัตถุประสงค์ตามที่อธิบายไว้กับคุณในขณะที่มีการเก็บ รวบรวมข้อมูลนั้น\n  </p>\n  <h3><strong>ลิงก์ภายนอก</strong>&nbsp;</h3>\n  <p>\n    เว็บไซต์ของเราอาจมีลิงก์ไปยังเว็บไซต์ที่ดำเนินการโดยองค์กรอื่นที่ไม่ใช่ MTE หากคุณเข้าถึงเว็บไซต์ขององค์กรอื่นโดยใช้ลิงก์บนเว็บไซต์ของเรา องค์กรอื่นอาจเก็บข้อมูลจากคุณ โดยที่ MTE จะไม่มีความรับผิดชอบต่อเนื้อหาหรือแนวทางปฏิบัติด้านความเป็นส่วนตัวของเว็บไซต์ที่เชื่อมโยงหรือการใช้ข้อมูลส่วนบุคคลของคุณ หากคุณออกจากเว็บไซต์ MTE ผ่านลิงก์ดังกล่าว (คุณสามารถตรวจสอบได้ว่าคุณอยู่ที่ไหนโดยการตรวจสอบ URL ในแถบที่อยู่บนเบราว์เซอร์ของคุณ) คุณควรอ้างอิงนโยบายความเป็นส่วนตัว ข้อกำหนดการใช้งาน และประกาศอื่น ๆ ของเว็บไซต์นั้นเพื่อกำหนดว่าองค์กรอื่นจะจัดการข้อมูลส่วนบุคคลใด ๆ ที่พวกเขาเก็บจากคุณอย่างไร\n  </p>\n  <h2>เราจะเปิดเผยข้อมูลส่วนบุคคลให้กับใคร</h2>\n  <p>\n    เราสามารถเปิดเผยข้อมูลส่วนบุคคลให้กับกลุ่มบุคคลที่สามต่อไปนี้:\n  </p>\n  <table width=\"601\">\n    <tbody>\n      <tr>\n        <td width=\"301\">\n          <p><strong>หมวดหมู่ของบุคคลที่สาม</strong></p>\n        </td>\n        <td width=\"301\">\n          <p><strong>วัตถุประสงค์ในการเปิดเผย</strong></p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"301\">\n          <p>\n            นายจ้างของคุณ สมาคม กลุ่ม หรือผู้สนับสนุนโปรแกรมสวัสดิการ เมื่อมีความเหมาะสม (เช่น ลูกค้าของ MTE)\n          </p>\n        </td>\n        <td width=\"301\"><p>เพื่อให้บริการแก่ลูกค้าของเรา</p></td>\n      </tr>\n      <tr>\n        <td width=\"301\">\n          <p>\n            บริษัทในเครือ MTE หรือหน่วยงานอื่น ๆ ภายในกลุ่มบริษัท Marsh McLennan (MMC)\n          </p>\n        </td>\n        <td width=\"301\">\n          <p>\n            เปิดโอกาสให้พวกเขาสามารถให้บริการแก่คุณหรือ ติดต่อคุณเกี่ยวกับผลิตภัณฑ์และบริการเพิ่มเติม\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"301\">\n          <p>ตัวแทนหรือผู้ให้บริการบุคคลที่สาม</p>\n        </td>\n        <td width=\"301\">\n          <p>\n            ดำเนินการฟังก์ชันหรือให้บริการกับเราหรือในนามของเรา บุคคลที่สามดังกล่าวถูกจำกัดตามสัญญาไม่ให้ใช้ข้อมูลส่วนบุคคลเพื่อวัตถุประสงค์อื่นนอกเหนือจากการให้บริการสำหรับหรือในนามของ MTE.\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"301\">\n          <p>\n            พันธมิตรทางการตลาด รวมถึงบริษัทในเครือของเราและบุคคลที่สามที่เรา หรือ ลูกค้าของเราได้ว่าจ้างในความสัมพันธ์กับบริการต่างๆ\n          </p>\n        </td>\n        <td width=\"301\">\n          <p>\n            ตามที่กฎหมายอนุญาตในการให้ข้อมูลเกี่ยวกับผลิตภัณฑ์ บริการ หรือข้อมูลเชิงลึกของเราแก่คุณ\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"301\"><p>พันธมิตรที่มีศักยภาพหรือบริษัทผู้สืบทอดกิจการ</p></td>\n        <td width=\"301\">\n          <p>\n            ในบริบทของการควบรวมกิจการ การเข้าซื้อกิจการ การล้มละลาย การขายสินทรัพย์ หรือธุรกรรมอื่น ๆ ที่บุคคลที่สามเข้ามาควบคุมสินทรัพย์ทั้งหมดหรือบางส่วนของเรา\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"301\"><p>บริษัทวิเคราะห์เว็บไซต์และโฆษณา</p></td>\n        <td width=\"301\">\n          <p>\n            ช่วยเราปรับแต่งโฆษณาและเนื้อหาตามความสนใจของคุณ วัดผลการดำเนินงานของโฆษณาและเนื้อหาของเรา และสรุปข้อมูลเกี่ยวกับกลุ่มผู้ชมที่เห็นโฆษณาและเนื้อหาของเรา\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"301\">\n          <p>\n            ฐานข้อมูลป้องกันการฉ้อโกง หน่วยงานกำกับดูแลหรือหน่วยงานที่มีอำนาจตามกฎหมาย หน่วยงานบังคับใช้กฎหมาย และบุคคลที่สามอื่น ๆ\n          </p>\n        </td>\n        <td width=\"301\">\n          <p>\n            ตามความจำเป็นเพื่อป้องกันการฉ้อโกง สื่อสารกับหน่วยงานกำกับดูแลหรือหน่วยงานที่มีอำนาจ ปกป้องและป้องกันสิทธิทางกฎหมาย ความปลอดภัย และความมั่นคงของ MTE บริษัทในเครือและพันธมิตรทางธุรกิจของเรา รวมถึงผู้ใช้เว็บไซต์ใด ๆ บังคับใช้ข้อกำหนดการใช้งานของเว็บไซต์ ตอบสนองต่อข้อเรียกร้องเกี่ยวกับกิจกรรมที่สงสัยหรือผิดกฎหมาย ตอบสนองต่อการตรวจสอบหรือสอบสวนข้อร้องเรียนหรือภัยคุกคามด้านความปลอดภัย หรือปฏิบัติตามกฎหมาย ระเบียบ ข้อกำหนดทางกฎหมาย หรือคำขอของรัฐบาลที่เกี่ยวข้อง.\n          </p>\n        </td>\n      </tr>\n    </tbody>\n  </table>\n  <p>\n    เรายังอาจเปิดเผยข้อมูลที่ไม่มีการระบุชื่อซึ่งไม่สามารถระบุตัวตนของคุณได้เพื่อวัตถุประสงค์ทางธุรกิจที่ถูกต้องตามกฎหมายและมีความชอบธรรมทางการค้า ในกรณีที่เรามีข้อมูลที่ไม่มีการระบุชื่อ เราจะรักษาและใช้ข้อมูลนั้นโดยไม่ นอกเหนือจากที่กฎหมายอนุญาต\n  </p>\n  <h2>ขั้นตอนที่เราทำเพื่อปกป้องข้อมูลส่วนบุคคล</h2>\n  <p>\n    บริษัทของเรามุ่งมั่นที่จะปฏิบัติตามกฎหมายด้านความปลอดภัยไซเบอร์และการปกป้องข้อมูลที่เกี่ยวข้องทั้งหมด โดยมีเป้าหมายเหล่านี้เป็นหลักการสำคัญ MMC จึงมีเจ้าหน้าที่รักษาความปลอดภัยข้อมูลระดับสูง (Chief Information Security Officer) และเจ้าหน้าที่รักษาความเป็นส่วนตัวระดับโลก (Global Chief Privacy Officer) โดย CISO มีหน้าที่รับผิดชอบในการจัดการทีมความปลอดภัยข้อมูลระดับโลกและโปรแกรมความปลอดภัยไซเบอร์ที่ครอบคลุม ในฐานะที่เป็นส่วนหนึ่งของโปรแกรมความปลอดภัยไซเบอร์ของเรา เราได้ดำเนินการจัดตั้งมาตรการป้องกันทางกายภาพ ทางการบริหาร และทางเทคนิคที่เหมาะสมในเชิงพาณิชย์เพื่อปกป้องข้อมูลส่วนบุคคลจากการเข้าถึง การใช้ การเปลี่ยนแปลง และการลบที่ไม่ได้รับอนุญาต\n  </p>\n  <p>\n    GCPO เป็นผู้นำและดูแลศูนย์ความเป็นเลิศด้านข้อมูลส่วนบุคคลและเครือข่ายเจ้าหน้าที่คุ้มครองข้อมูลที่รับผิดชอบในการดำเนินการตามโปรแกรมความเป็นส่วนตัวระดับโลกที่ครอบคลุมของเรา เครือข่ายเจ้าหน้าที่คุ้มครองข้อมูลเชื่อมโยงเจ้าหน้าที่คุ้มครองข้อมูลของเราทั่วโลกและพยายามที่จะดำเนินการตามหลักการความเป็นส่วนตัวของเราอย่างสม่ำเสมอและทั่วถึงในทุกที่ที่เราประมวลผลข้อมูล คุณสามารถขอชื่อและข้อมูลติดต่อของเจ้าหน้าที่คุ้มครองข้อมูลในเขตอำนาจของคุณได้โดยการติดต่อเราที่ <a href=\"mailto:privacy@mmc.com\">privacy@mmc.com</a>.\n  </p>\n  <h2>สิทธิในการปกป้องข้อมูลของคุณ</h2>\n  <p>\n    ในหลายกรณี เราจัดการข้อมูลส่วนบุคคลเพื่อให้บริการแก่ลูกค้าทางธุรกิจ และคุณควรติดต่อพวกเขาเพื่อใช้สิทธิใด ๆ ที่คุณอาจมีภายใต้กฎหมายความเป็นส่วนตัวที่บังคับใช้ อย่างไรก็ตาม เมื่อเราเป็นผู้ควบคุมหรือธุรกิจที่รับผิดชอบหลักในการตัดสินใจว่าข้อมูลของคุณจะถูกประมวลผลอย่างไร คุณอาจมีสิทธิบางประการหรือทั้งหมดที่ระบุไว้ด้านล่าง ขึ้นอยู่กับเขตอำนาจศาลและเหตุผลของเราในการประมวลผลข้อมูลของคุณ โปรดทราบว่าเราอาจต้องใช้ข้อมูลส่วนบุคคลของคุณเพื่อตรวจสอบตัวตนของคุณก่อนที่จะตอบสนองต่อสิทธิใด ๆ ด้านล่างนี้\n  </p>\n  <ul>\n    <li>\n      <strong>•\tสิทธิในการเข้าถึง (สิทธิในการรับทราบ)<br /></strong>\n      คุณสามารถขอให้เราจัดเตรียมรายละเอียดเพิ่มเติมเกี่ยวกับวิธีที่เรานำข้อมูลส่วนบุคคลของคุณไปใช้ แหล่งที่มา ประเภทหรือข้อมูลเฉพาะของข้อมูลส่วนบุคคลที่เรารวบรวม ประเภทของบุคคลที่สามที่เราได้เปิดเผยข้อมูล และขอสำเนาของข้อมูลส่วนบุคคลที่เรามีเกี่ยวกับคุณได้\n    </li>\n  </ul>\n  <ul>\n    <li>\n      <strong>•\tสิทธิในการแก้ไข<br /></strong>\n      คุณสามารถขอให้เราอัปเดตข้อมูลที่ไม่ถูกต้องในข้อมูลส่วนบุคคลที่เรามี หากเราปล่อยข้อมูลส่วนบุคคลของคุณให้กับผู้อื่น เราจะแจ้งให้พวกเขาทราบเกี่ยวกับการแก้ไขเมื่อเป็นไปได้\n    </li>\n  </ul>\n  <ul>\n    <li>\n      <strong>•\tสิทธิในการลบ<br /></strong>\n      คุณสามารถขอให้เราลบข้อมูลส่วนบุคคลของคุณได้เมื่อเราไม่มีเหตุผลทางกฎหมายในการประมวลผลอีกต่อไป อย่างไรก็ตามการใช้สิทธินี้ คุณรับทราบและตกลงว่าเราอาจไม่สามารถให้บริการบางอย่างให้แก่คุณได้อีกต่อไป เนื่องจากการลบข้อมูลส่วนบุคคลตามที่คุณได้ใช้สิทธินี้\n    </li>\n  </ul>\n  <ul>\n    <li>\n      <strong>•\tสิทธิในการคัดค้านหรือจำกัดการประมวลผล<br /></strong>\n      คุณอาจมีสิทธิ์ในการจำกัดการประมวลผลข้อมูลส่วนบุคคลของคุณในบางกรณี เช่น เมื่อคุณโต้แย้งความถูกต้องของข้อมูลนั้น\n    </li>\n  </ul>\n  <ul>\n    <li>\n      <strong>•\tสิทธิในการพกพาข้อมูล<br /></strong>\n      คุณอาจมีสิทธิ์ในการขอให้เราถ่ายโอนข้อมูลส่วนบุคคลที่เราได้รับจากคุณไปยังบุคคลที่สามที่คุณเลือกในรูปแบบที่มีโครงสร้าง ใช้งานเป็นการทั่วไป และสามารถอ่านข้อมูลได้โดยอุปกรณ์ ซึ่งเป็นไปได้ทางเทคนิค\n    </li>\n  </ul>\n  <ul>\n    <li>\n      <strong>•\tสิทธิในการถอนความยินยอม<br /></strong>\n      หากเราพึ่งพาความยินยอมของคุณเป็นฐานทางกฎหมายในการประมวลผลข้อมูลส่วนบุคคลของคุณ คุณมีสิทธิ์ที่จะถอนความยินยอมดังกล่าว\n    </li>\n  </ul>\n  <ul>\n    <li>\n      <strong>•\tสิทธิในการยื่นเรื่องร้องเรียน<br /></strong>\n      คุณอาจมีสิทธิ์ในการยื่นเรื่องร้องเรียนต่อหน่วยงานกำกับดูแลหรือหน่วยงานที่เกี่ยวข้องในเขตอำนาจศาลของคุณ หากคุณมีข้อกังวลเกี่ยวกับด้านใดด้านหนึ่งของแนวปฏิบัติด้านความเป็นส่วนตัวของเรา\n    </li>\n  </ul>\n  <p>\n    หากคุณต้องการใช้สิทธิ์ใดๆ ข้างต้นหรือต้องการขอให้ทบทวนการตัดสินใจหรือการปฏิเสธ โปรดติดต่อเราโดยใช้ข้อมูลติดต่อที่เกี่ยวข้อง:\n  </p>\n  <ul>\n    <li>\n      สำหรับบุคคลในสหราชอาณาจักร, สวิตเซอร์แลนด์ และเขตเศรษฐกิจยุโรป โปรดกรอกแบบฟอร์มนี้\n      <a\n        href=\"https://mmc-dev-privacy.my.onetrust.com/webform/4da460d1-7bcf-4ff1-ac37-c4b804769467/draft/ea953d72-fded-42ee-b1dd-c0a5a83b7891\"\n        >(complete this form)</a\n      >\n    </li>\n    <li>\n      สำหรับบุคคลในประเทศอื่น โปรดกรอกแบบฟอร์มนี้\n      <a\n        href=\"https://privacyportal.onetrust.com/webform/ee9df2bb-0ef3-4485-bc63-4db420e77359/225910f5-5666-468a-b1e7-39c70e24f4cc\"\n        >(complete this form)</a\n      >\n    </li>\n    <li>\n      หรืออีกทางหนึ่ง คุณสามารถส่งอีเมลถึงเราได้ที่ <a href=\"mailto:privacy@mmc.com\">privacy@mmc.com</a>\n    </li>\n  </ul>\n  <p>\n    ขึ้นอยู่กับประเทศของคุณ คุณอาจมีสิทธิ์บางประการหรือทั้งหมดต่อไปนี้:\n  </p>\n  <ul>\n    <li>\n      <strong>\n        สิทธิในการเลือกเข้าร่วมหรือไม่เข้าร่วมการขายหรือการแบ่งปันสำหรับการโฆษณาที่มุ่งเป้าไปยังผู้บริโภคโดยใช้ข้อมูลส่วนบุคคลที่ได้จากกิจกรรมของผู้บริโภคบนเว็บไซต์ แอป หรือบริการต่างๆ ที่ไม่ได้มีความเกี่ยวข้องสัมพันธ์กัน (Cross-context advertising)<br />\n      </strong>\n      หากคุณเข้าชมเว็บไซต์ใดเว็บไซต์หนึ่งของเรา เราอาจเปิดเผยข้อมูลเกี่ยวกับกิจกรรมทางอินเทอร์เน็ตหรือกิจกรรมเครือข่ายอิเล็กทรอนิกส์อื่น ๆ ของคุณ ข้อมูลระบุตัวตนทางชีวภาพ ข้อมูลตำแหน่งทางภูมิศาสตร์ และข้อมูลวิชาชีพ (ตามขอบเขตที่สามารถสืบค้นได้จากกิจกรรมของคุณในเว็บไซต์ของเรา) ให้กับผู้ให้บริการวิเคราะห์เว็บไซต์และโฆษณาสำหรับวัตถุประสงค์ในการโฆษณาที่มุ่งเป้าหมายหรือพฤติกรรมข้ามบริบทโดยใช้คุกกี้โฆษณา ภายใต้กฎหมายบางฉบับ คุณอาจมีสิทธิ์ในการเลือกเข้าหรือออกจากการเปิดเผยประเภทนี้ เพื่อทำการเลือกของคุณหรือเพื่อดูชื่อของบุคคลที่สามเฉพาะที่เราขายหรือแบ่งปันข้อมูลของคุณ โปรดคลิกที่ลิงก์ “จัดการคุกกี้” ที่ด้านล่างของหน้าเว็บของเรา หากคุณต้องการเลือกไม่เข้าร่วมการขายหรือการแบ่งปันข้อมูลของคุณ ให้แน่ใจว่าการตั้งค่าสำหรับตัวติดตาม “โฆษณา” และ “การวิเคราะห์” ถูกตั้งค่าเป็น “ไม่” หรือหากมีให้เปิดใช้งานตัวเลือก “ไม่ขายหรือแบ่งปันข้อมูลส่วนบุคคลของฉัน”\n      <p>\n        คุณยังสามารถตั้งค่าหรือใช้ส่วนขยายของเบราว์เซอร์เพื่อสื่อสารความชอบในการขายและการแบ่งปันของคุณโดยอัตโนมัติไปยังเว็บไซต์ที่คุณเยี่ยมชม เว็บไซต์ของเราจะประมวลผล “สัญญาณปฏิเสธการขายหรือการแบ่งปันข้อมูล ” (Opt-Out Preference Signal) ดังกล่าวอย่างราบรื่นโดยการรับรู้ Global Privacy Control (GPC) หากคุณต้องการใช้ GPC คุณสามารถดาวน์โหลดและเปิดใช้งานผ่านเบราว์เซอร์ที่เข้าร่วม หรือส่วนขยายของเบราว์เซอร์ ข้อมูลเพิ่มเติมเกี่ยวกับการดาวน์โหลด GPC สามารถดูได้ที่นี่ <a href=\"https://globalprivacycontrol.org/\">here</a>.\n      </p>\n    </li>\n  </ul>\n  <ul>\n    <li>\n      <strong>\n        สิทธิในความสัมพันธ์กับการตัดสินใจอัตโนมัติและการสร้างโปรไฟล์\n      <br /></strong>\n      ในกรณีที่เรามีการประมวลผลข้อมูลส่วนบุคคลของคุณโดยอัตโนมัติ เราจะแจ้งให้คุณทราบล่วงหน้าเกี่ยวกับประกาศใด ๆ รวมถึงสิทธิของคุณที่กฎหมายกำหนด\n    </li>\n  </ul>\n  <ul>\n    <li>\n      <strong>การตลาดทางตรงและความประสงค์มิให้ติดตาม (Not to track signal)<br /></strong>\n      คุณอาจมีสิทธิ์ในการขอและรับการแจ้งเตือนปีละหนึ่งครั้งเกี่ยวกับข้อมูลส่วนบุคคลที่เราเปิดเผยให้กับธุรกิจอื่นเพื่อวัตถุประสงค์ในการตลาดโดยตรงของพวกเขา ซึ่งได้รับอนุญาตตามกฎหมาย หากมีการใช้สิทธิ์ดังกล่าว การแจ้งเตือนจะรวมถึงรายการหมวดหมู่ของข้อมูลส่วนบุคคลที่ถูกเปิดเผย (ถ้ามี) และชื่อและที่อยู่ของบุคคลที่สามทั้งหมดที่ข้อมูลส่วนบุคคลถูกเปิดเผย (ถ้ามี) การแจ้งเตือนจะครอบคลุมปีปฏิทินก่อนหน้า คุณสามารถติดต่อเราได้ตามที่ระบุด้านล่างหากคุณต้องการทราบว่าสิทธิ์นี้ใช้กับคุณหรือไม่ และการอนุญาต ให้ใช้สิทธิ์นั้น\n    </li>\n  </ul>\n  <p>\n    โปรดทราบว่าสิทธิ์บางประการเหล่านี้อาจถูกจำกัดเมื่อเรามีความสนใจที่ชอบด้วยกฎหมายหรือมีฐานหน้าที่ผูกพันตามกฎหมาย กฎระเบียบ หรือสัญญาในการดำเนินการต่อเกี่ยวกับข้อมูลส่วนบุคคล หรือเมื่อข้อมูลส่วนบุคคลอาจได้รับการยกเว้นจากการเปิดเผยหรือการลบตามกฎหมายที่บังคับใช้ สิทธิ์บางประการเหล่านี้สามารถใช้ได้เฉพาะในบางสถานการณ์หรืออาจถูกจำกัดโดยกฎหมายคุ้มครองข้อมูลในเขตอำนาจศาลของคุณ.\n  </p>\n  <h2>การโอนข้ามพรมแดน</h2>\n  <p>\n    ในฐานะที่เราเป็นบริษัทระดับโลกที่ดำเนินงานในมากกว่า 80 ประเทศ มีสถานการณ์ที่เราจะต้องโอนข้อมูลส่วนบุคคลออกจากประเทศ จังหวัด หรือดินแดนที่ข้อมูลนั้นถูกเก็บรวบรวมเพื่อวัตถุประสงค์ที่ระบุไว้ในประกาศความเป็นส่วนตัวนี้ โดยเฉพาะอย่างยิ่ง เราอาจโอนข้อมูลเพื่อเสนอ จัดการ และบริหารบริการที่จัดให้กับคุณ และเพื่อเพิ่มประสิทธิภาพในการดำเนินธุรกิจของเรา เราจะพยายามอย่างเต็มที่เพื่อให้แน่ใจว่าการโอนข้อมูลเหล่านี้เป็นไปตามกฎหมายการคุ้มครองข้อมูลที่เกี่ยวข้องทั้งหมด และสิทธิและเสรีภาพของบุคคลภายใต้กฎหมายดังกล่าวได้รับการคุ้มครองอย่างเหมาะสม\n  </p>\n  <p>\n    ในกรณีที่มีความจำเป็นต้องมีการโอนข้อมูลดังกล่าว เราจะดำเนินการเพื่อให้แน่ใจว่ามีการป้องกันที่เหมาะสมเพื่อปกป้องข้อมูลส่วนบุคคล เช่น การประเมินผลกระทบ การตัดสินใจความเหมาะสมโดยหน่วยงานกำกับดูแลที่เหมาะสม การใช้กฎระเบียบภายในที่ได้รับการอนุมัติหรือข้อกำหนดสัญญามาตรฐาน หรือความยินยอมของคุณ\n  </p>\n  <p>\n    สำหรับข้อมูลเกี่ยวกับวิธีการที่กฎระเบียบการควบคุมองค์กรที่มีผลผูกพันของ MMC ในสหภาพยุโรป (EU BCRs)\n    <a\n      href=\"https://www.marshmclennan.com/content/dam/mmc-web/Archive/Images/Files/02March2022-EUBCR-Controller-and-Processor-Principles.pdf\"\n      >here</a\n    >.&nbsp; ทำงาน คลิกที่นี่ สำหรับรายชื่อหน่วยงานที่ตกลงที่จะผูกพันตาม EU BCRs คลิกที่นี่\n    <a href=\"https://www.marshmclennan.com/privacy-statement/bcr-entities.html\"\n      >here</a\n    >.&nbsp;\n  </p>\n  <p>\n    hereสำหรับข้อมูลเกี่ยวกับวิธีการที่กฎระเบียบของบริษัทที่ผูกพันของ MMC ในสหราชอาณาจักร (UK BCRs)\n    <a\n      href=\"https://www.marshmclennan.com/content/dam/mmc-web/Archive/Images/Files/02March2022-UKBCR-Controller-and-Processor-Principles.pdf\"\n      >here</a\n    >.&nbsp;  ทำงาน คลิกที่นี่ สำหรับรายชื่อหน่วยงานที่ตกลงที่จะผูกพันตาม UK BCRs คลิกที่นี่here\n    <a\n      href=\"https://www.marshmclennan.com/privacy-statement/bcr-entities-uk.html\"\n      >here</a\n    >.&nbsp;&nbsp;&nbsp;\n  </p>\n  <h2>การเก็บรักษาข้อมูลของคุณ</h2>\n  <p>\n    ผลิตภัณฑ์ บริการ และข้อผูกพันด้านกฎระเบียบของเรามีความซับซ้อน ดังนั้นระยะเวลาการเก็บรักษาข้อมูลส่วนบุคคลของเราจึงแตกต่างกัน เราพิจารณาข้อผูกพันต่อไปนี้เมื่อกำหนดระยะเวลาการเก็บรักษาข้อมูลส่วนบุคคลและเอกสารที่เราดูแลรักษา:\n  </p>\n  <ul>\n    <li>\n      ความจำเป็นในการเก็บรักษาข้อมูลเพื่อให้บรรลุวัตถุประสงค์ทางธุรกิจหรือข้อผูกพันตามสัญญาที่ได้เก็บรวบรวมไว้\n    </li>\n    <li>\n      หน้าที่ของเราในการดำเนินการตามคำสั่งของลูกค้าเกี่ยวกับข้อมูลส่วนบุคคลที่เราประมวลผลในนามของพวกเขา;\n    </li>\n    <li>\n      หน้าที่ของเราในการปฏิบัติตามข้อกำหนดด้านการบันทึกข้อมูลทางกฎหมายและระเบียบข้อบังคับที่จำเป็น;\n    </li>\n    <li>\n      ขั้นตอนการสำรองข้อมูลและการกู้คืนจากภัยพิบัติของเรา; และ\n    </li>\n    <li>\n      ผลกระทบทางกฎหมายอื่น ๆ เช่นระยะเวลาที่ใช้บังคับตามกฎหมายที่เกี่ยวข้อง\n    </li>\n  </ul>\n  <p>\n    ตามปัจจัยข้างต้น เราอาจเก็บรักษาข้อมูลส่วนบุคคลเกินระยะเวลาที่เรามีการให้บริการแก่คุณ เมื่อเราไม่จำเป็นต้องเก็บรักษาข้อมูลส่วนบุคคลอีกต่อไป นโยบายของบริษัทของเรากำหนดให้เราต้องทำการลบข้อมูลที่สามารถระบุตัวตนได้หรือรวมข้อมูล (ในกรณีนี้เราสามารถเก็บรักษาและใช้ข้อมูลที่ไม่สามารถระบุตัวตนได้หรือข้อมูลที่รวมกันเพื่อวัตถุประสงค์ในการวิเคราะห์) หรือทำลายข้อมูลอย่างปลอดภัย\n  </p>\n  <h2>คำถามหรือข้อกังวล</h2>\n  <p>\n    privacy@mmc.comหากต้องการส่งคำถามหรือคำขอเกี่ยวกับประกาศความเป็นส่วนตัวนี้หรือแนวปฏิบัติด้านความเป็นส่วนตัวของ MTE กรุณาส่งอีเมลถึงเราที่ <a href=\"mailto:privacy@mmc.com\">privacy@mmc.com</a> หากคุณต้องการติดต่อเราทางไปรษณีย์หรือทางโทรศัพท์ กรุณาติดต่อเจ้าหน้าที่คุ้มครองข้อมูลในพื้นที่ของคุณ คุณสามารถขอข้อมูลการติดต่อของเจ้าหน้าที่คุ้มครองข้อมูลในพื้นที่ของคุณได้โดยการติดต่อเราที่\n    <a href=\"mailto:privacy@mmc.com\">privacy@mmc.com</a>.\n  </p>\n</div>"
