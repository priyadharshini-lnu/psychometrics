      campaign_start_final_instructions: "<p>โปรดทราบว่าไม่มีวิธีใดที่จะหยุดหรือหยุดตัวจับเวลาได้ ตัวจับเวลาแคมเปญจะยังคงทำงานต่อไปแม้ว่าคุณจะปิดเบราว์เซอร์ ดังนั้นคุณไม่ควรคิดที่จะออกจากงานระหว่างนั้นเพื่อทำอย่างอื่น อย่าลืมลดสิ่งรบกวนระหว่างทำงาน หาสภาพแวดล้อมที่เงียบสงบ ปิดการแจ้งเตือนบนอุปกรณ์ของคุณ และหลีกเลี่ยงการทำหลายอย่างพร้อมกัน รักษาสมาธิและจดจ่ออยู่กับงาน เมื่อตัวจับเวลาแคมเปญหมดลง คุณจะไม่สามารถดำเนินการต่อได้ หากคุณได้อ่านคำแนะนำข้างต้นแล้ว โปรดคลิกเริ่มเพื่อดำเนินการงานที่ได้รับมอบหมายต่อ</p>\n"
      campaign_start_instruction: "<h4>กรุณาอ่านคำแนะนำต่อไปนี้อย่างถูกต้อง</h4><p> ภารกิจที่คุณกำลังจะเริ่มนั้นมีกำหนดเวลาไว้แล้ว เมื่อคุณคลิก &quot;เริ่ม&quot; ตัวจับเวลาแคมเปญจะเริ่มทำงานโดยอัตโนมัติ คุณมีเวลา %{minutes} นาทีในการทำกิจกรรมทั้งหมดให้เสร็จสิ้น โปรดพยายามทำภารกิจให้เสร็จสิ้นภายในกรอบเวลาที่กำหนด และจัดการเวลาอย่างมีประสิทธิภาพเพื่อหลีกเลี่ยงการเร่งรีบในการประเมินผล ตรวจสอบให้แน่ใจว่าคุณทำภารกิจให้เสร็จสิ้นในครั้งเดียว ดังนั้นหากคุณต้องการพัก ก็ถึงเวลาแล้ว</p>\n"
      common_proctoring_instructions: "<h4>การคุมสอบ</h4><p> เมื่อคลิกปุ่มเริ่ม คุณจะถูกนำไปยังระบบตรวจสอบของเรา ซึ่งจะตรวจสอบกล้อง ไมโครโฟน และหน้าจอของคุณในระหว่างเซสชัน ระบบ AI ที่ซับซ้อนของเราจะทำการตรวจสอบเซสชันเหล่านี้โดยอัตโนมัติ ซึ่งจะทำให้ผู้ใช้ได้รับประสบการณ์การใช้งานที่ราบรื่นและต่อเนื่อง อย่างไรก็ตาม เซสชันต่างๆ อาจได้รับการตรวจสอบโดยเจ้าหน้าที่ตรวจสอบที่เป็นมนุษย์ด้วยเช่นกัน หากพบสัญญาณของการประพฤติมิชอบหรือความผิดปกติใดๆ จะถูกทำเครื่องหมายไว้ การดำเนินการนี้ทำขึ้นเพื่อให้แน่ใจว่าไม่มีการพยายามโกง หากพบข้อสงสัย งานของคุณจะถูกยกเลิก</p>\n"
      lockdown_browser_instruction: "<h4>เบราว์เซอร์ตรวจสอบ</h4><p> คุณจะต้องดาวน์โหลดและติดตั้งเบราว์เซอร์พิเศษเพื่อทำภารกิจที่ตรวจสอบให้เสร็จสิ้น โปรดปฏิบัติตามคำแนะนำในหน้าจอถัดไป คุณสามารถถอนการติดตั้งได้หลังจากดำเนินกิจกรรมที่จำเป็นทั้งหมดเสร็จสิ้น</p>\n"
