    instruction_modal:
      campaign_start_final_instructions: |
        <p>
        โปรดทราบว่าไม่มีวิธีใดที่จะหยุดหรือพักตัวจับเวลา ถึงแม้ว่าคุณจะปิดเบราว์เซอร์ตัวจับเวลาของแคมเปญจะยังคงทำงานต่อไป ดังนั้นจึงไม่ควรหยุดกลางคันเพื่อไปทำสิ่งอื่น กรุณาลดสิ่งรบกวนระหว่างการทำแบบประเมิน หาสภาพแวดล้อมที่เงียบสงบ ปิดการแจ้งเตือนบนอุปกรณ์ของคุณ และหลีกเลี่ยงการทำหลายอย่างพร้อมกัน รักษาสมาธิและจดจ่ออยู่กับงาน เมื่อตัวจับเวลาแคมเปญหมดลง คุณจะไม่สามารถดำเนินการต่อได้อีก หากคุณได้อ่านคำแนะนำข้างต้นแล้ว กรุณาคลิก ‘เริ่ม’ เพื่อดำเนินการทำงานที่ได้รับมอบหมายต่อไป
        </p>
      campaign_start_instruction: "<h4>กรุณาอ่านคำแนะนำต่อไปนี้อย่างละเอียด</h4>\n<p> \nงานที่คุณกำลังจะเริ่มมีการจับเวลา เมื่อคุณคลิก \"เริ่ม\" ตัวจับเวลาแคมเปญจะเริ่มทำงานโดยอัตโนมัติ คุณมีเวลา %{minutes} นาทีในการทำกิจกรรมทั้งหมดให้เสร็จ กรุณาพยายามทำให้เสร็จภายในเวลาที่กำหนด และบริหารเวลาอย่างมีประสิทธิภาพเพื่อหลีกเลี่ยงการเร่งรีบในระหว่างการประเมิน กรุณาทำงานให้เสร็จในครั้งเดียว หากคุณต้องการพักตอนนี้คือเวลาที่เหมาะสมก่อนเริ่มงาน\n</p>\n"
      common_proctoring_instructions: "<h4>การคุมสอบ</h4>\n<p> \nเมื่อคลิกปุ่มเริ่ม ระบบจะนำคุณเข้าสู่ระบบควบคุมการสอบ ซึ่งจะมีการตรวจสอบกล้อง, ไมโครโฟน และหน้าจอของคุณตลอดระยะเวลาการทำแบบประเมิน ระบบควบคุมนี้ดำเนินการอัตโนมัติโดยระบบ AI ที่มีความทันสมัย เพื่อให้ประเมินได้รับประสบการณ์การใช้งานที่ราบรื่นและต่อเนื่อง อย่างไรก็ตาม อาจมีการตรวจสอบเพิ่มเติมโดยเจ้าหน้าที่ควบคุมการสอบ หากพบพฤติกรรมที่ผิดปกติหรือน่าสงสัย ระบบจะทำการแจ้งเตือนโดยอัตโนมัติ ทั้งนี้เพื่อป้องกันการทุจริตทุกรูปแบบ หากพบความผิดปกติหรือการกระทำที่น่าสงสัย งานของคุณจะถูกยกเลิกโดยทันที\n</p>\n"
      lockdown_browser_instruction: "<h4>เบราว์เซอร์การควบคุมการสอบ</h4>\n<p> \nคุณจำเป็นต้องดาวน์โหลดและติดตั้งเบราว์เซอร์พิเศษเพื่อใช้ในการทำแบบประเมินที่อยู่ภายใต้การควบคุม โปรดทำตามคำแนะนำในหน้าถัดไป โดยคุณสามารถถอนการติดตั้งได้หลังจากทำกิจกรรมทั้งหมดเสร็จสิ้นแล้ว\n</p>\n"
