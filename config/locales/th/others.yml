            content: รวมทักษะ ความรู้ และความสามารถที่ต้องพัฒนา ตรวจสอบให้แน่ใจว่ามีความเฉพาะเจาะจง วัดผลได้ ทําได้จริง และสามารถทําได้อย่างสมเหตุสมผลตามไทม์ไลน์ที่กล่าวถึง
            title: วัตถุประสงค์การพัฒนา
          c2:
            content: สิ่งนี้ขึ้นอยู่กับความสามารถที่จะพัฒนาตามประสบการณ์การประเมิน
            title: ความสามารถ
          c3:
            content: ส่วนนี้รวมถึงการดําเนินการพัฒนาของคุณตามรูปแบบการเรียนรู้ 70-20-10 ตามรายการด้านล่าง ขอแนะนําให้คุณเลือกองค์ประกอบทั้งสามร่วมกันเพื่อให้แน่ใจว่ามีแนวทางการเรียนรู้และการพัฒนาที่หลากหลาย
            title: กิจกรรม
          c4:
            content: ตรวจสอบให้แน่ใจว่าไทม์ไลน์ของคุณเป็นจริงโดยพิจารณาจากเวลาที่วัตถุประสงค์สามารถทําได้ แก้ไขสิ่งนี้ตามความเหมาะสม
            title: ไทม์ไลน์
          c5:
            content: ใช้ส่วนความคืบหน้าเพื่อสนับสนุนความคืบหน้าในแทร็กที่ระบุ
            title: ความคืบหน้า
        chart:
          collaboration: "<strong>20%</strong>ร่วม กัน <br /> การเรียนรู้"
          job: "<strong>70%</strong>การเรียนรู้ <br />ในการทํางาน"
          learn: "<strong>10%</strong>การเรียนรู้อย่างเป็นทางการ"
        content:
          list:
            r1: โปรดทราบว่า รายการนี้เป็นเพียงตัวอย่างเท่านั้น และอาจมีการพิจารณาเส้นทางการพัฒนาเพิ่มเติมสำหรับคุณตามความมุ่งหวังส่วนบุคคล คำแนะนำจากผู้จัดการของคุณ รวมถึงลำดับความสำคัญทางธุรกิจขององค์กร
            r2: ผู้ใช้ได้รับการส่งเสริมให้ตรวจสอบเนื้อหาทั้งหมดอย่างวิพากษ์วิจารณ์ และมีอิสระในการแก้ไข ปรับปรุง เปลี่ยนแปลง หรือเพิ่มการกระทำหรือคำแนะนำใด ๆ ที่พวกเขาไม่เห็นด้วย
            r3: 'ข้อมูลการพัฒนาที่รวมอยู่ในรายงานฉบับนี้อาจมาจากแหล่งใดแหล่งหนึ่งหรือทั้งสองแหล่งต่อไปนี้:'
            r3a: ห้องสมุดการพัฒนาที่ปรับแต่งตามความต้องการ สร้างขึ้นเพื่อองค์กรของคุณ
            r3b: คำแนะนำการพัฒนาที่สร้างโดย AI
            r4: รายงาน IDP นี้ได้รับการจัดทำขึ้นโดยใช้เทคโนโลยีปัญญาประดิษฐ์ (AI) อาจมีความไม่ถูกต้องบางประการ ข้อมูลเชิงลึกและคำแนะนำที่ให้ไว้ควรพิจารณาอย่างรอบคอบและใช้เป็นเครื่องมือสำหรับการพัฒนาตนเองและวิชาชีพเท่านั้น รายงานนี้มีอายุการใช้งาน 12-18 เดือน
          main: IDP ที่สร้างขึ้นประกอบด้วยรายการรายละเอียดของการดำเนินการพัฒนาที่คุณสามารถทำได้ โดยคำนึงถึงแนวปฏิบัติที่ดีที่สุดในการเรียนรู้ นั่นคือแนวทาง 70-20-10 ซึ่งให้เส้นทางที่ก้าวหน้าโดยผสมผสานการเรียนรู้ในห้องเรียน การโค้ช และการเรียนรู้จากการทำงานจริง ตามผลลัพธ์จากกระบวนการศูนย์ประเมิน การตอบสนองในการแชทของคุณ และรายงานภายนอกที่เกี่ยวข้อง (ถ้ามี) ได้มีการแนะนำเส้นทางการพัฒนาที่เป็นไปได้ ซึ่งสามารถพิจารณาสำหรับการพัฒนาของคุณ
        learn_cards:
          collaboration:
            list:
            - เสนอเป็นโค้ชหรือที่ปรึกษาให้ผู้อื่น
            - ขอรับคำปรึกษาจากผู้เชี่ยวชาญในสายงานของคุณ
            - หาผู้ฝึกสอนเพื่อสนับสนุนการพัฒนาของคุณ
            - ตั้งกลุ่มทำงานร่วมกันเพื่อหารือปัญหาทางธุรกิจ
            - รับข้อเสนอแนะทั้งทางการและไม่เป็นทางการจากผู้อื่น
            - มีบทบาทในสมาคมหรือเครือข่ายวิชาชีพ
            - สร้างเครือข่ายภายนอกของคุณเอง
            title: การเรียนรู้ร่วมกัน (20%) <br/> พัฒนาผ่านผู้อื่น
          job:
            list:
            - รับตำแหน่งผู้นำในคณะกรรมการหรือคณะทำงาน
            - อาสานำโครงการเปลี่ยนแปลงในองค์กร
            - รับงานที่ท้าทายมากขึ้น
            - ทำงานข้ามสายงานกับฝ่ายอื่น
            - นำโครงการนอกองค์กรของคุณ
            - ทำงานร่วมกับผู้เชี่ยวชาญภายนอกในโครงการร่วม
            title: การเรียนรู้ในการทํางาน (70%) <br/> พัฒนาผ่านประสบการณ์
          learn:
            list:
            - เข้าร่วมโปรแกรมการฝึกอบรมที่มีโครงสร้าง
            - หลักสูตรการเรียนรู้ออนไลน์แบบครบวงจร
            - อ่านหนังสือ บทความ สิ่งพิมพ์
            - ได้รับคุณวุฒิวิชาชีพ, ใบรับรอง และประกาศนียบัตร
            - เข้าร่วมหลักสูตร, เวิร์กช็อป, สัมมนา
            title: การเรียนรู้อย่างเป็นทางการ (10%) <br/> การพัฒนาผ่านการเรียนรู้ที่มีโครงสร้าง
        title: คู่มือสำหรับใบอนุญาตขับรถระหว่างประเทศของคุณ
