      เวอร์ชัน 4.0

      ปรับปรุงล่าสุด: 29 พฤษภาคม 2025

      เพื่อให้แน่ใจว่าคุณจะมีส่วนร่วมอย่างมีนัยสำคัญในกิจกรรมนี้ ข้อมูลส่วนบุคคลของคุณบางส่วนจะถูกรวบรวมและประมวลผล
      กิจกรรมนี้ได้รับการบริหารจัดการโดย Mercer Talent Enterprise ในนามและตามคำแนะนำของลูกค้าของเรา ซึ่งเป็นผู้กำหนดวัตถุประสงค์ในการประมวลผลข้อมูลส่วนบุคคลของคุณ และวิธีการใช้งานข้อมูลดังกล่าว โปรดทราบว่าข้อมูลของคุณอาจถูกโอนข้ามพรมแดนระหว่างประเทศ ซึ่งเป็นส่วนหนึ่งของบริการที่เรามอบให้แก่ลูกค้าของเรา
      ในกรณีดังกล่าว เราจะทำหน้าที่เป็นผู้นำเข้าข้อมูล (Data Importer) และลูกค้าของเราจะทำหน้าที่เป็นผู้ส่งออกข้อมูล (Data Exporter)
      การโอนข้อมูลส่วนบุคคลระหว่างประเทศจะดำเนินการตามกฎหมายคุ้มครองข้อมูลส่วนบุคคลที่เกี่ยวข้อง

      สำหรับข้อมูลเพิ่มเติมเกี่ยวกับวิธีการที่เราประมวลผลข้อมูลส่วนบุคคลของคุณ กรุณาคลิกที่นี่เพื่ออ่านประกาศความเป็นส่วนตัวทั่วโลกของเรา: [GLOBAL_PRIVACY_LINK]

