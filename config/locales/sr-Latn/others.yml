      guidelines:
        cards:
          c1:
            content: Uključite veštine, znanja i sposobnosti koje treba razviti. Uverite se da su specifični, merljivi, ostvarivi, realni i razumno sposobni da se postignu u navedenim rokovima.
            title: Razvojni ciljevi
          c2:
            content: Ovo se zasniva na kompetenciji koja se razvija na osnovu iskustva procene.
            title: Nadležnost
          c3:
            content: Ovaj odeljak uključuje vaše razvojne akcije zasnovane na modelu učenja KSNUMKS-KSNUMKS-KSNUMKS navedenom u nastavku. Savetuje se da izaberete kombinaciju svakog od tri elementa kako biste osigurali raznovrstan pristup učenju i razvoju.
            title: Aktivnosti
          c4:
            content: Uverite se da su vaši rokovi realni na osnovu toga kada cilj može biti potpun. Da izmeni ovo kao i kada je to potrebno.
            title: Vremenska linija
          c5:
            content: Koristite odeljak za napredak da biste podržali napredovanje na identifikovanim stazama.
            title: Napredak
        chart:
          collaboration: "<strong>20%</strong>saradnja <br /> Učenje"
          job: "<strong>70%</strong>Učenje <br />na poslu"
          learn: "<strong>10%</strong>Formalno učenje"
        content:
          list:
            r1: Имајте у виду да је ова листа само оријентациона, и да се за вас могу размотрити додатни путеви развоја на основу ваших појединачних аспирација, препорука вашег менаџера као и пословних приоритета организације.
            r2: Корисници се подстичу да критички прегледају сав садржај и слободни су да измене, усаврше, замене или додају било које акције или препоруке са којима се не слажу.
            r3: 'Улази за развој укључени у овај извештај могу бити изведени из једног или оба следећа извора:'
            r3a: Прилагођена развојна библиотека креирана за вашу организацију
            r3b: Вештачка интелигенција генерише предлоге за развој
            r4: Овај IDP извештај је генерисан уз помоћ вештачке интелигенције и може садржати нетачности. Увиди и препоруке које се пружају треба тумачити с опрезом и користити их искључиво као алат за ваш лични и професионални развој. Извештај важи у периоду од 12 до 18 месеци.
          main: IDP који је креиран садржи детаљну листу развојних активности које можете предузети, имајући у виду најбоље праксе учења, тј. смерницу 70-20-10, која пружа прогресивно путовање комбинујући учење у учионици, коучинг и учење на радном месту. На основу резултата процеса асесмент центра, ваших одговора у разговорима и спољних извештаја, по потреби, предложене су могуће стазе развоја које се могу размотрити за ваш развој.
        learn_cards:
          collaboration:
            list:
            - Понудите да тренирате или менторишете друге
            - Захтев за менторство од стране стручњака у вашој области
            - Добијте ментора који ће подржати ваш развој
            - Организујте колаборативну радну групу за дискусију о текућим изазовима у пословању.
            - Добијајте повратне информације формално и неформално од других.
            - Играјте активну улогу у индустријским удружењима и мрежама
            - Изградите своје спољне мреже
            title: Kolaborativno učenje (KSNUMKS%) <br/> Razvijanje kroz druge
          job:
            list:
            - Преузмите лидерске позиције у одборима заинтересованих страна или у управљачким одборима.
            - Пријавите се добровољно да водите пројекте управљања променама у организацији.
            - Размислите о преузимању задатака истезања.
            - Радите у међуфункционалној сарадњи са другим функцијама
            - Размотрите вођење пројеката ван ваше организације
            - Радите блиско са спољним стручњацима из индустрије на заједничким пројектима.
            title: Učenje na poslu (70%) <br/> Razvijanje kroz iskustvo
          learn:
            list:
            - Похађајте структурисане програме обуке
            - Завршите онлајн курсеве е-учења
            - Читајте књиге, чланке, публикације
            - Стеците стручне квалификације, сертификате и акредитације
            - Похађајте курсеве, радионице, семинаре
            title: Formalno učenje (10%) <br/> Razvijanje kroz strukturirano učenje
