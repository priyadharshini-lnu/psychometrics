    edit_evaluation:
      body: Imajte na umu da kada kliknete na Ponovo proceni, bićete preusmereni na početak ankete gde možete da izmenite odgovore. Prethodni odgovori će i dalje biti dostupni, ali možete ih promeniti po vašem čitanju. Nakon uređivanja, moraćete da ponovo podnese procenu da biste završili proces.
