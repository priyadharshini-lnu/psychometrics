    goto_dashboard: Idi na kontrolnu tablu
    inactive_campaign_message: Trenutno vam nisu dodeljene nikakve aktivnosti.
    insights_reports: Uvidi i izveštaji
    instruction_modal:
      campaign_start_final_instructions: "<p>Imajte na umu da ne postoji način da se zaustavi ili pauzira tajmer. Tajmer kampanje će nastaviti da radi čak i kada zatvorite pregledač, tako da ni u jednom trenutku ne bi trebalo da razmišljate o ostavljanju zadataka između da biste uradili nešto drugo. Minimizirajte smetnje tokom zadataka. Pronađite mirno okruženje, isključite obaveštenja na svojim uređajima i izbegavajte multitasking. Održavajte koncentraciju i ostanite fokusirani. Kada istekne tajmer kampanje, nećete moći da nastavite. Ako ste pročitali gornja uputstva, kliknite na start da biste nastavili dodeljene zadatke.</p>"
      campaign_start_instruction: |-
        <h4>Molimo Vas da pravilno pročitate sledeća uputstva.</h4>
        <p>Zadaci koje ćete započeti su vremenski ograničeni. Kada kliknete na "Start", tajmer kampanje će automatski početi. Imate %{minutes} minuta da završite sve aktivnosti. Molimo vas da nastojite da završite zadatke u određenom vremenskom okviru i efikasno upravljate vremenom kako biste izbegli žurbu kroz proces evaluacije. Uverite se da završite zadatke u jednom potezu, tako da ako treba da napravite pauzu, Sada je vreme.</p>
      common_proctoring_instructions: |-
        <h4>Pretraživanje</h4>
        <p>Nakon klika na dugme Start, bićete preusmereni na naš sistem proktoringa. On će pratiti vašu kameru, mikrofon i ekran tokom sesije. Ove sesije se automatski pokreću našim sofisticiranim AI sistemom, pružajući neprekidno i glatko korisničko iskustvo. Međutim, sesije mogu pregledati i ljudski proktori. Svi znaci nedoličnog ponašanja ili nepravilnosti će biti označeni. Ovo se radi kako bi se osiguralo da se ne pokušaju varanja. Ako se pronađu sumnje, vaš zadatak će biti otkazan.</p>
      lockdown_browser_instruction: |-
        <h4>Proktoring pretraživač</h4>
        <p>Od vas će se tražiti da preuzmete i instalirate poseban pretraživač da biste dovršili zadatke. Molimo vas da pratite uputstva na sledećem ekranu. Ovo možete deinstalirati nakon završetka svih potrebnih aktivnosti.</p>
