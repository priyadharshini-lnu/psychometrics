    <h2>Obaveštenje o kolačićima</h2>

    <p>Datum stupanja na snagu: 14. decembar 2023.</p>

    <p>Na ovoj veb stranici koristimo kolačiće i srodne tehnologije praćenja, uključujući veb majake, piksele za praćenje i dnevničke datoteke (zajedno označene kao kolačići), kako bismo vas razlikovali od drugih korisnika, procenili i poboljšali funkcionalnost veb stranice i naših usluga i pružili dobro korisničko iskustvo.</p>

    <p><strong>ŠTA JE KOLAČIĆ</strong></p>

    <p>Kolačići su informacije koje se razmenjuju između vašeg veb pregledača i veb stranice. Neki kolačići su potrebni za funkcionisanje veb stranice. Neki nam pomažu da procenimo i poboljšamo njeno funkcionisanje. Kolačiće koristimo i za pružanje relevantnog sadržaja, proizvoda i usluga. Kolačić ne može da čita podatke sa tvrdog diska vašeg računara.</p>

    <p><strong>Postoje različite vrste kolačića sa različitim funkcijama:</strong></p>

    <p><strong>(i) Sesijski kolačići:</strong> ovi kolačići se čuvaju na vašem računaru samo tokom vaše sesije. Automatski se brišu po zatvaranju pregledača. Obično čuvaju anonimni ID sesije koji vam omogućava pregledanje veb stranice bez potrebe za prijavljivanjem na svaku stranicu. Ne prikupljaju nikakve informacije sa vašeg računara.</p>

    <p><strong>(ii) Trajni kolačići:</strong> ovi kolačići se čuvaju kao datoteka na vašem računaru i ostaju tamo kada zatvorite pregledač. Veb stranica ih može pročitati kada ponovo posetite veb stranicu.</p>

    <p><strong>(iii) Kolačići prvog lica:</strong> ove kolačiće kreira naša kompanija. Čuvaju se i šalju između naših servera i tvrdog diska vašeg računara. Ovi kolačići mogu biti ili sesijski ili trajni.</p>

    <p><strong>(iv) Kolačići trećih lica:</strong> ove kolačiće kreira jedan od naših trećih partnera. Čuvaju se i šalju između servera treće strane i tvrdog diska vašeg računara. Ovi kolačići su obično trajni.</p>

    <p><strong>KAKO I ZAŠTO KORISTIMO KOLAČIĆE</strong></p>

    <p>U zavisnosti od veb stranice, kolačiće možemo koristiti u sledeće svrhe:</p>

    <p><strong>Gde su neophodni</strong></p>

    <p>Ovi kolačići su neophodni za kretanje po veb stranici i korišćenje njenih funkcija, kao što je pristup zaštićenim područjima. Bez ovih kolačića nije moguće pružiti usluge koje ste zahtevali, kao što je dobijanje ponude ili prijava na nalog. Ovi kolačići ne prikupljaju informacije o vama koje bi se mogle koristiti u marketinške svrhe ili za pamćenje vaših poseta.</p>

    <p><strong>Funkcionalnost</strong></p>

    <p>Ovi kolačići omogućavaju veb stranici da zapamti vaše izbore (npr. korisničko ime, jezik ili region) i pruži napredne funkcije. Na primer, veb stranica može zapamtiti vaše podatke za prijavu tako da ne morate ponovo da se prijavljujete kada koristite isti uređaj. Kolačići se takođe mogu koristiti za pamćenje promena veličine teksta, fonta i drugih prilagođenih elemenata. Mogu se koristiti i za pružanje usluga koje ste zahtevali, kao što je gledanje video snimaka ili komentarisanje članaka. Prikupljene informacije su obično anonimne i ne mogu se koristiti za oglašavanje ili praćenje vašeg ponašanja na mreži.</p>

    <p><strong>Analitika</strong></p>

    <p>Ovi kolačići prikupljaju informacije o tome kako posetioci koriste veb stranicu, na primer koje stranice posećuju najčešće i da li dobijaju greške. Takođe omogućavaju brojače posetilaca, što nam pomaže da poboljšamo funkcionisanje veb stranice.</p>

    <p><strong>Reklama</strong></p>

    <p>Ovi kolačići se koriste za prikazivanje relevantnih oglasa i merenje njihove efikasnosti. Reklamni kolačići su obično trećih lica i mogu biti prisutni čak i ako na veb stranici nema reklama.</p>

    <p><strong>IP adrese</strong></p>

    <p>Pri poseti veb stranice možemo prikupiti vašu IP adresu za dobijanje neosobnih podataka, na primer za praćenje geografskih lokacija korisnika.</p>

    <p><strong>KAKO UPRAVLJATI KOLAČIĆIMA</strong></p>

    <p>Kliknite na link „Upravljaj kolačićima“ na dnu stranice da se prijavite ili odjavite putem našeg menadžera pristanka za kolačiće. Napomena: neophodne kolačiće nije moguće onemogućiti, pa stranice koje koriste samo ove kolačiće možda neće prikazati ovu opciju.</p>

    <p>Neki kolačići se takođe mogu onemogućiti preko podešavanja pregledača. Pogledajte pomoć svog pregledača za više informacija.</p>

    <p><strong>OBAVEŠTENJE O KOLAČIĆIMA NE ODNOSI SE NA VEB STRANE TREĆIH LICA</strong></p>

    <p>Kada uključimo linkove do drugih veb stranica, imajte na umu da imaju svoje politike privatnosti i kolačića koje regulišu upotrebu svih informacija koje pošaljete. Preporučujemo da pročitate njihove politike jer nismo odgovorni za njihove prakse.</p>

    <p><strong>IZMENE OBAVEŠTENJA O KOLAČIĆIMA</strong></p>

    <p>Ove politike možemo povremeno ažurirati. Preporučujemo da ih redovno pregledate kako biste bili obavešteni o korišćenju kolačića. Datum stupanja na snagu politike je naveden na vrhu stranice.</p>

    <p><strong>OPIS KORIŠĆENIH KOLAČIĆA</strong></p>

    <p>Kliknite na link „Upravljaj kolačićima“ u podnožju veb stranice da biste videli detalje o pojedinačnim kolačićima koji se koriste. Ovaj link možda nije uvek dostupan, na primer ako veb stranica koristi samo neophodne kolačiće.</p>

    <p><strong>KONTAKTIRAJTE NAS</strong></p>

    <p>Ako imate bilo kakva pitanja u vezi ovog obaveštenja o kolačićima, kontaktirajte nas kao što je navedeno u našem obaveštenju o privatnosti.</p>
