    troubleshooting_guide_browser_first: 'Користите подржани прегледач: Chrome, Firefox, Edge или Safari (најновије верзије)'
    troubleshooting_guide_browser_fourth: Омогућите JavaScript и колачиће у подешавањима прегледача
    troubleshooting_guide_browser_second: Очистите кеш и колачиће у прегледачу
    troubleshooting_guide_browser_sixth: 'Покушајте да користите инкогнито/приватни режим прегледања (Напомена: LocalStorage може имати ограничену или никакву подршку у инкогнито/приватном режиму)'
    troubleshooting_guide_browser_third: Онемогућите екстензије прегледача које би могле да ометају приступ медијима.
    troubleshooting_guide_network_fifth: Ако проблем и даље траје, обратите се свом интернет провајдеру за додатну помоћ.
    troubleshooting_guide_network_first: Затворите друге апликације које можда користе пропусни опсег (стримовање видео записа, преузимања итд.)
    troubleshooting_guide_network_fourth: Покушајте да користите другу мрежну везу ако је доступна.
    troubleshooting_guide_network_second: Приближите се свом Wi-Fi рутеру или се повежите преко Ethernet кабла.
    troubleshooting_guide_network_third: Поново покрените рутер/модем и покушајте поново.
    troubleshooting_guide_video_fifth: 'На Windows-у: проверите подешавања приватности > приступ камери/микрофону'
    troubleshooting_guide_video_first: Кликните на икону закључања/информација у адресној траци вашег прегледача.
    troubleshooting_guide_video_second: Пронађите подешавања за "Камеру" и "Микрофон" и подесите их на "Дозволи".
    troubleshooting_guide_video_seventh: Ako su dozvole omogućene i došlo je do problema pri otpremanju, ponovo pokrenite proveru i pokušajte ponovo da otpremite video.
    troubleshooting_guide_video_sixth: 'На Мацу: Погледајте Подешавања система > Безбедност и приватност > Камера/Микрофон'
    troubleshooting_guide_video_third: Освежите страницу након промене дозвола
