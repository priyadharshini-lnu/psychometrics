          collaboration: "<strong>20%</strong>Collaborative <br /> Leren"
          job: "<strong>70%</strong>Leren <br />op het werk"
          learn: "<strong>10%</strong>Formeel leren"
        content:
          list:
            r1: Houd er rekening mee dat deze lijst slechts indicatief is en dat er aanvullende ontwikkelingspaden voor u kunnen worden overwogen op basis van individuele ambities, aanbevelingen van uw manager en zakelijke prioriteiten van de organisatie.
            r2: Gebruikers worden aangemoedigd om alle inhoud kritisch te bekijken en zijn vrij om acties of aanbevelingen waarmee zij het niet eens zijn, te wijzigen, te verfijnen, te vervangen of aan te vullen.
            r3: 'De ontwikkelingsinputs in dit rapport kunnen afkomstig zijn uit een of beide van de volgende bronnen:'
            r3a: Een op maat gemaakte ontwikkelingsbibliotheek voor uw organisatie
            r3b: Door AI gegenereerde ontwikkelingsvoorstellen
            r4: Dit IDP-rapport is opgesteld met behulp van AI-technologie en kan onnauwkeurigheden bevatten. De verstrekte inzichten en aanbevelingen dienen met de nodige voorzichtigheid te worden geïnterpreteerd en mogen uitsluitend worden gebruikt als hulpmiddel voor uw persoonlijke en professionele ontwikkeling. Het rapport is 12 tot 18 maanden geldig.
          main: Het opgestelde IDP bevat een gedetailleerde lijst met ontwikkelingsacties die u kunt ondernemen, rekening houdend met best practices op het gebied van leren, d.w.z. de 70-20-10-richtlijn, die een progressief traject biedt waarin klassikaal leren, coaching en leren op de werkplek worden gecombineerd. Op basis van de resultaten van het assessment center-proces, uw chatresponsen en externe rapporten, indien van toepassing, zijn mogelijke ontwikkelingspaden aanbevolen die in aanmerking kunnen worden genomen voor uw ontwikkeling.
        learn_cards:
          collaboration:
            list:
            - Aanbod om anderen te coachen of te begeleiden
            - Verzoek om begeleiding door een expert in uw vakgebied
            - Zoek een coach om je ontwikkeling te ondersteunen
            - Een samenwerkingsgroep oprichten om de huidige uitdagingen in het bedrijf te bespreken
            - Vraag anderen formeel en informeel om feedback.
            - Speel een actieve rol in brancheorganisaties en netwerken
            - Bouw uw eigen externe netwerken
            title: Samenwerkend leren (20%) <br/> Ontwikkelen door anderen
          job:
            list:
            - Leidinggevende functies bekleden in commissies van belanghebbenden of het management
            - Vrijwilliger om veranderingsmanagementprojecten voor de organisatie te leiden
            - Overweeg om rekoefeningen te doen
            - Samenwerken met andere functies
            - Overweeg om projecten buiten uw organisatie te leiden
            - Werk nauw samen met externe experts uit de sector aan gezamenlijke projecten.
            title: Leren op de werkplek (70%) <br/> Ontwikkelen door ervaring
          learn:
            list:
            - Neem deel aan gestructureerde trainingsprogramma's
            - Volledige online e-learningcursussen
            - Lees boeken, artikelen, publicaties
            - Behaal professionele kwalificaties, certificeringen en accreditaties
            - Cursussen, workshops en seminars bijwonen
            title: Formeel leren (10%) <br/> Ontwikkelen door gestructureerd leren
