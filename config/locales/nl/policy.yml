  privacy_policy:
    v4: |-
      Versie 4.0

      Bijgewerkt op: 29 mei 2025

      Om uw deelname aan deze activiteit zinvol te laten zijn, zullen sommige van uw persoonlijke gegevens worden verzameld en verwerkt.
      De activiteit wordt beheerd door Mercer Talent Enterprise namens en in opdracht van onze klant, die bepaalt wat het doel is van de verwerking van uw persoonlijke gegevens en hoe we deze kunnen gebruiken. Houd er rekening mee dat uw gegevens grensoverschrijdend kunnen worden overgedragen als onderdeel van de dienstverlening aan onze klanten. In een dergelijk geval treden wij op als de Gegevensimporteur en onze klant als de Gegevensexporteur. Elke internationale overdracht van persoonlijke gegevens zal worden uitgevoerd in overeenstemming met de toepasselijke wetgeving inzake gegevensbescherming.

      Voor meer informatie over hoe wij uw persoonlijke gegevens verwerken, klikt u hier om onze wereldwijde privacyverklaring te lezen: [GLOBAL_PRIVACY_LINK].

      Voor informatie over hoe onze klant uw persoonlijke gegevens verwerkt, kunt u hun privacyverklaring lezen: [CLIENT_PRIVACY_LINK].
