        <h2>BEWAREN VAN UW INFORMATIE</h2>
        <p>
          Onze producten, diensten en wettelijke verplichtingen zijn complex en daarom variëren onze bewaartermijnen voor persoonlijke gegevens.  Wij houden rekening met de volgende verplichtingen bij het vaststellen van bewaartermijnen voor Persoonsgegevens en de dossiers die wij bijhouden:
        </p>
        <ul>
          <li>
            de noodzaak om informatie te bewaren voor de zakelijke doeleinden of contractuele verplichtingen waarvoor de informatie is verzameld;
          </li>
          <li>
            onze taken om de instructies van onze klanten uit te voeren met betrekking tot Persoonsgegevens die wij namens hen verwerken;
          </li>
          <li>
            onze plichten om te voldoen aan verplichte wettelijke en regelgevende vereisten voor het bijhouden van gegevens;
          </li>
          <li>
            onze procedures voor back-up en noodherstel; en
          </li>
          <li>
            andere juridische gevolgen, zoals de toepasselijke verjaringstermijnen.
          </li>
        </ul>
        <p>
          Op basis van bovenstaande factoren kunnen we Persoonlijke Gegevens langer bewaren dan de periode waarin we diensten aan u verlenen. Wanneer we Persoonlijke Informatie niet langer hoeven te bewaren, vereist ons bedrijfsbeleid dat we de informatie ofwel anonimiseren of samenvoegen (in welk geval we de anoniem gemaakte of samengevoegde informatie verder kunnen bewaren en gebruiken voor analysedoeleinden) of veilig vernietigen.
        </p>
        <h2>VRAGEN OF ZORGEN</h2>
        <p>
          Voor vragen of verzoeken met betrekking tot deze Privacykennisgeving of de privacypraktijken van MTE kunt u een e-mail sturen naar <a href="mailto:privacy@mmc.com">privacy@mmc.com</a>. Als u liever per post of per telefoon contact met ons opneemt, neem dan contact op met uw lokale functionaris voor gegevensbescherming. U kunt de contactgegevens van uw lokale functionaris voor gegevensbescherming opvragen door contact met ons op te nemen via
          <a href="mailto:privacy@mmc.com">privacy@mmc.com</a>.
        </p>
