        <h2>STAPPEN DIE WE ONDERNEMEN OM PERSOONLIJKE INFORMATIE TE BESCHERMEN </h2>
        <p>
          Ons bedrijf streeft ernaar te voldoen aan alle toepasselijke wetten op het gebied van cyberbeveiliging en gegevensbescherming. Met deze doelen voor ogen heeft MMC een speciale Chief Information Security Officer (CISO) en een Global Chief Privacy Officer (GCPO). De CISO is verantwoordelijk voor het beheer van een wereldwijd informatiebeveiligingsteam en een uitgebreid cyberbeveiligingsprogramma.  Als onderdeel van ons cyberbeveiligingsprogramma hebben we commercieel redelijke fysieke, administratieve en technische beveiligingen geïmplementeerd om Persoonsgegevens te beschermen tegen ongeautoriseerde toegang, gebruik, wijziging en verwijdering.
        </p>
        <p>
          De GCPO leidt en houdt toezicht op een Privacy Center of Excellence en een Data Protection Officer Network die verantwoordelijk zijn voor de implementatie van ons uitgebreide wereldwijde privacyprogramma. Het Data Protection Officer Network verbindt onze Data Protection Officers over de hele wereld en streeft naar een consistente en grondige implementatie van ons privacyprogramma overal waar we gegevens verwerken. U kunt de naam en contactgegevens van de functionaris voor gegevensbescherming in uw rechtsgebied opvragen door contact met ons op te nemen via <a href="mailto:privacy@mmc.com">privacy@mmc.com</a>.
        </p>
        <h2>UW RECHTEN OP HET GEBIED VAN GEGEVENSBESCHERMING  </h2>
        <p>
          In veel gevallen verwerken we Persoonsgegevens om onze diensten aan zakelijke klanten te kunnen leveren, en u dient contact met hen op te nemen om uw rechten uit te oefenen op grond van de toepasselijke privacywetgeving. Wanneer wij echter optreden als de controller of het bedrijf dat primair verantwoordelijk is voor het beslissen hoe uw gegevens worden verwerkt,kunt u enkele of alle rechten hebben die hieronder worden genoemd, afhankelijk van het rechtsgebied en onze reden voor het verwerken van uw gegevens.   Houd er rekening mee dat we uw Persoonlijke Gegevens mogelijk moeten gebruiken om uw identiteit te verifiëren voordat we reageren op een van de onderstaande rechten.
        </p>
        <ul>
          <li>
            <strong>Recht op toegang (recht om te weten) <br /></strong>
            U kunt ons vragen om u meer informatie te geven over hoe wij uw Persoonlijke Gegevens gebruiken, de bronnen, de categorieën of specifieke onderdelen van Persoonlijke Gegevens die wij hebben verzameld, de categorieën van derden aan wie wij de informatie hebben verstrekt en om een kopie op te vragen van de Persoonlijke Gegevens die wij over u bewaren.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Recht op correctie <br /></strong>
            U kunt ons vragen onnauwkeurigheden bij te werken in de Persoonlijke Gegevens die wij bewaren. Als wij uw Persoonlijke Gegevens aan anderen verstrekken, zullen wij hen waar mogelijk op de hoogte stellen van de correctie.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Recht om te verwijderen <br /></strong>
            U kunt ons vragen om uw Persoonsgegevens te wissen wanneer wij niet langer wettelijke gronden hebben om deze te verwerken.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Recht op bezwaar tegen of beperking van de verwerking <br /></strong>
            U kunt het recht hebben om de verwerking van uw Persoonsgegevens in bepaalde omstandigheden te beperken, bijvoorbeeld wanneer u de juistheid ervan betwist.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Recht op gegevensoverdraagbaarheid <br /></strong>
            U kunt het recht hebben om, waar dit technisch haalbaar is, te vragen dat wij een kopie van Persoonsgegevens die wij van u hebben verkregen, in een gestructureerd, algemeen gebruikt en machineleesbaar formaat overdragen aan een derde partij van uw keuze.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Recht om toestemming in te trekken <br /></strong>
            Als wij ons baseren op uw toestemming als rechtsgrondslag voor de verwerking van uw Persoonsgegevens, hebt u het recht om die toestemming in te trekken.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Recht om een klacht in te dienen<br /></strong>
            U kunt het recht hebben om een klacht in te dienen bij de relevante toezichthoudende of regelgevende instantie in uw rechtsgebied als u zich zorgen maakt over een aspect van onze privacypraktijken.
          </li>
        </ul>
        <p>
          Als u een van de bovenstaande rechten wilt uitoefenen of herziening van een beslissing of weigering wilt aanvragen, neem dan contact met ons op via de toepasselijke contactgegevens:
        </p>
        <ul>
          <li>
            Als u zich in het Verenigd Koninkrijk, Zwitserland of de Europese Economische Ruimte bevindt, gelieve
            <a
              href="https://mmc-dev-privacy.my.onetrust.com/webform/4da460d1-7bcf-4ff1-ac37-c4b804769467/draft/ea953d72-fded-42ee-b1dd-c0a5a83b7891"
              >danin te vullen.</a
            >
          </li>
          <li>
            Voor personen in andere landen, gelieve
            <a
              href="https://privacyportal.onetrust.com/webform/ee9df2bb-0ef3-4485-bc63-4db420e77359/225910f5-5666-468a-b1e7-39c70e24f4cc"
              >in te vullen</a
            >
          </li>
          <li>
            U kunt ons ook e-mailen op <a href="mailto:privacy@mmc.com">privacy@mmc.com</a>
          </li>
        </ul>
        <p>
          Afhankelijk van je land kun je ook enkele of alle van de volgende rechten hebben:
        </p>
        <ul>
          <li>
            <strong>
              Recht om in of uit te kiezen voor verkoop of delen voor contextoverschrijdende reclame   <br />
            </strong>
            Als u een van onze websites bezoekt, kunnen we uw internet- of andere elektronische netwerkactiviteiten, biografische identificatoren, geolocatiegegevens en professionele informatie (voor zover deze kan worden afgeleid uit uw activiteit op onze website) bekendmaken aan aanbieders van website-analyses en reclame voor contextoverschrijdende gedrags- of gerichte reclamedoeleinden met behulp van reclamecookies.  Onder sommige wetten hebt u het recht om u aan of af te melden voor dit soort openbaarmakingen.  Om uw selectie(s) te maken of de namen te bekijken van specifieke derde partijen waarmee we uw informatie hebben verkocht of gedeeld, klikt u op de link "Cookies beheren" onderaan onze webpagina. Als u de verkoop of het delen van uw gegevens wilt uitschakelen, moet u ervoor zorgen dat de schakeltoetsen voor "Reclame" en "Analytics"-trackers zijn ingesteld op "Nee" of, indien beschikbaar, de schakeltoets Niet verkopen of delen van mijn persoonlijke gegevens inschakelen.
            <p>
              U kunt ook een browserinstelling of -extensie implementeren om uw voorkeuren voor verkopen en delen automatisch door te geven aan de websites die u bezoekt.  Onze websites verwerken dergelijke "opt-out voorkeursignalen" op een wrijvingsloze manier door de Global Privacy Control (GPC) te herkennen. Als je GPC wilt gebruiken, kun je het downloaden en inschakelen via een deelnemende browser of browserextensie. Meer informatie over het downloaden van GPC is beschikbaar <a href="https://globalprivacycontrol.org/">hier</a>.&nbsp;
            </p>
          </li>
        </ul>
        <ul>
          <li>
            <strong>
              Rechten met betrekking tot geautomatiseerde besluitvorming en profilering
            <br /></strong>
            Voor zover wij uw Persoonsgegevens geautomatiseerd verwerken, zullen wij u vooraf alle kennisgevingen doen toekomen, inclusief over uw rechten, die wettelijk verplicht zijn.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Directe marketing en Do Not Track-signalen<br /></strong>
            U kunt het recht hebben om eenmaal per jaar een kennisgeving te vragen en te ontvangen over de Persoonsgegevens die wij aan andere bedrijven hebben verstrekt voor hun eigen direct-marketingdoeleinden, voor zover dit wettelijk is toegestaan.  Indien van toepassing bevat een dergelijke kennisgeving een lijst van de categorieën Persoonsgegevens die zijn bekendgemaakt (indien van toepassing) en de namen en adressen van alle derden aan wie de Persoonsgegevens zijn bekendgemaakt (indien van toepassing).  De kennisgeving heeft betrekking op het voorgaande kalenderjaar.  U kunt contact met ons opnemen zoals hieronder aangegeven als u wilt weten of dit recht op u van toepassing is en, zo ja, dit recht wilt uitoefenen.
          </li>
        </ul>
        <p>
          Houd er rekening mee dat sommige van deze rechten kunnen worden beperkt wanneer we een hoger legitiem belang ofeen  wettelijke, reglementaire of contractuele verplichting hebben om de Persoonsgegevens te blijven verwerken, of wanneer de Persoonsgegevens onder de toepasselijke wetgeving kunnen worden vrijgesteld van openbaarmaking of wissing.  Sommige van deze rechten kunnen alleen in bepaalde omstandigheden worden uitgeoefend of kunnen anderszins worden beperkt door de wetgeving inzake gegevensbescherming in uw rechtsgebied.
        </p>
        <h2>GRENSOVERSCHRIJDENDE OVERMAKINGEN</h2>
        <p>
          Als wereldwijd bedrijf dat actief is in meer dan 80 landen, zijn er omstandigheden waarin we Persoonsgegevens moeten overdragen buiten het land, de provincie of het territorium waarin ze werden verzameld voor de doeleinden die in dit Privacybeleid worden beschreven. In het bijzonder kunnen we gegevens overdragen om de Diensten die aan u worden geleverd, aan te bieden, te beheren en om de efficiëntie van onze bedrijfsvoering te verbeteren. We zullen er alles aan doen om ervoor te zorgen dat deze overdrachten voldoen aan alle relevante wetgeving op het gebied van gegevensbescherming en dat de rechten en vrijheden van personen onder deze wetgeving op passende wijze worden gewaarborgd.
        </p>
        <p>
          Wanneer de noodzaak voor een dergelijke overdracht zich voordoet, zullen wij stappen ondernemen om ervoor te zorgen dat er passende waarborgen zijn om Persoonsgegevens te beschermen, zoals een effectbeoordeling, een adequaatheidsbesluit van de juiste toezichthoudende autoriteit, het gebruik van goedgekeurde bindende bedrijfsregels of standaard contractuele clausules, of uw toestemming.
        </p>
        <p>
          Klik voor informatie over de werking van de bindende bedrijfsvoorschriften (BCR's) van MMC voor de EU (Europese Unie)
          <a
            href="https://www.marshmclennan.com/content/dam/mmc-web/Archive/Images/Files/02March2022-EUBCR-Controller-and-Processor-Principles.pdf"
            >hier</a
          >.&nbsp; Klik voor een lijst met entiteiten die ermee hebben ingestemd gebonden te zijn aan de BCR's van de EU
          <a href="https://www.marshmclennan.com/privacy-statement/bcr-entities.html"
            >hier</a
          >.&nbsp;
        </p>
        <p>
          Voor informatie over de werking van MMC's UK Binding Corporate Rules (UK BCR's), klik
          <a
            href="https://www.marshmclennan.com/content/dam/mmc-web/Archive/Images/Files/02March2022-UKBCR-Controller-and-Processor-Principles.pdf"
            >hier</a
          >.&nbsp; Voor een lijst van entiteiten die ermee hebben ingestemd gebonden te zijn aan de UK BCR's, klik
          <a
