    <h2>
      Cookie-verklaring
    </h2>

    <p>Ingangsdatum: 14 december 2023</p>
    <p>We gebruiken cookies en gerelateerde trackingtechnologieën, waaronder webbakens, trackingpixels en logbestanden (gezamenlijk "cookies" genoemd) op deze website om u te onderscheiden van andere gebruikers, om de functionaliteit van de website en onze diensten te beoordelen en te verbeteren en om u een goede ervaring te bieden.</p>

    <p><strong>WAT IS EEN COOKIE</strong></p>
    <p>Cookies zijn stukken informatie die tussen uw webbrowser en een website worden gedeeld. Sommige cookies zijn noodzakelijk om een website te laten werken. Sommige helpen ons de werking van de website te beoordelen en te verbeteren. We gebruiken ook cookies om ons te helpen u relevante inhoud, producten en diensten te leveren. Een cookie kan geen data lezen van de harde schijf van een computer.</p>

    <p><strong>Er zijn verschillende soorten cookies met verschillende functies:</strong></p>
    <p>(i)<strong> Sessie-cookies: </strong>die worden alleen opgeslagen op uw computer gedurende uw website-sessie. Ze worden automatisch geannuleerd als de browser wordt gesloten. Ze slaan doorgaans een anonieme ID op, die u in staat stelt door een website te bladeren zonder dat u voor iedere pagina hoeft in te loggen. Ze hoeven geen informatie van uw computer te verzamelen.</p>
    <p>(ii)<strong> Permanente cookies: </strong>een permanente cookie wordt als een bestand opgeslagen op uw computer en blijft daar als u uw webbrowser sluit. De cookie kan gelezen worden door de website die de cookie heeft aangemaakt, als u de website opnieuw bezoekt.</p>
    <p>(iii)<strong> First-party cookies: </strong>deze cookies worden aangemaakt door ons bedrijf. Ze worden opgeslagen en heen en weer gestuurd tussen onze servers en de harde schijf van uw computer. Deze cookies kunnen ofwel sessie-cookies of permanente cookies zijn.</p>
    <p>(iv)<strong> Cookies van derden: </strong>deze cookies worden aangemaakt door een van onze externe partners. Ze worden opgeslagen en heen en weer gestuurd tussen de server van de derde partij en de harde schijf van uw computer. Deze cookies zijn doorgaans permanente cookies.</p>

    <p><strong>HOE EN WAAROM WE COOKIES GEBRUIKEN</strong></p>
    <p>Afhankelijk van de website kunnen we cookies gebruiken voor de volgende doeleinden:</p>

    <p><strong>Waar strikt noodzakelijk</strong></p>
    <p>Deze cookies zijn essentieel om u in staat te stellen u binnen de website te verplaatsen en de functies ervan te gebruiken, zoals toegang krijgen tot beveiligde gebieden van de website. Zonder deze cookies kunnen diensten die u heeft aangevraagd, zoals het verkrijgen van een offerte of het inloggen op uw account, niet worden geleverd. Deze cookies verzamelen geen informatie over u die kan worden gebruikt voor marketing, en ze onthouden niet waar u op internet bent geweest.</p>

    <p><strong>Functionaliteit</strong></p>
    <p>Deze cookies stellen onze website in staat keuzes die u heeft gemaakt te onthouden (zoals uw gebruikersnaam, taal of de regio waarin u zich bevindt) en verbeterde kenmerken te leveren. Bijvoorbeeld: een website kan in staat zijn uw inloggegevens te onthouden, zodat u niet herhaaldelijk hoeft in te loggen op uw account wanneer u een bepaald apparaat gebruikt om toegang te krijgen tot onze website. Deze cookies kunnen ook worden gebruikt om wijzigingen te onthouden die u heeft aangebracht in tekstgrootte, achtergrond en andere delen van internetpagina’s die u kunt personaliseren. Ze kunnen ook worden gebruikt om door u gevraagde diensten te leveren, zoals het bekijken van een video of becommentariëren van een artikel. De informatie die deze cookies verzamelen is doorgaans geanonimiseerd. Ze verzamelen geen informatie over u die kan worden gebruikt voor advertenties, en ze onthouden niet waar u op internet bent geweest.</p>

    <p><strong>Analyse</strong></p>
    <p>Deze cookies verzamelen informatie over hoe bezoekers een website gebruiken. Bijvoorbeeld welke pagina’s bezoekers het meest bezoeken en of ze foutmeldingen krijgen van websitepagina’s. Ze stellen ons ook in staat het aantal bezoekers van de website vast te leggen en te tellen, waardoor we in staat zijn te zien hoe bezoekers de website gebruiken en vervolgens de manier waarop de website werkt kunnen verbeteren.</p>

    <p><strong>Advertenties</strong></p>
    <p>Deze cookies worden gebruikt om advertenties weer te geven die voor u relevant zijn en voor het beheren van de prestaties van advertenties. Advertentie-cookies zijn doorgaans derde partij cookies en kunnen ook aanwezig zijn wanneer er niet sprake is van advertenties op de website.</p>

    <p><strong>IP-adressen</strong></p>
    <p>Als u onze website bezoekt, kunnen we uw internetprotocol (“IP”)-adressen verzamelen om niet-persoonlijke informatie samen te voegen. We kunnen bijvoorbeeld IP-adressen gebruiken om de regio's te controleren van waaruit gebruikers op de website navigeren.</p>

    <p><strong>HOE U COOKIES KUNT BEHEREN</strong></p>
    <p>Klik op de link “Cookies beheren” onderaan de pagina om u in of uit te schrijven voor bepaalde cookies met gebruikmaking van onze Cookie Consent Manager. Houd er rekening mee dat het niet mogelijk is om strikt noodzakelijke cookies uit te schakelen, dus websites die alleen dergelijke cookies gebruiken, bieden deze link mogelijk niet aan.</p>
    <p>U kunt bepaalde cookies ook uitschakelen via browserinstellingen. Bezoek de ‘Help’-sectie van uw browser voor meer informatie over het beheren van uw cookie-instellingen.</p>

    <p><strong>DE COOKIE-VERKLARING BETREFT NIET DE WEBSITES VAN DERDEN</strong></p>
    <p>We maken u erop attent dat wanneer we links naar andere websites verstrekken, deze websites hun eigen privacy- en cookiebeleid hebben voor het gebruik van door u verstrekte informatie. We raden u aan hun beleid te lezen, omdat we geen verantwoordelijkheid dragen en niet aansprakelijk kunnen worden gesteld voor hun privacypraktijken.</p>

    <p><strong>WIJZIGINGEN IN DE COOKIE-VERKLARING</strong></p>
    <p>We kunnen dit beleid nu en dan bijwerken en we raden u aan het beleid van tijd tot tijd door te nemen om op de hoogte te blijven hoe we cookies gebruiken. We publiceren de ingangsdatum van het beleid bovenaan de pagina.</p>

    <p><strong>BESCHRIJVING VAN GEBRUIKTE COOKIES</strong></p>
    <p>Klik op de link "Cookies beheren" in de voettekst van de website voor details over de afzonderlijke cookies die op de website worden gebruikt. In sommige gevallen is deze link niet beschikbaar, bijvoorbeeld wanneer we alleen strikt noodzakelijke cookies gebruiken.</p>

    <p><strong>CONTACT MET ONS OPNEMEN</strong></p>
    <p>Als u vragen heeft over deze Cookie-verklaring, neem dan contact met ons op zoals aangegeven in onze Privacyverklaring waarnaar hieronder wordt verwezen.</p>
