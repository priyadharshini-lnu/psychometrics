    insights_reports: Poznatky a správy
    instruction_modal:
      campaign_start_final_instructions: "<p>upozorňujeme, že časovač nie je možné zastaviť ani pozastaviť. Časovač kampane bude bežať aj po zatvorení prehliadača, takže v žiadnom prípade by ste nemali uvažovať o tom, že medzi úlohami odídete a budete robiť niečo iné. Uistite sa, že počas úloh minimalizujete rozptyľovanie. Nájdite si tiché prostredie, vypnite oznámenia na svojich zariadeniach a vyhýbajte sa multitaskingu. Zachovajte si koncentráciu a zostaňte sústredení. Keď časovač kampane vyprší, nebudete môcť pokračovať. Ak ste si prečítali vyššie uvedené pokyny, kliknite na tlačidlo Spustiť a pokračujte v pridelených úlohách</p>\n"
      campaign_start_instruction: |
        <h4>Riadne si prečítajte nasledujúce pokyny.</h4>
        <p>úlohy, ktoré sa chystáte začať, sú časovo obmedzené. Po kliknutí na tlačidlo "Spustiť" sa automaticky spustí časovač kampane. Na dokončenie všetkých aktivít máte %{minutes} minút. Snažte sa dokončiť úlohy v určenom časovom rámci a efektívne hospodáriť s časom, aby ste sa vyhli uponáhľanému procesu hodnotenia. Uistite sa, že ste úlohy dokončili v jednom kroku, takže ak si potrebujete urobiť prestávku, Teraz je ten správny čas</p>
      common_proctoring_instructions: |
        <h4>Proctoring</h4>
        <p>po kliknutí na tlačidlo Spustiť budete presmerovaní na náš proktorovací systém. Ten bude počas relácie monitorovať vašu kameru, mikrofón a obrazovku. Tieto relácie automaticky proktorova náš sofistikovaný systém umelej inteligencie, ktorý poskytuje neprerušovaný a plynulý používateľský zážitok. Relácie však môžu skontrolovať aj ľudskí proktori. Akékoľvek známky nesprávneho správania alebo nezrovnalostí budú označené. Robí sa to preto, aby sa zabezpečilo, že nedôjde k žiadnym pokusom o podvádzanie. Ak sa nájde podozrenie, vaša úloha (úlohy) sa zruší</p>
      lockdown_browser_instruction: |
        <h4>Prehliadač proktorovania</h4>
        <p>na vykonanie proktorovaných úloh si budete musieť stiahnuť a nainštalovať špeciálny prehliadač. Postupujte podľa pokynov na nasledujúcej obrazovke. Po dokončení všetkých požadovaných činností ho môžete odinštalovať</p>
