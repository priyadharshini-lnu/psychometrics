      guidelines:
        cards:
          c1:
            content: Zahrňte zručnosti, vedomosti a schopnosti, ktoré je potrebné rozvíjať. Uistite sa, že sú konkrétne, merateľné, dosiahnuteľné, realistické a primerane možné ich dosiahnuť v uvedených časových harmonogramoch.
            title: Rozvojové ciele
          c2:
            content: Tá je založená na kompetencii, ktorá sa má rozvíjať na základe skúseností s hodnotením.
            title: Kompetencia
          c3:
            content: Táto časť obsahuje vaše rozvojové akcie založené na vzdelávacom modeli 70-20-10 uvedenom nižšie. Odporúča sa, aby ste si vybrali kombináciu každého z týchto troch prvkov, aby ste zabezpečili rôznorodý prístup k učeniu a rozvoju.
            title: Aktivita
          c4:
            content: Uistite sa, že vaše časové harmonogramy sú realistické na základe toho, kedy môže byť cieľ splnený. Upravte to podľa potreby.
            title: Časová os
          c5:
            content: Použite sekciu priebehu na podporu postupu na identifikovaných trasách.
            title: Pokrok
        chart:
          collaboration: "<strong>20%</strong>Spoluprácu <br /> Učenie"
          job: "<strong>70%</strong>Učenie <br />Na pracovisku"
          learn: "<strong>10%</strong>Formálne vzdelávanie"
        content:
          list:
            r1: Upozorňujeme, že tento zoznam je iba orientačný a na základe individuálnych ambícií, odporúčaní vášho nadriadeného, ako aj priorít organizácie môžu byť pre vás zvážené ďalšie možnosti rozvoja.
            r2: Používatelia sú vyzývaní, aby kriticky posudzovali celý obsah a môžu voľne upravovať, vylepšovať, nahrádzať alebo pridávať akékoľvek kroky alebo odporúčania, s ktorými nesúhlasia.
            r3: 'Údaje o vývoji uvedené v tejto správe môžu pochádzať z jedného alebo oboch nasledujúcich zdrojov:'
            r3a: Knižnica na mieru vytvorená pre vašu organizáciu
            r3b: Návrhy vývoja generované umelou inteligenciou
            r4: Táto správa IDP bola vygenerovaná s využitím technológie umelej inteligencie a môže obsahovať nepresnosti. Uvedené postrehy a odporúčania by ste mali vyhodnocovať s rozvahou a využívať ich výlučne ako nástroj pre váš osobný a profesionálny rozvoj. Platnosť správy je 12 až 18 mesiacov.
          main: Vytvorený IDP obsahuje podrobný zoznam rozvojových aktivít, ktoré môžete podniknúť, pričom sa zohľadňujú osvedčené postupy v oblasti vzdelávania, t. j. smernica 70-20-10, ktorá poskytuje postupný proces kombinujúci vzdelávanie v triede, koučing a vzdelávanie priamo na pracovisku. Na základe výsledkov procesu hodnotiaceho centra, vašich odpovedí v chate a externých správ, podľa potreby, boli odporučené možné cesty rozvoja, ktoré môžete zvážiť pre svoj rozvoj.
        learn_cards:
          collaboration:
            list:
            - Ponúknite koučovanie alebo mentorovanie iným
            - Požiadajte o mentorovanie odborníkom vo vašom odbore
            - Získajte kouča na podporu vášho rozvoja
            - Založte pracovnú skupinu na diskusiu o aktuálnych výzvach v podnikaní
            - Získavajte spätnú väzbu formálne aj neformálne od iných
            - Aktívne sa zapájajte do priemyselných združení a sietí
            - Budujte si vlastné externé siete
            title: Kolaboratívne učenie (20 %) <br/> Rozvoj prostredníctvom iných
          job:
            list:
            - Prevezmite vedúce pozície v komisiách alebo manažérskych výboroch
            - Dobrovoľne veďte projekty riadenia zmien pre organizáciu
            - Zvážte prijatie náročných úloh
            - Spolupracujte s inými oddeleniami
            - Veďte projekty mimo vašej organizácie
            - Spolupracujte s externými odborníkmi na spoločných projektoch
            title: Učenie sa v práci (70 %) <br/> Rozvoj prostredníctvom skúseností
          learn:
            list:
            - Zúčastnite sa štruktúrovaných vzdelávacích programov
            - Kompletné online e-learningové kurzy
            - Čítajte knihy, články, publikácie
            - Získajte odborné kvalifikácie, certifikáty a akreditácie
            - Účasť na kurzoch, workshopoch, seminároch
            title: Formálne vzdelávanie (10 %) <br/> Rozvoj prostredníctvom štruktúrovaného učenia
