    edit_evaluation:
      body: Upozorňujeme vás, že po kliknutí na tlačidlo Re-evaluate (Znovu hodnotiť) budete presmerovaní na začiatok prieskumu, kde môžete upraviť odpovede. Predchádzajúce odpovede budú stále k dispozícii, ale môžete ich zmeniť podľa svojho uváženia. Po úprave budete musieť hodnotenie znovu odoslať, aby ste proces dokončili.
