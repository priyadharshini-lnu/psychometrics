    <h2>Oznámenie o súboroch cookie</h2>

    <p>Dátum nadobudnutia účinnosti: 14. decembra 2023</p>

    <p>Na tejto webovej stránke používame súbory cookie a súvisiace sledovacie technológie vrátane webových majákov, sledovacích pixlov a súborov denníka (súhrnne označovaných ako súbory cookie) na odlíšenie vás od ostatných používateľov, posúdenie a zlepšenie funkčnosti webovej stránky a našich služieb a poskytovanie dobrých skúseností.</p>

    <p><strong>ČO JE SÚBOR COOKIE</strong></p>

    <p>Súbory cookie sú informácie zdieľané medzi vaším webovým prehliadačom a webovou stránkou. Niektoré súbory cookie sú potrebné na to, aby webová stránka fungovala. Niektoré nám pomáhajú posúdiť a zlepšiť jej výkon. Súbory cookie používame aj na to, aby sme vám pomohli poskytovať relevantný obsah, produkty a služby. Súbor cookie nedokáže načítať údaje z pevného disku vášho počítača.</p>

    <p><strong>Existujú rôzne druhy súborov cookie s rôznymi funkciami:</strong></p>

    <p><strong>(i) Súbory cookie relácie:</strong> tieto súbory cookie sú uložené vo vašom počítači iba počas vašej webovej relácie. Automaticky sa vymažú po zatvorení prehliadača. Obvykle ukladajú anonymné ID relácie, ktoré vám umožnia prehliadať webovú stránku bez toho, aby ste sa museli prihlásiť na každú stránku. Nezbierajú z vášho počítača žiadne informácie.</p>

    <p><strong>(ii) Trvalé súbory cookie:</strong> tieto súbory cookie sa ukladajú ako súbor vo vašom počítači a zostávajú tam, keď zatvoríte webový prehliadač. Webová stránka ich môže prečítať, keď znova navštívite webovú stránku.</p>

    <p><strong>(iii) Súbory cookie prvej strany:</strong> tieto súbory cookie vytvára naša spoločnosť. Ukladajú sa a posielajú medzi našimi servermi a pevným diskom vášho počítača. Tieto súbory cookie môžu byť buď súbory cookie relácie, alebo trvalé súbory cookie.</p>

    <p><strong>(iv) Súbory cookie tretích strán:</strong> tieto súbory cookie vytvára jeden z našich partnerov tretích strán. Ukladajú sa a posielajú medzi serverom tretej strany a pevným diskom vášho počítača. Tieto súbory cookie sú zvyčajne trvalé súbory cookie.</p>

    <p><strong>AKO A PREČO POUŽÍVAME SÚBORY COOKIE</strong></p>

    <p>V závislosti od webovej stránky môžeme súbory cookie používať na nasledujúce účely:</p>

    <p><strong>Kde je to nevyhnutne potrebné</strong></p>

    <p>Tieto súbory cookie sú nevyhnutné na to, aby ste sa mohli pohybovať po webovej stránke a používať jej funkcie, ako je prístup k zabezpečeným oblastiam webovej stránky. Bez týchto súborov cookie nie je možné poskytovať služby, o ktoré ste požiadali, ako napríklad získanie cenovej ponuky alebo prihlásenie sa do svojho účtu. Tieto súbory cookie nezískavajú informácie o vás, ktoré by sa mohli použiť na marketing alebo zapamätanie si toho, ktoré miesto ste na internete ste navštívili.</p>

    <p><strong>Funkčnosť</strong></p>

    <p>Tieto súbory cookie umožňujú našej webovej stránke zapamätať si vaše voľby (napríklad vaše používateľské meno, jazyk alebo región, v ktorom sa nachádzate) a poskytovať rozšírené funkcie. Napríklad webová stránka si môže zapamätať vaše prihlasovacie údaje, aby ste sa nemuseli opakovane prihlasovať do svojho účtu, keď používate konkrétne zariadenie na prístup na našu webovú stránku. Tieto súbory cookie možno použiť aj na zapamätanie zmien, ktoré ste urobili vo veľkosti textu, písma a iných častiach webových stránok, ktoré si môžete prispôsobiť. Môžu sa tiež použiť na poskytovanie služieb, o ktoré ste požiadali, ako napríklad prezeranie videa alebo komentovanie článku. Informácie, ktoré tieto súbory cookie získavajú, sú zvyčajne anonymizované. Nezískavajú o vás žiadne informácie, ktoré by sa mohli použiť na reklamu alebo si pamätajú, kde na internete sa pohybujete.</p>

    <p><strong>Analýza</strong></p>

    <p>Tieto súbory cookie získavajú informácie o tom, ako návštevníci používajú webovú stránku, napríklad ktoré stránky návštevníci navštevujú najčastejšie a či dostávajú chybové správy z webových stránok. Umožňujú nám tiež zaznamenávať a počítať počet návštevníkov webovej stránky, pričom všetky tieto údaje nám umožňujú vidieť, ako návštevníci používajú webovú stránku, aby sa zlepšil spôsob, akým naša webová stránka funguje.</p>

    <p><strong>Reklama</strong></p>

    <p>Tieto súbory cookie sa používajú na účely zobrazovania reklám, ktoré budú relevantné pre vás a na riadenie účinnosti reklám. Reklamné súbory cookie sú vo všeobecnosti súbory cookie tretích strán a môžu byť prítomné, aj keď na webovej stránke nie je žiadna reklama.</p>

    <p><strong>IP adresy</strong></p>

    <p>Keď navštívite našu webovú stránku, môžeme získavať vaše adresy internetového protokolu (ďalej len „IP“) na sledovanie a získavanie neosobných údajov. IP adresy môžeme napríklad použiť na monitorovanie oblastí, z ktorých sa používatelia pohybujú na webovej stránke.</p>

    <p><strong>AKO SPRAVOVAŤ SÚBORY COOKIE</strong></p>

    <p>Kliknutím na odkaz „Spravovať súbory cookie“ v dolnej časti stránky sa prihláste alebo odhláste pomocou nášho správcu súhlasu so súbormi cookie. Upozorňujeme, že nie je možné zakázať nevyhnutne potrebné súbory cookie, takže webové stránky, ktoré používajú iba takéto súbory cookie, nemusia poskytnúť tento odkaz.</p>

    <p>Niektoré súbory cookie môžete zakázať aj prostredníctvom nastavení prehliadača. Informácie o správe nastavení súborov cookie nájdete v časti „Help“ (Pomocník) svojho prehliadača.</p>

    <p><strong>OZNÁMENIE O SÚBOROCH COOKIE SA NEVZŤAHUJE NA WEBOVÉ STRÁNKY TRETÍCH STRÁN</strong></p>

    <p>Keď zahrnieme odkazy na iné webové stránky, nezabúdajte, že budú mať vlastné zásady ochrany osobných údajov a používania súborov cookie, ktoré budú riadiť používanie akýchkoľvek informácií, ktoré odošlete. Odporúčame, aby ste si prečítali ich zásady, pretože nie sme zodpovední za ich postupy ochrany osobných údajov.</p>

    <p><strong>ZMENY V OZNÁMENÍ O SÚBOROCH COOKIE</strong></p>

    <p>Tieto zásady môžeme príležitostne aktualizovať a odporúčame vám, aby ste si ich priebežne prečítali, aby ste boli informovaní o tom, ako používame súbory cookie. Dátum účinnosti zásad zverejňujeme v hornej časti stránky.</p>

    <p><strong>OPIS POUŽITÝCH SÚBOROV COOKIE</strong></p>

    <p>Kliknite na odkaz „spravovať súbory cookie“ v päte webovej stránky, aby ste našli podrobnosti o jednotlivých súboroch cookie používaných na webovej stránke. Tento odkaz nemusí byť v niektorých prípadoch k dispozícii. Napríklad, ak na webovej stránke používame iba nevyhnutne potrebné súbory cookie.</p>

    <p><strong>KONTAKTUJTE NÁS</strong></p>

    <p>Ak máte akékoľvek otázky týkajúce sa tohto oznámenia o súboroch cookie, obráťte sa na nás, ako je uvedené v našom oznámení o ochrane osobných údajov, ktorého prepojenie je uvedené nižšie.</p>
