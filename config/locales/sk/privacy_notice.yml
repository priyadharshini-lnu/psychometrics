            Môžete mať právo raz ročne požiadať o oznámenie o osobných údajoch, ktoré sme poskytli iným spoločnostiam na účely ich vlastného priameho marketingu, ak to zákon povoľuje. Ak je to relevantné, takéto oznámenie bude obsahovať zoznam kategórií osobných údajov, ktoré boli poskytnuté (ak nejaké existujú), a mená a adresy všetkých tretích strán, ktorým boli osobné údaje poskytnuté (ak nejaké existujú). Oznámenie sa bude vzťahovať na predchádzajúci kalendárny rok. Ak chcete zistiť, či sa na vás toto právo vzťahuje, môžete nás kontaktovať nižšie uvedenými spôsobmi, a ak áno, uplatniť si ho.
