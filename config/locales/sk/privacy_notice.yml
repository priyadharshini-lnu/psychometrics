        <h2>UCHOVÁVANIE VAŠICH INFORMÁCIÍ </h2>
        <p>
          Naše produkty, služby a regulačné povinnosti sú zložité, a preto sa naše doby uchovávania osobných údajov líšia. Pri stanovovaní doby uchovávania osobných údajov a záznamov, ktoré uchovávame, zohľadňujeme nasledujúce povinnosti:
        </p>
        <ul>
          <li>
            potreba uchovávať informácie na splnenie obchodných účelov alebo zmluvných záväzkov, na ktoré boli zhromaždené;
          </li>
          <li>
            naše povinnosti plniť pokyny našich klientov týkajúce sa osobných údajov, ktoré spracovávame v ich mene;
          </li>
          <li>
            naše povinnosti dodržiavať povinné zákonné a regulačné požiadavky na vedenie záznamov;
          </li>
          <li>
            naše postupy zálohovania a obnovy po havárii; a
          </li>
          <li>
            iné právne dôsledky, ako napríklad príslušné premlčacie lehoty.
          </li>
        </ul>
        <p>
          Na základe vyššie uvedených faktorov môžeme uchovávať osobné údaje aj po uplynutí doby, počas ktorej vám poskytujeme služby. Keď už osobné údaje nepotrebujeme uchovávať, naše firemné zásady vyžadujú, aby sme tieto informácie buď anonymizovali, alebo agregovali (v takom prípade môžeme anonymizované alebo agregované informácie ďalej uchovávať a používať na analytické účely), alebo ich bezpečne zničiť.
        </p>
