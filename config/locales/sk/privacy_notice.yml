        <h2>KROKY, KTORÉ PODNIKÁME NA OCHRANU OSOBNÝCH ÚDAJOV </h2>
        <p>
          Naša spoločnosť sa snaží dodržiavať všetky platné zákony o kybernetickej bezpečnosti a ochrane údajov. S ohľadom na tieto ciele má spoločnosť MMC vyhradeného riaditeľa pre informačnú bezpečnosť (CISO). a globálneho riaditeľa pre ochranu osobných údajov (GCPO). Vedúci oddelenia CISO je zodpovedný za riadenie globálneho tímu informačnej bezpečnosti a komplexného programu kybernetickej bezpečnosti. V rámci nášho programu kybernetickej bezpečnosti sme zaviedli komerčne primerané fyzické, administratívne a technické záruky na ochranu osobných údajov pred neoprávneným prístupom, použitím, zmenou a vymazaním.
        </p>
        <p>
          GCPO vedie a dohliada na Centrum excelentnosti v oblasti ochrany súkromia a sieť zodpovedných osôb pre ochranu údajov, ktoré sú zodpovedné za implementáciu nášho komplexného globálneho programu ochrany súkromia. Sieť zodpovedných osôb pre ochranu údajov spája našich zodpovedných osôb pre ochranu údajov na celom svete a snaží sa o konzistentnú a dôkladnú implementáciu nášho programu ochrany súkromia všade, kde spracovávame údaje. Meno a kontaktné informácie zodpovednej osoby pre ochranu údajov vo vašej jurisdikcii získate tak, že nás kontaktujete na adrese <a href="mailto:privacy@mmc.com">privacy@mmc.com</a>.
        </p>
        <h2>VAŠE PRÁVA NA OCHRANU ÚDAJOV </h2>
        <p>
          V mnohých prípadoch spracovávame osobné údaje s cieľom poskytovať naše služby firemným klientom a mali by ste ich kontaktovať, aby ste uplatnili akékoľvek práva, ktoré vám môžu pripadať podľa platných zákonov o ochrane osobných údajov. Ak však konáme ako prevádzkovateľ alebo spoločnosť, ktorá je primárne zodpovedná za rozhodovanie o tom, ako sa vaše informácie spracúvajú, môžete mať niektoré alebo všetky práva uvedené nižšie v závislosti od jurisdikcie a nášho dôvodu na spracovanie vašich informácií. Upozorňujeme, že pred uplatnením ktoréhokoľvek z nižšie uvedených práv môžeme potrebovať vaše osobné údaje na overenie vašej totožnosti.
        </p>
        <ul>
          <li>
            <strong>Právo na prístup (právo vedieť) <br /></strong>
            Môžete nás požiadať o poskytnutie ďalších podrobností o tom, ako používame vaše osobné údaje, o zdrojoch, kategóriách alebo konkrétnych osobných údajoch, ktoré sme zhromaždili, o kategóriách tretích strán, ktorým sme tieto informácie poskytli, a o vyžiadanie kópie osobných údajov, ktoré o vás uchovávame.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Právo na opravu <br /></strong>
            Môžete nás požiadať o aktualizáciu akýchkoľvek nepresností v osobných údajoch, ktoré uchovávame. Ak vaše osobné údaje poskytneme iným osobám, v prípade možnosti ich o oprave informujeme.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Právo na vymazanie <br /></strong>
            Môžete nás požiadať o vymazanie vašich osobných údajov, ak už nemáme zákonný dôvod na ich spracovanie.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Právo namietať proti spracovaniu alebo ho obmedziť <br /></strong>
            Za určitých okolností, napríklad ak spochybňujete ich presnosť, máte právo obmedziť spracovanie vašich osobných údajov.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Právo na prenosnosť údajov <br /></strong>
            Ak je to technicky uskutočniteľné, máte právo požiadať nás, aby sme tretej strane podľa vášho výberu preniesli kópiu osobných údajov, ktoré sme od vás získali, v štruktúrovanom, bežne používanom a strojovo čitateľnom formáte.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Právo na odvolanie súhlasu <br /></strong>
            Ak sa spoliehame na váš súhlas ako na právny základ pre spracovanie vašich osobných údajov, máte právo tento súhlas odvolať.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Právo podať sťažnosť<br /></strong>
            Ak máte obavy týkajúce sa akéhokoľvek aspektu našich postupov ochrany osobných údajov, máte právo podať sťažnosť príslušnému dozornému alebo regulačnému orgánu vo vašej jurisdikcii.
          </li>
        </ul>
        <p>
