        </ul>
        <p>
          Upozorňujeme, že niektoré z týchto práv môžu byť obmedzené, ak máme prevažujúci oprávnený záujem alebo zákonnú, regulačnú alebo zmluvnú povinnosť pokračovať v spracovaní osobných údajov, alebo ak môžu byť osobné údaje vyňaté zo zverejnenia alebo vymazania podľa platných právnych predpisov. Niektoré z týchto práv možno uplatniť len za určitých okolností alebo môžu byť inak obmedzené právnymi predpismi o ochrane údajov vo vašej jurisdikcii.
