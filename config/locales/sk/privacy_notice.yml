        <h2>CEZHRANIČNÉ PREVODY </h2>
        <p>
          Ako globálna spoločnosť pôsobiaca vo viac ako 80 krajinách existujú okolnosti, za ktorých budeme musieť preniesť osobné údaje mimo krajiny, provincie alebo územia, v ktorom boli zhromaždené, na účely uvedené v tomto oznámení o ochrane osobných údajov. Konkrétne môžeme preniesť údaje s cieľom ponúkať, spravovať a riadiť služby, ktoré vám poskytujeme, a zvýšiť efektívnosť našich obchodných operácií. Vynaložíme maximálne úsilie, aby sme zabezpečili, že tieto prenosy budú v súlade so všetkými príslušnými právnymi predpismi o ochrane údajov a že práva a slobody jednotlivcov podľa týchto zákonov budú primerane chránené.
        </p>
