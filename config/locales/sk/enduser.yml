    video_and_audio_recording: Nahrávanie videa a zvuku
    video_check_description: Toto je kontrola systému pred testom. Nahráte 30-sekundové video na otestovanie zvuku a obrazu. Prosím, hovorte nepretržite a nezastavujte sa, kým sa nahrávanie automaticky neskončí.
    video_check_fix_fifth: Ak máte externý fotoaparát, skúste ho odpojiť a znovu pripojiť
    video_check_fix_first: Keď vás prehliadač požiada o povolenie na používanie kamery, kliknite na „Povoliť“
    video_check_fix_fourth: Skontrolujte, či je vaša kamera pripojená a zapnutá
    video_check_fix_second: Prejdite do nastavení prehliadača a povolte tejto stránke prístup k kamere
    video_check_fix_sixth: Reštartujte prehliadač a skúste to znova
    video_check_fix_third: Zatvorte ostatné aplikácie, ktoré používajú kameru (Zoom, Teams atď.)
    video_overlay_label: Vyberte mikrofón a kameru, kliknite na tlačidlo Nahrávať a po stlačení tohto tlačidla prečítajte nasledujúcu správu
    video_overlay_message: Vyberte mikrofón a kameru, kliknite na tlačidlo Nahrávať a potom nahlas prečítajte a 3-krát zopakujte vetu, ktorá sa zobrazí v spodnej časti obrazovky.
    video_recorder_label: Videorekordér
    video_upload_failed_camera_access: Nie je možné získať prístup k vašej kamere alebo mikrofónu. Skontrolujte oprávnenia vášho zariadenia a skúste to znova.
    video_upload_failed_chunk_upload: Časť nahrávky sa nepodarilo nahrať. Skontrolujte si pripojenie k internetu a skúste to znova.
    video_upload_failed_finalize: Nahrávka bola zaznamenaná, ale nepodarilo sa ju uložiť. Skúste to prosím znova.
    video_upload_failed_no_recording: Nenašiel sa žiadny záznam na nahratie. Nahrajte ho prosím znovu.
    view_details: Zobraziť podrobnosti
    webgl_api_fix_description_first: Uistite sa, že váš prehliadač podporuje WebGL a že je táto funkcia v nastaveniach zapnutá
    webgl_api_fix_description_second: Aktualizujte ovládače grafickej karty na najnovšiu verziu
    webgl_api_fix_title: Váš prehliadač nepodporuje alebo nemá povolenú technológiu WebGL
    webgl_api_support: Podpora rozhrania WebGL API
    webgl_not_supported_detail: Používate prehliadač %{browser_name} vo verzii %{browser_version}, ktorý nepodporuje WebGL. Aktualizujte prosím prehliadač na najnovšiu verziu, aby ste zaistili kompatibilitu.
