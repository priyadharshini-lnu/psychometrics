      <h2>CONSERVAZIONE DEI SUOI DATI</h2>
      <p>
        I nostri prodotti, servizi e obblighi normativi sono complessi e pertanto i nostri periodi di conservazione dei Dati personali variano.  Consideriamo i seguenti obblighi quando impostiamo i periodi di conservazione dei dati personali e dei registri che conserviamo:
      </p>
      <ul>
        <li>
          la necessità di conservare le informazioni per raggiungere gli scopi commerciali o gli obblighi contrattuali per i quali sono state raccolte;
        </li>
        <li>
          i nostri doveri di eseguire le istruzioni dei nostri clienti in relazione ai Dati personali che trattiamo per loro conto;
        </li>
        <li>
          i nostri doveri di rispettare i requisiti legali e regolamentari obbligatori in materia di conservazione dei registri;
        </li>
        <li>le nostre procedure di backup e disaster recovery; e</li>
        <li>
          altri effetti giuridici quali i termini di prescrizione applicabili.
        </li>
      </ul>
      <p>
        In base ai fattori di cui sopra, potremmo conservare i Dati personali oltre il periodo per il quale Le forniamo servizi. Quando non è più necessario conservare i Dati personali, le nostre politiche aziendali richiedono che le informazioni vengano de-identificate o aggregate (nel qual caso potremmo ulteriormente conservare e utilizzare le informazioni de-identificate o aggregate a fini analitici) o distrutte in modo sicuro.
      </p>
