            >Diritto di acconsentire o rifiutare la vendita o la condivisione dei dati per la pubblicità trascontestuale
            <br /></strong
          >Se visita uno dei nostri siti web, potremmo divulgare le Sue informazioni sull'attività su Internet o su altre reti elettroniche, identificatori biografici, dati di geolocalizzazione e informazioni professionali (nella misura in cui possono essere derivate dalla Sua attività sul nostro sito web) a fornitori di servizi di analisi e pubblicità per scopi pubblicitari comportamentali o mirati in più contesti utilizzando cookie pubblicitari.  In base ad alcune leggi, Lei potrebbe avere il diritto di acconsentire o rifiutare questo tipo di divulgazione.  Per effettuare la/e selezione/i o per visualizzare i nomi di terze parti specifiche con cui abbiamo venduto o condiviso le Sue informazioni, clicchi sul collegamento "Gestisci cookie" nella parte inferiore della nostra pagina Web. Se desidera rinunciare alla vendita o alla condivisione delle Sue informazioni, si assicuri che i pulsanti per i tracker "Pubblicità" e "Analisi" siano impostati su "No" oppure, ove disponibile, abiliti il pulsante Non vendere o condividere le mie informazioni personali.
