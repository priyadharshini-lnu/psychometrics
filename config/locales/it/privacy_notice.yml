          <a href="https://www.marshmclennan.com/privacy-statement/bcr-entities.html"
            >qui</a
          >.&nbsp;
        </p>
        <p>
          Per informazioni sulle modalità di funzionamento delle Binding Corporate Rules (BCR) britanniche di MMC, fare clic su
          <a
            href="https://www.marshmclennan.com/web-assets/Archive/Images/Files/02March2022-UKBCR-Controller-and-Processor-Principles.pdf"
