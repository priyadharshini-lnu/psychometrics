      <h2>TRASFERIMENTI TRANSFRONTALIERI</h2>
      <p>
        In qualità di azienda globale operante in oltre 80 paesi, in alcune circostanze potremmo dover trasferire i Dati personali al di fuori del paese, della provincia o del territorio in cui sono stati raccolti per le finalità indicate nella presente Informativa sulla privacy.  Nello specifico, potremmo trasferire i dati per offrire, amministrare e gestire i Servizi a Lei forniti e per migliorare l'efficienza delle nostre operazioni commerciali. Faremo tutto il possibile per garantire che tali trasferimenti siano conformi a tutte le leggi vigenti in materia di protezione dei dati e che i diritti e le libertà delle persone fisiche siano adeguatamente tutelati.
      </p>
      <p>
        Laddove si presenti la necessità di tale trasferimento, adotteremo misure per garantire che siano in atto adeguate misure di salvaguardia per proteggere i Dati personali, come una valutazione dell'impatto, una decisione di adeguatezza da parte dell'autorità di controllo competente, l'uso di norme aziendali vincolanti approvate o clausole contrattuali standard o il Suo consenso.
