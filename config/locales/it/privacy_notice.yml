      <p>Data di entrata in vigore: 15 settembre 2024</p>
      <p>
        La presente Informativa sulla privacy descrive le modalità con cui Mercer Talent Enterprise (“<strong>MTE</strong>”) raccoglie, utilizza, condivide, conserva, trasferisce e tratta in altro modo le informazioni relative a persone identificate o identificabili (Dati personali) e i diritti che può esercitare in relazione ai Suoi Dati personali.  Riteniamo importante che Lei comprenda le modalità con cui trattiamo i Dati personali e La invitiamo a dedicare qualche minuto alla lettura delle nostre pratiche in materia di privacy descritte di seguito.
      </p>
