        <h1><strong>MERCER TALENT ENTERPRISE AVVISO SULLA PRIVACY</strong></h1>
        <p>Data di entrata in vigore: 15 septembre 2024</p>
        <p>
          La presente Informativa sulla privacy descrive le modalità con cui Mercer Talent Enterprise ("<strong>MTE</strong>") raccoglie, utilizza, condivide, conserva, trasferisce ed elabora in altro modo le informazioni relative a persone identificate o identificabili (Informazioni personali) e i diritti che l'utente può avere in merito alle sue Informazioni personali. Riteniamo che sia importante che l'utente comprenda come trattiamo le informazioni personali e lo invitiamo a prendere un momento per familiarizzare con le nostre pratiche sulla privacy descritte di seguito.
        </p>
