        <h2>CONSERVAZIONE DELLE INFORMAZIONI</h2>
        <p>
          I nostri prodotti, servizi e obblighi normativi sono complessi e pertanto i nostri periodi di conservazione dei dati personali variano.  Nello stabilire i periodi di conservazione delle Informazioni personali e dei registri che conserviamo, teniamo conto dei seguenti obblighi:
        </p>
        <ul>
          <li>
            la necessità di conservare le informazioni per adempiere agli scopi aziendali o agli obblighi contrattuali per i quali sono state raccolte;
          </li>
          <li>
            i nostri doveri di eseguire le istruzioni dei nostri clienti in relazione ai dati personali che trattiamo per loro conto;
          </li>
          <li>
            i nostri doveri di ottemperare ai requisiti legali e normativi obbligatori in materia di conservazione dei documenti;
          </li>
          <li>
            le nostre procedure di backup e disaster recovery; e
          </li>
          <li>
            altri impatti legali, come i periodi di prescrizione applicabili.
          </li>
        </ul>
        <p>
          In base ai fattori di cui sopra, potremmo conservare le Informazioni personali oltre il periodo in cui forniamo i servizi all'utente. Quando non abbiamo più bisogno di conservare le Informazioni personali, le nostre politiche aziendali ci impongono di de-identificare o aggregare le informazioni (nel qual caso possiamo conservare e utilizzare ulteriormente le informazioni de-identificate o aggregate per scopi analitici) o di distruggerle in modo sicuro.
        </p>
