      <h2>MISURE CHE ADOTTIAMO PER PROTEGGERE I DATI PERSONALI</h2>
      <p>
        La nostra azienda si impegna a rispettare tutte le leggi applicabili in materia di sicurezza informatica e protezione dei dati. Con questi obiettivi in mente, MMC ha nominato un Responsabile della sicurezza dei dati (CISO, Chief Information Security Officer) e un Responsabile globale della privacy (GCPO, Global Chief Privacy Officer). Il CISO è responsabile della gestione di un team di Sicurezza Informatica Globale e di un programma completo di sicurezza informatica.  Nell'ambito del nostro programma di sicurezza informatica, abbiamo implementato misure di sicurezza fisiche, amministrative e tecniche commercialmente ragionevoli per proteggere i Dati personali da accesso, uso, alterazione e cancellazione non autorizzati.
      </p>
      <p>
        Il GCPO dirige e supervisiona un Centro di Eccellenza per la Privacy e una Rete di Responsabili della Protezione dei Dati incaricati di attuare il nostro programma globale completo sulla privacy. La Rete dei responsabili della protezione dei dati collega i nostri responsabili della protezione dei dati in tutto il mondo e cerca di implementare il nostro programma sulla privacy in modo coerente e completo ovunque elaboriamo i dati. Può ottenere il nome e le informazioni di contatto del Responsabile della protezione dei dati nella Sua giurisdizione contattandoci all'indirizzo privacy@mmc.com.
      </p>
      <h2>I SUOI DIRITTI IN MATERIA DI PROTEZIONE DEI DATI</h2>
      <p>
        In molti casi, gestiamo i Dati personali per fornire i nostri servizi a clienti aziendali e Lei dovrebbe contattarli per esercitare i diritti che potrebbe avere ai sensi delle leggi sulla privacy applicabili. Tuttavia, laddove agiamo in qualità di responsabile del trattamento o di azienda principalmente responsabile della decisione sulle modalità di trattamento dei Suoi dati, Lei potrebbe disporre di alcuni o di tutti i diritti elencati di seguito, a seconda della giurisdizione e del motivo per cui trattiamo le Sue informazioni.    La preghiamo di notare che potremmo aver bisogno di utilizzare i Suoi Dati personali per verificare la Sua identità prima di rispondere a uno qualsiasi dei seguenti diritti.
      </p>
      <ul>
        <li>
          <strong>Diritto di accesso (diritto di sapere)<br /></strong>Può chiederci di fornirLe ulteriori dettagli su come utilizziamo i Suoi Dati personali, le fonti, le categorie o parti specifiche di Dati personali che abbiamo raccolto, le categorie di terze parti a cui abbiamo divulgato le informazioni e richiedere una copia dei Dati personali in nostro possesso.
        </li>
      </ul>
      <ul>
        <li>
          <strong>Diritto di rettifica <br /></strong>Può chiederci di aggiornare eventuali inesattezze nei Dati personali in nostro possesso. Se divulghiamo i Suoi Dati personali a terzi, comunicheremo loro la correzione ove possibile.
