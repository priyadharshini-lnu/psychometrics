        <h2>MISURE ADOTTATE PER PROTEGGERE LE INFORMAZIONI PERSONALI  </h2>
        <p>
          La nostra azienda si impegna a rispettare tutte le leggi vigenti in materia di cybersecurity e protezione dei dati. Con questi obiettivi in mente, MMC ha un Chief Information Security Officer (CISO) dedicato e un Global Chief Privacy Officer (GCPO). Il CISO è responsabile della gestione di un team di sicurezza informatica globale e di un programma completo di cybersecurity.  Nell'ambito del nostro programma di cybersecurity, abbiamo implementato misure di sicurezza fisiche, amministrative e tecniche ragionevoli dal punto di vista commerciale per proteggere le informazioni personali da accessi, usi, alterazioni e cancellazioni non autorizzati.
        </p>
        <p>
          Il GCPO dirige e supervisiona un Centro di eccellenza per la privacy e una rete di responsabili della protezione dei dati responsabili dell'attuazione del nostro programma globale sulla privacy. Il Data Protection Officer Network collega i nostri responsabili della protezione dei dati in tutto il mondo e cerca di implementare il nostro programma sulla privacy in modo coerente e completo ovunque trattiamo i dati. È possibile ottenere il nome e le informazioni di contatto del responsabile della protezione dei dati nella propria giurisdizione contattandoci all'indirizzo <a href="mailto:privacy@mmc.com">privacy@mmc.com</a>.
        </p>
        <h2>I VOSTRI DIRITTI IN MATERIA DI PROTEZIONE DEI DATI  </h2>
        <p>
          In molti casi, trattiamo i dati personali per fornire i nostri servizi alle aziende clienti, alle quali dovrete rivolgervi per esercitare gli eventuali diritti previsti dalle leggi sulla privacy. Tuttavia, laddove noi agiamo in qualità di responsabile del trattamento o di azienda che ha la responsabilità primaria di decidere le modalità di trattamento delle informazioni dell'utente, quest'ultimo può godere di alcuni o di tutti i diritti elencati di seguito, a seconda della giurisdizione e del motivo per cui trattiamo le informazioni dell'utente.   Si prega di notare che potrebbe essere necessario utilizzare i dati personali dell'utente per verificarne l'identità prima di rispondere a uno qualsiasi dei diritti elencati di seguito.
        </p>
        <ul>
          <li>
            <strong>Diritto di accesso (diritto di sapere)<br /></strong>
            Potete chiederci di fornirvi ulteriori dettagli su come utilizziamo le vostre informazioni personali, le fonti, le categorie o le parti specifiche di informazioni personali che abbiamo raccolto, le categorie di terzi a cui abbiamo divulgato le informazioni e di richiedere una copia delle informazioni personali in nostro possesso.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Diritto di correzione <br /></strong>
            L'utente può chiederci di aggiornare eventuali inesattezze nelle Informazioni personali in nostro possesso. Se divulghiamo i vostri dati personali a terzi, li informeremo della correzione, ove possibile.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Diritto di cancellare   <br /></strong>
            L'utente può chiederci di cancellare le sue Informazioni personali se non abbiamo più motivi legittimi per trattarle.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Diritto di opporsi o limitare il trattamento <br /></strong>
            L'utente può avere il diritto di limitare il trattamento delle sue Informazioni personali in determinate circostanze, ad esempio quando ne contesta l'accuratezza.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Diritto alla portabilità dei dati  <br /></strong>
            L'utente può avere il diritto, laddove sia tecnicamente fattibile, di richiedere il trasferimento a una terza parte di sua scelta di una copia delle Informazioni personali che abbiamo ottenuto da lui, in un formato strutturato, comunemente utilizzato e leggibile da una macchina.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Diritto di revoca del consenso   <br /></strong>
            Se ci affidiamo al vostro consenso come base giuridica per il trattamento dei vostri dati personali, avete il diritto di revocare tale consenso.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Diritto di presentare un reclamo<br /></strong>
            L'utente può avere il diritto di presentare un reclamo all'autorità di vigilanza o di regolamentazione competente nella sua giurisdizione se ha dei dubbi su qualsiasi aspetto delle nostre pratiche in materia di privacy.
          </li>
        </ul>
        <p>
          Se si desidera esercitare uno dei diritti di cui sopra o richiedere la revisione di una decisione o di un rifiuto, si prega di contattarci utilizzando le informazioni di contatto applicabili:
        </p>
        <ul>
          <li>
            Se vi trovate nel Regno Unito, in Svizzera o nello Spazio Economico Europeo,
            <a
              href="https://mmc-dev-privacy.my.onetrust.com/webform/4da460d1-7bcf-4ff1-ac37-c4b804769467/draft/ea953d72-fded-42ee-b1dd-c0a5a83b7891"
              >compilate questo modulo.</a
            >
          </li>
          <li>
            Per le persone residenti in altri Paesi,
            <a
              href="https://privacyportal.onetrust.com/webform/ee9df2bb-0ef3-4485-bc63-4db420e77359/225910f5-5666-468a-b1e7-39c70e24f4cc"
              >compilare il presente modulo</a
            >
          </li>
          <li>
            In alternativa, è possibile inviare un'e-mail all'indirizzo
            <a href="mailto:privacy@mmc.com">privacy@mmc.com</a>
          </li>
        </ul>
        <p>
          A seconda del paese in cui vi trovate, potreste avere anche alcuni o tutti i seguenti diritti:
        </p>
        <ul>
          <li>
            <strong>Diritto di rinunciare o meno alla vendita o alla condivisione per la pubblicità cross-context
              <br /></strong>
            Se visitate uno dei nostri siti web, possiamo divulgare le vostre informazioni sull'attività in Internet o in altre reti elettroniche, gli identificatori biografici, i dati di geolocalizzazione e le informazioni professionali (nella misura in cui possono essere ricavate dalla vostra attività sul nostro sito web) ai fornitori di analisi dei siti web e di pubblicità per scopi comportamentali o di pubblicità mirata attraverso i cookie pubblicitari.  In base ad alcune leggi, l'utente può avere il diritto di scegliere di non partecipare a questi tipi di divulgazione.  Per effettuare la selezione o per visualizzare i nomi di terze parti specifiche con cui abbiamo venduto o condiviso le vostre informazioni, cliccate sul link "Gestisci cookie" in fondo alla nostra pagina web. Se si desidera rinunciare alla vendita o alla condivisione dei propri dati, assicurarsi che le levette per i tracker "Pubblicità" e "Analisi" siano impostate su "No" o, se disponibile, attivare la levetta Non vendere o condividere i miei dati personali.
            <p>
              L'utente può anche implementare un'impostazione o un'estensione del browser per comunicare automaticamente le proprie preferenze di vendita e condivisione ai siti web visitati.  I nostri siti web elaborano tali "segnali di preferenza di opt-out" in maniera impeccabile, riconoscendo il Global Privacy Control (GPC) di . Se si desidera utilizzare GPC, è possibile scaricarlo e abilitarlo tramite un browser o un'estensione del browser aderente. Ulteriori informazioni sul download del GPC sono disponibili <a href="https://globalprivacycontrol.org/">qui</a>.&nbsp;
            </p>
          </li>
        </ul>
        <ul>
          <li>
            <strong>Diritti in relazione al processo decisionale automatizzato e alla profilazione
              <br /></strong
            >Nella misura in cui effettuiamo il trattamento automatizzato dei vostri dati personali, vi forniremo in anticipo tutti gli avvisi, compresi quelli relativi ai vostri diritti, richiesti dalla legge.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Marketingdiretto e segnali Do Not Track  <br /></strong>
            L'utente può avere il diritto di richiedere e ottenere una comunicazione una volta all'anno sulle informazioni personali che abbiamo divulgato ad altre aziende per le loro finalità di marketing diretto, ove consentito dalla legge.  Se applicabile, tale avviso includerà un elenco delle categorie di informazioni personali che sono state divulgate (se del caso) e i nomi e gli indirizzi di tutte le terze parti a cui le informazioni personali sono state divulgate (se del caso).  L'avviso riguarderà l'anno solare precedente.  L'utente può contattarci come indicato di seguito se desidera sapere se questo diritto si applica a lui e, in caso affermativo, esercitare tale diritto.
          </li>
        </ul>
        <p>
          Si prega di notare che alcuni di questi diritti possono essere limitati nel caso in cui abbiamo un interesselegittimoprevalente o un obbligo legale, normativo o contrattuale di continuare a trattare le Informazioni personali, o nel caso in cui le Informazioni personali possono essere esenti da divulgazione o cancellazione ai sensi della legge applicabile.  Alcuni di questi diritti possono essere esercitati solo in determinate circostanze o possono essere altrimenti limitati dalla legislazione sulla protezione dei dati nella vostra giurisdizione.
        </p>
        <h2>TRASFERIMENTI TRANSFRONTALIERI</h2>
        <p>
          Essendo un'azienda globale che opera in più di 80 paesi, ci sono circostanze in cui dovremo trasferire le informazioni personali al di fuori del paese, della provincia o del territorio in cui sono state raccolte per gli scopi delineati nella presente Informativa sulla privacy. In particolare, possiamo trasferire i dati per offrire, amministrare e gestire i Servizi forniti all'utente e per migliorare l'efficienza delle nostre operazioni commerciali. Ci impegneremo al massimo per garantire che questi trasferimenti siano conformi a tutte le leggi pertinenti in materia di protezione dei dati e che i diritti e le libertà degli individui ai sensi di tali leggi siano adeguatamente salvaguardati.
        </p>
        <p>
          Nel caso in cui si renda necessario tale trasferimento, adotteremo misure per garantire l'esistenza di garanzie adeguate per la protezione dei dati personali, come ad esempio una valutazione d'impatto, una decisione di adeguatezza da parte dell'autorità di vigilanza competente, l'utilizzo di norme aziendali vincolanti approvate o di clausole contrattuali standard, o il vostro consenso.
        </p>
