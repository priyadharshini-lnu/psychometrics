    insights_reports: Approfondimenti e Rapporti
    instruction_modal:
      campaign_start_final_instructions: |
        <p>
          Tieni presente che non c'è modo di fermare o mettere in pausa il timer. Il timer della campagna continuerà a funzionare anche se chiudi il browser, quindi in nessun momento dovresti pensare di lasciare le attività a metà per fare altro. Assicurati di minimizzare le distrazioni durante le attività. Trova un ambiente tranquillo, disattiva le notifiche sui tuoi dispositivi ed evita di fare multitasking. Mantieni la concentrazione e rimani focalizzato. Una volta che il timer della campagna scade, non potrai continuare. Se hai letto le istruzioni precedenti, clicca su Inizia per continuare con le attività assegnate.
        </p>
      campaign_start_instruction: |
        <h4>Per favore, leggi attentamente le seguenti istruzioni.</h4>
        <p>
          Le attività che stai per iniziare sono cronometrate. Una volta cliccato su "Inizia", il timer della campagna inizierà automaticamente. Hai %{minutes} minuti per completare tutte le attività. Per favore, cerca di completare le attività entro il tempo designato e gestisci il tempo in modo efficace per evitare di affrettarti nel processo di valutazione. Assicurati di completare le attività in una sola volta, quindi se hai bisogno di fare una pausa, fallo ora.
        </p>
      common_proctoring_instructions: |
        <h4>Supervisione</h4>
        <p>
          Cliccando sul pulsante Inizia, sarai reindirizzato al nostro sistema di supervisione. Questo monitorerà la tua fotocamera, il microfono e lo schermo durante la sessione. Queste sessioni sono supervisionate automaticamente dal nostro sofisticato sistema di IA, fornendo un'esperienza utente fluida e senza interruzioni. Tuttavia, le sessioni possono anche essere riviste da supervisori umani. Qualsiasi segno di cattiva condotta o irregolarità sarà segnalato. Questo viene fatto per garantire che non vengano effettuati tentativi di imbroglio. Se vengono rilevati sospetti, le tue attività saranno annullate.
        </p>
      lockdown_browser_instruction: |
        <h4>Browser di Supervisione</h4>
        <p>
          Ti verrà richiesto di scaricare e installare un browser speciale per completare le attività supervisionate. Per favore, segui le istruzioni nella schermata successiva. Puoi disinstallarlo dopo aver completato tutte le attività richieste.
        </p>
