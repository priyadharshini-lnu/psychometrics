      guidelines:
        cards:
          c1:
            content: Includi competenze, conoscenze e capacità che devono essere sviluppate. Assicurati che siano specifiche, misurabili, realizzabili, realistiche e ragionevolmente attuabili nei tempi indicati.
            title: Obiettivi di Sviluppo
          c2:
            content: Questo si basa sulla competenza da sviluppare in base all'esperienza di valutazione.
            title: Competenza
          c3:
            content: Questa sezione include le tue azioni di sviluppo basate sul modello di apprendimento 70-20-10 elencato di seguito. Si consiglia di selezionare una combinazione di ciascuno dei tre elementi per garantire un approccio di apprendimento e sviluppo variegato.
            title: Attività
          c4:
            content: Assicurati che le tue tempistiche siano realistiche in base a quando l'obiettivo può essere completato. Modificale quando e se appropriato.
            title: Tempistica
          c5:
            content: Usa la sezione progresso per supportare l'avanzamento sui percorsi identificati.
            title: Progresso
        chart:
          collaboration: "<strong>20%</strong>Apprendimento <br /> Collaborativo"
          job: "<strong>70%</strong>Apprendimento <br />sul Lavoro"
          learn: "<strong>10%</strong>Apprendimento Formale"
        content:
          list:
            r1: Si noti che questo elenco è solo indicativo, e ulteriori percorsi di sviluppo possono essere considerati per te in base ad aspirazioni individuali, raccomandazioni del tuo manager e priorità aziendali organizzative.
            r2: Si noti che il lancio di alcuni di questi percorsi di sviluppo dipenderà dalla strategia educativa e di apprendimento dell'intera organizzazione.
            r3: Si prega di considerare i percorsi raccomandati come indicati di seguito, durante lo sviluppo del tuo Piano di Sviluppo Individuale.
          main: Questa sezione include un elenco cumulativo di tutti i percorsi di sviluppo, tenendo presente le migliori pratiche di apprendimento, ovvero la linea guida 70-20-10, che fornisce un percorso progressivo che combina apprendimento in aula, coaching e apprendimento sul lavoro. In base ai risultati dell'esperienza di sviluppo della leadership e alle priorità aziendali, sono stati raccomandati possibili percorsi di sviluppo, che possono essere considerati per il tuo sviluppo.
        learn_cards:
          collaboration:
            list:
            - Offriti di fare da coach o mentore ad altri
            - Chiedi di essere mentorizzato da un esperto nel tuo campo
            - Ottieni un coach per supportare il tuo sviluppo
            - Crea un gruppo di lavoro collaborativo per discutere delle sfide in corso nell'azienda
            - Ottieni feedback in modo formale e informale dagli altri
            - Svolgi un ruolo attivo nelle associazioni e reti di settore
            - Costruisci le tue reti esterne
            title: Apprendimento Collaborativo (20%) <br/> Sviluppo attraverso gli altri
          job:
            list:
            - Assumi posizioni di leadership nei comitati di stakeholder o di gestione
            - Offriti volontario per guidare progetti di gestione del cambiamento per l'organizzazione
            - Considera di assumere incarichi stimolanti
            - Lavora in modo collaborativo con altre funzioni
            - Considera di guidare progetti al di fuori della tua organizzazione
            - Lavora a stretto contatto con esperti esterni del settore su progetti congiunti
            title: Apprendimento Sul Lavoro (70%) <br/> Sviluppo attraverso l'esperienza
          learn:
            list:
            - Assumi posizioni di leadership nei comitati di stakeholder o di gestione
            - Offriti volontario per guidare progetti di gestione del cambiamento per l'organizzazione
            - Considera di assumere incarichi stimolanti
            - Lavora in modo collaborativo con altre funzioni
            - Considera di guidare progetti al di fuori della tua organizzazione
            - Lavora a stretto contatto con esperti esterni del settore su progetti congiunti
            title: Apprendimento Formale (10%) <br/> Sviluppo attraverso l'apprendimento strutturato
