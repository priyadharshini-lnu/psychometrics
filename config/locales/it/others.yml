    instruction_modal:
      campaign_start_final_instructions: "<p>il timer della campagna continuerà a scorrere anche quando si chiude il browser, quindi non si deve mai pensare di abbandonare i compiti per dedicarsi ad altro. Assicurarsi di ridurre al minimo le distrazioni durante i compiti. Trovare un ambiente tranquillo, disattivare le notifiche sui dispositivi ed evitare il multitasking. Mantenere la concentrazione e rimanere concentrati. Una volta scaduto il timer della campagna, non sarà più possibile continuare. Se si sono lette le istruzioni di cui sopra, fare clic su Start per continuare i compiti assegnati</p>\n"
      campaign_start_instruction: |
        <h4>Leggere attentamente le seguenti istruzioni.</h4>
        <p>i compiti che state per iniziare sono a tempo. Una volta cliccato su "Inizia", il timer della campagna partirà automaticamente. Avete %{minutes} minuti per completare tutte le attività. Cercate di completare i compiti entro il tempo stabilito e gestite il tempo in modo efficace per evitare di affrettare il processo di valutazione. Assicuratevi di completare i compiti in una volta sola, quindi se avete bisogno di fare una pausa, questo è il momento giusto</p>
      common_proctoring_instructions: |
        <h4>Proctoring</h4>
        <p>facendo clic sul pulsante Avvia, verrete reindirizzati al nostro sistema di proctoring, che monitorerà la vostra telecamera, il vostro microfono e il vostro schermo durante la sessione. Queste sessioni sono automaticamente controllate dal nostro sofisticato sistema di intelligenza artificiale, che garantisce un'esperienza utente ininterrotta e senza intoppi. Tuttavia, le sessioni possono anche essere esaminate da proctor umani. Qualsiasi segno di cattiva condotta o irregolarità verrà segnalato. Questo viene fatto per garantire che non ci siano tentativi di imbroglio. Se si riscontrano sospetti, i vostri compiti verranno annullati</p>
      lockdown_browser_instruction: |
        <h4>Browser per la correzione</h4>
        <p>per completare le attività di verifica è necessario scaricare e installare un browser speciale. Seguire le istruzioni riportate nella schermata successiva. È possibile disinstallare il browser dopo aver completato tutte le attività richieste</p>
