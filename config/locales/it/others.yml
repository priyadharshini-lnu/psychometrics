            content: Assicurati che le tue tempistiche siano realistiche in base a quando l'obiettivo può essere completato. Modificale quando e se appropriato.
            title: Tempistica
          c5:
            content: Usa la sezione progresso per supportare l'avanzamento sui percorsi identificati.
            title: Progresso
        chart:
          collaboration: "<strong>20%</strong>Apprendimento <br /> Collaborativo"
          job: "<strong>70%</strong>Apprendimento <br />sul Lavoro"
          learn: "<strong>10%</strong>Apprendimento Formale"
        content:
          list:
            r1: Si prega di notare che questo elenco è puramente indicativo e che potrebbero essere presi in considerazione ulteriori percorsi di sviluppo in base alle aspirazioni individuali, alle raccomandazioni del proprio responsabile e alle priorità aziendali dell'organizzazione.
            r2: Gli utenti sono invitati a esaminare criticamente tutti i contenuti e sono liberi di modificare, perfezionare, sostituire o aggiungere qualsiasi azione o raccomandazione con cui non sono d'accordo.
            r3: 'I dati relativi allo sviluppo inclusi nel presente rapporto possono provenire da una o entrambe le seguenti fonti:'
            r3a: Una libreria di sviluppo personalizzata creata appositamente per la tua organizzazione
            r3b: Suggerimenti di sviluppo generati dall'intelligenza artificiale
            r4: Il presente rapporto IDP è stato generato con l'ausilio della tecnologia di intelligenza artificiale e potrebbe contenere imprecisioni. Le informazioni e i consigli forniti devono essere interpretati con cautela e utilizzati esclusivamente come strumento per il vostro sviluppo personale e professionale. Il rapporto ha una validità di 12-18 mesi.
          main: L'IDP creato include un elenco dettagliato delle azioni di sviluppo che puoi intraprendere, tenendo presente le migliori pratiche di apprendimento, ovvero la linea guida 70-20-10, che fornisce un percorso progressivo che combina apprendimento in aula, coaching e apprendimento sul posto di lavoro. Sulla base dei risultati del processo di valutazione, delle tue risposte in chat e delle relazioni esterne, se applicabile, sono stati raccomandati possibili percorsi di sviluppo che possono essere presi in considerazione per la tua crescita professionale.
        learn_cards:
          collaboration:
            list:
            - Offriti di fare da coach o mentore ad altri
            - Chiedi di essere mentorizzato da un esperto nel tuo campo
            - Ottieni un coach per supportare il tuo sviluppo
            - Crea un gruppo di lavoro collaborativo per discutere delle sfide in corso nell'azienda
            - Ottieni feedback in modo formale e informale dagli altri
            - Svolgi un ruolo attivo nelle associazioni e reti di settore
            - Costruisci le tue reti esterne
            title: Apprendimento Collaborativo (20%) <br/> Sviluppo attraverso gli altri
          job:
            list:
            - Assumi posizioni di leadership nei comitati di stakeholder o di gestione
            - Offriti volontario per guidare progetti di gestione del cambiamento per l'organizzazione
            - Considera di assumere incarichi stimolanti
            - Lavora in modo collaborativo con altre funzioni
            - Considera di guidare progetti al di fuori della tua organizzazione
            - Lavora a stretto contatto con esperti esterni del settore su progetti congiunti
            title: Apprendimento Sul Lavoro (70%) <br/> Sviluppo attraverso l'esperienza
          learn:
            list:
            - Partecipare a programmi di formazione strutturati
            - Corsi completi di e-learning online
            - Leggi libri, articoli, pubblicazioni
            - Ottieni qualifiche professionali, certificazioni e accreditamenti
            - Frequentare corsi, workshop, seminari
            title: Apprendimento Formale (10%) <br/> Sviluppo attraverso l'apprendimento strutturato
