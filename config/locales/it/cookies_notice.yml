  cookies_notice: |-
    <h2>Informativa sui cookie</h2>

    <p>Data di entrata in vigore: 14 dicembre 2023</p>

    <p>Usiamo cookie e relative tecnologie di tracciamento, quali web beacon, pixel di tracciamento e file di log (tutti insieme noti come “cookie”), su questo sito per differenziare gli utenti, definire e migliorare funzionalità del sito e dei nostri servizi, e fornirti una soddisfacente esperienza di navigazione.</p>

    <p><strong>COSA SONO I COOKIE</strong></p>

    <p>I cookie sono informazioni condivise tra il tuo browser e un sito. Alcuni cookie sono necessari per il funzionamento del sito. Altri ci aiutano a valutare e migliorare le sue prestazioni. Utilizziamo anche cookie per fornirti contenuti, prodotti e servizi interessanti per te. Un cookie non può leggere i dati dal disco rigido del tuo computer.</p>

    <p><strong>Esistono diversi tipi di cookie con diverse funzioni:</strong></p>

    <p>(i) <strong>Cookie di sessione:</strong> questi cookie sono memorizzati sul tuo computer solo durante la sessione di navigazione web. Vengono automaticamente cancellati alla chiusura del browser. Di solito memorizzano un ID di sessione anonimo che consente di navigare su un sito web senza dover accedere a ciascuna pagina. Non prelevano alcuna informazione dal tuo computer.</p>

    <p>(ii) <strong>Cookie persistenti:</strong> questi cookie sono dei file memorizzati sul tuo computer che rimangono lì anche dopo la chiusura del browser. Possono essere letti dal sito web che li ha generati, alla successiva visita allo stesso sito.</p>

    <p>(iii) <strong>Cookie di prima parte:</strong> sono i cookie creati dalla nostra azienda. Vengono memorizzati e inviati tra i nostri server e il disco rigido del tuo computer. Questi cookie possono essere di sessione o persistenti.</p>

    <p>(iv) <strong>Cookie di terze parti:</strong> questi cookie sono creati da uno dei nostri partner terzi. Vengono memorizzati e inviati tra i server di terze parti e il disco rigido del tuo computer. Questi cookie sono generalmente cookie persistenti.</p>

    <p><strong>COME E PERCHÉ UTILIZZIAMO I COOKIE</strong></p>

    <p>In base al sito web, possiamo usare i cookie per le seguenti finalità:</p>

    <p><strong>Laddove strettamente necessario</strong></p>

    <p>Questi cookie sono essenziali per consentirti di navigare nel sito web e utilizzare le sue funzionalità, come l’accesso alle sue aree riservate. Senza questi cookie, i servizi da te richiesti, come un preventivo o l’accesso al tuo account, non possono essere forniti. Questi cookie non raccolgono informazioni su di te che potrebbero essere utilizzate per il marketing o per tracciare la tua navigazione.</p>

    <p><strong>Funzionalità</strong></p>

    <p>Questi cookie consentono al nostro sito web di ricordare le scelte dell’utente (come il suo nome utente, la lingua o la regione in cui si trova) e forniscono funzionalità avanzate. Ad esempio, un sito web potrebbe essere in grado di ricordare i dati di accesso dell’utente, in modo da non costringerlo ad immetterli ad ogni accesso successivo con lo stesso dispositivo. Questi cookie possono essere utilizzati anche per ricordare le modifiche apportate alla dimensione del testo, al tipo di carattere e ad altre parti delle pagine web che è possibile personalizzare. Possono anche essere utilizzati per fornire servizi da te richiesti, come visualizzare un video o commentare un articolo. Le informazioni raccolte da questi cookie sono solitamente anonime.</p>

    <p><strong>Analytics</strong></p>

    <p>Questi cookie raccolgono informazioni sulle visite al sito web da parte degli utenti, ad esempio quali pagine visitano più spesso e se ricevono messaggi di errore da alcune pagine. Ci consentono inoltre di registrare e contare il numero di visitatori del sito web, permettendoci di analizzarne le modalità di navigazione, per poter migliorare il suo funzionamento.</p>

    <p><strong>Pubblicità</strong></p>

    <p>Questi cookie vengono utilizzati allo scopo di visualizzare annunci pubblicitari interessanti per l’utente e per gestire le prestazioni di tali annunci. I cookie pubblicitari sono generalmente cookie di terze parti e possono essere presenti anche se sul sito web non sono presenti annunci.</p>

    <p><strong>Indirizzi IP</strong></p>

    <p>Durante le visite ai nostri siti web, potremmo registrare gli indirizzi IP (Internet Protocol) degli utenti per tracciare e aggregare informazioni non personali. Ad esempio, potremmo usare l’indirizzo IP per monitorare le zone dalle quali gli utenti navigano nel sito.</p>

    <p><strong>COME GESTIRE I COOKIE</strong></p>

    <p>Fai clic sul collegamento “Gestisci cookie” nella parte inferiore della pagina per attivare o disattivare determinati cookie utilizzando il nostro Gestore del consenso dei cookie.</p>

    <p>È possibile disabilitare alcuni tipi di cookie dalle impostazioni del browser. Visita la sezione “Guida” del browser per maggiori informazioni su come gestire le impostazioni dei cookie.</p>

    <p><strong>L’INFORMATIVA SUI COOKIE NON SI APPLICA A SITI WEB DI TERZE PARTI</strong></p>

    <p>Quando forniamo collegamenti ad altri siti, bisogna tener presente che questi avranno le proprie politiche sulla privacy e sui cookie che regoleranno l’uso delle informazioni fornite.</p>

    <p><strong>MODIFICHE ALL’INFORMATIVA SUI COOKIE</strong></p>

    <p>Potremmo aggiornare questa politica di tanto in tanto, per cui ti invitiamo a consultarla periodicamente per rimanere informato/a su come utilizziamo i cookie.</p>

    <p><strong>DESCRIZIONE DEI COOKIE USATI</strong></p>

    <p>Fare click sul link “Gestisci cookie” in fondo al sito web per visualizzare i dettagli sui singoli cookie usati sul sito.</p>

    <p><strong>CONTATTACI</strong></p>

    <p>In caso di domande sull’informativa sui cookie, contattaci come indicato nella nostra informativa sulla privacy che si trova al seguente link.</p>
