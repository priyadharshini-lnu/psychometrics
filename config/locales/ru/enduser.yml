    troubleshooting_guide_audio_fifth: 'В Windows: проверьте настройки конфиденциальности > доступ к микрофону'
    troubleshooting_guide_audio_first: Нажмите на значок замка/сведения в адресной строке браузера
    troubleshooting_guide_audio_fourth: Если доступ заблокирован, возможно, вам потребуется сбросить настройки прав доступа в настройках браузера
    troubleshooting_guide_audio_second: Найдите настройки «Микрофон» и установите для них значение «Разрешить»
    troubleshooting_guide_audio_seventh: Если разрешения включены и при загрузке возникла проблема, запустите проверку снова и попробуйте загрузить аудио еще раз
    troubleshooting_guide_audio_sixth: 'На Mac: перейдите в «Системные настройки» > «Безопасность»'
    troubleshooting_guide_audio_third: Обновите страницу после изменения прав доступа
    troubleshooting_guide_browser_fifth: Убедитесь, что в настройках браузера включена функция LocalStorage
    troubleshooting_guide_browser_first: 'Используйте один из поддерживаемых браузеров: Chrome, Firefox, Edge или Safari (последние версии)'
    troubleshooting_guide_browser_fourth: Включите JavaScript и файлы cookie в настройках браузера
    troubleshooting_guide_browser_second: Очистите кэш браузера и файлы cookie
    troubleshooting_guide_browser_sixth: 'Попробуйте воспользоваться окном анонимного просмотра (Примечание: в режиме анонимного просмотра поддержка LocalStorage может быть ограничена или отсутствовать)'
    troubleshooting_guide_browser_third: Отключите расширения браузера, которые могут мешать доступу к мультимедиа
    troubleshooting_guide_network_fifth: Если проблема не устраняется, обратитесь к своему интернет-провайдеру за дополнительной помощью
    troubleshooting_guide_network_first: Закройте другие приложения, которые могут использовать пропускную способность сети (потоковое видео, загрузки и т. д.)
    troubleshooting_guide_network_fourth: Попробуйте воспользоваться другим сетевым подключением, если оно доступно
    troubleshooting_guide_network_second: Переместитесь поближе к роутеру Wi-Fi или подключитесь с помощью кабеля Ethernet
    troubleshooting_guide_network_third: Перезагрузите роутер/модем и попробуйте ещё раз
    troubleshooting_guide_video_fifth: 'В Windows: проверьте настройки конфиденциальности > доступ к камере/микрофону'
    troubleshooting_guide_video_first: Нажмите на значок замка/сведения в адресной строке браузера
    troubleshooting_guide_video_second: Найдите настройки «Камера» и «Микрофон» и установите для них значение «Разрешить»
    troubleshooting_guide_video_seventh: Если разрешения включены и при загрузке возникла проблема, запустите проверку снова и попробуйте загрузить видео еще раз
    troubleshooting_guide_video_sixth: 'На Mac: перейдите в «Системные настройки» > «Безопасность и конфиденциальность» > «Камера/Микрофон»'
    troubleshooting_guide_video_third: Обновите страницу после изменения прав доступа
