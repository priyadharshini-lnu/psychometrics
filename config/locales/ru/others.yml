      guidelines:
        cards:
          c1:
            content: Включите навыки, знания и способности, которые необходимо развить. Убедитесь, что они являются конкретными, измеримыми, достижимыми, реалистичными и разумно выполнимыми в указанные сроки.
            title: Цели развития
          c2:
            content: Это основано на компетентности, которая должна быть развита на основе опыта оценки.
            title: Компетентность
          c3:
            content: Этот раздел включает в себя ваши действия по развитию, основанные на модели обучения 70-20-10, приведенной ниже. Рекомендуется выбрать комбинацию из каждого из трех элементов, чтобы обеспечить разнообразный подход к обучению и развитию.
            title: Деятельность
          c4:
            content: Убедитесь, что ваши сроки являются реалистичными с учетом того, когда цель может быть достигнута. Вносите изменения в случае необходимости.
            title: Хронология
          c5:
            content: Используйте раздел «Прогресс», чтобы отслеживать продвижение по выбранным направлениям.
            title: Прогресс
        chart:
          collaboration: "<strong>20%</strong>Совместное <br /> обучение"
          job: "<strong>70%</strong>Обучение <br />на рабочем месте"
          learn: "<strong>10%</strong>Формальное обучение"
        content:
          list:
            r1: Обратите внимание, что этот список является ориентировочным, и для вас могут быть рассмотрены дополнительные пути развития с учетом индивидуальных стремлений, рекомендаций вашего руководителя, а также приоритетов организации.
            r2: Пользователям рекомендуется критически подходить к оценке всего контента и они могут свободно изменять, уточнять, заменять или добавлять любые действия или рекомендации, с которыми они не согласны.
            r3: 'Данные о развитии, включенные в настоящий доклад, могут быть получены из одного или обоих следующих источников:'
            r3a: Индивидуальная библиотека разработок, созданная для вашей организации
            r3b: Предложения по развитию, сгенерированные ИИ
            r4: Данный отчет IDP был сгенерирован с помощью технологий искусственного интеллекта и может содержать неточности. Приведенные в нем выводы и рекомендации следует воспринимать с осторожностью и использовать исключительно в качестве инструмента для вашего личного и профессионального развития. Срок действия отчета составляет 12–18 месяцев.
          main: Созданный IDP включает подробный список мер по развитию, которые вы можете предпринять, учитывая передовой опыт обучения, т. е. руководство 70-20-10, которое обеспечивает постепенный прогресс, сочетающий обучение в классе, коучинг и обучение на рабочем месте. На основе результатов процесса оценки, ваших ответов в чате и внешних отчетов, в зависимости от ситуации, были рекомендованы возможные пути развития, которые можно рассмотреть для вашего развития.
        learn_cards:
          collaboration:
            list:
            - Предложите свои услуги в качестве тренера или наставника для других
            - Запрос на наставничество со стороны эксперта в вашей области
            - Наймите тренера, который будет поддерживать ваше развитие
            - Создать совместную рабочую группу для обсуждения текущих проблем в бизнесе.
            - Получайте формальные и неформальные отзывы от других людей
            - Играть активную роль в отраслевых ассоциациях и сетях
            - Создайте свои собственные внешние сети
            title: Совместное обучение (20%) <br/> Развитие через других
          job:
            list:
            - Занимать руководящие должности в комитетах заинтересованных сторон или комитетах по управлению
            - Выступайте в качестве волонтера для руководства проектами по управлению изменениями в организации.
            - Рассмотрите возможность выполнения заданий по растяжке
            - Сотрудничать с другими подразделениями
            - Рассмотрите возможность ведения проектов за пределами вашей организации
            - Тесно сотрудничать с внешними экспертами отрасли в рамках совместных проектов
            title: Обучение на рабочем месте (70%) <br/> Развитие через опыт
          learn:
            list:
            - Посещайте структурированные программы обучения
            - Пройдите полные онлайн-курсы электронного обучения
            - Читать книги, статьи, публикации
            - Получите профессиональную квалификацию, сертификаты и аккредитации
            - Посещайте курсы, мастер-классы, семинары
            title: Формальное обучение (10%) <br/> Развитие посредством структурированного обучения
