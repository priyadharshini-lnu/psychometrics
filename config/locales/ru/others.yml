    instruction_modal:
      campaign_start_final_instructions: |-
        <p>
          Обратите внимание, что остановить или приостановить таймер невозможно. Таймер кампании будет продолжать работать даже после закрытия браузера, поэтому ни в коем случае не стоит отвлекаться на другие дела. Старайтесь минимизировать отвлекающие факторы во время выполнения задач. Найдите тихое место, отключите уведомления на своих устройствах и избегайте многозадачности. Сохраняйте концентрацию и оставайтесь сосредоточенными. По истечении времени кампании вы не сможете продолжить. Если вы прочитали вышеуказанные инструкции, нажмите «Начать», чтобы продолжить выполнение заданий.
        </p>
      campaign_start_instruction: |-
        <h4>Внимательно прочтите следующие инструкции.</h4>
        <p>
          Задание (задания), которое (которые) вы собираетесь выполнить, ограничено по времени. Как только вы нажмете «Начать», таймер кампании автоматически запустится. У вас есть %{minutes} минут, чтобы выполнить все задания. Пожалуйста, постарайтесь выполнить задания в установленный срок и эффективно распределите время, чтобы не торопиться во время процесса оценки. Убедитесь, что вы выполните задания за один раз, поэтому, если вам нужно сделать перерыв, сейчас самое время.
        </p>
      common_proctoring_instructions: |-
        <h4>Контроль</h4>
        <p>
          После нажатия кнопки «Начать» вы будете перенаправлены в нашу систему контроля. Она будет отслеживать вашу камеру, микрофон и экран во время сеанса. Эти сеансы автоматически контролируются нашей сложной системой искусственного интеллекта, обеспечивая бесперебойную и плавную работу. Однако сеансы также могут проверяться людьми. Любые признаки неправомерного поведения или нарушений будут отмечены. Это делается для того, чтобы исключить попытки мошенничества. В случае обнаружения подозрений ваши задания будут аннулированы.
        </p>
      lockdown_browser_instruction: |-
        <h4>Браузер для контроля</h4>
        <p>
          Для выполнения контролируемых заданий вам необходимо будет загрузить и установить специальный браузер. Следуйте инструкциям на следующем экране. После выполнения всех необходимых действий вы можете удалить этот браузер.
        </p>
