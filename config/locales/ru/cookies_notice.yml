    <h2>Уведомление о файлах cookie</h2>

    <p>Дата вступления в силу: 14 декабря 2023 г.</p>

    <p>Мы используем файлы cookies и связанные с ними технологии отслеживания, включая веб-маяки, пиксели и журналы (совместно именуемые «cookie») на этом веб-сайте, чтобы отличать вас от других пользователей, оценивать и улучшать функциональность веб-сайта и наших услуг, а также обеспечивать качественный пользовательский опыт.</p>

    <p><strong>ЧТО ТАКОЕ ФАЙЛ COOKIE</strong></p>
    <p>Файлы cookie — это данные, которыми обмениваются ваш браузер и веб-сайт. Некоторые cookie необходимы для работы веб-сайта. Другие помогают нам оценивать и улучшать его работу. Мы также используем файлы cookie для предоставления вам релевантного контента, продуктов и услуг. Файл cookie не может считывать данные с жесткого диска вашего компьютера.</p>

    <p><strong>Существуют различные виды файлов cookie с различными функциями:</strong></p>
    <p><strong>(i) Файлы cookie сеанса</strong> — эти файлы cookie хранятся на вашем компьютере в течение веб-сессии. При закрытии браузера они автоматически удаляются. Обычно содержат анонимный идентификатор сессии, позволяющий просматривать сайт без ввода логина на каждой странице. Не собирают информацию с вашего компьютера.</p>

    <p><strong>(ii) Постоянные файлы cookie</strong> — файлы cookie, которые сохраняются на вашем компьютере после закрытия браузера. Они могут быть прочитаны веб-сайтом при последующих посещениях.</p>

    <p><strong>(iii) Основные файлы cookie</strong> — создаются нашей компанией. Хранятся и передаются между серверами и вашим компьютером. Могут быть сеансовыми или постоянными файлами cookie.</p>

    <p><strong>(iv) Сторонние файлы cookie</strong> — создаются сторонними партнерами, хранятся на их серверах и на вашем компьютере, передаются между ними. Обычно это постоянные файлы cookie.</p>

    <p><strong>КАК И ЗАЧЕМ МЫ ИСПОЛЬЗУЕМ ФАЙЛЫ COOKIE</strong></p>
    <p>Мы используем файлы cookies для следующих целей:</p>

    <p><strong>Строгая необходимость</strong></p>
    <p>Необходимы для навигации по сайту и использования его функций, включая доступ к защищённым разделам. Без этих файлов cookie мы не сможем предоставить нужные функции, например, получение расценок или вход в учетную запись. Эти cookie не используются для маркетинга или отслеживания страниц, которые вы посещали.</p>

    <p><strong>Функциональность</strong></p>
    <p>Позволяют запоминать ваши выборы (например, имя, язык или регион) и предоставлять расширенные функции, такие как автоматический вход на устройство. Сохраняют настройки текста, шрифта и других элементов веб-страниц. Информация обезличена.</p>

    <p><strong>Аналитика</strong></p>
    <p>Собирают информацию о том, как посетители используют сайт, какие страницы посещают чаще всего, и помогают подсчитывать количество посетителей для улучшения работы сайта.</p>

    <p><strong>Реклама</strong></p>
    <p>Используются для показа релевантной рекламы и управления её эффективностью. Обычно сторонние и могут присутствовать даже без рекламы на сайте.</p>

    <p><strong>IP-адреса</strong></p>
    <p>Собираем IP-адреса для агрегированной и обезличенной информации, например, чтобы контролировать регионы пользователей.</p>

    <p><strong>КАК УПРАВЛЯТЬ ФАЙЛАМИ COOKIE</strong></p>
    <p>Используйте ссылку «Управление файлами cookie» внизу страницы для включения или отключения определённых cookie. Обратите внимание: невозможно отказаться от строго необходимых cookie. Некоторые файлы cookies также можно отключить через настройки браузера.</p>

    <p><strong>ОПОВЕЩЕНИЕ ПО ИСПОЛЬЗОВАНИЮ ФАЙЛОВ COOKIE НЕ РАСПРОСТРАНЯЕТСЯ НА СТОРОННИЕ ВЕБ-САЙТЫ</strong></p>
    <p>Сторонние сайты имеют свои политики конфиденциальности и cookie. Рекомендуем ознакомиться с ними, так как мы не несем ответственности за их процедуры.</p>

    <p><strong>ИЗМЕНЕНИЯ К УВЕДОМЛЕНИЮ О ФАЙЛАХ COOKIE</strong></p>
    <p>Мы оставляем за собой право обновлять политику. Рекомендуем периодически проверять её. Дата вступления указана в начале страницы.</p>

    <p><strong>ОПИСАНИЕ ИСПОЛЬЗУЕМЫХ ФАЙЛОВ COOKIE</strong></p>
    <p>Нажмите на ссылку «Управление файлами cookie» внизу сайта, чтобы узнать подробности об отдельных cookie. Иногда ссылка может быть недоступна, если используются только строго необходимые cookie.</p>

    <p><strong>СВЯЖИТЕСЬ С НАМИ</strong></p>
    <p>Если у вас есть вопросы по поводу этого уведомления о файлах cookie, свяжитесь с нами через контактные данные, указанные в нашем Уведомлении о конфиденциальности.</p>
