  cookies_notice: |-
    <h2>Cookie 通知</h2>

    <p>生效日期：2023 年 12 月 14 日</p>

    <p>我們在本網站使用 Cookie 和相關追蹤技術，包括網路信標、追蹤像素和日誌檔案（統稱為“Cookie”），以區分您與其他使用者、評估和改善本網站的功能及服務，並為您提供良好的使用體驗。</p>

    <p><strong>什麼是 Cookie</strong></p>

    <p>Cookie 是瀏覽器與網站之間分享的資訊片段。一些 Cookie 是網站運作所必需的，一些則幫助我們評估和改進網站的性能。我們還使用 Cookie 以提供相關內容、產品和服務。Cookie 無法讀取您電腦硬碟上的資料。</p>

    <p><strong>存在不同種類的 Cookie，具有不同功能：</strong></p>

    <p>(i) <strong>會話 Cookie：</strong>這些 Cookie 僅在您的網頁會話期間儲存在您的電腦上。關閉瀏覽器時會自動刪除。通常儲存匿名會話 ID，使您能瀏覽網站而無需逐頁登入。這些 Cookie 不會收集您的個人資訊。</p>

    <p>(ii) <strong>持久性 Cookie：</strong>這些 Cookie 以檔案形式儲存在您的電腦上，即使關閉瀏覽器仍會保留。再次訪問網站時，網站可以讀取這些 Cookie。</p>

    <p>(iii) <strong>第一方 Cookie：</strong>由我們公司建立，存取於我們的伺服器與您的電腦之間。可以是會話 Cookie 或持久性 Cookie。</p>

    <p>(iv) <strong>第三方 Cookie：</strong>由我們的第三方合作夥伴建立，存取於第三方伺服器與您的電腦之間。通常為持久性 Cookie。</p>

    <p><strong>我們如何及為何使用 Cookie</strong></p>

    <p>根據網站需求，我們可能將 Cookie 用於以下目的：</p>

    <p><strong>在絕對必要的情況下</strong></p>

    <p>這些 Cookie 對於網站導航及使用功能（如訪問安全區域）是必需的。若無這些 Cookie，無法提供您要求的服務，例如獲取報價或登入帳號。這些 Cookie 不會收集可用於行銷或追蹤您上網位置的資訊。</p>

    <p><strong>功能</strong></p>

    <p>這些 Cookie 允許網站記住您的選擇（如使用者名稱、語言或地區）並提供增強功能。例如：記住登入資訊以避免重複登入；記住文字大小、字型及頁面可自訂部分的更改；提供您要求的服務，如觀看影片或評論文章。收集資訊通常經過匿名化，不用於廣告或追蹤您上網行為。</p>

    <p><strong>分析</strong></p>

    <p>這些 Cookie 收集訪客如何使用網站的資訊，例如最常訪問的頁面或錯誤訊息。幫助記錄和統計訪客數量，以改進網站運作。</p>

    <p><strong>廣告</strong></p>

    <p>這些 Cookie 用於顯示與您相關的廣告，並管理廣告效益。廣告 Cookie 通常為第三方 Cookie，即使網站沒有廣告，也可能存在。</p>

    <p><strong>IP 位址</strong></p>

    <p>訪問網站時，我們可能收集您的 IP 位址，用於追蹤和匯總非個人資訊。例如監控使用者訪問的地區。</p>

    <p><strong>如何管理 Cookie</strong></p>

    <p>請點擊頁面底部的「管理 Cookie」連結，透過 Cookie 同意管理器選擇啟用或退出部分 Cookie。絕對必要的 Cookie 無法停用，因此僅使用此類 Cookie 的網站可能不提供此連結。</p>

    <p>您也可以透過瀏覽器設定禁用部分 Cookie，具體請參考瀏覽器「說明」部分。</p>

    <p><strong>Cookie 通知不適用於第三方網站</strong></p>

    <p>若包含指向其他網站的連結，請注意它們有各自的隱私與 Cookie 政策，管理您提供資訊的使用方式。我們建議您閱讀其政策，我們不對其隱私行為負責。</p>

    <p><strong>對 Cookie 通知的更改</strong></p>

    <p>本政策可能不時更新，請您定期查看以了解我們的 Cookie 使用方式。生效日期顯示於頁面頂部。</p>

    <p><strong>所使用 Cookie 的說明</strong></p>

    <p>請點擊網站頁腳的「管理 Cookie」連結，以查看單一 Cookie 詳細資訊。某些情況下可能無法使用此連結，例如僅使用絕對必要 Cookie。</p>

    <p><strong>聯絡我們</strong></p>

    <p>如對本 Cookie 通知有任何疑問，請按照隱私聲明中的聯絡方式與我們聯繫。</p>
