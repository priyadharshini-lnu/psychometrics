        <h2>我們如何收集個人資訊</h2>
        <h3>
          <strong>
            您、您的代表或第三方提供的信息
          </strong>
        </h3>
        <p>我們可能從以下來源收集個人資訊：</p>
        <ul>
          <li>
            直接向您獲取，例如當您訪問網站、建立帳戶、完成調查或以其他方式向我們提供資訊時。
          </li>
          <li>
            您的代表，包括您的雇主、協會、團體或福利計劃/計劃發起人。
          </li>
        </ul>
        <p>
          在評估過程中，我們可能會透過您的網路攝影機、麥克風或系統中的其他硬體元素收集您的個人資訊。您的系統和 MTE 程式會在從您的硬體設備收集個人資訊之前徵求您的同意。
        </p>
        <p>
          如果您向我們提供其他人（例如家庭成員、受益人或家屬）的個人資訊，則您聲明您有權提供此資訊，並且您已在適當情況下分享了本隱私權聲明。我們不會故意直接從未成年人處收集個人資訊。
        </p>
        <h3><strong>透過自動化方式收集 </strong>&nbsp;</h3>
        <p>
          我們在公司自有網站上使用 Cookie 及相關追蹤技術（簡稱「Cookie」） 。如果您所在的司法管轄區允許，網站使用者可以透過網站底部的「管理 Cookie」連結選擇停用某些Cookie。如需了解更多關於我們如何使用 Cookie 的信息，請參閱我們的
          <a href="https://www.mercer.com/en-sa/footer/mercer-cookie-notice/"
            >Cookie 聲明。</a
          >&nbsp;
        </p>
        <h3><strong>第三方收集 </strong>&nbsp;</h3>
        <p>
