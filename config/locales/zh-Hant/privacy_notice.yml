        <p>
          我們的網站可能包含由 MTE 以外的機構經營的網站連結。如果您透過我們網站上的超連結訪問其他機構的網站，該機構可能會收集您的資訊。 MTE 對連結網站的內容或隱私權保護措施，或其對您個人資訊的使用不承擔任何責任。如果您透過此類連結離開 MTE 網站（您可以透過查看瀏覽器網址列中的 URL 來判斷您所在的位置），您應該參考該網站的隱私權政策、使用條款和其他聲明，以確定該機構將如何處理其收集的您的個人資訊。
        </p>
