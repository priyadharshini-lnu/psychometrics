          我們也可能出於商業上正當合法的目的而揭露那些不太可能識別您身份的去識別化資訊。對於我們持有的去識別化訊息，我們將對其進行維護和使用，但不會嘗試重新識別這些數據，除非法律允許。
        </p>
        <h2>我們採取的保護個人資訊的措施 </h2>
        <p>
          我們的公司 致力於遵守所有適用的網路安全和資料保護法律。為了實現這些目標，MMC 設立了專門的首席資訊安全官 (CISO) 以及全球首席隱私官 (GCPO)。首席資訊安全官 (CISO)負責管理全球資訊安全團隊和全面的網路安全計畫。作為網路安全計畫的一部分，我們已實施商業上合理的實體、管理和技術保障措施，以保護個人資訊免於未經授權的訪問、使用、變更和刪除。
        </p>
        <p>
          GCPO 領導並監督隱私卓越中心和資料保護官網絡，負責實施我們全面的全球隱私計畫。資料保護官網路連接我們遍布全球的資料保護官，致力於在我們處理資料的任何地方一致且徹底地實施我們的隱私計劃。您可以透過 <a href="mailto:privacy@mmc.com">privacy@mmc.com</a> 聯絡，以取得您所在司法轄區資料保護官的姓名和聯絡資訊。
        </p>
        <h2>您的資料保護權利 </h2>
        <p>
          在許多情況下，我們處理個人資訊是為了向企業客戶提供服務，您應該聯絡他們，以行使您根據適用隱私權法可能享有的任何權利。但是，如果我們作為主要負責決定如何處理您的資訊的控制者或企業，您可能擁有以下列出的部分或全部權利，具體取決於司法管轄區和我們處理您資訊的原因。 請注意，在回應以下任何權利之前，我們可能需要使用您的個人資訊來驗證您的身分。
        </p>
        <ul>
          <li>
            <strong>訪問權（知情權） <br /></strong>
            您可以要求我們向您提供有關如何使用您的個人資訊的更多詳細資訊、我們收集的個人資訊的來源、類別或特定內容、我們向其揭露資訊的第三方類別，並要求我們提供我們持有的關於您的個人資訊的副本。
          </li>
        </ul>
        <ul>
          <li>
            <strong>更正權 <br /></strong>
            您可以要求我們更新我們所持有的個人資訊中任何不準確的資訊。如果我們將您的個人資訊揭露給他人，我們將盡可能告知他們更正的資訊。
          </li>
        </ul>
        <ul>
          <li>
            <strong>刪除權 <br /></strong>
            當我們不再有合法依據處理您的個人資訊時，您可以要求我們刪除您的個人資訊。
          </li>
        </ul>
        <ul>
          <li>
            <strong>反對或限制處理的權利 <br /></strong>
            在某些情況下，您可能有權限制對您的個人資訊的處理，例如當您對其準確性提出異議時。
          </li>
        </ul>
        <ul>
          <li>
            <strong>資訊可攜帶權 <br /></strong>
            在科技可行的情況下，您有權要求我們以結構化、常用和機器可讀的格式將從您處獲得的個人資訊的副本傳輸給您選擇的第三方。
          </li>
        </ul>
        <ul>
          <li>
            <strong>撤回同意的權利 <br /></strong>
            如果我們依賴您的同意作為處理您的個人資訊的法律依據，您有權撤回該同意。
          </li>
        </ul>
        <ul>
          <li>
            <strong>投訴權<br /></strong>
            如果您對我們的隱私權實務的任何方面有疑慮，您可能有權向您所在司法管轄區的相關監督或監管機構提出申訴。
          </li>
        </ul>
        <p>
          如果您希望行使上述任何權利或要求複審決定或拒絕，請使用適用的聯絡資訊與我們聯絡：
        </p>
        <ul>
          <li>
            對於在英國、瑞士或歐洲經濟區的個人，
            <a
              href="https://mmc-dev-privacy.my.onetrust.com/webform/4da460d1-7bcf-4ff1-ac37-c4b804769467/draft/ea953d72-fded-42ee-b1dd-c0a5a83b7891"
              > 請填寫此表格</a
            >
          </li>
          <li>
            對於其他國家的個人，
            <a
              href="https://privacyportal.onetrust.com/webform/ee9df2bb-0ef3-4485-bc63-4db420e77359/225910f5-5666-468a-b1e7-39c70e24f4cc"
              > 請填寫此表格</a
            >
          </li>
          <li>
            或者，您可以發送電子郵件至 <a href="mailto:privacy@mmc.com">privacy@mmc.com</a>
          </li>
        </ul>
        <p>
          根據您所在的國家/地區，您可能還擁有以下部分或全部權利：
        </p>
        <ul>
          <li>
            <strong>
              選擇加入或退出跨情境廣告銷售或共享的權利 <br />
            </strong>
            如果您訪問我們的某個網站，我們可能會將您的網路或其他電子網路活動資訊、個人識別碼、地理位置資料和專業資訊（在可從您在我們網站上的活動中得出的範圍內）揭露給網站分析和廣告供應商，以便利用廣告 Cookie 進行跨情境行為或導向廣告。根據某些法律，您可能有權選擇接受或拒絕此類披露。若要進行選擇或查看我們與其出售或分享您的資訊的特定第三方的名稱，請點擊我們網頁底部的「管理 Cookie」連結。如果您不想出售或分享您的訊息，請確保將“廣告”和“分析”追蹤器的開關設為“否”，或在可用的情況下啟用“不出售或分享我的個人資訊”開關。
            <p>
              您還可以實施瀏覽器設定或擴充程序，將您的銷售和分享偏好自動傳達給您訪問的網站。我們的網站通過識別全球隱私控制 (GPC)，以順暢的方式處理此類「選擇退出偏好訊號」。如果您想使用 GPC，您可以透過參與活動的瀏覽器或瀏覽器擴充功能下載並啟用它。更多關於下載 GPC 的信息，請訪問 <a href="https://globalprivacycontrol.org/">這裡。</a>
            </p>
          </li>
        </ul>
        <ul>
          <li>
            <strong>
              與自動化決策和分析相關的權利
            <br /></strong>
            如果我們對您的個人資訊進行自動化處理，我們將提前向您提供法律要求的任何通知，包括有關您的權利的通知。
          </li>
        </ul>
        <ul>
          <li>
            <strong>直接行銷和「禁止追蹤」訊號 <br /></strong>
            在法律允許的情況下，您有權每年一次要求並獲得一份關於我們向其他企業披露的個人資訊的通知，該等資訊用於其他企業本身的直接行銷目的。如適用，該通知將包含已揭露的個人資訊類別清單（如有）以及所有已向其揭露個人資訊的第三方的名稱和地址（如有）。該通知將涵蓋上一日曆年。如果您想了解此權利是否適用於您，並行使此權利（如適用），您可以按照以下方式聯絡我們。
          </li>
        </ul>
        <p>
          請注意，上述一些權利可能因我們有優先的合法利益或法律、法規或合約義務需要繼續處理個人資訊，或根據適用法律個人資訊可能免於披露或刪除，則部分權利可能會受到限制。部分權利只能在特定情況下行使，或可能受到您所在司法轄區資料保護法律的限制。
        </p>
        <h2>跨境轉移 </h2>
        <p>
          作為一家業務遍及 80 多個國家的全球性公司，在某些情況下，我們需要將個人資訊傳輸至收集資訊的國家、省或地區之外的地區，以實現本隱私權聲明中概述的目的。具體而言，我們可能會傳輸資訊，以提供並管理向您提供的服務，並提高我們業務營運的效率。我們將竭盡全力確保此類傳輸符合所有相關的資料保護法規，並確保個人在這些法律下的權利和自由得到適當保障。
        </p>
        <p>
          如果需要進行此類轉移，我們將採取措施確保採取適當的保障措施來保護個人訊息，例如影響評估、適當監管機構的充分性決定、使用經批准的具有約束力的公司規則或標準合約條款，或您的同意。
        </p>
        <p>
          如需了解 MMC 的歐盟 (EU) 約束性公司規則 (EU BCR ) 如何運作，請點擊
          <a
            href="https://www.marshmclennan.com/content/dam/mmc-web/Archive/Images/Files/02March2022-EUBCR-Controller-and-Processor-Principles.pdf"
            >此處</a
          >。如需查看已同意受歐盟 BCR 約束的實體列表，請按
          <a href="https://www.marshmclennan.com/privacy-statement/bcr-entities.html"
            >此處</a
          >。&nbsp;
        </p>
        <p>
          如需了解 MMC 的英國約束性公司規則 (UK BCR) 如何運作，請點擊
          <a
            href="https://www.marshmclennan.com/content/dam/mmc-web/Archive/Images/Files/02March2022-UKBCR-Controller-and-Processor-Principles.pdf"
            >此處</a
          >。&nbsp; 如需查看已同意受英國 BCR 約束的實體列表，請按
          <a
            href="https://www.marshmclennan.com/privacy-statement/bcr-entities-uk.html"
            >此處</a
          >。
        </p>
        <h2>保留您的資訊</h2>
        <p>
          由於我們的產品、服務和監管義務十分複雜，因此我們對個人資訊的保留期限各不相同。在設定個人資訊和我們保存的記錄的保留期限時，我們會考慮以下義務：
        </p>
        <ul>
          <li>
            需要保留資訊以實現收集資訊的業務目的或合約義務；
          </li>
          <li>
            我們有責任執行客戶關於我們代表他們處理的個人資訊的指示；
          </li>
          <li>
            我們有義務遵守強制性的法律和監管記錄保存要求；
          </li>
          <li>
            我們的備份和災難復原程序；以及
          </li>
          <li>
            其他法律影響，例如適用的訴訟時效。
          </li>
        </ul>
        <p>
          基於上述因素，我們可能會在向您提供服務的期限結束後仍保留個人資訊。當我們不再需要保留個人資訊時，根據公司政策，我們會對資訊進行去識別化處理或匯總處理（在這種情況下，我們可能會進一步保留已去識別化或匯總的資訊並將其用於分析目的），或將其安全銷毀。
        </p>
        <h2>問題或疑慮 </h2>
        <p>
          如對本隱私權聲明或MTE 的隱私權慣例有任何疑問或要求，請發送電子郵件至 <a href="mailto:privacy@mmc.com">privacy@mmc.com</a>。如果您希望透過郵寄或電話聯絡我們，請聯絡您當地的資料保護官。您可以透過 <a href="mailto:privacy@mmc.com">privacy@mmc.com</a> 取得您當地資料保護官的聯絡資訊。
        </p>
