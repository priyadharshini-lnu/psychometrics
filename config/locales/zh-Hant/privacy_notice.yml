        </p>
        <h2>我們和您是什麼關係</h2>
        <p>
          第三方正在邀請您在 MTE 平台上完成一項評估。該第三方是 MTE 的客戶，可能是您的雇主、潛在雇主或其他相關方。 MTE 代表我們的客戶收集和處理您的個人資訊。我們遵循客戶提供的指示，以了解收集哪些個人資訊以及如何處理此類個人資訊。因此，MTE 作爲客戶的處理者，由客戶決定如何處理您的個人資訊。
        </p>
        <p>
          如果您對您的個人資訊處理有任何疑問，我們鼓勵您訪問我們客戶的隱私權聲明。
