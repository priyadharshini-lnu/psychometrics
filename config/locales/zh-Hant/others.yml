      campaign_start_instruction: |
        <h4>請正確閱讀下列說明。</h4>
        <p>您即將開始的任務是有時間限制的。 一旦您點選「開始」，活動計時器就會自動開始。 您有 %{minutes} 分鐘的時間來完成所有活動。 請務必在指定時間內完成任務，並有效管理時間，避免匆忙完成評估過程。 請務必一次完成任務，如果您需要休息，現在就是時候。</p>
      common_proctoring_instructions: |
        <h4>監考</h4>
        <p>按下「開始」按鈕後，您會被轉到我們的監考系統，它會在您的測驗過程中監控您的攝影機、麥克風和螢幕。 這些測驗會由我們精密的人工智能系統自動監考，提供不中斷且流暢的使用者體驗。 不過，測驗也可能由人工監考員審查。 任何不當行為或異常跡象都會被標記，這是為了確保沒有作弊企圖。 如果發現懷疑，您的任務將被取消。</p>
      lockdown_browser_instruction: |
        <h4>測驗瀏覽器</h4>
        <p>您需要下載並安裝一個特殊的瀏覽器來完成測驗任務。 請按照下一個畫面的指示進行操作。 您可以在完成所有必要的活動後卸載此軟體。</p>
