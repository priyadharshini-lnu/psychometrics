    <h2>Известие за бисквитки</h2>

    <p><strong>Дата на влизане в сила:</strong> 14 декември 2023 г.</p>

    <p>
    Ние използваме бисквитки и свързани технологии за проследяване, включително уеб маяци, проследяващи пиксели
    и лог файлове (наричани общо „бисквитки“) на този уебсайт, за да ви разграничим от другите потребители,
    да оценим и подобрим функционалността на уебсайта и нашите услуги и да ви осигурим добро потребителско изживяване.
    </p>

    <p><strong>КАКВО ПРЕДСТАВЛЯВА БИСКВИТКАТА</strong></p>

    <p>
    Бисквитките са малки части информация, които се споделят между вашия уеб браузър и даден уебсайт.
    Някои бисквитки са необходими, за да може уебсайтът да функционира. Други ни помагат да оценим и
    подобрим неговата производителност. Ние също използваме бисквитки, за да предоставяме подходящо
    съдържание, продукти и услуги. Бисквитката не може да чете данни от твърдия диск на вашия компютър.
    </p>

    <p>Съществуват различни видове бисквитки с различни функции:</p>

    <p>
    (i) <strong>Сесийни бисквитки</strong>: тези бисквитки се съхраняват на вашия компютър само по време
    на вашата уеб сесия. Те се изтриват автоматично, когато браузърът бъде затворен. Обикновено
    съхраняват анонимен идентификатор на сесията, който ви позволява да разглеждате уебсайт,
    без да се налага да влизате във всяка страница. Те не събират информация от вашия компютър.
    </p>

    <p>
    (ii) <strong>Постоянни бисквитки</strong>: тези бисквитки се съхраняват като файл на вашия компютър
    и остават там, когато затворите уеб браузъра. Те могат да бъдат прочетени от уебсайта, който
    ги е създал, когато посетите уебсайта отново.
    </p>

    <p>
    (iii) <strong>Бисквитки на първа страна</strong>: тези бисквитки се създават от нашата компания.
    Те се съхраняват и изпращат между нашите сървъри и твърдия диск на вашия компютър.
    Тези бисквитки могат да бъдат както сесийни, така и постоянни.
    </p>

    <p>
    (iv) <strong>Бисквитки на трети страни</strong>: тези бисквитки се създават от някой от нашите
    партньори трети страни. Те се съхраняват и изпращат между сървъра на третата страна и
    твърдия диск на вашия компютър. Обикновено това са постоянни бисквитки.
    </p>

    <p><strong>КАК И ЗАЩО ИЗПОЛЗВАМЕ БИСКВИТКИ</strong></p>

    <p>В зависимост от уебсайта можем да използваме бисквитки за следните цели:</p>

    <p><strong>Строго необходими</strong></p>

    <p>
    Тези бисквитки са от съществено значение, за да можете да се придвижвате в уебсайта и
    да използвате неговите функции, като например достъп до защитени области на сайта.
    Без тези бисквитки услугите, които сте поискали, като получаване на оферта или
    влизане във вашия акаунт, не могат да бъдат предоставени.
    </p>

    <p><strong>Функционалност</strong></p>

    <p>
    Тези бисквитки позволяват на нашия уебсайт да запомня избора, който правите
    (като потребителско име, език или регион) и да предоставя подобрени функции.
    Например уебсайтът може да запомни вашите данни за вход, така че да не се
    налага да влизате многократно в акаунта си.
    </p>

    <p>
    Тези бисквитки могат също да се използват за запомняне на промени,
    които сте направили в размера на текста, шрифта и други части на уеб страниците.
    Информацията, събрана чрез тези бисквитки, обикновено е анонимизирана.
    </p>

    <p><strong>Анализ</strong></p>

    <p>
    Тези бисквитки събират информация за това как посетителите използват уебсайта,
    например кои страници се посещават най-често и дали се получават съобщения
    за грешки. Това ни позволява да подобрим начина, по който работи нашият уебсайт.
    </p>

    <p><strong>Реклама</strong></p>

    <p>
    Тези бисквитки се използват за показване на реклами, които са подходящи за вас,
    както и за управление на ефективността на рекламите.
    </p>

    <p><strong>IP адреси</strong></p>

    <p>
    Когато посещавате нашия уебсайт, можем да събираме вашия IP адрес,
    за да проследяваме и обобщаваме неперсонална информация.
    </p>

    <p><strong>КАК ДА УПРАВЛЯВАТЕ БИСКВИТКИТЕ</strong></p>

    <p>
    Моля, кликнете върху връзката „Управление на бисквитките“ в долната част
    на страницата, за да приемете или откажете определени бисквитки чрез
    нашия Мениджър за съгласие за бисквитки.
    </p>

    <p>
    Можете също да деактивирате определени бисквитки чрез настройките на браузъра.
    Посетете секцията „Помощ“ на вашия браузър за повече информация.
    </p>

    <p><strong>ИЗВЕСТИЕТО ЗА БИСКВИТКИ НЕ ОБХВАЩА УЕБСАЙТОВЕ НА ТРЕТИ СТРАНИ</strong></p>

    <p>
    Когато включваме връзки към други уебсайтове, имайте предвид,
    че те имат свои собствени политики за поверителност и бисквитки.
    </p>

    <p><strong>ПРОМЕНИ В ИЗВЕСТИЕТО ЗА БИСКВИТКИ</strong></p>

    <p>
    Можем периодично да актуализираме тази политика.
    Насърчаваме ви да я преглеждате от време на време.
    </p>

    <p><strong>ОПИСАНИЕ НА ИЗПОЛЗВАНИТЕ БИСКВИТКИ</strong></p>

    <p>
    Кликнете върху връзката „Управление на бисквитките“ в долната част на сайта,
    за да видите подробности за използваните бисквитки.
    </p>

    <p><strong>СВЪРЖЕТЕ СЕ С НАС</strong></p>

    <p>
    Ако имате въпроси относно това Известие за бисквитки,
    моля свържете се с нас, както е посочено в нашето Известие за поверителност.
    </p>
