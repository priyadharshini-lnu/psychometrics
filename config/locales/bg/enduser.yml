    video_and_audio: Видео и аудио
    video_and_audio_recording: Запис на видео и аудио
    video_check_description: Това е системна проверка преди теста. Ще запишете 30-секундно видео, за да тествате аудио и видео. Моля, говорете непрекъснато и не спирайте, докато записът не приключи автоматично.
    video_check_fix_fifth: Опитайте да изключите и отново да включите камерата, ако тя е външна
    video_check_fix_first: Кликнете върху „Разреши“, когато браузърът поиска разрешение за достъп до камерата
    video_check_fix_fourth: Проверете дали камерата ви е свързана и включена
    video_check_fix_second: Отидете в настройките на браузъра и разрешете достъпа до камерата за този сайт
    video_check_fix_sixth: Рестартирайте браузъра си и опитайте отново
    video_check_fix_third: Затворете другите приложения, които използват камерата (Zoom, Teams и др.)
    video_overlay_label: Изберете микрофона и камерата си, натиснете бутона „Запис“, а след като натиснете бутона „Запис“, прочетете следното съобщение
    video_overlay_message: Изберете микрофона и камерата си, натиснете „Запис“, след което прочетете на глас и повторете 3 пъти изречението, което се появява в долната част на екрана.
    video_recorder_label: Видеорекордер
    video_upload_failed_camera_access: Не е възможно да се осъществи достъп до камерата или микрофона ви. Моля, проверете разрешенията на устройството си и опитайте отново.
    video_upload_failed_chunk_upload: Част от записа не е била качена. Моля, проверете интернет връзката си и опитайте отново.
    video_upload_failed_finalize: Записът беше заснета, но не можа да бъде запазен. Моля, опитайте отново.
    video_upload_failed_no_recording: Не беше открит запис за качване. Моля, запишете отново.
