    troubleshooting_guide_audio_second: Намерете настройките за „Микрофон“ и ги задайте на „Разреши“
    troubleshooting_guide_audio_seventh: Ако правата са активирани и е възникнал проблем при качването, стартирайте проверката отново и опитайте да качите аудиото пак
    troubleshooting_guide_audio_sixth: 'На Mac: Отворете „Системни настройки“ > „Сигурност“'
    troubleshooting_guide_audio_third: Опреснете страницата след промяна на правата
    troubleshooting_guide_browser_fifth: Уверете се, че LocalStorage е активирана в настройките на браузъра ви
    troubleshooting_guide_browser_first: 'Използвайте поддържан браузър: Chrome, Firefox, Edge или Safari (последните версии)'
    troubleshooting_guide_browser_fourth: Активирайте JavaScript и бисквитките в настройките на браузъра
    troubleshooting_guide_browser_second: Изчистете кеша и бисквитките на браузъра си
    troubleshooting_guide_browser_sixth: 'Опитайте да използвате прозорец за сърфиране в режим „инкогнито“/„частен“ (Забележка: LocalStorage може да се поддържа ограничено или изобщо да не се поддържа в режим „инкогнито“/„частен“)'
    troubleshooting_guide_browser_third: Деактивирайте разширенията на браузъра, които могат да попречат на достъпа до мултимедийни файлове
    troubleshooting_guide_network_fifth: Ако проблемът продължава, свържете се с доставчика си на интернет услуги за допълнителна помощ
    troubleshooting_guide_network_first: Затворете другите приложения, които може да използват трафик (стриминг на видео, изтегляне на файлове и др.)
    troubleshooting_guide_network_fourth: Опитайте да използвате друга мрежова връзка, ако има такава
    troubleshooting_guide_network_second: Приближете се до Wi-Fi рутера си или се свържете чрез Ethernet кабел
    troubleshooting_guide_network_third: Рестартирайте рутера/модема си и опитайте отново
    troubleshooting_guide_video_fifth: 'В Windows: Проверете настройките за поверителност > Достъп до камерата/микрофона'
    troubleshooting_guide_video_first: Кликнете върху иконата с катинара/информацията в адресната лента на браузъра си
    troubleshooting_guide_video_second: Намерете настройките за „Камера“ и „Микрофон“ и ги задайте на „Разреши“
    troubleshooting_guide_video_seventh: Ако правата са активирани и е възникнал проблем при качването, стартирайте проверката отново и опитайте да качите видеото пак
    troubleshooting_guide_video_sixth: 'На Mac: Отворете „Системни настройки“ > „Сигурност и поверителност“ > „Камера/Микрофон“'
    troubleshooting_guide_video_third: Опреснете страницата след промяна на правата
