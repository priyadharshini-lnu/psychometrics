            title: Компетентност
          c3:
            content: Този раздел включва вашите действия за разработка въз основа на модела за обучение 70-20-10, изброен по-долу. Препоръчително е да изберете комбинация от всеки от трите елемента, за да осигурите разнообразен подход за учене и развитие.
            title: Активност
          c4:
            content: Уверете се, че вашите срокове са реалистични въз основа на това кога целта може да бъде изпълнена. Променете това, както и когато е уместно.
            title: Хронология
          c5:
            content: Използвайте секцията за напредък, за да подпомогнете напредъка по идентифицираните маршрути.
            title: Напредък
        chart:
          collaboration: "<strong>20%</strong>Съвместни <br /> Учене"
          job: "<strong>70%</strong>Учене <br />на работното място"
          learn: "<strong>10%</strong>Формално обучение"
        content:
          list:
            r1: Моля, имайте предвид, че този списък е само ориентировъчен и могат да бъдат разгледани допълнителни пътища за развитие въз основа на индивидуалните ви амбиции, препоръките на вашия мениджър, както и бизнес приоритетите на организацията.
            r2: Потребителите се насърчават да преглеждат критично цялото съдържание и са свободни да променят, усъвършенстват, заменят или добавят действия или препоръки, с които не са съгласни.
            r3: 'Информацията за развитието, включена в този доклад, може да бъде извлечена от един или и от двата източника:'
            r3a: Персонализирана библиотека за разработка, създадена за вашата организация
            r3b: Предложения за развитие, генерирани от изкуствен интелект
            r4: Настоящият IDP доклад е изготвен с помощта на технологии за изкуствен интелект и може да съдържа неточности. Представените заключения и препоръки трябва да се тълкуват с резерви и да се използват единствено като инструмент за вашето лично и професионално развитие. Докладът е валиден за период от 12 до 18 месеца.
          main: Създаденият IDP включва подробен списък с дейности за развитие, които можете да предприемете, като имате предвид най-добрите практики за обучение, т.е. насоките 70-20-10, които осигуряват прогресивно развитие, съчетаващо обучение в клас, коучинг и обучение на работното място. Въз основа на резултатите от процеса на оценяване, вашите отговори в чата и външни доклади, ако е приложимо, са препоръчани възможни пътища за развитие, които могат да бъдат взети под внимание за вашето развитие.
        learn_cards:
          collaboration:
            list:
            - Предложете да бъдете ментор или коуч на други
            - Поискайте да бъдете наставлявани от експерт във вашата област
            - Намерете коуч, който да подкрепи вашето развитие
            - Създайте колаборативна работна група за обсъждане на текущи бизнес предизвикателства
            - Получавайте обратна връзка формално и неформално от други
            - Вземете активно участие в индустриални асоциации и мрежи
            - Изградете свои собствени външни мрежи
            title: Съвместно обучение (20%) <br/> Развитие чрез други
          job:
            list:
            - Поемете ръководни позиции в комитети на заинтересовани страни или управленски комитети
            - Доброволствайте да ръководите проекти за управление на промяната в организацията
            - Помислете за поемане на предизвикателни задачи
            - Работете съвместно с други функции
            - Помислете за ръководене на проекти извън вашата организация
            - Работете в тясно сътрудничество с външни експерти от индустрията по съвместни проекти
            title: Учене на работното място (70%) <br/> Развитие чрез опит
          learn:
            list:
            - Участвайте в структурирани програми за обучение
            - Завършени онлайн курсове за електронно обучение
            - Четете книги, статии, публикации
            - Придобиване на професионални квалификации, сертификати и акредитации
            - Посещавайте курсове, работни срещи, семинари
            title: Формално обучение (10%) <br/> Развитие чрез структурирано обучение
