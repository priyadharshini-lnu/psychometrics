    insights_reports: Прозрения и доклади
    instruction_modal:
      campaign_start_final_instructions: "<p>моля, имайте предвид, че няма начин да спрете или да паузирате таймера. Таймерът на кампанията ще продължи да работи дори когато затворите браузъра, така че в нито един момент не трябва да мислите да оставите задачите между тях, за да правите нещо друго. Не забравяйте да сведете до минимум разсейването по време на задачите. Намерете тиха среда, изключете известията на устройствата си и избягвайте многозадачна работа. Запазете концентрацията си и останете фокусирани. След като таймерът на кампанията изтече, няма да можете да продължите. Ако сте прочели горните инструкции, моля, кликнете върху старт, за да продължите възложените задачи</p>\n"
      campaign_start_instruction: |
        <h4>Моля, прочетете правилно следните инструкции.</h4>
        <p>задачите, които предстои да започнете, са с определено време. След като кликнете върху "Старт", таймерът на кампанията ще започне да работи автоматично. Разполагате с %{minutes} минути, за да завършите всички дейности. Моля, стремете се да завършите задачите в рамките на определеното време и управлявайте времето ефективно, за да не бързате в процеса на оценяване. Не забравяйте да завършите задачите наведнъж, така че ако имате нужда от почивка, сега е моментът</p>
      common_proctoring_instructions: |
        <h4>Proctoring</h4>
        <p>след като кликнете върху бутона "Старт", ще бъдете пренасочени към нашата система за прокториране. Тя ще следи камерата, микрофона и екрана ви по време на сесията. Тези сесии се прокторират автоматично от нашата усъвършенствана система с изкуствен интелект, което осигурява непрекъснато и гладко потребителско изживяване. Въпреки това сесиите могат да бъдат прегледани и от човешки проктори. Ще бъдат отбелязани всякакви признаци на неправомерно поведение или нередности. Това се прави, за да се гарантира, че не се правят опити за измама. Ако се открият подозрения, вашата задача(и) ще бъде(ат) отменена(и)</p>
      lockdown_browser_instruction: |
        <h4>Браузър за прокториране</h4>
        <p>ще трябва да изтеглите и инсталирате специален браузър, за да изпълните задачите за проктоконтрол. Моля, следвайте инструкциите на следващия екран. Можете да деинсталирате този браузър, след като завършите всички необходими дейности</p>
