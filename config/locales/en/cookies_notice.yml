    <h2>Cookie Notice</h2>

    <p><strong>Effective Date:</strong> December 14th 2023</p>

    <p>
    We use cookies and related tracking technologies, including web beacons, tracking pixels and log files
    (collectively referred to as “cookies”) on this website to distinguish you from other users, assess and
    improve functionality of the website and our services, and provide you with a good experience.
    </p>

    <p><strong>WHAT IS A COOKIE</strong></p>

    <p>
    Cookies are pieces of information shared between your web browser and a website. Some cookies are necessary
    for making the website work. Some help us assess and improve its performance. We also use cookies to help
    provide relevant content, products, and services to you. A cookie cannot read data from your computer's hard drive.
    </p>

    <p>There are different kinds of cookies with different functions:</p>

    <p>
    (i) <strong>Session cookies</strong>: these cookies are only stored on your computer during your web session.
    They are automatically deleted when the browser is closed. They usually store an anonymous session ID allowing
    you to browse a website without having to log in to each page. They do not collect any information from your computer.
    </p>

    <p>
    (ii) <strong>Persistent cookies</strong>: these cookies are stored as a file on your computer and remain there
    when you close your web browser. They can be read by the website that created them when you visit the website again.
    </p>

    <p>
    (iii) <strong>First-party cookies</strong>: these cookies are created by our company. They are stored and sent
    between our servers and your computer’s hard drive. These cookies may be either Session or Persistent cookies.
    </p>

    <p>
    (iv) <strong>Third-party cookies</strong>: these cookies are created by one of our third-party partners. They
    are stored and sent between the third-party’s server and your computer’s hard drive. These cookies are usually
    Persistent cookies.
    </p>

    <p><strong>HOW AND WHY WE USE COOKIES</strong></p>

    <p>Depending on the website, we may use cookies for the following purposes:</p>

    <p><strong>Where Strictly Necessary</strong></p>

    <p>
    These cookies are essential in order to enable you to move around the website and use its features, such as
    accessing secure areas of the website. Without these cookies, services you have asked for, such as obtaining
    a quote or logging into your account, cannot be provided. These cookies do not gather information about you
    that could be used for marketing or remembering where you have been on the internet.
    </p>

    <p><strong>Functionality</strong></p>

    <p>
    These cookies allow our website to remember choices you make (such as your username, language, or the region
    you are in) and provide enhanced features. For instance, a website may be able to remember your log in details,
    so that you do not have to repeatedly sign-in to your account when using a particular device to access our website.
    </p>

    <p>
    These cookies can also be used to remember changes you have made to text size, font, and other parts of web pages
    that you can customize. They may also be used to provide services you have requested such as viewing a video or
    commenting on an article. The information these cookies collect is usually de-identified.
    </p>

    <p><strong>Analytics</strong></p>

    <p>
    These cookies collect information about how visitors use a website, for instance which pages visitors go to
    most often, and if they get error messages from web pages. They also allow us to record and count the number
    of visitors to the website, enabling us to improve how our website works.
    </p>

    <p><strong>Advertising</strong></p>

    <p>
    These cookies are used for the purpose of displaying advertisements that will be relevant to you and for managing
    the performance of advertisements. Advertising cookies are generally third-party cookies and may be present even
    if there is no advertising in use on the website.
    </p>

    <p><strong>IP Addresses</strong></p>

    <p>
    When you visit our website, we may collect your Internet Protocol (“IP”) addresses to track and aggregate
    non-Personal Information. For example, we may use IP addresses to monitor the regions from which users
    navigate the website.
    </p>

    <p><strong>HOW TO MANAGE COOKIES</strong></p>

    <p>
    Please click the “Manage Cookies” link at the bottom of the page to opt in or out of certain cookies using
    our Cookie Consent Manager. Note that it is not possible to opt out of Strictly Necessary Cookies, so
    websites that only use such cookies may not provide this link.
    </p>

    <p>
    You can also disable certain cookies via browser settings. Visit the “Help” section of your browser for how
    to manage your cookie settings.
    </p>

    <p><strong>COOKIE NOTICE DOES NOT COVER THIRD PARTY WEBSITES</strong></p>

    <p>
    When we include links to other websites, please bear in mind they will have their own privacy and cookie
    policies that will govern the use of any information you submit. We recommend you read their policies as
    we are not responsible or liable for their privacy practices.
    </p>

    <p><strong>CHANGES TO THE COOKIE NOTICE</strong></p>

    <p>
    We may update this policy occasionally and we encourage you to review the policy from time to time to stay
    informed of how we are using cookies. We post the effective date of the policy at the top of the page.
    </p>

    <p><strong>DESCRIPTION OF COOKIES USED</strong></p>

    <p>
    Please click on the “Manage Cookies” link in the footer of the website to find details about the individual
    cookies used on the website. In some cases, this link may not be available; for example, where we only use
    Strictly Necessary Cookies.
    </p>

    <p><strong>CONTACT US</strong></p>

    <p>
    If you have any questions about this Cookie Notice, please contact us as indicated in our Privacy Notice.
    </p>
