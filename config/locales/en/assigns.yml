en:
  assigns:
    index:
      user_dashboard_button: 'User Dashboard'
      managers_dashboard_button: 'Managers Dashboard'
    assign: &assign
      questions:
        zero: "No Questions"
        one: "1 Question"
        other: "%{count} Questions"
      assigned: "Assigned %{date}"
      status:
        not_started: 'Start'
        in_progress: 'Resume'
        completed: 'Completed'
        overdue: 'Overdue'
      mindmill_confirmation: "Starting this assessment you will lost results \"%{assessment}\".
                              Click \"Cancel\" if you want leave results, and click \"Ok\" if you want continue"
    reports:
      results: "Results"
      load_results: "Load Results: %{report}"
    project_assessment:
      <<: *assign
    decorator:
      no_description: 'Description is empty'
      completed: "Completed %{date}"
      not_completed: "Not Completed"
    notifications:
      in_progress: "%{user_name} started to take assessment \"%{assessment_name}\""
      completed: "%{user_name} finished assessment \"%{assessment_name}\""
