      nomination:
        <h2>Nominations</h2>
        <p>You either need to nominate people to evaluate you, nominate people to evaluate your direct reports, or approve your direct reports’ nominations.</p>
        <h3>SET UP NOMINATIONS</h3>
        <p>Sometimes, you will be asked to nominate coworkers you want to evaluate you.</p><ol>
          <li><p>To nominate an evaluator, type their name or email to find them. Then define their relationship to you. Click <b>Nominate Evaluator</b>  when finished.</p></li>
          <li><p>If your manager is responsible for approving your nominations, remind them by clicking  <b>Email Approval Request</b> This option will not appear for everyone.</p></li>
          <li><p>Review the Approval and Evaluation status of your nominations.</p></li>
          <li><p>Remove a nomination by clicking the dropdown arrow and selecting <b>Remove</b>. This will not delete the data, but it will remove it from your report, and your evaluator won’t be able to retake this assessment.</p></li>
        </ol>
        <p>If you are a manager, you may also be asked to nominate evaluators for your direct reports. In that case, the process will look the same.</p>
        <h3>APPROVE NOMINATIONS</h3>
        <p>If you are a manager, you may be asked to approve the people your direct reports nominated to evaluate them. These evaluators will not be able to evaluate your direct report until you approve. Any email notifications set up will also not go out until the manager has approved a nomination.</p>
        <p>Approval technically takes place on the same screen where you’d set up your direct reports’ nominations, if you had that task.</p>​
        <ol>
          <li><p>Click <b>Approve All</b>  to approve all nominations on the page.</p></li>
          <li><p>Click <b>Deny All</b>  to deny all nominations on the page.</p></li>
          <li><p>Click the dropdown next to a particular nomination to approve or deny just that nomination. <b>Waiting</b> means you haven’t made a decision yet.</p></li>
        </ol>

      evaluation:
        <h2>Evaluations</h2>
        <p>There can be two different sections under Evaluations.</p>
        <h3>EVALUATIONS</h3>
        <p>Click on the person’s name to complete an evaluation of them.</p>
        <p>If you leave the page before you finish, you will be prompted to save.</p>
        <h3>APPROVE EVALUATIONS</h3>
        <p>This section only appears if you’re a manager and have been given permission to approve your direct reports’ evaluations. An evaluation will not be added to the data in your direct report’s report until you approve.</p>

        <ol>
          <li><p>Navigate between your direct reports.</p></li>
          <li><p>Navigate between your direct reports’ evaluators.</p></li>
          <li><p>Change the status of the evaluation to <b>Approved</b>  or <b>Denied</b>.</p></li>
        </ol>
        <p>You can also download a PDF of the evaluation you’re reviewing.</p>

      report:
        <h2>Report</h2>
        <p>There can be two different sections under Report.</p>
        <h3>VIEW REPORT</h3>
        <p>Here, you can view any reports you have access to. For most people, this is just their own.</p>
        <ol>
          <li><p>Change whose report you’re viewing.</p></li>
          <li><p>Determine if you are viewing the report as a subject or manager.</p></li>
          <li><p>Click the arrow to download your report. If you click the dropdown menu, you can also select <b>Download All Reports</b>  to download all the reports you have access to. All downloads are in PDF format.</p></li>
          <li><p>Click the email icon to send a copy of the report to the email associated with your login.</p></li>
        </ol>
        <h3>APPROVE REPORTS</h3>
        <p>If you are a manager, you may be asked to approve reports. Your direct report will not see their report until you approve it.</p>
        <p>On this page, you can switch between subject and manager views, download, and email these reports just as your would your own, with a few differences.</p>
        <ol>
          <li><p>Navigate between direct reports.</p></li>
          <li><p><b>Deny</b>  the report release.</p></li>
          <li><p>Approve the report for release.</p></li>
        </ol>
