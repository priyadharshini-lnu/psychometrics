        <h2>STEPS WE TAKE TO PROTECT PERSONAL INFORMATION&nbsp;</h2>
        <p>
          Our company strives to comply with all applicable cybersecurity and data
          protection laws. With these goals in mind, MMC has a dedicated Chief
          Information Security Officer (CISO) and a Global Chief Privacy Officer
          (GCPO). The CISO is responsible for managing a Global Information Security
          team and a comprehensive cybersecurity program.&nbsp; As part of our
          cybersecurity program, we have implemented commercially reasonable physical,
          administrative, and technical safeguards to protect Personal Information
          from unauthorized access, use, alteration, and deletion.&nbsp;&nbsp;&nbsp;
        </p>
        <p>
          The GCPO leads and oversees a Privacy Center of Excellence and a Data
          Protection Officer Network responsible for implementing our comprehensive
          global privacy program. The Data Protection Officer Network connects our
          Data Protection Officers across the world and seeks to implement our privacy
          program consistently and thoroughly wherever we process data. You can obtain
          the name and contact information for the Data Protection Officer in your
          jurisdiction by contacting us at privacy@mmc.com.
        </p>
        <h2>YOUR DATA PROTECTION RIGHTS&nbsp;</h2>
        <p>
          In many cases, we handle Personal Information to provide our services to
          corporate clients, and you should contact them to exercise any rights you
          may have under applicable privacy laws. However, where we act as the
          controller or business that is primarily responsible for deciding how your
          information is processed, you may have some or all the rights listed below,
          depending on the jurisdiction and our reason for processing your
          information. &nbsp;Please note that we may need to use your Personal
          Information to verify your identity prior to responding to any of the below
          rights.
        </p>
        <ul>
          <li>
            <strong>Right of access (Right to know)<br /></strong>You may ask us to
            provide you with further details on how we make use of your Personal
            Information, the sources, the categories or specific pieces of Personal
            Information we have collected, the categories of third parties to whom we
            have disclosed the information, and to request a copy of the Personal
            Information that we hold about you.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Right to correct<br /></strong>You may ask us to update any
            inaccuracies in the Personal Information we hold. If we disclose your
            Personal Information to others, we will tell them about the correction
            where possible.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Right to delete<br /></strong>You may ask us to erase your
            Personal Information where we no longer have lawful grounds to process it.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Right to object to or restrict processing<br /></strong>You may
            have a right to restrict the processing of your Personal Information in
            certain circumstances, such as where you contest its accuracy.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Right to data portability<br /></strong>You may have the right,
            where it is technically feasible, to ask that we transfer to a third party
            of your choice a copy of Personal Information we have obtained from you,
            in a structured, commonly used, and machine-readable format.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Right to withdraw consent<br /></strong>If we rely on your consent
            as our legal basis for processing your Personal Information, you have the
            right to withdraw that consent.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Right to lodge a complaint<br /></strong>You may have the right to
            lodge a complaint with the relevant supervisory or regulatory authority in
            your jurisdiction if you have a concern about any aspect of our privacy
            practices.
          </li>
        </ul>
