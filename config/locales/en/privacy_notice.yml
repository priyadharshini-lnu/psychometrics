        <h2>RETENTION OF YOUR INFORMATION&nbsp;</h2>
        <p>
          Our products, services, and regulatory obligations are complex, and thus our
          retention periods for Personal Information vary.&nbsp; We consider the
          following obligations when setting retention periods for Personal
          Information and the records we maintain:
        </p>
        <ul>
          <li>
            the need to retain information to accomplish the business purposes or
            contractual obligations for which it was collected;
          </li>
          <li>
            our duties to effectuate our clients’ instructions with respect to
            Personal Information we process on their behalf;
          </li>
          <li>
            our duties to comply with mandatory legal and regulatory record-keeping
            requirements;
          </li>
          <li>our backup and disaster recovery procedures; and</li>
          <li>
            other legal impacts such as the applicable statute of limitations periods.
          </li>
        </ul>
        <p>
          Based on the factors above, we may retain Personal Information beyond the
          period for which we provide services to you. When we no longer need to
          retain Personal Information, our company policies require that we either
          de-identify or aggregate the information (in which case we may further
          retain and use the de-identified or aggregated information for analytics
          purposes) or securely destroy it.&nbsp;
