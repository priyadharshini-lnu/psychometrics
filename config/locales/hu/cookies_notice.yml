    <h2>Sütikre vonatkozó közlemény</h2>

    <p><strong>Hatálybalépés napja:</strong> 2023. december 14.</p>

    <p>
    Ezen a webportálon sütiket és kapcsolódó nyomkövetési technológiákat használunk, ideértve a webjelzőket,
    a nyomkövető képpontokat és a naplófájlokat (együttesen: „sütik”), hogy megkülönböztessük Önt a többi
    felhasználótól, felmérjük és javítsuk a webportál és szolgáltatásaink funkcionalitását, valamint az
    Ön számára jó felhasználói élményt biztosítsunk.
    </p>

    <p><strong>MI AZ A SÜTI</strong></p>

    <p>
    A sütik az Ön webböngészője és egy webportál között megosztott információk. Egyes sütikre feltétlenül
    szükség van a webportál működéséhez. Néhány közülük a teljesítmény értékeléséhez és javításához nyújt
    segítséget. A sütiket arra is felhasználjuk, hogy releváns tartalmat, termékeket és szolgáltatásokat
    nyújtsunk Önnek. A süti nem tud leolvasni adatokat az Ön számítógépének merevlemezéről.
    </p>

    <p><strong>Különböző típusú sütik léteznek, különböző funkciókkal:</strong></p>

    <p>
    (i) <strong>Munkamenet-sütik:</strong> ezek a sütik csak a webes munkamenet időtartama alatt tárolódnak
    az Ön számítógépén. A böngésző bezárásakor automatikusan törlődnek. Általában egy névtelen
    munkamenet-azonosítót tárolnak, amely lehetővé teszi, hogy Ön böngészhessen egy webportálon anélkül,
    hogy minden oldalnál újra be kellene jelentkeznie.
    </p>

    <p>
    (ii) <strong>Tartós sütik:</strong> ezek a sütik fájlként tárolódnak a számítógépén, és ott maradnak
    azt követően is, hogy Ön bezárja a böngészőt. Az ezen sütiket létrehozó webportál képes elolvasni
    azokat, amikor Ön újra felkeresi az adott webportált.
    </p>

    <p>
    (iii) <strong>Saját sütik:</strong> ezeket a sütiket vállalatunk hozza létre. Ezek a mi kiszolgálóink
    és az Ön számítógépe merevlemezén kerülnek tárolásra, és ezek között kerülnek elküldésre.
    Ezek a sütik lehetnek munkamenet vagy tartós sütik is.
    </p>

    <p>
    (iv) <strong>Harmadik féltől származó sütik:</strong> ezeket a sütiket valamely harmadik fél partnerünk
    hozza létre. Ezek a harmadik fél kiszolgálóján és az Ön számítógépe merevlemezén kerülnek tárolásra,
    és ezek között kerülnek elküldésre. Ezek a sütik általában tartós sütik.
    </p>

    <p><strong>HOGYAN ÉS MIÉRT HASZNÁLUNK SÜTIKET</strong></p>

    <p>A webportáltól függően sütiket a következő célokra használhatunk:</p>

    <p><strong>Ahol mindenképpen szükséges</strong></p>

    <p>
    Ezek a sütik elengedhetetlenek ahhoz, hogy lehetővé tegyék Önnek a webportálon történő mozgást és
    a webportál funkcióinak használatát, például a webportál biztonságos területeihez való hozzáférést.
    </p>

    <p><strong>Funkcionalitás</strong></p>

    <p>
    Ezek a sütik lehetővé teszik webportálunk számára, hogy emlékezzen az Ön által megadott beállításokra
    (például a felhasználónevére, a nyelvre vagy a régióra), és továbbfejlesztett funkciókat kínáljon.
    </p>

    <p><strong>Elemzés</strong></p>

    <p>
    Ezek a sütik információkat gyűjtenek arról, hogy a látogatók hogyan használják a webportált,
    például hogy mely oldalakat látogatják leggyakrabban.
    </p>

    <p><strong>Reklámozás</strong></p>

    <p>
    Ezeket a sütiket az Ön számára releváns hirdetések megjelenítésére és a hirdetések teljesítményének
    kezelésére használjuk.
    </p>

    <p><strong>IP-címek</strong></p>

    <p>
    Amikor felkeresi webportálunkat, mi gyűjtjük az Ön Internet Protokoll („IP”) címeit a nem személyes
    adatok nyomon követése és összesítése céljából.
    </p>

    <p><strong>HOGYAN LEHET KEZELNI A SÜTIKET</strong></p>

    <p>
    Kérjük, kattintson az oldal alján található „Sütik kezelése” hivatkozásra, hogy a sütikre vonatkozó
    beleegyezéseket kezelő funkciónkkal be- vagy kikapcsolhasson bizonyos sütiket.
    </p>

    <p><strong>A SÜTIKRE VONATKOZÓ KÖZLEMÉNY NEM VONATKOZIK HARMADIK FELEK WEBPORTÁLJAIRA</strong></p>

    <p>
    Ha webportálunk más webportálokra mutató hivatkozásokat is tartalmaz, kérjük, vegye figyelembe,
    hogy azok saját adatvédelmi és süti szabályzatokkal rendelkeznek.
    </p>

    <p><strong>A SÜTIKRE VONATKOZÓ KÖZLEMÉNY MÓDOSÍTÁSAI</strong></p>

    <p>
    Alkalmanként frissíthetjük ezt a szabályzatot, ezért javasoljuk, hogy időnként tekintse át
    ezt az oldalt.
    </p>

    <p><strong>KAPCSOLAT</strong></p>

    <p>
    Ha bármilyen kérdése van a jelen Sütikre vonatkozó közleménnyel kapcsolatban,
    kérjük, vegye fel velünk a kapcsolatot az Adatvédelmi közleményben leírtak szerint.
    </p>
