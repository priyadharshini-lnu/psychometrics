            content: Ez a szakasz az alább felsorolt 70-20-10 tanulási modellen alapuló fejlesztési műveleteket tartalmazza. Javasoljuk, hogy mindhárom elem kombinációját válassza ki a változatos tanulási és fejlesztési megközelítés biztosítása érdekében.
            title: Tevékenység
