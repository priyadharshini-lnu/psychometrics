            content: Győződjön meg arról, hogy az ütemtervek reálisak attól függően, hogy mikor lehet teljesíteni a célt. Szükség szerint módosítsa ezt.
            title: Idővonal
          c5:
            content: A folyamat szakasz segítségével támogathatja az azonosított útvonalak előrehaladását.
            title: Haladás
        chart:
          collaboration: "<strong>20%</strong>Együttműködési <br /> Tanulás"
          job: "<strong>70%</strong>Tanulás <br />a munkában"
          learn: "<strong>10%</strong>Formális tanulás"
        content:
          list:
            r1: Felhívjuk figyelmét, hogy ez a lista csak tájékoztató jellegű, és az Ön egyéni törekvései, vezetője ajánlásai, valamint a szervezet üzleti prioritásai alapján további fejlődési lehetőségek is szóba jöhetnek az Ön esetében.
            r2: A felhasználókat arra ösztönözzük, hogy minden tartalmat kritikus szemmel vizsgáljanak meg, és szabadon módosítsák, finomítsák, cseréljék ki vagy egészítsék ki azokat a tevékenységeket vagy ajánlásokat, amelyekkel nem értenek egyet.
            r3: 'A jelentésben szereplő fejlesztési adatok az alábbi források egyikéből vagy mindkettőből származhatnak:'
            r3a: Az Ön szervezetének igényeihez igazított fejlesztői könyvtár
            r3b: AI által generált fejlesztési javaslatok
            r4: Ez az IDP-jelentés mesterséges intelligencia segítségével készült, ezért pontatlanságokat tartalmazhat. A jelentésben szereplő megállapításokat és ajánlásokat körültekintéssel kell értelmezni, és kizárólag személyes és szakmai fejlődésének elősegítésére szabad felhasználni. A jelentés 12–18 hónapig érvényes.
          main: Az elkészített IDP tartalmazza a végrehajtható fejlesztési intézkedések részletes listáját, figyelembe véve a bevált gyakorlatokat, azaz a 70-20-10 irányelvet, amely az osztálytermi tanulást, a coachingot és a munkahelyi tanulást ötvöző, fokozatos fejlődési utat biztosít. Az értékelő központ folyamatának eredményei, a csevegési válaszok és a külső jelentések alapján, adott esetben, lehetséges fejlesztési útvonalakat javasoltunk, amelyeket figyelembe vehet a fejlődése érdekében.
        learn_cards:
          collaboration:
            list: '[HU] ["Offer to coach or mentor others", "Request to be mentored by an expert in your field", "Attain a coach to support your development", "Set-up a collaborative working group to discuss on going challenges in the business", "Get feedback formally and informally from others", "Play an active role in industry associations and networks", "Build your own external networks"]'
            title: Kollaboratív tanulás (20%) <br/> Fejlődés másokon keresztül
          job:
            list: '[HU] ["Assume leadership positions in stakeholder or management committees", "Volunteer to lead change management projects for the organization", "Consider taking on stretching assignments", "Work cross-collaboratively with other functions", "Consider leading projects outside your organization", "Work closely with external industry experts on joint-projects"]'
            title: Munkahelyi tanulás (70%) <br/> Fejlődés tapasztalaton keresztül
          learn:
            list:
            - Vegyen részt strukturált képzési programokban
            - Teljes online e-learning tanfolyamok
            - Olvasson könyveket, cikkeket, kiadványokat
            - Szerezzen szakmai képesítéseket, tanúsítványokat és akkreditációkat
            - Vegyen részt tanfolyamokon, műhelyeken, szemináriumokon
            title: Formális tanulás (10%) <br/> Fejlődés strukturált tanulással
