            title: 進展
        chart:
          collaboration: "<strong>20%</strong>協作式<br />學習"
          job: "<strong>70%</strong>在職<br />學習"
          learn: "<strong>10%</strong>正式學習"
        content:
          list:
            r1: 请注意，此列表仅供参考，根据个人职业规划、主管建议以及组织业务优先级，您可能还有其他发展路径可供选择。
            r2: 鼓励用户对所有内容进行批判性审查，并可自由修改、完善、替换或补充任何不同意的操作或建议。
            r3: 本报告所载的发展投入可能源自以下一个或两个来源：
            r3a: 专为贵组织定制的开发库
            r3b: 人工智能生成的开发建议
            r4: 本IDP报告是在人工智能技术的辅助下生成的，可能存在不准确之处。报告中提供的见解和建议应谨慎解读，仅作为您个人和职业发展的参考工具。本报告的有效期为12至18个月。
          main: 该个人发展计划包含一份详细的发展行动清单，供您实施时参考最佳实践学习法则——即70-20-10原则。该原则构建了融合课堂学习、辅导指导与在职实践的渐进式发展路径。基于评估中心流程结果、您的对话反馈及外部报告（如适用），现已为您推荐若干潜在发展路径，可作为个人发展的参考方向。
        learn_cards:
          collaboration:
            list:
            - 提供給他人指導或導師服務
            - 請求領域專家作為你的導師
            - 獲得一位教練支持你的發展
            - 建立一個協作工作組，討論業務中的持續挑戰
            - 從他人那裡正式和非正式地獲取反饋
            - 在行業協會和網絡中發揮積極作用
            - 建立自己的外部網絡
            title: 協作學習(20%)<br/>通過他人發展
          job:
            list:
            - 在利益相關者或管理委員會中擔任領導職位
            - 自願領導組織的變革管理項目
            - 考慮承擔有挑戰性的任務
            - 與其他職能部門跨部門協作
            - 考慮領導組織外的項目
            - 與外部行業專家在聯合項目上密切合作
            title: 在職學習(70%)<br/>通過經驗發展
          learn:
            list:
            - 参加结构化培训项目
            - 完成在线电子学习课程
            - 阅读书籍、文章、出版物
            - 获取专业资格、认证及资质认证
            - 参加课程、工作坊、研讨会
            title: 正式學習(10%)<br/>通過結構化學習發展
        title: 国际驾驶许可证指南
