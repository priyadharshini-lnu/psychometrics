            r3: 在制定個人發展計劃時，請考慮以下推薦的路徑。
          main: 本部分包括所有發展路徑的累積列表，考慮到最佳學習實踐，即70-20-10指南，它提供了結合課堂學習、輔導和在職學習的漸進式旅程。基於領導力發展經驗和業務優先事項的成果，已推薦可能的發展路徑，可以考慮用於你的發展。
