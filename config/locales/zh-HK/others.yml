        <h4>監察</h4>
        <p>
          點擊開始按鈕後，您將被重新轉向我們的監察系統。在會話期間，它將監控您的鏡頭、咪高峰和螢幕。這些會話由我們先進的人工智能系統自動監督，提供不間斷和順暢的用戶體驗。然而，會話也可能由人工監察審查。任何不當行為或違規行為跡象都將被標記。這樣做是為了確保沒有作弊企圖。如果發現可疑情況，您的任務將被取消。
        </p>
