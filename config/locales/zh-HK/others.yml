        <p>
          您即將開始的任務已計時。點擊「開始」後，市場推廣計時器將自動開始。您有 %{minutes} 分鐘完成所有活動。請盡力在指定時間範圍內完成任務，並好好管理時間，避免匆忙完成評估程序。請務必一次過完成任務，如果您需要休息，現在是時候了。
        </p>
      common_proctoring_instructions: |
        <h4>監察</h4>
        <p>
          點擊開始按鈕後，您將被重新轉向我們的監察系統。在會話期間，它將監控您的鏡頭、咪高峰和螢幕。這些會話由我們先進的人工智能系統自動監督，提供不間斷和順暢的用戶體驗。然而，會話也可能由人工監察審查。任何不當行為或違規行為跡象都將被標記。這樣做是為了確保沒有作弊企圖。如果發現可疑情況，您的任務將被取消。
        </p>
      lockdown_browser_instruction: |
        <h4>監察瀏覽器</h4>
        <p>
          您將需要下載並安裝特殊瀏覽器以完成監察任務。請按照下一個畫面中的指引操作。完成所有必要活動後，您可以卸載此功能。
        </p>
