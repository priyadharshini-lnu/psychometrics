    <h2>إخطار ملفات تعريف الارتباط</h2>

    <p>تاريخ السريان: 14 ديسمبر 2023</p>

    <p>نستخدم ملفات تعريف الارتباط وتقنيات التتبع ذات الصلة، بما في ذلك إشارات الويب، ووحدات البكسل للتتبع وملفات السِجل (يُشار إليها مجتمعة باسم "ملفات تعريف الارتباط") على هذا الموقع الإلكتروني لتمييزك عن المستخدمين الآخرين، وتقييم وتحسين وظائف الموقع الإلكتروني وخدماتنا وتزويدك بتجربة جيدة.</p>

    <p><strong>ما هو ملف تعريف الارتباط</strong></p>

    <p>ملفات تعريف الارتباط هي أجزاء من المعلومات التي تتم مشاركتها بين متصفح الويب الخاص بك وموقع إلكتروني. بعض ملفات تعريف الارتباط ضرورية لتشغيل الموقع الإلكتروني. وبعضها يساعدنا على تقييم أدائه وتحسينه. كما نستخدم ملفات تعريف الارتباط للمساعدة في تقديم المحتوى والمنتجات والخدمات ذات الصلة بك. لا يمكن لملف تعريف الارتباط قراءة البيانات من القرص الصلب لجهاز الكمبيوتر الخاص بك.</p>

    <p>هناك أنواع مختلفة من ملفات تعريف الارتباط بوظائف مختلفة:</p>

    <p>(1) ملفات تعريف الارتباط الخاصة بالجلسة: يتم تخزين ملفات تعريف الارتباط هذه على جهاز الكمبيوتر الخاص بك أثناء جلسة الويب فقط. يتم حذفها تلقائيًا عند إغلاق المتصفح. وعادةً ما تقوم بتخزين معرف جلسة بصفة مجهول، ما يسمح لك بتصفح موقع إلكتروني دون الحاجة إلى تسجيل الدخول إلى كل صفحة. لا تجمع ملفات الارتباط هذه أيّ معلومات من جهاز الكمبيوتر الخاص بك.</p>

    <p>(2) ملفات تعريف الارتباط الدائمة: يتم تخزين ملفات تعريف الارتباط هذه كملف على جهاز الكمبيوتر الخاص بك وتبقى مخزنةً هناك حتى بعد إغلاق متصفح الويب الخاص بك. يمكن قراءتها بواسطة الموقع الإلكتروني الذي أنشأها عند زيارتك الموقع مرة أخرى.</p>

    <p>(3) ملفات تعريف الارتباط للطرف الأول: تقوم شركتنا بإنشاء ملفات تعريف الارتباط هذه. يتم تخزينها وإرسالها بين خوادمنا ومحرك القرص الصلب في جهاز الكمبيوتر الخاص بك. قد تكون ملفات تعريف الارتباط هذه إما ملفات تعريف ارتباط خاصة بالجلسة أو ملفات تعريف ارتباط دائمة.</p>

    <p>(4) ملفات تعريف ارتباط الطرف الثالث: يتم إنشاء ملفات تعريف الارتباط هذه بواسطة أحد شركائنا من الأطراف الثالثة. ويتم تخزينها وإرسالها بين خادم الطرف الثالث ومحرك القرص الصلب في جهاز الكمبيوتر الخاص بك. عادةً ما تكون ملفات تعريف الارتباط هذه ملفات تعريف ارتباط دائمة.</p>

    <p><strong>كيف نستخدم ملفات تعريف الارتباط ولماذا نستخدمها</strong></p>

    <p>بناءً على الموقع الإلكتروني، قد نستخدم ملفات تعريف الارتباط للأغراض التالية:</p>

    <p><strong>عند الضرورة القصوى</strong></p>

    <p>تُعدّ ملفات تعريف الارتباط هذه ضرورية لتمكينك من التنقل في الموقع الإلكتروني واستخدام ميزاته، مثل الوصول إلى المناطق الآمنة من الموقع الإلكتروني. لا يمكن تقديم الخدمات التي طلبتها، مثل الحصول على عرض أسعار أو تسجيل الدخول إلى حسابك بدون ملفات تعريف الارتباط هذه. لا تجمع ملفات تعريف الارتباط هذه معلوماتٍ يمكن استخدامها في تحديد أو تذكر مكان وجودك على شبكة الإنترنت.</p>

    <p><strong>الوظيفة</strong></p>

    <p>تتيح ملفات تعريف الارتباط هذه لموقعنا الإلكتروني تذكر اختياراتك (مثل اسم المستخدم الخاص بك أو لغتك أو المنطقة التي تتواجد بها) وتوفير ميزات محسَّنة. على سبيل المثال، قد يكون الموقع الإلكتروني قادرًا على تذكر تفاصيل تسجيل الدخول الخاصة بك، حتى لا تضطر إلى تسجيل الدخول بشكل متكرر إلى حسابك عند استخدام جهاز معين للوصول إلى موقعنا الإلكتروني. يمكن أيضًا استخدام ملفات تعريف الارتباط هذه لتتذكر التغييرات التي أجريتها على حجم النص والخط والأجزاء الأخرى من صفحات الويب القابلة للتخصيص. كما يمكن استخدامها لتقديم الخدمات التي طلبتها مثل مشاهدة مقطع فيديو أو التعليق على مقال. عادةً ما يتم إلغاء تحديد هوية المعلومات التي تجمعها ملفات تعريف الارتباط هذه. فهي لا تجمع أيّ معلومات عنك يمكن استخدامها للإعلان أو تذكّر مكان تواجدك على الإنترنت.</p>

    <p><strong>التحليلات</strong></p>

    <p>تجمع ملفات تعريف الارتباط هذه معلوماتٍ حول كيفية استخدام الزوار للموقع الإلكتروني، على سبيل المثال: الصفحات التي يرتادها الزوار في أغلب الأحيان وما إذا كانوا يتلقون رسائل خطأ من صفحات الويب. كما أنها تسمح لنا بتسجيل وإحصاء عدد زوار الموقع، لنتمكّن من معرفة كيفية استخدام الزوار للموقع من أجل تحسين أداء موقعنا.</p>

    <p><strong>الإعلانات</strong></p>

    <p>تُستخدم ملفات تعريف الارتباط هذه في عرض الإعلانات التي ستكون ذات صلة بك ولإدارة أداء الإعلانات. ملفات تعريف الارتباط الخاصة بالإعلانات هي بشكل عام ملفاتُ تعريف ارتباط طرف ثالث وقد تكون موجودة حتى وإن لم يكن هناك إعلانات قيد الاستخدام على الموقع الإلكتروني.</p>

    <p><strong>عناوين بروتوكول الإنترنت</strong></p>

    <p>عند زيارتك لموقعنا الإلكتروني، قد نجمع عناوين بروتوكول الإنترنت ("IP") الخاصة بك لتتبع المعلومات غير الشخصية وتقييمها. قد نستخدم عناوين بروتوكول الإنترنت لمراقبة المناطق التي يأتي منها المستخدمون إلى الموقع الإلكتروني.</p>

    <p><strong>كيفية إدارة ملفات تعريف الارتباط</strong></p>

    <p>يُرجى النقر فوق رابط "إدارة ملفات تعريف الارتباط" الموجود أسفل الصفحة لقبول أو رفض استخدام ملفات تعريف ارتباط معينة باستخدام مدير الموافقة على ملفات تعريف الارتباط. نحيطكم علمًا أنه من غير الممكن رفض استخدام ملفات تعريف الارتباط الضرورية للغاية، لذا فإن المواقع الإلكترونية التي تستخدم ملفات تعريف الارتباط هذه فقط قد لا تُوفر هذا الرابط.</p>

    <p>يمكنك أيضًا رفض استخدام ملفات تعريف ارتباط مُعيّنة في إعدادات المتصفح. تفضل بزيارة قسم "Help" (المساعدة) في متصفحك لمعرفة كيفية إدارة إعدادات ملفات تعريف الارتباط الخاصة بك.</p>

    <p>إشعار ملفات تعريف الارتباط لا يغطي المواقع الإلكترونية الخاصة بالطرف الثالث (الخارجية)</p>

    <p>عندما نقوم بتضمين روابط لمواقع إلكترونية أخرى، يُرجى الانتباه إلى أنه سيكون لديهم سياسات خصوصية وسياسات ملفات تعريف ارتباط خاصة بهم، والتي ستحكم استخدام أي معلومات تقدمها. نوصيك بقراءة سياساتهم لأننا لن نكون مسؤولين عن ممارسات الخصوصية الخاصة بهم.</p>

    <p><strong>التغييرات في إشعار ملفات تعريف الارتباط</strong></p>

    <p>قد نقوم بتحديث هذه السياسة، لذا فإننا نشجعكم على مراجعتها من وقت إلى آخر لتكونوا على علم بكيفية استخدامنا لملفات تعريف الارتباط. سننشر تاريخ سريان السياسة في أعلى الصفحة.</p>

    <p><strong>وصف ملفات تعريف الارتباط المستخدَمة</strong></p>

    <p>يُرجى النقر فوق رابط "Manage Cookies" (إدارة ملفات تعريف الارتباط) في أسفل الصفحة للاطلاّع على تفاصيل حول ملفات تعريف الارتباط الفردية المستخدمَة على الموقع الإلكتروني. في بعض الحالات، قد لا يكون هذا الرابط متاحًا؛ على سبيل المثال، عندما لا نستخدم إلّا ملفات تعريف الارتباط الضرورية للغاية فحسب.</p>

    <p><strong>اتصل بنا</strong></p>

    <p>إذا كانت لديك أي أسئلة حول إشعار ملفات تعريف الارتباط هذا، يُرجى الاتصال بنا كما هو موضح في إشعار الخصوصية أدناه.</p>
