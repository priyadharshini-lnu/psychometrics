    insights_reports: رؤى وتقارير
    instruction_modal:
      campaign_start_final_instructions: |
        <p>
        يرجى العلم أنه لا توجد طريقة لإيقاف المؤقت أو إيقافه تماماً. سيستمر مؤقت الحملة في العمل حتى عندما تغلق المتصفح ، لذا لا يجب أن تفكر في أي وقت في ترك المهام  للقيام بشيء آخر. تأكد من تقليل الانحرافات أثناء المهام. ابحث عن بيئة هادئة وأوقف تشغيل الإشعارات على أجهزتك وتجنب تعدد المهام. حافظ على تركيزك. بمجرد نفاد مؤقت الحملة ، لن تتمكن من المتابعة. إذا كنت قد قرأت التعليمات المذكورة أعلاه ، فيرجى النقر "إبدأ" لمتابعة المهام المعينة.
        </p>
      campaign_start_instruction: |
        <h4>يرجى قراءة التعليمات التالية بشكل دقيق.</h4>
        <p>
        المهمة (المهام) التي أنت على وشك أن تبدأها محددة بوقت. بمجرد النقر فوق "ابدأ" ، سيبدأ مؤقت الحملة تلقائيًا. لديك %{minutes} دقيقة لإكمال جميع الأنشطة. يرجى أن تهدف إلى إكمال المهام في الإطار الزمني المحدد وإدارة الوقت بشكل فعال لتجنب التسرع في عملية التقييم. تأكد من إكمال المهام دفعة واحدة ، لذلك إذا كنت بحاجة إلى أخذ قسط من الراحة ، فقد حان الوقت الآن.
        </p>
      common_proctoring_instructions: |
        <h4>مراقبة</h4>
        <p>
        عند النقر فوق الزر "ابدأ" ، ستتم إعادة توجيهك إلى نظام المراقبة الخاص بنا. ستراقب الكاميرا والميكروفون والشاشة أثناء جلستك. تتم مراقبة هذه الجلسات تلقائيًا بواسطة نظام الذكاء الاصطناعي المتطور لدينا ، مما يوفر تجربة مستخدم سلسة ومتواصلة. ومع ذلك ، يمكن أيضًا مراجعة الجلسات من قبل مراقبي البشر. سيتم الإبلاغ عن أي علامات لسوء السلوك أو المخالفات. يتم القيام بذلك للتأكد من عدم حدوث أي محاولات غش. إذا وجدت شكوكًا ، فسيتم إلغاء مهمتك (مهامك).
        </p>
      lockdown_browser_instruction: |
        <h4>متصفح المراقبة</h4>
        <p>
        سيُطلب منك تنزيل متصفح خاص وتثبيته لإكمال المهام المراقبة. يرجى اتباع التعليمات في الشاشة التالية. يمكنك إلغاء تثبيت هذا بعد الانتهاء من جميع الأنشطة المطلوبة.
        </p>
