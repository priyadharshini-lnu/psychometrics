          list:
            r1: يرجى ملاحظة أن هذه القائمة استرشادية فقط، وقد يتم النظر في مسارات تطوير إضافية بناءً على طموحاتك الفردية، وتوصيات مديرك، وأولويات العمل التنظيمية
            r2: يشجَّع المستخدمون على مراجعة جميع المحتويات بشكل نقدي، ولهم الحرية في تعديل أو تحسين أو استبدال أو إضافة أي إجراءات أو توصيات لا يوافقون عليها
            r3: قد تكون مدخلات التطوير المدرجة في هذا التقرير مُستخلصة من أحد المصادر التالية أو كليهما
            r3a: مكتبة تطوير مخصصة تم إعدادها لجهة عملكم
            r3b: مقترحات تطوير مولّدة بواسطة الذكاء الاصطناعي
            r4: تم إعداد تقرير خطة التطوير الفردية بمساعدة تقنية الذكاء الاصطناعي، وقد يحتوي على بعض الأخطاء. لذا، يُرجى التعامل مع المعلومات والتوصيات الواردة فيه بحذر، واستخدامها فقط كأداة للتطوير الشخصي والمهني الخاص بكم. تتراوح صلاحية التقرير ما بين ١٢ و١٨ شهرًا.
          main: تتضمن خطة التطوير الفردية التي تم إعدادها قائمة مفصلة بالإجراءات التطويرية التي يمكنك تنفيذها، مع مراعاة أفضل ممارسات التعلم مثل نموذج 70-20-10، الذي يوفّر مسارًا تدريجيًا يجمع بين التعلم الصفّي، والتوجيه، والتعلم أثناء العمل. واستنادًا إلى نتائج عملية مركز التقييم، وإجاباتك في المحادثة، والتقارير الخارجية (حسب الاقتضاء)، تم اقتراح مسارات تطوير محتملة يمكن النظر فيها لدعم تطوّرك
        learn_cards:
          collaboration:
            list:
            - بادر بتقديم التوجيه أو الإرشاد للآخرين
            - اُطلب تقديم الإرشاد من قبل خبير في مجالك
            - استعن بمدرب لدعم مسار تطويرك
            - أنشِئ مجموعة عمل تعاونية لمناقشة التحديات المستمرة في العمل
            - احصل على ملاحظات (تغذية راجعة) بشكل رسمي وغير رسمي من الآخرين
            - شارك بشكل فعّال في الجمعيات والشبكات المهنيّة
            - قُم ببناء شبكاتك الخارجية الخاصة
            title: التعلم التعاوني (20%)، التطوير من خلال الآخرين
          job:
            list:
            - تولّى المناصب القيادية في لجان أصحاب المصلحة أو اللجان الإدارية
            - تطوّع لقيادة مشاريع إدارة التغيير للمنظمة
            - انظر في قبول مهام تتطلب تحدياتٍ إضافية
            - قُم بالعمل بشكل تعاوني مع الإدارات الأخرى
            - انظر في قيادة مشاريع خارج منظمتك
            - قُم بالعمل عن كثب مع خبراء المجال الخارجيين في المشاريع المشتركة
            title: التعلم أثناء العمل (70%)، التطوير من خلال الخبرة
          learn:
            list:
            - شارك في برامج تدريبية منظمة
            - أكمل دورات التعلّم الإلكتروني
            - اقرأ الكتب والمقالات والمنشورات
            - قُم بتحصيل المؤهلات المهنية والشهادات والاعتمادات
            - شارك في الدورات، وورش العمل، والنّدوات
            title: التعلم الرسمي (10%)، التطوير من خلال التعلّم المنظّم
        title: إرشادات لتوجيه خطة التطوير الفردية الخاصة بك
