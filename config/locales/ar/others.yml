      guidelines:
        cards:
          c1:
            content: اذكر المهارات والمعارف والقدرات التي تحتاج إلى تطوير. تأكد من أنها محددة وقابلة للقياس والتنفيذ وواقعية، ويمكن تحقيقها بشكل معقول ضمن الجداول الزمنية المذكورة.
            title: أهداف التطوير
          c2:
            content: يعتمد هذا على الكفاءة التي يتعين تطويرها بناءً على تجربة التقييم.
            title: الكفاءة
          c3:
            content: يتضمن هذا القسم إجراءات التطوير الخاصة بك بناءً على نموذج التعلم 70-20-10 المذكور أدناه. يُنصح باختيار مجموعة من كل من العناصر الثلاثة لضمان نهج متنوع للتعلم والتطوير.
            title: النشاط
          c4:
            content: تأكد من أن جداولك الزمنية واقعية بناءً على وقت إمكانية إكمال الهدف. قم بتعديلها عند الاقتضاء وعندما يكون ذلك مناسبًا.
            title: الجدول الزمني
          c5:
            content: استخدم قسم التقدم لدعم التقدم في المسارات المحددة.
            title: التقدم
        chart:
          collaboration: "<strong>20٪</strong>التعلم <br /> التعاوني"
          job: "<strong>70٪</strong>التعلم <br />أثناء العمل"
          learn: "<strong>10٪</strong>التعلم الرسمي"
        content:
          list:
            r1: يرجى ملاحظة أن هذه القائمة إرشادية فقط، ويمكن النظر في مسارات تطوير إضافية لك بناءً على التطلعات الفردية، وتوصيات مديرك وكذلك أولويات العمل التنظيمية.
            r2: يرجى ملاحظة أن إطلاق بعض مسارات التطوير هذه سيعتمد على استراتيجية التعليم والتعلم على مستوى المؤسسة.
            r3: يرجى النظر في المسارات الموصى بها كما هو موضح أدناه، عند تطوير خطة التطوير الفردية الخاصة بك.
          main: يتضمن هذا القسم قائمة تراكمية بجميع مسارات التطوير، مع مراعاة أفضل ممارسات التعلم، أي توجيهات 70-20-10، والتي توفر رحلة تدريجية تجمع بين التعلم في الفصل الدراسي والتدريب والتعلم أثناء العمل. بناءً على نتائج تجربة تطوير القيادة وأولويات العمل، تم التوصية بمسارات تطوير محتملة، والتي يمكن النظر فيها لتطويرك.
        learn_cards:
          collaboration:
            list:
            - تقديم التدريب أو الإرشاد للآخرين
            - طلب الإرشاد من خبير في مجالك
            - الحصول على مدرب لدعم تطويرك
            - إنشاء مجموعة عمل تعاونية لمناقشة التحديات المستمرة في العمل
            - الحصول على التغذية الراجعة بشكل رسمي وغير رسمي من الآخرين
            - القيام بدور فعال في جمعيات وشبكات الصناعة
            - بناء شبكاتك الخارجية الخاصة
            title: التعلم التعاوني (20٪) <br/> التطوير من خلال الآخرين
          job:
            list:
            - تولي مناصب قيادية في لجان أصحاب المصلحة أو الإدارة
            - التطوع لقيادة مشاريع إدارة التغيير للمؤسسة
            - النظر في تولي مهام تمدد القدرات
            - العمل بشكل تعاوني مع الوظائف الأخرى
            - النظر في قيادة المشاريع خارج مؤسستك
            - العمل بشكل وثيق مع خبراء الصناعة الخارجيين في المشاريع المشتركة
            title: التعلم أثناء العمل (70٪) <br/> التطوير من خلال الخبرة
          learn:
            list:
            - تولي مناصب قيادية في لجان أصحاب المصلحة أو الإدارة
            - التطوع لقيادة مشاريع إدارة التغيير للمؤسسة
            - النظر في تولي مهام تمدد القدرات
            - العمل بشكل تعاوني مع الوظائف الأخرى
            - النظر في قيادة المشاريع خارج مؤسستك
            - العمل بشكل وثيق مع خبراء الصناعة الخارجيين في المشاريع المشتركة
            title: التعلم الرسمي (10٪) <br/> التطوير من خلال التعلم المنظم
