      <p>
      قد نستخدم أيضًا المعلومات الشخصية التي نجمعها ونتلقاها بطرق أخرى كما نصف لك عند نقطة الجمع.
      </p>

      <h3><strong>روابط خارجية</strong></h3>

      <p>
      قد تتضمن مواقعنا روابط لمواقع إلكترونية تُدار من جهات غير MTE. إذا دخلت موقع جهة أخرى عبر رابط في موقعنا، فقد تجمع تلك الجهة معلومات منك. لا تتحمل MTE مسؤولية محتوى المواقع المرتبطة أو ممارسات الخصوصية فيها أو استخدامها لمعلوماتك الشخصية. وإذا غادرت موقع MTE عبر هذا النوع من الروابط (يمكنك معرفة موقعك عبر عنوان URL في شريط المتصفح)، فينبغي الرجوع إلى سياسات الخصوصية وشروط الاستخدام والإشعارات الأخرى الخاصة بذلك الموقع لمعرفة كيفية تعامل تلك الجهة مع أي معلومات شخصية تجمعها منك.
      </p>

