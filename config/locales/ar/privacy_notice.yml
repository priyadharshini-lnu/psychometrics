      <p>
      يرجى ملاحظة أن ما سبق أمثلة. تسعى MTE إلى الالتزام بمبدأ تقليل البيانات، وتحرص على جمع المعلومات الشخصية الضرورية فقط لتقديم الخدمات لك. ومع ذلك، لا يمكننا التحكم في المعلومات التي يطلبها عملاؤنا أو المعلومات التي تقدمها طوعًا.
      </p>

      <h2>كيف نجمع المعلومات الشخصية</h2>

      <h3><strong>المعلومات التي تقدمها أنت أو ممثلوك أو أطراف ثالثة</strong></h3>

      <p>قد نجمع المعلومات الشخصية من المصادر التالية:</p>

      <ul>
      <li>مباشرةً منك، على سبيل المثال عند زيارة موقع إلكتروني، أو إنشاء حساب، أو إكمال استبيان، أو تزويدنا بالمعلومات بأي طريقة أخرى.</li>
      <li>من ممثليك، بما في ذلك صاحب العمل أو الجمعية أو المجموعة أو الجهة الراعية لبرنامج/خطة المزايا.</li>
      </ul>

      <p>
      أثناء التقييم، قد تُجمع المعلومات الشخصية عبر كاميرا الويب أو الميكروفون أو أي مكونات مادية أخرى في نظامك. سيطلب نظامك وبرنامج MTE موافقتك قبل جمع المعلومات الشخصية من أجهزتك.
      </p>

      <p>
      إذا زودتنا بمعلومات شخصية عن أشخاص آخرين (مثل أفراد الأسرة أو المستفيدين أو المعالين)، فأنت تقر بأن لديك الصلاحية لتقديم هذه المعلومات وأنك شاركت هذا الإشعار معهم عند الاقتضاء. نحن لا نجمع عن علم معلومات شخصية مباشرة من القُصّر.
      </p>

      <h3><strong>الجمع بوسائل آلية</strong></h3>

      <p>
      نستخدم ملفات تعريف الارتباط وتقنيات التتبع ذات الصلة ("ملفات تعريف الارتباط") على مواقع شركتنا. وإذا كان ذلك متاحًا وفقًا لاختصاصك القضائي، يمكن لمستخدمي الموقع إلغاء الاشتراك في استخدام بعض ملفات تعريف الارتباط عبر رابط "إدارة ملفات تعريف الارتباط" الموجود أسفل الموقع. ولمعرفة المزيد حول كيفية استخدامنا لملفات تعريف الارتباط، يرجى الاطلاع على
      <a href="https://www.mercer.com/en-sa/footer/mercer-cookie-notice/">إشعار ملفات تعريف الارتباط</a>.
      </p>

      <h3><strong>الجمع بواسطة أطراف ثالثة</strong></h3>

      <p>
      إذا أجريت معاملة من خلالنا، فقد يقوم طرف ثالث (مثل مزود خدمة أو شركة تأمين) بجمع ومعالجة بيانات بطاقة الائتمان أو معلومات شخصية أخرى عنك، بما في ذلك عبر ملفات تعريف الارتباط، فيما يتعلق بهذه المعاملة. وفي هذه الحالات، وكذلك في أي ترتيبات أخرى نتلقى فيها معلومات من صاحب عملك أو جمعيتك أو أي طرف ثالث آخر، نشجعك على قراءة سياسة الخصوصية الخاصة بذلك الطرف لمعرفة المزيد حول كيفية استخدام معلوماتك والكشف عنها.
      </p>

      <h2>كيف نستخدم المعلومات الشخصية التي نجمعها</h2>

