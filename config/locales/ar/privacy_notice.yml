      <tr>
      <td>شركاء الأعمال المحتملون أو الجهات الخلف</td>
      <td>في سياق عمليات الاندماج أو الاستحواذ أو الإفلاس أو بيع الأصول أو أي معاملات أخرى يتولى فيها طرف ثالث السيطرة على كل أصولنا أو جزء منها.</td>
      </tr>

      <tr>
      <td>شركات التحليلات والإعلانات</td>
      <td>لمساعدتنا على تخصيص الإعلانات والمحتوى استنادًا إلى اهتماماتك، وقياس أداء الإعلانات والمحتوى، واستخلاص رؤى حول الجماهير التي تشاهد إعلاناتنا ومحتوانا.</td>
      </tr>

      <tr>
      <td>الجهات التنظيمية أو سلطات إنفاذ القانون</td>
      <td>عند الضرورة لمنع الاحتيال، والتواصل مع الجهات الإشرافية أو التنظيمية، وحماية الحقوق القانونية والسلامة والأمن الخاصة بـ MTE والشركات التابعة وشركاء الأعمال ومستخدمي أي موقع، وفرض شروط الاستخدام، والرد على دعاوى الاشتباه أو النشاط غير القانوني الفعلي، أو الاستجابة لعمليات التدقيق أو التحقيق في شكوى أو تهديد أمني، أو الامتثال للقانون أو اللوائح أو الإجراءات القانونية أو الطلبات الحكومية المعمول بها.</td>
      </tr>

      </tbody>
      </table>

      <p>
      قد نفصح أيضًا عن معلومات منزوع الهوية لا يُحتمل بشكل معقول أن تحدد هويتك، وذلك لأغراض تجارية مشروعة وقانونية. وعندما تكون لدينا معلومات منزوع الهوية، فإننا نحتفظ بها ونستخدمها دون محاولة إعادة تحديد الهوية إلا في الحدود المسموح بها قانونًا.
      </p>

      <h2>الخطوات التي نتخذها لحماية المعلومات الشخصية</h2>

      <p>
      تسعى شركتنا إلى الامتثال لجميع قوانين الأمن السيبراني وحماية البيانات المعمول بها. وتحقيقًا لهذه الأهداف، لدى MMC مسؤول أمن معلومات رئيسي (CISO) ومسؤول خصوصية عالمي رئيسي (GCPO). يتولى CISO إدارة فريق عالمي لأمن المعلومات وبرنامجًا شاملًا للأمن السيبراني. وكجزء من هذا البرنامج، طبقنا ضمانات مادية وإدارية وتقنية معقولة تجاريًا لحماية المعلومات الشخصية من الوصول غير المصرح به أو الاستخدام أو التعديل أو الحذف.
      </p>

      <p>
      يقود GCPO ويشرف على مركز التميز للخصوصية وشبكة مسؤولي حماية البيانات المسؤولة عن تنفيذ برنامجنا العالمي الشامل للخصوصية. وتربط شبكة مسؤولي حماية البيانات هؤلاء حول العالم وتسعى إلى تنفيذ برنامج الخصوصية لدينا بشكل متسق وشامل أينما نعالج البيانات. يمكنك الحصول على اسم ومعلومات الاتصال لمسؤول حماية البيانات في اختصاصك القضائي عبر التواصل معنا على privacy@mmc.com.
      </p>

      <h2>حقوق حماية البيانات الخاصة بك</h2>

      <p>
      في كثير من الحالات، نتعامل مع المعلومات الشخصية لتقديم خدماتنا للعملاء من الشركات، ولذلك ينبغي عليك التواصل معهم لممارسة أي حقوق قد تكون لديك بموجب قوانين الخصوصية المعمول بها. ومع ذلك، عندما نتصرف بصفتنا المتحكم أو الجهة التجارية المسؤولة أساسًا عن تقرير كيفية معالجة معلوماتك، فقد تكون لديك بعض أو كل الحقوق المدرجة أدناه، اعتمادًا على الاختصاص القضائي وسبب معالجتنا لمعلوماتك. يرجى ملاحظة أننا قد نحتاج إلى استخدام معلوماتك الشخصية للتحقق من هويتك قبل الاستجابة لأي من الحقوق أدناه.
      </p>

      <ul>

      <li><strong>حق الوصول (الحق في المعرفة)</strong><br>يجوز لك طلب تزويدك بمزيد من التفاصيل حول كيفية استخدامنا لمعلوماتك الشخصية، ومصادرها، وفئاتها أو عناصرها المحددة التي جمعناها، وفئات الأطراف الثالثة التي أفصحنا لها عن المعلومات، وكذلك طلب نسخة من المعلومات الشخصية التي نحتفظ بها عنك.</li>

      </ul>

      <ul>

      <li><strong>حق التصحيح</strong><br>يجوز لك طلب تحديث أي معلومات شخصية غير دقيقة نحتفظ بها. وإذا كشفنا معلوماتك الشخصية لآخرين، فسنبلغهم بالتصحيح حيثما أمكن.</li>

      </ul>

      <ul>

      <li><strong>حق الحذف</strong><br>يجوز لك طلب محو معلوماتك الشخصية عندما لا يعود لدينا أساس قانوني لمعالجتها.</li>

      </ul>

      <ul>

      <li><strong>حق الاعتراض على المعالجة أو تقييدها</strong><br>قد يكون لك الحق في تقييد معالجة معلوماتك الشخصية في ظروف معينة، مثل اعتراضك على دقتها.</li>

      </ul>

      <ul>

      <li><strong>حق نقل البيانات</strong><br>قد يكون لك الحق، عندما يكون ذلك ممكنًا تقنيًا، في أن تطلب منا نقل نسخة من المعلومات الشخصية التي حصلنا عليها منك إلى طرف ثالث تختاره بصيغة منظمة وشائعة الاستخدام وقابلة للقراءة آليًا.</li>

      </ul>

      <ul>

      <li><strong>حق سحب الموافقة</strong><br>إذا اعتمدنا على موافقتك كأساس قانوني لمعالجة معلوماتك الشخصية، فلديك الحق في سحب تلك الموافقة.</li>

      </ul>

      <ul>

      <li><strong>حق تقديم شكوى</strong><br>قد يكون لك الحق في تقديم شكوى إلى السلطة الإشرافية أو التنظيمية المختصة في اختصاصك القضائي إذا كانت لديك مخاوف بشأن أي جانب من ممارسات الخصوصية لدينا.</li>

      </ul>

      <p>
      إذا رغبت في ممارسة أي من الحقوق المذكورة أعلاه أو طلب مراجعة قرار أو رفض، فيرجى التواصل معنا باستخدام معلومات الاتصال المناسبة:
      </p>

      <ul>
      <li>إذا كنت في المملكة المتحدة أو سويسرا أو المنطقة الاقتصادية الأوروبية، يرجى
      <a href="https://mmc-dev-privacy.my.onetrust.com/webform/4da460d1-7bcf-4ff1-ac37-c4b804769467/draft/ea953d72-fded-42ee-b1dd-c0a5a83b7891">إكمال هذا النموذج</a>
      </li>
      <li>للأفراد في الدول الأخرى، يرجى
      <a href="https://privacyportal.onetrust.com/webform/ee9df2bb-0ef3-4485-bc63-4db420e77359/225910f5-5666-468a-b1e7-39c70e24f4cc">إكمال هذا النموذج</a>
      </li>
      <li>بدلًا من ذلك، يمكنك مراسلتنا عبر البريد الإلكتروني على <a href="mailto:privacy@mmc.com">privacy@mmc.com</a></li>
      </ul>

      <p>
      وبناءً على بلدك، قد تكون لديك أيضًا بعض أو كل الحقوق التالية:
      </p>

      <ul>
      <li><strong>حق الاشتراك أو إلغاء الاشتراك في البيع أو المشاركة لأغراض الإعلانات الموجهة عبر السياقات المختلفة</strong><br>إذا زرت أحد مواقعنا، فقد نفصح عن معلومات نشاطك على الإنترنت أو الشبكات الإلكترونية الأخرى، والمعرّفات الشخصية، وبيانات تحديد الموقع الجغرافي، والمعلومات المهنية (بالقدر الذي يمكن استنتاجه من نشاطك على موقعنا) لموفري تحليلات المواقع والإعلانات لأغراض الإعلانات السلوكية أو المستهدفة عبر السياقات المختلفة باستخدام ملفات تعريف الارتباط الإعلانية. وبموجب بعض القوانين، قد يكون لك الحق في الاشتراك أو إلغاء الاشتراك في هذه الأنواع من الإفصاح. لإجراء اختيارك أو للاطلاع على أسماء الأطراف الثالثة المحددة التي بعنا أو شاركنا معلوماتك معها، يرجى الضغط على رابط "إدارة ملفات تعريف الارتباط" في أسفل صفحة الويب الخاصة بنا. وإذا رغبت في إلغاء بيع أو مشاركة معلوماتك، فتأكد من ضبط مفاتيح تتبع "الإعلانات" و"التحليلات" على "لا" أو، حيثما كان متاحًا، تفعيل خيار "عدم بيع أو مشاركة معلوماتي الشخصية".
        <p>
        يمكنك أيضًا تطبيق إعداد في المتصفح أو إضافة للمتصفح لإيصال تفضيلات البيع والمشاركة تلقائيًا إلى المواقع التي تزورها. وتعالج مواقعنا "إشارات تفضيل إلغاء الاشتراك" هذه بسلاسة من خلال التعرف على ميزة Global Privacy Control (GPC). وإذا أردت استخدام GPC، يمكنك تنزيلها وتفعيلها عبر متصفح مشارك أو إضافة متصفح. تتوفر معلومات إضافية حول تنزيل GPC
        <a href="https://globalprivacycontrol.org/">هنا</a>.
        </p>
      </li>
      </ul>

      <ul>
      <li><strong>الحقوق المتعلقة باتخاذ القرار الآلي وإعداد ملفات التعريف</strong><br>بالقدر الذي ننخرط فيه في المعالجة الآلية لمعلوماتك الشخصية، سنزودك مسبقًا بأي إشعارات لازمة قانونًا، بما في ذلك الإشعارات المتعلقة بحقوقك.</li>
      </ul>

      <ul>
      <li><strong>التسويق المباشر وإشارات عدم التتبع</strong><br>قد يكون لديك الحق في طلب والحصول مرة واحدة سنويًا على إشعار بشأن المعلومات الشخصية التي كشفناها لأعمال أخرى لأغراض التسويق المباشر الخاصة بها، عندما يسمح القانون بذلك. وإذا كان ذلك منطبقًا، فسيتضمن هذا الإشعار قائمة بفئات المعلومات الشخصية التي تم الكشف عنها (إن وجدت) وأسماء وعناوين جميع الأطراف الثالثة التي كُشف لها عن المعلومات الشخصية (إن وجدت). وسيغطي الإشعار السنة التقويمية السابقة. يمكنك التواصل معنا كما هو موضح أدناه لمعرفة ما إذا كان هذا الحق ينطبق عليك، وإذا كان كذلك، لممارسة هذا الحق.</li>
      </ul>

      <p>
      يرجى ملاحظة أن بعض هذه الحقوق قد تكون محدودة عندما تكون لدينا مصلحة مشروعة راجحة أو التزام قانوني أو تنظيمي أو تعاقدي للاستمرار في معالجة المعلومات الشخصية، أو عندما تكون المعلومات الشخصية مستثناة من الإفصاح أو المحو بموجب القانون المعمول به. كما أن بعض هذه الحقوق لا يمكن ممارستها إلا في ظروف معينة أو قد تكون مقيدة بموجب تشريعات حماية البيانات في اختصاصك القضائي.
      </p>

      <h2>نقل البيانات عبر الحدود</h2>

      <p>
      باعتبارنا شركة عالمية تعمل في أكثر من 80 دولة، توجد ظروف نحتاج فيها إلى نقل المعلومات الشخصية خارج الدولة أو المقاطعة أو الإقليم الذي جُمعت فيه للأغراض الموضحة في إشعار الخصوصية هذا. وعلى وجه التحديد، قد ننقل البيانات لتقديم الخدمات لك وإدارتها وتشغيلها، ولتحسين كفاءة عملياتنا التجارية. وسنبذل كل جهد لضمان امتثال هذه التحويلات لجميع تشريعات حماية البيانات ذات الصلة، وحماية حقوق الأفراد وحرياتهم بموجب تلك القوانين حماية مناسبة.
      </p>

      <p>
      وعندما تنشأ الحاجة لمثل هذا النقل، سنتخذ خطوات لضمان وجود ضمانات مناسبة لحماية المعلومات الشخصية، مثل تقييم الأثر، أو قرار الملاءمة من السلطة الإشرافية المختصة، أو استخدام القواعد المؤسسية الملزمة المعتمدة أو البنود التعاقدية القياسية، أو موافقتك.
      </p>

      <p>
      للاطلاع على معلومات حول كيفية عمل القواعد المؤسسية الملزمة للاتحاد الأوروبي (EU BCRs) الخاصة بـ MMC، اضغط
      <a href="https://www.marshmclennan.com/content/dam/mmc-web/Archive/Images/Files/02March2022-EUBCR-Controller-and-Processor-Principles.pdf">هنا</a>.
      وللاطلاع على قائمة الكيانات التي وافقت على الالتزام بالقواعد المؤسسية الملزمة للاتحاد الأوروبي، اضغط
      <a href="https://www.marshmclennan.com/privacy-statement/bcr-entities.html">هنا</a>.
      </p>

      <p>
      للاطلاع على معلومات حول كيفية عمل القواعد المؤسسية الملزمة للمملكة المتحدة (UK BCRs) الخاصة بـ MMC، اضغط
      <a href="https://www.marshmclennan.com/content/dam/mmc-web/Archive/Images/Files/02March2022-UKBCR-Controller-and-Processor-Principles.pdf">هنا</a>.
      وللاطلاع على قائمة الكيانات التي وافقت على الالتزام بالقواعد المؤسسية الملزمة للمملكة المتحدة، اضغط
      <a href="https://www.marshmclennan.com/privacy-statement/bcr-entities-uk.html">هنا</a>.
      </p>

      <h2>الاحتفاظ بمعلوماتك</h2>

      <p>
      منتجاتنا وخدماتنا والتزاماتنا التنظيمية معقدة، ولذلك تختلف فترات الاحتفاظ بالمعلومات الشخصية. ونأخذ الالتزامات التالية في الاعتبار عند تحديد فترات الاحتفاظ بالمعلومات الشخصية والسجلات التي نحتفظ بها:
      </p>

      <ul>
      <li>الحاجة إلى الاحتفاظ بالمعلومات لتحقيق الأغراض التجارية أو الالتزامات التعاقدية التي جُمعت من أجلها؛</li>
      <li>واجباتنا في تنفيذ تعليمات عملائنا فيما يتعلق بالمعلومات الشخصية التي نعالجها نيابةً عنهم؛</li>
      <li>واجباتنا في الامتثال لمتطلبات حفظ السجلات القانونية والتنظيمية الإلزامية؛</li>
      <li>إجراءات النسخ الاحتياطي والتعافي من الكوارث لدينا؛</li>
      <li>والآثار القانونية الأخرى مثل مدد التقادم القانونية المعمول بها.</li>
      </ul>

      <p>
      واستنادًا إلى العوامل أعلاه، قد نحتفظ بالمعلومات الشخصية لفترة تتجاوز المدة التي نقدم خلالها الخدمات لك. وعندما لا نعود بحاجة إلى الاحتفاظ بالمعلومات الشخصية، تتطلب سياسات الشركة إما إزالة هوية المعلومات أو تجميعها (وفي هذه الحالة قد نحتفظ بالمعلومات منزوع الهوية أو المجمّعة ونستخدمها لأغراض التحليلات) أو إتلافها بشكل آمن.
      </p>

      <h2>الأسئلة أو الاستفسارات</h2>

      <p>
      لتقديم أسئلة أو طلبات بخصوص إشعار الخصوصية هذا أو ممارسات الخصوصية الخاصة بـ MTE، يرجى مراسلتنا عبر البريد الإلكتروني على
      <a href="mailto:privacy@mmc.com">privacy@mmc.com</a>.
      وإذا كنت تفضل التواصل معنا بالبريد أو الهاتف، يرجى التواصل مع مسؤول حماية البيانات المحلي لديك. ويمكنك الحصول على معلومات الاتصال بمسؤول حماية البيانات المحلي عبر مراسلتنا على
      <a href="mailto:privacy@mmc.com">privacy@mmc.com</a>.
      </p>

