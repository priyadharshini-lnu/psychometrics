    <div dir="rtl">
      <h1><strong>إشعار الخصوصية لمؤسسة MERCER TALENT ENTERPRISE</strong></h1>
      <p>تاريخ السريان: 15 سبتمبر 2024</p>

      <p>
        يوضح إشعار الخصوصية هذا كيفية قيام Mercer Talent Enterprise ("<strong>MTE</strong>")
        بجمع واستخدام ومشاركة والاحتفاظ ونقل ومعالجة المعلومات المتعلقة بالأفراد
        المحددين أو القابلين للتحديد (المعلومات الشخصية). كما يوضح الحقوق التي قد
        تكون لديك فيما يتعلق بمعلوماتك الشخصية. نعتقد أنه من المهم أن تفهم كيفية
        معالجتنا للمعلومات الشخصية ونشجعك على تخصيص بعض الوقت للتعرف على ممارسات
        الخصوصية الموضحة أدناه.
      </p>

      <p>
        يرجى ملاحظة أن MTE هي مزود لحلول تقييم العلوم السلوكية، وفي بعض الحالات
        نعمل نيابةً عن عملائنا ووفقًا لتعليماتهم، مثل المؤسسات المالية أو التجار
        أو شركاء آخرين يعملون كمسؤولين عن البيانات، بما في ذلك معالجة معاملات
        الدفع. يرجى الرجوع إلى سياسات الخصوصية الخاصة بهؤلاء الشركاء للحصول على
        مزيد من المعلومات حول كيفية معالجة معلوماتك الشخصية في هذه الحالات.
      </p>

      <h2>ما هي علاقتنا بك</h2>

      <p>
        قد يُطلب منك من قبل طرف ثالث إكمال تقييم عبر منصة MTE. هذا الطرف الثالث هو
        عميل لـ MTE وقد يكون صاحب عملك أو صاحب عمل محتمل أو جهة ذات صلة. تقوم MTE
        بجمع ومعالجة معلوماتك الشخصية نيابةً عن عملائنا، ونتبع التعليمات المقدمة
        من عملائنا فيما يتعلق بالمعلومات الشخصية التي يجب جمعها وكيفية معالجتها.
        لذلك تعمل MTE كـ "معالج بيانات" لعملائنا الذين يحددون كيفية معالجة معلوماتك
        الشخصية.
      </p>

      <p>
        إذا كانت لديك أسئلة حول معالجة معلوماتك الشخصية، فننصحك بالرجوع إلى إشعار
        الخصوصية الخاص بعميلنا.
      </p>

      <h2>ما هي المعلومات الشخصية التي نجمعها</h2>

      <p>
        يوجهنا عملاؤنا لجمع معلومات معينة نيابةً عنهم. باستثناء اسمك وعنوان بريدك
        الإلكتروني اللازمين لإنشاء حساب، فإن MTE لا تحدد بشكل مستقل المعلومات التي
        يتم جمعها. بناءً على احتياجات وتوجيهات عملائنا، قد نقوم بجمع الفئات التالية
        من المعلومات الشخصية عند الضرورة لتحقيق أغراض العمل المقصودة:
      </p>

      <table>
        <tbody>
          <tr>
            <td><strong>الفئة</strong></td>
            <td><strong>أمثلة</strong></td>
          </tr>
          <tr>
            <td>المعرفات الشخصية</td>
            <td>الاسم، تاريخ الميلاد، العمر، مكان الميلاد، الجنس.</td>
          </tr>
          <tr>
            <td>معلومات الاتصال</td>
            <td>عنوان المنزل، رقم الهاتف، عنوان البريد الإلكتروني الشخصي.</td>
          </tr>
          <tr>
            <td>معلومات الهوية</td>
            <td>
              رقم الضريبة أو رقم الضمان الاجتماعي أو رقم تعريف حكومي آخر،
              رقم رخصة القيادة، معلومات جواز السفر، تفاصيل الحساب البنكي،
              بيانات الإقرار الضريبي.
            </td>
          </tr>
          <tr>
            <td>معلومات مهنية أو وظيفية</td>
            <td>
              صاحب العمل أو المجموعة، المسمى الوظيفي، بيانات الاتصال المهنية،
              رقم الموظف، الدرجة الوظيفية، الأداء الوظيفي، الراتب، وسجل التوظيف.
            </td>
          </tr>
          <tr>
            <td>سمات ديموغرافية حساسة</td>
            <td>
              العرق، الجنسية، الحالة الصحية الجسدية أو العقلية، الجنس،
              الهوية الجندرية، التوجه الجنسي، عضوية النقابات، أو الحالة
              العسكرية.
            </td>
          </tr>
          <tr>
            <td>بيانات بيومترية وجسدية</td>
            <td>
              مسح الوجه أو مراقبة الوجه كجزء من خيارات المراقبة أثناء الاختبار.
            </td>
          </tr>
          <tr>
            <td>بيانات البيئة المادية</td>
            <td>
              فيديو أو صور للمنطقة المحيطة بك أثناء التقييم عبر كاميرا
              المراقبة الخاصة بالاختبار.
            </td>
          </tr>
          <tr>
            <td>نشاط الإنترنت أو الشبكة</td>
            <td>
              سجل التصفح والبحث، التفاعل مع المواقع أو التطبيقات،
              بيانات ملفات تعريف الارتباط (Cookies)، بيانات تسجيل الدخول،
              عنوان IP أو معرف الجهاز.
            </td>
          </tr>
          <tr>
            <td>أي معلومات أخرى تقدمها طوعًا</td>
            <td>
              معلومات عن أفراد الأسرة أو المعالين، تفاصيل الاتصال في حالات
              الطوارئ، التفضيلات التسويقية، ردود الاستبيانات أو التعليقات.
            </td>
          </tr>
        </tbody>
      </table>

      <p>
        هذه مجرد أمثلة. تسعى MTE إلى الالتزام بمبدأ تقليل البيانات وجمع الحد
        الأدنى فقط من المعلومات الشخصية اللازمة لتقديم خدماتنا. ومع ذلك،
        لا يمكننا التحكم في المعلومات التي يطلبها عملاؤنا أو المعلومات
        التي تختار تقديمها طوعًا.
      </p>

      <h2>كيف نجمع المعلومات الشخصية</h2>

      <h3><strong>المعلومات التي تقدمها أنت أو ممثلوك أو أطراف ثالثة</strong></h3>

      <p>قد نجمع معلومات شخصية من المصادر التالية:</p>

      <ul>
        <li>
          مباشرةً منك، على سبيل المثال عندما تزور موقعًا إلكترونيًا،
          أو تنشئ حسابًا، أو تكمل استبيانًا.
        </li>
        <li>
          من ممثليك مثل صاحب العمل أو الجمعية أو الجهة الراعية لبرنامج
          المزايا.
        </li>
      </ul>

      <p>
        أثناء التقييم، قد يتم جمع معلومات شخصية عبر كاميرا الويب أو
        الميكروفون أو أجهزة أخرى في جهازك. سيطلب النظام موافقتك قبل
        جمع هذه المعلومات.
      </p>

      <h3><strong>الجمع بوسائل آلية</strong></h3>

      <p>
        نستخدم ملفات تعريف الارتباط وتقنيات التتبع المشابهة على مواقعنا
        الإلكترونية. يمكن للمستخدمين إدارة إعدادات ملفات تعريف الارتباط
        من خلال رابط "إدارة ملفات تعريف الارتباط" الموجود أسفل الموقع.
      </p>

      <h2>كيف نستخدم المعلومات الشخصية</h2>

      <p>قد نستخدم المعلومات الشخصية التي نجمعها للأغراض التالية:</p>

      <ul>
        <li>
          تشغيل أعمالنا والتحقق من هويتك والتواصل معك وتنفيذ
          التزاماتنا التعاقدية.
        </li>
        <li>
          إرسال مواد تسويقية عندما يسمح القانون بذلك.
        </li>
        <li>
          البحث وتحليل البيانات لتحسين خدماتنا.
        </li>
        <li>
          الحفاظ على أمن الشبكة وحماية أنظمتنا من الهجمات الإلكترونية.
        </li>
        <li>
          صيانة مواقعنا الإلكترونية وتحسين تجربة المستخدم.
        </li>
        <li>
          الامتثال للالتزامات القانونية والتنظيمية.
        </li>
      </ul>

      <h2>من نشارك معه المعلومات الشخصية</h2>

      <p>
        قد نكشف عن المعلومات الشخصية للفئات التالية من الأطراف:
      </p>

      <ul>
        <li>صاحب العمل أو العميل الذي يطلب التقييم.</li>
        <li>الشركات التابعة لـ MTE ضمن مجموعة Marsh McLennan.</li>
        <li>مقدمو الخدمات أو الوكلاء الذين يعملون نيابةً عنا.</li>
        <li>شركاء التسويق عندما يسمح القانون بذلك.</li>
        <li>الجهات التنظيمية أو سلطات إنفاذ القانون عند الضرورة.</li>
      </ul>

      <h2>الخطوات التي نتخذها لحماية المعلومات الشخصية</h2>

      <p>
        تسعى شركتنا إلى الامتثال لجميع قوانين الأمن السيبراني
        وحماية البيانات المعمول بها. وقد قمنا بتنفيذ إجراءات
        أمنية تقنية وإدارية ومادية مناسبة لحماية المعلومات
        الشخصية من الوصول غير المصرح به أو الاستخدام أو
        التعديل أو الحذف.
      </p>

      <h2>حقوق حماية البيانات الخاصة بك</h2>

      <p>
        قد يكون لديك عدد من الحقوق فيما يتعلق بمعلوماتك الشخصية،
        اعتمادًا على القوانين المعمول بها في بلدك، مثل:
      </p>

      <ul>
        <li>الحق في الوصول إلى معلوماتك الشخصية.</li>
        <li>الحق في تصحيح البيانات غير الدقيقة.</li>
        <li>الحق في حذف البيانات.</li>
        <li>الحق في تقييد أو الاعتراض على المعالجة.</li>
        <li>الحق في نقل البيانات.</li>
        <li>الحق في سحب الموافقة.</li>
        <li>الحق في تقديم شكوى لدى الجهة التنظيمية المختصة.</li>
      </ul>

      <p>
        لممارسة أي من هذه الحقوق، يرجى التواصل معنا عبر البريد
        الإلكتروني: <a href="mailto:privacy@mmc.com">privacy@mmc.com</a>
      </p>

      <h2>نقل البيانات عبر الحدود</h2>

      <p>
        نظرًا لأننا شركة عالمية تعمل في أكثر من 80 دولة، فقد يتم
        نقل المعلومات الشخصية خارج الدولة التي تم جمعها فيها
        لأغراض تقديم الخدمات وتحسين عملياتنا التجارية.
      </p>

      <h2>الاحتفاظ بالمعلومات</h2>

      <p>
        تختلف فترات الاحتفاظ بالمعلومات الشخصية حسب طبيعة
        الخدمات والالتزامات القانونية والتنظيمية. وعندما لم
        نعد بحاجة إلى الاحتفاظ بالمعلومات، سنقوم بحذفها
        أو إخفاء هويتها بشكل آمن.
      </p>

      <h2>الأسئلة أو الاستفسارات</h2>

      <p>
        إذا كان لديك أي أسئلة حول إشعار الخصوصية هذا أو
        ممارسات الخصوصية الخاصة بـ MTE، يرجى التواصل معنا
        عبر البريد الإلكتروني:
        <a href="mailto:privacy@mmc.com">privacy@mmc.com</a>
      </p>
