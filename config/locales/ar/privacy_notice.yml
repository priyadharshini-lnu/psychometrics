      <h1><strong>إشعار الخصوصية لمؤسسة Mercer Talent Enterprise</strong></h1>
      <p>تاريخ السريان: 15 سبتمبر 2024</p>

      <p>
      يوضح إشعار الخصوصية هذا كيفية قيام Mercer Talent Enterprise ("<strong>MTE</strong>") بجمع المعلومات المتعلقة بالأفراد المحددين أو القابلين للتحديد ("المعلومات الشخصية") واستخدامها ومشاركتها والاحتفاظ بها ونقلها ومعالجتها بأي طريقة أخرى، كما يوضح الحقوق التي قد تكون لديك فيما يتعلق بمعلوماتك الشخصية. نرى أنه من المهم أن تفهم كيفية معالجتنا للمعلومات الشخصية، ونشجعك على تخصيص بعض الوقت للتعرّف على ممارسات الخصوصية الموضحة أدناه.
      </p>

      <p>
      يرجى ملاحظة أن MTE مزوّد لحلول تقييم العلوم السلوكية، وفي بعض الحالات نعمل نيابةً عن العملاء ووفقًا لتعليماتهم، بما في ذلك المؤسسات المالية والتجّار والشركاء الآخرين الذين يعملون بصفتهم مسؤولين عن البيانات، بما في ذلك معالجة معاملات الدفع. يرجى الرجوع إلى سياسات الخصوصية الخاصة بهؤلاء الشركاء للحصول على مزيد من المعلومات بشأن معالجة معلوماتك الشخصية في هذه السياقات.
      </p>

      <h2>ما هي علاقتنا بك</h2>

      <p>
      قد يُطلب منك من قبل طرف ثالث إكمال تقييم على منصة MTE. هذا الطرف الثالث هو عميل لـ MTE وقد يكون صاحب عملك الحالي أو المحتمل أو جهة ذات صلة أخرى. تجمع MTE معلوماتك الشخصية وتعالجها نيابةً عن عملائنا، ونتبع التعليمات التي يقدمونها بخصوص نوع المعلومات الشخصية التي يجب جمعها وكيفية معالجتها. وبناءً على ذلك، تعمل MTE بصفتها "معالج بيانات" لعملائنا الذين يحددون كيفية معالجة معلوماتك الشخصية.
      </p>

      <p>
      إذا كانت لديك أسئلة حول معالجة معلوماتك الشخصية، فنشجعك على مراجعة إشعار الخصوصية الخاص بعميلنا.
      </p>

      <h2>ما هي المعلومات الشخصية التي نجمعها</h2>

      <p>
      يوجّهنا عملاؤنا إلى جمع معلومات معينة نيابةً عنهم. وباستثناء اسمك وعنوان بريدك الإلكتروني اللازمين لإنشاء الحساب، لا تحدد MTE بشكل مستقل المعلومات التي يتم جمعها. واستنادًا إلى احتياجات العميل وتوجيهاته، قد نجمع الفئات التالية من المعلومات الشخصية، عند الاقتضاء، لتحقيق أغراضنا التجارية المقصودة:
      </p>

