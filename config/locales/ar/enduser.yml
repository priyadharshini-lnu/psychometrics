    troubleshooting_guide_browser_first: 'استخدم متصفحًا مدعومًا: جوجل كروم ( Chrome ) أو فايرفوكس (Firefox) أو مايكروسوفت ايدج (Edge) أو سفاري (Safari) - يجب أن يتوفر المتصفح بأحدث إصدار'
    troubleshooting_guide_browser_fourth: تأكد من تفعيل JavaScript وملفات تعريف الارتباط (Cookies) في إعدادت المتصفح
    troubleshooting_guide_browser_second: امسح ذاكرة التخزين المؤقت (Cache) وملفات تعريف الارتباط (Cookies) من المتصفح
    troubleshooting_guide_browser_sixth: قم بتجربة استخدام نافذة المتصفح الخفي/ الخاص (Incognito/ Private)
    troubleshooting_guide_browser_third: قم بتعطيل إضافات المتصفح (Extensions) التي قد تتداخل مع الوصول إلى الوسائط
    troubleshooting_guide_network_fifth: في حال استمرت المشكلة، تواصل مع مزود خدمة الإنترنت للحصول على المساعدة
    troubleshooting_guide_network_first: أغلق التطبيقات الأخرى التي قد تستهلك الإنترنت (مثل بث الفيديو، أو التنزيلات)
    troubleshooting_guide_network_fourth: حاول استخدام شبكة اتصال مختلفة (إن وجدت)
    troubleshooting_guide_network_second: اقترب من جهاز الواي فاي WiFi أو قم بالاتصال عبر كابل Ethernet
    troubleshooting_guide_network_third: أعد تشغيل الراوتر/المودم ثم حاول مرة أخرى
