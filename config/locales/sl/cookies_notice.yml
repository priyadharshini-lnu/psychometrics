    <h2>Obvestilo o piškotkih</h2>

    <p>Datum uveljavitve: 14. december 2023</p>

    <p>Na tej spletni strani uporabljamo piškotke in povezane tehnologije sledenja, vključno z internetnimi sledilniki, sledilnimi slikami in dnevniškimi datotekami (skupno imenovanimi piškotki), da vas ločimo od drugih uporabnikov, ocenimo in izboljšamo funkcionalnost spletnega mesta in naših storitev ter zagotovimo dobro uporabniško izkušnjo.</p>

    <p><strong>KAJ JE PIŠKOTEK</strong></p>

    <p>Piškotki so informacije, ki se delijo med vašim spletnim brskalnikom in spletnim mestom. Nekateri piškotki so potrebni za delovanje spletnega mesta. Nekateri nam pomagajo oceniti in izboljšati njegovo delovanje. Piškotke uporabljamo tudi za zagotavljanje relevantne vsebine, izdelkov in storitev. Piškotek ne more prebrati podatkov z vašega trdega diska.</p>

    <p><strong>Obstajajo različne vrste piškotkov z različnimi funkcijami:</strong></p>

    <p><strong>(i) Sejni piškotki:</strong> ti piškotki so shranjeni na vašem računalniku samo med vašo sejo. Samodejno se izbrišejo po zaprtju brskalnika. Običajno shranjujejo anonimni ID seje, ki vam omogoča brskanje po spletnem mestu, ne da bi se morali prijavljati na vsako stran. Ne zbirajo nobenih informacij z vašega računalnika.</p>

    <p><strong>(ii) Trajni piškotki:</strong> ti piškotki se shranijo kot datoteka na vašem računalniku in ostanejo tam, ko zaprete brskalnik. Spletno mesto jih lahko prebere, ko znova obiščete spletno mesto.</p>

    <p><strong>(iii) Piškotki prve osebe:</strong> te piškotke ustvarja naše podjetje. Shranjujejo se in pošiljajo med našimi strežniki in trdim diskom vašega računalnika. Ti piškotki so lahko sejni ali trajni piškotki.</p>

    <p><strong>(iv) Piškotki tretjih oseb:</strong> te piškotke ustvarja eden od naših partnerjev tretjih oseb. Shranjujejo se in pošiljajo med strežnikom tretje osebe in trdim diskom vašega računalnika. Ti piškotki so običajno trajni.</p>

    <p><strong>KAKO IN ZAKAJ UPORABLJAMO PIŠKOTKE</strong></p>

    <p>Glede na spletno mesto lahko piškotke uporabljamo za naslednje namene:</p>

    <p><strong>Kjer so nujno potrebni</strong></p>

    <p>Ti piškotki so nujni, da se lahko premikate po spletnem mestu in uporabljate njegove funkcije, kot je dostop do varovanih področij spletnega mesta. Brez teh piškotkov storitve, ki jih zahtevate, kot je pridobitev ponudbe ali prijava v račun, niso možne. Ti piškotki ne zbirajo informacij o vas, ki bi se lahko uporabile za marketing ali zapomnitev obiskane strani.</p>

    <p><strong>Funkcionalnost</strong></p>

    <p>Ti piškotki omogočajo, da si spletno mesto zapomni vaše izbire (npr. uporabniško ime, jezik ali regijo) in zagotovi napredne funkcije. Na primer, spletno mesto si lahko zapomni vaše prijavne podatke, da se ne boste morali ponovno prijavljati pri uporabi iste naprave. Ti piškotki se lahko uporabljajo tudi za zapomnitev sprememb velikosti besedila, pisave in drugih nastavitev strani. Uporabljajo se lahko tudi za izvajanje storitev, kot je ogled videoposnetkov ali komentiranje člankov. Informacije, ki jih ti piškotki zbirajo, so običajno anonimizirane in ne vključujejo podatkov, ki bi se lahko uporabili za oglaševanje ali sledenje vašemu spletnemu vedenju.</p>

    <p><strong>Analitika</strong></p>

    <p>Ti piškotki zbirajo informacije o tem, kako obiskovalci uporabljajo spletno mesto, na primer katere strani obiskujejo najpogosteje in ali prejmejo napake spletnega mesta. Omogočajo tudi štetje obiskovalcev, kar nam pomaga izboljšati delovanje spletnega mesta.</p>

    <p><strong>Oglaševanje</strong></p>

    <p>Ti piškotki se uporabljajo za prikazovanje oglasov, ki so relevantni za vas, in za merjenje učinkovitosti oglasov. Oglaševalski piškotki so običajno piškotki tretjih oseb in so lahko prisotni, tudi če na spletni strani ni oglasov.</p>

    <p><strong>IP naslovi</strong></p>

    <p>Ob obisku spletnega mesta lahko pridobimo vaš IP naslov za zbiranje neosebnih podatkov, na primer za spremljanje geografske lokacije uporabnikov.</p>

    <p><strong>KAKO UPRAVLJATI PIŠKOTKE</strong></p>

    <p>Z uporabo povezave »Upravljaj piškotke« na dnu strani se lahko prijavite ali odjavite prek našega upravljalnika soglasja za piškotke. Pomembno: nujno potrebnih piškotkov ni mogoče onemogočiti, zato strani, ki uporabljajo samo te piškotke, morda ne bodo prikazale te možnosti.</p>

    <p>Nekatere piškotke lahko onemogočite tudi v nastavitvah brskalnika. Več informacij najdete v pomoči brskalnika.</p>

    <p><strong>OBVESTILO O PIŠKOTKIH NE VELJA ZA SPLETNE STRANI TRETJIH OSEB</strong></p>

    <p>Ko vključimo povezave do drugih spletnih strani, imejte v mislih, da imajo lastne politike zasebnosti in piškotkov, ki urejajo uporabo vseh informacij, ki jih posredujete. Priporočamo, da preberete njihove politike, saj ne odgovarjamo za njihove prakse.</p>

    <p><strong>SPREMEMBE OBVESTILA O PIŠKOTKIH</strong></p>

    <p>Te politike lahko občasno posodobimo. Priporočamo, da jih redno pregledujete, da boste obveščeni o tem, kako uporabljamo piškotke. Datum uveljavitve politike je naveden na vrhu strani.</p>

    <p><strong>OPIS UPORABLJENIH PIŠKOTKOV</strong></p>

    <p>Kliknite na povezavo »Upravljaj piškotke« v nogi spletnega mesta, da poiščete podrobnosti o posameznih piškotkih, ki se uporabljajo. Ta povezava morda ni vedno na voljo, na primer če spletna stran uporablja samo nujno potrebne piškotke.</p>

    <p><strong>PIŠITE NAM</strong></p>

    <p>Če imate kakršna koli vprašanja glede tega obvestila o piškotkih, nas kontaktirajte, kot je navedeno v našem obvestilu o zasebnosti.</p>
