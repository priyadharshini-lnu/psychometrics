      guidelines:
        cards:
          c1:
            content: Vključite veščine, znanje in sposobnosti, ki jih je treba razviti. Zagotovite, da so specifični, merljivi, dosegljivi, realistični in razumno izvedljivi v omenjenih časovnicah.
            title: Razvojni cilji
          c2:
            content: To temelji na kompetenci, ki jo je treba razviti na podlagi izkušenj z ocenjevanjem.
            title: Usposobljenosti
          c3:
            content: Ta razdelek vključuje vaše razvojne ukrepe, ki temeljijo na modelu učenja 70-20-10, ki je naveden spodaj. Priporočljivo je, da izberete kombinacijo vsakega od treh elementov, da zagotovite raznolik pristop k učenju in razvoju.
            title: Dejavnost
          c4:
            content: Prepričajte se, da so vaši časovni okviri realistični glede na to, kdaj je cilj mogoče dokončati. To spremenite, kot in kadar je to primerno.
            title: Časovnica
          c5:
            content: Uporabite razdelek napredka za podporo napredovanju na opredeljenih sledeh.
            title: Napredek
        chart:
          collaboration: "<strong>20%</strong>Sodelovanje <br /> Učenje"
          job: "<strong>70%</strong>Učenje <br />na delovnem mestu"
          learn: "<strong>10%</strong>Formalno učenje"
        content:
          list:
            r1: Upoštevajte, da je ta seznam zgolj okviren in da se lahko za vas upoštevajo dodatne možnosti razvoja na podlagi individualnih želja, priporočil vašega nadrejenega ter poslovnih prioritet organizacije.
            r2: Uporabniki so pozvani, da kritično pregledajo vso vsebino in lahko prosto spreminjajo, izboljšujejo, nadomeščajo ali dodajajo kakršna koli dejanja ali priporočila, s katerimi se ne strinjajo.
            r3: 'Podatki o razvoju, vključeni v to poročilo, lahko izhajajo iz enega ali obeh naslednjih virov:'
            r3a: Prilagojena razvojna knjižnica, ustvarjena za vašo organizacijo
            r3b: Predlogi za razvoj, ustvarjeni z umetno inteligenco
            r4: To poročilo IDP je bilo pripravljeno s pomočjo tehnologije umetne inteligence in lahko vsebuje netočnosti. Predstavljene ugotovitve in priporočila je treba razlagati z zadržkom ter jih uporabljati izključno kot orodje za vaš osebni in poklicni razvoj. Poročilo velja za obdobje 12–18 mesecev.
          main: Ustvarjeni IDP vključuje podroben seznam razvojnih ukrepov, ki jih lahko izvedete, ob upoštevanju najboljših praks učenja, tj. smernic 70-20-10, ki zagotavljajo postopno pot, ki združuje učenje v učilnici, coaching in učenje na delovnem mestu. Na podlagi rezultatov procesa ocenjevalnega centra, vaših odgovorov v klepetu in zunanjih poročil, če je to primerno, so bili priporočeni možni razvojni poti, ki jih lahko upoštevate pri svojem razvoju.
        learn_cards:
          collaboration:
            list:
            - Ponudite mentorstvo ali coaching drugim
            - Prosite, da vas mentorira strokovnjak na vašem področju
            - Pridobite coacha za podporo vašemu razvoju
            - Ustanovite sodelovalno delovno skupino za razpravo o izzivih v podjetju
            - Pridobite povratne informacije formalno in neformalno od drugih
            - Aktivno sodelujte v strokovnih združenjih in mrežah
            - Zgradite svojo zunanjo mrežo
            title: Sodelovalno učenje (20 %) <br/> Razvoj skozi druge
          job:
            list:
            - Prevzemite vodilne položaje v odborih ali upravnih skupinah
            - Prostovoljno vodite projekte sprememb v organizaciji
            - Razmislite o zahtevnejših nalogah
            - Sodelujte z drugimi oddelki
            - Vodite projekte zunaj vaše organizacije
            - Sodelujte z zunanjimi strokovnjaki pri skupnih projektih
            title: Učenje na delovnem mestu (70 %) <br/> Razvoj skozi izkušnje
          learn:
            list:
            - Udeležite se strukturiranih programov usposabljanja
            - Opravite spletne tečaje e-učenja
            - Preberite knjige, članke, publikacije
            - Pridobite strokovne kvalifikacije, certifikate in akreditacije
            - Udeležba na tečajih, delavnicah, seminarjih
            title: Formalno učenje (10 %) <br/> Razvoj s strukturiranim učenjem
