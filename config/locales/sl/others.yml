    goto_dashboard: Pojdite na nadzorno ploščo
    inactive_campaign_message: Trenutno nimate dodeljenih nobenih nalog.
    insights_reports: Vpogledi in poročila
    instruction_modal:
      campaign_start_final_instructions: |
        <p>
          Prosimo, upoštevajte, da časovnika ni mogoče ustaviti ali začasno prekiniti. Čas bo tekel naprej tudi, če zaprete brskalnik. V nobenem primeru ne prekinjajte nalog, da bi počeli kaj drugega. Zagotovite si čim manj motenj med opravljanjem nalog: poiščite mirno okolje, izklopite obvestila na elektronskih napravah, med reševanjem se ne ukvarjajte z drugimi opravili. Ostanite zbrani in osredotočeni. Ko se čas kampanje izteče, nalog ne boste več mogli nadaljevati. Če ste prebrali zgornja navodila, kliknite »Začni« za začetek reševanja nalog.
        </p>
      campaign_start_instruction: |-
        <h4>Prosimo pozorno preberite naslednja navodila.</h4>
        <p>
          Naloge, ki jih boste začeli reševati, so časovno omejene. Ko kliknete na "Začni", se bo samodejno začel meriti čas. Za dokončanje vseh nalog imate na voljo %{minutes} minut. Naloge poskusite rešiti v predvidenem časovnem okviru. Priporočamo, da učinkovito upravljate s časom. S tem se izognete nepotrebnemu hitenju. Svetujemo vam, da naloge rešite brez prekinitev – če potrebujete odmor, si ga vzemite zdaj.
        </p>
      common_proctoring_instructions: |-
        <h4>Proctoring</h4>
        <p>
          S klikom na gumb »Začni« boste preusmerjeni v naš nadzorni (proctoring) sistem. Med opravljanjem nalog bo sistem spremljal vašo kamero, mikrofon in zaslon. Reševanje nalog nadzira napreden sistem umetne inteligence, ki zagotavlja nemoteno in tekočo uporabniško izkušnjo. V določenih primerih si lahko posnetke ogleda tudi človeški nadzornik. Vsa neustrezna ravnanja ali nepravilnosti bodo zabeležene. Nadzor je vzpostavljen z namenom preprečevanja goljufij. Če bodo zaznana sumljiva vedenja, bo nadaljnje reševanje onemogočeno.
        </p>
      lockdown_browser_instruction: |-
        <h4>Brskalnik za proctoring</h4>
        <p>
          Za izvedbo nadzorovanih nalog boste morali prenesti in namestiti poseben brskalnik. Na naslednjem zaslonu sledite navodilom. Ko zaključite z nalogami, ga lahko odstranite iz naprave.
        </p>
