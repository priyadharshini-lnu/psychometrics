    insights_reports: Vpogledi in poročila
    instruction_modal:
      campaign_start_final_instructions: "<p>zavedajte se, da časovnika ni mogoče ustaviti ali prekiniti. Časovnik kampanje bo deloval tudi, ko zaprete brskalnik, zato nikar ne razmišljajte o tem, da bi vmes zapustili naloge in počeli kaj drugega. Poskrbite, da boste med opravljanjem nalog čim bolj zmanjšali motnje. Poiščite mirno okolje, izklopite obvestila na svojih napravah in se izogibajte večopravilnosti. Ohranite koncentracijo in ostanite osredotočeni. Ko se časovnik kampanje izteče, ne boste mogli nadaljevati. Če ste prebrali zgornja navodila, kliknite Start, da nadaljujete z dodeljenimi nalogami</p>\n"
      campaign_start_instruction: |
        <h4>Pravilno preberite naslednja navodila.</h4>
        <p>naloge, ki jih boste začeli izvajati, so časovno omejene. Ko kliknete na "Začni", se bo samodejno sprožil časovnik kampanje. Za dokončanje vseh dejavnosti imate na voljo %{minutes} minut. Prizadevajte si dokončati naloge v določenem časovnem okviru in učinkovito upravljajte s časom, da se izognete hitenju med postopkom ocenjevanja. Poskrbite, da naloge dokončate v enem zamahu, zato je zdaj pravi čas, če si morate vzeti odmor</p>
      common_proctoring_instructions: |
        <h4>Proctoring</h4>
        <p>po kliku na gumb Začni boste preusmerjeni na naš sistem za proktoriranje. Ta bo med sejo spremljal vašo kamero, mikrofon in zaslon. Te seje samodejno proktorira naš izpopolnjen sistem umetne inteligence, kar zagotavlja neprekinjeno in nemoteno uporabniško izkušnjo. Seje pa lahko pregledajo tudi človeški proktorji. Označeni bodo vsi znaki nepravilnega ravnanja ali nepravilnosti. S tem želimo zagotoviti, da ne bo poskusov goljufanja. Če se ugotovi sum, bodo vaše naloge preklicane</p>
      lockdown_browser_instruction: |
        <h4>Brskalnik za proctoring</h4>
        <p>za opravljanje preverjanih nalog boste morali prenesti in namestiti poseben brskalnik. Sledite navodilom na naslednjem zaslonu. Ta brskalnik lahko odstranite, ko opravite vse zahtevane dejavnosti</p>
    instructions:
