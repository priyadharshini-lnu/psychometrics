        <p>
          Prav tako lahko razkrijemo anonimizirane podatke, za katere ni razumno verjetno, da bi vas identificirali, v komercialno legitimne in zakonite poslovne namene. Kjer imamo anonimizirane podatke, jih bomo hranili in uporabljali, ne da bi poskušali ponovno identificirati podatke, razen če to dovoljuje zakonodaja.
        </p>
        <h2>KORAKI, KI JIH SPREJEMAMO ZA VARSTVO OSEBNIH PODATKOV </h2>
        <p>
          Naše podjetje si prizadeva za skladnost z vsemi veljavnimi zakoni o kibernetski varnosti in varstvu podatkov. S temi cilji ima MMC namenskega direktorja za informacijsko varnost (CISO). in globalnega direktorja za varstvo podatkov (GCPO). Vodja CISO je odgovoren za vodenje ekipe za globalno informacijsko varnost in celovitega programa kibernetske varnosti. Kot del našega programa kibernetske varnosti smo uvedli komercialno razumne fizične, administrativne in tehnične zaščitne ukrepe za zaščito osebnih podatkov pred nepooblaščenim dostopom, uporabo, spremembo in izbrisom.
        </p>
        <p>
          GCPO vodi in nadzira Center odličnosti za zasebnost in mrežo pooblaščencev za varstvo podatkov, ki sta odgovorna za izvajanje našega celovitega globalnega programa zasebnosti. Mreža pooblaščencev za varstvo podatkov povezuje naše pooblaščence za varstvo podatkov po vsem svetu in si prizadeva za dosledno in temeljito izvajanje našega programa zasebnosti povsod, kjer obdelujemo podatke. Ime in kontaktne podatke pooblaščenca za varstvo podatkov v vaši jurisdikciji lahko dobite tako, da nas kontaktirate na <a href="mailto:privacy@mmc.com">privacy@mmc.com</a>.
        </p>
        <h2>VAŠE PRAVICE DO VARSTVA PODATKOV </h2>
        <p>
          V mnogih primerih obdelujemo osebne podatke za zagotavljanje storitev poslovnim strankam, zato se obrnite nanje, da uveljavite vse pravice, ki jih imate v skladu z veljavnimi zakoni o zasebnosti. Vendar pa imate lahko nekatere ali vse spodaj navedene pravice, odvisno od jurisdikcije in našega razloga za obdelavo vaših podatkov, kadar delujemo kot upravljavec ali podjetje, ki je primarno odgovorno za odločitev o tem, kako se vaši podatki obdelujejo. Upoštevajte, da bomo morda morali uporabiti vaše osebne podatke za preverjanje vaše identitete, preden uveljavimo katero koli od spodnjih pravic.
        </p>
        <ul>
          <li>
            <strong>Pravica dostopa (pravica do vedenja) <br /></strong>
            Lahko nas prosite, da vam posredujemo dodatne podrobnosti o tem, kako uporabljamo vaše osebne podatke, vire, kategorije ali specifične dele osebnih podatkov, ki smo jih zbrali, kategorije tretjih oseb, ki smo jim razkrili podatke, in da zahtevate kopijo osebnih podatkov, ki jih hranimo o vas.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Pravica do popravka  <br /></strong>
            Lahko nas prosite, da posodobimo morebitne netočnosti v osebnih podatkih, ki jih hranimo. Če vaše osebne podatke razkrijemo drugim, jih bomo o popravku obvestili, kjer je to mogoče.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Pravica do izbrisa  <br /></strong>
            Zahtevate lahko izbris vaših osebnih podatkov, če nimamo več zakonite podlage za njihovo obdelavo.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Pravica do ugovora ali omejitve obdelave <br /></strong>
            V določenih okoliščinah imate morda pravico omejiti obdelavo svojih osebnih podatkov, na primer če oporekate njihovi točnosti.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Pravica do prenosljivosti podatkov<br /></strong>
            Imate pravico, da kadar je to tehnično izvedljivo, zahtevate, da kopijo osebnih podatkov, ki smo jih pridobili od vas, prenesemo tretji osebi po vaši izbiri v strukturirani, pogosto uporabljeni in strojno berljivi obliki.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Pravica do preklica soglasja <br /></strong>
            Če se za obdelavo vaših osebnih podatkov zanašamo na vaše soglasje kot našo pravno podlago, imate pravico, da to soglasje prekličete.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Pravica do vložitve pritožbe<br /></strong>
            Če imate pomisleke glede katerega koli vidika naših praks varstva zasebnosti, imate pravico vložiti pritožbo pri ustreznem nadzornem ali regulativnem organu v vaši jurisdikciji.
          </li>
        </ul>
        <p>
          Če želite uveljavljati katero koli od zgoraj navedenih pravic ali zahtevati pregled odločitve ali zavrnitve, se obrnite na nas z uporabo ustreznih kontaktnih podatkov:
        </p>
        <ul>
          <li>
            Če ste v Združenem kraljestvu, Švici ali Evropskem gospodarskem prostoru
            <a
              href="https://mmc-dev-privacy.my.onetrust.com/webform/4da460d1-7bcf-4ff1-ac37-c4b804769467/draft/ea953d72-fded-42ee-b1dd-c0a5a83b7891"
              >izpolnite ta obrazec.</a
            >
          </li>
          <li>
            Za posameznike iz drugih držav izpolnite ta obrazec
            <a
              href="https://privacyportal.onetrust.com/webform/ee9df2bb-0ef3-4485-bc63-4db420e77359/225910f5-5666-468a-b1e7-39c70e24f4cc"
              >izpolnite ta obrazec.</a
            >
          </li>
          <li>
            Lahko pa nam pišete tudi na elektronski naslov <a href="mailto:privacy@mmc.com">privacy@mmc.com</a>
          </li>
        </ul>
        <p>
          Glede na vašo državo imate morda tudi nekatere ali vse naslednje pravice:
        </p>
        <ul>
          <li>
            <strong>
              Pravica do privolitve ali odjave od prodaje ali deljenja za medkontekstno oglaševanje <br />
            </strong>
            Če obiščete eno od naših spletnih mest, lahko ponudnikom analitike in oglaševanja spletnih mest razkrijemo podatke o vaši internetni ali drugi elektronski omrežni dejavnosti, biografske identifikatorje, podatke o geolokaciji in poklicne podatke (v obsegu, v katerem jih je mogoče izpeljati iz vaše dejavnosti na našem spletnem mestu) za namene medkontekstnega vedenjskega ali ciljno usmerjenega oglaševanja z uporabo oglaševalskih piškotkov. V skladu z nekaterimi zakoni imate morda pravico, da se odločite za tovrstna razkritja ali jih zavrnete. Če želite izbrati ali si ogledati imena določenih tretjih oseb, s katerimi smo prodali ali delili vaše podatke, kliknite povezavo »Upravljanje piškotkov« na dnu naše spletne strani. Če želite onemogočiti prodajo ali deljenje svojih podatkov, se prepričajte, da sta stikali za sledilnika »Oglaševanje« in »Analitika« nastavljeni na »Ne« ali, kjer je na voljo, omogočite stikalo »Ne prodajaj ali deli mojih osebnih podatkov«.
            <p>
              Prav tako lahko namestite nastavitev ali razširitev brskalnika, da samodejno sporočite svoje nastavitve prodaje in deljenja spletnim mestom, ki jih obiščete. Naša spletna mesta takšne »signale preferenc za zavrnitev« obdelujejo brezhibno s prepoznavanjem Global Privacy Control (GPC). Če želite uporabljati GPC, ga lahko prenesete in omogočite prek sodelujočega brskalnika ali razširitve brskalnika. Več informacij o prenosu GPC je na voljo <a href="https://globalprivacycontrol.org/">tukaj</a>.&nbsp;
            </p>
          </li>
        </ul>
        <ul>
          <li>
            <strong>
              Pravice v zvezi z avtomatiziranim odločanjem in profiliranjem
            <br /></strong>
            V kolikor se ukvarjamo z avtomatizirano obdelavo vaših osebnih podatkov, vas bomo vnaprej obvestili o vseh zakonsko zahtevanih obvestilih, vključno z obvestili o vaših pravicah.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Neposredno trženje in signali »Ne sledi« <br /></strong>
            Morda imate pravico, da enkrat letno zahtevate in prejmete obvestilo o osebnih podatkih, ki smo jih razkrili drugim podjetjem za njihove lastne namene neposrednega trženja, kjer to dovoljuje zakonodaja. Če je primerno, bo takšno obvestilo vsebovalo seznam kategorij osebnih podatkov, ki so bili razkriti (če obstajajo), ter imena in naslove vseh tretjih oseb, katerim so bili osebni podatki razkriti (če obstajajo). Obvestilo bo zajemalo preteklo koledarsko leto. Če želite izvedeti, ali ta pravica velja za vas, in jo v tem primeru uveljaviti, se lahko obrnete na nas na spodaj navedene načine.
          </li>
        </ul>
        <p>
          Upoštevajte, da so nekatere od teh pravic lahko omejene, kadar imamo prevladujoč legitimni interes ali zakonsko, regulativno ali pogodbeno obveznost za nadaljnjo obdelavo osebnih podatkov ali kadar so osebni podatki v skladu z veljavno zakonodajo izvzeti iz razkritja ali izbrisa. Nekatere od teh pravic je mogoče uveljavljati le v določenih okoliščinah ali pa so lahko drugače omejene z zakonodajo o varstvu podatkov v vaši jurisdikciji.
        </p>
        <h2>ČEZMEJNI PRENOSI </h2>
        <p>
          Kot globalno podjetje, ki deluje v več kot 80 državah, bomo morali v nekaterih okoliščinah prenesti osebne podatke iz države, province ali ozemlja, kjer so bili zbrani, za namene, opisane v tem obvestilu o zasebnosti. Podatke lahko prenesemo zlasti za ponujanje, upravljanje in upravljanje storitev, ki vam jih nudimo, ter za izboljšanje učinkovitosti našega poslovanja. Potrudili se bomo, da bodo ti prenosi skladni z vso ustrezno zakonodajo o varstvu podatkov in da bodo pravice in svoboščine posameznikov v skladu s to zakonodajo ustrezno zaščitene.
        </p>
        <p>
          Kadar se pojavi potreba po takšnem prenosu, bomo sprejeli ukrepe za zagotovitev ustreznih zaščitnih ukrepov za zaščito osebnih podatkov, kot so ocena učinka, odločitev o ustreznosti s strani ustreznega nadzornega organa, uporaba odobrenih zavezujočih poslovnih pravil ali standardnih pogodbenih klavzul ali vaše soglasje.
        </p>
