        <h2>HRANJENJE VAŠIH PODATKOV </h2>
        <p>
          Naši izdelki, storitve in regulativne obveznosti so kompleksni, zato se naša obdobja hrambe osebnih podatkov razlikujejo. Pri določanju obdobij hrambe osebnih podatkov in evidenc, ki jih hranimo, upoštevamo naslednje obveznosti:
        </p>
        <ul>
          <li>
            potreba po hrambi informacij za izpolnitev poslovnih namenov ali pogodbenih obveznosti, za katere so bile zbrane;
          </li>
          <li>
            naše dolžnosti izvrševanja navodil naših strank v zvezi z osebnimi podatki, ki jih obdelujemo v njihovem imenu;
          </li>
          <li>
            naše dolžnosti glede izpolnjevanja obveznih zakonskih in regulativnih zahtev glede vodenja evidenc;
          </li>
          <li>
            naše postopke varnostnega kopiranja in obnovitve po nesreči; in
          </li>
          <li>
            druge pravne posledice, kot so veljavni zastaralni roki.
          </li>
        </ul>
        <p>
          Na podlagi zgoraj navedenih dejavnikov lahko osebne podatke hranimo dlje kot v obdobju, v katerem vam zagotavljamo storitve. Ko osebnih podatkov ne potrebujemo več, politike našega podjetja zahtevajo, da podatke bodisi anonimiziramo bodisi združimo (v tem primeru lahko anonimizirane ali združene podatke še naprej hranimo in uporabljamo za analitične namene) bodisi jih varno uničimo.
        </p>
