                  Kot je potrebno za preprečevanje goljufij, komunikacijo z nadzornimi ali regulativnimi organi, zaščito in obrambo zakonskih pravic, varnosti in zaščite družbe MTE, naših povezanih družb in poslovnih partnerjev ter uporabnikov katerega koli spletnega mesta, uveljavljanje pogojev uporabe spletnega mesta; odzivanje na trditve o domnevnih ali dejanskih nezakonitih dejavnostih; odzivanje na revizijo ali preiskavo pritožbe ali varnostne grožnje; ali skladnost z veljavno zakonodajo, predpisi, pravnimi postopki ali vladnimi zahtevami.
