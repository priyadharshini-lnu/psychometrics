        <h1><strong>OBVESTILO O ZASEBNOSTI MERCER TALENT ENTERPRISE </strong>&nbsp;</h1>
        <p>Datum veljavnosti: 15 September 2024</p>
        <p>
          To obvestilo o zasebnosti opisuje, kako podjetje Mercer Talent Enterprise (“
          <strong>MTE</strong>
          ”) zbira, uporablja, deli, hrani, prenaša in drugače obdeluje podatke v zvezi z identificiranimi ali določljivimi posamezniki (osebni podatki), in pravice, ki jih imate morda v zvezi z vašimi osebnimi podatki. Menimo, da je pomembno, da razumete, kako obdelujemo osebne podatke, in vas spodbujamo, da si vzamete trenutek in se seznanite z našimi spodaj opisanimi praksami glede zasebnosti.
        </p>
        <p>
