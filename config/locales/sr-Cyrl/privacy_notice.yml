        <h2>КОРАЦИ КОЈЕ ПРЕДУЗИМАМО ДА БИСМО ЗАШТИТИЛИ ЛИЧНЕ ПОДАЦЕ </h2>
        <p>
          Наша компанија тежи да се придржава свих важећих закона о сајбер безбедности и заштити података. Имајући ове циљеве у виду, MMC има посебног главног службеника за безбедност информација (CISO). и Глобалног главног службеника за приватност (GCPO). CISO је одговоран за управљање тимом за глобалну информациону безбедност и свеобухватним програмом сајбер безбедности. Као део нашег програма сајбер безбедности, имплементирали смо комерцијално разумне физичке, административне и техничке мере заштите како бисмо заштитили личне податке од неовлашћеног приступа, употребе, измене и брисања.
        </p>
        <p>
          ГЦПО води и надгледа Центар изврсности за приватност и Мрежу службеника за заштиту података који су одговорни за спровођење нашег свеобухватног глобалног програма приватности. Мрежа службеника за заштиту података повезује наше службенике за заштиту података широм света и настоји да доследно и темељно спроводи наш програм приватности где год обрађујемо податке. Име и контакт информације службеника за заштиту података у вашој јурисдикцији можете добити тако што ћете нас контактирати на <a href="mailto:privacy@mmc.com">privacy@mmc.com</a>.
        </p>
        <h2>ВАША ПРАВА НА ЗАШТИТУ ПОДАТАКА </h2>
        <p>
          У многим случајевима, обрађујемо личне податке како бисмо пружили наше услуге корпоративним клијентима и требало би да их контактирате да бисте остварили сва права која имате према важећим законима о приватности. Међутим, тамо где делујемо као контролор или предузеће које је првенствено одговорно за одлучивање о томе како се ваши подаци обрађују, можете имати нека или сва права наведена у наставку, у зависности од јурисдикције и нашег разлога за обраду ваших података. Имајте у виду да ћемо можда морати да користимо ваше личне податке да бисмо потврдили ваш идентитет пре него што одговоримо на било које од доле наведених права.
        </p>
        <ul>
          <li>
            <strong>Право приступа (право на знање) <br /></strong>
            Можете нас замолити да вам пружимо додатне детаље о томе како користимо ваше личне податке, изворе, категорије или одређене делове личних података које смо прикупили, категорије трећих лица којима смо открили информације, као и да затражите копију личних података које поседујемо о вама.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Право на исправку <br /></strong>
            Можете нас замолити да ажурирамо све нетачности у личним подацима које поседујемо. Ако откријемо ваше личне податке другима, обавестићемо их о исправци где је то могуће.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Право на брисање <br /></strong>
            Можете нас замолити да обришемо ваше личне податке уколико више немамо законски основ за њихову обраду.
          </li>
        </ul>
