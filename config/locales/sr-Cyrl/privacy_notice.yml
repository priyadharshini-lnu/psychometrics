        </p>
        <ul>
          <li>
            <strong>
              Право на прихватање или одустајање од продаје или дељења за оглашавање у више контекста <br />
            </strong>
            Ако посетите једну од наших веб страница, можемо открити информације о вашој интернет или другој активности на електронској мрежи, биографске идентификаторе, податке о геолокацији и професионалне информације (у мери у којој се могу извести из ваше активности на нашој веб страници) добављачима аналитике и оглашавања на веб страницама у сврху међуконтекстног бихевиоралног или циљаног оглашавања користећи колачиће за оглашавање. Према неким законима, можда имате право да се пријавите или онемогућите ове врсте откривања. Да бисте направили свој избор или видели имена одређених трећих страна са којима смо продали или поделили ваше податке, кликните на везу „Управљај колачићима“ на дну наше веб странице. Ако желите да се искључите из продаје или дељења ваших података, уверите се да су прекидачи за праћење „Оглашавање“ и „Аналитика“ подешени на „Не“ или, где је доступно, омогућите прекидач „Не продај или дели моје личне податке“.
            <p>
