          </li>
        </ul>
        <ul>
          <li>
            <strong>Право на повлачење сагласности <br /></strong>
            Ако се ослањамо на вашу сагласност као наш правни основ за обраду ваших личних података, имате право да повучете ту сагласност.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Право на подношење жалбе<br /></strong>
