            Можда имате право да захтевате и добијете обавештење једном годишње о личним подацима које смо открили другим предузећима у сврху њиховог директног маркетинга, где је то дозвољено законом. Ако је применљиво, такво обавештење ће садржати листу категорија личних података који су откривени (ако их има) и имена и адресе свих трећих лица којима су лични подаци откривени (ако их има). Обавештење ће се односити на претходну календарску годину. Можете нас контактирати на начин наведен у наставку ако желите да сазнате да ли се ово право односи на вас и, ако јесте, да га искористите.
