        <h2>ЧУВАЊЕ ВАШИХ ПОДАТАКА </h2>
        <p>
          Наши производи, услуге и регулаторне обавезе су сложени и стога се наши периоди чувања личних података разликују. Приликом одређивања периода чувања личних података и евиденције коју водимо, узимамо у обзир следеће обавезе:
        </p>
        <ul>
          <li>
            потреба за чувањем информација ради испуњења пословних сврха или уговорних обавеза за које су прикупљене;
          </li>
          <li>
            наше дужности да спроводимо упутства наших клијената у вези са личним подацима које обрађујемо у њихово име;
          </li>
          <li>
            наше дужности да се придржавамо обавезних законских и регулаторних захтева за вођење евиденције;
          </li>
          <li>
            наше процедуре за прављење резервних копија и опоравак од катастрофе; и
          </li>
          <li>
            друге правне последице као што су важећи рокови застарелости.
          </li>
        </ul>
        <p>
          На основу горе наведених фактора, можемо задржати личне податке дуже од периода у којем вам пружамо услуге. Када више не морамо да чувамо личне податке, политике наше компаније захтевају да или анонимизирамо или агрегирамо информације (у ком случају можемо даље задржати и користити анонимизоване или агрегиране информације у сврхе аналитике) или их безбедно уништити.
        </p>
        <h2>ПИТАЊА ИЛИ ЗАБРИЊЕНОСТИ </h2>
        <p>
          Да бисте послали питања или захтеве у вези са овим Обавештењем о приватности или праксама приватности компаније MTE , пошаљите нам е-пошту на адресу <a href="mailto:privacy@mmc.com">privacy@mmc.com</a>. Ако желите да нас контактирате поштом или телефоном, обратите се свом локалном службенику за заштиту података. Контакт информације свог локалног службеника за заштиту података можете добити тако што ћете нас контактирати на адресу
          <a href="mailto:privacy@mmc.com">privacy@mmc.com</a>.
