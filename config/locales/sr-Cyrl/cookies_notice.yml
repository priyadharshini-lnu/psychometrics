    <h2>Обавештење о колачићима</h2>

    <p>Датум ступања на снагу: 14. децембар 2023.</p>

    <p>На овој веб страници користимо колачиће и сродне технологије праћења, укључујући веб маяке, пикселе за праћење и дневничке датотеке (заједно означене као колачићи), како бисмо вас разликовали од других корисника, проценили и побољшали функционалност веб странице и наших услуга и пружили добро корисничко искуство.</p>

    <p><strong>ШТА ЈЕ КОЛАЧИЋ</strong></p>

    <p>Колачићи су информације које се размењују између вашег веб прегледача и веб странице. Неки колачићи су потребни за функционисање веб странице. Неки нам помажу да проценимо и побољшамо њено функционисање. Колачиће користимо и за пружање релевантног садржаја, производа и услуга. Колачић не може да чита податке са тврдог диска вашег рачунара.</p>

    <p><strong>Постоје различите врсте колачића са различитим функцијама:</strong></p>

    <p><strong>(i) Сесијски колачићи:</strong> ови колачићи се чувају на вашем рачунару само током ваше сесије. Аутоматски се бришу по затварању прегледача. Обично чувају анонимни ИД сесије који вам омогућава прегледање веб странице без потребе за пријављивањем на сваку страницу. Не прикупљају никакве информације са вашег рачунара.</p>

    <p><strong>(ii) Трајни колачићи:</strong> ови колачићи се чувају као датотека на вашем рачунару и остају тамо када затворите прегледач. Веб страница их може прочитати када поново посетите веб страницу.</p>

    <p><strong>(iii) Колачићи првог лица:</strong> ове колачиће креира наша компанија. Чувају се и шаљу између наших сервера и тврдог диска вашег рачунара. Ови колачићи могу бити или сесијски или трајни.</p>

    <p><strong>(iv) Колачићи трећих лица:</strong> ове колачиће креира један од наших трећих партнера. Чувају се и шаљу између сервера трећег лица и тврдог диска вашег рачунара. Ови колачићи су обично трајни.</p>

    <p><strong>КАКО И ЗАШТО КОРИСТИМО КОЛАЧИЋЕ</strong></p>

    <p>У зависности од веб странице, колачиће можемо користити у следеће сврхе:</p>

    <p><strong>Где су неопходни</strong></p>

    <p>Ови колачићи су неопходни за кретање по веб страници и коришћење њених функција, као што је приступ заштићеним подручјима. Без ових колачића није могуће пружити услуге које сте захтевали, као што је добијање понуде или пријава на налог. Ови колачићи не прикупљају информације о вама које би се могле користити у маркетиншке сврхе или за памћење ваших посета.</p>

    <p><strong>Функционалност</strong></p>

    <p>Ови колачићи омогућавају веб страници да запамти ваше изборе (нпр. корисничко име, језик или регион) и пружа напредне функције. На пример, веб страница може запамтити ваше податке за пријаву тако да не морате поново да се пријављујете када користите исту уређај. Колачићи се такође могу користити за памћење промена величине текста, фонта и других прилагођених елемената. Могу се користити и за пружање услуга које сте захтевали, као што је гледање видео снимака или коментарисање чланака. Прикупљене информације су обично анонимизоване и не могу се користити за оглашавање или праћење вашег понашања на мрежи.</p>

    <p><strong>Аналитика</strong></p>

    <p>Ови колачићи прикупљају информације о томе како посетиоци користе веб страницу, на пример које странице посећују најчешће и да ли добијају грешке. Такође омогућавају бројаче посетилаца, што нам помаже да побољшамо функционисање веб странице.</p>

    <p><strong>Реклама</strong></p>

    <p>Ови колачићи се користе за приказивање релевантних огласа и мерење њихове ефикасности. Рекламни колачићи су обично трећих лица и могу бити присутни чак и ако на веб страници нема реклама.</p>

    <p><strong>IP адресе</strong></p>

    <p>При посети веб странице можемо прикупити вашу IP адресу за добијање неособних података, на пример за праћење географских локација корисника.</p>

    <p><strong>КАКО УПРАВЉАТИ КОЛАЧИЋИМА</strong></p>

    <p>Кликните на линк „Управљај колачићима“ на дну странице да се пријавите или одјавите путем нашег менаџера пристанка за колачиће. Напомена: неопходне колачиће није могуће онемогућити, па странице које користе само ове колачиће можда неће приказати ову опцију.</p>

    <p>Неки колачићи се такође могу онемогућити преко подешавања прегледача. Погледајте помоћ свог прегледача за више информација.</p>

    <p><strong>ОБАВЕШТЕЊЕ О КОЛАЧИЋИМА НЕ ОДНОСИ СЕ НА ВЕБ СТРАНЕ ТРЕЋИХ ЛИЦА</strong></p>

    <p>Када укључимо линкове до других веб страница, имајте на уму да имају своје политике приватности и колачића које регулишу употребу свих информација које пошаљете. Препоручујемо да прочитате њихове политике јер нисмо одговорни за њихове праксе.</p>

    <p><strong>ИЗМЕНЕ ОБАВЕШТЕЊА О КОЛАЧИЋИМА</strong></p>

    <p>Ове политике можемо повремено ажурирати. Препоручујемо да их редовно прегледате како бисте били обавештени о коришћењу колачића. Датум ступања на снагу политике је наведен на врху странице.</p>

    <p><strong>ОПИС КОРИШЋЕНИХ КОЛАЧИЋА</strong></p>

    <p>Кликните на линк „Управљај колачићима“ у подножју веб странице да бисте видели детаље о појединачним колачићима који се користе. Овај линк можда није увек доступан, на пример ако веб страница користи само неопходне колачиће.</p>

    <p><strong>КОНТАКТИРАЈТЕ НАС</strong></p>

    <p>Ако имате било каква питања у вези овог обавештења о колачићима, контактирајте нас као што је наведено у нашем обавештењу о приватности.</p>
