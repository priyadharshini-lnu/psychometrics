    video: Видео
    video_and_audio: Видео и аудио
    video_and_audio_recording: Видео и аудио снимање
    video_check_description: Ово је провера система пре теста. Снимићете видео у трајању од 30 секунди да бисте проверили звук и слику. Говорите непрекидно и немојте стајати док се снимање аутоматски не заврши.
    video_check_fix_fifth: Пробајте да искључите и поново прикључите камеру ако је спољна.
    video_check_fix_first: Кликните на "Дозволи" када прегледач затражи дозволу за камеру.
    video_check_fix_fourth: Проверите да ли је ваша камера прикључена и укључена.
    video_check_fix_second: Идите у подешавања прегледача и омогућите приступ камери за ову веб-страницу.
    video_check_fix_sixth: Поново покрените прегледач и покушајте поново.
    video_check_fix_third: Затворите друге апликације које користе камеру (Zoom, Teams итд.)
    video_overlay_label: Изаберите микрофон и камеру, кликните на "Сними", а затим прочитајте следећу поруку чим притиснете дугме "Сними".
    video_overlay_message: Изаберите микрофон и камеру, кликните на „Сними“, а затим наглас прочитајте и поновите реченицу која се појављује на дну 3 пута.
    video_recorder_label: Видео снимач
    video_upload_failed_camera_access: Не можемо да приступимо вашој камери или микрофону. Молимо вас да проверите дозволе на уређају и покушате поново.
    video_upload_failed_chunk_upload: Део снимања није отпремљен. Молимо вас да проверите интернет везу и покушате поново.
    video_upload_failed_finalize: Снимак је направљен, али није могао да се сачува. Молимо покушајте поново.
    video_upload_failed_no_recording: Није пронађен ниједан снимак за отпремање. Молимо снимите поново.
    view_details: Прикажи детаље
    webgl_api_fix_description_first: Уверите се да ваш прегледач подржава WebGL и да је он омогућен у подешавањима.
    webgl_api_fix_description_second: Ажурирајте графичке драјвере на најновију верзију.
    webgl_api_fix_title: WebGL није подржан или омогућен у вашем прегледачу
    webgl_api_support: Подршка за WebGL API
    webgl_not_supported_detail: Користите верзију прегледача "%{browser_name}" (%{browser_version}) која не подржава WebGL. Молимо ажурирајте свој прегледач на најновију верзију како бисте осигурали компатибилност.
