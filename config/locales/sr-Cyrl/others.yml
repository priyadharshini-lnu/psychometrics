    inactive_campaign_message: Тренутно вам нису додељене никакве активности.
    insights_reports: Увиди и извештаји
    instruction_modal:
      campaign_start_final_instructions: "<p>Имајте на уму да не постоји начин да зауставите или паузирате тајмер. Тајмер кампање ће наставити да ради чак и када затворите прегледач, тако да ни у једном тренутку не би требало да размишљате о томе да оставите задатке између да бисте радили нешто друго. Обавезно минимизирајте ометања током задатака. Пронађите мирно окружење, искључите обавештења на својим уређајима и избегавајте обављање више задатака истовремено. Одржавајте концентрацију и останите фокусирани. Када тајмер кампање истекне, нећете моћи да наставите. Ако сте прочитали горња упутства, кликните на „старт“ да бисте наставили са додељеним задацима.</p>\n"
      campaign_start_instruction: "<h4>Молимо вас да пажљиво прочитате следећа упутства.</h4><p> Задаци које ћете ускоро започети су временски ограничени. Када кликнете на „Старт“, тајмер кампање ће се аутоматски покренути. Имате %{minutes} минута да завршите све активности. Молимо вас да тежите да завршите задатке у предвиђеном временском оквиру и ефикасно управљате временом како бисте избегли журбу кроз процес евалуације. Обавезно завршите задатке одједном, тако да ако вам је потребна пауза, сада је време.</p>\n"
      common_proctoring_instructions: "<h4>Надзор</h4><p> Након што кликнете на дугме „Старт“, бићете преусмерени на наш систем за надзор. Он ће пратити вашу камеру, микрофон и екран током ваше сесије. Ове сесије аутоматски надгледа наш софистицирани систем вештачке интелигенције, пружајући непрекидно и глатко корисничко искуство. Међутим, сесије могу прегледати и људски надзорници. Сви знаци недоличног понашања или неправилности биће означени. Ово се ради како би се осигурало да нема покушаја варања. Уколико се пронађу сумње, ваш(и) задатак(и) ће бити отказан(и).</p>\n"
      lockdown_browser_instruction: "<h4>Прегледач за надзор</h4><p> Биће потребно да преузмете и инсталирате посебан прегледач да бисте завршили задатке под надзором. Пратите упутства на следећем екрану. Можете га деинсталирати након што завршите све потребне активности.</p>\n"
    instructions:
