      guidelines:
        cards:
          c1:
            content: Укључите вештине, знања и способности које треба развити. Уверите се да су специфични, мерљиви, оствариви, реални и разумно способни да се постигну у наведеним роковима.
            title: Развојни циљеви
          c2:
            content: Ово се заснива на компетенцији која се развија на основу искуства процене.
            title: Надлежност
          c3:
            content: Овај одељак укључује ваше развојне акције засноване на доле наведеном моделу учења КСНУМКС-КСНУМКС-КСНУМКС. Саветује се да изаберете комбинацију сваког од три елемента како бисте осигурали разноврстан приступ учењу и развоју.
            title: Активности
          c4:
            content: Уверите се да су ваши рокови реални на основу тога када циљ може бити потпун. Да ли измените ово као и када је то потребно.
            title: Временска линија
          c5:
            content: Користите одељак напретка да бисте подржали напредовање на идентификованим стазама.
            title: Напредак
        chart:
          collaboration: "<стронг>20%</стронг>Колаборативно учење < бр / >"
          job: "<стронг>70%</стронг>Учење < бр / > на послу"
          learn: "<стронг>10%</стронг>Формално учење"
        content:
          list:
            r1: Имајте у виду да је ова листа само оријентациона, и да се за вас могу размотрити додатни путеви развоја на основу ваших појединачних амбиција, препорука вашег менаџера, као и пословних приоритета организације.
            r2: Корисници се подстичу да критички прегледају сав садржај и слободни су да измене, усаврше, замене или додају било које акције или препоруке са којима се не слажу.
            r3: 'Улази за развој укључени у овај извештај могу бити изведени из једног или оба следећа извора:'
            r3a: Прилагођена развојна библиотека креирана за вашу организацију
            r3b: Вештачка интелигенција генерише предлоге за развој
            r4: Овај IDP извештај је генерисан уз помоћ вештачке интелигенције и може садржати нетачности. Увиди и препоруке које се пружају треба тумачити с опрезом и користити их искључиво као алат за ваш лични и професионални развој. Извештај важи у периоду од 12 до 18 месеци.
          main: IDP који је креиран садржи детаљну листу развојних активности које можете предузети, имајући у виду најбоље праксе учења, тј. смерницу 70-20-10, која пружа прогресивно путовање комбинујући учење у учионици, коучинг и учење на радном месту. На основу резултата процеса асесмент центра, ваших одговора у разговорима и спољних извештаја, где је применљиво, предложене су могуће стазе развоја које се могу размотрити за ваш развој.
        learn_cards:
          collaboration:
            list:
            - Понудите да тренирате или менторишете друге
            - Захтев за менторство од стране стручњака у вашој области
            - Добијте ментора који ће подржати ваш развој
            - Организујте колаборативну радну групу за дискусију о текућим изазовима у пословању.
            - Добијајте повратне информације формално и неформално од других.
            - Играјте активну улогу у индустријским удружењима и мрежама
            - Изградите своје спољне мреже
            title: Колаборативно учење (КСНУМКС%) <бр/> - Развијање кроз друге
          job:
            list:
            - Преузмите лидерске позиције у одборима заинтересованих страна или у управљачким одборима.
            - Пријавите се добровољно да водите пројекте управљања променама у организацији.
            - Размислите о преузимању задатака истезања.
            - Радите у међуфункционалној сарадњи са другим функцијама
            - Размотрите вођење пројеката ван ваше организације
            - Радите блиско са спољним стручњацима из индустрије на заједничким пројектима.
            title: Учење на послу (КСНУМКС%) <бр/> Развој кроз искуство
          learn:
            list:
            - Похађајте структурисане програме обуке
            - Завршите онлајн курсеве е-учења
            - Читајте књиге, чланке, публикације
            - Стеците стручне квалификације, сертификате и акредитације
            - Похађајте курсеве, радионице, семинаре
            title: Формално учење (10%) <бр/> Развој кроз структурирано учење
