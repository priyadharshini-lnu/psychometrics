  cookies_notice: |-
    <h2>Thông báo về Cookie</h2>

    <p>Ngày có hiệu lực: 14 tháng 12 năm 2023</p>

    <p>Trang web này sử dụng cookie và các công nghệ theo dõi liên quan, bao gồm beacon web, pixel theo dõi và tệp nhật ký (gọi chung là “cookie”) để phân biệt bạn với những người dùng khác, đánh giá và cải thiện chức năng của trang web và dịch vụ của chúng tôi, cũng như mang lại trải nghiệm tốt cho người dùng.</p>

    <p><strong>Cookie là gì</strong></p>

    <p>Cookie là thông tin được chia sẻ giữa trình duyệt của bạn và trang web. Một số cookie là cần thiết để trang web hoạt động. Một số khác giúp chúng tôi đánh giá và cải thiện hiệu suất. Chúng tôi cũng sử dụng cookie để cung cấp nội dung, sản phẩm và dịch vụ phù hợp. Cookie không thể đọc dữ liệu từ ổ cứng của bạn.</p>

    <p><strong>Có nhiều loại cookie với các chức năng khác nhau:</strong></p>

    <p><strong>(i) Cookie phiên:</strong> Các cookie này được lưu trên máy tính của bạn chỉ trong phiên làm việc trên trang web. Chúng sẽ tự động bị xóa khi bạn đóng trình duyệt. Thường lưu trữ ID phiên ẩn danh, cho phép bạn duyệt trang web mà không cần đăng nhập mỗi trang. Không thu thập thông tin từ máy tính của bạn.</p>

    <p><strong>(ii) Cookie vĩnh viễn:</strong> Các cookie này được lưu dưới dạng tệp trên máy tính của bạn và vẫn tồn tại khi bạn đóng trình duyệt. Trang web có thể đọc chúng khi bạn quay lại trang web.</p>

    <p><strong>(iii) Cookie từ chính trang web:</strong> Các cookie này được tạo bởi công ty chúng tôi, được lưu và gửi giữa máy chủ của chúng tôi và ổ cứng của bạn. Chúng có thể là cookie phiên hoặc cookie vĩnh viễn.</p>

    <p><strong>(iv) Cookie từ bên thứ ba:</strong> Các cookie này được tạo bởi đối tác bên thứ ba. Chúng được lưu và gửi giữa máy chủ bên thứ ba và ổ cứng của bạn. Thường là cookie vĩnh viễn.</p>

    <p><strong>Cách và lý do sử dụng cookie</strong></p>

    <p>Tùy thuộc vào trang web, cookie có thể được sử dụng cho các mục đích sau:</p>

    <p><strong>Không thể thiếu cho hoạt động trang web</strong></p>

    <p>Cookie này cần thiết để bạn có thể điều hướng và sử dụng các chức năng của trang web, như truy cập vào các khu vực bảo mật. Không có cookie này, trang web không thể cung cấp các dịch vụ mà bạn yêu cầu, ví dụ như nhận báo giá hoặc đăng nhập vào tài khoản. Cookie không thu thập thông tin cá nhân của bạn để sử dụng cho tiếp thị hoặc ghi nhớ các trang bạn đã truy cập.</p>

    <p><strong>Chức năng</strong></p>

    <p>Cookie giúp trang web ghi nhớ các lựa chọn của bạn (như tên người dùng, ngôn ngữ, khu vực) và cung cấp các chức năng nâng cao. Ví dụ: trang web có thể ghi nhớ thông tin đăng nhập để bạn không phải đăng nhập nhiều lần khi sử dụng cùng một thiết bị. Cookie cũng có thể ghi nhớ các thay đổi về kích thước chữ, font chữ, và các phần của trang web mà bạn đã tùy chỉnh. Chúng cũng có thể được sử dụng để cung cấp dịch vụ bạn yêu cầu, như xem video hoặc bình luận bài viết. Dữ liệu thu thập thường được ẩn danh và không dùng cho quảng cáo hoặc theo dõi hành vi trực tuyến.</p>

    <p><strong>Phân tích</strong></p>

    <p>Cookie này thu thập thông tin về cách người truy cập sử dụng trang web, ví dụ các trang được truy cập nhiều nhất và có lỗi xảy ra hay không. Chúng giúp chúng tôi ghi nhận và đếm số lượt truy cập, nhằm cải thiện cách hoạt động của trang web.</p>

    <p><strong>Quảng cáo</strong></p>

    <p>Cookie này dùng để hiển thị quảng cáo phù hợp với bạn và quản lý hiệu quả quảng cáo. Cookie quảng cáo thường từ bên thứ ba và có thể xuất hiện ngay cả khi trang web không có quảng cáo.</p>

    <p><strong>Địa chỉ IP</strong></p>

    <p>Khi bạn truy cập trang web, chúng tôi có thể thu thập địa chỉ IP của bạn để theo dõi và thu thập dữ liệu không cá nhân, ví dụ như để kiểm tra khu vực người dùng truy cập.</p>

    <p><strong>Cách quản lý cookie</strong></p>

    <p>Nhấp vào liên kết “Quản lý cookie” ở cuối trang để đăng nhập hoặc đăng xuất qua trình quản lý sự đồng ý về cookie. Lưu ý: không thể tắt các cookie cần thiết, vì vậy các trang chỉ dùng cookie này có thể không cung cấp liên kết này.</p>

    <p>Bạn cũng có thể tắt một số cookie thông qua cài đặt trình duyệt. Thông tin chi tiết xem trong mục Trợ giúp (Help) của trình duyệt.</p>

    <p><strong>Thông báo cookie này không áp dụng cho các trang web của bên thứ ba</strong></p>

    <p>Khi có liên kết đến các trang web khác, hãy nhớ rằng họ có chính sách riêng về quyền riêng tư và cookie. Chúng tôi khuyến nghị bạn đọc các chính sách đó, vì chúng tôi không chịu trách nhiệm về thực tiễn của họ.</p>

    <p><strong>Thay đổi thông báo cookie</strong></p>

    <p>Chính sách này có thể được cập nhật định kỳ, bạn nên xem lại để biết cách chúng tôi sử dụng cookie. Ngày có hiệu lực được nêu ở đầu trang.</p>

    <p><strong>Chi tiết cookie đã sử dụng</strong></p>

    <p>Nhấp vào liên kết “Quản lý cookie” ở cuối trang để xem chi tiết các cookie đã sử dụng. Liên kết này có thể không xuất hiện nếu trang web chỉ dùng cookie cần thiết.</p>

    <p><strong>Liên hệ chúng tôi</strong></p>

    <p>Nếu bạn có câu hỏi về thông báo cookie này, vui lòng liên hệ với chúng tôi theo thông tin trong chính sách quyền riêng tư được liên kết bên dưới.</p>
