        <h2>CÁC BƯỚC CHÚNG TÔI THỰC HIỆN ĐỂ BẢO VỆ THÔNG TIN CÁ NHÂN </h2>
        <p>
          Công ty chúng tôi phấn đấu tuân thủ tất cả các luật bảo vệ dữ liệu và an ninh mạng hiện hành. Với những mục tiêu này, MMC có một Giám đốc An ninh Thông tin (CISO) chuyên trách và Giám đốc Bảo mật Toàn cầu (GCPO). CISO chịu trách nhiệm quản lý nhóm Bảo mật Thông tin Toàn cầu và chương trình an ninh mạng toàn diện. Là một phần của chương trình an ninh mạng, chúng tôi đã triển khai các biện pháp bảo vệ vật lý, quản lý và kỹ thuật hợp lý về mặt thương mại để bảo vệ Thông tin Cá nhân khỏi việc truy cập, sử dụng, thay đổi và xóa trái phép.
        </p>
        <p>
          GCPO lãnh đạo và giám sát Trung tâm Bảo vệ Quyền riêng tư và Mạng lưới cán bộ bảo vệ dữ liệu chịu trách nhiệm thực hiện chương trình bảovệ quyền riêng tư toàn cầu toàn diện của chúng tôi. Mạng lưới cán bộ bảo vệ dữ liệu kết nối các cán bộ bảo vệ dữ liệu của chúng tôi trên toàn thế giới và tìm cách thực hiện chương trình bảo vệ quyền riêng tư của chúng tôi một cách nhất quán và toàn diện ở bất kỳ nơi nào chúng tôi xử lý dữ liệu. Bạn có thể lấy tên và thông tin liên hệ của Cán bộ bảo vệ dữ liệu tại khu vực pháp lý của mình bằng cách liên hệ với chúng tôi theo địa chỉ <a href="mailto:privacy@mmc.com">privacy@mmc.com</a>.
        </p>
        <h2>QUYỀN BẢO VỆ DỮ LIỆU CỦA BẠN </h2>
        <p>
          Trong nhiều trường hợp, chúng tôi xử lý Thông tin cá nhân để cung cấp dịch vụ cho khách hàng doanh nghiệp và bạn nên liên hệ với họ để thực hiện bất kỳ quyền nào bạn có thể có theo luật bảo mật hiện hành. Tuy nhiên, khi chúng tôi hoạt động với tư cách là bên kiểm soát dữ liệu hoặc doanh nghiệp chịu trách nhiệm chính trong việc quyết định cách xử lý thông tin của bạn, bạn có thể có một số hoặc tất cả các quyền được liệt kê dưới đây, tùy thuộc vào khu vực pháp lý và lý do chúng tôi xử lý thông tin của bạn. Xin lưu ý rằng chúng tôi có thể cần sử dụng Thông tin cá nhân của bạn để xác minh danh tính của bạn trước khi phản hồi bất kỳ quyền nào dưới đây.
        </p>
        <ul>
          <li>
            <strong>Quyền tiếp cận (Quyền được biết) <br /></strong>
            Bạn có thể yêu cầu chúng tôi cung cấp thêm thông tin chi tiết về cách chúng tôi sử dụng Thông tin cá nhân của bạn, các nguồn, loại hoặc thông tin cá nhân cụ thể mà chúng tôi đã thu thập, các danh mục bên thứ ba mà chúng tôi đã tiết lộ thông tin và yêu cầu cung cấp bản sao Thông tin cá nhân mà chúng tôi lưu giữ về bạn.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Quyền sửa chữa <br /></strong>
            Bạn có thể yêu cầu chúng tôi cập nhật bất kỳ chi tiết không chính xác nào trong Thông tin cá nhân mà chúng tôi nắm giữ. Nếu chúng tôi tiết lộ Thông tin cá nhân của bạn cho người khác, chúng tôi sẽ thông báo cho họ về việc sửa đổi khi có thể.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Quyền xóa <br /></strong>
            Bạn có thể yêu cầu chúng tôi xóa Thông tin cá nhân của bạn khi chúng tôi không còn căn cứ hợp pháp để xử lý thông tin đó.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Quyền phản đối hoặc hạn chế xử lý <br /></strong>
            Bạn có thể có quyền hạn chế việc xử lý Thông tin cá nhân của mình trong một số trường hợp nhất định, chẳng hạn như khi bạn tranh chấp về tính chính xác của thông tin đó.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Quyền chuyển dữ liệu <br /></strong>
            Khi khả thi về mặt kỹ thuật, bạn có quyền yêu cầu chúng tôi chuyển cho bên thứ ba mà bạn lựa chọn một bản sao Thông tin cá nhân mà chúng tôi thu thập được từ bạn, theo định dạng có cấu trúc, được sử dụng phổ biến và có thể đọc được bằng máy.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Quyền rút lại sự đồng ý <br /></strong>
            Nếu chúng tôi dựa vào sự đồng ý của bạn làm cơ sở pháp lý để xử lý Thông tin cá nhân của bạn, bạn có quyền rút lại sự đồng ý đó.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Quyền khiếu nại<br /></strong>
            Bạn có quyền nộp đơn khiếu nại lên cơ quan giám sát hoặc quản lý có thẩm quyền tại khu vực pháp lý của mình nếu bạn có thắc mắc về bất kỳ khía cạnh nào trong chính sách bảo mật của chúng tôi.
          </li>
        </ul>
        <p>
          Nếu bạn muốn thực hiện bất kỳ quyền nào nêu trên hoặc yêu cầu xem xét lại quyết định hoặc từ chối, vui lòng liên hệ với chúng tôi bằng thông tin liên hệ áp dụng:
        </p>
        <ul>
          <li>
            Đối với cá nhân ở Vương quốc Anh, Thụy Sĩ,  hoặc Khu vực kinh tế châu Âu, vui lòng
            <a
              href="https://mmc-dev-privacy.my.onetrust.com/webform/4da460d1-7bcf-4ff1-ac37-c4b804769467/draft/ea953d72-fded-42ee-b1dd-c0a5a83b7891"
              >điền vào biểu mẫu này</a
            >
          </li>
          <li>
            Đối với cá nhân ở các quốc gia khác, vui lòng
            <a
              href="https://privacyportal.onetrust.com/webform/ee9df2bb-0ef3-4485-bc63-4db420e77359/225910f5-5666-468a-b1e7-39c70e24f4cc"
              >điền vào biểu mẫu này</a
            >
          </li>
          <li>
            Ngoài ra, bạn có thể gửi email cho chúng tôi theo địa chỉ <a href="mailto:privacy@mmc.com">privacy@mmc.com</a>
          </li>
        </ul>
        <p>
          Tùy thuộc vào quốc gia của bạn, bạn cũng có thể có một số hoặc tất cả các quyền sau:
        </p>
        <ul>
          <li>
            <strong>
              Quyền lựa chọn tham gia hoặc không tham gia Bán hoặc Chia sẻ để Quảng cáo xuyên ngữ cảnh <br />
            </strong>
            Nếu bạn truy cập một trong các trang web của chúng tôi, chúng tôi có thể tiết lộ thông tin hoạt động trên internet hoặc mạng điện tử khác, thông tin tiểu sử, dữ liệu định vị địa lý và thông tin chuyên môn (trong phạm vi có thể thu thập được từ hoạt động của bạn trên trang web của chúng tôi) cho các nhà cung cấp dịch vụ phân tích và quảng cáo trang web cho mục đích quảng cáo theo ngữ cảnh chéo hoặc mục đích quảng cáo có mục tiêu bằng cách sử dụng cookie quảng cáo. Theo một số luật, bạn có thể có quyền lựa chọn tham gia hoặc không tham gia các loại tiết lộ này. Để lựa chọn hoặc xem tên của các bên thứ ba cụ thể mà chúng tôi đã bán hoặc chia sẻ thông tin của bạn, vui lòng nhấp vào liên kết "Quản lý cookie" ở cuối trang web của chúng tôi. Nếu bạn muốn từ chối bán hoặc chia sẻ thông tin của mình, hãy đảm bảo rằng các nút chuyển đổi cho trình theo dõi "Quảng cáo" và "Phân tích" được đặt thành "Không" hoặc, nếu có, hãy bật nút chuyển đổi Không bán hoặc chia sẻ thông tin cá nhân của tôi.
            <p>
              Bạn cũng có thể triển khai cài đặt trình duyệt hoặc tiện ích mở rộng để tự động truyền đạt sở thích bán  và chia sẻ của bạn đến các trang web bạn truy cập. Các trang web của chúng tôi xử lý các "tín hiệu tùy chọn không tham gia" theo cách không gây cản trở bằng cách nhận ra Kiểm soát quyền riêng tư toàn cầu (GPC). Nếu bạn muốn sử dụng GPC, bạn có thể tải xuống và bật nó thông qua trình duyệt tham gia hoặc tiện ích mở rộng trình duyệt. Có thêm thông tin về việc tải xuống GPC <a href="https://globalprivacycontrol.org/">đây</a>.&nbsp;
            </p>
          </li>
        </ul>
        <ul>
          <li>
            <strong>
              Quyền liên quan đến việc ra quyết định tự động và lập hồ sơ
            <br /></strong>
            Trong phạm vi chúng tôi tham gia vào quá trình xử lý tự động Thông tin cá nhân của bạn, chúng tôi sẽ thông báo trước cho bạn, bao gồm thông báo liên quan đến quyền của bạn, theo yêu cầu của pháp luật.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Tiếp thị trực tiếp và Không theo dõi <br /></strong>
            Bạn có quyền yêu cầu và nhận thông báo hằng năm về Thông tin cá nhân mà chúng tôi đã tiết lộ cho các doanh nghiệp khác cho mục đích tiếp thị trực tiếp của riêng họ, khi được pháp luật cho phép. Nếu áp dụng, thông báo như vậy sẽ bao gồm danh sách các loại Thông tin cá nhân đã được tiết lộ (nếu có) và tên và địa chỉ của tất cả các bên thứ ba mà Thông tin cá nhân đã được tiết lộ (nếu có). Thông báo sẽ bao gồm năm dương lịch trước đó. Bạn có thể liên hệ với chúng tôi theo thông tin được cung cấp bên dưới nếu bạn muốn biết liệu quyền này có áp dụng cho bạn hay không và nếu có, hãy thực hiện quyền đó.
          </li>
        </ul>
        <p>
          Xin lưu ý rằng một số quyền này có thể không áp dụng nếu chúng tôi có lợi ích hợp pháp  hoặc nghĩa vụ pháp lý hoặc hợp đồng để tiếp tục xử lý Thông tin cá nhân hoặc khi Thông tin cá nhân có thể được miễn tiết lộ hoặc không bị xóa theo luật hiện hành. Một số quyền này chỉ có thể được thực hiện trong một số trường hợp nhất định hoặc có thể bị hạn chế theo luật bảo vệ dữ liệu tại khu vực pháp lý của bạn.
        </p>
        <h2>CHUYỂN DỮ LIỆU XUYÊN BIÊN GIỚI </h2>
        <p>
          Là một công ty toàn cầu hoạt động tại hơn 80 quốc gia, có những trường hợp chúng tôi sẽ phải chuyển Thông tin cá nhân ra khỏi quốc gia, tỉnh hoặc lãnh thổ nơi thông tin được thu thập cho các mục đích được nêu trong Thông báo về quyền riêng tư này. Cụ thể, chúng tôi có thể chuyển dữ liệu để cung cấp, quản lý và điều hành các Dịch vụ được cung cấp cho bạn và để nâng cao hiệu quả hoạt động kinh doanh của chúng tôi. Chúng tôi sẽ nỗ lực hết sức để đảm bảo rằng các hoạt động chuyển dữ liệu xuyên biên giới này tuân thủ mọi luật bảo vệ dữ liệu có liên quan và các quyền và quyền tự do của cá nhân theo các luật đó được bảo vệ phù hợp.
        </p>
        <p>
          Khi nhu cầu chuyển dữ liệu xuyên biên giới phát sinh, chúng tôi sẽ thực hiện các bước để đảm bảo có các biện pháp bảo vệ thích hợp nhằm bảo vệ Thông tin cá nhân, chẳng hạn như đánh giá tác động, quyết định về tính đầy đủ của cơ quan giám sát có thẩm quyền, việc sử dụng các quy tắc ràng buộc của công ty đã được phê duyệt hoặc các điều khoản hợp đồng tiêu chuẩn hoặc sự đồng ý của bạn.
        </p>
        <p>
          Để biết thông tin về cách thức hoạt động của Quy tắc ràng buộc doanh nghiệp EU (Liên minh châu Âu) của MMC (EU BCR ), hãy nhấp
