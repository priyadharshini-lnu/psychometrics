        <p>
          Chúng tôi cũng có thể sử dụng Thông tin cá nhân mà chúng tôi thu thập và nhận được theo cách khác được mô tả với bạn tại thời điểm thu thập.
        </p>
        <h3><strong>Liên kết ngoài </strong>&nbsp;</h3>
        <p>
          Các trang web của chúng tôi có thể bao gồm các liên kết đến các trang web do các tổ chức khác ngoài MTE điều hành. Nếu bạn truy cập trang web của một tổ chức khác bằng siêu liên kết (hyperlink) trên trang web của chúng tôi, tổ chức kia có thể thu thập thông tin từ bạn. MTE không chịu trách nhiệm về nội dung hoặc các hoạt động bảo mật của các trang web được liên kết hoặc việc họ sử dụng Thông tin cá nhân của bạn. Nếu bạn rời khỏi trang web của MTE qua một liên kết như vậy (bạn có thể biết mình đang ở đâu bằng cách kiểm tra URL trên thanh địa chỉ trên trình duyệt của mình), bạn nên tham khảo chính sách bảo mật, điều khoản sử dụng và các thông báo khác của trang web đó để xác định cách tổ chức kia sẽ xử lý bất kỳ Thông tin cá nhân nào họ thu thập từ bạn.
        </p>
        <h2>CHÚNG TÔI TIẾT LỘ THÔNG TIN CÁ NHÂN CHO AI</h2>
