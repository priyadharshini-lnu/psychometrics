          <a
            href="https://www.marshmclennan.com/privacy-statement/bcr-entities-uk.html"
            >vào đây</a
          >.&nbsp;&nbsp;&nbsp;
        </p>
        <h2>GIỮ LẠI THÔNG TIN CỦA BẠN </h2>
        <p>
          Các sản phẩm, dịch vụ và nghĩa vụ theo quy định của chúng tôi rất phức tạp và do đó thời hạn lưu giữ Thông tin cá nhân của chúng tôi khác nhau. Chúng tôi xem xét các nghĩa vụ sau đây khi thiết lập thời hạn lưu giữ Thông tin cá nhân và hồ sơ chúng tôi lưu giữ:
        </p>
        <ul>
          <li>
            nhu cầu lưu giữ thông tin để thực hiện các mục đích kinh doanh hoặc nghĩa vụ hợp đồng mà thông tin được thu thập;
          </li>
          <li>
            nhiệm vụ của chúng tôi là thực hiện các hướng dẫn của khách hàng liên quan đến Thông tin cá nhân mà chúng tôi xử lý thay mặt họ;
          </li>
          <li>
            nghĩa vụ của chúng tôi là tuân thủ các yêu cầu bắt buộc về lưu giữ hồ sơ theo pháp luật và quy định;
          </li>
          <li>
            các thủ tục sao lưu và phục hồi thảm họa của chúng tôi; và
          </li>
          <li>
            các quy định pháp lý khác có ảnh hưởng như thời hiệu .
          </li>
        </ul>
        <p>
          Dựa trên các yếu tố trên, chúng tôi có thể lưu giữ Thông tin cá nhân sau thời gian chúng tôi cung cấp dịch vụ cho bạn. Khi chúng tôi không còn cần lưu giữ Thông tin cá nhân nữa, chính sách công ty của chúng tôi yêu cầu chúng tôi phải khử nhận dạng hoặc tổng hợp thông tin (trong trường hợp đó, chúng tôi có thể tiếp tục lưu giữ và sử dụng thông tin đã khử nhận dạng hoặc tổng hợp cho mục đích phân tích) hoặc hủy thông tin một cách an toàn.
        </p>
