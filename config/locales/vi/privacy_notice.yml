                  Khi thiết lập hoặc duy trì mối quan hệ khách hàng để cung cấp một số dịch vụ nhất định, chúng tôi sử dụng Thông tin cá nhân cho mục đích thực hiện kiểm tra gian lận, chống rửa tiền hoặc cấm vận.
