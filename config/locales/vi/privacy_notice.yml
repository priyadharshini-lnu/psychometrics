        </p>
        <p>
          Xin lưu ý rằng MTE là nhà cung cấp các giải pháp đánh giá khoa học hành vi và trong một số trường hợp, chúng tôi hành động thay mặt và theo chỉ dẫn của khách hàng, tổ chức tài chính, thương nhân và các đối tác khác có vai trò là bên kiểm soát dữ liệu cá nhân, bao gồm cả việc xử lý các giao dịch thanh toán. Vui lòng tham khảo chính sách bảo mật của các đối tác đó để biết thêm thông tin về việc xử lý Thông tin cá nhân của bạn  của các đối tác đó.
