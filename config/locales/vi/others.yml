    details: Chi tiết
    edit_evaluation:
      body: Xin lưu ý rằng khi bạn nhấp vào Đánh giá lại, bạn sẽ được chuyển hướng đến phần đầu của khảo sát, nơi bạn có thể chỉnh sửa các phản hồi. Các phản hồi trước đó vẫn sẽ khả dụng nhưng bạn có thể thay đổi chúng theo ý muốn của mình. Sau khi chỉnh sửa, bạn sẽ phải gửi lại đánh giá để hoàn tất quy trình.
