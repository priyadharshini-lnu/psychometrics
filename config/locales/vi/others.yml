    insights_reports: Thông tin chi tiết &amp; Báo cáo
    instruction_modal:
      campaign_start_final_instructions: "<p>Xin lưu ý rằng không có cách nào để Dừng hoặc Tạm dừng bộ đếm thời gian. Bộ đếm thời gian chiến dịch sẽ tiếp tục chạy ngay cả khi bạn đóng trình duyệt, do đó, bạn không nên nghĩ đến việc để các tác vụ ở giữa để làm việc khác. Hãy đảm bảo giảm thiểu sự mất tập trung trong khi thực hiện các tác vụ. Tìm một môi trường yên tĩnh, tắt thông báo trên thiết bị của bạn và tránh làm nhiều việc cùng lúc. Duy trì sự tập trung và luôn chú ý. Khi bộ đếm thời gian chiến dịch hết hạn, bạn sẽ không thể tiếp tục. Nếu bạn đã đọc kỹ các hướng dẫn ở trên, vui lòng nhấp vào bắt đầu để tiếp tục các tác vụ được giao.</p>\n"
      campaign_start_instruction: "<h4>Vui lòng đọc kỹ các hướng dẫn sau đây.</h4><p> Nhiệm vụ bạn sắp bắt đầu được tính thời gian. Khi bạn nhấp vào “Bắt đầu”, bộ đếm thời gian chiến dịch sẽ tự động bắt đầu. Bạn có %{minutes} phút để hoàn thành tất cả các hoạt động. Vui lòng cố gắng hoàn thành các nhiệm vụ trong khung thời gian được chỉ định và quản lý thời gian hiệu quả để tránh vội vã trong quá trình đánh giá. Đảm bảo hoàn thành các nhiệm vụ cùng một lúc để nếu bạn cần nghỉ ngơi, thì Bây giờ là lúc.</p>\n"
      common_proctoring_instructions: "<h4>Giám sát</h4><p> Khi nhấp vào nút Bắt đầu, bạn sẽ được chuyển hướng đến hệ thống giám sát của chúng tôi. Hệ thống này sẽ giám sát camera, micrô và màn hình của bạn trong suốt phiên làm việc. Các phiên làm việc này được giám sát tự động bởi hệ thống AI tinh vi của chúng tôi, mang đến trải nghiệm người dùng mượt mà và không bị gián đoạn. Tuy nhiên, các phiên làm việc cũng có thể được giám sát bởi giám thị. Bất kỳ dấu hiệu nào của hành vi sai trái hoặc bất thường sẽ được đánh dấu. Điều này được thực hiện để đảm bảo rằng không có hành vi gian lận nào được thực hiện. Nếu phát hiện nghi ngờ, nhiệm vụ của bạn sẽ bị hủy.</p>\n"
      lockdown_browser_instruction: "<h4>Trình duyệt giám sát</h4><p> Bạn sẽ được yêu cầu tải xuống và cài đặt trình duyệt đặc biệt để hoàn thành các nhiệm vụ được giám sát. Vui lòng làm theo hướng dẫn ở màn hình tiếp theo. Bạn có thể gỡ cài đặt sau khi hoàn tất tất cả các hoạt động bắt buộc.</p>\n"
