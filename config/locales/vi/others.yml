          main: Phần này bao gồm danh sách tích lũy tất cả các lộ trình phát triển, ghi nhớ việc học thực hành tốt nhất, tức là hướng dẫn 70-20-10, cung cấp một hành trình tiến bộ kết hợp học trên lớp, huấn luyện và học tập tại chỗ. Dựa trên kết quả từ kinh nghiệm phát triển lãnh đạo và các ưu tiên kinh doanh, các lộ trình phát triển khả thi đã được đề xuất, có thể được xem xét cho sự phát triển của bạn.
        learn_cards:
          collaboration:
            list:
            - Đề nghị huấn luyện hoặc cố vấn cho người khác
            - Yêu cầu được cố vấn bởi chuyên gia trong lĩnh vực của bạn
            - Tìm một huấn luyện viên hỗ trợ phát triển của bạn
            - Thiết lập nhóm làm việc hợp tác để thảo luận các thách thức trong doanh nghiệp
            - Nhận phản hồi chính thức và không chính thức từ người khác
            - Tham gia tích cực vào các hiệp hội và mạng lưới ngành
            - Xây dựng mạng lưới bên ngoài của riêng bạn
            title: Học tập hợp tác (20%) <br/> Phát triển thông qua người khác
          job:
            list:
            - Đảm nhận vị trí lãnh đạo trong các ủy ban quản lý hoặc các bên liên quan
            - Tình nguyện dẫn dắt các dự án quản lý thay đổi cho tổ chức
