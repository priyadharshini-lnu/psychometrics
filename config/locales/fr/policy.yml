      Afin d'assurer votre participation significative à cette activité, certaines de vos informations personnelles seront collectées et traitées.
      L'activité est administrée par Mercer Talent Enterprise au nom et selon les instructions de notre client, qui détermine le but du traitement de vos informations personnelles et la manière dont nous pouvons les utiliser. Veuillez noter que vos informations peuvent être transférées au-delà des frontières nationales dans le cadre des services fournis à nos clients.
      Dans ce cas, nous agissons en tant qu'importateur de données et notre client en tant qu'exportateur de données.
      Tout transfert international d'informations personnelles sera effectué conformément aux lois applicables en matière de protection des données.

