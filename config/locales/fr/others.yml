    insights_reports: Perspectives et rapports
    instruction_modal:
      campaign_start_final_instructions: "<p>sachez qu'il n'y a aucun moyen d'arrêter ou de mettre en pause le minuteur. Le minuteur de la campagne continuera à fonctionner même si vous fermez le navigateur, vous ne devez donc à aucun moment penser à quitter les tâches entre deux pour faire autre chose. Veillez à minimiser les distractions pendant les tâches. Trouvez un environnement calme, désactivez les notifications sur vos appareils et évitez le multitâche. Restez concentré et concentrez-vous. Une fois le minuteur de la campagne écoulé, vous ne pourrez plus continuer. Si vous avez lu les instructions ci-dessus, veuillez cliquer sur démarrer pour continuer les tâches assignées</p>\n"
      campaign_start_instruction: |-
        <h4>Veuillez lire attentivement les instructions suivantes.</h4>
        <p>les tâches que vous allez commencer sont chronométrées. Lorsque vous cliquez sur "Commencer", le chronomètre de la campagne démarre automatiquement. Vous disposez de %{minutes} minutes pour effectuer toutes les activités. Veillez à effectuer les tâches dans le délai imparti et à gérer votre temps de manière efficace afin d'éviter toute précipitation dans le processus d'évaluation. Veillez à effectuer les tâches en une seule fois, de sorte que si vous avez besoin de faire une pause, c'est le moment</p>
      common_proctoring_instructions: |-
        <h4>Surveillance</h4>
        <p>en cliquant sur le bouton "Démarrer", vous serez redirigé vers notre système de surveillance, qui surveillera votre caméra, votre microphone et votre écran pendant votre session. Ces sessions sont automatiquement surveillées par notre système d'intelligence artificielle sophistiqué, ce qui garantit une expérience utilisateur ininterrompue et fluide. Cependant, les sessions peuvent également être examinées par des surveillants humains. Tout signe de mauvaise conduite ou d'irrégularité sera signalé, afin de s'assurer qu'aucune tentative de tricherie n'est effectuée. En cas de soupçon, votre ou vos tâches seront annulées</p>
      lockdown_browser_instruction: |-
        <h4>Navigateur de contrôle</h4>
        <p>il vous sera demandé de télécharger et d'installer un navigateur spécial pour effectuer les tâches surveillées. Veuillez suivre les instructions de l'écran suivant. Vous pourrez le désinstaller après avoir effectué toutes les activités requises</p>
