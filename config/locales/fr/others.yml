          c1:
            content: Incluez les compétences, connaissances et capacités qui doivent être développées. Assurez-vous qu'elles sont spécifiques, mesurables, réalisables, réalistes et raisonnablement réalisables dans les délais mentionnés.
            title: Objectifs de développement
          c2:
            content: Ceci est basé sur la compétence à développer en fonction de l'expérience d'évaluation.
            title: Compétence
          c3:
            content: Cette section comprend vos actions de développement basées sur le modèle d'apprentissage 70-20-10 listé ci-dessous. Il est conseillé de sélectionner une combinaison de chacun des trois éléments pour assurer une approche variée d'apprentissage et de développement.
            title: Activité
          c4:
            content: Assurez-vous que vos délais sont réalistes en fonction du moment où l'objectif peut être atteint. Modifiez-les au besoin et lorsque cela est approprié.
            title: Calendrier
          c5:
            content: Utilisez la section progression pour soutenir l'avancement sur les pistes identifiées.
            title: Progression
        chart:
          collaboration: "<strong>20%</strong>Apprentissage <br /> collaboratif"
          job: "<strong>70%</strong>Apprentissage <br />sur le terrain"
          learn: "<strong>10%</strong>Apprentissage formel"
        content:
          list:
            r1: Veuillez noter que cette liste est fournie à titre indicatif uniquement et que d'autres parcours de développement peuvent être envisagés pour vous en fonction de vos aspirations personnelles, des recommandations de votre responsable et des priorités commerciales de l'organisation.
            r2: Les utilisateurs sont encouragés à examiner de manière critique tout le contenu et sont libres de modifier, d'affiner, de remplacer ou d'ajouter toute action ou recommandation avec laquelle ils ne sont pas d'accord.
            r3: 'Les données relatives au développement figurant dans le présent rapport peuvent provenir de l''une ou des deux sources suivantes :'
            r3a: Une bibliothèque de développement personnalisée créée pour votre organisation
            r3b: Suggestions de développement générées par l'IA
            r4: Ce rapport IDP a été généré à l'aide d'une technologie d'intelligence artificielle et peut contenir des inexactitudes. Les analyses et recommandations fournies doivent être interprétées avec discernement et utilisées uniquement comme un outil au service de votre développement personnel et professionnel. Le rapport est valable pour une période de 12 à 18 mois.
          main: Le PDI créé comprend une liste détaillée des mesures de développement que vous pouvez prendre, en gardant à l'esprit les meilleures pratiques d'apprentissage, à savoir la règle des 70-20-10, qui prévoit un parcours progressif combinant apprentissage en classe, coaching et apprentissage sur le terrain. Sur la base des résultats du processus d'évaluation, de vos réponses au chat et des rapports externes, le cas échéant, des parcours de développement possibles ont été recommandés, qui peuvent être pris en considération pour votre développement.
        learn_cards:
          collaboration:
            list:
            - Proposer de coacher ou de mentorer d'autres personnes
            - Demander à être mentoré par un expert dans votre domaine
            - Obtenir un coach pour soutenir votre développement
            - Mettre en place un groupe de travail collaboratif pour discuter des défis en cours dans l'entreprise
            - Obtenir des retours formels et informels des autres
            - Jouer un rôle actif dans les associations et réseaux professionnels
            - Construire vos propres réseaux externes
            title: Apprentissage collaboratif (20%) <br/> Se développer grâce aux autres
          job:
            list:
            - Assumer des positions de leadership dans des comités de parties prenantes ou de direction
            - Se porter volontaire pour diriger des projets de gestion du changement pour l'organisation
            - Envisager de prendre des missions stimulantes
            - Travailler en collaboration avec d'autres fonctions
            - Envisager de diriger des projets en dehors de votre organisation
            - Travailler en étroite collaboration avec des experts externes de l'industrie sur des projets conjoints
            title: Apprentissage sur le terrain (70%) <br/> Se développer par l'expérience
          learn:
            list:
            - Suivre des programmes de formation structurés
            - Suivre des cours en ligne
            - Lire des livres, des articles, des publications
            - Obtenir des qualifications professionnelles, des certifications et des accréditations
            - Assister à des cours, ateliers, séminaires
            title: Apprentissage formel (10%) <br/> Se développer par un apprentissage structuré
        title: Guide pour votre permis de conduire international
