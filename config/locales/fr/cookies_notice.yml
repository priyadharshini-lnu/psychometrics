fr:
  cookies_notice: |-
    <h2>Politique relative aux cookies</h2>

    <p><strong>Date d’effet :</strong> 14 décembre 2023</p>

    <p>
    Nous utilisons des cookies et des technologies de traçages associées, y compris des balises Web, pixels de surveillance et fichiers journaux (collectivement appelés « cookies ») sur ce site Internet pour vous distinguer des autres utilisateurs, évaluer et améliorer les fonctionnalités du site Internet et de nos services, et vous fournir une bonne expérience.
    </p>

    <p><strong>QU’EST-CE QU’UN COOKIE</strong></p>

    <p>
    Les cookies sont des éléments d’information partagés entre votre navigateur et un site Internet. Certains cookies sont nécessaires pour faire fonctionner le site Internet. Certains nous aident à en évaluer les performances et à les améliorer. Nous utilisons également des cookies pour vous fournir du contenu, des produits et des services adaptés. Un cookie ne peut pas lire les données du disque dur de votre ordinateur.
    </p>

    <p>Il existe différents types de cookies avec des fonctions différentes :</p>

    <p>
    (i) <strong>Cookies de session :</strong> ces cookies ne sont stockés sur votre ordinateur que pendant votre session Web. Ils sont automatiquement supprimés lorsque vous refermez votre navigateur. Ils stockent généralement un identifiant de session anonyme qui vous permet de naviguer sur un site Internet sans avoir à vous reconnecter à chaque page. Ils ne recueillent aucune information sur votre ordinateur.
    </p>

    <p>
    (ii) <strong>Cookies persistants :</strong> ces cookies sont stockés sous forme de fichier sur votre ordinateur et y restent lorsque vous fermez votre navigateur Internet. Ils peuvent être lus par le site Internet qui les a créés lorsque vous visitez à nouveau le site Internet.
    </p>

    <p>
    (iii) <strong>Cookies propriétaires :</strong> ces cookies sont créés par notre société. Ils sont stockés et envoyés entre nos serveurs et le disque dur de votre ordinateur. Ces cookies peuvent être soit des cookies de session, soit des cookies persistants.
    </p>

    <p>
    (iv) <strong>Cookies tiers :</strong> ces cookies sont créés par l’un de nos partenaires tiers. Ils sont stockés et envoyés entre les serveurs du tiers et le disque dur de votre ordinateur. Ces cookies sont généralement des cookies persistants.
    </p>

    <p><strong>COMMENT ET POURQUOI NOUS UTILISONS LES COOKIES</strong></p>

    <p>En fonction du site Internet, nous pouvons utiliser des cookies aux fins suivantes :</p>

    <p><strong>Lorsqu’ils sont strictement nécessaires</strong></p>

    <p>
    Ces cookies sont essentiels pour vous permettre de naviguer sur le site Internet et d’en utiliser les fonctionnalités, par exemple pour accéder aux zones sécurisées du site Internet. Sans ces cookies, les services que vous nous avez demandés, comme un devis ou la connexion à votre compte, ne peuvent pas vous être fournis. Ces cookies ne recueillent pas d’informations vous concernant pouvant être utilisées aux fins de marketing ou pour enregistrer les pages que vous avez consultées sur Internet.
    </p>

    <p><strong>Fonctionnalité</strong></p>

    <p>
    Ces cookies permettent à notre site Internet de mémoriser les choix que vous faites (comme votre nom d’utilisateur, votre langue ou la région dans laquelle vous vous trouvez) et permettent des fonctionnalités améliorées. Par exemple, un site Internet peut mémoriser les détails de votre connexion afin que vous n’ayez pas à vous connecter à votre compte à chaque fois que vous utilisez un appareil particulier pour accéder à notre site Internet.
    </p>

    <p>
    Ces cookies peuvent également être utilisés pour mémoriser les modifications que vous apportez à la taille du texte, à la police ou autres éléments des pages Internet que vous pouvez personnaliser. Ils peuvent également être utilisés pour fournir les services que vous demandez, comme regarder une vidéo ou faire un commentaire sur un article. Les informations recueillies par ces cookies sont généralement dépersonnalisées.
    </p>

    <p><strong>Analyse</strong></p>

    <p>
    Ces cookies recueillent des informations sur la manière dont les internautes utilisent un site Internet, par exemple les pages que les utilisateurs consultent le plus souvent, et s’ils reçoivent des messages d’erreur provenant de pages Internet. Ils nous permettent également d’enregistrer et de comptabiliser le nombre de visiteurs du site Internet afin de voir comment les internautes utilisent le site Internet et d’améliorer le fonctionnement de notre site Internet.
    </p>

    <p><strong>Publicité</strong></p>

    <p>
    Ces cookies sont utilisés pour vous montrer des publicités personnalisées et pour gérer la performance des publicités. Les cookies publicitaires sont généralement des cookies de tiers et peuvent être présents même si le site Internet n’affiche aucune publicité.
    </p>

    <p><strong>Adresses IP</strong></p>

    <p>
    Lorsque vous consultez notre site Internet, nous pourrons recueillir vos adresses de protocole Internet (« IP ») pour suivre et regrouper des informations non personnelles. Par exemple, nous pouvons utiliser des adresses IP pour surveiller les régions à partir desquelles les utilisateurs naviguent sur le site Internet.
    </p>

    <p><strong>COMMENT GÉRER LES COOKIES</strong></p>

    <p>
    Cliquez sur le lien « Gérer les cookies » en bas de la page pour activer ou désactiver certains cookies à l’aide de notre Gestionnaire de consentement aux cookies. Notez qu’il n’est pas possible de désactiver les cookies strictement nécessaires.
    </p>

    <p>
    Vous pouvez également désactiver certains cookies via les paramètres du navigateur. Consultez la section « Aide » de votre navigateur pour savoir comment gérer vos paramètres de cookies.
    </p>

    <p><strong>LA POLITIQUE RELATIVE AUX COOKIES NE COUVRE PAS LES SITES INTERNET DE TIERS</strong></p>

    <p>
    Lorsque nous ajoutons des liens vers d’autres sites Internet, n’oubliez pas qu’ils ont leur propre politique de confidentialité et de cookies qui régit l’utilisation de toute information que vous envoyez. Nous vous conseillons de lire leurs politiques car nous ne sommes pas responsables de leurs pratiques en matière de protection de la vie privée.
    </p>

    <p><strong>MODIFICATIONS DE LA POLITIQUE RELATIVE AUX COOKIES</strong></p>

    <p>
    Nous pouvons occasionnellement mettre à jour la présente Politique. Nous vous encourageons à la revoir régulièrement pour rester informé de la manière dont nous utilisons les cookies. Nous affichons la date d’effet de la politique en haut de la page.
    </p>

    <p><strong>DESCRIPTION DES COOKIES UTILISÉS</strong></p>

    <p>
    Veuillez cliquer sur le lien « Gérer les cookies » dans le pied de page du site Internet pour trouver des détails sur les cookies individuels utilisés sur le site Internet.
    </p>

    <p><strong>NOUS CONTACTER</strong></p>

    <p>
    Si vous avez des questions concernant la présente politique relative aux cookies, veuillez nous contacter comme indiqué dans notre politique de confidentialité dont le lien est ci-dessous.
    </p>
