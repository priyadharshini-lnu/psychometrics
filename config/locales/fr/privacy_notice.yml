      <h2>CONSERVATION DE VOS INFORMATIONS</h2>
      <p>
        Nos produits, services et obligations réglementaires sont complexes ; par conséquent, nos périodes de conservation des Informations personnelles varient. Nous tenons compte des obligations suivantes lors que nous définissons des périodes de conservation des Informations personnelles et des dossiers que nous conservons:
      </p>
      <ul>
        <li>
          la nécessité de conserver les informations pour atteindre les objectifs commerciaux ou les obligations contractuelles pour lesquels elles ont été recueillies;
        </li>
        <li>
          nos obligations d’exécuter les instructions de nos clients concernant les Informations personnelles que nous traitons en leur nom;
        </li>
        <li>
          nos obligations de nous conformer aux exigences légales et réglementaires en matière de tenue de registres;
        </li>
        <li>nos procédures de sauvegarde et de reprise après sinistre ; et</li>
        <li>
          d’autres impacts juridiques tels que les délais de prescription applicables.
        </li>
      </ul>
      <p>
        En fonction des facteurs ci-dessus, nous pouvons conserver des Informations personnelles au-delà de la période pour laquelle nous vous fournissons des services. Lorsque nous n’avons plus besoin de conserver des Informations personnelles, les politiques de notre société exigent que nous les désidentifiions ou les agrégions (auquel cas nous pouvons conserver et utiliser les informations désidentifiées ou agrégées à des fins d’analyse) ou que nous les détruisions en toute sécurité.
      </p>
