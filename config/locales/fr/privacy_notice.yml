      <h2>MESURES QUE NOUS PRENONS POUR PROTÉGER LES INFORMATIONS PERSONNELLES</h2>
      <p>
        Notre société s’efforce de se conformer à toutes les lois applicables en matière de cybersécurité et de protection des données. Dans cet esprit, MMC dispose d’un responsable de la sécurité des systèmes d’information (RSSI) et d’un responsable mondial de la protection de la vie privée (RMPVP) dédiés. Le RSSI est chargé de gérer une équipe mondiale de sécurité de l’information et un programme complet de cybersécurité. Dans le cadre de notre programme de cybersécurité, nous avons mis en place des mesures de protection physiques, administratives et techniques raisonnables sur le plan commercial, afin de protéger les Informations personnelles contre tout accès, utilisation, modification et suppression non autorisés.
      </p>
      <p>
        Le RMPVP dirige et supervise un centre d’excellence en matière de protection de la vie privée et un réseau de délégués à la protection des données chargés de mettre en œuvre notre programme mondial complet en matière de protection de la vie privée. Le réseau des délégués à la protection des données relie nos délégués à la protection des données à travers le monde et cherche à mettre en œuvre notre programme de confidentialité de manière cohérente et complète partout où nous traitons des données. Vous pouvez obtenir le nom et les coordonnées du délégué à la protection des données dans votre juridiction en nous contactant à l’adresse privacy@mmc.com.
      </p>
      <h2>VOS DROITS EN MATIÈRE DE PROTECTION DES DONNÉES</h2>
