      <p>
        Selon votre pays, vous pouvez également disposer de certains ou de tous les droits suivants:
      </p>
      <ul>
        <li>
          <strong>Droit d’accepter ou de refuser la vente ou le partage à des fins de publicité inter-contexte
            <br /></strong
          >Si vous visitez l’un de nos sites Web, nous pouvons divulguer des informations relatives à votre activité sur Internet ou sur d’autres réseaux électroniques, vos identifiants biographiques, vos données de géolocalisation et vos informations professionnelles (dans la mesure où elles peuvent être déduites de votre activité sur notre site Web) à des fournisseurs d’analyses de sites Web et de publicité à des fins de publicité comportementale ou ciblée inter-contexte utilisant des cookies publicitaires. En vertu de certaines lois, vous pouvez disposer du droit d’accepter ou de refuser ces types de divulgations. Pour effectuer votre ou vos choix ou pour voir les noms des tiers à qui nous avons vendu ou partagé vos informations, veuillez cliquer sur le lien « Gérer les cookies » au bas de notre page Web. Si vous souhaitez refuser que vos informations soient vendues ou partagées, assurez-vous que les boutons des traceurs « Publicité » et « Analytique » sont réglés sur « Non » ou, le cas échéant, activez le bouton « Ne pas vendre ni partager mes informations personnelles ».
          <p>
            Vous pouvez également mettre en œuvre un paramètre ou une extension de navigateur afin de communiquer automatiquement vos préférences en matière de vente et de partage aux sites Web que vous visitez. Nos sites Web traitent ces « signaux de préférence de refus » facilement en reconnaissant le Global Privacy Control/Contrôle mondial de la confidentialité (GPC). Si vous souhaitez utiliser le GPC, vous pouvez le télécharger et l’activer via un navigateur participant ou une extension de navigateur. Pour obtenir de plus amples informations concernant le téléchargement du GPC, veuillez cliquer <a href="https://globalprivacycontrol.org/">ici</a>.&nbsp;
