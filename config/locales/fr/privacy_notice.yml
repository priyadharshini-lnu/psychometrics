      </p>
      <h2>TRANSFERTS TRANSFRONTALIERS</h2>
      <p>
        En tant qu’entreprise mondiale opérant dans plus de 80 pays, dans certaines circonstances, nous devons transférer des Informations personnelles en dehors du pays, de la province ou du territoire dans lequel elles ont été recueillies aux fins décrites dans le présent Avis de confidentialité. Plus précisément, nous pouvons transférer des données pour offrir, administrer et gérer les services qui vous sont fournis, et pour améliorer l’efficacité de nos opérations commerciales. Nous mettrons tout en œuvre pour que ces transferts soient conformes à toutes les lois applicables en matière de protection des données et que les droits et libertés des personnes en vertu de ces lois soient protégés de manière appropriée.
      </p>
      <p>
        Si nous devons effectuer un tel transfert, nous prendrons des mesures afin de nous assurer que des garanties appropriées sont en place pour protéger les Informations personnelles, telles qu’une évaluation d’impact, une décision d’adéquation de l’autorité de surveillance appropriée, l’utilisation de règles d’entreprise contraignantes approuvées ou de clauses contractuelles standard, ou votre consentement.
      </p>
