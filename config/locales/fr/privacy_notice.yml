      <ul>
        <li>
          <strong>Droit de rectification  <br /></strong>
          Vous pouvez nous demander de corriger toute inexactitude dans les Informations personnelles que nous détenons. Si nous divulguons vos Informations personnelles à des tiers, nous leur communiquerons la correction dans la mesure du possible.
