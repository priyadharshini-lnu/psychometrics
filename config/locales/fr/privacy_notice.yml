        </li>
      </ul>
      <ul>
        <li>
          <strong>Droit de retirer son consentement<br /></strong>
          Si la base légale du traitement de vos Informations personnelles que nous effectuons est votre consentement, vous avez le droit de retirer ce consentement.
        </li>
      </ul>
      <ul>
        <li>
          <strong>Droit de déposer une plainte<br /></strong>
          Vous pouvez disposer du droit de déposer une plainte auprès de l’autorité de surveillance ou de réglementation compétente dans votre juridiction si vous avez des inquiétudes concernant tout aspect de nos pratiques en matière de confidentialité.
        </li>
      </ul>
