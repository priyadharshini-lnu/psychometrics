      <h1><strong>AVIS DE CONFIDENTIALITÉ</strong>&nbsp;</h1>
      <p>Date d’entrée en vigueur : 15 septembre 2024</p>
      <p>
        Le présent Avis de confidentialité décrit la manière dont Mercer Talent Enterprise («<strong>MTE</strong>») recueille, utilise, partage, conserve, transfère et traite les informations relatives aux personnes identifiées ou identifiables (Informations personnelles), et les droits dont vous pouvez disposer concernant vos Informations personnelles. Nous pensons qu’il est important que vous compreniez comment nous traitons les Informations personnelles et nous vous encourageons à prendre le temps de vous familiariser avec nos pratiques en matière de confidentialité décrites ci-dessous.
      </p>
      <p>
        Veuillez noter que MTE est un fournisseur de solutions d’évaluation des sciences du comportement et que, dans certains cas, nous agissons au nom et selon les instructions de clients, d’institutions financières, de commerçants et d’autres partenaires agissant en tant que contrôleurs de données, y compris pour le traitement des transactions de paiement. Veuillez vous reporter aux politiques de confidentialité de ces partenaires pour obtenir de plus amples informations concernant le traitement de vos Informations personnelles dans ces contextes.
      </p>
      <h2>QUELLE EST NOTRE RELATION AVEC VOUS?</h2>
      <p>
        Un tiers vous demande d’effectuer une évaluation sur la plateforme de MTE. Ce tiers est le client de MTE et peut être votre employeur, un employeur potentiel ou une autre partie liée. MTE recueille et traite vos Informations personnelles au nom de nos clients. Nous suivons les instructions fournies par nos clients concernant les Informations personnelles que nous devons recueillir et la manière de traiter ces Informations personnelles. Par conséquent, MTE agit en tant que sous-traitant pour nos clients qui déterminent le traitement de vos Informations personnelles.
      </p>
      <p>
        Si vous avez des questions concernant le traitement de vos Informations personnelles, nous vous encourageons à consulter l’avis de confidentialité de notre client.
      </p>
