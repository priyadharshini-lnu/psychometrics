        <h2>CONSERVATION DE VOS INFORMATIONS  </h2>
        <p>
          Nos produits, nos services et nos obligations réglementaires sont complexes et, par conséquent, nos périodes de conservation des renseignements personnels varient.  Nous tenons compte des obligations suivantes lorsque nous établissons les périodes de conservation des renseignements personnels et des dossiers que nous tenons :
        </p>
        <ul>
          <li>
            la nécessité de conserver les informations pour atteindre les objectifs commerciaux ou remplir les obligations contractuelles pour lesquelles elles ont été collectées;
          </li>
          <li>
            nos obligations d’exécuter les instructions de nos clients à l’égard des renseignements personnels que nous traitons en leur nom;
          </li>
          <li>
            nos obligations de respecter les exigences légales et réglementaires obligatoires en matière de tenue de dossiers;
          </li>
          <li>
            nos procédures de sauvegarde et de reprise après sinistre
          </li>
          <li>
            d’autres incidences juridiques, comme les délais de prescription applicables.
          </li>
        </ul>
        <p>
          Selon les facteurs ci-dessus, nous pouvons conserver les renseignements personnels au-delà de la période pour laquelle nous vous fournissons des services. Lorsque nous n’avons plus besoin de conserver des renseignements personnels, nos politiques d’entreprise exigent que nous les dépersonnalisions ou les regroupions (auquel cas nous pouvons les conserver et les utiliser à des fins d’analyse) ou que nous les détruisions de façon sécuritaire.
        </p>
