        <h1><strong>MERCER TALENT ENTERPRISE AVIS SUR LA PROTECTION DES RENSEIGNEMENTS PERSONNELS</strong></h1>
        <p>Date d’entrée en vigueur: 15 septembre 2024</p>
        <p>
          Cet avis de confidentialité décrit la manière dont Mercer Talent Enterprise (« <strong>MTE</strong> ») recueille, utilise, partage, conserve, transfère et traite les informations relatives aux personnes identifiées ou identifiables (informations personnelles), ainsi que les droits que vous pouvez avoir concernant vos informations personnelles. Nous croyons qu’il est important que vous compreniez comment nous traitons les renseignements personnels et nous vous encourageons à prendre un moment pour vous familiariser avec nos pratiques en matière de protection des renseignements personnels décrites ci-dessous.
        </p>
        <p>
          Veuillez noter que MTE est un fournisseur de solutions d’évaluation des sciences du comportement et que, dans certains cas, nous agissons au nom et selon les instructions de clients, d’institutions financières, de commerçants et d’autres partenaires qui agissent en tant que contrôleurs de données, y compris pour le traitement des transactions de paiement. Veuillez consulter les politiques de confidentialité de ces partenaires pour obtenir de plus amples renseignements sur le traitement de vos renseignements personnels dans ces contextes.
        </p>
        <h2>QUELLE EST NOTRE RELATION AVEC VOUS</h2>
        <p>
          Un tiers vous demande d’effectuer une évaluation sur la plateforme de MTE. Ce tiers est le client de MTE et peut être votre employeur, un employeur potentiel ou une autre partie liée. MTE recueille et traite vos informations personnelles pour le compte de ses clients. Nous suivons les instructions fournies par nos clients concernant les renseignements personnels à recueillir et la façon de les traiter. MTE agit donc en tant que sous-traitant pour nos clients qui déterminent le traitement de vos informations personnelles.
        </p>
        <p>
          Si vous avez des questions sur le traitement de vos renseignements personnels, nous vous invitons à consulter l’avis de confidentialité de notre client.
        </p>
