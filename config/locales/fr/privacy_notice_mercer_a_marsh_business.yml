              >veuillez remplir ce formulaire</a
            >
          </li>
          <li>
            Pour les personnes résidant dans d’autres pays,
            <a
              href="https://privacyportal.onetrust.com/webform/ee9df2bb-0ef3-4485-bc63-4db420e77359/225910f5-5666-468a-b1e7-39c70e24f4cc"
              >veuillez remplir ce formulaire </a
            >
          </li>
          <li>
            Vous pouvez également nous envoyer un courriel à
            <a href="mailto:privacy@mmc.com">privacy@mmc.com</a>
          </li>
        </ul>
        <p>
          Selon votre pays, vous pouvez également avoir certains ou la totalité des droits suivants:
        </p>
        <ul>
          <li>
            <strong>Droit de participer ou non à la vente ou au partage pour la publicité transversale
              <br /></strong>
            Si vous visitez l’un de nos sites web, nous pouvons divulguer vos informations d’activité sur Internet ou d’autres réseaux électroniques, vos identifiants biographiques, vos données de géolocalisation et vos informations professionnelles (dans la mesure où elles peuvent être dérivées de votre activité sur notre site web) à des fournisseurs de services d’analyse de sites web et de publicité à des fins de publicité comportementale ou ciblée inter-contextuelle, en utilisant des cookies publicitaires.  En vertu de certaines lois, vous pourriez avoir le droit de participer ou non à ces types de divulgation.  Pour faire votre choix ou pour voir les noms de tiers particuliers avec lesquels nous avons vendu ou partagé vos renseignements, veuillez cliquer sur le lien « Manage Cookies » (Gérer les témoins) au bas de notre page Web. Si vous souhaitez refuser la vente ou le partage de vos renseignements personnels, assurez-vous que les boutons de suivi « Publicité » et « Analyses » sont réglés à « Non » ou, s’ils sont disponibles, activez le bouton Ne pas vendre ou partager mes renseignements personnels.
            <p>
              Vous pouvez également mettre en œuvre un paramètre ou une extension de navigateur pour communiquer automatiquement vos préférences de vente et de partage aux sites Web que vous visitez.  Nos sites Web traitent ces « signaux de refus de préférence » de manière harmonieuse en reconnaissant le contrôle mondial de la confidentialité (GPC). Si vous souhaitez utiliser GPC, vous pouvez le télécharger et l’activer via un navigateur participant ou une extension de navigateur. De plus amples informations sur le téléchargement de GPC sont disponiblesà l’adresse suivante: <a href="https://globalprivacycontrol.org/">ici</a>.&nbsp;
            </p>
          </li>
        </ul>
        <ul>
          <li>
            <strong>Droits relatifs à la prise de décision automatisée et au profilage
              <br /></strong
            >Dans la mesure où nous procédons au traitement automatisé de vos renseignements personnels, nous vous fournirons à l’avance tous les avis, y compris ceux concernant vos droits, qui sont exigés par la loi.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Marketing direct et ne pas suivre les signaux<br /></strong>
            Vous pourriez avoir le droit de demander et d’obtenir un avis une fois par année au sujet des renseignements personnels que nous avons communiqués à d’autres entreprises à des fins de marketing direct, lorsque la loi le permet.  S’il y a lieu, cet avis comprendra une liste des catégories de renseignements personnels qui ont été communiqués (le cas échéant) ainsi que les noms et adresses de tous les tiers à qui les renseignements personnels ont été communiqués (le cas échéant).  L’avis couvrira l’année civile précédente.  Vous pouvez communiquer avec nous de la façon indiquée ci-dessous si vous souhaitez savoir si ce droit s’applique à vous et, le cas échéant, l’exercer.
          </li>
        </ul>
        <p>
          Veuillez noter que certains de ces droits peuvent être limités lorsque nous avons un intérêt légitime prépondérant ou une obligation légale, réglementaire ou contractuelle de continuer à traiter les renseignements personnels, ou lorsque les renseignements personnels peuvent être exemptés de divulgation ou d’effacement en vertu des lois applicables.  Certains de ces droits ne peuvent être exercés que dans certaines circonstances ou peuvent par ailleurs être limités par la législation sur la protection des données de votre territoire.
        </p>
        <h2>TRANSFERTS TRANSFRONTALIERS</h2>
        <p>
          En tant qu’entreprise mondiale exerçant ses activités dans plus de 80 pays, nous devrons dans certaines circonstances transférer des renseignements personnels à l’extérieur du pays, de la province ou du territoire où ils ont été recueillis aux fins décrites dans le présent avis de confidentialité.Plus précisément, nous pouvons transférer des données pour offrir, administrer et gérer les Services qui vous sont fournis et pour améliorer l’efficacité de nos activités commerciales. Nous ferons tout en notre pouvoir pour veiller à ce que ces transferts respectent toutes les lois pertinentes en matière de protection des données et à ce que les droits et libertés des personnes en vertu de ces lois soient adéquatement protégés.
        </p>
        <p>
          Si un tel transfert s’avère nécessaire, nous prendrons des mesures pour nous assurer que des mesures de protection appropriées sont en place pour protéger les renseignements personnels, comme une évaluation d’impact, une décision d’adéquation par l’autorité de supervision appropriée, l’utilisation de règles d’entreprise contraignantes approuvées ou de clauses contractuelles standard, ou votre consentement.
        </p>
