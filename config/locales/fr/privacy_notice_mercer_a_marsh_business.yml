        <h2>MESURES PRISES POUR PROTÉGER LES INFORMATIONS PERSONNELLES</h2>
        <p>
          Notre société s’efforce de respecter toutes les lois applicables en matière de cybersécurité et de protection des données. Dans cette optique, la MMC dispose d’un responsable de la sécurité des informations (CISO) et d’un responsable mondial de la protection de la vie privée (GCPO). Le RSSI est responsable de la gestion d’une équipe mondiale de sécurité de l’information et d’un programme complet de cybersécurité.  Dans le cadre de notre programme de cybersécurité, nous avons mis en place des mesures de sécurité physiques, administratives et techniques raisonnables sur le plan commercial pour protéger les renseignements personnels contre l’accès, l’utilisation, la modification et la suppression non autorisés.
        </p>
        <p>
          Le GCPO dirige et supervise un centre d’excellence en matière de protection de la vie privée et un réseau de responsables de la protection des données chargés de mettre en œuvre notre programme global de protection de la vie privée. Le Réseau des délégués à la protection des données relie nos délégués à la protection des données partout dans le monde et cherche à mettre en œuvre notre programme de protection de la vie privée de façon uniforme et exhaustive partout où nous traitons des données. Vous pouvez obtenir le nom et les coordonnées du délégué à la protection des données de votre juridiction en nous contactant à l’adresse privacy@mmc.com.
        </p>
        <h2>VOS DROITS EN MATIÈRE DE PROTECTION DES DONNÉES  </h2>
        <p>
          Dans de nombreux cas, nous traitons des renseignements personnels pour fournir nos services à des entreprises clientes, et vous devriez communiquer avec elles pour exercer les droits que vous pourriez avoir en vertu des lois sur la protection des renseignements personnels applicables. Toutefois, lorsque nous agissons à titre de contrôleur ou d’entreprise qui est principalement responsable de décider de la façon dont vos renseignements sont traités, vous pouvez avoir certains ou la totalité des droits énumérés ci-dessous, selon le territoire et la raison pour laquelle nous traitons vos renseignements. Veuillez noter que nous pourrions devoir utiliser vos renseignements personnels pour vérifier votre identité avant de répondre à l’un des droits ci-dessous.
        </p>
        <ul>
          <li>
            <strong>Droit d’accès (droit de savoir)<br /></strong>
            Vous pouvez nous demander de vous fournir de plus amples renseignements sur la façon dont nous utilisons vos renseignements personnels, les sources, les catégories ou les éléments précis de renseignements personnels que nous avons recueillis, les catégories de tiers à qui nous avons communiqué les renseignements et de demander une copie des renseignements personnels que nous détenons à votre sujet.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Droit de correction <br /></strong>
            Vous pouvez nous demander de mettre à jour toute inexactitude dans les informations personnelles que nous détenons. Si nous communiquons vos renseignements personnels à d’autres personnes, nous les informerons de la correction dans la mesure du possible.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Droit de suppression <br /></strong>
            Vous pouvez nous demander d’effacer vos renseignements personnels lorsque nous n’avons plus de motifs légitimes de les traiter.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Droit de s’opposer à la transformation ou de la restreindre <br /></strong>
            Vous pouvez avoir le droit de restreindre le traitement de vos renseignements personnels dans certaines circonstances, par exemple lorsque vous contestez leur exactitude.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Droit à la portabilité des données<br /></strong>
            Vous pourriez avoir le droit, lorsque c’est techniquement possible, de demander que nous transférions à un tiers de votre choix une copie des renseignements personnels que nous avons obtenus de vous, dans un format structuré, couramment utilisé et lisible par machine.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Droit de retirer son consentement <br /></strong>
            Si nous nous fondons sur votre consentement pour traiter vos renseignements personnels, vous avez le droit de le retirer.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Droit de porter plainte<br /></strong>
            Vous pourriez avoir le droit de déposer une plainte auprès de l’autorité de surveillance ou de réglementation compétente de votre territoire si vous avez des préoccupations concernant un aspect de nos pratiques en matière de protection des renseignements personnels.
          </li>
        </ul>
        <p>
          Si vous souhaitez exercer l’un des droits susmentionnés ou demander la révision d’une décision ou d’un refus, veuillez communiquer avec nous en utilisant les coordonnées applicables :
        </p>
