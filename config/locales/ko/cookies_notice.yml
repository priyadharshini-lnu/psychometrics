ko:
  cookies_notice: |-
    <h2>
      쿠키 정책
    </h2>

    <p>발효일: 2023년 12월 14일</p>
    <p>당사는 웹 비콘, 추적 픽셀 및 로그 파일(통칭하여 “쿠키”)을 포함한 쿠키 및 관련 추적 기술을 사용하여 귀하를 다른 사용자와 구별하고 웹사이트 및 당사 서비스의 기능을 평가 및 개선하며 귀하에게 좋은 경험을 제공합니다.</p>

    <p><strong>쿠키란 무엇입니까?</strong></p>
    <p>쿠키는 웹 브라우저와 웹사이트 간에 공유되는 정보의 조각입니다. 일부 쿠키는 웹사이트의 작동을 위해 필요합니다. 일부 쿠키는 웹사이트의 성과 평가와 개선을 돕습니다. 당사는 또한 쿠키를 사용하여 관련 콘텐츠, 제품 및 서비스를 제공합니다. 쿠키는 컴퓨터의 하드 드라이브에서 데이터를 읽을 수 없습니다.</p>

    <p><strong>쿠키의 종류와 기능은 다양합니다.</strong></p>
    <p>(i) <strong>세션 쿠키: </strong>이 쿠키는 웹 세션 중에만 컴퓨터에 저장됩니다. 세션 쿠키는 브라우저가 닫힐 때 자동으로 삭제됩니다. 세션 쿠키는 일반적으로 익명의 세션 ID를 저장하므로 사용자는 각 페이지에 로그인하지 않고도 웹사이트를 탐색할 수 있습니다. 세션 쿠키는 귀하의 컴퓨터에서 어떠한 정보도 수집하지 않습니다.</p>
    <p>(ii) <strong>영구 쿠키: </strong>이러한 쿠키는 귀하의 컴퓨터에 파일로 저장되며 웹 브라우저를 닫아도 그대로 남아 있습니다. 영구 쿠키는 영구 쿠키를 생성한 웹사이트에서 귀하가 웹사이트를 다시 방문할 때 읽어들일 수 있습니다.</p>
    <p>(iii) <strong>자사 쿠키: </strong>이 쿠키는 당사가 생성합니다. 자사 쿠키는 저장되며 당사의 서버와 귀하의 컴퓨터 하드 드라이브 간에 전송됩니다. 이러한 쿠키는 세션 또는 영구 쿠키일 수 있습니다.</p>
    <p>(iv) <strong>제3자 쿠키:</strong> 이 쿠키는 당사의 제3자 파트너 중 한 곳에서 생성합니다. 제3자 쿠키는 저장되며 제3자 서버와 귀하의 컴퓨터 하드 드라이브 간에 전송됩니다. 이러한 쿠키는 일반적으로 영구 쿠키입니다.</p>

    <p><strong>당사의 쿠키 사용 방침과 목적</strong></p>
    <p>웹사이트에 따라 당사는 다음과 같은 목적으로 쿠키를 사용할 수 있습니다.</p>

    <p><strong>필수</strong></p>
    <p>이 쿠키는 웹 사이트의 보안 영역에 접속하는 등 사용자가 웹사이트에서 이동하고 기능을 사용하게 하는 데 필수적입니다. 이러한 쿠키가 없으면 견적을 받거나 계정에 로그인하는 등 귀하가 요청한 서비스를 제공할 수 없습니다. 이러한 쿠키는 귀하와 관련하여 마케팅에 사용될 수 있는 정보를 수집하지 않으며 인터넷 상에서 귀하가 방문한 곳을 기억하지도 않습니다.</p>

    <p><strong>기능</strong></p>
    <p>이러한 쿠키를 통해 당사 웹사이트는 귀하의 선택사항(예: 사용자 이름, 언어 또는 거주 지역)을 기억하고 향상된 기능을 제공할 수 있습니다. 예를 들어, 웹사이트는 귀하의 로그인 정보를 기억할 수 있으므로 특정 기기를 사용해 당사 웹사이트에 접속할 때 계정에 반복적으로 로그인할 필요가 없습니다. 또한 이러한 쿠키는 텍스트 크기, 글꼴 및 웹 페이지의 다른 부분에 대한 변경사항을 기억하는 데 사용될 수 있습니다. 또한 비디오 시청 또는 기사 댓글 작성 등 귀하가 요청한 서비스를 제공하는 데에도 사용될 수 있습니다. 이러한 쿠키가 수집하는 정보는 일반적으로 비식별화됩니다. 이러한 쿠키는 귀하와 관련하여 광고에 사용될 수 있는 정보를 수집하지 않으며 인터넷 상에서 귀하가 방문한 곳을 기억하지도 않습니다.</p>

    <p><strong>분석</strong></p>
    <p>이 쿠키는 방문자가 가장 자주 방문하는 페이지, 웹 페이지에서 오류 메시지를 받는지 여부 등 방문자의 웹사이트 사용 방식에 관한 정보를 수집합니다. 또한 이 쿠키를 통해 웹사이트 방문자 수를 기록 및 집계할 수 있습니다. 이 모든 정보를 통해 웹사이트 이용 방식을 파악하여 웹사이트 운영 방식을 개선할 수 있습니다.</p>

    <p><strong>광고</strong></p>
    <p>이 쿠키는 귀하와 관련된 광고를 표시하고 광고의 성능을 관리하기 위해 사용됩니다. 광고 쿠키는 일반적으로 제3자 쿠키이며 웹사이트에서 광고가 사용되지 않는 경우에도 존재할 수 있습니다.</p>

    <p><strong>IP 주소</strong></p>
    <p>귀하가 당사 웹사이트를 방문할 때 당사는 귀하의 인터넷 프로토콜(“IP”) 주소를 수집하여 비개인정보를 추적하고 집계할 수 있습니다. 예를 들어, 당사는 IP 주소를 사용하여 사용자가 웹사이트를 탐색하는 지역을 모니터링할 수 있습니다.</p>

    <p><strong>쿠키 관리 방법</strong></p>
    <p>쿠키 동의 관리자를 사용하여 특정 쿠키를 옵트인 또는 옵트아웃하려면 페이지 하단의 “쿠키 관리” 링크를 클릭하십시오. 필수 쿠키를 옵트아웃하는 것은 불가능하므로 해당 쿠키만 사용하는 웹사이트는 이 링크를 제공하지 않을 수 있습니다.</p>
    <p>브라우저 설정을 통해 특정 쿠키를 비활성화할 수도 있습니다. 쿠키 설정을 관리하는 방법에 대한 자세한 내용은 브라우저의 “도움말” 섹션을 참조하십시오.</p>

    <p><strong>쿠키 정책은 제3자 웹사이트에 적용되지 않습니다.</strong></p>
    <p>당사가 다른 웹사이트에 대한 링크를 포함하는 경우, 그러한 웹사이트에는 귀하가 제출하는 정보의 사용을 규정하는 자체 개인정보 보호 및 쿠키 정책이 있음에 유의하시기 바랍니다. 당사는 다른 웹사이트의 개인정보 보호 관행에 대해 책임을 지지 않으므로 해당 정책을 읽어보실 것을 권장합니다.</p>

    <p><strong>쿠키 정책 변경</strong></p>
    <p>당사는 때때로 본 정책을 개정할 수 있으며 당사의 쿠키 사용 정책에 대한 정보를 지속적으로 알 수 있도록 수시로 본 정책을 검토하실 것을 권장합니다. 당사는 페이지 상단에 정책 발효일을 게시합니다.</p>

    <p><strong>사용된 쿠키에 대한 설명</strong></p>
    <p>웹사이트 하단의 “쿠키 관리” 링크를 클릭하면 웹사이트에서 사용되는 개별 쿠키에 대한 상세사항을 확인할 수 있습니다. 경우에 따라 이 링크를 사용하지 못할 수도 있습니다(예: 당사에서 필수 쿠키만 사용하는 경우).</p>

    <p><strong>문의처</strong></p>
    <p>본 쿠키 정책에 대해 문의사항이 있으시면 아래 링크된 개인정보 보호정책에 기재된 내용에 따라 당사에 문의하십시오.</p>
