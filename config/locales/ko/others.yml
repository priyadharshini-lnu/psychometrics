          c1:
            content: 개발해야 할 기술, 지식 및 기능을 포함합니다. 구체적이고, 측정 가능하고, 달성 가능하고, 현실적이고, 언급된 일정 내에 합리적으로 달성할 수 있는지 확인합니다.
            title: 개발 목표
          c2:
            content: 이는 평가 경험을 기반으로 개발해야 하는 역량을 기반으로 합니다.
            title: 역량
          c3:
            content: 이 섹션에는 아래 나열된 70-20-10 학습 모델을 기반으로 하는 개발 작업이 포함되어 있습니다. 다양한 학습 및 개발 접근 방식을 보장하기 위해 세 가지 요소의 조합을 선택하는 것이 좋습니다.
            title: 활동
          c4:
            content: 목표를 완료할 수 있는 시점을 기준으로 타임라인이 현실적인지 확인합니다. 적절한 경우 이를 수정하십시오.
            title: 타임라인
          c5:
            content: 진행률 섹션을 사용하여 식별된 트랙의 진행을 지원합니다.
            title: 진보
        chart:
          collaboration: "<strong>20%</strong>공동 <br /> 공부"
          job: "<strong>70%</strong>공부 <br />직장에서"
          learn: "<strong>10%</strong>공식 학습"
        content:
          list:
            r1: 본 목록은 참고용으로만 제공되며, 개인의 목표, 관리자의 추천 및 조직의 비즈니스 우선순위에 따라 추가적인 경력 개발 경로가 고려될 수 있음을 유의하시기 바랍니다.
            r2: 사용자들은 모든 콘텐츠를 비판적으로 검토할 것을 권장받으며, 동의하지 않는 행동이나 권고사항을 수정, 개선, 교체 또는 추가할 수 있습니다.
            r3: '본 보고서에 포함된 개발 정보는 다음 출처 중 하나 또는 둘 모두에서 유래되었을 수 있습니다:'
            r3a: 귀사를 위해 맞춤 제작된 개발 라이브러리
            r3b: AI가 생성한 개발 제안
            r4: 이 IDP 보고서는 AI 기술의 도움을 받아 작성되었으며, 일부 부정확한 내용이 포함될 수 있습니다. 제공된 통찰과 권장 사항은 신중하게 해석해야 하며, 오로지 귀하의 개인적 및 직업적 발전을 위한 도구로만 활용하시기 바랍니다. 본 보고서의 유효 기간은 12~18개월입니다.
          main: 본 IDP에는 70-20-10 가이드라인과 같은 모범 학습 사례를 고려하여 수행할 수 있는 상세한 발전 활동 목록이 포함되어 있습니다. 이는 교실 학습, 코칭 및 현장 학습을 결합한 단계적 여정을 제공합니다. 평가 센터 프로세스 결과, 채팅 응답 및 해당되는 경우 외부 보고서를 바탕으로 가능한 발전 경로가 권장되었으며, 귀하의 발전을 위해 고려해 볼 수 있습니다.
        learn_cards:
          collaboration:
            list:
            - 다른 사람들을 코치하거나 멘토링해 주겠다고 제안하다
            - 해당 분야의 전문가에게 멘토링을 요청합니다
            - 개발을 지원해 줄 코치를 확보하세요
            - 협업 작업 그룹을 구성하여 비즈니스에서 지속적으로 발생하는 과제에 대해 논의하십시오.
            - 다른 사람들로부터 공식적·비공식적으로 피드백을 받다
            - 산업 협회 및 네트워크에서 적극적인 역할을 수행한다
            - 자신만의 외부 네트워크를 구축하세요
            title: 협업 학습(20%) <br/> 다른 사람들을 통해 발전
          job:
            list:
            - 이해관계자 또는 경영 위원회에서 리더십 직책을 맡는다
            - 조직을 위한 변화 관리 프로젝트를 주도할 자원봉사자 모집
            - 신규 업무를 맡아 보세요
            - 다른 부서와 교차 협업합니다
            - 조직 외부에서 프로젝트를 주도하는 것을 고려해 보십시오
            - 외부 산업 전문가들과 공동 프로젝트를 위해 긴밀히 협력한다
            title: 직장에서 배우기(70%) <br/> 경험을 통한 발전
