        <h4>감독 브라우저</h4>
        <p>감독하는 작업을 완료하려면 특수 브라우저를 다운로드하여 설치해야 합니다. 다음 화면의 지침을 따르세요. 필요한 모든 활동을 완료한 후 제거할 수 있습니다</p>
