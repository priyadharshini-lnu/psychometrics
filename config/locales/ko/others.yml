    instruction_modal:
      campaign_start_final_instructions: "<p>타이머를 중지하거나 일시 중지하는 방법은 없습니다. 브라우저를 닫아도 캠페인 타이머는 계속 실행되므로 중간에 다른 일을 하기 위해 작업을 중단할 생각은 하지 마세요. 작업 중 방해 요소를 최소화하세요. 조용한 환경을 찾고, 기기에서 알림을 끄고, 멀티태스킹을 피하세요. 집중력을 유지하고 집중하세요. 캠페인 타이머가 다 지나면 계속할 수 없습니다. 위의 지침을 모두 읽었다면 시작을 클릭하여 할당된 작업을 계속 진행하시기 바랍니다</p>\n"
      campaign_start_instruction: |-
        <h4>다음 지침을 잘 읽어주세요.</h4>
        <p>시작하려는 작업에는 시간이 정해져 있습니다. '시작'을 클릭하면 캠페인 타이머가 자동으로 시작됩니다. 모든 활동을 완료하는 데 남은 시간은 %{minutes}입니다. 지정된 시간 내에 작업을 완료하고 평가 과정을 서두르지 않도록 시간을 효율적으로 관리하세요. 한 번에 작업을 완료해야 하므로 잠시 쉬고 싶다면 지금이 바로 그 시간입니다</p>
      common_proctoring_instructions: |-
        <h4>감독</h4>
        <p>시작 버튼을 클릭하면 감독 시스템으로 리디렉션되며, 세션이 진행되는 동안 카메라, 마이크, 화면을 모니터링합니다. 이러한 세션은 정교한 AI 시스템에 의해 자동으로 감독되어 중단 없이 원활한 사용자 경험을 제공합니다. 그러나 세션은 인간 감독자가 검토할 수도 있습니다. 부정 행위나 부정 행위의 징후가 발견되면 플래그가 표시됩니다. 이는 부정 행위 시도를 방지하기 위한 것입니다. 의심이 발견되면 작업은 취소될 수 있습니다</p>
