        </p>
        <h2>개인 정보 보호를 위한 조치  </h2>
        <p>
          우리 회사 모든 해당 사이버보안 및 데이터 보호법을 준수하기 위해 노력합니다.이러한 목표를 염두에 두고 MMC는 전담 최고 정보 보안 책임자(CISO)를 두고 있습니다. 그리고 글로벌 최고 개인정보보호책임자(GCPO)입니다. CISO는 글로벌 정보 보안 팀과 포괄적인 사이버 보안 프로그램을 관리할 책임이 있습니다.  당사의 사이버보안 프로그램의 일환으로 당사는 개인 정보에 대한 무단 접근, 사용, 변경 및 삭제를 방지하기 위해 상업적으로 합리적인 물리적, 관리적, 기술적 보호 장치를 구현했습니다.
        </p>
        <p>
          GCPO는 포괄적인 글로벌 개인정보 보호 프로그램을 구현하는 업무를 담당하는 개인정보 보호 센터와 데이터 보호 책임자 네트워크를 이끌고 감독합니다. 데이터 보호 책임자 네트워크는 전 세계의 데이터 보호 책임자를 연결하고 데이터를 처리하는 모든 곳에서 일관되고 철저하게 개인정보 보호 프로그램을 구현하고자 노력합니다. 귀하의 관할권에 있는 데이터 보호 책임자의 이름과 연락처 정보는 당사에 문의하여 얻을 수 있습니다. <a href="mailto:privacy@mmc.com">privacy@mmc.com</a>.
        </p>
        <h2>귀하의 데이터 보호 권리  </h2>
        <p>
          많은 경우, 당사는 기업 고객에게 서비스를 제공하기 위해 개인 정보를 처리하며, 귀하는 해당 개인정보 보호법에 따라 귀하가 가질 수 있는 권리를 행사하기 위해 해당 기업 고객에게 연락해야 합니다. 그러나 당사가 귀하의 정보가 어떻게 처리되는지 결정하는 주된 책임이 있는 통제자 또는 사업체 역할을 하는 경우, 관할권과 당사의 정보 처리 목적에 따라 아래에 나열된 권리 중 일부 또는 전부를 가질 수 있습니다 . 아래 권리에 응답하기에 앞서, 귀하의 신원을 확인하기 위해 귀하의 개인 정보를 사용해야 할 수도 있음을 알려드립니다.
        </p>
        <ul>
          <li>
            <strong>접근권(알 권리)  <br /></strong>
            귀하는 당사가 귀하의 개인 정보를 사용하는 방법, 당사가 수집한 개인 정보의 출처, 범주 또는 구체적인 내용, 당사가 정보를 공개한 제3자 범주에 대한 자세한 내용을 제공해 달라고 요청할 수 있으며, 당사가 귀하에 대해 보유하고 있는 개인 정보 사본을 요청할 수 있습니다.
          </li>
        </ul>
        <ul>
          <li>
            <strong>수정할 권리  <br /></strong>
            귀하는 당사가 보유하고 있는 개인정보에 부정확한 내용이 있는 경우 업데이트를 요청할 수 있습니다. 당사가 귀하의 개인 정보를 타인에게 공개하는 경우, 가능한 한 해당 공개 내용에 대한 수정 사항을 알려드리겠습니다.
          </li>
        </ul>
        <ul>
          <li>
            <strong>삭제할 권리  <br /></strong>
            더 이상 합법적인 근거로 처리할 수 없는 개인 정보를 삭제해 달라고 요청할 수 있습니다.
          </li>
        </ul>
        <ul>
          <li>
            <strong>처리에 대한 반대 또는 제한 권리  <br /></strong>
            귀하는 정확성에 이의를 제기하는 경우 등 특정 상황에서 개인 정보 처리를 제한할 권리가 있을 수 있습니다.
          </li>
        </ul>
        <ul>
          <li>
            <strong>데이터 이동성에 대한 권리  <br /></strong>
            기술적으로 가능한 경우, 귀하는 당사가 귀하로부터 수집한 개인 정보 사본을 구조화되고 일반적으로 사용되며 기계가 읽을 수 있는 형식으로 귀하가 선택한 제3자에게 전송해 달라고 요청할 권리가 있습니다.
          </li>
        </ul>
        <ul>
          <li>
            <strong>동의 철회권  <br /></strong>
            당사가 귀하의 개인정보를 처리하기 위한 법적 근거로 귀하의 동의에 의존하는 경우, 귀하는 해당 동의를 철회할 권리가 있습니다.
          </li>
        </ul>
        <ul>
          <li>
            <strong>불만 제기 권리<br /></strong>
            당사의 개인정보 보호 관행의 어떤 측면에 대해 우려 사항이 있는 경우, 관할권 내 관련 감독 또는 규제 기관에 불만을 제기할 권리가 있습니다.
          </li>
        </ul>
        <p>
          위에 명시된 권리를 행사하거나 결정 또는 거부에 대한 검토를 요청하려면 해당 연락처 정보를 사용하여 당사에 연락해 주시기 바랍니다.
        </p>
        <ul>
          <li>
            영국, 스위스 또는 유럽 경제 지역(EEA)의 개인의 경우
            <a
              href="https://mmc-dev-privacy.my.onetrust.com/webform/4da460d1-7bcf-4ff1-ac37-c4b804769467/draft/ea953d72-fded-42ee-b1dd-c0a5a83b7891"
              >이 양식을 작성하세요</a
            >
          </li>
          <li>
            다른 국가에 거주하는 개인의 경우
            <a
              href="https://privacyportal.onetrust.com/webform/ee9df2bb-0ef3-4485-bc63-4db420e77359/225910f5-5666-468a-b1e7-39c70e24f4cc"
              >이 양식을 작성하세요</a
            >
          </li>
          <li>
            또는 다음 주소로 이메일을 보내실 수 있습니다. <a href="mailto:privacy@mmc.com">privacy@mmc.com</a>
          </li>
        </ul>
        <p>
          귀하의 국가에 따라 다음 권리 중 일부 또는 전부를 가질 수도 있습니다.
        </p>
        <ul>
          <li>
            <strong>
              크로스 컨텍스트 광고 판매 또는 공유에 대한 선택권   <br />
            </strong>
            귀하가 당사 웹사이트 중 하나를 방문하는 경우 당사는 귀하의 인터넷 또는 기타 전자 네트워크 활동 정보, 생체 식별자, 지리적 위치 데이터를 공개할 수 있습니다.  광고 쿠키를 활용하여 교차 맥락적 행동 또는 타겟 광고 목적으로 웹사이트 분석 및 광고 제공자에게 전문 정보(웹사이트에서의 귀하의 활동으로부터 얻을 수 있는 범위 내에서)를 제공합니다.  일부 법률에 따라 이러한 유형의 공개를 선택하거나 거부할 권리가 있을 수 있습니다.  귀하의 선택을 하거나 당사가 귀하의 정보를 판매 또는 공유한 특정 제3자의 이름을 보려면 웹페이지 하단의 "쿠키 관리" 링크를 클릭하세요. 귀하의 정보 판매 또는 공유를 거부하려면 "광고" 및 "분석" 추적기의 토글을 "아니요"로 설정하거나, 가능한 경우 개인 정보 판매 또는 공유 안 함 토글을 활성화하세요.
            <p>
              또한, 브라우저 설정이나 확장 프로그램을 구현하여 방문하는 웹사이트에 판매 및 공유 기본 설정을 자동으로 전달할 수도 있습니다.  당사 웹사이트는 글로벌 개인정보 보호 제어(GPC)를 인식하여 원활한 방식으로 이러한 "거부 선호 신호"를 처리합니다. GPC를 사용하려면 참여 브라우저나 브라우저 확장 프로그램을 통해 다운로드하여 활성화할 수 있습니다. GPC 다운로드에 대한 자세한 내용은 여기에서 확인할 수 있습니다.  <a href="https://globalprivacycontrol.org/">여기 .</a>.
            </p>
          </li>
        </ul>
        <ul>
          <li>
            <strong>
              자동화된 의사결정 및 프로파일링과 관련된 권리
            <br /></strong>
            당사가 귀하의 개인정보를 자동으로 처리하는 범위 내에서, 당사는 법률에 따라 요구되는 귀하의 권리에 관한 통지를 포함하여 모든 통지를 사전에 귀하에게 제공할 것입니다.
          </li>
        </ul>
        <ul>
          <li>
            <strong>직접 마케팅 및 추적 금지 신호  <br /></strong>
            귀하는 법률이 허용하는 한, 당사가 다른 사업체의 직접 마케팅 목적으로 다른 사업체에 공개한 개인 정보에 관해 연 1회 통지를 요청하고 받을 권리가 있습니다.  해당되는 경우, 해당 통지에는 공개된 개인 정보 범주 목록(있는 경우)과 개인 정보가 공개된 모든 제3자의 이름과 주소(있는 경우)가 포함됩니다.  본 공지사항은 전년도에 적용됩니다.  귀하에게 이 권리가 적용되는지 알아보고, 적용된다면 그 권리를 행사하고 싶으시다면 아래에 제공된 방법으로 당사에 연락하실 수 있습니다.
          </li>
        </ul>
        <p>
          당사가 개인 정보를 계속 처리해야 하는 우선적인 합법적 이익이나 법적, 규제적 또는 계약적 의무 가 있는 경우, 또는 해당 개인 정보가 해당 법률에 따라 공개 또는 삭제에서 면제될 수 있는 경우, 이러한 권리 중 일부가 제한될 수 있음을 유의하시기 바랍니다.  이러한 권리 중 일부는 특정 상황에서만 행사할 수 있거나, 그렇지 않으면 귀하의 관할권의 데이터 보호법에 따라 제한될 수 있습니다.
        </p>
        <h2>국경 간 이전   </h2>
        <p>
          80개국 이상에서 운영되는 글로벌 기업으로서, 당사는 본 개인정보 보호정책에 명시된 목적을 위해 수집된 개인 정보를 해당 국가, 지방 또는 지역 외부로 이전해야 하는 상황이 있습니다.구체적으로, 당사는 귀하에게 제공되는 서비스를 제공, 운영 및 관리하고 당사의 사업 운영의 효율성을 높이기 위해 데이터를 전송할 수 있습니다. 당사는 이러한 데이터 전송이 모든 관련 데이터 보호 법률을 준수하고, 해당 법률에 따라 개인의 권리와 자유가 적절하게 보호되도록 최선을 다할 것입니다.
        </p>
        <p>
          이러한 전송이 필요한 경우, 영향 평가, 해당 감독 기관의 적정성 결정, 승인된 구속력 있는 기업 규칙이나 표준 계약 조항의 사용 또는 귀하의 동의와 같이 개인 정보를 보호하기 위한 적절한 안전 장치가 있는지 확인하기 위한 조치를 취할 것입니다.
        </p>
        <p>
           MMC의 EU(유럽연합) 구속적 기업 규칙(EU BCR)이 어떻게 운영되는지에 대한 정보를 보려면 클릭하십시오.
          <a
