            >여기</a
          >.&nbsp; EU BCR에 따라야 한다는 데 동의한 기관 목록을 보려면 여기를 클릭하세요.
          <a href="https://www.marshmclennan.com/privacy-statement/bcr-entities.html"
            >여기</a
          >.&nbsp;
        </p>
        <p>
          MMC의 영국 구속 기업 규칙(영국 BCR)이 어떻게 운영되는지에 대한 정보를 보려면 클릭하십시오.
          <a
            href="https://www.marshmclennan.com/content/dam/mmc-web/Archive/Images/Files/02March2022-UKBCR-Controller-and-Processor-Principles.pdf"
            >여기</a
          >.&nbsp; BCR에 따라야 한다는 데 동의한 기관 목록을 보려면 여기를 클릭하세요.
          <a
            href="https://www.marshmclennan.com/privacy-statement/bcr-entities-uk.html"
            >여기</a
          >.&nbsp;&nbsp;&nbsp;
        </p>
        <h2>귀하의 정보 보관  </h2>
        <p>
          당사 의 제품, 서비스 및 규제 의무는 복잡하기 때문에 개인 정보 보관 기간도 다양합니다.  당사는 개인 정보 및 당사가 유지하는 기록의 보관 기간을 설정할 때 다음과 같은 의무를 고려합니다.
        </p>
        <ul>
          <li>
            수집된 사업 목적이나 계약상 의무를 달성하기 위해 정보를 보관해야 할 필요성
          </li>
          <li>
            당사가 고객을 대신하여 처리하는 개인정보와 관련하여 고객의 지시를 이행하는 것이 당사의 의무입니다.
          </li>
          <li>
            의무적인 법률 및 규제 기록 보관 요구 사항을 준수하는 것이 당사의 의무입니다.
          </li>
          <li>
            당사의 백업 및 재해 복구 절차 및
          </li>
          <li>
            적용되는 소멸시효 기간과 같은 기타 법적 영향.
          </li>
        </ul>
        <p>
          위에 언급된 요인에 따라, 당사는 귀하에게 서비스를 제공하는 기간 이후에도 개인 정보를 보관할 수 있습니다. 개인 정보를 더 이상 보관할 필요가 없을 경우, 당사 회사 정책에 따라 해당 정보를 익명화하거나 집계해야 합니다(이 경우, 익명화된 정보나 집계된 정보를 분석 목적으로 보관하고 사용할 수 있음). 또는 안전하게 파기해야 합니다.
        </p>
