        </p>
        <h3><strong>외부 링크  </strong>&nbsp;</h3>
        <p>
          당사 웹사이트에는 MTE가 아닌 다른 기관이 운영하는 웹사이트로 연결되는 링크가 포함되어 있을 수 있습니다.  당사 웹사이트의 하이퍼링크를 통해 다른 조직의 웹사이트에 접속하는 경우, 해당 조직이 귀하의 정보를 수집할 수 있습니다.  MTE는 링크된 웹사이트의 콘텐츠나 개인정보 보호 관행 또는 해당 웹사이트에서 귀하의 개인정보를 사용하는 방식에 대해 책임을 지지 않습니다.  이러한 링크를 통해 MTE 웹사이트를 벗어나는 경우(브라우저의 위치 표시줄에 있는 URL을 확인하면 현재 위치를 알 수 있음) 해당 웹사이트의 개인정보 보호정책, 이용약관 및 기타 고지사항을 참조하여 해당 조직이 귀하에게서 수집한 개인정보를 어떻게 처리하는지 확인해야 합니다.
        </p>
