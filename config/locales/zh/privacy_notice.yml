zh:
  privacy_notice:
    marsh: "<div>\n  <h1><strong>美世人才企业隐私声明</strong>&nbsp;</h1>\n  <p>生效日期: 15 September 2024</p>\n  <p>\n    本隐私声明描述了 Mercer Talent Enterprise（“\n    <strong>MTE</strong>\n    ”）如何收集、使用、共享、保留、传输和以其他方式处理与已识别或可识别个人相关的信息（个人信息），以及您可能拥有的有关您的个人信息的权利。 我们认为，让您了解我们如何处理个人信息非常重要，并鼓励您花点时间熟悉下面概述的隐私惯例。\n  </p>\n  <p>\n    请注意，MTE 是行为科学评估解决方案的提供商，在某些情况下，我们代表客户、金融机构、商家和其他作为数据控制者的合作伙伴并根据他们的指示行事，包括处理支付交易。 有关在这些情况下处理您的个人信息的更多信息，请参阅这些合作伙伴的隐私政策。\n  </p>\n  <h2>我们和您是什么关系</h2>\n  <p>\n    第三方要求您在 MTE 平台上完成评估。 该第三方是 MTE 的客户，可能是您的雇主、潜在雇主或其他相关方。 MTE 代表我们的客户收集和处理您的个人信息。 我们遵循客户提供的关于收集哪些个人信息以及如何处理此类个人信息的指示。 因此，MTE 作为我们客户的处理者，由客户决定决定如何处理您的个人信息。\n  </p>\n  <p>\n    如果您对您的个人信息处理有任何疑问，我们鼓励您访问我们客户的隐私声明。\n  </p>\n  <h2>我们收集哪些个人信息  </h2>\n  <p>\n    我们的客户指示我们代表他们收集某些信息。 除了创建帐户所需的您的姓名和电子邮件地址外，MTE 不会独立确定收集哪些信息。 根据客户的需求和指示，我们可能会在适当的情况下收集以下类别的个人信息，以实现我们的预期业务目的：\n  </p>\n  <table width=\"600\">\n    <tbody>\n      <tr>\n        <td width=\"146\">\n          <p>\n            <strong\n              >类别\n            </strong>\n          </p>\n        </td>\n        <td width=\"454\">\n          <p>\n            <strong\n              >示例\n            </strong>\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"146\"><p>履历标识符</p></td>\n        <td width=\"454\">\n          <p>姓名、出生日期、年龄、出生地、性别。</p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"146\"><p>联系信息</p></td>\n        <td width=\"454\">\n          <p>家庭住址、电话号码、个人电子邮件地址。</p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"146\"><p>身份信息</p></td>\n        <td width=\"454\">\n          <p>\n            税号、社会安全号码或其他政府颁发的身份证号码、驾驶执照号码、护照信息、银行账户详细信息、所得税申报表、所得税号码。\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"146\">\n          <p>专业或就业相关信息</p>\n        </td>\n        <td width=\"454\">\n          <p>\n            雇主或团体、与我们公司的关系、职位、业务联系方式、员工 ID、就业等级、员工绩效、薪酬安排和就业历史，和/或您与投保人、被保险人、受益人或索赔人的关系。\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"146\"><p>敏感的人口统计属性</p></td>\n        <td width=\"454\">\n          <p>\n            种族、公民身份、身体或精神健康或残疾、性别（包括性别、性别认同、怀孕或生育以及相关医疗状况）、性取向、工会会员资格、退伍军人或军人身份。\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"146\"><p>生物特征和身体数据</p></td>\n        <td width=\"454\">\n          <p>\n            面部扫描和面部监控是监督选项的一部分。\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"146\"><p>有关您的物理环境的数据</p></td>\n        <td width=\"454\">\n          <p>\n            作为监督选项的一部分，通过视频或照片拍摄的您所在特定局部区域。 所收集的有关您的物理环境的具体数据将根据监督摄像机所看到的内容而有所不同。\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"146\"><p>互联网或其他类似的网络活动 </p></td>\n        <td width=\"454\">\n          <p>\n            浏览和搜索历史记录、与网站、应用程序或广告的互动、来自 cookie 或网络信标的数据、登录凭据、域名以及与我们的电子邮件的互动，包括您阅读和回复电子邮件时、ISP（互联网服务提供商）、浏览器详细信息、其他网站活动、在线标识符（包括 IP 地址或设备 ID）。\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"146\"><p>任何其他自愿提供的信息 </p></td>\n        <td width=\"454\">\n          <p>\n            有关伴侣和家属（包括未成年家属）的信息；紧急联系方式、披露声明、限制性契约、地理位置、营销和沟通偏好、与您参加过的公司赞助活动相关的信息，以及您选择表明身份的反馈或调查回复。\n          </p>\n        </td>\n      </tr>\n    </tbody>\n  </table>\n  <p>\n    请注意，这些只是示例。 MTE 致力于坚持数据最小化的理念，并寻求仅收集为您提供服务所必需的个人信息。 但是，我们无法控制客户要求的信息或您自愿提供的信息。\n  </p>\n  <h2>我们如何收集个人信息</h2>\n  <h3>\n    <strong>您、您的代表或第三方提供的信息</strong\n    >\n  </h3>\n  <p>我们可能从以下来源收集个人信息：</p>\n  <ul>\n    <li>\n      直接从您处获取，例如当您访问网站、创建帐户、完成调查或以其他方式向我们提供信息时。\n    </li>\n    <li>\n      您的代表，包括您的雇主、协会、团体或福利计划/计划发起人。\n    </li>\n  </ul>\n  <p>\n    在评估过程中，我们可能会通过您的网络摄像头、麦克风或系统中的其他硬件元素收集个人信息。 您的系统和 MTE 程序将在从您的硬件设备收集个人信息之前征求您的同意。\n  </p>\n  <p>\n    如果您向我们提供有关其他人（例如家庭成员、受益人或家属）的个人信息，则表示您有权提供此信息，并且您已在适当的情况下共享此隐私声明。 我们不会故意直接从未成年人那里收集个人信息。\n  </p>\n  <h3><strong>通过自动化方式收集 </strong>&nbsp;</h3>\n  <p>\n    我们在公司拥有的网站上使用 cookie 和相关跟踪技术（“Cookie”） 。 如果您所在的司法管辖区允许，网站用户可以使用网站底部的管理 Cookie 链接选择停止使用某些 Cookie。 如需了解有关我们如何使用 Cookie 的更多信息，请参阅我们的。\n    <a href=\"https://www.mercer.com/en-sa/footer/mercer-cookie-notice/\"\n      >Cookie 通知</a\n    >.&nbsp;\n  </p>\n  <h3><strong>第三方收集 </strong>&nbsp;</h3>\n  <p>\n    如果您通过我们进行交易，第三方（例如服务提供商或保险公司）可能会收集和处理与此类交易相关的您的信用卡或其他个人信息，包括通过 Cookie收集和处理与此类交易相关的信息。 在这些情况下，以及我们从您的雇主、协会或其他第三方接收信息的任何其他安排中，我们鼓励您阅读第三方的隐私政策，以进一步了解有关他们将如何使用和披露您的信息。\n  </p>\n  <h2>我们如何使用我们收集的个人信息 </h2>\n  <p>我们可能会将收集到的个人信息用于：  </p>\n  <table width=\"600\">\n    <tbody>\n      <tr>\n        <td width=\"107\">\n          <p>\n            <strong\n              >类别\n            </strong>\n          </p>\n        </td>\n        <td width=\"317\">\n          <p><strong>使用</strong></p>\n        </td>\n        <td width=\"176\">\n          <p><strong>法律依据</strong></p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"107\">\n          <p><strong>开展我们的业务</strong></p>\n        </td>\n        <td width=\"317\">\n          <p>\n            我们在开展业务时根据需要使用个人信息，包括验证您的身份、回复您的疑问、与您沟通、处理交易、建立在线账户或履行我们的合同义务。\n          </p>\n        </td>\n        <td width=\"176\">\n          <p>\n            合同履行以及适用情况下的合法利益（使我们能够履行我们的义务并提供我们的服务）。\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"107\">\n          <p>\n            <strong\n              >在适用法律允许的情况下向您提供营销材料</strong\n            >\n          </p>\n        </td>\n        <td width=\"317\">\n          <p>\n            我们可能会使用您的联系方式向您发送我们认为您可能感兴趣的产品、服务和见解的信息。 这些通信可能会根据您的营销偏好和适用的全球法律（包括与数据保护和电子通信相关的法律）通过电子邮件、短信、邮寄或电话发送。 因此，我们与您联系的方式将根据您的身份、我们与您的关系以及您的所在地而有所不同。\n          </p>\n          <p>\n            无论我们基于何种基础与您分享我们的营销信息，我们都会遵守当地法律，并为您提供随时取消订阅的选项，在这种情况下，我们将停止向您发送我们的营销信息。 您还可以通过以下方式联系我们，更改您的营销偏好 <a href=\"mailto:privacy@mmc.com\">privacy@mmc.com</a>。\n          </p>\n          <p>\n            请注意，即使您选择不接收营销通信，我们仍可能会向您发送与我们向您提供的服务相关的通信。\n          </p>\n        </td>\n        <td width=\"176\">\n          <p>\n            法律义务、同意（您可以拒绝或撤回）以及适用时的合法权益（让您了解有关我们产品和服务的最新消息）。\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"107\">\n          <p>\n            <strong>用于研究、数据分析和发展目的</strong>\n          </p>\n        </td>\n        <td width=\"317\">\n          <p>\n            我们可能会将个人信息与来自其他客户的信息一起分析，以创建见解、报告和其他分析，从而更好地了解和提高我们提供的产品；推销我们的建议、产品和服务；并评估我们的营销活动、网站和整体服务的有效性。\n          </p>\n          <p>\n            请注意，我们可能会对个人信息进行去识别化处理，以使其与任何特定客户或个人不再关联。\n          </p>\n        </td>\n        <td width=\"176\">\n          <p>\n            在适用的情况下，合法利益（允许我们改进我们的服务）。\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"107\">\n          <p>\n            <strong\n              >监控某些活动并维护网络安全和性能，并防止网络攻击</strong\n            >\n          </p>\n        </td>\n        <td width=\"317\">\n          <p>\n            我们监控查询和交易以确保服务质量、遵守程序并打击欺诈。 我们也会在必要时使用个人信息来维护网络安全、监控网站性能并保护我们的系统免受网络攻击。\n          </p>\n        </td>\n        <td width=\"176\">\n          <p>\n            法律义务，以及在适用的情况下的合法利益（以确保我们服务的质量和合法性）。\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"107\">\n          <p>\n            <strong\n              >维护我们的网站并确保网站内容的相关性</strong\n            >\n          </p>\n        </td>\n        <td width=\"317\">\n          <p>\n            我们在必要时使用个人信息来维护我们的网站，并确保以对您和您的设备最有效的方式呈现我们网站的内容。\n          </p>\n        </td>\n        <td width=\"176\">\n          <p>\n            合同履行以及适用情况下的合法利益（允许我们在网站上为您提供内容和服务）。\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"107\">\n          <p><strong>重组或改变我们的业务</strong></p>\n        </td>\n        <td width=\"317\">\n          <p>\n            在必要时，我们会：(i) 就将我们的业务或部分业务出售给第三方进行谈判；(ii) 出售给第三方；或 (iii) 进行重组。\n          </p>\n        </td>\n        <td width=\"176\">\n          <p>\n            法律义务或合法利益（允许我们改变业务）。\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"107\">\n          <p>\n            <strong>与法律或监管义务相关</strong>\n          </p>\n        </td>\n        <td width=\"317\">\n          <p>\n            我们使用个人信息来遵守我们的监管披露要求或作为与监管机构对话的一部分（如适用）。\n          </p>\n        </td>\n        <td width=\"176\">\n          <p>\n            法律义务，以及在适当情况下的合法利益（与执法和监管机构合作）。\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"107\">\n          <p>\n            <strong>用于欺诈、反洗钱和制裁检查</strong>\n          </p>\n        </td>\n        <td width=\"317\">\n          <p>\n            在建立或维持客户关系以提供某些服务时，我们会使用个人信息来进行欺诈、反洗钱或制裁检查。\n          </p>\n        </td>\n        <td width=\"176\">\n          <p>\n            法律义务以及在适当情况下的合法利益（与执法和监管机构合作）。\n          </p>\n        </td>\n      </tr>\n    </tbody>\n  </table>\n  <p>\n    我们还可能以在收集时向您描述的方式使用我们收集和接收的个人信息。\n  </p>\n  <h3><strong>外部链接 </strong>&nbsp;</h3>\n  <p>\n    我们的网站可能包含由 MTE 以外的组织运营的网站的链接。  如果您使用我们网站上的超链接访问其他组织的网站，则该组织可能会收集您的信息。  MTE 不对链接网站的内容或隐私惯例或他们对您的个人信息的使用负责。  如果您通过此类链接离开 MTE 网站（您可以通过检查浏览器位置栏中的 URL 来判断您所在的位置），您应该参考该网站的隐私政策、使用条款和其他声明，以确定其他组织将如何处理他们从您那里收集的任何个人信息。\n  </p>\n  <h2>我们向谁披露个人信息</h2>\n  <p>\n    我们可能会向以下类别的第三方披露个人信息：\n  </p>\n  <table width=\"601\">\n    <tbody>\n      <tr>\n        <td width=\"301\">\n          <p><strong>我们可能会向以下类别的第三方披露个人信息：  </strong></p>\n        </td>\n        <td width=\"301\">\n          <p><strong>披露目的</strong></p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"301\">\n          <p>\n            您的雇主、协会、团体或福利计划发起人（如适用）（即 MTE 的客户）\n          </p>\n        </td>\n        <td width=\"301\"><p>为我们的客户提供服务 </p></td>\n      </tr>\n      <tr>\n        <td width=\"301\">\n          <p>\n            MTE 关联公司或 Marsh McLennan 公司集团 (MMC) 内的其他实体\n          </p>\n        </td>\n        <td width=\"301\">\n          <p>\n            使他们能够为您提供服务或就其他产品和服务与您联系。\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"301\">\n          <p>代理商或第三方服务提供商 \t</p>\n        </td>\n        <td width=\"301\">\n          <p>\n            为我们或代表我们执行职能或服务。 此类第三方受合同限制，不得将个人信息用于除为 MTE 或代表 MTE 提供服务之外的目的。\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"301\">\n          <p>\n            营销合作伙伴，包括我们的关联公司以及我们或我们的客户就服务聘用的第三方。\n          </p>\n        </td>\n        <td width=\"301\">\n          <p>\n            在法律允许的范围内向您提供有关我们的产品、服务或见解的信息。\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"301\"><p>在法律允许的范围内向您提供有关我们的产品、服务或见解的信息。</p></td>\n        <td width=\"301\">\n          <p>\n            在合并、收购、破产、资产出售或其他交易中，第三方控制我们的全部或部分资产。\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"301\"><p>网站分析和广告公司</p></td>\n        <td width=\"301\">\n          <p>\n            帮助我们根据您的兴趣个性化广告和内容，衡量我们的广告和内容的效果，并深入了解看到我们广告和内容的受众。\n          </p>\n        </td>\n      </tr>\n      <tr>\n        <td width=\"301\">\n          <p>\n            反欺诈数据库、监管或监管机构、执法部门和其他第三方\n          </p>\n        </td>\n        <td width=\"301\">\n          <p>\n            在必要时防止欺诈、与监督或监管机构沟通、保护和捍卫 MTE、我们的关联公司和业务合作伙伴以及任何网站用户的合法权利、安全和保障、执行网站的使用条款；回应涉嫌或实际非法活动的索赔；回应审计或调查投诉或安全威胁；或遵守适用的法律、法规、法律程序或政府要求。\n          </p>\n        </td>\n      </tr>\n    </tbody>\n  </table>\n  <p>\n    我们还可能为了商业上合法和合规的商业目的披露不太可能识别您身份的去识别化信息。  对于我们持有的已去识别化信息，我们将保留和使用这些信息，除非法律允许，否则不会尝试重新识别数据。\n  </p>\n  <h2>我们采取的保护个人信息的措施  </h2>\n  <p>\n    我们的公司 努力遵守所有适用的网络安全和数据保护法。为了实现这些目标，MMC 设立了专门的首席信息安全官 (CISO) 以及全球首席隐私官 (GCPO)。 CISO负责管理全球信息安全团队和全面的网络安全计划。  作为我们网络安全计划的一部分，我们实施了商业上合理的物理、管理和技术保障措施，以保护个人信息免遭未经授权的访问、使用、更改和删除。\n  </p>\n  <p>\n    GCPO 领导并监督隐私卓越中心和数据保护官网络，负责实施我们全面的全球隐私计划。 数据保护官网络连接了我们遍布世界各地的数据保护官，并致力于在我们处理数据的任何地方一致、彻底地实施我们的隐私计划。 您可以通过以下方式联系我们，获取您所在司法辖区数据保护官的姓名和联系信息：<a href=\"mailto:privacy@mmc.com\">privacy@mmc.com</a>。\n  </p>\n  <h2>您的数据保护权利  </h2>\n  <p>\n    在许多情况下，我们处理个人信息是为了向企业客户提供我们的服务，您应该联系他们以行使您根据适用隐私法可能拥有的任何权利。 但是，如果我们作为主要负责决定如何处理您的信息的控制者或企业，您可能拥有下面列出的部分或全部权利，具体取决于司法管辖区和我们处理您的信息的原因。 请注意，在回应以下任何权利之前，我们可能需要使用您的个人信息来验证您的身份。\n  </p>\n  <ul>\n    <li>\n      <strong>访问权（知情权）  <br /></strong>\n      您可以要求我们向您提供关于如何使用您的个人信息的更多详细信息、我们收集的个人信息的来源、类别或具体内容、我们向其披露信息的第三方类别，并要求我们提供我们持有的关于您的个人信息的副本。\n    </li>\n  </ul>\n  <ul>\n    <li>\n      <strong>更正权 <br /></strong>\n      您可以要求我们更新我们所持有的个人信息中的任何不准确之处。 如果我们向其他人披露您的个人信息，我们将尽可能告知他们更正的信息。\n    </li>\n  </ul>\n  <ul>\n    <li>\n      <strong>删除权 <br /></strong>\n      当我们不再有合法依据处理您的个人信息时，您可以要求我们删除您的个人信息。\n    </li>\n  </ul>\n  <ul>\n    <li>\n      <strong>反对或限制处理的权利 <br /></strong>\n      在某些情况下，您可能有权限制对您的个人信息的处理，例如当您对其准确性提出异议时。\n    </li>\n  </ul>\n  <ul>\n    <li>\n      <strong>数据可携带权 <br /></strong>\n      在技术可行的情况下，您有权要求我们以结构化、常用和机器可读的格式将从您处获得的个人信息的副本传输给您选择的第三方。\n    </li>\n  </ul>\n  <ul>\n    <li>\n      <strong>撤回同意的权利 <br /></strong>\n      如果我们依赖您的同意作为处理您的个人信息的法律依据，您有权撤回该同意。\n    </li>\n  </ul>\n  <ul>\n    <li>\n      <strong>投诉权<br /></strong>\n      如果您对我们的隐私实践的任何方面有疑虑，您可能有权向您所在司法管辖区的相关监督或监管机构提出投诉。\n    </li>\n  </ul>\n  <p>\n    如果您希望行使上述任何权利或要求复审决定或拒绝，请使用适用的联系信息与我们联系：\n  </p>\n  <ul>\n    <li>\n      如果您在英国、瑞士或欧洲经济区，请填写此表格\n      <a\n        href=\"https://mmc-dev-privacy.my.onetrust.com/webform/4da460d1-7bcf-4ff1-ac37-c4b804769467/draft/ea953d72-fded-42ee-b1dd-c0a5a83b7891\"\n        >(complete this form) </a\n      >\n    </li>\n    <li>\n      对于其他国家/地区的个人，请填写此表格\n      <a\n        href=\"https://privacyportal.onetrust.com/webform/ee9df2bb-0ef3-4485-bc63-4db420e77359/225910f5-5666-468a-b1e7-39c70e24f4cc\"\n        >(complete this form) </a\n      >\n    </li>\n    <li>\n      或者，您可以发送电子邮件至 <a href=\"mailto:privacy@mmc.com\">privacy@mmc.com</a>\n    </li>\n  </ul>\n  <p>\n    根据您所在的国家/地区，您可能还拥有以下部分或全部权利：\n  </p>\n  <ul>\n    <li>\n      <strong\n        >选择加入或退出跨上下文广告销售或共享的权利\n        <br /></strong\n      >如果您访问我们的某个网站，我们可能会向网站分析和广告提供商披露您的互联网或其他电子网络活动信息、个人识别符、地理位置数据和专业信息（在可以从您在我们网站上的活动中获得的范围内），以便利用广告 cookie 进行跨情境行为或定向广告。  根据某些法律，您可能有权选择接受或拒绝此类披露。  要做出选择或查看我们向其出售或共享您的信息的特定第三方的名称，请点击我们网页底部的“管理 Cookie”链接。 如果您不想出售或共享您的信息，请确保将“广告”和“分析”跟踪器的开关设置为“否”，或者在可用的情况下启用“不出售或共享我的个人信息”开关。\n      <p>\n        您还可以实施浏览器设置或扩展程序，以便自动将您的销售和共享偏好传达给您访问的网站。  我们的网站通过识别全球隐私控制（GPC），以顺畅的方式处理此类“选择退出偏好信号” 。 如果您想使用 GPC，您可以通过参与的浏览器或浏览器扩展功能下载并启用它。 有关下载 GPC 的更多信息，请访问 <a href=\"https://globalprivacycontrol.org/\">这里。</a>\n      </p>\n    </li>\n  </ul>\n  <ul>\n    <li>\n      <strong\n        >与自动化决策和分析相关的权利\n        <br /></strong\n      >如果我们对您的个人信息进行自动化处理，我们将提前向您提供法律要求的任何通知，包括有关您的权利的通知。\n    </li>\n  </ul>\n  <ul>\n    <li>\n      <strong>直接营销和“禁止追踪”信号 <br /></strong>在法律允许的情况下，您有权每年一次请求并获得一次有关我们向其他企业披露的用于其自身直接营销目的的个人信息的通知。  如果适用，此类通知将包括已披露的个人信息类别列表（如果有）以及向其披露个人信息的所有第三方的姓名和地址（如果有）。  该通知将涵盖前一日历年。  如果您想了解此权利是否适用于您，并且行使此权利（如适用），您可以按照以下方式与我们联系。\n    </li>\n  </ul>\n  <p>\n    请注意，如果我们拥有优先的合法利益或法律、监管或合同义务来继续处理个人信息，或者根据适用法律个人信息可能免于披露或删除，则其中一些权利可能会受到限制。  其中一些权利只能在特定情况下行使，或者可能受到您所在司法辖区的数据保护法规的限制。\n  </p>\n  <h2>跨境传输   </h2>\n  <p>\n    作为一家业务遍及 80 多个国家的全球性公司，在某些情况下，我们必须将个人信息转移出至收集信息的国家、省或地区以外的区域，以实现本隐私声明中概述的目的。具体来说，我们可能会传输数据以提供和管理向您提供的服务，并提高我们的业务运营效率。 我们将尽一切努力确保这些传输符合所有相关的数据保护法规，并确保个人在这些法律下的权利和自由得到适当保障。\n  </p>\n  <p>\n    如果需要进行此类传输，我们将采取措施确保采取适当的保障措施来保护个人信息，例如影响评估、适当监管机构的充分性决定、使用经批准的具有约束力的公司规则或标准合同条款，或您的同意。\n  </p>\n  <p>\n    有关 MMC 的欧盟 (European Union) 约束性公司规则 (EU BCR) 如何运作的信息，请单击\n    <a\n      href=\"https://www.marshmclennan.com/content/dam/mmc-web/Archive/Images/Files/02March2022-EUBCR-Controller-and-Processor-Principles.pdf\"\n      >这里</a\n    >。如需查看已同意受欧盟 BCR 约束的实体列表，请点击\n    <a href=\"https://www.marshmclennan.com/privacy-statement/bcr-entities.html\"\n      >这里</a\n    >.&nbsp;\n  </p>\n  <p>\n    有关 MMC 英国约束性公司规则 (UK BCR) 如何运作的信息，请点击\n    <a\n      href=\"https://www.marshmclennan.com/content/dam/mmc-web/Archive/Images/Files/02March2022-UKBCR-Controller-and-Processor-Principles.pdf\"\n      >这里</a\n    >。如需查看已同意受英国 BCR 约束的实体列表，请点击\n    <a\n      href=\"https://www.marshmclennan.com/privacy-statement/bcr-entities-uk.html\"\n      >这里</a\n    >.&nbsp;&nbsp;&nbsp;\n  </p>\n  <h2>保留您的信息  </h2>\n  <p>\n    由于我们的产品、服务和监管义务非常复杂，因此我们对个人信息的保留期限各不相同。  在设定个人信息和我们保存的记录的保留期限时，我们会考虑以下义务：\n  </p>\n  <ul>\n    <li>\n      需要保留信息以实现收集信息的业务目的或合同义务；\n    </li>\n    <li>\n      我们有责任执行客户关于我们代表他们处理的个人信息的指示；\n    </li>\n    <li>\n      我们有义务遵守强制性的法律和监管记录保存要求；\n    </li>\n    <li>\n      我们的备份和灾难恢复程序；以及\n    </li>\n    <li>\n      其他法律影响，例如适用的诉讼时效。\n    </li>\n  </ul>\n  <p>\n    基于上述因素，我们可能会在向您提供服务的期限结束后仍保留个人信息。 当我们不再需要保留个人信息时，我们的公司政策要求我们对信息进行去识别化或汇总处理（在这种情况下，我们可能会进一步保留和使用去识别化或汇总的信息用于分析目的）或安全销毁它。\n  </p>\n  <h2>问题或疑虑  </h2>\n  <p>\n    如需提交有关本隐私声明或MTE隐私惯例的问题或请求，请发送电子邮件至 <a href=\"mailto:privacy@mmc.com\">privacy@mmc.com</a> 。如果您希望通过邮寄或电话联系我们，请联系您当地的数据保护官。 您可以通过以下方式联系我们，获取您当地数据保护官的联系信息 privacy@mmc.com\n    <a href=\"mailto:privacy@mmc.com\">privacy@mmc.com</a>。\n  </p>\n</div>"
