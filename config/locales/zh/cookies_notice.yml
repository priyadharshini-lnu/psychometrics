  cookies_notice: |-
    <h2>Cookie 通知</h2>

    <p>生效日期：2023 年 12 月 14 日</p>

    <p>我们在本网站使用 Cookie 和相关跟踪技术，包括网络信标、跟踪像素和日志文件（统称为“Cookie”），以区分您与其他用户、评估和改善本网站的功能及我们的服务，并为您提供良好的体验。</p>

    <p><strong>什么是 Cookie</strong></p>

    <p>Cookie 是网页浏览器和网站之间分享的信息片段。一些 Cookie 是网站运行所必需的。一些能帮助我们评估和改进网站的性能。我们还使用 Cookie 来帮助向您提供相关内容、产品和服务。Cookie 无法读取电脑硬盘驱动器上的数据。</p>

    <p><strong>存在不同种类的 Cookie，它们具有不同的功能：</strong></p>

    <p>(i) <strong>会话 Cookie：</strong>这些 Cookie 只在您的网络会话期间才存储在您的电脑上。它们会在浏览器关闭时自动删除。通常存储一个匿名会话 ID，使您能够浏览网站而不必登录每个页面。不会从您的电脑收集任何信息。</p>

    <p>(ii) <strong>持久性 Cookie：</strong>这些 Cookie 以文件形式存储在电脑上，并在关闭浏览器后仍然存在。网站在您再次访问时可以读取这些 Cookie。</p>

    <p>(iii) <strong>第一方 Cookie：</strong>这些 Cookie 由我们公司创建。它们在我们的服务器和您的电脑之间存储和传输。可能是会话 Cookie 或持久性 Cookie。</p>

    <p>(iv) <strong>第三方 Cookie：</strong>这些 Cookie 由我们的第三方合作伙伴创建。在第三方服务器和您的电脑之间存储和传输，通常是持久性 Cookie。</p>

    <p><strong>我们如何及为何使用 Cookie</strong></p>

    <p>根据网站不同，我们可能将 Cookie 用于以下目的：</p>

    <p><strong>在绝对必要的情况下</strong></p>

    <p>这些 Cookie 对于在网站中导航和使用其功能（如访问安全区域）是必不可少的。没有这些 Cookie，将无法提供您要求的服务，例如获取报价或登录帐户。这些 Cookie 不会收集用于营销或跟踪您在互联网上位置的信息。</p>

    <p><strong>功能</strong></p>

    <p>这些 Cookie 允许网站记住您的选择（如用户名、语言或地区）并提供增强功能。例如：记住登录信息以避免重复登录；记住文字大小、字体或页面布局的更改；提供您请求的服务，如观看视频或评论文章。收集的信息通常经过匿名化，不用于广告或跟踪您的上网行为。</p>

    <p><strong>分析</strong></p>

    <p>这些 Cookie 收集访问者如何使用网站的信息，例如最常访问的页面或错误信息。帮助记录和统计访问者数量，以改进网站运行。</p>

    <p><strong>广告</strong></p>

    <p>这些 Cookie 用于显示与您相关的广告，并管理广告效果。广告 Cookie 通常是第三方 Cookie，即使网站上没有广告，也可能存在。</p>

    <p><strong>IP 地址</strong></p>

    <p>访问网站时，我们可能收集您的 IP 地址，用于跟踪和汇总非个人信息。例如，用于监控用户访问的地区。</p>

    <p><strong>如何管理 Cookie</strong></p>

    <p>点击页面底部的“管理 Cookie”链接，通过 Cookie 同意管理器选择启用或退出部分 Cookie。绝对必要的 Cookie 无法禁用，因此仅使用此类 Cookie 的网站可能不提供此链接。</p>

    <p>您也可以通过浏览器设置禁用某些 Cookie，具体请参考浏览器“帮助”部分。</p>

    <p><strong>Cookie 通知不适用于第三方网站</strong></p>

    <p>如果包含指向其他网站的链接，请注意它们有各自的隐私和 Cookie 政策，管理您提供的信息。我们建议您阅读它们的政策，我们不对其隐私行为负责。</p>

    <p><strong>对 Cookie 通知的更改</strong></p>

    <p>本政策可能不时更新，请您定期查看以了解我们的 Cookie 使用方式。生效日期显示在页面顶部。</p>

    <p><strong>所使用 Cookie 的说明</strong></p>

    <p>点击网站页脚的“管理 Cookie”链接，查看单个 Cookie 的详细信息。某些情况下此链接可能不可用，例如仅使用绝对必要 Cookie。</p>

    <p><strong>联系我们</strong></p>

    <p>如对本 Cookie 通知有任何疑问，请按照隐私声明中的联系方式联系我们。</p>
