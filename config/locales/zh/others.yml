      campaign_start_final_instructions: |-
        <p>
          请注意，计时器无法停止或暂停。即使你关闭了浏览器，计时器也会继续运作，因此你不应该在任务期间离开去做其他事情。请确保在任务期间尽量不要分心。找一个安静的环境，关闭你设备上的通知，不要同时处理其他事情。集中精神并保持专注。计时器计时结束后，你将无法继续。如果你已经阅读了上述说明，请点击“开始”继续已分配的任务。
        </p>
      campaign_start_instruction: |-
        <h4>请认真阅读以下说明。</h4>
        <p>
          你即将开始的任务是计时任务。点击“开始”后，计时器将自动开始。你有 %{minutes} 分钟来完成所有活动。请在指定的时间内完成任务，并有效管理时间，避免匆忙完成评估流程。务必一次完成任务，如果需要休息，请在开始前休息。
        </p>
      common_proctoring_instructions: |-
        <h4>监督</h4><p>
        点击“开始”按钮后，你将被定向到我们的监察系统。它将在会话期间监控你的摄像头、麦克风和屏幕。这些会话由我们先进的人工智能系统自动监督，提供不间断且顺畅的用户体验。不过，会话也可能由人工监督员审查。任何不当行为或违规行为的迹象都将被标记。这样做是为了确保不发生作弊。如果发现可疑情况，你的任务将被取消。
        </p>
      lockdown_browser_instruction: |-
        <h4>正在监督浏览器</h4><p>
          你将需要下载并安装一款特殊的浏览器来完成受监督的任务。请按照下一个画面中的说明操作。你可以在完成所有必需的活动后卸载此浏览器。
        </p>
