            title: 进展
        chart:
          collaboration: "<strong>20%</strong>协作式<br />学习"
          job: "<strong>70%</strong>在职<br />学习"
          learn: "<strong>10%</strong>正式学习"
        content:
          list:
            r1: 请注意，此列表仅供参考，根据个人职业规划、主管建议以及组织业务优先级，您可能还有其他发展路径可供选择。
            r2: 鼓励用户对所有内容进行批判性审查，并可自由修改、完善、替换或补充任何不同意的行动或建议。
            r3: 本报告所包含的发展投入可能来源于以下一个或两个来源：
            r3a: 专为贵组织定制的开发库
            r3b: 人工智能生成的开发建议
            r4: 本IDP报告是在人工智能技术的辅助下生成的，可能存在不准确之处。报告中提供的见解和建议应谨慎解读，仅作为您个人和职业发展的参考工具。本报告的有效期为12至18个月。
          main: 该《个人发展计划》包含一份详细的发展行动清单，供您实施。其中遵循最佳实践学习原则——即70-20-10指导方针，通过课堂学习、辅导指导和在职学习相结合的方式，构建渐进式发展路径。基于评估中心流程结果、您的对话反馈及外部报告（如适用），现已推荐若干潜在发展路径，可供您规划个人发展时参考。
        learn_cards:
          collaboration:
            list:
            - 提供给他人指导或导师服务
            - 请求领域专家作为你的导师
            - 获得一位教练支持你的发展
            - 建立一个协作工作组，讨论业务中的持续挑战
            - 从他人那里正式和非正式地获取反馈
            - 在行业协会和网络中发挥积极作用
            - 建立自己的外部网络
            title: 协作学习(20%)<br/>通过他人发展
          job:
            list:
            - 在利益相关者或管理委员会中担任领导职位
            - 自愿领导组织的变革管理项目
            - 考虑承担有挑战性的任务
            - 与其他职能部门跨部门协作
            - 考虑领导组织外的项目
            - 与外部行业专家在联合项目上密切合作
            title: 在职学习(70%)<br/>通过经验发展
          learn:
            list:
            - 参加结构化培训项目
            - 完成在线电子学习课程
            - 阅读书籍、文章、出版物
            - 获取专业资格、认证及资质认证
            - 参加课程、工作坊、研讨会
            title: 正式学习(10%)<br/>通过结构化学习发展
        title: 国际驾驶许可证指南
