    insights_reports: Uvidi i izvješća
    instruction_modal:
      campaign_start_final_instructions: "<p>Imajte na umu da ne postoji način za zaustavljanje ili pauziranje mjerača vremena. Mjerač vremena kampanje nastavit će raditi čak i kada zatvorite preglednik, stoga ni u kojem trenutku ne biste trebali razmišljati o tome da prekinete zadatke između kako biste radili nešto drugo. Obavezno smanjite ometanja tijekom zadataka. Pronađite mirno okruženje, isključite obavijesti na svojim uređajima i izbjegavajte multitasking. Održavajte koncentraciju i ostanite fokusirani. Nakon što mjerač vremena kampanje istekne, nećete moći nastaviti. Ako ste pročitali gornje upute, kliknite na početak kako biste nastavili s dodijeljenim zadacima.</p>\n"
      campaign_start_instruction: "<h4>Molimo Vas da pažljivo pročitate sljedeće upute.</h4><p> Zadatak(ci) koje ćete započeti imaju vremenski ograničeno vrijeme. Nakon što kliknete na &quot;Pokreni&quot;, mjerač vremena kampanje automatski će se pokrenuti. Imate %{minutes} minuta za dovršetak svih aktivnosti. Molimo vas da nastojite dovršiti zadatke unutar zadanog vremenskog okvira i učinkovito upravljate vremenom kako biste izbjegli žurbu kroz proces evaluacije. Obavezno dovršite zadatke odjednom, pa ako trebate napraviti pauzu, sada je pravo vrijeme.</p>\n"
      common_proctoring_instructions: "<h4>Nadzor</h4><p> Klikom na gumb Start bit ćete preusmjereni na naš sustav nadzora. On će nadzirati vašu kameru, mikrofon i zaslon tijekom vaše sesije. Ove sesije automatski nadgleda naš sofisticirani AI sustav, pružajući neprekinuto i glatko korisničko iskustvo. Međutim, sesije mogu pregledavati i ljudski nadzornici. Svi znakovi nedoličnog ponašanja ili nepravilnosti bit će označeni. To se radi kako bi se osiguralo da nema pokušaja varanja. Ako se utvrdi sumnja, vaš(i) zadatak(i) bit će otkazani.</p>\n"
      lockdown_browser_instruction: "<h4>Preglednik za nadzor</h4><p> Morat ćete preuzeti i instalirati poseban preglednik kako biste dovršili nadzirane zadatke. Slijedite upute na sljedećem zaslonu. Možete ga deinstalirati nakon što dovršite sve potrebne aktivnosti.</p>\n"
