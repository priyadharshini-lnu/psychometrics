      guidelines:
        cards:
          c1:
            content: Uključite vještine, znanja i sposobnosti koje je potrebno razviti. Osigurajte da su specifični, mjerljivi, ostvarivi, realistični i razumno se mogu postići u navedenim rokovima.
            title: Razvojni ciljevi
          c2:
            content: To se temelji na kompetenciji koju treba razviti na temelju iskustva ocjenjivanja.
            title: Sposobnosti
          c3:
            content: Ovaj odjeljak uključuje vaše razvojne radnje na temelju modela učenja 70-20-10 navedenog u nastavku. Savjetuje se da odaberete kombinaciju svakog od tri elementa kako biste osigurali raznolik pristup učenju i razvoju.
            title: Aktivnost
          c4:
            content: Osigurajte da su vaši vremenski okviri realni na temelju toga kada se cilj može ispuniti. Izmijenite ovo po potrebi.
            title: Vremenska crta
          c5:
            content: Upotrijebite odjeljak napretka za podršku napredovanju na identificiranim stazama.
            title: Napredak
        chart:
          collaboration: "<strong>20%</strong>Suradničke <br /> Učenje"
          job: "<strong>70%</strong>Učenje <br />na poslu"
          learn: "<strong>10%</strong>Formalno učenje"
        content:
          list:
            r1: Imajte na umu da je ovaj popis samo indikativan te da se za vas mogu razmotriti dodatne razvojne staze na temelju vaših individualnih aspiracija, preporuka vašeg menadžera i poslovnih prioriteta organizacije.
            r2: Korisnici se potiču da kritički pregledaju sav sadržaj te su slobodni mijenjati, usavršavati, zamijeniti ili dodati bilo koje radnje ili preporuke s kojima se ne slažu.
            r3: 'Ulazi za razvoj uključeni u ovaj izvještaj mogu biti izvedeni iz jednog ili oba sljedeća izvora:'
            r3a: Prilagođena razvojna biblioteka stvorena za vašu organizaciju
            r3b: Prijedlozi za razvoj generirani umjetnom inteligencijom
            r4: Ovo IDP izvješće generirano je uz pomoć AI tehnologije i može sadržavati netočnosti. Dobivene uvide i preporuke treba tumačiti s razboritošću i koristiti isključivo kao alat za vaš osobni i profesionalni razvoj. Izvješće je važeće u razdoblju od 12 do 18 mjeseci.
          main: IDP koji je izrađen uključuje detaljan popis razvojnih aktivnosti koje možete poduzeti, imajući na umu najbolje prakse učenja, tj. smjernicu 70-20-10, koja pruža progresivno putovanje kombinirajući učenje u učionici, coaching i učenje na radnom mjestu. Na temelju rezultata procesa centra za procjenu, vaših odgovora tijekom razgovora i vanjskih izvještaja, gdje je primjenjivo, preporučene su moguće razvojne staze koje se mogu razmotriti za vaš razvoj.
        learn_cards:
          collaboration:
            list:
            - Ponudite mentorstvo ili podučavanje drugima
            - Zatražite mentorstvo od stručnjaka u svom području
            - Pronađite mentora za podršku svom razvoju
            - Organizirajte suradničku radnu grupu za raspravu o izazovima u poslovanju
            - Dobijte povratne informacije formalno i neformalno od drugih
            - Aktivno sudjelujte u industrijskim udrugama i mrežama
            - Izgradite vlastite vanjske mreže
            title: Suradničko učenje (20%) <br/> Razvoj pomoću drugih
          job:
            list:
            - Preuzmite liderske pozicije u odborima ili upravljačkim tijelima
            - Volontirajte za vođenje projekata upravljanja promjenama u organizaciji
            - Razmotrite preuzimanje zahtjevnijih zadataka
            - Radite međufunkcionalno s drugim odjelima
            - Razmotrite vođenje projekata izvan vaše organizacije
            - Tijesno surađujte s vanjskim stručnjacima na zajedničkim projektima
            title: Učenje na poslu (70%) <br/> Razvoj kroz iskustvo
          learn:
            list:
            - Pohađajte strukturirane programe obuke
            - Završite online e-learning tečajeve
            - Čitaj knjige, članke, publikacije
            - Steknite profesionalne kvalifikacije, certifikate i akreditacije
            - Pohađajte tečajeve, radionice, seminare
            title: Formalno učenje (10%) <br/> Razvoj kroz strukturirano učenje
