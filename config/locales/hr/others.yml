    insights_reports: Uvidi i izvješća
    instruction_modal:
      campaign_start_final_instructions: '<p>Imajte na umu da ne postoji način za zaustavljanje ili pauziranje mjerača vremena. Mjerač vremena kampanje nastavit će raditi čak i kada zatvorite preglednik, stoga ni u kojem trenutku ne biste trebali prekidati zadatke kako biste napravili nešto drugo. Umanjite ometanja tijekom zadataka. Pronađite mirno okruženje, isključite obavijesti na svojim elektroničkim uređajima i izbjegavajte multitasking. Održavajte koncentraciju i ostanite fokusirani. Nakon što vrijeme kampanje istekne, nećete moći nastaviti. Ako ste pročitali gornje upute, kliknite na "Pokrenuti" kako biste nastavili s dodijeljenim zadacima.</p>

        '
      campaign_start_instruction: '<h4>Molimo Vas da pažljivo pročitate sljedeće upute.</h4><p> Zadatak(ci) koje ćete započeti su vremenski ograničeni. Nakon što kliknete na "Pokrenuti" mjerač vremena kampanje automatski će se pokrenuti. Imate %{minutes} minuta za dovršetak svih aktivnosti. Molimo, nastojte dovršiti zadatke unutar zadanog vremenskog okvira i učinkovito upravljate svojim vremenom kako biste izbjegli žurbu kroz proces. Obavezno dovršite zadatke bez prekidanja, pa ako trebate pauzu, sada je pravo vrijeme za nju.</p>

        '
      common_proctoring_instructions: '<h4>Nadzor</h4><p> Klikom na gumb "Pokrenuti" bit ćete preusmjereni na naš nadzorni sustav. On će nadzirati vašu kameru, mikrofon i zaslon tijekom ove sesije koju automatski nadgleda naš sofisticirani AI sustav, pružajući neprekinuto i ugodno korisničko iskustvo. Međutim, sesije mogu pregledavati i ljudi. Svi znakovi nedoličnog ponašanja ili nepravilnosti bit će označeni. To se radi kako bi se osiguralo da nema pokušaja varanja. Ako se utvrdi sumnja u (pokušaj) varanja, vaš(i) zadatak(ci) će biti prekinuti.</p>

        '
      lockdown_browser_instruction: "<h4>Preglednik za nadzor</h4><p> Morat ćete preuzeti i instalirati poseban preglednik kako biste dovršili nadzirane zadatke. Slijedite upute na sljedećem zaslonu. Možete ga deinstalirati nakon što dovršite sve potrebne aktivnosti.</p>\n"
