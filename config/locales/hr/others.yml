      guidelines:
        cards:
          c1:
            content: Uključite vještine, znanja i sposobnosti koje treba razviti. Pobrinite se da budu specifične, mjerljive, ostvarive, realne i moguće za ostvariti u navedenim rokovima.
            title: Razvojni ciljevi
          c2:
            content: Ovo se temelji na kompetenciji koju treba razviti na temelju iskustva procjene.
            title: Kompetencija
          c3:
            content: Ovaj odjeljak uključuje vaše razvojne akcije temeljene na modelu učenja 70-20-10 navedenom u nastavku. Preporučuje se odabrati kombinaciju sva tri elementa za raznolik pristup učenju i razvoju.
            title: Aktivnost
          c4:
            content: Pobrinite se da su vaši rokovi realni na temelju kada se cilj može dovršiti. Prilagodite ih po potrebi.
            title: Rok
          c5:
            content: Koristite odjeljak napretka za praćenje napretka na odabranim stazama.
            title: Napredak
        chart:
          collaboration: "<strong>20%</strong>Saradničko <br /> učenje"
          job: "<strong>70%</strong>Učenje <br />na poslu"
          learn: "<strong>10%</strong>Formalno učenje"
        content:
          list:
            r1: Imajte na umu da je ovaj popis samo indikativan, a dodatni razvojni putevi mogu biti razmotreni za vas na temelju individualnih aspiracija, preporuka vašeg menadžera kao i poslovnih prioriteta organizacije.
            r2: Imajte na umu da će pokretanje nekih od ovih razvojnih puteva ovisiti o strategiji obrazovanja i učenja na razini organizacije.
            r3: Prilikom izrade svog Individualnog razvojnog plana, razmotrite preporučene puteve označene u nastavku.
          main: Ovaj odjeljak uključuje kumulativni popis svih razvojnih puteva, imajući na umu najbolje prakse učenja tj. smjernicu 70-20-10, koja pruža progresivno putovanje kombinirajući učenje u učionici, mentorstvo i učenje na poslu. Na temelju rezultata iz iskustva razvoja liderstva i poslovnih prioriteta, preporučeni su mogući razvojni putevi koje možete razmotriti za svoj razvoj.
        learn_cards:
          collaboration:
            list:
            - Ponudite mentorstvo ili podučavanje drugima
            - Zatražite mentorstvo od stručnjaka u svom području
            - Pronađite mentora za podršku svom razvoju
            - Organizirajte suradničku radnu grupu za raspravu o izazovima u poslovanju
            - Dobijte povratne informacije formalno i neformalno od drugih
            - Aktivno sudjelujte u industrijskim udrugama i mrežama
            - Izgradite vlastite vanjske mreže
            title: Saradničko učenje (20%) <br/> Razvoj kroz druge
          job:
            list:
            - Preuzmite liderske pozicije u odborima ili upravljačkim tijelima
            - Volontirajte za vođenje projekata upravljanja promjenama u organizaciji
            - Razmotrite preuzimanje zahtjevnijih zadataka
            - Radite međufunkcionalno s drugim odjelima
            - Razmotrite vođenje projekata izvan vaše organizacije
            - Tijesno surađujte s vanjskim stručnjacima na zajedničkim projektima
            title: Učenje na poslu (70%) <br/> Razvoj kroz iskustvo
          learn:
            list:
            - Preuzmite liderske pozicije u odborima ili upravljačkim tijelima
            - Volontirajte za vođenje projekata upravljanja promjenama u organizaciji
            - Razmotrite preuzimanje zahtjevnijih zadataka
