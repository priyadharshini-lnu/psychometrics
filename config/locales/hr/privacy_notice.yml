        <h2>ČUVANJE VAŠIH PODATAKA  </h2>
        <p>
          Naši proizvodi, usluge i regulatorne obveze su složeni te se stoga naši rokovi čuvanja osobnih podataka razlikuju. Prilikom određivanja rokova čuvanja osobnih podataka i zapisa koje čuvamo uzimamo u obzir sljedeće obveze:
        </p>
        <ul>
          <li>
            potreba zadržavanja informacija radi ispunjenja poslovnih svrha ili ugovornih obveza za koje su prikupljene;
          </li>
          <li>
            naše dužnosti izvršavanja uputa naših klijenata u vezi s osobnim podacima koje obrađujemo u njihovo ime;
          </li>
          <li>
            naše dužnosti da se pridržavamo obveznih zakonskih i regulatornih zahtjeva za vođenje evidencije;
          </li>
          <li>
            naše postupke za sigurnosno kopiranje i oporavak od katastrofe; i
          </li>
          <li>
            druge pravne posljedice kao što su primjenjivi rokovi zastare.
          </li>
        </ul>
        <p>
          Na temelju gore navedenih čimbenika, možemo zadržati osobne podatke i dulje od razdoblja u kojem vam pružamo usluge. Kada više ne trebamo čuvati osobne podatke, politike naše tvrtke zahtijevaju da ih anonimiziramo ili agregiramo (u tom slučaju možemo dalje zadržati i koristiti anonimizirane ili agregirane podatke u analitičke svrhe) ili ih sigurno uništiti.
        </p>
