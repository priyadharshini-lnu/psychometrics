        </p>
        <h2>KORACI KOJE PODUZIMAMO ZA ZAŠTITU OSOBNIH PODATAKA </h2>
        <p>
          Naša tvrtka nastoji se pridržavati svih primjenjivih zakona o kibernetičkoj sigurnosti i zaštiti podataka. Imajući te ciljeve na umu, MMC ima namjenskog glavnog službenika za sigurnost informacija (CISO). i globalnog glavnog službenika za privatnost (GCPO). CISO je odgovoran za upravljanje globalnim timom za informacijsku sigurnost i sveobuhvatnim programom kibernetičke sigurnosti. Kao dio našeg programa kibernetičke sigurnosti, implementirali smo komercijalno razumne fizičke, administrativne i tehničke zaštitne mjere kako bismo zaštitili osobne podatke od neovlaštenog pristupa, korištenja, izmjene i brisanja.
        </p>
        <p>
          GCPO vodi i nadgleda Centar izvrsnosti za privatnost i Mrežu službenika za zaštitu podataka odgovornih za provedbu našeg sveobuhvatnog globalnog programa privatnosti. Mreža službenika za zaštitu podataka povezuje naše službenike za zaštitu podataka diljem svijeta i nastoji dosljedno i temeljito provoditi naš program privatnosti gdje god obrađujemo podatke. Ime i kontakt podatke službenika za zaštitu podataka u vašoj jurisdikciji možete dobiti kontaktiranjem nas na <a href="mailto:privacy@mmc.com">privacy@mmc.com</a>.
        </p>
        <h2>VAŠA PRAVA NA ZAŠTITU PODATAKA</h2>
        <p>
          U mnogim slučajevima obrađujemo osobne podatke kako bismo pružili usluge korporativnim klijentima, a vi biste ih trebali kontaktirati kako biste ostvarili sva prava koja imate prema važećim zakonima o privatnosti. Međutim, tamo gdje djelujemo kao kontrolor ili tvrtka koja je primarno odgovorna za odlučivanje o načinu obrade vaših podataka, možete imati neka ili sva prava navedena u nastavku , ovisno o jurisdikciji i našem razlogu za obradu vaših podataka . Imajte na umu da ćemo možda morati upotrijebiti vaše osobne podatke kako bismo provjerili vaš identitet prije nego što odgovorimo na bilo koje od dolje navedenih prava.
        </p>
        <ul>
          <li>
            <strong>Pravo pristupa (Pravo na znanje) <br /></strong>
            Možete nas zamoliti da vam pružimo dodatne detalje o tome kako koristimo vaše osobne podatke, izvore, kategorije ili određene dijelove osobnih podataka koje smo prikupili, kategorije trećih strana kojima smo otkrili podatke te da zatražite kopiju osobnih podataka koje imamo o vama.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Pravo na ispravak <br /></strong>
            Možete nas zamoliti da ažuriramo sve netočnosti u osobnim podacima koje posjedujemo. Ako otkrijemo vaše osobne podatke drugima, obavijestit ćemo ih o ispravku gdje je to moguće.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Pravo na brisanje <br /></strong>
            Možete nas zamoliti da izbrišemo vaše osobne podatke ako više nemamo zakonitu osnovu za njihovu obradu.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Pravo na prigovor ili ograničenje obrade <br /></strong>
            Možda imate pravo ograničiti obradu svojih osobnih podataka u određenim okolnostima, na primjer kada osporavate njihovu točnost.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Pravo na prenosivost podataka <br /></strong>
            Imate pravo, gdje je to tehnički izvedivo, zatražiti da trećoj strani po vašem izboru prenesemo kopiju osobnih podataka koje smo od vas dobili, u strukturiranom, uobičajeno korištenom i strojno čitljivom formatu.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Pravo na povlačenje privole <br /></strong>
            Ako se oslanjamo na Vašu privolu kao našu pravnu osnovu za obradu Vaših Osobnih podataka, imate pravo povući tu privolu.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Pravo na podnošenje pritužbe<br /></strong>
            Imate pravo podnijeti pritužbu nadležnom nadzornom ili regulatornom tijelu u vašoj jurisdikciji ako imate nedoumica u vezi s bilo kojim aspektom naših praksi zaštite privatnosti.
          </li>
        </ul>
        <p>
          Ako želite ostvariti bilo koje od gore navedenih prava ili zatražiti preispitivanje odluke ili odbijanja, molimo da nas kontaktirate koristeći odgovarajuće kontaktne podatke:
        </p>
        <ul>
          <li>
            Ako se nalazite u Ujedinjenom Kraljevstvu, Švicarskoj ili Europskom gospodarskom prostoru,
            <a
              href="https://mmc-dev-privacy.my.onetrust.com/webform/4da460d1-7bcf-4ff1-ac37-c4b804769467/draft/ea953d72-fded-42ee-b1dd-c0a5a83b7891"
              >molimo ispunite ovaj obrazac</a
            >
          </li>
          <li>
            Za pojedince u drugim zemljama,
            <a
              href="https://privacyportal.onetrust.com/webform/ee9df2bb-0ef3-4485-bc63-4db420e77359/225910f5-5666-468a-b1e7-39c70e24f4cc"
              >molimo ispunite ovaj obrazac</a
            >
          </li>
          <li>
            Alternativno, možete nam poslati e-poštu na <a href="mailto:privacy@mmc.com">privacy@mmc.com</a>
          </li>
        </ul>
        <p>
          Ovisno o vašoj zemlji, možete imati i neka ili sva sljedeća prava:
        </p>
        <ul>
          <li>
            <strong>
              Pravo na uključivanje ili isključivanje iz prodaje ili dijeljenja za međukontekstno oglašavanje
              <br />
            </strong>
            Ako posjetite jednu od naših web stranica, možemo otkriti vaše podatke o internetskoj ili drugoj elektroničkoj mrežnoj aktivnosti, biografske identifikatore, podatke o geolokaciji i profesionalne podatke (u mjeri u kojoj se mogu izvesti iz vaše aktivnosti na našoj web stranici) pružateljima analitike i oglašavanja web stranica u svrhu međukontekstnog bihevioralnog ili ciljanog oglašavanja korištenjem oglašivačkih kolačića. Prema nekim zakonima, možda imate pravo uključiti se ili isključiti ove vrste otkrivanja. Da biste izvršili svoj odabir ili vidjeli imena određenih trećih strana s kojima smo prodali ili podijelili vaše podatke, kliknite na vezu "Upravljanje kolačićima" pri dnu naše web stranice. Ako želite isključiti prodaju ili dijeljenje svojih podataka, provjerite jesu li prekidači za alate za praćenje "Oglašavanje" i "Analitika" postavljeni na "Ne" ili, gdje je dostupno, omogućite prekidač "Ne prodajte ili ne dijelite moje osobne podatke".
            <p>
              Također možete implementirati postavku preglednika ili proširenje kako biste automatski komunicirali svoje postavke prodaje i dijeljenja web-mjestima koja posjećujete. Naše web-stranice obrađuju takve „signale o preferencijama isključivanja“ na besprijekoran način prepoznavanjem Globalne kontrole privatnosti (GPC). Ako želite koristiti GPC, možete ga preuzeti i omogućiti putem preglednika ili proširenja preglednika koji sudjeluje u programu. Više informacija o preuzimanju GPC-a dostupno je <a href="https://globalprivacycontrol.org/">ovdje</a>.&nbsp;
            </p>
          </li>
        </ul>
        <ul>
          <li>
            <strong>
              Prava u vezi s automatiziranim donošenjem odluka i profiliranjem
            <br /></strong>
            U mjeri u kojoj se bavimo automatskom obradom vaših osobnih podataka, unaprijed ćemo vam dostaviti sve obavijesti, uključujući i one koje se odnose na vaša prava, koje su propisane zakonom.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Izravni marketing i signali zabrane praćenja <br /></strong>
            Možda imate pravo zatražiti i dobiti obavijest jednom godišnje o osobnim podacima koje smo otkrili drugim tvrtkama u svrhu njihovog izravnog marketinga, gdje je to dopušteno zakonom. Ako je primjenjivo, takva obavijest uključivat će popis kategorija osobnih podataka koji su otkriveni (ako ih ima) te imena i adrese svih trećih strana kojima su osobni podaci otkriveni (ako ih ima). Obavijest će obuhvaćati prethodnu kalendarsku godinu. Možete nas kontaktirati na dolje navedene načine ako želite saznati odnosi li se ovo pravo na vas i, ako da, iskoristiti ga.
          </li>
        </ul>
        <p>
          Imajte na umu da neka od ovih prava mogu biti ograničena tamo gdje imamo prevladavajući legitimni interes ili zakonsku, regulatornu ili ugovornu obvezu da nastavimo obrađivati Osobne podatke ili tamo gdje Osobni podaci mogu biti izuzeti od otkrivanja ili brisanja prema važećem zakonu. Neka od ovih prava mogu se ostvariti samo u određenim okolnostima ili mogu biti ograničena zakonodavstvom o zaštiti podataka u vašoj jurisdikciji.
        </p>
        <h2>PREKOGRANIČNI PRIJENOSI</h2>
        <p>
          Kao globalna tvrtka koja posluje u više od 80 zemalja, postoje okolnosti u kojima ćemo morati prenijeti osobne podatke izvan zemlje, pokrajine ili teritorija u kojem su prikupljeni u svrhe navedene u ovoj Obavijesti o privatnosti. Konkretno, možemo prenijeti podatke kako bismo vam ponudili, administrirali i upravljali Uslugama koje vam pružamo te kako bismo poboljšali učinkovitost našeg poslovanja. Uložit ćemo sve napore kako bismo osigurali da se ti prijenosi pridržavaju svih relevantnih zakona o zaštiti podataka te da su prava i slobode pojedinaca prema takvim zakonima na odgovarajući način zaštićene.
        </p>
        <p>
          Tamo gdje se ukaže potreba za takvim prijenosom, poduzet ćemo korake kako bismo osigurali da postoje odgovarajuće zaštitne mjere za zaštitu Osobnih podataka, kao što su procjena utjecaja, odluka o primjerenosti od strane nadležnog nadzornog tijela, korištenje odobrenih obvezujućih korporativnih pravila ili standardnih ugovornih klauzula ili vaš pristanak.
