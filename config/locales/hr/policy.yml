      Verzija 4.0

      Ažurirano: 29. svibnja 2025.

      Kako bismo osigurali vaše smisleno sudjelovanje u ovoj aktivnosti, prikupljat će se i obrađivati ​​neki od vaših osobnih podataka.
      Aktivnost provodi Mercer Talent Enterprise u ime i po uputama našeg klijenta, koji određuje svrhu obrade vaših osobnih podataka i kako ih možemo koristiti. Imajte na umu da se vaši podaci mogu prenositi preko nacionalnih granica kao dio Usluga koje se pružaju našim klijentima. U takvom slučaju, mi djelujemo kao Uvoznik podataka, a naš klijent kao Izvoznik podataka. Svaki međunarodni prijenos osobnih podataka bit će proveden u skladu s važećim zakonima o zaštiti podataka.

      Za više informacija o tome kako obrađujemo vaše osobne podatke, kliknite ovdje kako biste pročitali našu globalnu obavijest o privatnosti: [GLOBAL_PRIVACY_LINK]

      Za informacije o tome kako naš klijent obrađuje vaše osobne podatke, pročitajte njihovu obavijest o privatnosti: [CLIENT_PRIVACY_LINK]
