      Verzija 4.0

      Ažurirano: 29. svibnja 2025.

      Kako bismo osigurali da smisleno sudjelujete u ovoj aktivnosti, prikupljat će se i obrađivati ​​neki od Vaših osobnih podataka.
      Aktivnost provodi Mercer Talent Enterprise u ime i po uputama našeg klijenta, koji određuje svrhu obrade Vaših osobnih podataka i kako ih možemo koristiti. Imajte na umu da se Vaši podaci mogu prenositi preko državnih granica kao dio Usluga koje se pružaju našim klijentima. U takvom slučaju, mi djelujemo kao Uvoznik podataka, a naš klijent kao Izvoznik podataka. Svaki internacionalni prijenos osobnih podataka bit će proveden u skladu s važećim zakonima o zaštiti podataka.

      Za više informacija o tome kako obrađujemo Vaše osobne podatke, kliknite ovdje kako biste pročitali našu globalnu Izjavu o privatnosti: [GLOBAL_PRIVACY_LINK]

      Za informacije o tome kako naš klijent obrađuje Vaše osobne podatke, pročitajte njihovu Obavijest o privatnosti: [CLIENT_PRIVACY_LINK]
