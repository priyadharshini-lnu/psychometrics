    <h2>Obavijest o kolačićima</h2>

    <p><strong>Datum stupanja na snagu:</strong> 14. prosinca 2023.</p>

    <p>
    Na ovoj web stranici koristimo kolačiće i povezane tehnologije praćenja, uključujući web
    svjetionike, piksele za praćenje i datoteke zapisnika (zajednički naziv „kolačići“),
    kako bismo vas razlikovali od drugih korisnika, procijenili i poboljšali funkcionalnost
    web stranice i naših usluga te vam pružili bolje korisničko iskustvo.
    </p>

    <p><strong>ŠTO JE KOLAČIĆ</strong></p>

    <p>
    Kolačići su dijelovi informacija koji se razmjenjuju između vašeg web preglednika i
    web stranice. Neki kolačići su potrebni kako bi web stranica pravilno radila. Neki
    nam pomažu procijeniti i poboljšati njezinu učinkovitost. Također koristimo kolačiće
    kako bismo vam pružili relevantan sadržaj, proizvode i usluge. Kolačić ne može čitati
    podatke s tvrdog diska vašeg računala.
    </p>

    <p>Postoje različite vrste kolačića s različitim funkcijama:</p>

    <p>
    (i) <strong>Kolačići sesije:</strong> ovi kolačići pohranjuju se na vašem računalu
    samo tijekom vaše sesije pregledavanja. Automatski se brišu kada se preglednik
    zatvori. Obično pohranjuju anonimni ID sesije koji vam omogućuje pregledavanje
    web stranice bez potrebe za prijavom na svakoj stranici. Ne prikupljaju nikakve
    informacije s vašeg računala.
    </p>

    <p>
    (ii) <strong>Trajni kolačići:</strong> ovi kolačići pohranjuju se kao datoteka
    na vašem računalu i ostaju tamo kada zatvorite web preglednik. Web stranica koja
    ih je stvorila može ih pročitati kada ponovno posjetite web stranicu.
    </p>

    <p>
    (iii) <strong>Kolačići prve strane:</strong> ove kolačiće stvara naša tvrtka.
    Pohranjuju se i šalju između naših poslužitelja i tvrdog diska vašeg računala.
    Ovi kolačići mogu biti kolačići sesije ili trajni kolačići.
    </p>

    <p>
    (iv) <strong>Kolačići treće strane:</strong> ove kolačiće stvara jedan od naših
    partnera treće strane. Pohranjuju se i šalju između poslužitelja treće strane
    i tvrdog diska vašeg računala. Ovi kolačići su obično trajni kolačići.
    </p>

    <p><strong>KAKO I ZAŠTO KORISTIMO KOLAČIĆE</strong></p>

    <p>Ovisno o web stranici, kolačiće možemo koristiti u sljedeće svrhe:</p>

    <p><strong>Strogo nužni</strong></p>

    <p>
    Ovi kolačići su nužni kako bi vam omogućili kretanje po web stranici i korištenje
    njezinih značajki, poput pristupa sigurnim dijelovima web stranice. Bez ovih
    kolačića usluge koje ste zatražili, poput dobivanja ponude ili prijave na vaš
    račun, ne mogu biti pružene. Ovi kolačići ne prikupljaju informacije o vama
    koje bi se mogle koristiti u marketinške svrhe.
    </p>

    <p><strong>Funkcionalnost</strong></p>

    <p>
    Ovi kolačići omogućuju našoj web stranici da zapamti vaše izbore (poput
    korisničkog imena, jezika ili regije u kojoj se nalazite) i pruža poboljšane
    funkcionalnosti. Na primjer, web stranica može zapamtiti vaše podatke za
    prijavu kako se ne biste morali ponovno prijavljivati svaki put kada
    koristite određeni uređaj za pristup našoj web stranici.
    </p>

    <p>
    Ovi kolačići također se mogu koristiti za pamćenje promjena koje ste
    napravili u veličini teksta, fontu i drugim dijelovima web stranice koje
    možete prilagoditi. Informacije koje ovi kolačići prikupljaju obično su
    anonimizirane.
    </p>

    <p><strong>Analitika</strong></p>

    <p>
    Ovi kolačići prikupljaju informacije o tome kako posjetitelji koriste
    web stranicu, primjerice koje stranice najčešće posjećuju i dobivaju li
    poruke o pogrešci na web stranicama. Također nam omogućuju bilježenje i
    brojanje broja posjetitelja web stranice kako bismo mogli poboljšati
    način na koji naša web stranica funkcionira.
    </p>

    <p><strong>Oglašavanje</strong></p>

    <p>
    Ovi kolačići koriste se za prikazivanje oglasa koji su relevantni za vas
    te za upravljanje učinkom oglašavanja. Kolačići za oglašavanje obično su
    kolačići treće strane i mogu biti prisutni čak i ako se oglasi ne koriste
    na web stranici.
    </p>

    <p><strong>IP adrese</strong></p>

    <p>
    Kada posjetite našu web stranicu, možemo prikupljati vaše IP adrese
    (Internet Protocol) kako bismo pratili i agregirali neosobne informacije.
    Na primjer, možemo koristiti IP adrese za praćenje regija iz kojih
    korisnici pristupaju web stranici.
    </p>

    <p><strong>KAKO UPRAVLJATI KOLAČIĆIMA</strong></p>

    <p>
    Kliknite na poveznicu „Upravljanje kolačićima” na dnu stranice kako biste
    putem našeg upravitelja privole za kolačiće omogućili ili onemogućili
    određene kolačiće. Imajte na umu da nije moguće isključiti strogo nužne
    kolačiće.
    </p>

    <p>
    Također možete onemogućiti određene kolačiće putem postavki preglednika.
    Posjetite odjeljak „Pomoć” u vašem pregledniku kako biste saznali kako
    upravljati postavkama kolačića.
    </p>

    <p><strong>OBAVIJEST O KOLAČIĆIMA NE OBUHVAĆA WEB STRANICE TREĆIH STRANA</strong></p>

    <p>
    Kada uključimo poveznice na druge web stranice, imajte na umu da one imaju
    vlastite politike privatnosti i kolačića koje reguliraju korištenje
    informacija koje im dostavite. Preporučujemo da pročitate njihove politike
    jer nismo odgovorni za njihove prakse privatnosti.
    </p>

    <p><strong>PROMJENE OBAVIJESTI O KOLAČIĆIMA</strong></p>

    <p>
    Povremeno možemo ažurirati ovu politiku i potičemo vas da je s vremena na
    vrijeme pregledate kako biste bili informirani o tome kako koristimo
    kolačiće. Datum stupanja na snagu objavljujemo na vrhu stranice.
    </p>

    <p><strong>OPIS KOLAČIĆA KOJI SE KORISTE</strong></p>

    <p>
    Kliknite na poveznicu „Upravljanje kolačićima” u podnožju web stranice
    kako biste pronašli pojedinosti o pojedinačnim kolačićima koji se koriste
    na web stranici. U nekim slučajevima ova poveznica možda neće biti
    dostupna, primjerice kada koristimo samo strogo nužne kolačiće.
    </p>

    <p><strong>KONTAKTIRAJTE NAS</strong></p>

    <p>
    Ako imate bilo kakvih pitanja o ovoj Obavijesti o kolačićima, kontaktirajte
    nas kako je navedeno u našoj Obavijesti o privatnosti.
    </p>
