    <h2>कुकी सूचना</h2>

    <p><strong>प्रभावी तिथि:</strong> 14 दिसंबर 2023</p>

    <p>
    इस वेबसाइट पर हम कुकीज़ और संबंधित ट्रैकिंग तकनीकों का उपयोग करते हैं, जिनमें वेब बीकन,
    ट्रैकिंग पिक्सेल और लॉग फ़ाइलें शामिल हैं (सामूहिक रूप से “कुकीज़” कहा जाता है)। इनका
    उपयोग आपको अन्य उपयोगकर्ताओं से अलग पहचानने, वेबसाइट और हमारी सेवाओं की कार्यक्षमता
    का मूल्यांकन और सुधार करने तथा आपको बेहतर उपयोगकर्ता अनुभव प्रदान करने के लिए किया जाता है।
    </p>

    <p><strong>कुकी क्या है</strong></p>

    <p>
    कुकीज़ ऐसी जानकारी होती हैं जो आपके वेब ब्राउज़र और वेबसाइट के बीच साझा की जाती हैं।
    कुछ कुकीज़ वेबसाइट के सही तरीके से काम करने के लिए आवश्यक होती हैं। कुछ हमें वेबसाइट
    के प्रदर्शन का मूल्यांकन और सुधार करने में मदद करती हैं। हम कुकीज़ का उपयोग आपको
    प्रासंगिक सामग्री, उत्पाद और सेवाएँ प्रदान करने के लिए भी करते हैं। कुकी आपके
    कंप्यूटर की हार्ड ड्राइव से डेटा नहीं पढ़ सकती।
    </p>

    <p>कुकीज़ के विभिन्न प्रकार होते हैं जिनके अलग-अलग कार्य होते हैं:</p>

    <p>
    (i) <strong>सेशन कुकीज़:</strong> ये कुकीज़ केवल आपकी ब्राउज़िंग सत्र के दौरान
    आपके कंप्यूटर में संग्रहीत रहती हैं और ब्राउज़र बंद करने पर स्वचालित रूप से हट जाती हैं।
    ये आमतौर पर एक अनाम सत्र आईडी संग्रहीत करती हैं जिससे आप वेबसाइट पर बिना हर
    पेज पर लॉग इन किए नेविगेट कर सकते हैं।
    </p>

    <p>
    (ii) <strong>स्थायी कुकीज़:</strong> ये कुकीज़ आपके कंप्यूटर में फ़ाइल के रूप में
    संग्रहीत रहती हैं और ब्राउज़र बंद करने के बाद भी बनी रहती हैं। जब आप वेबसाइट
    पर दोबारा जाते हैं तो वेबसाइट इन्हें पढ़ सकती है।
    </p>

    <p>
    (iii) <strong>प्रथम-पक्ष कुकीज़:</strong> ये कुकीज़ हमारी कंपनी द्वारा बनाई जाती हैं
    और हमारे सर्वर तथा आपके कंप्यूटर की हार्ड ड्राइव के बीच संग्रहीत और भेजी जाती हैं।
    ये सेशन कुकीज़ या स्थायी कुकीज़ दोनों हो सकती हैं।
    </p>

    <p>
    (iv) <strong>तृतीय-पक्ष कुकीज़:</strong> ये कुकीज़ हमारे किसी तृतीय-पक्ष साझेदार
    द्वारा बनाई जाती हैं और उनके सर्वर तथा आपके कंप्यूटर की हार्ड ड्राइव के बीच
    संग्रहीत और भेजी जाती हैं। ये सामान्यतः स्थायी कुकीज़ होती हैं।
    </p>

    <p><strong>हम कुकीज़ का उपयोग कैसे और क्यों करते हैं</strong></p>

    <p>वेबसाइट के आधार पर हम कुकीज़ का उपयोग निम्नलिखित उद्देश्यों के लिए कर सकते हैं:</p>

    <p><strong>आवश्यक कुकीज़</strong></p>

    <p>
    ये कुकीज़ वेबसाइट पर नेविगेट करने और इसकी सुविधाओं का उपयोग करने के लिए आवश्यक हैं,
    जैसे कि वेबसाइट के सुरक्षित क्षेत्रों तक पहुंचना। इन कुकीज़ के बिना वे सेवाएँ
    प्रदान नहीं की जा सकतीं जिनका आपने अनुरोध किया है।
    </p>

    <p><strong>कार्यात्मकता</strong></p>

    <p>
    ये कुकीज़ हमारी वेबसाइट को आपकी पसंद (जैसे उपयोगकर्ता नाम, भाषा या क्षेत्र)
    याद रखने की अनुमति देती हैं और बेहतर तथा अधिक व्यक्तिगत सुविधाएँ प्रदान करती हैं।
    उदाहरण के लिए वेबसाइट आपके लॉगिन विवरण याद रख सकती है ताकि आपको बार-बार
    लॉग इन न करना पड़े।
    </p>

    <p>
    इन कुकीज़ का उपयोग टेक्स्ट आकार, फ़ॉन्ट और वेबसाइट के अन्य अनुकूलन योग्य
    भागों में किए गए परिवर्तनों को याद रखने के लिए भी किया जा सकता है।
    </p>

    <p><strong>विश्लेषण</strong></p>

    <p>
    ये कुकीज़ इस बारे में जानकारी एकत्र करती हैं कि आगंतुक वेबसाइट का उपयोग कैसे करते हैं,
    जैसे कौन-से पृष्ठ सबसे अधिक देखे जाते हैं या यदि कोई त्रुटि संदेश दिखाई देता है।
    यह जानकारी हमें वेबसाइट के प्रदर्शन को बेहतर बनाने में मदद करती है।
    </p>

    <p><strong>विज्ञापन</strong></p>

    <p>
    इन कुकीज़ का उपयोग आपको अधिक प्रासंगिक विज्ञापन दिखाने और विज्ञापन
    अभियानों के प्रदर्शन को प्रबंधित करने के लिए किया जाता है।
    </p>

    <p><strong>IP पते</strong></p>

    <p>
    जब आप हमारी वेबसाइट पर जाते हैं, तो हम आपके इंटरनेट प्रोटोकॉल
    (“IP”) पते एकत्र कर सकते हैं ताकि गैर-व्यक्तिगत डेटा को ट्रैक
    और संकलित किया जा सके।
    </p>

    <p><strong>कुकीज़ का प्रबंधन कैसे करें</strong></p>

    <p>
    पेज के निचले भाग में “कुकी प्रबंधित करें” लिंक पर क्लिक करके
    आप हमारी कुकी सहमति प्रबंधक के माध्यम से कुछ कुकीज़ को सक्षम
    या अक्षम कर सकते हैं।
    </p>

    <p>
    आप अपने ब्राउज़र की सेटिंग्स के माध्यम से भी कुछ कुकीज़ को अक्षम कर सकते हैं।
    निर्देशों के लिए अपने ब्राउज़र के “सहायता” अनुभाग को देखें।
    </p>

    <p><strong>तृतीय-पक्ष वेबसाइटें</strong></p>

    <p>
    यदि हमारी वेबसाइट पर अन्य वेबसाइटों के लिंक दिए गए हैं, तो कृपया ध्यान दें
    कि उनकी अपनी गोपनीयता और कुकी नीतियाँ हो सकती हैं। हम आपको उनकी नीतियाँ
    पढ़ने की सलाह देते हैं।
    </p>

    <p><strong>कुकी सूचना में परिवर्तन</strong></p>

    <p>
    हम समय-समय पर इस कुकी सूचना को अपडेट कर सकते हैं। इसलिए हम आपको
    समय-समय पर इसे देखने की सलाह देते हैं।
    </p>

    <p><strong>हमसे संपर्क करें</strong></p>

    <p>
    यदि इस कुकी सूचना के बारे में आपके कोई प्रश्न हैं, तो कृपया
    हमारी गोपनीयता सूचना में दिए गए तरीके से हमसे संपर्क करें।
    </p>
