    insights_reports: अंतर्दृष्टियाँ और रिपोर्टें
    instruction_modal:
      campaign_start_final_instructions: कृपया ध्यान दें कि टाइमर को रोकने या विराम देने का कोई तरीका नहीं है। अभियान का टाइमर तब भी चलता रहेगा जब आप ब्राउज़र बंद कर देंगे, इसलिए आपको कभी भी बीच में काम छोड़कर कुछ और करने के बारे में नहीं सोचना चाहिए। कृपया सुनिश्चित करें कि कार्यों के दौरान ध्यान भटकने से बचें। एक शांत वातावरण खोजें, अपने उपकरणों पर सूचनाएं (नोटिफिकेशन्स) बंद कर दें, और मल्टीटास्किंग से बचें। अपना ध्यान बनाए रखें और केंद्रित रहें। एक बार जब अभियान का टाइमर समाप्त हो जाता है, तो आप जारी नहीं रख पाएंगे। यदि आपने उपरोक्त निर्देशों को पढ़ लिया है, तो कृपया सौंपे गए कार्यों को जारी रखने के लिए 'स्टार्ट' पर क्लिक करें।
      campaign_start_instruction: |-
        कृपया निम्नलिखित निर्देशों को ठीक से पढ़ें।
          आप जो कार्य शुरू करने वाले हैं, उनके लिए समय-सीमा निर्धारित है। एक बार जब आप "स्टार्ट" पर क्लिक करेंगे, तो अभियान टाइमर स्वचालित रूप से शुरू हो जाएगा। आपके पास सभी गतिविधियों को पूरा करने के लिए %{minutes} मिनट हैं। कृपया निर्धारित समय-सीमा के भीतर कार्यों को पूरा करने का लक्ष्य रखें और मूल्यांकन प्रक्रिया में जल्दबाजी से बचने के लिए समय का प्रभावी ढंग से प्रबंधन करें। सुनिश्चित करें कि आप कार्यों को एक ही बार में पूरा करें, इसलिए यदि आपको ब्रेक लेना है, तो अभी सही समय है।
      common_proctoring_instructions: |
        प्रॉक्टरिंग

        स्टार्ट बटन पर क्लिक करने पर, आपको हमारे प्रॉक्टरिंग सिस्टम पर रीडायरेक्ट कर दिया जाएगा। यह आपके सत्र के दौरान आपके कैमरे, माइक्रोफ़ोन और स्क्रीन की निगरानी करेगा। इन सत्रों की निगरानी हमारे परिष्कृत एआई सिस्टम द्वारा स्वचालित रूप से की जाती है, जो एक निर्बाध और सहज उपयोगकर्ता अनुभव प्रदान करता है। हालाँकि, सत्रों की समीक्षा मानवीय प्रॉक्टरों द्वारा भी की जा सकती है। दुर्व्यवहार या अनियमितताओं के किसी भी संकेत को चिह्नित किया जाएगा। यह यह सुनिश्चित करने के लिए किया जा रहा है कि धोखाधड़ी का कोई प्रयास न किया जाए। यदि संदेह पाया जाता है, तो आपका कार्य (कार्य) रद्द कर दिया जाएगा।
      lockdown_browser_instruction: |
        प्रॉक्टरिंग ब्राउज़र

          प्रॉक्टरिंग कार्यों को पूरा करने के लिए आपको एक विशेष ब्राउज़र डाउनलोड और इंस्टॉल करना होगा। कृपया अगली स्क्रीन पर दिए गए निर्देशों का पालन करें। सभी आवश्यक गतिविधियों को पूरा करने के बाद आप इसे अनइंस्टॉल कर सकते हैं।
