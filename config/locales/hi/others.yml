            - संगठन के लिए परिवर्तन प्रबंधन परियोजनाओं का नेतृत्व करने के लिए स्वयंसेवक बनें।
            - लंबे समय तक चलने वाले कार्यभार लेने पर विचार करें।
            - अन्य कार्यक्षेत्रों के साथ पारस्परिक सहयोग से काम करें
            - अपने संगठन के बाहर परियोजनाओं का नेतृत्व करने पर विचार करें
