      guidelines:
        cards:
          c1:
            content: विकास की आवश्यकता वाले कौशल, ज्ञान और क्षमताओं को शामिल करें। सुनिश्चित करें कि वे विशिष्ट, मापनीय, प्राप्य, यथार्थवादी और उल्लिखित समयसीमा में पूरा किए जाने योग्य हों।
            title: विकास के उद्देश्य
          c2:
            content: यह मूल्यांकन अनुभव के आधार पर विकसित की जाने वाली क्षमता पर आधारित है।
            title: क्षमता
          c3:
            content: यह अनुभाग नीचे सूचीबद्ध 70-20-10 सीखने के मॉडल के आधार पर आपके विकास संबंधी कार्यों को शामिल करता है। विविध सीखने और विकास दृष्टिकोण सुनिश्चित करने के लिए प्रत्येक तीन तत्वों का संयोजन चुनने की सलाह दी जाती है।
            title: गतिविधि
          c4:
            content: सुनिश्चित करें कि आपकी समय-सीमाएँ इस आधार पर यथार्थवादी हों कि लक्ष्य कब पूरा हो सकता है। आवश्यकतानुसार इसे संशोधित करें।
            title: समयरेखा
          c5:
            content: पहचाने गए ट्रैकों पर प्रगति को समर्थन देने के लिए प्रगति अनुभाग का उपयोग करें।
            title: प्रगति
        chart:
          collaboration: २०% सहयोगात्मक <br /> अधिगम
          job: 70% काम करते हुए सीखना
          learn: 10% औपचारिक शिक्षण
        content:
          list:
            r1: कृपया ध्यान दें कि यह सूची केवल संकेतात्मक है, और आपकी व्यक्तिगत आकांक्षाओं, आपके प्रबंधक की सिफारिशों तथा संगठनात्मक व्यावसायिक प्राथमिकताओं के आधार पर आपके लिए अतिरिक्त विकास मार्गों पर विचार किया जा सकता है।
            r2: उपयोगकर्ताओं को सभी सामग्री की आलोचनात्मक समीक्षा करने के लिए प्रोत्साहित किया जाता है, और वे उन किसी भी कार्यों या सिफारिशों को संशोधित, परिष्कृत, प्रतिस्थापित या जोड़ने के लिए स्वतंत्र हैं जिनसे वे सहमत नहीं हैं।
            r3: 'इस रिपोर्ट में शामिल विकास संबंधी इनपुट निम्नलिखित स्रोतों में से किसी एक या दोनों से प्राप्त किए जा सकते हैं:'
            r3a: आपके संगठन के लिए बनाई गई एक अनुकूलित विकास लाइब्रेरी
            r3b: एआई द्वारा उत्पन्न विकास सुझाव
            r4: यह IDP रिपोर्ट AI तकनीक की सहायता से तैयार की गई है और इसमें कुछ त्रुटियाँ हो सकती हैं। प्रदान की गई अंतर्दृष्टि और सिफारिशों को विवेक के साथ समझा जाना चाहिए और केवल आपके व्यक्तिगत एवं पेशेवर विकास के लिए एक उपकरण के रूप में उपयोग किया जाना चाहिए। यह रिपोर्ट 12-18 महीनों की अवधि के लिए मान्य है।
          main: IDP में उन विकास संबंधी कार्यों की विस्तृत सूची शामिल है जिन्हें आप सर्वोत्तम अभ्यास (70-20-10 दिशानिर्देश) को ध्यान में रखते हुए कर सकते हैं, जो कक्षा-आधारित शिक्षण, कोचिंग और कार्यस्थल-आधारित शिक्षण को संयोजित करते हुए एक प्रगतिशील यात्रा प्रदान करती है। मूल्यांकन केंद्र प्रक्रिया के परिणामों, आपकी चैट प्रतिक्रियाओं और लागू होने पर बाहरी रिपोर्टों के आधार पर संभावित विकास मार्ग सुझाए गए हैं, जिन्हें आपके विकास के लिए विचार किया जा सकता है।
        learn_cards:
