        <h2>LANGKAH YANG KAMI AMBIL UNTUK MELINDUNGI INFORMASI PRIBADI</h2>
        <p>
          Perusahaan kami berusaha untuk mematuhi semua undang-undang perlindungan data dan keamanan siber yang berlaku. Dengan tujuan ini, MMC memiliki seorang Chief Information Security Officer (CISO) yang berdedikasi dan seorang Global Chief Privacy Officer (GCPO). CISO bertanggung jawab untuk mengelola tim Keamanan Informasi Global dan program keamanan siber yang komprehensif. Sebagai bagian dari program keamanan siber kami, kami telah menerapkan langkah-langkah fisik, administratif, dan teknis yang wajar secara komersial untuk melindungi Informasi Pribadi dari akses, penggunaan, perubahan, dan penghapusan yang tidak sah.
        </p>
        <p>
          GCPO memimpin dan mengawasi Pusat Keunggulan Privasi dan Jaringan Pejabat Perlindungan Data yang bertanggung jawab untuk melaksanakan program privasi global kami yang komprehensif. Jaringan Pejabat Perlindungan Data menghubungkan Pejabat Perlindungan Data kami di seluruh dunia dan berusaha untuk menerapkan program privasi kami secara konsisten dan menyeluruh di mana pun kami memproses data. Anda dapat memperoleh nama dan informasi kontak untuk Pejabat Perlindungan Data di yurisdiksi Anda dengan menghubungi kami di <a href="mailto:privacy@mmc.com">privacy@mmc.com</a>.
        </p>
        <h2>HAK PERLINDUNGAN DATA ANDA</h2>
        <p>
          Dalam banyak kasus, kami menangani Informasi Pribadi untuk menyediakan layanan kami kepada klien korporasi, dan Anda harus menghubungi mereka untuk menggunakan hak yang mungkin Anda miliki berdasarkan undang-undang privasi yang berlaku. Namun, di mana kami bertindak sebagai pengendali atau bisnis yang terutama bertanggung jawab untuk memutuskan bagaimana informasi Anda diproses, Anda mungkin memiliki beberapa atau semua hak yang tercantum di bawah ini, tergantung pada yurisdiksi dan alasan kami memproses informasi Anda. Harap dicatat bahwa kami mungkin perlu menggunakan Informasi Pribadi Anda untuk memverifikasi identitas Anda sebelum menanggapi salah satu hak di bawah ini.
        </p>
        <ul>
          <li>
            <strong>Hak akses (Hak untuk tahu)<br /></strong>
            Anda dapat meminta kami untuk memberikan rincian lebih lanjut tentang bagaimana kami menggunakan Informasi Pribadi Anda, sumbernya, kategori atau bagian spesifik dari Informasi Pribadi yang telah kami kumpulkan, kategori pihak ketiga kepada siapa kami telah mengungkapkan informasi tersebut, dan untuk meminta salinan dari Informasi Pribadi yang kami miliki tentang Anda.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Hak untuk memperbaiki<br /></strong>
            Anda dapat meminta kami untuk memperbarui ketidakakuratan apa pun dalam Informasi Pribadi yang kami miliki. Jika kami mengungkapkan Informasi Pribadi Anda kepada orang lain, kami akan memberi tahu mereka tentang perbaikan tersebut jika memungkinkan.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Hak untuk menghapus<br /></strong>
            Anda dapat meminta kami untuk menghapus Informasi Pribadi Anda di mana kami tidak lagi memiliki dasar hukum untuk memprosesnya.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Hak untuk menolak atau membatasi pemrosesan<br /></strong>
            Anda mungkin memiliki hak untuk membatasi pemrosesan Informasi Pribadi Anda dalam keadaan tertentu, seperti ketika Anda mempertanyakan akurasinya.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Hak atas portabilitas data<br /></strong>
            Anda mungkin memiliki hak, di mana secara teknis memungkinkan, untuk meminta kami mentransfer kepada pihak ketiga pilihan Anda salinan Informasi Pribadi yang telah kami peroleh dari Anda, dalam format yang terstruktur, umum digunakan, dan dapat dibaca mesin.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Hak untuk menarik persetujuan<br /></strong>
            Jika kami mengandalkan persetujuan Anda sebagai dasar hukum kami untuk memproses Informasi Pribadi Anda, Anda memiliki hak untuk mencabut persetujuan tersebut.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Hak untuk mengajukan keluhan<br /></strong>
            Anda mungkin memiliki hak untuk mengajukan keluhan kepada otoritas pengawas atau regulasi yang relevan di yurisdiksi Anda jika Anda memiliki kekhawatiran tentang aspek mana pun dari praktik privasi kami.
          </li>
        </ul>
        <p>
          Jika Anda ingin menggunakan salah satu hak di atas atau meminta peninjauan atas suatu keputusan atau penolakan, silakan hubungi kami menggunakan informasi kontak yang berlaku:
        </p>
        <ul>
          <li>
            Jika Anda berada di Inggris Raya, Swiss, atau Wilayah Ekonomi Eropa, silakan lengkapi
            <a
              href="https://mmc-dev-privacy.my.onetrust.com/webform/4da460d1-7bcf-4ff1-ac37-c4b804769467/draft/ea953d72-fded-42ee-b1dd-c0a5a83b7891"
              > formulir ini</a
            >
          </li>
          <li>
            Untuk individu di negara lain, silakan lengkapi
            <a
              href="https://privacyportal.onetrust.com/webform/ee9df2bb-0ef3-4485-bc63-4db420e77359/225910f5-5666-468a-b1e7-39c70e24f4cc"
              > formulir ini</a
            >
          </li>
          <li>
            Atau, Anda dapat mengirim email kepada kami di <a href="mailto:privacy@mmc.com">privacy@mmc.com</a>
          </li>
        </ul>
        <p>
          Bergantung pada negara Anda, Anda mungkin juga memiliki beberapa atau semua hak berikut:
        </p>
        <ul>
          <li>
            <strong>
              Hak untuk Mendaftar atau Menolak Penjualan atau Pembagian untuk Iklan Lintas Konteks <br />
            </strong>
            Jika Anda mengunjungi salah satu situs web kami, kami dapat mengungkapkan informasi aktivitas jaringan internet atau jaringan elektronik lainnya, pengidentifikasi biografis, data geolokasi, dan informasi profesional (sejauh dapat diturunkan dari aktivitas Anda di situs web kami) kepada penyedia analitik dan periklanan situs web untuk tujuan periklanan perilaku lintas konteks atau terarah dengan menggunakan cookie periklanan. Di bawah beberapa undang-undang, Anda mungkin memiliki hak untuk memilih untuk ikut serta atau tidak dalam jenis pengungkapan ini. Untuk membuat pilihan Anda atau untuk melihat nama pihak ketiga tertentu dengan siapa kami telah menjual atau membagikan informasi Anda, silakan klik tautan "Kelola Cookie" di bagian bawah halaman web kami. Jika Anda ingin memilih untuk tidak menjual atau membagikan informasi Anda, pastikan pengaturan untuk pelacak "Periklanan" dan "Analitik" diatur ke "Tidak" atau, jika tersedia, aktifkan pengaturan Jangan Jual atau Bagikan Informasi Pribadi Saya.
            <p>
              Anda juga dapat menerapkan pengaturan atau ekstensi browser untuk secara otomatis mengkomunikasikan preferensi penjualan dan berbagi Anda kepada situs web yang Anda kunjungi. Situs web kami memproses "sinyal preferensi opt-out" tersebut dengan tanpa hambatan dengan mengenali Global Privacy Control (GPC). Jika Anda ingin menggunakan GPC, Anda dapat mengunduh dan mengaktifkannya melalui browser atau ekstensi browser yang berpartisipasi. Informasi lebih lanjut tentang mengunduh GPC tersedia <a href="https://globalprivacycontrol.org/">di sini</a>.
            </p>
          </li>
        </ul>
        <ul>
          <li>
            <strong>
              Hak-hak terkait dengan pengambilan keputusan otomatis dan pemprofilan
            <br /></strong>
            Sepanjang kami terlibat dalam pemrosesan otomatis Informasi Pribadi Anda, kami akan memberikan pemberitahuan kepada Anda sebelumnya, termasuk mengenai hak-hak Anda, yang diwajibkan oleh hukum.
          </li>
        </ul>
        <ul>
          <li>
            <strong>Pemasaran Langsung dan Sinyal Jangan Lacak<br /></strong>
            Anda mungkin memiliki hak untuk meminta dan memperoleh pemberitahuan sekali setahun tentang Informasi Pribadi yang kami ungkapkan kepada bisnis lain untuk tujuan pemasaran langsung mereka sendiri, di mana diizinkan oleh hukum. Jika berlaku, pemberitahuan tersebut akan mencakup daftar kategori Informasi Pribadi yang diungkapkan (jika ada) dan nama serta alamat semua pihak ketiga kepada siapa Informasi Pribadi tersebut diungkapkan (jika ada). Pemberitahuan tersebut akan mencakup tahun kalender sebelumnya. Anda dapat menghubungi kami seperti yang tercantum di bawah ini jika Anda ingin mengetahui apakah hak ini berlaku untuk Anda dan, jika demikian, menggunakan hak tersebut.
          </li>
        </ul>
        <p>
          Harap dicatat bahwa beberapa hak ini mungkin terbatas di mana kami memiliki kepentingan sah yang lebih tinggi atau kewajiban hukum, regulasi, atau kontraktual untuk terus memproses Informasi Pribadi, atau di mana Informasi Pribadi mungkin dikecualikan dari pengungkapan atau penghapusan berdasarkan hukum yang berlaku. Beberapa hak ini hanya dapat dilaksanakan dalam keadaan tertentu atau mungkin dibatasi oleh undang-undang perlindungan data di yurisdiksi Anda.
        </p>
        <h2>TRANSFER ANTAR PERBATASAN</h2>
        <p>
          Sebagai perusahaan global yang beroperasi di lebih dari 80 negara, ada keadaan di mana kami harus mentransfer Informasi Pribadi keluar dari negara, provinsi, atau wilayah tempat informasi tersebut dikumpulkan untuk tujuan yang dijelaskan dalam Pemberitahuan Privasi ini. Secara khusus, kami dapat mentransfer data untuk menawarkan, mengelola, dan mengatur Layanan yang diberikan kepada Anda, serta untuk meningkatkan efisiensi operasi bisnis kami. Kami akan melakukan segala upaya untuk memastikan bahwa transfer ini mematuhi semua undang-undang perlindungan data yang relevan, dan bahwa hak serta kebebasan individu di bawah undang-undang tersebut dilindungi dengan tepat.
        </p>
        <p>
          Di mana kebutuhan untuk transfer semacam itu muncul, kami akan mengambil langkah-langkah untuk memastikan bahwa ada perlindungan yang sesuai untuk melindungi Informasi Pribadi seperti penilaian dampak, keputusan kecukupan oleh otoritas pengawas yang sesuai, penggunaan aturan perusahaan yang mengikat yang disetujui atau klausul kontrak standar, atau persetujuan Anda.
        </p>
        <p>
          Untuk informasi mengenai bagaimana Aturan Perusahaan Mengikat (Binding Corporate Rules/BCR) MMC di Uni Eropa (EU) beroperasi, klik
          <a
            href="https://www.marshmclennan.com/content/dam/mmc-web/Archive/Images/Files/02March2022-EUBCR-Controller-and-Processor-Principles.pdf"
            >di sini</a
          >.&nbsp; Untuk daftar entitas yang telah setuju untuk terikat oleh BCR EU, klik
          <a href="https://www.marshmclennan.com/privacy-statement/bcr-entities.html"
            >di sini</a
          >.&nbsp;
        </p>
        <p>
          Untuk informasi mengenai bagaimana Aturan Korporasi Mengikat MMC di Inggris (UK BCR) beroperasi, klik
          <a
            href="https://www.marshmclennan.com/content/dam/mmc-web/Archive/Images/Files/02March2022-UKBCR-Controller-and-Processor-Principles.pdf"
            >di sini</a
          >.&nbsp; Untuk daftar entitas yang telah setuju untuk terikat oleh UK BCR, klik
          <a
            href="https://www.marshmclennan.com/privacy-statement/bcr-entities-uk.html"
            >di sini</a
          >.&nbsp;&nbsp;&nbsp;
        </p>
        <h2>PENYIMPANAN INFORMASI ANDA</h2>
        <p>
          Produk, layanan, dan kewajiban regulasi kami kompleks, dan oleh karena itu periode penyimpanan kami untuk Informasi Pribadi bervariasi. Kami mempertimbangkan kewajiban berikut saat menetapkan periode penyimpanan untuk Informasi Pribadi dan catatan yang kami simpan:
        </p>
        <ul>
          <li>
            kebutuhan untuk mempertahankan informasi untuk mencapai tujuan bisnis atau kewajiban kontraktual yang mana informasi tersebut dikumpulkan;
          </li>
          <li>
            tugas kami untuk melaksanakan instruksi klien kami sehubungan dengan Informasi Pribadi yang kami proses atas nama mereka;
          </li>
          <li>
            kewajiban kami untuk mematuhi persyaratan penyimpanan catatan hukum dan regulasi yang wajib;
          </li>
          <li>
            prosedur cadangan dan pemulihan bencana kami; dan
          </li>
          <li>
            dampak hukum lainnya seperti periode batas waktu yang berlaku.
          </li>
        </ul>
        <p>
          Berdasarkan faktor-faktor di atas, kami dapat menyimpan Informasi Pribadi melebihi periode di mana kami memberikan layanan kepada Anda. Ketika kami tidak lagi perlu menyimpan Informasi Pribadi, kebijakan perusahaan kami mengharuskan kami untuk mengidentifikasi ulang atau mengagregasi informasi tersebut (dalam hal ini kami dapat lebih lanjut menyimpan dan menggunakan informasi yang telah diidentifikasi ulang atau diagregasi untuk tujuan analitik) atau menghancurkannya dengan aman.
        </p>
        <h2>PERTANYAAN ATAU PERHATIAN</h2>
        <p>
          Untuk mengajukan pertanyaan atau permintaan terkait Pemberitahuan Privasi ini atau praktik privasi MTE, silakan kirim email kepada kami di <a href="mailto:privacy@mmc.com">privacy@mmc.com</a>. Jika Anda lebih memilih untuk menghubungi kami melalui pos atau telepon, silakan hubungi Petugas Perlindungan Data lokal Anda. Anda dapat memperoleh informasi kontak untuk Petugas Perlindungan Data lokal Anda dengan menghubungi kami di
          <a href="mailto:privacy@mmc.com">privacy@mmc.com</a>.
        </p>
