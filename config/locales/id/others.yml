      guidelines:
        cards:
          c1:
            content: Sertakan keterampilan, pengetahuan, dan kemampuan yang perlu dikembangkan. Pastikan mereka spesifik, terukur, dapat dicapai, realistis, dan dapat dicapai secara wajar dalam garis waktu yang disebutkan.
            title: Tujuan Pengembangan
          c2:
            content: Hal ini didasarkan pada kompetensi yang akan dikembangkan berdasarkan pengalaman penilaian.
            title: Kompetensi
          c3:
            content: Bagian ini mencakup tindakan pengembangan Anda berdasarkan model pembelajaran 70-20-10 yang tercantum di bawah ini. Disarankan agar Anda memilih kombinasi dari masing-masing dari tiga elemen untuk memastikan pendekatan pembelajaran dan pengembangan yang bervariasi.
            title: Aktivitas
          c4:
            content: Pastikan garis waktu Anda realistis berdasarkan kapan tujuan dapat diselesaikan. Ubah ini sebagaimana mestinya.
            title: Garis waktu
          c5:
            content: Gunakan bagian kemajuan untuk mendukung kemajuan pada jalur yang diidentifikasi.
            title: Kemajuan
        chart:
          collaboration: "<strong>20%</strong>Kolaboratif <br /> Belajar"
          job: "<strong>70%</strong>Belajar <br />di Tempat Kerja"
          learn: "<strong>10%</strong>Pembelajaran Formal"
        content:
          list:
            r1: Harap diperhatikan bahwa daftar ini hanya bersifat indikatif, dan jalur pengembangan tambahan dapat dipertimbangkan untuk Anda berdasarkan aspirasi pribadi, rekomendasi dari atasan Anda, serta prioritas bisnis organisasi.
            r2: Pengguna didorong untuk meninjau secara kritis semua konten, dan bebas untuk memodifikasi, menyempurnakan, mengganti, atau menambahkan tindakan atau rekomendasi apa pun yang tidak mereka setujui.
            r3: 'Masukan pengembangan yang tercantum dalam laporan ini dapat berasal dari salah satu atau kedua sumber berikut:'
            r3a: Perpustakaan pengembangan yang disesuaikan yang dibuat khusus untuk organisasi Anda.
            r3b: Saran pengembangan yang dihasilkan oleh kecerdasan buatan (AI)
            r4: Laporan IDP ini disusun dengan bantuan teknologi kecerdasan buatan (AI) dan mungkin mengandung ketidakakuratan. Wawasan dan rekomendasi yang disajikan harus ditafsirkan dengan bijaksana dan digunakan semata-mata sebagai alat untuk pengembangan pribadi dan profesional Anda. Laporan ini berlaku untuk jangka waktu 12–18 bulan.
          main: IDP yang dibuat mencakup daftar rinci tindakan pengembangan yang dapat Anda lakukan, dengan mempertimbangkan pedoman praktik terbaik pembelajaran, yaitu pedoman 70-20-10, yang menyediakan perjalanan progresif yang menggabungkan pembelajaran di kelas, bimbingan, dan pembelajaran di tempat kerja. Berdasarkan hasil dari proses pusat penilaian, tanggapan obrolan Anda, dan laporan eksternal, jika berlaku, jalur pengembangan yang mungkin telah direkomendasikan, yang dapat dipertimbangkan untuk pengembangan Anda.
        learn_cards:
          collaboration:
            list:
            - Menawarkan untuk membimbing atau menjadi mentor bagi orang lain
            - Meminta untuk dibimbing oleh ahli di bidang Anda
            - Mendapatkan pelatih untuk mendukung pengembangan Anda
            - Membentuk kelompok kerja kolaboratif untuk mendiskusikan tantangan bisnis yang sedang berlangsung
            - Mendapatkan umpan balik secara formal dan informal dari orang lain
            - Berperan aktif dalam asosiasi dan jaringan industri
            - Membangun jaringan eksternal Anda sendiri
            title: Pembelajaran Kolaboratif (20%) <br/> Berkembang melalui orang lain
          job:
            list:
            - Mengambil posisi kepemimpinan dalam komite pemangku kepentingan atau manajemen
            - Menjadi sukarelawan untuk memimpin proyek manajemen perubahan untuk organisasi
            - Pertimbangkan untuk mengambil tugas yang menantang
            - Bekerja lintas fungsi dengan departemen lain
            - Pertimbangkan untuk memimpin proyek di luar organisasi Anda
            - Bekerja sama dengan pakar industri eksternal dalam proyek bersama
            title: Belajar Di Tempat Kerja (70%) <br/> Berkembang melalui pengalaman
          learn:
            list:
            - Ikuti program pelatihan terstruktur.
            - Ikuti kursus e-learning online secara lengkap.
            - Bacalah buku, artikel, dan publikasi.
            - Peroleh kualifikasi profesional, sertifikasi, dan akreditasi.
            - Ikuti kursus, lokakarya, dan seminar.
            title: Pembelajaran Formal (10%) <br/> Berkembang melalui pembelajaran terstruktur
