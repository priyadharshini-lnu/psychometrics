    insights_reports: Wawasan &amp; Laporan
    instruction_modal:
      campaign_start_final_instructions: "<p>perlu diketahui bahwa tidak ada cara untuk Menghentikan atau Menjeda pengatur waktu. Pengatur waktu kampanye akan terus berjalan meskipun Anda menutup browser, jadi jangan pernah berpikir untuk meninggalkan tugas di sela-sela waktu untuk melakukan hal lain. Pastikan untuk meminimalkan gangguan selama mengerjakan tugas. Cari lingkungan yang tenang, matikan notifikasi pada perangkat Anda, dan hindari melakukan banyak hal sekaligus (multitasking). Pertahankan konsentrasi Anda dan tetaplah fokus. Setelah pengatur waktu kampanye habis, Anda tidak akan bisa melanjutkannya. Jika Anda sudah membaca instruksi di atas, silakan klik mulai untuk melanjutkan tugas yang telah diberikan</p>\n"
      campaign_start_instruction: |
        <h4>Harap baca instruksi berikut dengan benar.</h4>
        <p>tugas yang akan Anda mulai memiliki waktu. Setelah Anda mengklik "Mulai", penghitung waktu kampanye akan dimulai secara otomatis. Anda memiliki waktu %{minutes} menit untuk menyelesaikan semua aktivitas. Harap usahakan untuk menyelesaikan tugas dalam jangka waktu yang telah ditentukan dan kelola waktu secara efektif agar tidak terburu-buru dalam melakukan proses evaluasi. Pastikan untuk menyelesaikan tugas dalam satu kali pengerjaan, sehingga jika Anda perlu beristirahat, Sekaranglah waktunya</p>
      common_proctoring_instructions: |
        <h4>Pengawasan</h4>
        <p>setelah mengklik tombol Mulai, Anda akan diarahkan ke sistem pengawasan kami. Sistem ini akan memantau kamera, mikrofon, dan layar Anda selama sesi berlangsung. Sesi ini secara otomatis diawasi oleh sistem AI kami yang canggih, sehingga memberikan pengalaman pengguna yang lancar dan tanpa gangguan. Namun, sesi juga dapat ditinjau oleh pengawas manusia. Tanda-tanda pelanggaran atau ketidakberesan akan ditandai. Hal ini dilakukan untuk memastikan bahwa tidak ada upaya kecurangan yang dilakukan. Jika ditemukan kecurigaan, tugas Anda akan dibatalkan</p>
      lockdown_browser_instruction: |
        <h4>Peramban pengawas</h4>
        <p>anda akan diminta untuk mengunduh dan menginstal browser khusus untuk menyelesaikan tugas-tugas yang diawasi. Ikuti petunjuk di layar berikutnya. Anda dapat menghapus instalasinya setelah menyelesaikan semua aktivitas yang diperlukan</p>
