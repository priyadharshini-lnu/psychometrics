  cookies_notice: |-
    <h2>Pemberitahuan Cookie Mercer</h2>

    <p><strong>Tanggal Berlaku:</strong> 22 Desember 2022</p>

    <p>
      Kami menggunakan cookie dan teknologi pelacakan terkait, termasuk beacon web, piksel pelacakan, dan file log
      (secara bersama-sama disebut “cookie”) di situs web ini untuk membedakan Anda dari pengguna lain, menilai dan
      meningkatkan fungsionalitas situs web dan layanan kami, serta memberi Anda pengalaman yang baik.
    </p>

    <p><strong>APA YANG DIMAKSUD DENGAN COOKIE</strong></p>

    <p>
      Cookie adalah potongan informasi yang dibagikan antara peramban web dan situs web Anda. Beberapa cookie
      diperlukan untuk membuat situs web berfungsi. Beberapa membantu kami menilai dan meningkatkan kinerjanya.
      Kami juga menggunakan cookie untuk membantu menyediakan konten, produk, dan layanan yang relevan bagi Anda.
      Cookie tidak dapat membaca data dari hard drive komputer Anda.
    </p>

    <p>Terdapat berbagai jenis cookie dengan fungsi yang berbeda:</p>

    <p>
      (i) <strong>Cookie sesi:</strong> cookie ini hanya disimpan di komputer Anda selama sesi web Anda.
      Cookie akan dihapus secara otomatis saat peramban ditutup. Cookie ini biasanya menyimpan ID sesi anonim
      yang memungkinkan Anda menjelajahi situs web tanpa harus masuk ke setiap halaman.
    </p>

    <p>
      (ii) <strong>Cookie tetap:</strong> cookie ini disimpan sebagai file pada komputer Anda dan tetap berada
      di sana saat Anda menutup peramban web. Cookie ini dapat dibaca oleh situs web yang membuatnya ketika
      Anda mengunjungi situs web tersebut kembali.
    </p>

    <p>
      (iii) <strong>Cookie pihak pertama:</strong> cookie ini dibuat oleh perusahaan kami. Cookie tersebut
      disimpan dan dikirim antara server kami dan hard drive komputer Anda. Cookie ini dapat berupa cookie
      sesi atau tetap.
    </p>

    <p>
      (iv) <strong>Cookie pihak ketiga:</strong> cookie ini dibuat oleh salah satu mitra pihak ketiga kami.
      Cookie tersebut disimpan dan dikirim antara server pihak ketiga dan hard drive komputer Anda.
      Cookie ini biasanya merupakan cookie tetap.
    </p>

    <p><strong>CARA DAN ALASAN KAMI MENGGUNAKAN COOKIE</strong></p>

    <p>Tergantung pada situs web, kami dapat menggunakan cookie untuk tujuan berikut:</p>

    <p><strong>Di Tempat yang Sangat Diperlukan</strong></p>

    <p>
      Cookie ini sangat penting agar Anda dapat menjelajahi situs web dan menggunakan fiturnya,
      seperti mengakses area situs web yang aman. Tanpa cookie ini, layanan yang Anda minta,
      seperti mendapatkan penawaran harga atau masuk ke akun Anda, tidak dapat diberikan.
    </p>

    <p><strong>Fungsionalitas</strong></p>

    <p>
      Cookie ini memungkinkan situs web kami mengingat pilihan yang Anda buat (seperti nama pengguna,
      bahasa, atau wilayah tempat Anda berada) dan menyediakan fitur yang ditingkatkan.
      Misalnya, situs web mungkin dapat mengingat detail login Anda sehingga Anda tidak perlu
      berulang kali masuk ke akun Anda saat menggunakan perangkat tertentu untuk mengakses situs web kami.
    </p>

    <p>
      Cookie ini juga dapat digunakan untuk mengingat perubahan yang telah Anda lakukan terhadap
      ukuran teks, font, dan bagian lain dari halaman web yang dapat Anda sesuaikan.
    </p>

    <p><strong>Analisis</strong></p>

    <p>
      Cookie ini mengumpulkan informasi tentang cara pengunjung menggunakan situs web,
      misalnya halaman yang paling sering dikunjungi pengunjung dan jika mereka menerima
      pesan kesalahan dari halaman web.
    </p>

    <p><strong>Periklanan</strong></p>

    <p>
      Cookie ini digunakan untuk tujuan menampilkan iklan yang relevan bagi Anda dan
      untuk mengelola kinerja iklan. Cookie periklanan umumnya merupakan cookie pihak ketiga.
    </p>

    <p><strong>Alamat IP</strong></p>

    <p>
      Saat Anda mengunjungi situs web kami, kami dapat mengumpulkan alamat Protokol Internet (“IP”)
      Anda untuk melacak dan mengumpulkan informasi non-pribadi.
    </p>

    <p><strong>CARA MENGELOLA COOKIE</strong></p>

    <p>
      Klik tautan “Kelola Cookie” di bagian bawah halaman untuk memilih masuk atau keluar dari
      cookie tertentu menggunakan Manajer Persetujuan Cookie kami.
    </p>

    <p>
      Anda juga dapat menonaktifkan cookie tertentu melalui pengaturan peramban.
      Kunjungi bagian “Bantuan” pada peramban Anda untuk mengetahui cara mengelola
      pengaturan cookie Anda.
    </p>

    <p><strong>PEMBERITAHUAN COOKIE TIDAK MENCAKUP SITUS WEB PIHAK KETIGA</strong></p>

    <p>
      Ketika kami menyertakan tautan ke situs web lain, harap diingat bahwa situs tersebut
      memiliki kebijakan privasi dan cookie mereka sendiri yang akan mengatur penggunaan
      informasi apa pun yang Anda kirimkan.
    </p>

    <p><strong>PERUBAHAN PADA PEMBERITAHUAN COOKIE</strong></p>

    <p>
      Kami mungkin sesekali memperbarui pemberitahuan ini dan kami mendorong Anda untuk
      meninjau kebijakan tersebut dari waktu ke waktu agar tetap mengetahui cara kami
      menggunakan cookie.
    </p>

    <p><strong>DESKRIPSI COOKIE YANG DIGUNAKAN</strong></p>

    <p>
      Klik tautan “Kelola Cookie” pada bagian footer situs web untuk menemukan
      perincian tentang cookie individu yang digunakan pada situs web.
    </p>

    <p><strong>HUBUNGI KAMI</strong></p>

    <p>
      Jika Anda memiliki pertanyaan tentang Pemberitahuan Cookie ini,
      silakan hubungi kami sebagaimana ditunjukkan dalam Pemberitahuan Privasi kami.
    </p>
