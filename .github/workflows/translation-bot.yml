name: Translation Bot

on:
  pull_request:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  translate:
    name: Generate Translations
    if: |
      (github.event_name == 'pull_request' && github.event.label.name == 'translate') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/translate'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Parse command arguments
        id: parse_args
        run: |
          ruby .github/scripts/translation-bot/parse-trigger.rb \
            "${{ github.event_name }}" \
            "${{ github.event.comment.body }}" \
            "${{ github.event.issue.number }}" \
            "${{ github.event.pull_request.number }}"

      - name: Checkout PR code
        run: |
          gh pr checkout ${{ steps.parse_args.outputs.pr_number }} \
            --repo ${{ github.repository }}

      - name: Get branch info
        id: branch_info
        run: |
          ruby .github/scripts/translation-bot/get-branch-info.rb \
            "${{ steps.parse_args.outputs.pr_number }}"

      - name: Install dependencies
        run: |
          gem install psych -v 5.2.6 --no-document
          gem install i18n-tasks byebug deepl-rb --no-document

      - name: Translate missing keys
        env:
          DEEPL_AUTH_KEY: ${{ secrets.DEEPL_AUTH_KEY }}
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
        run: |
          i18n-tasks translate-missing ${{ steps.parse_args.outputs.languages }} --backend=google

      - name: Normalize locale files
        run: i18n-tasks normalize -p

      - name: Check for changes
        id: check_changes
        run: ruby .github/scripts/translation-bot/check-changes.rb

      - name: Create translation PR
        id: create_pr
        if: steps.check_changes.outputs.changes_made == 'true'
        run: |
          ruby .github/scripts/translation-bot/create-translation-pr.rb \
            "${{ steps.parse_args.outputs.pr_number }}" \
            "${{ steps.branch_info.outputs.head_ref }}" \
            "${{ steps.branch_info.outputs.base_ref }}"

      - name: Comment on PR
        if: always()
        run: |
          ruby .github/scripts/translation-bot/comment-on-pr.rb \
            "${{ steps.parse_args.outputs.pr_number }}" \
            "${{ steps.check_changes.outputs.changes_made }}" \
            "${{ steps.create_pr.outputs.pr_url }}" \
            "${{ steps.create_pr.outputs.translation_branch }}"
