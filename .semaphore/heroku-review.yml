version: v1.0
name: Heroku Review
agent:
  machine:
    type: e1-standard-4
    os_image: ubuntu1804
global_job_config:
  env_vars:
    - name: RAILS_ENV
      value: production
    - name: NODE_ENV
      value: production
    - name: NODE_OPTIONS
      value: '--max_old_space_size=8192'
    - name: BUNDLER_VERSION
      value: 2.2.31
    - name: HEROKU_REMOTE
      value: https://git.heroku.com/tte-lighthouse-review.git
    - name: DATABASE_URL
      value: "postgres://postgres:postgres@localhost:5432/ci"
    - name: AWS_ACCESS_KEY_ID
      value: 'dummy'
    - name: AWS_REGION
      value: 'dummy'
    - name: AWS_S3_BUCKET
      value: 'dummy'
    - name: AWS_SECRET_ACCESS_KEY
      value: 'dummy'
    - name: REDIS_HOST
      value: localhost
    - name: REDIS_URL
      value: 'redis://localhost:6379/1'
    - name: DISABLE_COVERAGE
      value: '1'

blocks:
  - name: Deploy
    dependencies: []
    task:
      secrets:
        - name: tte-lighthouse
        - name: heroku-http
      jobs:
        - name: Deploy to review
          commands:
          - sudo swapoff -a && sudo fallocate -l 2G /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile
          - checkout --use-cache
          - 'find ./app/frontend ./config/webpack -type f -exec md5sum {} + > webpack-files.txt'
          - 'md5sum *.js *.json yarn.lock .eslintrc >> webpack-files.txt'
          - cache restore bundle-prod-gems-$(checksum Gemfile.lock)
          - cache restore node-modules-prod-$(checksum yarn.lock)
          - cache restore webpack-compile-prod-$(checksum webpack-files.txt)
          - cache restore webpack-cache-prod-$SEMAPHORE_GIT_BRANCH-$(checksum webpack-files.txt),webpack-cache-prod-$SEMAPHORE_GIT_BRANCH,webpack-cache-prod
          - sem-version ruby 3.1.2
          - sem-version node 14.17.3
          - sem-service start postgres --username=postgres --password=postgres
          - sem-service start redis
          - cp config/database.yml.sample config/database.yml
          - cp config/application.yml.sample  config/application.yml
          - node --version
          - gem install bundler -v '2.2.31'
          - bundle install -j $(nproc) --retry 3  --without development --path vendor/bundle
          - cache store bundle-prod-gems-$(checksum Gemfile.lock) vendor/bundle
          - yarn install --pure-lockfile
          - cache store node-modules-prod-$(checksum yarn.lock) node_modules
          - 'bundle exec rake db:create'
          # Retry if it fails first time
          - |
            if [[ ! -d public/packs ]]; then
              (bundle exec rails webpacker:compile || bundle exec rails webpacker:compile) \
              && cache store webpack-compile-prod-$(checksum webpack-files.txt) public/packs \
              && cache store webpack-cache-prod-$SEMAPHORE_GIT_BRANCH-$(checksum webpack-files.txt) tmp/cache/webpacker
            else
              echo "No need to compile assets. Asset fetched from cache."
            fi
          - 'WEBPACKER_PRECOMPILE=false bundle exec rails assets:precompile'
          - git remote add heroku $HEROKU_REMOTE
          - git config --global user.email "shuja@shabandri.com"
          - git config --global user.name "Shuja Shabandri"
          - git add -f public/packs
          - git add -f public/assets
          - git commit -m "ci compiled assets"
          - git push heroku -f $SEMAPHORE_GIT_BRANCH:master
