version: v1.0
name: Lighthouse
agent:
  machine:
    type: e1-standard-4
    os_image: ubuntu1804
execution_time_limit:
  minutes: 25
global_job_config:
  secrets:
    - name: tte-lighthouse
  env_vars:
    - name: RAILS_ENV
      value: test
    - name: REDIS_HOST
      value: localhost
    - name: REDIS_URL
      value: 'redis://localhost:6379/1'
    - name: NODE_OPTIONS
      value: '--max_old_space_size=8192'
    - name: BUNDLER_VERSION
      value: 2.2.31
    - name: PARALLEL_TEST_PROCESSORS
      value: '3'
    - name: WEB_CONCURRENCY
      value: '1'
    - name: RAILS_MAX_THREADS
      value: '5'
    - name: PARALLEL_TEST_FIRST_IS_1
      value: '1'
    - name: COVERALLS_PARALLEL
      value: 'true'
    - name: TZ
      value: Asia/Dubai
  prologue:
    commands:
      - sudo swapoff -a && sudo fallocate -l 3G /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile
      - export SEMAPHORE_BUILD_NUMBER="$SEMAPHORE_WORKFLOW_ID"
      - checkout
      - 'find ./app/frontend ./config/webpack -type f -exec md5sum {} + > webpack-files.txt'
      - 'md5sum *.js *.json yarn.lock .eslintrc >> webpack-files.txt'
      - cache restore bundle--gems-$(checksum Gemfile.lock)
      - cache restore node-modules-$(checksum yarn.lock)
      - cache restore webpack-compile-$(checksum webpack-files.txt)
      - sem-version ruby 3.1.2
      - sem-version node 14.17.3
      - node --version
      - gem install bundler -v '2.2.31'
      - MAKE="make --jobs $(nproc)" bundle install -j $(nproc) --retry 3  --without development --path vendor/bundle
auto_cancel:
  queued:
    when: "true"
  running:
    when: "true"

blocks:
  - name: Setup
    dependencies: []
    task:
      agent:
        machine:
          type: e1-standard-2
          os_image: ubuntu1804
      jobs:
        - name: bundle
          commands:
            - cache store bundle--gems-$(checksum Gemfile.lock) vendor/bundle
        - name: yarn
          commands:
            - yarn install --pure-lockfile
            - cache store node-modules-$(checksum yarn.lock) node_modules
  - name: Linters
    dependencies:
      - Setup
    task:
      agent:
        machine:
          type: e1-standard-2
          os_image: ubuntu1804
      jobs:
        - name: ESlint
          commands:
            - |
              if [[ ! -d public/packs-test ]]; then
                node_modules/eslint/bin/eslint.js --ext .js,.jsx,.ts,.tsx app/frontend --max-warnings=0
              else
                echo "No need to run eslint"
              fi
        - name: TypeScript
          commands:
            - |
              if [[ ! -d public/packs-test ]]; then
                yarn types
              else
                echo "No need to run typescript check"
              fi
        - name: RuboCop
          commands:
            - cache restore rubocop-$(checksum .rubocop.yml)-$SEMAPHORE_GIT_BRANCH-$SEMAPHORE_WORKFLOW_ID,rubocop-$(checksum .rubocop.yml)-$SEMAPHORE_GIT_BRANCH,rubocop-$(checksum .rubocop.yml)
            - bundle exec rubocop --parallel
            - cache store rubocop-$(checksum .rubocop.yml)-$SEMAPHORE_GIT_BRANCH-$SEMAPHORE_WORKFLOW_ID tmp/rubocop_cache
  - name: Webpack
    dependencies:
      - Linters
    task:
      prologue:
        commands:
          - sem-service start postgres 11 --username=postgres --password=postgres
          - sem-service start redis
          - cp config/database.yml.sample config/database.yml
          - cp config/application.yml.sample  config/application.yml
          - 'PARALLEL_TEST_PROCESSORS=1 DISABLE_COVERAGE=1 bundle exec rake parallel:create parallel:load_schema'
      jobs:
        - name: Webpack
          commands:
            - |
              if [[ ! -d public/packs-test ]]; then
                (DISABLE_COVERAGE=1 bundle exec rails webpacker:compile || DISABLE_COVERAGE=1 bundle exec rails webpacker:compile) \
                && cache store webpack-compile-$(checksum webpack-files.txt) public/packs-test
              else
                echo "No need to compile assets. Asset fetched from cache."
              fi
  - name: Tests
    dependencies:
      - Webpack
    task:
      agent:
        machine:
          type: e1-standard-4
          os_image: ubuntu1804
      jobs:
        - name: Jest
          commands:
            - cp config/database.yml.sample config/database.yml
            - bundle exec rake i18n:js:export
            - yarn test:coverage
          execution_time_limit:
            minutes: 10
        - name: RSpec
          commands:
            - sem-service start postgres 11 --username=postgres --password=postgres
            - sem-service start redis
            - cp config/database.yml.sample config/database.yml
            - cp config/application.yml.sample  config/application.yml
            - 'DISABLE_COVERAGE=1 bundle exec rake parallel:create parallel:load_schema'
            - 'WEBPACKER_PRECOMPILE=false DISABLE_COVERAGE=1 bundle exec rails assets:precompile'
            - EAGER_LOAD=1 bundle exec parallel_test spec -t rspec --runtime-log support/parallel_runtime_rspec.log
          execution_time_limit:
            minutes: 15
  - name: Finalise Coverage
    dependencies:
      - Tests
    task:
      agent:
        machine:
          type: e1-standard-2
          os_image: ubuntu1804
      jobs:
        - name: Coveralls Webhook
          commands:
            - curl -k https://coveralls.io/webhook?repo_token=$COVERALLS_REPO_TOKEN -d "payload[build_num]=$SEMAPHORE_BUILD_NUMBER&payload[status]=done"
promotions:
  - name: Deploy to Develop
    pipeline_file: heroku-develop.yml
    auto_promote:
      when: "branch = 'develop'"
  - name: Deploy to Review
    pipeline_file: heroku-review.yml
    auto_promote:
      when: "branch = 'review'"
  - name: Deploy to Staging
    pipeline_file: heroku-staging.yml
    auto_promote:
      when: "branch = 'master' AND result = 'passed'"
