version: v1.0
name: Lighthouse
agent:
  machine:
    type: e1-standard-4
    os_image: ubuntu1804
global_job_config:
  env_vars:
    - name: RAILS_ENV
      value: production
    - name: NODE_ENV
      value: production
    - name: NODE_OPTIONS
      value: '--max-old-space-size=7168'
    - name: BUNDLER_VERSION
      value: 2.1.4
    - name: HEROKU_REMOTE
      value: https://git.heroku.com/tte-lighthouse-staging.git
    - name: DATABASE_URL
      value: "postgres://postgres:postgres@localhost:5432/ci"
    - name: AWS_ACCESS_KEY_ID
      value: 'dummy'
    - name: AWS_REGION
      value: 'dummy'
    - name: AWS_S3_BUCKET
      value: 'dummy'
    - name: AWS_SECRET_ACCESS_KEY
      value: 'dummy'
    - name: REDIS_HOST
      value: localhost
    - name: REDIS_URL
      value: 'redis://localhost:6379/1'
    - name: ASSET_HOST
      value: staging-cdn.tte-lighthouse.com

blocks:
  - name: Deploy
    dependencies: []
    task:
      secrets:
        - name: tte-lighthouse
      jobs:
        - name: Deploy to staging
          commands:
          - checkout --use-cache
          - 'find ./app/frontend -type f -exec md5sum {} + > webpack-files.txt'
          - cache restore bundle-prod-gems-$(checksum Gemfile.lock)
          - cache restore node-modules-prod-$(checksum yarn.lock)
          - cache restore webpack-compile-prod-$(checksum yarn.lock)-$(checksum webpack-files.txt)
          - sem-version ruby 2.5.1
          - sem-version node 12.18.3
          - sem-service start postgres --username=postgres --password=postgres
          - sem-service start redis
          - cp config/database.yml.sample config/database.yml
          - cp config/application.yml.sample  config/application.yml
          - node --version
          - gem install bundler -v '2.1.4'
          - bundle install -j $(nproc) --retry 3  --without development --path vendor/bundle
          - cache store bundle-prod-gems-$(checksum Gemfile.lock) vendor/bundle
          - yarn install --pure-lockfile
          - cache store node-modules-prod-$(checksum yarn.lock) node_modules
          - 'bundle exec rake db:create'
          - 'bundle exec rails assets:precompile'
          - ssh-keyscan -H heroku.com >> ~/.ssh/known_hosts
          - chmod 600 ~/.ssh/id_rsa_semaphore_heroku
          - ssh-add ~/.ssh/id_rsa_semaphore_heroku
          - git config --global url.ssh://git@heroku.com/.insteadOf https://git.heroku.com/
          - git remote add heroku $HEROKU_REMOTE
          - git config --global user.email "shuja@shabandri.com"
          - git config --global user.name "Shuja Shabandri"
          - git add -f public/packs
          - git add -f public/assets
          - git commit -m "ci compiled assets"
          - git push heroku -f $SEMAPHORE_GIT_BRANCH:master
