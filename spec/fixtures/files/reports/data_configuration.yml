sections:
- label: User Details
  data:
  - type: user_data
    key: first_name
    label: First Name
  - type: user_data
    key: last_name
    label: Last Name
- label: Error Detection
  data:
  - type: external_result
    assessmentId: 1
    key: ed.attempted
    label: Attempted
  - type: external_result
    assessmentId: 1
    key: ed.correct
    label: Correct
- label: Thriving Index
  data:
  - type: normed_factor
    assessmentId: 1
    factorId: 1
  - type: formula
    label: Fit Score
    formula:
      op: AVERAGE
      args:
      - type: normed_factor
        assessmentId: 1
        factorId: 1
      - type: normed_factor
        assessmentId: 1
        factorId: 2
      - type: formula
        formula:
          op: MAX
          args:
          - type: normed_factor
            assessmentId: 1
            factorId: 1
          - type: normed_factor
            assessmentId: 1
            factorId: 2
