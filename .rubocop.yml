require:
  - rubocop-performance
AllCops:
  NewCops: enable
  Exclude:
    - "vendor/**/*"
    - "node_modules/**/*"
    - "db/schema.rb"
  UseCache: true
  CacheRootDirectory: "tmp"

Layout/HashAlignment:
  EnforcedLastArgumentHashStyle: ignore_implicit

Layout/DotPosition:
  Enabled: true
  EnforcedStyle: trailing

Metrics/BlockNesting:
  Enabled: false

Metrics/ClassLength:
  Max: 200

Style/DoubleNegation:
  Enabled: false

# supressing Redis-related global var
Style/GlobalVars:
  Exclude:
    - app/commands/users/build_sso_url.rb
    - app/core/hogan/add_reports.rb
    - app/core/users/authenticate_user.rb
    - config/initializers/redis.rb
    - spec/commands/users/build_sso_url_spec.rb

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "lib/tasks/**/*"
    - "config/environments/**/*"
    - "config/routes.rb"
    - "config/initializers/simple_form_bootstrap.rb"

Style/MixinUsage:
  Exclude:
    - "spec/**/*"
    - "bin/**/*"

Layout/CaseIndentation:
  IndentOneStep: true

Style/ClassAndModuleChildren:
  Enabled: false

Style/Documentation:
  Enabled: false

Metrics/AbcSize:
  Enabled: true
  Max: 50

Metrics/CyclomaticComplexity:
  Max: 10

Metrics/PerceivedComplexity:
  Max: 10

Style/FormatString:
  Enabled: false

Naming/AccessorMethodName:
  Enabled: false

Style/GuardClause:
  Enabled: false

Style/AsciiComments:
  Enabled: false

Style/OptionalBooleanParameter:
  Enabled: false

Naming/MethodParameterName:
  AllowedNames:
    - q
    - e
    - id
    - io

# using baby_squeel assumes multi blocks
Style/MultilineBlockChain:
  Enabled: false

Layout/FirstHashElementIndentation:
  EnforcedStyle: consistent

Style/LambdaCall:
  EnforcedStyle: call

Layout/LineLength:
  Max: 120
  IgnoreCopDirectives: true

Style/NonNilCheck:
  IncludeSemanticChanges: true

Metrics/MethodLength:
  Enabled: false

Naming/PredicateName:
  ForbiddenPrefixes:
    - is_

Style/RedundantReturn:
  AllowMultipleReturnValues: true

# That's dangerous to use nil comparison together with baby_squeel dsl
Style/NilComparison:
  Enabled: false

Style/IfUnlessModifier:
  Enabled: false

Layout/FirstArrayElementIndentation:
  Enabled: false

Style/SingleLineBlockParams:
  Enabled: false

Layout/SpaceAroundMethodCallOperator:
  Enabled: true

Style/HashTransformValues:
  Enabled: true

Lint/RaiseException:
  Enabled: true

Lint/StructNewOverride:
  Enabled: true

Lint/MissingSuper:
  Enabled: false

Style/ExponentialNotation:
  Enabled: true

Style/HashEachMethods:
  Enabled: true

Style/HashTransformKeys:
  Enabled: true

# TODO: TEMPORARY! keep this rule or fix in the code
Style/HashSyntax:
  Enabled: false

Performance/CollectionLiteralInLoop:
  Enabled: false
