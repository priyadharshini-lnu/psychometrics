plugins:
  - rubocop-performance
  - rubocop-rails
require:
  - ./lib/custom_rubocops/avoid_direct_use_of_mail_method.rb
  - ./lib/custom_rubocops/avoid_using_memoization_in_serializers.rb
  - ./lib/custom_rubocops/avoid_active_record_in_migrations.rb
  - ./lib/custom_rubocops/create_table_migration_requires_tenant_id.rb
AllCops:
  NewCops: enable
  Exclude:
    - vendor/**/*
    - node_modules/**/*
    - db/schema.rb
    - db/seeds/**/*
    - bin/*
    # Exclude migration files from January to June 2024
    - 'db/migrate/2024[0][0-6][0-3][0-9]*_*.rb'
    # Exclude all migration files from 2010 to 2023
    - 'db/migrate/201[0-9][0-9][0-9][0-9][0-9]*_*.rb'
    - 'db/migrate/202[0-3][0-9][0-9][0-9][0-9]*_*.rb'
    - db/migrate/20240808093057_add_score_calculated_to_user_assessment.rb
    - db/migrate/20240808093057_add_score_calculated_to_user_assessment.rb
    - db/migrate/20240806160845_add_show_watermark_to_campaign_options.rb
    # Exclude existing migrations before rubocop upgrade
    - db/migrate/20241007113728_add_columns_to_dashboard.rb
    - db/migrate/20241126112602_add_logo_alt_text_to_design_settings.rb
    - db/migrate/20250102114258_add_default_language_and_available_languages_to_campaign_reports.rb
    - db/migrate/20250124101641_add_course_start_date_and_course_end_date_to_development_actions.rb
    - db/migrate/20250127090320_add_columns_to_development_actions.rb
    - db/migrate/20250207113529_add_consumer_to_license_usages.rb
    - db/migrate/20250224075920_add_columns_to_saml_setting.rb
    - db/migrate/20250226084133_add_qc_level_settings_to_report_approval_settings.rb
    - db/migrate/20250429125102_add_api_key_fields_to_webhook_subscriptions.rb
    - db/migrate/20250430135151_add_columns_to_user_idp_plan.rb
    - db/migrate/20250504102702_add_prompt_to_assistant.rb
    - db/migrate/20250709100241_remove_action_and_add_type_status_and_dependencies_to_ai_assistants.rb
    - db/migrate/20250804045044_remove_dependencies_columns_from_campaign_ai_artifacts.rb

  UseCache: true
  CacheRootDirectory: tmp

AvoidDirectUseOfMailMethod:
  Include:
    - app/mailers/**/*
AvoidUsingMemoizationInSerializers:
  Include:
    - app/serializers/**/*
AvoidActiveRecordInMigrations:
  Enabled: true

CustomRubocops/CreateTableMigrationRequiresTenantId:
  Enabled: true
  EnforcedFromMigration: '20260408120000'
  Include:
    - db/migrate/**/*

##
## Layout
##
Layout/CaseIndentation:
  IndentOneStep: true

Rails/EnvLocal:
  Enabled: false

Layout/DotPosition:
  EnforcedStyle: trailing

Layout/FirstArrayElementIndentation:
  EnforcedStyle: consistent

Layout/FirstHashElementIndentation:
  EnforcedStyle: consistent

Layout/HashAlignment:
  EnforcedLastArgumentHashStyle: ignore_implicit

Layout/LineLength:
  Max: 120
  IgnoreCopDirectives: true

##
## Lint
##
Lint/MissingSuper:
  Enabled: false

##
## Metrics
##
Metrics/AbcSize:
  Max: 50

Metrics/ModuleLength:
  CountComments: false
  Max: 200
  Enabled: true

Metrics/BlockLength:
  Exclude:
    - spec/**/*
    - lib/tasks/**/*
    - config/environments/**/*
    - config/routes.rb
    - config/initializers/simple_form_bootstrap.rb

Metrics/BlockNesting:
  Enabled: false

Metrics/ClassLength:
  Max: 200
  Exclude:
    - lib/devtools/**/*

Metrics/CyclomaticComplexity:
  Max: 10

Metrics/MethodLength:
  Enabled: false

Metrics/PerceivedComplexity:
  Max: 10

##
## Naming
##
Naming/AccessorMethodName:
  Enabled: false

Naming/MethodParameterName:
  AllowedNames:
    - q
    - e
    - id
    - io

Naming/PredicatePrefix:
  ForbiddenPrefixes:
    - is_
  Exclude:
    - app/serializers/**/*

Naming/PredicateMethod:
  Enabled: false  # Will ignore whether methods end with `?`

##
## Performance
##
Performance/CollectionLiteralInLoop:
  Enabled: false

##
## Style
##
Style/AsciiComments:
  Enabled: false

Style/ClassAndModuleChildren:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/DoubleNegation:
  Enabled: false

Style/FormatString:
  Enabled: false

# supressing Redis-related global var
Style/GlobalVars:
  Exclude:
    - app/models/users/regular.rb
    - app/core/hogan/add_reports.rb
    - app/core/users/authenticate_user.rb
    - config/initializers/redis.rb
    - spec/commands/users/build_sso_url_spec.rb

Style/GuardClause:
  Enabled: false

# TODO: TEMPORARY! keep this rule or fix in the code
Style/HashSyntax:
  Enabled: false

Style/IfUnlessModifier:
  Enabled: false

Style/LambdaCall:
  EnforcedStyle: call

Style/MixinUsage:
  Exclude:
    - spec/**/*
    - bin/**/*

# using baby_squeel assumes multi blocks
Style/MultilineBlockChain:
  Enabled: false

# That's dangerous to use nil comparison together with baby_squeel dsl
Style/NilComparison:
  Enabled: false

Style/NonNilCheck:
  IncludeSemanticChanges: true

Style/OptionalBooleanParameter:
  Enabled: false

Style/RedundantReturn:
  AllowMultipleReturnValues: true

Style/SingleLineBlockParams:
  Enabled: false

##
## Rails
##

# NOTE: some controllers demands other inheritance that AppController
Rails/ApplicationController:
  Enabled: false

# NOTE: new rails cops demands specifying has_many :through instead of :has_and_belongs_to_many
Rails/HasAndBelongsToMany:
  Enabled: false

# NOTE: will be fixed later
# TODO: refactor in additional PR
Rails/HasManyOrHasOneDependent:
  Enabled: false

# NOTE: due to unable to allow specific statuses disabling this cop
# https://github.com/rubocop/rubocop-rails/blob/master/legacy-docs/cops_rails.md#examples-29
Rails/HttpStatus:
  Enabled: false

# NOTE: will be fixed later
# TODO: refactor in additional PR
Rails/InverseOf:
  Enabled: false

# NOTE: skipping rule to explicitly define methods when they're not defined
# Example:
# before_action :some_action, only: [:new]
# def new; end # not defined in class
Rails/LexicallyScopedActionFilter:
  Enabled: false

# NOTE: disabling as we have no option to bypass using :html_safe
Rails/OutputSafety:
  Enabled: false

# NOTE: disabling as in some cases models fail with `ArgumentError: You need to supply at least one validation`
Rails/RedundantPresenceValidationOnBelongsTo:
  Enabled: false

# NOTE: this cop is raised by :update_column, _columns, _all and some other methods where we skip validations
Rails/SkipsModelValidations:
  Enabled: false

# NOTE: disabling as we want to allow boolean columns without null: false constraint
Rails/ThreeStateBooleanColumn:
  Enabled: false

# NOTE: It was decided that the new format is difficult to read and we will stick with manual construction
Rails/WhereRange:
  Enabled: false

# NOTE: It was decided that we will allow longer safe navigation chains
Style/SafeNavigationChainLength:
  Enabled: false

Rails/FindByOrAssignmentMemoization:
  Enabled: false

Rails/Exit:
  Enabled: true
  Exclude:
    - lib/devtools/**/*.rb

Rails/Output:
  Enabled: true
  Exclude:
    - lib/devtools/**/*.rb
